name: orphan-ci

# G-02 KRI assertion across every regulatory-mapping coverage axis
# (CRA, DORA, GDPR, NIS2).
#
# Walks `content/playbooks/` and `content/mappings/<framework>/` and
# fires the G-02 KRI when a finalized playbook either:
#
#   * regresses (had an inbound citation for the framework in the
#     baseline ref and no longer does in the PR head) — immediate
#     hard fail; or
#   * is net-new without any inbound citation and the CACAO
#     finalization marker is older than the 7-day grace window —
#     hard fail.
#
# Runs nightly on `main` and on every PR touching the playbook /
# mapping trees or the orphan-CI plumbing. Per-framework PASS/FAIL
# granularity is preserved via the job matrix — each framework runs
# as its own matrix leg and the matrix is not fail-fast, so one
# framework regressing does not mask the others.
#
# The per-framework KRI emission (``--format kri``) is uploaded as
# an artifact so the dashboard ingest can read it without re-running
# the linter.

on:
  pull_request:
    branches: [main]
    paths:
      - "content/playbooks/**"
      - "content/mappings/cra/**"
      - "content/mappings/dora/**"
      - "content/mappings/gdpr/**"
      - "content/mappings/nis2/**"
      - "content/metrics/**"
      - "tools/lint_playbook_orphans.py"
      - "tools/lint_cra_playbook_orphans.py"
      - "tools/lint_posture_ocsf_bindings.py"
      - "tools/lint_detection_ocsf_bindings.py"
      - "tools/lint_catalogue_ocsf_bindings.py"
      - "tools/lint_sovereignty_lm_endpoint_pairing.py"
      - "tools/lint_determinism_replay_pairing.py"
      - "tools/lint_post_incident_review_ocsf_bindings.py"
      - "tools/lint_regulatory_notification_ocsf_bindings.py"
      - "tools/lint_identity_access_ocsf_bindings.py"
      - "tools/ocsf_cluster_lint.py"
      - "content/telemetry/**"
      - "tests/content/test_cra_playbook_orphans.py"
      - "tests/content/test_dora_playbook_orphans.py"
      - "tests/content/test_gdpr_playbook_orphans.py"
      - "tests/content/test_nis2_playbook_orphans.py"
      - "tests/content/test_posture_ocsf_bindings.py"
      - "tests/content/test_detection_ocsf_bindings.py"
      - "tests/content/test_catalogue_ocsf_bindings.py"
      - "tests/content/test_sovereignty_lm_endpoint_pairing.py"
      - "tests/content/test_determinism_replay_pairing.py"
      - "tests/content/test_post_incident_review_ocsf_bindings.py"
      - "tests/content/test_regulatory_notification_ocsf_bindings.py"
      - "tests/content/test_identity_access_ocsf_bindings.py"
      - ".github/workflows/orphan-ci.yml"
  push:
    branches: [main]
    paths:
      - "content/playbooks/**"
      - "content/mappings/cra/**"
      - "content/mappings/dora/**"
      - "content/mappings/gdpr/**"
      - "content/mappings/nis2/**"
      - "content/metrics/**"
      - "content/telemetry/**"
      - "tools/lint_playbook_orphans.py"
      - "tools/lint_cra_playbook_orphans.py"
      - "tools/lint_posture_ocsf_bindings.py"
      - "tools/lint_detection_ocsf_bindings.py"
      - "tools/lint_catalogue_ocsf_bindings.py"
      - "tools/lint_sovereignty_lm_endpoint_pairing.py"
      - "tools/lint_determinism_replay_pairing.py"
      - "tools/lint_post_incident_review_ocsf_bindings.py"
      - "tools/lint_regulatory_notification_ocsf_bindings.py"
      - "tools/lint_identity_access_ocsf_bindings.py"
      - "tools/ocsf_cluster_lint.py"
  schedule:
    # Nightly at 02:23 UTC — off-peak, off-the-hour, single slot for
    # all four frameworks now that they share one workflow.
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  orphan-ci:
    name: G-02 ${{ matrix.framework }} orphan assertion
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        framework: [cra, dora, gdpr, nis2]
    steps:
      - name: Checkout (full history for baseline diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime deps (PyYAML)
        run: pip install --no-cache-dir pyyaml

      - name: Resolve baseline ref
        id: baseline
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "ref=origin/${{ github.base_ref }}" >> "$GITHUB_OUTPUT"
          else
            # Nightly / push on main: diff against the parent of HEAD so
            # a regression introduced by HEAD is still surfaced.
            echo "ref=HEAD~1" >> "$GITHUB_OUTPUT"
          fi

      - name: Run ${{ matrix.framework }} orphan-CI assertion (text)
        run: |
          python -m tools.lint_playbook_orphans \
            --framework ${{ matrix.framework }} \
            --baseline-ref "${{ steps.baseline.outputs.ref }}" \
            --format text

      - name: Emit G-02 KRI payload
        if: always()
        run: |
          mkdir -p .kri-out
          python -m tools.lint_playbook_orphans \
            --framework ${{ matrix.framework }} \
            --baseline-ref "${{ steps.baseline.outputs.ref }}" \
            --format kri > .kri-out/g-02-${{ matrix.framework }}.json || true
          cat .kri-out/g-02-${{ matrix.framework }}.json

      - name: Upload KRI artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g-02-${{ matrix.framework }}-kri
          path: .kri-out/g-02-${{ matrix.framework }}.json
          if-no-files-found: warn
          retention-days: 30

  posture-ocsf-bindings:
    # G-04 catalogue-maturity OCSF source-data-shape dimension —
    # asserts every metric in the asset/patch posture cluster declares
    # an OCSF telemetry_ref. Wired into the orphan-CI workflow because
    # it shares the same nightly content-CI cadence; runs independently
    # from the per-framework orphan matrix.
    name: G-04 posture-cluster OCSF binding assertion
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime deps (PyYAML)
        run: pip install --no-cache-dir pyyaml

      - name: Run posture-OCSF binding assertion (text)
        run: |
          python -m tools.lint_posture_ocsf_bindings --format text

  detection-ocsf-bindings:
    # G-04 catalogue-maturity OCSF source-data-shape dimension —
    # asserts every metric in the detection-latency (mttd_*) cluster
    # declares an OCSF telemetry_ref. Sibling to posture-ocsf-bindings;
    # rides the same nightly content-CI cadence and runs independently
    # from the per-framework orphan matrix and the posture job.
    name: G-04 detection-latency-cluster OCSF binding assertion
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime deps (PyYAML)
        run: pip install --no-cache-dir pyyaml

      - name: Run detection-OCSF binding assertion (text)
        run: |
          python -m tools.lint_detection_ocsf_bindings --format text

  catalogue-ocsf-bindings:
    # G-04 catalogue-maturity OCSF source-data-shape dimension —
    # catalogue-wide generalisation of the per-cluster posture and
    # detection-latency lints. Asserts that every operator-telemetry
    # (non-composite) metric in content/metrics/ declares at least one
    # telemetry.ocsf.* ref AND that each declared ref resolves to a
    # real shipped class under content/telemetry/. Closes the
    # F-MET-OCSF-CATALOGUE triplet (SKELETON #539, CORE #540) by
    # wiring the linter into the nightly content-CI cadence alongside
    # the per-cluster jobs; runs independently from the per-framework
    # orphan matrix and the posture/detection jobs.
    name: G-04 catalogue-wide OCSF binding assertion
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime deps (PyYAML)
        run: pip install --no-cache-dir pyyaml

      - name: Run catalogue-OCSF binding assertion (text)
        run: |
          python -m tools.lint_catalogue_ocsf_bindings --format text

  sovereignty-lm-endpoint-pairing:
    # G-04 catalogue-maturity sovereignty corner — asserts that every
    # sovereignty-cluster LM-endpoint coverage KPI ships with a paired
    # sovereignty-cluster UNKNOWN-exposure residual-risk KRI at the
    # same version family. Closes the F-MET-SOV triplet (SKELETON
    # #542) by making the residual-risk pairing a nightly invariant
    # so the UNKNOWN-exposure signal cannot silently regress out of
    # the catalogue. Rides the same nightly content-CI cadence as the
    # OCSF cluster jobs; runs independently from the per-framework
    # orphan matrix and the OCSF jobs.
    name: G-04 sovereignty LM-endpoint pairing assertion
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime deps (PyYAML)
        run: pip install --no-cache-dir pyyaml

      - name: Run sovereignty LM-endpoint pairing assertion (text)
        run: |
          python -m tools.lint_sovereignty_lm_endpoint_pairing --format text

  determinism-replay-pairing:
    # G-04 catalogue-maturity determinism corner — asserts that every
    # determinism-cluster replay coverage KPI ships with a paired
    # determinism-cluster replay drift residual-risk KRI at the same
    # version family. Sibling of sovereignty-lm-endpoint-pairing;
    # extends the same residual-risk pairing invariant pattern to the
    # determinism corner so the replay-drift signal cannot silently
    # regress out of the catalogue. Rides the same nightly content-CI
    # cadence; runs independently from the per-framework orphan
    # matrix and the OCSF / sovereignty jobs.
    name: G-04 determinism replay pairing assertion
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime deps (PyYAML)
        run: pip install --no-cache-dir pyyaml

      - name: Run determinism replay pairing assertion (text)
        run: |
          python -m tools.lint_determinism_replay_pairing --format text

  post-incident-review-ocsf-bindings:
    # G-04 catalogue-maturity OCSF source-data-shape dimension —
    # asserts every metric in the post-incident-review cluster
    # declares an OCSF telemetry_ref. Closes the F-MET-OCSF-PIR
    # triplet (SKELETON #545) by wiring the linter into the nightly
    # content-CI cadence alongside the other cluster jobs; runs
    # independently from the per-framework orphan matrix and the
    # sibling OCSF / sovereignty / determinism jobs.
    name: G-04 post-incident-review-cluster OCSF binding assertion
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime deps (PyYAML)
        run: pip install --no-cache-dir pyyaml

      - name: Run post-incident-review-OCSF binding assertion (text)
        run: |
          python -m tools.lint_post_incident_review_ocsf_bindings --format text

  regulatory-notification-ocsf-bindings:
    # G-04 catalogue-maturity OCSF source-data-shape dimension —
    # asserts every metric in the regulatory-notification cluster
    # declares an OCSF telemetry_ref. Closes the
    # F-MET-OCSF-REGNOTIFY triplet (SKELETON #547) by wiring the
    # linter into the nightly content-CI cadence alongside the
    # other cluster jobs; runs independently from the per-framework
    # orphan matrix and the sibling OCSF / sovereignty / determinism
    # / post-incident-review jobs. Secondary: G-02 regulatory-mapping
    # coverage — this is the regulator-facing notification metric
    # family.
    name: G-04 regulatory-notification-cluster OCSF binding assertion
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime deps (PyYAML)
        run: pip install --no-cache-dir pyyaml

      - name: Run regulatory-notification-OCSF binding assertion (text)
        run: |
          python -m tools.lint_regulatory_notification_ocsf_bindings --format text

  identity-access-ocsf-bindings:
    # G-04 catalogue-maturity OCSF source-data-shape dimension —
    # asserts every metric in the identity-&-access cluster
    # (identity_compromise, onboarding_offboarding_tracker) declares
    # an OCSF telemetry_ref. Closes the F-MET-OCSF-IDENTITY triplet
    # (SKELETON #549) by wiring the linter into the nightly content-CI
    # cadence alongside the other cluster jobs; runs independently
    # from the per-framework orphan matrix and the sibling OCSF /
    # sovereignty / determinism / post-incident-review /
    # regulatory-notification jobs. Secondary: G-02 regulatory-mapping
    # coverage — the identity-&-access cluster carries NIS2 Art.21
    # access-control obligations.
    name: G-04 identity-&-access-cluster OCSF binding assertion
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime deps (PyYAML)
        run: pip install --no-cache-dir pyyaml

      - name: Run identity-&-access-OCSF binding assertion (text)
        run: |
          python -m tools.lint_identity_access_ocsf_bindings --format text
