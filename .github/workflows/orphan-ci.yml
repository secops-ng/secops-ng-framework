          print(f"OK: D3FEND↔DORA crosswalk entries = {len(entries)} (≥ {baseline})")
          PY

      - name: Upload D3FEND↔DORA crosswalk artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g-02-d3fend-dora-crosswalk
          path: content/mappings/d3fend/dora.yaml
          if-no-files-found: warn
          retention-days: 30

  d3fend-cra-crosswalk:
    # G-02 regulatory-mapping coverage — D3FEND ↔ CRA crosswalk
    # assertion lane. Sibling of d3fend-gdpr-crosswalk; shape-checks
    # `content/mappings/d3fend/cra.yaml` (CORE crosswalk) on every PR
    # touching the d3fend tree and every night. Two invariants:
    #   * schema-shape tests in
    #     `tests/content/test_d3fend_cra_crosswalk.py` pass — every
    #     `control_refs[*]` resolves to a real `content/controls/*.yaml`
    #     stable_id, and every `regulation_refs[*].entry_id` resolves
    #     to a real entry under `content/mappings/cra/*.yaml`; and
    #   * the crosswalk ships at least 28 entries — the CORE baseline
    #     established by F-MAP-D3FEND-CRA. Any regression below the
    #     baseline hard-fails the job.
    name: G-02 D3FEND↔CRA crosswalk assertion
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime deps (PyYAML, pytest)
        run: pip install --no-cache-dir pyyaml pytest

      - name: Run D3FEND↔CRA crosswalk schema-shape tests
        run: |
          python -m pytest tests/content/test_d3fend_cra_crosswalk.py -q

      - name: Assert D3FEND↔CRA crosswalk entry count ≥ 28 (CORE baseline)
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path

          import yaml

          path = Path("content/mappings/d3fend/cra.yaml")
          if not path.is_file():
              sys.exit(f"FAIL: {path} is missing")

          doc = yaml.safe_load(path.read_text(encoding="utf-8")) or {}
          entries = doc.get("entries") or []
          baseline = 28
          if len(entries) < baseline:
              sys.exit(
                  f"FAIL: D3FEND↔CRA crosswalk entry count {len(entries)} "
                  f"regressed below CORE baseline {baseline}"
              )
          print(f"OK: D3FEND↔CRA crosswalk entries = {len(entries)} (≥ {baseline})")
          PY

      - name: Upload D3FEND↔CRA crosswalk artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g-02-d3fend-cra-crosswalk
          path: content/mappings/d3fend/cra.yaml
          if-no-files-found: warn
          retention-days: 30

  iso27001-oscal-extend:
    # G-06 contributor-adoption — ISO 27001 OSCAL component-definition
    # EXTEND lane. Complements the sibling
    # `iso27001-oscal-component-definition` job (SKELETON+CORE parity)
    # with a round-trip cross-reference check: every OSCAL
    # `implemented-requirement` must point at a real `stable_id` shipped
    # under `content/controls/`, no component may ship zero
    # implemented-requirements, and the IR count may not regress below
    # the CORE baseline (72 as of PR #694). Runs on the same nightly
    # cadence as the sibling lane; on PRs it fires on changes to the
    # ISO 27001 mapping tree, the control catalogue, or the round-trip
    # test module.
    name: G-06 ISO 27001 OSCAL component-definition EXTEND (round-trip)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime deps (PyYAML, pytest)
        run: pip install --no-cache-dir pyyaml pytest

      - name: Run ISO 27001 OSCAL round-trip assertion tests
        run: |
          python -m pytest tests/content/test_oscal_iso27001_component_definition_roundtrip.py -q

      - name: Assert no orphan components in ISO 27001 OSCAL surface
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path("content/mappings/iso27001/oscal-component-definition.json")
          if not path.is_file():
              sys.exit(f"FAIL: {path} is missing")

          doc = json.loads(path.read_text())
          components = doc.get("component-definition", {}).get("components", []) or []
          orphans = []
          for c in components:
              total = 0
              for ci in c.get("control-implementations", []) or []:
                  total += len(ci.get("implemented-requirements", []) or [])
              if total == 0:
                  orphans.append(c.get("title") or c.get("uuid", "<unknown>"))
          if orphans:
              sys.exit(
                  "FAIL: ISO 27001 OSCAL component-definition ships "
                  f"{len(orphans)} orphan component(s) with zero "
                  f"implemented-requirements: {', '.join(orphans)}"
              )
          print(f"OK: {len(components)} component(s), zero orphan(s)")
          PY

      - name: Upload ISO 27001 OSCAL EXTEND artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g-06-iso27001-oscal-extend
          path: content/mappings/iso27001/oscal-component-definition.json
          if-no-files-found: warn
          retention-days: 30
