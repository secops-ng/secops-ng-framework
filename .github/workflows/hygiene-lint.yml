name: hygiene-lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  hygiene-linter:
    name: forward-public hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run hygiene linter
        # The MVP linter is pure-stdlib Python — no install step needed.
        # The fixture directory is excluded because it intentionally
        # contains positive fixtures for the rules under test.
        run: |
          python -m tools.hygiene_linter . \
            --exclude 'tests/hygiene_linter/*' \
            --format text
