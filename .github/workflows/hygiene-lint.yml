name: hygiene-lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  hygiene-linter:
    name: forward-public hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run hygiene linter
        # The MVP linter is pure-stdlib Python — no install step needed.
        # No --exclude here on purpose: the linter's own test corpus is
        # skipped intrinsically, so this is byte-for-byte the command a
        # contributor runs locally. When the exclusion lived only in this
        # workflow, CI was green while the documented local command exited 1
        # on 24 planted fixture values — the two must not diverge again.
        run: |
          python -m tools.hygiene_linter . --format text
