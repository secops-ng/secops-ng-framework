stable_id: kpi.mttd@v1
content_version: 0.1.0
maturity: experimental
kind: kpi
title: Mean time to detect
summary: >
  Time elapsed between the earliest observable evidence of an incident in
  the operator's telemetry stream and the first authoritative detection
  firing that opens an incident record. Measured end-to-end across the
  detection pipeline so that ingestion latency, enrichment latency, and
  rule evaluation latency all contribute. SecOps-NG does not pick a
  detection vendor; the catalog entry is vendor-neutral and the compile
  target is the source of truth for the executable form.

unit: minutes
direction: lower_is_better

target:
  value: 60
  comparator: "<="
  rationale: >
    Community-recommended starting point for the unscoped catalog
    baseline. Severity- and asset-tier-scoped variants (for example
    kpi.mttd_critical@v1) tighten this target and live as separate
    catalog entries.

thresholds:
  - name: warn
    comparator: ">"
    value: 60
    severity: warn
  - name: breach
    comparator: ">"
    value: 240
    severity: high

measurement:
  source: composite
  aggregation: p95
  formula: >
    For each incident closed within the evaluation window, compute
    (first_detection_fire_timestamp - earliest_telemetry_event_timestamp)
    in minutes. Aggregate as p95 across incidents. Exclude incidents
    where the earliest telemetry timestamp is unknown (record-keeping
    gap) so the indicator does not silently improve when ingestion
    breaks.
  inputs:
    - name: earliest_telemetry_event
      description: >
        Earliest event in the telemetry stream that, in hindsight, was
        part of the incident's causal chain. Bound at evaluation time by
        the incident's post-incident review timeline, not at detection
        time.
      telemetry_ref: telemetry.host_process_create@v1
    - name: first_detection_fire
      description: >
        First authoritative detection firing that opened the incident
        record. Catalog entry is detection-vendor-neutral; the compile
        target resolves the concrete detection identifier.
  window:
    duration: P30D
    sliding: true

external_refs:
  # Primary regulatory anchors. Only IDs already named in
  # content/mappings/{nis2,dora}/*.yaml are listed; see those files for
  # the full obligation text and cross-references.
  - name: NIS2 — Article 21(2)(b) incident-handling capability (detect)
    source: EU
    external_id: Directive (EU) 2022/2555, Art. 21(2)(b)
    url: https://eur-lex.europa.eu/eli/dir/2022/2555/oj
  # DORA: no natural primary anchor for the unscoped baseline MTTD —
  # the DORA Art. 19 clocks start at classification-as-major, not at
  # first detection. Severity-scoped variants (e.g. critical) carry
  # the DORA anchor; see mttr.yaml.
  - name: ENISA — Threat Landscape methodology, detection-latency discussion
    source: ENISA
    url: https://www.enisa.europa.eu/publications/enisa-threat-landscape
  - name: ISO/IEC 27004 — Information security measurement guidance
    source: ISO
    external_id: ISO/IEC 27004:2016

maintainer: metrics-wg@secops-ng.org
