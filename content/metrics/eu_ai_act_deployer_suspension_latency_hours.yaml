    source: EU
    external_id: Regulation (EU) 2024/1689, Art. 26(5)
    url: https://eur-lex.europa.eu/eli/reg/2024/1689/oj
  - name: EU AI Act — Article 79(1) AI systems presenting a risk
    source: EU
    external_id: Regulation (EU) 2024/1689, Art. 79(1)
    url: https://eur-lex.europa.eu/eli/reg/2024/1689/oj
  - name: EU AI Act — Article 72 post-market monitoring by providers
    source: EU
    external_id: Regulation (EU) 2024/1689, Art. 72
    url: https://eur-lex.europa.eu/eli/reg/2024/1689/oj
  - name: ISO/IEC 27004 — Information security measurement guidance
    source: ISO
    external_id: ISO/IEC 27004:2016
maintainer: metrics-wg@secops-ng.org
foundation_property:
  - auditability
