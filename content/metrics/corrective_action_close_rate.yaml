stable_id: kpi.corrective_action_close_rate@v1
content_version: 0.1.0
maturity: experimental
kind: kpi
title: Corrective-action close rate
summary: Ratio of post-incident corrective actions closed within the evaluation window
  to total in-scope corrective actions in flight. Rising values indicate that lessons-learned
  convert into durable improvements.
unit: ratio
direction: higher_is_better
measurement:
  source: composite
  aggregation: ratio
  formula: 'Computed from the lower content layers per the inputs below. The catalog
    entry is the contract; the compile target is the source of truth for the executable
    form. Reference visualisation: a ratio-headline gauge over a per-corrective-action
    days-to-close drill-down, sliced by severity band; the committed reference rendering
    lives at `content/metrics/corrective_action_close_rate.viz.md` — that file is the
    contract for the chart shape; the compile target renders the executable form against
    operator data.'
  inputs:
  - name: numerator
    description: >
      Population of corrective actions closed within the evaluation
      window. Carried on the OCSF Incident Finding event the
      post_incident_review corrective-action ledger step emits when a
      ledger entry transitions into the closed state (status_id
      transition into the closed state); the catalog entry binds to that
      OCSF class shape, not to a vendor-specific case-management or
      ticketing object.
    playbook_step: action--40000000-0000-4000-8000-000000000004
    telemetry_ref: telemetry.ocsf.incident_finding@v1
    field: time
  - name: denominator
    description: >
      Reference population of corrective-action ledger entries in scope
      during the evaluation window (open at any point in the window, or
      transitioned out of the open state during the window). Carried on
      the OCSF Incident Finding event the post_incident_review
      corrective-action ledger step emits at ledger-entry open
      (status_id transition into the open state), regardless of whether
      the entry has since closed.
    playbook_step: action--40000000-0000-4000-8000-000000000004
    telemetry_ref: telemetry.ocsf.incident_finding@v1
    field: start_time
  window:
    duration: P30D
    sliding: true
telemetry_refs:
- telemetry.ocsf.incident_finding@v1
playbook_refs:
- playbook_id: playbook.post_incident_review@v1
  step_id: action--40000000-0000-4000-8000-000000000004
external_refs:
- name: NIS2 — Article 21(2)(b) incident-handling capability
  source: EU
  external_id: Directive (EU) 2022/2555, Art. 21(2)(b)
  url: https://eur-lex.europa.eu/eli/dir/2022/2555/oj
- name: NIS2 — Article 21(2)(f) effectiveness assessment of measures
  source: EU
  external_id: Directive (EU) 2022/2555, Art. 21(2)(f)
  url: https://eur-lex.europa.eu/eli/dir/2022/2555/oj
- name: ENISA — Threat Landscape methodology
  source: ENISA
  url: https://www.enisa.europa.eu/publications/enisa-threat-landscape
- name: ISO/IEC 27004 — Information security measurement guidance
  source: ISO
  external_id: ISO/IEC 27004:2016
maintainer: metrics-wg@secops-ng.org
