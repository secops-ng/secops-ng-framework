stable_id: kpi.mttr_on_call_ack@v1
content_version: 0.1.0
maturity: experimental
kind: kpi
title: Mean time to respond — on-call acknowledgement
summary: Time elapsed between the first authoritative detection firing and the first
  recorded response action in the playbook, scoped to page events, measuring time
  to first human acknowledgement by the on-call responder. Measured end-to-end across
  the response pipeline so that triage latency, analyst handoffs, and orchestration
  step latency all contribute. SecOps-NG does not pick a response vendor; the catalog
  entry is vendor-neutral and the compile target is the source of truth for the executable
  form.
unit: minutes
direction: lower_is_better
measurement:
  source: workflow
  aggregation: p95
  formula: 'For each incident in scope closed within the evaluation window, compute
    (first_response_action_timestamp - first_detection_fire_timestamp) in minutes
    and aggregate as p95. Exclude incidents where the scoped response step never fired
    so the indicator does not silently improve when the response pipeline stalls.
    Reference visualisation: a horizontal bar chart of remediation_latency_minutes
    per closed in-scope incident in the window at the on-call acknowledgement step
    with the p95 aggregate annotated as the headline figure; this scoped variant
    inherits the threshold-band shape from kpi.mttr_critical@v1 and operators
    almost always set much tighter ack-specific values (often single-digit minutes)
    in their own scoped overrides. The committed reference rendering lives at
    `content/metrics/mttr_on_call_ack.viz.md` — that file is the contract for the
    chart shape; the compile target renders the executable form against operator
    data.'
  inputs:
  - name: first_detection_fire
    description: First authoritative detection firing that opened the incident record
      at the scoped class — the firing the page event downstream is triggered off.
      Carried on the OCSF Detection Finding meta-finding the detection_engineering
      measure-rule-version step emits and that SIEM rule matches downstream emit at
      runtime; the catalog entry binds to that OCSF class shape, not to a
      vendor-specific rule object.
    telemetry_ref: telemetry.ocsf.detection_finding@v1
    field: finding_info.uid
  - name: first_response_action
    description: First playbook step transition whose purpose matches the scoped response
      class (acknowledge). Bound to the canonical step of the compiled response playbook.
      The acknowledgement-endpoint timestamp is carried on the OCSF Incident Finding
      the incident_management playbook emits when the incident record transitions
      out of the page-pending status into an acknowledged status (the on-call
      responder has accepted the page); the catalog entry binds to that OCSF class
      shape, not to a vendor-specific on-call/paging-product object — the operator's
      page-product webhook delivery into incident_management is the surface that
      drives the status transition. The `incident.status_id` transition on that
      class is the evaluation anchor; the playbook_step pins which transition counts
      as the acknowledgement in the compiled response playbook.
    playbook_step: acknowledge
    telemetry_ref: telemetry.ocsf.incident_finding@v1
    field: incident.status_id
  window:
    duration: P30D
    sliding: true
telemetry_refs:
- telemetry.ocsf.detection_finding@v1
- telemetry.ocsf.incident_finding@v1
playbook_refs:
- playbook_id: playbook.on_call_rotation@v1
  step_id: action--30000000-0000-4000-8000-000000000003
external_refs:
