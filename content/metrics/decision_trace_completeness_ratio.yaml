stable_id: kpi.decision_trace_completeness_ratio@v1
content_version: 0.1.0
maturity: experimental
kind: kpi
title: Decision-trace completeness ratio across playbook branch outcomes
summary: 'Ratio of playbook branch outcomes on the evaluation window whose
  emitted audit record carries a complete decision trace — the branch
  condition evaluated, the input values consulted, and the resolved
  outcome — over the total count of branch outcomes the workflow layer
  executed. FOUNDATION auditability (docs/FOUNDATION.md §1) requires
  that an auditor can reconstruct *why* a workflow took the branch it
  took, not only *that* it did; this KPI tracks whether the compile
  target is emitting the "why" alongside the "that", or whether the
  trail is missing the causal spine.

  '
unit: ratio
direction: higher_is_better
target:
  value: 1.0
  comparator: ==
  rationale: 'Every branch outcome the workflow layer executes should
    emit a complete decision trace — condition, inputs consulted,
    resolved outcome. Anything under 1.0 is a silent gap in the causal
    reconstructability of the trail and an auditability floor breach.

    '
thresholds:
- name: warn
  comparator: <
  value: 1.0
  severity: warn
- name: breach
  comparator: <
  value: 0.95
  severity: high
measurement:
  source: composite
  aggregation: ratio
  formula: 'Over the evaluation window, count playbook branch outcomes
    executed by the workflow layer whose audit record carries a
    non-empty decision trace — the branch condition as evaluated, the
    input values consulted, and the resolved outcome (numerator).
    Divide by the total count of branch outcomes the workflow layer
    executed in the same window (denominator). The match key is the
    playbook step_id plus the transition timestamp; a per-branch ribbon
    chart of complete (1) vs incomplete (0) traces is the canonical
    operator-facing rendering.

    The committed reference visualisation lives at ``content/metrics/decision_trace_completeness_ratio.viz.md``
    — that file is the contract for the chart shape; the compile target
    renders the executable form at evaluation time.

    '
  inputs:
  - name: executed_branch_outcome
    description: 'A single playbook branch outcome executed by the
      workflow layer in the evaluation window, identified by playbook
      step_id plus the transition timestamp.

      '
    field: activity_id
    telemetry_ref: telemetry.ocsf.api_activity@v1
  - name: decision_trace_predicate
    description: 'Predicate that classifies a single branch outcome
      as complete (audit record carries condition, inputs consulted,
      and resolved outcome) or incomplete (any of the three missing).

      '
  window:
    duration: P7D
    sliding: false
telemetry_refs:
  - telemetry.ocsf.api_activity@v1
external_refs:
- name: SecOps-NG FOUNDATION §1 — Auditability
  source: SecOps-NG
  url: https://github.com/secops-ng/secops-ng-framework/blob/main/docs/FOUNDATION.md
- name: NIS2 — Article 21(2)(j) cybersecurity risk-management measures
  source: EU
  external_id: Directive (EU) 2022/2555, Art. 21(2)(j)
  url: https://eur-lex.europa.eu/eli/dir/2022/2555/oj
- name: DORA — Article 10 detection of ICT-related incidents
  source: EU
  external_id: Regulation (EU) 2022/2554, Art. 10
  url: https://eur-lex.europa.eu/eli/reg/2022/2554/oj
- name: OCSF — API Activity (class 6003)
  source: OCSF
  url: https://schema.ocsf.io/1.1.0/classes/api_activity
maintainer: metrics-wg@secops-ng.org
foundation_property:
- auditability
