stable_id: kpi.phishing_sim_click_rate@v1
content_version: 0.1.0
maturity: experimental
kind: kpi
title: Phishing-simulation click rate
summary: Ratio of phishing-simulation recipients who clicked the simulated lure to
  total in-scope recipients in the evaluation window. The catalog entry is vendor-neutral;
  the compile target binds the concrete simulation platform.
unit: ratio
direction: lower_is_better
measurement:
  source: composite
  aggregation: ratio
  formula: 'Computed from the lower content layers per the inputs below. The catalog
    entry is the contract; the compile target is the source of truth for the executable
    form. Reference visualisation: a ratio-headline gauge over a per-campaign click-rate
    drill-down, sliced by recipient cohort; the committed reference rendering lives
    at `content/metrics/phishing_sim_click_rate.viz.md` — that file is the contract
    for the chart shape; the compile target renders the executable form against operator
    data.'
  inputs:
  - name: numerator
    description: >
      Count of phishing-simulation recipients who clicked the simulated
      lure inside the evaluation window. Carried on the OCSF Email URL
      Activity event the phishing_triage credential-harvest response
      step consumes when it identifies clickers from URL-Activity
      telemetry against the sanctioned-simulation source; the catalog
      entry binds to that OCSF class shape, not to a vendor-specific
      simulation platform.
    playbook_step: action--c0a17a01-0000-4000-8000-000000000009
    telemetry_ref: telemetry.ocsf.email_url_activity@v1
    field: actor.user.uid
  - name: denominator
    description: >
      Count of phishing-simulation recipients in scope for the
      evaluated campaign cohort. Sourced from the operator's
      simulation-roster scoping artifact (the cohort the campaign was
      sent to) rather than the telemetry stream — the catalog entry
      does not name a specific simulation product. Excluding the
      denominator from a telemetry binding keeps the indicator stable
      against URL-Activity ingestion gaps in the same surface that
      produces the numerator, matching the detection_coverage and
      coverage-cluster convention.
  window:
    duration: P30D
    sliding: true
telemetry_refs:
- telemetry.ocsf.email_url_activity@v1
playbook_refs:
- playbook_id: playbook.phishing_triage@v1
  step_id: action--c0a17a01-0000-4000-8000-000000000009
external_refs:
- name: NIS2 — Article 21(2)(b) incident-handling capability
  source: EU
  external_id: Directive (EU) 2022/2555, Art. 21(2)(b)
  url: https://eur-lex.europa.eu/eli/dir/2022/2555/oj
- name: ENISA — Threat Landscape methodology
  source: ENISA
  url: https://www.enisa.europa.eu/publications/enisa-threat-landscape
- name: ISO/IEC 27004 — Information security measurement guidance
  source: ISO
  external_id: ISO/IEC 27004:2016
maintainer: metrics-wg@secops-ng.org
foundation_property:
  - operability
