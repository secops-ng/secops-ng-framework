stable_id: kri.corrective_action_overdue@v1
content_version: 0.1.0
maturity: experimental
kind: kri
title: Corrective-action overdue rate
summary: Ratio of post-incident corrective actions past their committed due-date to
  total in-scope corrective actions tracked in the evaluation window. Rising values
  indicate that lessons-learned are not converting into durable improvements.
unit: ratio
direction: lower_is_better
measurement:
  source: composite
  aggregation: ratio
  formula: 'Computed from the lower content layers per the inputs below. The catalog
    entry is the contract; the compile target is the source of truth for the executable
    form. Reference visualisation: a ratio-headline gauge over a per-corrective-action
    due-date-margin drill-down sliced by severity band, with a zero-line overdue overlay
    on the drill-down; the committed reference rendering lives at
    `content/metrics/corrective_action_overdue.viz.md` — that file is the contract for
    the chart shape; the compile target renders the executable form against operator
    data.'
  inputs:
  - name: numerator
    description: >
      Population of corrective-action ledger entries whose committed
      due-date has elapsed and whose closed-state transition has not yet
      been recorded by the end of the evaluation window. Carried on the
      OCSF Incident Finding event the post_incident_review
      corrective-action ledger step emits at ledger-entry open (status_id
      transition into the open state, with the committed due-date carried
      on the same event); the catalog entry binds to that OCSF class
      shape, not to a vendor-specific case-management or ticketing
      object. A ledger entry is counted as overdue when the open-state
      event's due-date is earlier than `evaluation_now` and no
      closed-state transition has been observed for the same ledger
      entry.
    playbook_step: action--40000000-0000-4000-8000-000000000004
    telemetry_ref: telemetry.ocsf.incident_finding@v1
    field: start_time
  - name: denominator
    description: >
      Reference population of corrective-action ledger entries tracked
      in the evaluation window (open at any point in the window).
      Carried on the OCSF Incident Finding event the
      post_incident_review corrective-action ledger step emits at
      ledger-entry open (status_id transition into the open state),
      regardless of whether the entry has since closed or overrun.
    playbook_step: action--40000000-0000-4000-8000-000000000004
    telemetry_ref: telemetry.ocsf.incident_finding@v1
    field: start_time
  window:
    duration: P30D
    sliding: true
telemetry_refs:
- telemetry.ocsf.incident_finding@v1
playbook_refs:
- playbook_id: playbook.post_incident_review@v1
  step_id: action--40000000-0000-4000-8000-000000000004
