stable_id: kri.corrective_action_overdue@v1
content_version: 0.1.0
maturity: experimental
kind: kri
title: Corrective-action overdue rate
summary: Ratio of post-incident corrective actions past their committed due-date to
  total in-scope corrective actions tracked in the evaluation window. Rising values
  indicate that lessons-learned are not converting into durable improvements.
unit: ratio
direction: lower_is_better
measurement:
  source: composite
  aggregation: ratio
  formula: 'Computed from the lower content layers per the inputs below. The catalog
    entry is the contract; the compile target is the source of truth for the executable
    form. Reference visualisation: a ratio-headline gauge over a per-corrective-action
    due-date-margin drill-down sliced by severity band, with a zero-line overdue overlay
    on the drill-down; the committed reference rendering lives at
    `content/metrics/corrective_action_overdue.viz.md` — that file is the contract for
    the chart shape; the compile target renders the executable form against operator
    data.'
  inputs:
  - name: numerator
    description: Population that contributes to the risk reading (e.g. recurring findings,
      missed notifications, breaches).
  - name: denominator
    description: Reference population the numerator is normalised against. Omit for
      raw-count KRIs.
  window:
    duration: P30D
    sliding: true
playbook_refs:
- playbook_id: playbook.post_incident_review@v1
  step_id: action--40000000-0000-4000-8000-000000000004
external_refs:
- name: NIS2 — Article 21(2)(b) incident-handling capability
  source: EU
  external_id: Directive (EU) 2022/2555, Art. 21(2)(b)
  url: https://eur-lex.europa.eu/eli/dir/2022/2555/oj
- name: NIS2 — Article 21(2)(f) effectiveness assessment of measures
  source: EU
  external_id: Directive (EU) 2022/2555, Art. 21(2)(f)
  url: https://eur-lex.europa.eu/eli/dir/2022/2555/oj
- name: ENISA — Threat Landscape methodology
  source: ENISA
  url: https://www.enisa.europa.eu/publications/enisa-threat-landscape
- name: ISO/IEC 27004 — Information security measurement guidance
  source: ISO
  external_id: ISO/IEC 27004:2016
maintainer: metrics-wg@secops-ng.org
