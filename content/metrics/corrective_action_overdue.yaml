  url: https://eur-lex.europa.eu/eli/dir/2022/2555/oj
- name: NIS2 — Article 21(2)(f) effectiveness assessment of measures
  source: EU
  external_id: Directive (EU) 2022/2555, Art. 21(2)(f)
  url: https://eur-lex.europa.eu/eli/dir/2022/2555/oj
- name: ENISA — Threat Landscape methodology
  source: ENISA
  url: https://www.enisa.europa.eu/publications/enisa-threat-landscape
- name: ISO/IEC 27004 — Information security measurement guidance
  source: ISO
