    source: EU
    external_id: Directive (EU) 2022/2555, Art. 21(2)(e)
    url: https://eur-lex.europa.eu/eli/dir/2022/2555/oj
  - name: DORA — Article 9 protection and prevention (maintenance / patch rollout)
    source: EU
    external_id: Regulation (EU) 2022/2554, Art. 9
    url: https://eur-lex.europa.eu/eli/reg/2022/2554/oj
  - name: CRA — Annex I §2 (security updates rollout)
    source: EU
    external_id: Regulation (EU) 2024/2847, Annex I §2
    url: https://eur-lex.europa.eu/eli/reg/2024/2847/oj
  - name: NIST SP 800-53 Rev. 5 — SI-2(2) Flaw Remediation | Automated Flaw Remediation Status
    source: NIST
    external_id: NIST SP 800-53 Rev. 5 SI-2(2)
    url: https://csrc.nist.gov/projects/risk-management/sp800-53-controls/release-search#!/control?version=5.1&number=SI-2
  - name: ENISA — Good practices on the patch-management lifecycle
    source: ENISA
    url: https://www.enisa.europa.eu/topics/risk-management

maintainer: metrics-wg@secops-ng.org

foundation_property:
  - auditability
  - operability
