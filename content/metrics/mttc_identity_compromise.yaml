stable_id: kpi.mttc_identity_compromise@v1
content_version: 0.1.0
maturity: experimental
kind: kpi
title: Mean time to contain — identity compromise
summary: Time elapsed between the first authoritative detection firing of a compromised
  identity and the first recorded containment action (credential revocation, session
  termination, MFA reset, role removal). Measured end-to-end across the response pipeline.
  SecOps-NG does not pick an IAM vendor; the catalog entry is vendor-neutral and the
  compile target is the source of truth for the executable form.
unit: minutes
direction: lower_is_better
measurement:
  source: workflow
  aggregation: p95
  formula: 'For each identity_compromise incident closed within the evaluation window,
    compute (first_containment_action_timestamp - first_detection_fire_timestamp)
    in minutes and aggregate as p95. Exclude incidents where containment never fired.
    Reference visualisation: a horizontal bar chart of containment_latency_minutes
    per closed identity-compromise incident in the window with the p95 aggregate
    annotated as the headline figure; this scoped variant inherits the
    threshold-band shape from the unscoped containment-baseline
    kpi.mttr_containment@v1 (which in turn inherits from kpi.mttr_critical@v1),
    and operators with NIS2 Art. 21(2)(b) incident-handling and Art. 21(2)(e)
    access-control obligations typically tighten identity-specific numeric values
    in their own scoped overrides. The committed reference rendering lives at
    `content/metrics/mttc_identity_compromise.viz.md` — that file is the contract
    for the chart shape; the compile target renders the executable form against
    operator data.'
  inputs:
  - name: first_detection_fire
    description: >
      First authoritative detection firing of identity compromise.
      Carried on the OCSF Detection Finding the identity_compromise
      triage step consumes as the originating identity-protection
      signal (impossible-travel, password-spray, MFA-bypass,
      suspicious OAuth grant) — the playbook's mappings.yaml
      commits the triage step to Detection Finding (class_uid 2004)
      as the upstream causal observation. The catalog entry binds to
      that OCSF class shape, not to a vendor-specific identity-
      protection or SIEM rule object.
    playbook_step: action--30000000-0000-4000-8000-000000000002
    telemetry_ref: telemetry.ocsf.detection_finding@v1
    field: time
  - name: first_containment_action
    description: >
      First playbook step transition that revokes credentials, terminates
      sessions, resets MFA, or removes role bindings. Carried on the
      OCSF Account Change event the identity_compromise MFA-reset and
      session-revocation steps emit — the playbook's mappings.yaml
      commits those steps to Account Change (class_uid 3001) so each
      containment action on the principal (factor revocation, session
      invalidation, OAuth-grant withdrawal, conditional-access
      exception removal) lands as an Account Change record. The
      catalog entry binds to that OCSF class shape, not to a vendor-
      specific IdP, SaaS, or PAM product.
    playbook_step: action--30000000-0000-4000-8000-000000000004
    telemetry_ref: telemetry.ocsf.account_change@v1
    field: time
  window:
    duration: P30D
    sliding: true
telemetry_refs:
- telemetry.ocsf.detection_finding@v1
- telemetry.ocsf.account_change@v1
playbook_refs:
- playbook_id: playbook.identity_compromise@v1
  step_id: action--30000000-0000-4000-8000-000000000004
- playbook_id: playbook.identity_compromise@v1
  step_id: action--30000000-0000-4000-8000-000000000005
