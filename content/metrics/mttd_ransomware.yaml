stable_id: kpi.mttd_ransomware@v1
content_version: 0.1.0
maturity: experimental
kind: kpi
title: Mean time to detect — ransomware
summary: Time elapsed between the earliest observable evidence in the operator's telemetry
  stream and the first authoritative detection firing that opens an incident record,
  scoped to incidents whose root cause is ransomware or destructive-encryption activity.
  Measured end-to-end across the detection pipeline so that ingestion, enrichment,
  and rule-evaluation latency all contribute. SecOps-NG does not pick a detection
  vendor; the catalog entry is vendor-neutral and the compile target is the source
  of truth for the executable form.
unit: minutes
direction: lower_is_better
measurement:
  source: composite
  aggregation: p95
  formula: 'For each incident in scope closed within the evaluation window, compute
    (first_detection_fire_timestamp - earliest_telemetry_event_timestamp) in minutes
    and aggregate as p95. Exclude incidents where the earliest telemetry timestamp
    is unknown so the indicator does not silently improve when ingestion breaks.
    Reference visualisation: a horizontal bar chart of detection_latency_minutes per
    closed ransomware-rooted incident in the window with the p95 aggregate annotated
    as the headline figure; this scoped variant inherits the threshold-band shape
    from kpi.mttd@v1 and operators with NIS2 Art. 23 / DORA Art. 19(4)(a) obligations
    typically tighten ransomware-specific numeric values in their own scoped overrides.
    The committed reference rendering lives at `content/metrics/mttd_ransomware.viz.md`
    — that file is the contract for the chart shape; the compile target renders the
    executable form against operator data.'
  inputs:
  - name: earliest_telemetry_event
    description: >
      Earliest event in the telemetry stream that, in hindsight, was
      part of the incident's causal chain. OCSF File System Activity
      (class_uid 1001) — the earliest file-write / encrypt-write
      observation that, in hindsight, is the causal-chain origin for a
      ransomware-rooted incident.
    telemetry_ref: telemetry.ocsf.file_activity@v1
    field: time
  - name: first_detection_fire
    description: >
      First authoritative detection firing that opened the incident
      record. Carried on the OCSF Detection Finding meta-finding the
      detection_engineering measure-rule-version step emits and that
      SIEM rule matches downstream emit at runtime; the catalog entry
      binds to that OCSF class shape, not to a vendor-specific rule
      object. Catalog entry is detection-vendor-neutral.
    telemetry_ref: telemetry.ocsf.detection_finding@v1
    field: finding_info.uid
  window:
    duration: P30D
    sliding: true
telemetry_refs:
- telemetry.ocsf.detection_finding@v1
- telemetry.ocsf.file_activity@v1
playbook_refs:
- playbook_id: playbook.ransomware_containment@v1
  step_id: action--30000000-0000-4000-8000-000000000002
