stable_id: kpi.restore_drill_cadence@v1
content_version: 0.1.0
maturity: experimental
kind: kpi
title: Restore-drill cadence — share of in-scope backup scopes that received a completed restore drill within the operator's documented drill cadence
summary: >
  Performance indicator derived from the backup_recovery playbook
  evidence stream. For every in-scope backup scope declared in the
  operator's backup-scope catalogue, the indicator asks whether at
  least one non-destructive restore drill was executed against the
  documented isolated drill target within the operator's documented
  drill-cadence window. Falling values indicate the tested-restore-drill
  discipline NIS2 Art. 21(2)(c), DORA Art. 12, and CRA Annex I §1(h)
  reviewers surface against the business-continuity / backup-management
  obligation is losing coverage.
unit: ratio
direction: higher_is_better
target:
  value: 0.95
  comparator: ">="
  rationale: >
    Community-recommended starting point. A well-disciplined
    business-continuity practice completes at least one non-destructive
    restore drill against every in-scope backup scope within its
    documented cadence window; the residual 5% allows for scopes newly
    added within the window whose first drill has not yet matured.
    Operators under scoped programmes set higher targets with documented
    rationale in their scoped variants.
thresholds:
  - name: warn
    comparator: "<"
    value: 0.95
    severity: warn
  - name: breach
    comparator: "<"
    value: 0.80
    severity: high
measurement:
  source: workflow
  aggregation: ratio
  formula: >
    For each in-scope backup scope declared in the operator's
    backup-scope catalogue, count the scope as covered if at least one
    backup_recovery execution completed the execute-restore-drill step
    (action--50000000-0000-4000-8000-000000000005) with a non-empty
    `__drill_result__` inside the operator's documented drill-cadence
    window and emitted a matching attestation via evidence-capture
    (action--50000000-0000-4000-8000-000000000006). The cadence rate is
    `covered_scopes / total_in_scope` over the evaluation window.
    Scopes whose integrity-check short-circuited the drill (failure
    attestation with an empty `__drill_result__`) count against the
    numerator: they contribute to the denominator without contributing
    to the numerator, so the indicator does not silently improve on
    unrecovered scopes. Reference visualisation: a ratio-headline
    gauge with warn / breach band overlays over a per-scope
    covered / uncovered drill-down; the committed reference rendering
    lives at `content/metrics/restore_drill_cadence.viz.md` — that
    file is the contract for the chart shape; the compile target
    renders the executable form against operator data.
  inputs:
    - name: covered_scopes
      description: >
        Count of in-scope backup scopes whose backup_recovery
        execute-restore-drill step landed a non-empty `__drill_result__`
        inside the operator's documented drill-cadence window and
        emitted a matching attestation on the evidence-capture step.
        Carried on the OCSF API Activity event the
        backup_recovery execute-restore-drill step emits at drill
        execution against the documented isolated drill target: the
        write call against the isolated drill target carries the
        __drill_result__ identifier and the observed RTO / RPO
        measurements. The catalog entry binds to that OCSF class shape,
        not to a vendor-specific backup, snapshot, or storage product.
      playbook_ref: playbook.backup_recovery@v1
      playbook_step: action--50000000-0000-4000-8000-000000000005
      field: time
      telemetry_ref: telemetry.ocsf.api_activity@v1
    - name: total_in_scope
      description: >
        Count of in-scope backup scopes declared in the operator's
        backup-scope catalogue. Sourced from the operator's scoping
        artifact rather than the telemetry stream so the denominator is
        stable against drill-pipeline gaps in the backup surface
        itself, matching the coverage_on_call_schedule and
        detection_coverage conventions.
      playbook_ref: playbook.backup_recovery@v1
  window:
    duration: P90D
    sliding: true
telemetry_refs:
  - telemetry.ocsf.api_activity@v1
playbook_refs:
  - playbook_id: playbook.backup_recovery@v1
    step_id: action--50000000-0000-4000-8000-000000000005
  - playbook_id: playbook.backup_recovery@v1
    step_id: action--50000000-0000-4000-8000-000000000006
external_refs:
