    url: https://eur-lex.europa.eu/eli/reg/2022/2554/oj
  - name: CRA — Annex I §1(h) availability of essential and basic functions
    source: EU
    external_id: Regulation (EU) 2024/2847, Annex I §1(h)
    url: https://eur-lex.europa.eu/eli/reg/2024/2847/oj
  - name: NIST SP 800-53 Rev. 5 — CP-10 System Recovery and Reconstitution
    source: NIST
    external_id: NIST SP 800-53 Rev. 5 CP-10
    url: https://csrc.nist.gov/projects/risk-management/sp800-53-controls/release-search#!/control?version=5.1&number=CP-10
  - name: ENISA — Good practices for business continuity and disaster recovery
    source: ENISA
    url: https://www.enisa.europa.eu/topics/risk-management
maintainer: metrics-wg@secops-ng.org
foundation_property:
