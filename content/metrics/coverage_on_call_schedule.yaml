stable_id: kpi.coverage_on_call_schedule@v1
content_version: 0.1.0
maturity: experimental
kind: kpi
title: On-call schedule coverage
summary: Ratio of in-scope on-call hours that have at least one named primary responder
  assigned to total in-scope on-call hours. Schedule surface is vendor-neutral; the
  compile target binds the concrete paging tool.
unit: ratio
direction: higher_is_better
target:
  value: 0.95
  comparator: '>='
  rationale: Community-recommended starting point for a coverage indicator. Operators
    tighten or loosen this target in their compile target configuration.
thresholds:
- name: warn
  comparator: <
  value: 0.95
  severity: warn
- name: breach
  comparator: <
  value: 0.8
  severity: high
measurement:
  source: composite
  aggregation: ratio
  formula: >
    Ratio of in-scope on-call rotation hours with at least one named
    primary responder assigned to total in-scope rotation hours,
    evaluated over a rolling window. Exclude rotation hours whose
    in-scope state is unknown so the indicator does not silently improve
    on record-keeping gaps.
    Reference visualisation: a per-rotation stacked horizontal bar chart
    partitioned by coverage state (covered / uncovered), with the
    overall `covered_population / total_population` ratio annotated as
    the headline figure and the warn / breach thresholds overlaid on a
    companion ratio axis; the chart is the canonical operator-facing
    surface for this KPI and the compile target is the source of truth
    for the executable form. The committed reference rendering lives at
    `content/metrics/coverage_on_call_schedule.viz.md` — that file is
    the contract for the chart shape; the compile target renders the
    executable form against operator data.
  inputs:
  - name: covered_population
    description: Count of in-scope entries currently under the named control surface.
  - name: total_population
    description: Count of in-scope entries the operator believes should be under the
      named control surface.
  window:
    duration: P30D
    sliding: true
playbook_refs:
- playbook_id: playbook.on_call_rotation@v1
  step_id: action--30000000-0000-4000-8000-000000000002
external_refs:
- name: NIS2 — Article 21(2)(b) incident-handling capability
  source: EU
  external_id: Directive (EU) 2022/2555, Art. 21(2)(b)
  url: https://eur-lex.europa.eu/eli/dir/2022/2555/oj
- name: ENISA — Threat Landscape methodology
  source: ENISA
  url: https://www.enisa.europa.eu/publications/enisa-threat-landscape
- name: ISO/IEC 27004 — Information security measurement guidance
  source: ISO
  external_id: ISO/IEC 27004:2016
maintainer: metrics-wg@secops-ng.org
