stable_id: kri.vuln_critical_open_age_p99@v1
content_version: 0.1.0
maturity: experimental
kind: kri
title: Open critical vulnerability age (P99 days) — long-tail variant
summary: >
  Long-tail residual-exposure indicator on the age in days of open
  CRITICAL-severity vulnerability findings in the operator's inventory,
  reported at the P99 of the still-open population at evaluation
  instant. Companion to `kri.unpatched_critical_cve_age_days@v1` (which
  reads the same population at the P95): the P95 headline reads the
  bulk-of-population age at the shoulder of the ageing distribution;
  this indicator reads the far tail — the small residual of findings
  that no SLA-compliance ratio and no P95 headline surface, and that
  are the population most likely to sit forgotten past the operator's
  disclosure-and-handling window. Operationalises the maintenance limb
  of NIS2 Art. 21(2)(e) on the extreme-tail edge of the
  vulnerability_management playbook, and cross-anchors DORA JC RTS
  Art. 10 for financial entities carrying regulator-declared
  per-severity remediation SLAs. Lower is better.

unit: days
direction: lower_is_better

target:
  value: 14
  comparator: "<="
  rationale: >
    Community-recommended starting point for the unscoped baseline.
    Where the P95 target (7 days) reads the shoulder of the ageing
    distribution against the critical-severity SLA window, the P99
    target sits at 2× that window — the community bar is that even
    the far tail of open CRITICAL findings should stay inside two
    SLA windows at steady state. Essential entities with
    regulator-declared per-severity remediation SLAs (financial
    entities under DORA JC RTS Art. 10, operators of essential
    services with sector-specific vulnerability-handling obligations)
    set stricter scoped variants of this KRI in their own catalogues.

thresholds:
  - name: warn
    comparator: ">"
    value: 14
    severity: warn
  - name: high
    comparator: ">"
    value: 30
    severity: high
  - name: breach
    comparator: ">"
    value: 60
    severity: critical

measurement:
  source: workflow
  aggregation: p99
  formula: >
    Let U be the set of CRITICAL-severity vulnerability findings in
    the operator's inventory that are still open at the evaluation
    instant — findings whose triage-severity step recorded
    __severity_band__ = 'critical' (or the deterministic
    'unclassified' sentinel, which is scheduled under the critical
    SLA per the primitive contract so it does not silently disappear
    from the population), and whose verify-remediation step has not
    emitted a dated closure evidence record (neither verified-closed
    on the fix path nor accepted-risk on the deterministic
    risk-acceptance path). For each finding f in U compute
    age_days(f) = evaluation_instant - triage_timestamp(f),
    in whole days. Report
    p99_age_days = P99 of { age_days(f) : f in U } over the
    evaluation window; if |U| < 100 the P99 is not well-defined and
    the indicator emits the deterministic sentinel value
    reported_as = max(age_days) with a small-population marker on
    the evidence artifact so downstream consumers do not read the
    P99 as if it were the tail of a large population. The still-open
    predicate is evaluated at the evaluation instant and not
    per-observation, so an ageing finding that closes mid-window is
    excluded from U as of the next evaluation. Findings whose triage
    carries the deterministic 'unclassified' sentinel are included
    per the primitive contract so silent triage drift does not
    hide critical exposure. Reference visualisation: a P99-headline
    number sitting alongside the P50 / P95 percentile stack with
    warn / high / breach threshold-band overlays over an age-histogram
    drill-down of the still-open critical population binned by
    day-band; the committed reference rendering lives at
    `content/metrics/vuln_critical_open_age_p99.viz.md` — that file
    is the contract for the chart shape; the compile target renders
    the executable form against operator data.
  inputs:
    - name: triage_timestamp
      description: >
        Triage-observation timestamp emitted by the triage-severity
        step at finding intake. Carried on the OCSF Vulnerability
        Finding (2002) observation the triage step emits; the catalog
        entry binds against the playbook step start-timestamp, not
        against a vendor-specific vulnerability-scanner object.
      telemetry_ref: telemetry.ocsf.vulnerability_finding@v1
      playbook_ref: playbook.vulnerability_management@v1
      playbook_step: action--e2a4c010-0000-4000-8000-000000000003
      field: time
    - name: severity_band
      description: >
        Classified severity band the triage-severity step emits. The
        indicator population U includes findings with severity_band ∈
        {critical, unclassified}; the unclassified sentinel is
        scheduled under the critical SLA per the primitive contract
        so silent triage drift does not hide critical exposure.
      playbook_ref: playbook.vulnerability_management@v1
      playbook_step: action--e2a4c010-0000-4000-8000-000000000003
    - name: remediation_close
      description: >
        Remediation-close timestamp emitted by the verify-remediation
        step at closure (verified-closed on the fix path or
        accepted-risk on the deterministic risk-acceptance path).
        Absence of a dated closure evidence record on a finding is
        the still-open predicate that qualifies membership in U.
      telemetry_ref: telemetry.ocsf.vulnerability_finding@v1
      playbook_ref: playbook.vulnerability_management@v1
      playbook_step: action--e2a4c010-0000-4000-8000-000000000005
      field: time
  window:
    duration: P30D
    sliding: true

telemetry_refs:
  - telemetry.ocsf.vulnerability_finding@v1

playbook_refs:
  - playbook_id: playbook.vulnerability_management@v1
    step_id: action--e2a4c010-0000-4000-8000-000000000003
  - playbook_id: playbook.vulnerability_management@v1
    step_id: action--e2a4c010-0000-4000-8000-000000000005
  - playbook_id: playbook.vulnerability_management@v1
    step_id: action--e2a4c010-0000-4000-8000-000000000006

