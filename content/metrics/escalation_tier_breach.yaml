stable_id: kri.escalation_tier_breach@v1
content_version: 0.1.0
maturity: experimental
kind: kri
title: Escalation-tier breach rate
summary: Ratio of incidents whose response escalated past the planned tier ceiling
  (for example, tier-2 incidents requiring tier-3 or executive engagement) to total
  in-scope incidents in the evaluation window. Rising values indicate that lower-tier
  capability is under-resourced or that classification is mis-calibrated.
unit: ratio
direction: lower_is_better
measurement:
  source: composite
  aggregation: ratio
  formula: >
    Computed from the lower content layers per the inputs below. The
    catalog entry is the contract; the compile target is the source of
    truth for the executable form. Reference visualisation: a horizontal
    bar chart of tier_delta (actual-engaged tier minus planned tier
    ceiling) per closed incident in the evaluation window, sliced by
    incident severity, with a vertical line at zero marking the planned
    tier ceiling and the ratio aggregate annotated as the headline
    figure; the chart is the canonical operator-facing surface for this
    KRI. The committed reference rendering lives at
    `content/metrics/escalation_tier_breach.viz.md` — that file is the
    contract for the chart shape; the compile target renders the
    executable form against operator data.
  inputs:
  - name: numerator
    description: >
      Population of incidents in the evaluation window whose engaged
      escalation tier exceeded the planned tier ceiling carried on the
      bound chain for the responsible shift. Joined against the OCSF
      Account Change event the on_call_rotation bind-escalation-tiers
      step emits each shift carrying the bound primary / secondary /
      manager chain — an incident counts toward the numerator when its
      engagement record references a responder whose tier index in the
      bound chain is past the planned ceiling for that shift. Carried
      on the OCSF Account Change class because the bound chain is the
      durable record of which managed-account tiers are in scope for
      paging on the evaluated shift window, and the actor.user.uid of
      the engaged responder is the join key. The catalog entry binds
      to that OCSF class shape, not to a vendor-specific paging or
      ticketing product.
    playbook_step: action--30000000-0000-4000-8000-000000000003
    telemetry_ref: telemetry.ocsf.account_change@v1
    field: actor.user.uid
  - name: denominator
    description: >
      Reference population of in-scope incidents in the evaluation
      window keyed against the bound-chain records the on_call_rotation
      bind-escalation-tiers step emits one-per-shift. Carried on the
      OCSF Account Change event the same step emits at chain binding;
      the join from incident -> responsible shift -> bound chain
      yields exactly one bound-chain reference per in-scope incident
      in the window, regardless of whether the engaged tier later
      exceeded the planned ceiling.
    playbook_step: action--30000000-0000-4000-8000-000000000003
    telemetry_ref: telemetry.ocsf.account_change@v1
    field: actor.user.uid
  window:
    duration: P30D
    sliding: true
telemetry_refs:
- telemetry.ocsf.account_change@v1
playbook_refs:
- playbook_id: playbook.on_call_rotation@v1
  step_id: action--30000000-0000-4000-8000-000000000003
external_refs:
- name: NIS2 — Article 21(2)(b) incident-handling capability
  source: EU
  external_id: Directive (EU) 2022/2555, Art. 21(2)(b)
  url: https://eur-lex.europa.eu/eli/dir/2022/2555/oj
- name: ENISA — Threat Landscape methodology
  source: ENISA
  url: https://www.enisa.europa.eu/publications/enisa-threat-landscape
- name: ISO/IEC 27004 — Information security measurement guidance
  source: ISO
  external_id: ISO/IEC 27004:2016
maintainer: metrics-wg@secops-ng.org
foundation_property:
