stable_id: kri.phishing_suppression_rate@v1
content_version: 0.1.0
maturity: experimental
kind: kri
title: Phishing-detection suppression rate
summary: Ratio of phishing detections suppressed (auto-closed, tuned out, marked benign
  without analyst review) to total phishing detections fired in the evaluation window.
  Rising values indicate detection fatigue or over-aggressive tuning that may hide
  active campaigns.
unit: ratio
direction: lower_is_better
measurement:
  source: composite
  aggregation: ratio
  formula: 'Computed from the lower content layers per the inputs below. The catalog
    entry is the contract; the compile target is the source of truth for the executable
    form. Reference visualisation: a ratio-headline gauge over a per-rule
    suppression-rate drill-down, sliced by rule family; the committed reference rendering
    lives at `content/metrics/phishing_suppression_rate.viz.md` — that file is the
    contract for the chart shape; the compile target renders the executable form against
    operator data.'
  inputs:
  - name: numerator
    description: >
      Count of phishing detections suppressed (auto-closed, tuned out,
      marked benign without analyst review) in the evaluation window.
      Carried on the OCSF Email Activity event the phishing_triage
      suppress-and-close step consumes when it correlates an already-
      seen case fingerprint or known-benign sender and closes the
      report without paging; the catalog entry binds to that OCSF
      class shape, not to a vendor-specific case-management or email-
      security product.
    playbook_step: action--c0a17a01-0000-4000-8000-000000000005
    telemetry_ref: telemetry.ocsf.email_activity@v1
    field: email.uid
  - name: denominator
    description: >
      Count of phishing detections fired in the evaluation window — the
      full population of reported-message records ingested by the
      phishing_triage ingest step, regardless of triage outcome. Carried
      on the same OCSF Email Activity class the playbook consumes at
      ingest. Volume-sourced from the telemetry stream rather than an
      operator scoping artifact because, unlike the coverage cluster,
      the catalog entry's "detections fired" semantics IS the
      telemetry-consumption view; an ingestion gap on this surface
      collapses both numerator and denominator together, leaving the
      ratio well-defined.
    playbook_step: action--c0a17a01-0000-4000-8000-000000000002
    telemetry_ref: telemetry.ocsf.email_activity@v1
    field: email.uid
  window:
    duration: P30D
    sliding: true
telemetry_refs:
- telemetry.ocsf.email_activity@v1
playbook_refs:
- playbook_id: playbook.phishing_triage@v1
  step_id: action--c0a17a01-0000-4000-8000-000000000005
external_refs:
- name: NIS2 — Article 21(2)(b) incident-handling capability
  source: EU
  external_id: Directive (EU) 2022/2555, Art. 21(2)(b)
  url: https://eur-lex.europa.eu/eli/dir/2022/2555/oj
- name: ENISA — Threat Landscape methodology
  source: ENISA
  url: https://www.enisa.europa.eu/publications/enisa-threat-landscape
- name: ISO/IEC 27004 — Information security measurement guidance
  source: ISO
  external_id: ISO/IEC 27004:2016
maintainer: metrics-wg@secops-ng.org
