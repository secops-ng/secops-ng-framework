stable_id: kpi.rto_compliance_rate@v1
content_version: 0.1.0
maturity: experimental
kind: kpi
title: RTO compliance rate — proportion of incidents whose observed recovery time met the declared RTO objective
summary: >
  Proportion of incidents in the evaluation window for which the
  measured recovery time was at-or-below the operator's declared
  recovery-time objective (RTO) for the affected service. Anchors
  the disaster-recovery limb of NIS2 Art. 21(1)(c) (backup
  management, disaster recovery, crisis management) and DORA
  Art. 11(2)(b) (recovery objectives and levels for ICT services).
  The 95% target is an operational benchmark — neither NIS2 nor
  DORA sets a statutory RTO-compliance ratio; the figure reflects
  the community reading of "recovery objectives that are met most
  of the time" a continuity policy is expected to demonstrate.
  Flagged clearly here so downstream consumers do not read the 95%
  figure as a statutory ceiling. Complements the sibling
  `kri.restore_drill_rto_overrun@v1` (drill-side residual risk) and
  the four-regime latency ring by reading how the operator's
  continuity posture actually landed against its declared
  objectives in production incidents. No non-EU default endpoints
  participate in the RTO-observation chain — the incident-timeline
  surface is an EU-hostable endpoint per the sovereign-stack bias.
unit: percent
direction: higher_is_better
target:
  value: 95
  comparator: ">="
  rationale: >
    Operational benchmark aligned with NIS2 Art. 21(1)(c) disaster-
    recovery obligation and DORA Art. 11(2)(b) recovery-objective
    scoping. Not a statutory hard floor; operators MAY tighten this
    for essential-service and financial-sector ICT tiers. Below-
    target readings are the leading signal that declared RTO
    objectives are not being met in production incidents even when
    restore drills (the sibling KRI) look clean.
thresholds:
  - name: warn
    comparator: "<"
    value: 98
    severity: warn
  - name: high
    comparator: "<"
    value: 95
    severity: high
  - name: breach
    comparator: "<"
    value: 90
    severity: critical
measurement:
  source: workflow
  aggregation: percent
  formula: >
    For each incident closed in the evaluation window that carried
    a declared RTO objective for the affected service, compute
    rto_met = 1 if observed_recovery_time <= declared_rto_objective
    else 0. The KPI value is
    100 * sum(rto_met) / count(incidents_with_declared_rto). Aggregate
    as `percent` across incidents. Exclude incidents that closed
    without a declared RTO objective on the affected service so the
    reading does not silently improve when the operator's
    continuity register is incomplete; those cases surface on
    `kpi.service_continuity_test_frequency@v1` and the operator's
    continuity-register-coverage KRIs instead.
    Reference visualisation: a headline percentage gauge with warn
    / high / breach threshold bands, plus a per-incident drill-down
    ranking incidents by observed_recovery_time against
    declared_rto_objective across the window. The committed
    reference rendering lives at
    `content/metrics/rto_compliance_rate.viz.md` — that file is
    the contract for the chart shape; the compile target renders
    the executable form against operator data.
  inputs:
    - name: observed_recovery_time
      description: >
        Elapsed time between incident-onset timestamp on the
        affected service and the service-restored timestamp on the
        incident-handling timeline, in the same unit as the
        declared RTO objective. Carried on the OCSF Compliance
        Finding event the incident-recovery step emits at
        restoration (status_id transition into the recovered
        state); the catalog entry binds to that OCSF class shape,
        not to a vendor-specific incident-management, SOAR, or
        continuity-register product.
      telemetry_ref: telemetry.ocsf.compliance_finding@v1
      field: duration
    - name: declared_rto_objective
      description: >
        RTO objective declared by the operator on the affected
        service's continuity register, in the same unit as the
        observed_recovery_time. Carried on the OCSF Compliance
        Finding event the incident-recovery step emits at
        restoration as a reference field alongside the observed
        recovery time.
      telemetry_ref: telemetry.ocsf.compliance_finding@v1
      field: metadata.correlation_uid
  window:
    duration: P90D
    sliding: true
telemetry_refs:
  - telemetry.ocsf.compliance_finding@v1
external_refs:
  - name: NIS2 — Article 21(1)(c) backup management, disaster recovery, crisis management
    source: EU
    external_id: Directive (EU) 2022/2555, Art. 21(1)(c)
    url: https://eur-lex.europa.eu/eli/dir/2022/2555/oj
  - name: DORA — Article 11(2)(b) recovery objectives and levels for ICT services
    source: EU
    external_id: Regulation (EU) 2022/2554, Art. 11(2)(b)
    url: https://eur-lex.europa.eu/eli/reg/2022/2554/oj
  - name: NIST SP 800-53 Rev. 5 — CP-10 System Recovery and Reconstitution
    source: NIST
    external_id: NIST SP 800-53 Rev. 5 CP-10
    url: https://csrc.nist.gov/projects/risk-management/sp800-53-controls/release-search#!/control?version=5.1&number=CP-10
  - name: ISO/IEC 27004 — Information security measurement guidance
    source: ISO
    external_id: ISO/IEC 27004:2016
maintainer: metrics-wg@secops-ng.org
foundation_property:
  - operability
  - auditability
