stable_id: kpi.same_target_replay_determinism_rate@v1
content_version: 0.1.0
maturity: experimental
kind: kpi
title: Same-target deterministic-replay pass rate across worked examples
summary: >
  Ratio of same-target deterministic-replay assertions that pass on the
  evaluation commit. Each replay assertion under
  ``tests/examples/<workflow>/test_replay.py`` (and the per-workflow
  ``tests/examples/test_<workflow>_replay.py`` siblings) re-drives the
  emitter-shaped traversal for a worked example twice in fresh
  ``contextvars`` contexts, under a fixed clock and a
  deterministic-stub LM adapter, and asserts the audit-trail envelope
  is byte-identical across the two runs for each reference compile
  target (n8n / temporal / langgraph). A pass is the offline /
  air-gapped replay guarantee an auditor relies on when re-driving a
  captured payload through a worked example; a fail means the project
  shipped a same-target non-determinism. The KPI complements
  ``kpi.compiler_byte_parity_pass_rate@v1`` (cross-emitter parity of
  committed reference artifacts) by pinning the orthogonal
  same-target-twice replay axis.
unit: ratio
direction: higher_is_better
target:
  value: 1.0
  comparator: "=="
  rationale: >
    Same-target replay-byte-parity is the offline-replay floor of
    FOUNDATION §2 (Determinism). Per the ``test_replay.py`` docstring
    contract, two independent runs of the same emitter-shaped
    traversal under a fixed clock and a deterministic-stub LM adapter
    MUST produce byte-identical audit-trail envelopes; anything less
    than 1.0 means an auditor re-driving a captured payload cannot
    verify what the operator saw.
thresholds:
  - name: warn
    comparator: "<"
    value: 1.0
    severity: warn
  - name: breach
    comparator: "<"
    value: 0.95
    severity: high
measurement:
  source: composite
  aggregation: ratio
  formula: >
    For each (workflow, target) pair exercised by the same-target
    replay test files
    ``tests/examples/vuln_intake/test_replay.py``,
    ``tests/examples/test_alert_triage_replay.py``, and
    ``tests/examples/test_incident_management_replay.py`` on the
    evaluation commit, record one observation per assertion in the
    file: 1 if the assertion passes (the audit-trail envelope bytes
    from the two independent runs are equal, the envelope is
    non-empty and well-formed, and a perturbed input correctly
    breaks parity), 0 if any assertion in the (workflow, target)
    cell is red. Aggregate as ratio across observations across the
    three worked examples × three reference compile targets. The
    per-(workflow, target) cells are the canonical surface; per-target
    sub-ratios are a drill-down dimension. Reference visualisation:
    a horizontal bar chart of per-(workflow, target) replay-assertion
    outcomes (1 = same-target replay holds, 0 = drift) sliced by
    compile target, with a horizontal line at the pass-floor of 1 and
    the ratio aggregate annotated as the headline figure; the chart
    is the canonical operator-facing surface for this KPI. The
    committed reference rendering lives at
    ``content/metrics/same_target_replay_determinism_rate.viz.md`` —
    that file is the contract for the chart shape; the compile target
    renders the executable form against the replay-test suite at
    evaluation time.
  inputs:
    - name: same_target_replay_envelope_bytes_assertion
      description: >
        Same-target replay-byte-parity assertion. The test
        re-runs the emitter-shaped traversal for one worked example
        twice in fresh ``contextvars`` contexts under a fixed clock
        and a deterministic-stub LM adapter, and asserts the
        audit-trail envelope bytes are equal across the two runs for
        each of the three reference compile targets. The test files
        live at
        ``tests/examples/vuln_intake/test_replay.py``,
        ``tests/examples/test_alert_triage_replay.py``, and
        ``tests/examples/test_incident_management_replay.py``.
        Bound here to the vuln_intake worked example as the
        F-WF-01 EXTEND-tests-replay seed; the catalogue entry covers
        every same-target replay assertion the suite exercises.
      playbook_ref: playbook.vuln_intake@v1
    - name: same_target_replay_envelope_nonempty_assertion
      description: >
        Companion assertion in the same-target replay suite that the
        envelope produced by the emitter-shaped traversal is
        non-empty and well-formed — a precondition for the
        byte-equality assertion to be meaningful. Bound here to the
        phishing_triage worked example (a shipped sibling of the
        alert_triage F-WF-03 EXTEND-tests-replay surface).
      playbook_ref: playbook.phishing_triage@v1
    - name: same_target_perturbed_input_breaks_replay_assertion
      description: >
        Companion assertion in the same-target replay suite that a
        perturbed input correctly breaks parity — guarding against
        a degenerate replay implementation that would pass the
        byte-equality assertion vacuously by ignoring the input.
        Bound here to the incident_management worked example which
        carries the F-WF-05 EXTEND-tests-replay siblings.
      playbook_ref: playbook.incident_management@v1
  window:
    duration: P1D
    sliding: false
playbook_refs:
  - playbook_id: playbook.vuln_intake@v1
  - playbook_id: playbook.phishing_triage@v1
  - playbook_id: playbook.incident_management@v1
