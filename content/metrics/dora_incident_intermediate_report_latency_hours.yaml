stable_id: kri.dora_incident_intermediate_report_latency_hours@v1
content_version: 0.1.0
maturity: experimental
kind: kri
title: DORA major-incident intermediate-report (72h) dispatch latency
summary: >
  Elapsed hours between dispatch of the DORA Art. 19(4)(a) initial
  notification and dispatch of the DORA Art. 19(4)(b) intermediate
  notification to the operator's competent authority. Residual-risk
  counterpart to any future
  `kpi.dora_intermediate_report_on_time@v1`: the on-time KPI reads
  whether the clock was held; this KRI reads *how close to the wall*
  each intermediate-report dispatch landed, so operators can see
  slippage well before the ratio itself falls below 1.00. The 72-hour
  bound is set by DORA Art. 19(4)(b) (intermediate notification within
  72 hours of the initial notification); any observation above the
  bound is a statutory overrun and a reportable compliance exception.
unit: hours
direction: lower_is_better
target:
  value: 72
  comparator: "<="
  rationale: >
    DORA Art. 19(4)(b) sets a 72-hour intermediate-notification
    deadline anchored on the moment the operator dispatched the
    Art. 19(4)(a) initial notification. The target is the statutory
    bound; any dispatch beyond it is an overrun the operator must
    record for the competent authority with reasons for the delay.
thresholds:
  - name: warn
    comparator: ">"
    value: 48
    severity: warn
  - name: high
    comparator: ">"
    value: 60
    severity: high
  - name: breach
    comparator: ">"
    value: 72
    severity: critical
measurement:
  source: workflow
  aggregation: max
  formula: >
    For each DORA Art. 19(4)(b) intermediate-notification dispatched
    within the evaluation window, compute
    latency_hours = (dispatch_timestamp - initial_dispatch_timestamp) / 3600.
    Aggregate as `max` across dispatches — the worst-case latency the
    operator's regulator-notification pipeline delivered in the
    window, i.e. the case that came closest to (or beyond) the
    72-hour statutory bound. Exclude in-scope cases whose intermediate-
    notification dispatch step never fired so the indicator does not
    silently improve when the notification pipeline stalls outright;
    those cases surface on `kri.regulator_notification_overrun@v1`
    instead.
    Reference visualisation: a horizontal bar chart of
    dispatch_latency_hours per DORA Art. 19(4)(b) intermediate-
    notification dispatched in the window, with vertical lines at the
    warn / high / breach thresholds (48h / 60h / 72h) and the max
    aggregate annotated as the headline figure; direction is
    `lower_is_better` so a rising max is the leading signal that the
    operator's intermediate-notification pipeline is approaching the
    statutory wall. The committed reference rendering lives at
    `content/metrics/dora_incident_intermediate_report_latency_hours.viz.md`
    — that file is the contract for the chart shape; the compile
    target renders the executable form against operator data.
  inputs:
    - name: initial_dispatch_timestamp
      description: >
        Timestamp at which the operator's regulator-notification chain
        dispatched the DORA Art. 19(4)(a) initial notification. Used
        as the start of the 72-hour intermediate-report clock. Carried
        on the OCSF Compliance Finding event the intermediate-
        notification submission emits (status_id transition into the
        notified state); the catalog entry binds to that OCSF class
        shape, not to a regulator-submission envelope.
      telemetry_ref: telemetry.ocsf.compliance_finding@v1
      field: start_time
    - name: notification_dispatch
      description: >
        Regulator-notification chain step transition that dispatches
        the DORA Art. 19(4)(b) intermediate notification to the
        operator's competent authority. Carried on the OCSF Compliance
        Finding event the intermediate-notification submission emits
        at dispatch (status_id transition into the notified state).
      telemetry_ref: telemetry.ocsf.compliance_finding@v1
      field: time
  window:
    duration: P30D
    sliding: true
telemetry_refs:
  - telemetry.ocsf.compliance_finding@v1
external_refs:
  - name: DORA — Article 17 ICT-related incident management process
    source: EU
    external_id: Regulation (EU) 2022/2554, Art. 17
    url: https://eur-lex.europa.eu/eli/reg/2022/2554/oj
  - name: DORA — Article 19(4)(b) intermediate-notification obligation (72 hours after initial notification)
    source: EU
    external_id: Regulation (EU) 2022/2554, Art. 19(4)(b)
    url: https://eur-lex.europa.eu/eli/reg/2022/2554/oj
  - name: ESAs — Regulatory Technical Standards on DORA major-incident classification and reporting
    source: ESAs
    url: https://www.eiopa.europa.eu/browse/regulation-and-policy/digital-operational-resilience-act-dora_en
  - name: ISO/IEC 27004 — Information security measurement guidance
    source: ISO
    external_id: ISO/IEC 27004:2016
maintainer: metrics-wg@secops-ng.org
foundation_property:
  - auditability
