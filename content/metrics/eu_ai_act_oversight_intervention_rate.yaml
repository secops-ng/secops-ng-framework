    url: https://eur-lex.europa.eu/eli/reg/2024/1689/oj
  - name: EU AI Act — Article 14(1) human oversight of high-risk AI systems
    source: EU
    external_id: Regulation (EU) 2024/1689, Art. 14(1)
    url: https://eur-lex.europa.eu/eli/reg/2024/1689/oj
  - name: EU AI Act — Article 26(2) deployer assignment of human oversight
    source: EU
    external_id: Regulation (EU) 2024/1689, Art. 26(2)
    url: https://eur-lex.europa.eu/eli/reg/2024/1689/oj
  - name: ISO/IEC 27004 — Information security measurement guidance
    source: ISO
    external_id: ISO/IEC 27004:2016
maintainer: metrics-wg@secops-ng.org
foundation_property:
  - auditability
