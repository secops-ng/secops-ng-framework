    url: https://eur-lex.europa.eu/eli/reg/2022/2554/oj
  - name: NIST SP 800-53 Rev. 5 — CP-9(1) System Backup | Testing for Reliability and Integrity
    source: NIST
    external_id: NIST SP 800-53 Rev. 5 CP-9(1)
    url: https://csrc.nist.gov/projects/risk-management/sp800-53-controls/release-search#!/control?version=5.1&number=CP-9
  - name: MITRE D3FEND — D3-FH File Hashing
    source: MITRE
    url: https://d3fend.mitre.org/technique/d3f:FileHashing/
  - name: ISO/IEC 27004 — Information security measurement guidance
    source: ISO
    external_id: ISO/IEC 27004:2016

maintainer: metrics-wg@secops-ng.org
foundation_property:
