stable_id: kpi.timeline_completeness@v1
content_version: 0.1.0
maturity: experimental
kind: kpi
title: Incident-timeline completeness
summary: Ratio of incidents whose post-incident timeline carries all mandatory milestones
  (first observation, detection, triage, containment, eradication, recovery, closeout)
  to total incidents closed in the evaluation window. Rising values indicate durable
  record-keeping.
unit: ratio
direction: higher_is_better
measurement:
  source: composite
  aggregation: ratio
  formula: >
    Computed from the lower content layers per the inputs below. The
    catalog entry is the contract; the compile target is the source of
    truth for the executable form. Reference visualisation: a horizontal
    bar chart of milestones_present per closed incident in the
    evaluation window, sliced by incident severity, with a horizontal
    line at the completeness floor of 7 marking the all-milestones
    predicate and the ratio aggregate annotated as the headline figure;
    the chart is the canonical operator-facing surface for this KPI.
    The committed reference rendering lives at
    `content/metrics/timeline_completeness.viz.md` — that file is the
    contract for the chart shape; the compile target renders the
    executable form against operator data.
  inputs:
  - name: numerator
    description: >
      Population of incidents closed within the evaluation window
      whose post-incident timeline carries all mandatory milestones
      (first observation, detection, triage, containment, eradication,
      recovery, closeout). Carried on the OCSF Incident Finding event
      the post_incident_review timeline-collation step emits when it
      stamps the collated milestone set onto the incident record at
      review-artefact registration — the playbook's mappings.yaml
      commits the timeline-collation step to Incident Finding
      (class_uid 2005), with the incident timeline composed from the
      incident.* extensions on the same event family. An incident
      counts toward the numerator when its closeout-time Incident
      Finding event carries the full mandatory-milestone set on the
      collated record (no missing milestone in incident.events or the
      equivalent attached milestone list). The catalog entry binds to
      that OCSF class shape, not to a vendor-specific case-management,
      ticketing, or document-management product.
    playbook_step: action--40000000-0000-4000-8000-000000000002
    telemetry_ref: telemetry.ocsf.incident_finding@v1
    field: time
  - name: denominator
    description: >
      Reference population of in-scope incidents closed during the
      evaluation window. Carried on the OCSF Incident Finding event
      operator playbooks emit at incident closeout (status_id
      transition into the closed state) — the same OCSF class as the
      numerator anchors the denominator on the closeout transition
      that fires the post-incident-review timeline-collation step,
      regardless of whether the collated timeline turned out complete
      or partial.
    playbook_step: action--40000000-0000-4000-8000-000000000002
    telemetry_ref: telemetry.ocsf.incident_finding@v1
    field: start_time
  window:
    duration: P30D
    sliding: true
telemetry_refs:
- telemetry.ocsf.incident_finding@v1
playbook_refs:
- playbook_id: playbook.post_incident_review@v1
  step_id: action--40000000-0000-4000-8000-000000000002
