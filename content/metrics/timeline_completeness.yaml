stable_id: kpi.timeline_completeness@v1
content_version: 0.1.0
maturity: experimental
kind: kpi
title: Incident-timeline completeness
summary: Ratio of incidents whose post-incident timeline carries all mandatory milestones
  (first observation, detection, triage, containment, eradication, recovery, closeout)
  to total incidents closed in the evaluation window. Rising values indicate durable
  record-keeping.
unit: ratio
direction: higher_is_better
measurement:
  source: composite
  aggregation: ratio
  formula: >
    Computed from the lower content layers per the inputs below. The
    catalog entry is the contract; the compile target is the source of
    truth for the executable form. Reference visualisation: a horizontal
    bar chart of milestones_present per closed incident in the
    evaluation window, sliced by incident severity, with a horizontal
    line at the completeness floor of 7 marking the all-milestones
    predicate and the ratio aggregate annotated as the headline figure;
    the chart is the canonical operator-facing surface for this KPI.
    The committed reference rendering lives at
    `content/metrics/timeline_completeness.viz.md` — that file is the
    contract for the chart shape; the compile target renders the
    executable form against operator data.
  inputs:
  - name: numerator
    description: Population matching the indicator's success (or, for lower-is-better,
      failure) condition.
  - name: denominator
    description: Reference population the numerator is normalised against.
  window:
    duration: P30D
    sliding: true
playbook_refs:
- playbook_id: playbook.post_incident_review@v1
  step_id: action--40000000-0000-4000-8000-000000000002
external_refs:
- name: NIS2 — Article 21(2)(b) incident-handling capability
  source: EU
  external_id: Directive (EU) 2022/2555, Art. 21(2)(b)
  url: https://eur-lex.europa.eu/eli/dir/2022/2555/oj
- name: NIS2 — Article 23 incident reporting timelines
  source: EU
  external_id: Directive (EU) 2022/2555, Art. 23
  url: https://eur-lex.europa.eu/eli/dir/2022/2555/oj
- name: ENISA — Threat Landscape methodology
  source: ENISA
  url: https://www.enisa.europa.eu/publications/enisa-threat-landscape
- name: ISO/IEC 27004 — Information security measurement guidance
  source: ISO
  external_id: ISO/IEC 27004:2016
maintainer: metrics-wg@secops-ng.org
