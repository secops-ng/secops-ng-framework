stable_id: kpi.replay_parity_rate@v1
content_version: 0.1.0
maturity: experimental
kind: kpi
title: Test-replay byte-parity rate across the three reference compile targets
summary: >
  Ratio of test-replay executions on the evaluation window that produce
  byte-identical compiled artifacts across all three reference compile
  targets (n8n, Temporal, LangGraph). A pass means an operator re-driving
  a captured payload through the reference compile ring lands on the
  same bytes on every target; a fail means the project shipped a
  cross-target replay drift. The FOUNDATION determinism property
  (docs/FOUNDATION.md §2) requires that a test replay lands on the
  same artifacts regardless of which reference compile target the
  operator chose; this KPI tracks whether the three-target ring is
  actually replay-parity green on the evaluation window.
unit: ratio
direction: higher_is_better
target:
  value: 1.0
  comparator: "=="
  rationale: >
    Cross-target replay-byte-parity is the determinism-ring floor. A
    replay that lands on different bytes across n8n / Temporal /
    LangGraph is a broken determinism contract the project owns to
    fix in the same PR that moves the compiler output.
thresholds:
  - name: warn
    comparator: "<"
    value: 1.0
    severity: warn
  - name: breach
    comparator: "<"
    value: 0.95
    severity: high
measurement:
  source: composite
  aggregation: ratio
  formula: >
    For each test-replay execution on the evaluation window, record
    one observation across the three reference compile targets:
    1 if the compiled artifact bytes emitted by n8n, Temporal, and
    LangGraph are pairwise equal for the same input payload, 0 if
    any single-target drift is observed. Aggregate as ratio across
    observations. The three-target conjunction is the canonical
    surface; per-target sub-ratios are a drill-down dimension, not
    a separate KPI. The committed reference visualisation lives at
    ``content/metrics/replay_parity_rate.viz.md`` — that file is the
    contract for the chart shape; the compile target renders the
    executable form at evaluation time.
  inputs:
    - name: cross_target_replay_execution
      description: >
        One test-replay execution replayed against all three
        reference compile targets from the same captured payload.
        The match key is the (workflow, payload_hash) tuple; the
        compile target emits the executable form of the byte-equality
        assertion.
      field: activity_id
      telemetry_ref: telemetry.ocsf.api_activity@v1
  window:
    duration: P1D
    sliding: false
telemetry_refs:
  - telemetry.ocsf.api_activity@v1
external_refs:
  - name: SecOps-NG FOUNDATION §2 — Determinism
    source: SecOps-NG
    url: https://github.com/secops-ng/secops-ng-framework/blob/main/docs/FOUNDATION.md
  - name: NIS2 — Article 21(2)(c) business continuity and crisis management
    source: EU
    external_id: Directive (EU) 2022/2555, Art. 21(2)(c)
    url: https://eur-lex.europa.eu/eli/dir/2022/2555/oj
  - name: OCSF — API Activity (class 6003)
    source: OCSF
    url: https://schema.ocsf.io/1.1.0/classes/api_activity
maintainer: metrics-wg@secops-ng.org
foundation_property:
  - determinism
