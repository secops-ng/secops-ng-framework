stable_id: kpi.mttr_blocklist_propagation@v1
content_version: 0.1.0
maturity: experimental
kind: kpi
title: Mean time to respond — blocklist propagation
summary: Time elapsed between the first authoritative detection firing and the first
  recorded response action in the playbook, scoped to blocklist-propagation actions,
  measuring time from decision to enforcement at all enforcement points. Measured
  end-to-end across the response pipeline so that triage latency, analyst handoffs,
  and orchestration step latency all contribute. SecOps-NG does not pick a response
  vendor; the catalog entry is vendor-neutral and the compile target is the source
  of truth for the executable form.
unit: minutes
direction: lower_is_better
measurement:
  source: workflow
  aggregation: p95
  formula: 'For each incident in scope closed within the evaluation window, compute
    (first_response_action_timestamp - first_detection_fire_timestamp) in minutes
    and aggregate as p95. Exclude incidents where the scoped response step never fired
    so the indicator does not silently improve when the response pipeline stalls.
    Reference visualisation: a horizontal bar chart of remediation_latency_minutes
    per closed in-scope incident in the window at the propagate step with the p95
    aggregate annotated as the headline figure; this scoped variant inherits the
    threshold-band shape from kpi.mttr_critical@v1 and operators typically tighten
    enforcement-distribution targets in their own scoped overrides given the
    indicator-of-compromise volume profile. The committed reference rendering lives
    at `content/metrics/mttr_blocklist_propagation.viz.md` — that file is the
    contract for the chart shape; the compile target renders the executable form
    against operator data.'
  inputs:
  - name: first_detection_fire
    description: First authoritative detection firing that opened the incident record
      at the scoped class. Carried on the OCSF Detection Finding meta-finding the
      detection_engineering measure-rule-version step emits and that SIEM rule matches
      downstream emit at runtime when an armed indicator matches inbound telemetry;
      the catalog entry binds to that OCSF class shape, not to a vendor-specific rule
      object.
    telemetry_ref: telemetry.ocsf.detection_finding@v1
    field: finding_info.uid
  - name: first_response_action
    description: First playbook step transition whose purpose matches the scoped response
      class (propagate). Bound to the canonical step of the compiled response playbook.
      The resolution-endpoint timestamp is carried on the OCSF Incident Finding the
      incident_management playbook emits when the incident record transitions out of
      the propagate-pending status into a propagate-complete status (the operator's
      enforcement points have acknowledged the indicator add-set); the catalog entry
      binds to that OCSF class shape, not to a vendor-specific enforcement-point
      object. The `incident.status_id` transition on that class is the evaluation
      anchor; the playbook_step pins which transition counts as the propagate
      completion in the compiled response playbook.
    playbook_step: propagate
    telemetry_ref: telemetry.ocsf.incident_finding@v1
    field: incident.status_id
  window:
    duration: P30D
    sliding: true
telemetry_refs:
- telemetry.ocsf.detection_finding@v1
- telemetry.ocsf.incident_finding@v1
playbook_refs:
- playbook_id: playbook.threat_intel_ingest@v1
  step_id: action--10000000-0000-4000-8000-000000000005
external_refs:
- name: NIS2 — Article 21(2)(b) incident-handling capability
  source: EU
  external_id: Directive (EU) 2022/2555, Art. 21(2)(b)
  url: https://eur-lex.europa.eu/eli/dir/2022/2555/oj
- name: ENISA — Threat Landscape methodology
  source: ENISA
