stable_id: kpi.eu_data_residency_declaration_coverage@v1
content_version: 0.1.0
maturity: experimental
kind: kpi
title: EU data-residency declaration coverage across reference deployment
  surfaces
summary: 'Ratio of reference deployment surfaces in the published deployment
  materials that carry an explicit EU data-residency declaration — i.e. a
  documented statement of where the operator''s data-at-rest and data-in-transit
  terminate on the reference stack. GDPR Chapter V (cross-border transfers)
  and docs/FOUNDATION.md §3 (Sovereignty) together make the residency of the
  operator''s data the observable surface of the sovereignty posture; a reference
  deployment that does not declare residency at all is an implicit ambiguity,
  not a passing signal. This KPI tracks whether every reference surface carries
  the declaration explicitly.

  '
unit: ratio
direction: higher_is_better
target:
  value: 1.0
  comparator: ==
  rationale: 'Every reference deployment surface documented in the published
    deployment materials should carry an explicit EU data-residency declaration.
    Silence is not passing — an operator reading the catalog must be able
    to answer "where does my data live under this reference?" from the artifact
    alone.

    '
thresholds:
- name: warn
  comparator: <
  value: 1.0
  severity: warn
- name: breach
  comparator: <
  value: 0.8
  severity: high
measurement:
  source: composite
  aggregation: ratio
  formula: 'Over the reference deployment surfaces documented in the published
    deployment materials on the evaluation commit, count those with an explicit
    EU data-residency declaration in the documented surface (numerator). Divide
    by the total count of reference deployment surfaces (denominator). A per-surface
    ribbon chart of declared (1) vs undeclared (0) residency is the canonical
    operator-facing rendering; the compile target renders the executable form.

    The committed reference visualisation lives at ``content/metrics/eu_data_residency_declaration_coverage.viz.md``
    — that file is the contract for the chart shape; the compile target renders
    the executable form at evaluation time.

    '
  inputs:
  - name: reference_deployment_surface
    description: 'Distinct reference deployment surface documented in the
      published deployment materials at the evaluation commit.

      '
  - name: eu_residency_declaration_predicate
    description: 'Predicate that classifies a single reference surface as
      declared (carries an explicit EU data-residency statement in the documented
      artifact) or undeclared (silent on residency).

      '
  window:
    duration: P90D
    sliding: false
external_refs:
- name: SecOps-NG FOUNDATION §3 — Sovereignty
  source: SecOps-NG
  url: https://github.com/secops-ng/secops-ng-framework/blob/main/docs/FOUNDATION.md
- name: GDPR — Chapter V cross-border transfers of personal data
  source: EU
  external_id: Regulation (EU) 2016/679, Chapter V
  url: https://eur-lex.europa.eu/eli/reg/2016/679/oj
- name: NIS2 — Article 21(2)(d) supply chain security
  source: EU
  external_id: Directive (EU) 2022/2555, Art. 21(2)(d)
  url: https://eur-lex.europa.eu/eli/dir/2022/2555/oj
- name: ENISA — Cloud security guidance, EU-residency considerations
  source: ENISA
  url: https://www.enisa.europa.eu/topics/cloud-and-big-data
maintainer: metrics-wg@secops-ng.org
residual_risk_refs:
  - kri.cross_border_transfer_exposure_count@v1
foundation_property:
- sovereignty
