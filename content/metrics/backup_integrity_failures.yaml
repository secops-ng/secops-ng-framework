stable_id: kri.backup_integrity_failures@v1
content_version: 0.1.0
maturity: experimental
kind: kri
title: Backup integrity failures — count of backup-integrity check failures observed on the backup_recovery playbook per window
summary: >
  Risk indicator derived from the backup_recovery playbook
  validate-backup-integrity step. Every execution that reaches the
  integrity-check step emits a boolean `__integrity_ok__` outcome;
  this indicator counts the executions where the outcome was false,
  short-circuiting the drill into the failure-attestation branch.
  Rising values indicate the backup surface is drifting away from a
  recoverable state — the failure mode the "tested restore drill"
  clauses under NIS2 Art. 21(2)(c) and DORA Art. 12 surface when the
  reviewer reads the operator's attestation stream and finds
  integrity failures the operator has not yet remediated.
unit: count
direction: lower_is_better
thresholds:
  - name: warn
    comparator: ">="
    value: 1
    severity: warn
  - name: breach
    comparator: ">="
    value: 3
    severity: high
measurement:
  source: workflow
  aggregation: count
  formula: >
    Count of backup_recovery executions in the evaluation window that
    reached the validate-backup-integrity step
    (action--50000000-0000-4000-8000-000000000003) and set
    `__integrity_ok__ == False`. Each such execution contributes one
    to the count regardless of downstream branch outcome; the count
    increments once per (backup-scope, drill-window) pair so a
    repeated failure on the same scope across successive drill
    windows registers each occurrence rather than being deduplicated.
    Executions whose validate-backup-integrity step never fired
    (pipeline stall) are excluded so the KRI does not silently
    improve when the pipeline itself fails — those cases are covered
    by the sibling cadence KPI. Reference visualisation: a
    count-headline card with warn / breach band overlays over a
    per-execution pass / fail drill-down sliced by backup scope; the
    committed reference rendering lives at
    `content/metrics/backup_integrity_failures.viz.md` — that file is
    the contract for the chart shape; the compile target renders the
    executable form against operator data.
  inputs:
    - name: integrity_ok
      description: >
        Boolean integrity-check outcome emitted by the
        validate-backup-integrity step of the backup_recovery
        playbook. Carried on the OCSF File System Activity event the
        validate-backup-integrity step emits when it hashes the
        candidate backup artifact and matches the result against the
        documented integrity baseline (checksum, manifest,
        decryption-key availability). The step is anchored on D3FEND
        File Hashing (D3-FH) per the playbook's mappings.yaml, and
        the OCSF File System Activity class (uid 1001) is the
        source-data shape the integrity check emits (activity_id
        transitions for the hash / read operation, matched-hash file
        payload on file.hashes). The catalog entry binds to that OCSF
        class shape, not to a vendor-specific backup product or
        integrity tool.
      playbook_ref: playbook.backup_recovery@v1
      playbook_step: action--50000000-0000-4000-8000-000000000003
      field: file.hashes
      telemetry_ref: telemetry.ocsf.file_activity@v1
  window:
    duration: P30D
    sliding: true
telemetry_refs:
  - telemetry.ocsf.file_activity@v1
playbook_refs:
  - playbook_id: playbook.backup_recovery@v1
    step_id: action--50000000-0000-4000-8000-000000000003
external_refs:
  - name: NIS2 — Article 21(2)(c) business continuity, backup management, disaster recovery, crisis management
    source: EU
    external_id: Directive (EU) 2022/2555, Art. 21(2)(c)
    url: https://eur-lex.europa.eu/eli/dir/2022/2555/oj
  - name: DORA — Article 12 backup policies and procedures, restoration and recovery procedures and methods
    source: EU
    external_id: Regulation (EU) 2022/2554, Art. 12
    url: https://eur-lex.europa.eu/eli/reg/2022/2554/oj
  - name: NIST SP 800-53 Rev. 5 — CP-9(1) System Backup | Testing for Reliability and Integrity
    source: NIST
    external_id: NIST SP 800-53 Rev. 5 CP-9(1)
    url: https://csrc.nist.gov/projects/risk-management/sp800-53-controls/release-search#!/control?version=5.1&number=CP-9
  - name: MITRE D3FEND — D3-FH File Hashing
    source: MITRE
    url: https://d3fend.mitre.org/technique/d3f:FileHashing/
maintainer: metrics-wg@secops-ng.org
foundation_property:
  - auditability
  - operability
