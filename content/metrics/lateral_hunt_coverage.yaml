stable_id: kpi.lateral_hunt_coverage@v1
content_version: 0.1.0
maturity: experimental
kind: kpi
title: Lateral-movement hunt coverage
summary: Ratio of in-scope lateral-movement techniques covered by an active hunt or
  detection to the total in-scope technique population the operator has committed
  to monitor. Technique catalog is community-driven and vendor-neutral.
unit: ratio
direction: higher_is_better
target:
  value: 0.95
  comparator: '>='
  rationale: Community-recommended starting point for a coverage indicator. Operators
    tighten or loosen this target in their compile target configuration.
thresholds:
- name: warn
  comparator: <
  value: 0.95
  severity: warn
- name: breach
  comparator: <
  value: 0.8
  severity: high
measurement:
  source: composite
  aggregation: ratio
  formula: 'Ratio of in-scope assets, schedules, feeds, or surfaces covered by the
    named control surface to the total in-scope population, evaluated over a rolling
    window. Exclude entries where the in-scope population is unknown so the indicator
    does not silently improve on record-keeping gaps. Reference visualisation: a
    per-family stacked horizontal bar chart with covered / uncovered partitions and
    a ratio-headline gauge carrying warn / breach overlays; the committed reference
    rendering lives at `content/metrics/lateral_hunt_coverage.viz.md` — that file
    is the contract for the chart shape; the compile target renders the executable
    form against operator data.'
  inputs:
  - name: covered_population
    description: >
      Count of in-scope lateral-movement techniques for which the
      identity_compromise lateral-movement-hunt step has at least one
      activated hunt rule that produced a match against operator
      telemetry inside the evaluation window. Carried on the OCSF
      Detection Finding the lateral-movement-hunt step emits when an
      activated hunt rule matches subsequent API-activity or
      authentication traces attributable to the compromised principal
      — a technique counts as covered when at least one hunt rule
      sourced for it produces a Detection Finding in the window
      (`finding_info.uid` records the rule-match identity, and the
      originating technique is carried on the rule's technique
      provenance metadata). The catalog entry binds to that OCSF
      class shape, not to a vendor-specific SIEM, XDR, or identity-
      analytics rule object.
    playbook_step: action--30000000-0000-4000-8000-000000000006
    telemetry_ref: telemetry.ocsf.detection_finding@v1
    field: finding_info.uid
  - name: total_population
    description: >
      Count of in-scope lateral-movement techniques the operator's
      scoping artifact declares should be under an active hunt or
      detection. Sourced from the operator's technique scoping
      artifact rather than the telemetry stream — the catalog entry
      does not name a specific scoping file. Excluding this from a
      telemetry binding keeps the denominator stable against
      ingestion gaps in the hunt-rule-handling surface itself,
      matching the detection_coverage / coverage_threat_intel_feed
      convention.
  window:
    duration: P30D
    sliding: true
telemetry_refs:
- telemetry.ocsf.detection_finding@v1
playbook_refs:
- playbook_id: playbook.identity_compromise@v1
  step_id: action--30000000-0000-4000-8000-000000000006
external_refs:
- name: NIS2 — Article 21(2)(b) incident-handling capability
  source: EU
  external_id: Directive (EU) 2022/2555, Art. 21(2)(b)
  url: https://eur-lex.europa.eu/eli/dir/2022/2555/oj
- name: ENISA — Threat Landscape methodology
  source: ENISA
  url: https://www.enisa.europa.eu/publications/enisa-threat-landscape
- name: ISO/IEC 27004 — Information security measurement guidance
  source: ISO
  external_id: ISO/IEC 27004:2016
maintainer: metrics-wg@secops-ng.org
