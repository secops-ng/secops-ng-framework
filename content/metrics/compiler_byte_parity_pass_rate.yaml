stable_id: kpi.compiler_byte_parity_pass_rate@v1
content_version: 0.1.0
maturity: experimental
kind: kpi
title: Compiler byte-parity pass rate across reference compile targets
summary: >
  Ratio of per-example byte-parity golden assertions that pass across the
  three reference compile targets (n8n, Temporal, LangGraph) on the
  current commit. Each per-example golden under
  ``tests/examples/<workflow>/`` pins one emitted artifact against the
  bytes committed under ``examples/<target>/<workflow>/``; a pass means
  the compiler re-derived the committed bytes exactly, a fail means the
  compiler emitted drift. SecOps-NG does not pick the compile target the
  operator runs; the catalog entry covers all three reference targets
  because byte-parity is the FOUNDATION determinism contract for the
  content the project ships.
unit: ratio
direction: higher_is_better
target:
  value: 1.0
  comparator: "=="
  rationale: >
    A green ring across the three reference compile targets is the
    determinism floor. Per docs/FOUNDATION.md §2 ("Determinism"),
    per-example byte-parity golden tests under tests/examples/ are not
    optional — a compiler change that moves golden output is intentional
    and lands in the same PR as the test update. Anything less than 1.0
    means the project shipped a non-deterministic content rendering.
thresholds:
  - name: warn
    comparator: "<"
    value: 1.0
    severity: warn
  - name: breach
    comparator: "<"
    value: 0.95
    severity: high
measurement:
  source: composite
  aggregation: ratio
  formula: >
    For each per-example byte-parity golden assertion exercised by
    ``python -m pytest tests/examples/`` on the evaluation commit,
    record one observation: 1 if the assertion passes (the reference
    compiler re-derived the committed bytes under
    ``examples/<target>/<workflow>/`` exactly), 0 if it fails. Aggregate
    as ratio across observations. The three-target ring is the
    canonical surface — per-target sub-ratios are a drill-down
    dimension, not a separate KPI. Reference visualisation: a
    horizontal bar chart of per-target byte-parity outcomes (1 = pass,
    0 = fail) per (workflow, target) pair observed in the golden suite,
    sliced by compile target (n8n / temporal / langgraph), with a
    horizontal line at the pass-floor of 1 marking the byte-parity
    predicate and the ratio aggregate annotated as the headline figure;
    the chart is the canonical operator-facing surface for this KPI.
    The committed reference rendering lives at
    ``content/metrics/compiler_byte_parity_pass_rate.viz.md`` — that
    file is the contract for the chart shape; the compile target
    renders the executable form against operator data.
  inputs:
    - name: per_example_byte_parity_assertion
      description: >
        Per-example byte-parity golden assertion. The assertion
        re-runs the reference compiler against the canonical CACAO
        source under ``content/playbooks/<workflow>/playbook.cacao.json``
        and asserts the emitted bytes match the committed reference
        artifact under ``examples/<target>/<workflow>/`` byte-for-byte.
        The test files live under
        ``tests/examples/<workflow>/test_{n8n,temporal,langgraph}_workflow_golden.py``
        for workflows with the full three-target ring, and under
        ``tests/examples/<workflow>/test_golden.py`` for single-target
        examples. The catalog entry binds to that test-artifact shape;
        the compile target resolves the concrete assertion outcome at
        evaluation time. Workflows with the cross-target ring include
        asset_management, supply_chain_security, infra_posture_management,
        contractual_obligations_tracker, codebase_vuln_management,
        it_security_support_agent, and onboarding_offboarding_tracker;
        the catalog entry covers every per-example golden the suite
        exercises, not a curated subset.
      playbook_ref: playbook.asset_management@v1
    - name: cross_target_byte_parity_assertion
      description: >
        Cross-target byte-parity assertion drawn from the same
        per-example golden suite, but evaluated as the conjunction
        across the three reference compile targets for one workflow.
        A workflow pass requires every target's assertion to pass;
        a single-target drift fails the cross-target observation
        even if the other two targets are green. Bound here as a
        representative supply-chain-security workflow that carries
        the full three-target ring; the catalog entry covers every
        workflow in ``tests/examples/`` with a cross-target ring.
      playbook_ref: playbook.supply_chain_security@v1
  window:
    duration: P1D
    sliding: false
playbook_refs:
  - playbook_id: playbook.asset_management@v1
  - playbook_id: playbook.supply_chain_security@v1
  - playbook_id: playbook.infra_posture_management@v1
  - playbook_id: playbook.executive_metrics@v1
external_refs:
  - name: SecOps-NG FOUNDATION §2 — Determinism
    source: SecOps-NG
    url: https://github.com/secops-ng/secops-ng-framework/blob/main/docs/FOUNDATION.md
  - name: NIS2 — Article 21(2)(c) business continuity and crisis management (motivating context — reproducible response artifacts)
    source: EU
    external_id: Directive (EU) 2022/2555, Art. 21(2)(c)
    url: https://eur-lex.europa.eu/eli/dir/2022/2555/oj
  - name: ENISA — Threat Landscape methodology, reproducibility-of-evidence discussion
    source: ENISA
    url: https://www.enisa.europa.eu/publications/enisa-threat-landscape
maintainer: metrics-wg@secops-ng.org
foundation_property:
  - determinism
  - auditability
