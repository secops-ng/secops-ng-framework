stable_id: kri.lawful_basis_undocumented_surface_count@v1
content_version: 0.1.0
maturity: experimental
kind: kri
title: Processing playbooks with no GDPR data-flow document at all — residual lawful-basis exposure
summary: >
  Residual-risk indicator paired with
  ``kpi.gdpr_lawful_basis_section_coverage@v1``. Count of cookbook
  playbooks under ``content/playbooks/`` that process personal data —
  their steps read principals, mailboxes, staff records or subject
  identifiers — but have **no** sibling GDPR data-flow document under
  ``content/mappings/gdpr/data-flow-<workflow>.md`` for the F-GD-02
  guard to evaluate. The paired KPI scores documents the guard can
  read: pass when the seven canonical sections are filled, fail when
  one is empty or templated. A playbook with no document at all never
  reaches the guard — it is not a fail, it is unjudgeable, and the
  coverage ratio neither rises nor falls when such a playbook ships.
  This KRI counts that unjudgeable population, distinguished from the
  stated-but-unverified documents the KPI already scores as failing.
unit: count
direction: lower_is_better
target:
  value: 0
  comparator: "=="
  rationale: >
    The floor is zero: every personal-data-processing playbook carries
    a data-flow document the F-GD-02 guard can evaluate, even one whose
    sections initially fail — a failing document is visible on the
    coverage chart and improvable; an absent one is invisible. Coverage
    may only become meaningful over a fully documented surface.
thresholds:
  - name: warn
    comparator: ">"
    value: 0
    severity: warn
  - name: breach
    comparator: ">="
    value: 3
    severity: high
measurement:
  source: composite
  aggregation: count
  formula: >
    Discover cookbook playbooks via the
    ``tools.lint_gdpr_lawful_basis.discover_playbooks`` contract on the
    evaluation commit. For each playbook whose canonical CACAO source
    declares steps reading personal-data-shaped inputs (subject, principal,
    staff, reporter identifiers among its ``playbook_variables`` or step
    ``in_args``), record one observation: 1 if no
    ``content/mappings/gdpr/data-flow-<workflow>.md`` exists, 0
    otherwise. Aggregate as count. Playbooks whose document exists but
    fails the guard belong to the paired KPI's fail bucket, not here —
    the two indicators partition the documented-versus-undocumented
    line, not the pass-versus-fail one.
    Reference visualisation: see the committed rendering at
    ``content/metrics/lawful_basis_undocumented_surface_count.viz.md`` — that file is the contract for
    the chart shape; the compile target renders the executable form at
    evaluation time.
  inputs:
    - name: processing_playbook
      description: >
        One cookbook playbook whose canonical source declares
        personal-data-shaped inputs, discovered on the evaluation
        commit.
    - name: data_flow_doc_presence
      description: >
        Whether ``content/mappings/gdpr/data-flow-<workflow>.md``
        exists for it. Only the absent branch counts toward this
        KRI.
  window:
    duration: P1D
    sliding: false
external_refs:
  - name: SecOps-NG FOUNDATION §3 — Sovereignty
    source: SecOps-NG
    url: https://github.com/secops-ng/secops-ng-framework/blob/main/docs/FOUNDATION.md
  - name: SecOps-NG ROADMAP — F-SV-06 coverage/exposure pairing invariant
    source: SecOps-NG
    url: https://github.com/secops-ng/secops-ng-framework/blob/main/ROADMAP.md
  - name: GDPR — Article 6 lawfulness of processing
    source: EU
    external_id: Regulation (EU) 2016/679, Art. 6
    url: https://eur-lex.europa.eu/eli/reg/2016/679/oj
maintainer: metrics-wg@secops-ng.org
foundation_property:
  - sovereignty
