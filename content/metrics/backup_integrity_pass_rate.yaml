stable_id: kpi.backup_integrity_pass_rate@v1
content_version: 0.1.0
maturity: experimental
kind: kpi
title: Backup integrity pass rate
summary: Ratio of backup-integrity verifications that passed (restore drill or checksum
  verification succeeded) to total verifications attempted in the evaluation window.
  Backup surface is vendor-neutral.
unit: ratio
direction: higher_is_better
measurement:
  source: composite
  aggregation: ratio
  formula: >
    Computed from the lower content layers per the inputs below. The
    catalog entry is the contract; the compile target is the source of
    truth for the executable form. Reference visualisation: a horizontal
    bar chart of verification-attempt outcomes (1 = pass, 0 = fail) per
    attempt observed in the evaluation window, sliced by backup-kind
    (restore-drill vs checksum-verification), with a horizontal line at
    the pass-floor of 1 marking the success predicate and the ratio
    aggregate annotated as the headline figure; the chart is the
    canonical operator-facing surface for this KPI. The committed
    reference rendering lives at
    `content/metrics/backup_integrity_pass_rate.viz.md` — that file is
    the contract for the chart shape; the compile target renders the
    executable form against operator data.
  inputs:
  - name: numerator
    description: >
      Population of backup-integrity verification attempts whose
      integrity outcome was a pass (restore-drill succeeded or
      checksum-verification matched the backup-catalogue record) in
      the evaluation window. Carried on the OCSF File System Activity
      event the ransomware_containment backup-verification step emits
      when it hashes the most-recent known-good snapshot and matches
      the result against the backup-catalogue record — the playbook's
      mappings.yaml commits the backup-verification step to File
      System Activity (class_uid 1001) so each verification attempt
      lands as one File System Activity record with the integrity
      outcome carried on the same event (activity_id transitions for
      the hash/read operation; matched-hash file payload on
      file.hashes). The catalog entry binds to that OCSF class shape,
      not to a vendor-specific backup, snapshot, or storage product.
    playbook_step: action--30000000-0000-4000-8000-000000000008
    telemetry_ref: telemetry.ocsf.file_activity@v1
    field: file.hashes
  - name: denominator
    description: >
      Reference population of backup-integrity verification attempts
      observed in the evaluation window (every attempt, regardless of
      pass / fail outcome). Carried on the same OCSF File System
      Activity event the ransomware_containment backup-verification
      step emits per attempt — one event per verification attempt
      against the backup-catalogue record anchors the denominator on
      the same OCSF class as the numerator, matching the established
      cluster-PR convention.
    playbook_step: action--30000000-0000-4000-8000-000000000008
    telemetry_ref: telemetry.ocsf.file_activity@v1
    field: time
  window:
    duration: P30D
    sliding: true
telemetry_refs:
- telemetry.ocsf.file_activity@v1
playbook_refs:
- playbook_id: playbook.ransomware_containment@v1
  step_id: action--30000000-0000-4000-8000-000000000008
