stable_id: kri.regulator_notification_overrun@v1
content_version: 0.1.0
maturity: experimental
kind: kri
title: Regulator-notification overrun rate
summary: Ratio of regulator-facing notifications submitted after their statutory deadline
  to total in-scope notifications due within the evaluation window. Statutory clocks
  are defined by the regulator, not by SecOps-NG; the catalog entry is regulator-neutral
  and the compile target binds the concrete clock.
unit: ratio
direction: lower_is_better
measurement:
  source: composite
  aggregation: ratio
  formula: >
    Computed from the lower content layers per the inputs below. The
    catalog entry is the contract; the compile target is the source of
    truth for the executable form. Reference visualisation: a horizontal
    bar chart of submission_margin_minutes per regulator-facing
    notification due in the window, sliced by regulatory regime, with a
    vertical line at zero marking the statutory-clock overrun predicate
    and the ratio aggregate annotated as the headline figure (direction
    lower_is_better); the chart is the canonical operator-facing risk
    surface for this KRI. The committed reference rendering lives at
    `content/metrics/regulator_notification_overrun.viz.md` — that file
    is the contract for the chart shape; the compile target renders the
    executable form against operator data.
  inputs:
  - name: numerator
    description: >
      Population of regulator-facing notifications submitted after their
      statutory deadline. Carried on the OCSF Incident Finding event the
      regulator-notification step emits at dispatch (status_id transition
      into the notified state) whose `time` is later than the statutory
      clock boundary anchored on the case's start_time; the catalog entry
      binds to that OCSF class shape, not to a regulator-submission
      envelope.
    telemetry_ref: telemetry.ocsf.incident_finding@v1
    field: time
  - name: denominator
    description: >
      Reference population of regulator-facing notifications due in the
      evaluation window. Carried on the OCSF Incident Finding event the
      regulator-notification step emits at every statutory-clock due-
      event (status_id transition into the notification-due state),
      regardless of whether the submission completed on time.
    telemetry_ref: telemetry.ocsf.incident_finding@v1
    field: time
  window:
    duration: P30D
    sliding: true
telemetry_refs:
- telemetry.ocsf.incident_finding@v1
playbook_refs:
- playbook_id: playbook.data_exfil@v1
  step_id: action--20000000-0000-4000-8000-000000000007
