stable_id: kri.regulator_notification_overrun@v1
content_version: 0.1.0
maturity: experimental
kind: kri
title: Regulator-notification overrun rate
summary: Ratio of regulator-facing notifications submitted after their statutory deadline
  to total in-scope notifications due within the evaluation window. Statutory clocks
  are defined by the regulator, not by SecOps-NG; the catalog entry is regulator-neutral
  and the compile target binds the concrete clock.
unit: ratio
direction: lower_is_better
measurement:
  source: composite
  aggregation: ratio
  formula: Computed from the lower content layers per the inputs below. The catalog
    entry is the contract; the compile target is the source of truth for the executable
    form.
  inputs:
  - name: numerator
    description: Population that contributes to the risk reading (e.g. recurring findings,
      missed notifications, breaches).
  - name: denominator
    description: Reference population the numerator is normalised against. Omit for
      raw-count KRIs.
  window:
    duration: P30D
    sliding: true
playbook_refs:
- playbook_id: playbook.data_exfil@v1
  step_id: action--20000000-0000-4000-8000-000000000007
- playbook_id: playbook.ransomware_containment@v1
  step_id: action--30000000-0000-4000-8000-000000000009
