stable_id: kri.nis2_incident_final_report_latency_days@v1
content_version: 0.1.0
maturity: experimental
kind: kri
title: NIS2 incident final-report (one month) dispatch latency
summary: >
  Elapsed days between dispatch of the NIS2 Art. 23(4)(b) incident
  notification and dispatch of the NIS2 Art. 23(4)(d) final report to
  the CSIRT or, where applicable, the competent authority. Residual-
  risk counterpart to any future
  `kpi.nis2_final_report_on_time@v1`: the on-time KPI reads whether
  the clock was held; this KRI reads *how close to the wall* each
  final-report dispatch landed, so operators can see slippage well
  before the ratio itself falls below 1.00. The one-month bound is
  set by NIS2 Art. 23(4)(d) (final report no later than one month
  after the submission of the Art. 23(4)(b) incident notification);
  any observation above the bound is a statutory overrun and a
  reportable compliance exception. No non-EU default endpoints
  participate in the notification chain — the competent-authority /
  CSIRT submission surface is an EU-hostable endpoint per the
  sovereign-stack bias.
unit: days
direction: lower_is_better
target:
  value: 30
  comparator: "<="
  rationale: >
    NIS2 Art. 23(4)(d) sets a one-month final-report deadline anchored
    on the submission of the Art. 23(4)(b) incident notification. The
    target here is that statutory bound (approximated as 30 days for
    banded evaluation); any dispatch beyond it is an overrun the
    operator must record for the competent authority / CSIRT with
    reasons for the delay. Where the incident is ongoing at the
    one-month mark, the operator submits a progress report under
    Art. 23(4)(c) instead of the final report; the final-report clock
    on this KRI runs until the Art. 23(4)(d) submission lands.
thresholds:
  - name: warn
    comparator: ">"
    value: 20
    severity: warn
  - name: high
    comparator: ">"
    value: 25
    severity: high
  - name: breach
    comparator: ">"
    value: 30
    severity: critical
measurement:
  source: workflow
  aggregation: max
  formula: >
    For each NIS2 Art. 23(4)(d) final-report dispatched within the
    evaluation window, compute
    latency_days = (dispatch_timestamp - notification_dispatch_timestamp) / 86400,
    where `notification_dispatch_timestamp` is the moment the
    operator's chain dispatched the Art. 23(4)(b) incident
    notification. Aggregate as `max` across dispatches — the worst-
    case latency the operator's regulator-notification pipeline
    delivered in the window, i.e. the case that came closest to (or
    beyond) the one-month statutory bound. Exclude in-scope cases
    whose final-report dispatch step never fired so the indicator does
    not silently improve when the notification pipeline stalls
    outright; those cases surface on
    `kri.regulator_notification_overrun@v1` instead.
    Reference visualisation: a horizontal bar chart of
    dispatch_latency_days per NIS2 Art. 23(4)(d) final-report
    dispatched in the window, with vertical lines at the warn / high /
    breach thresholds (20d / 25d / 30d) and the max aggregate
    annotated as the headline figure; direction is `lower_is_better`
    so a rising max is the leading signal that the operator's final-
    report pipeline is approaching the statutory wall. The committed
    reference rendering lives at
    `content/metrics/nis2_incident_final_report_latency_days.viz.md`
    — that file is the contract for the chart shape; the compile
    target renders the executable form against operator data.
  inputs:
    - name: notification_dispatch_timestamp
      description: >
        Timestamp at which the operator's regulator-notification chain
        dispatched the NIS2 Art. 23(4)(b) incident notification. Used
        as the start of the one-month final-report clock. Carried on
        the OCSF Compliance Finding event the final-report submission
        emits (status_id transition into the notified state); the
        catalog entry binds to that OCSF class shape, not to a
        regulator-submission envelope.
      telemetry_ref: telemetry.ocsf.compliance_finding@v1
      field: start_time
    - name: notification_dispatch
      description: >
        Regulator-notification chain step transition that dispatches
        the NIS2 Art. 23(4)(d) final report to the CSIRT or, where
        applicable, the competent authority. Carried on the OCSF
        Compliance Finding event the final-report submission emits at
        dispatch (status_id transition into the notified state).
      telemetry_ref: telemetry.ocsf.compliance_finding@v1
      field: time
  window:
    duration: P30D
    sliding: true
telemetry_refs:
  - telemetry.ocsf.compliance_finding@v1
playbook_refs:
  # Primary dispatch anchor: the NIS2 Art. 23(4)(d) one-month final-
  # report step of the dual-mandate incident-management chain (co-
  # anchored with DORA Art. 19(4)(c) final report).
  - playbook_id: playbook.incident_management@v1
    step_id: action--50000000-0000-4000-8000-000000000009
  # Adjacent dispatch surface: ransomware-containment stages the
  # initial regulator pre-notification per NIS2 Art. 23 within the
  # 24-hour clock; the one-month final report on the same event is
  # dispatched from the incident-management chain.
  - playbook_id: playbook.ransomware_containment@v1
    step_id: action--30000000-0000-4000-8000-000000000009
  # Awareness-gate anchor: the whole-Article-21 self-assessment
  # attestation records the operator's readiness posture that the
  # Art. 23 one-month final-report dispatch depends on.
  - playbook_id: playbook.nis2_self_assessment@v1
    step_id: action--91000000-0000-4000-8000-000000000005
external_refs:
  - name: NIS2 — Article 23 incident-reporting obligations (final report within one month of the incident notification)
    source: EU
    external_id: Directive (EU) 2022/2555, Art. 23(4)(d)
    url: https://eur-lex.europa.eu/eli/dir/2022/2555/oj
  - name: ENISA — NIS2 incident reporting guidance
    source: ENISA
    url: https://www.enisa.europa.eu/topics/cybersecurity-policy/nis-directive-new
  - name: ISO/IEC 27004 — Information security measurement guidance
    source: ISO
    external_id: ISO/IEC 27004:2016
maintainer: metrics-wg@secops-ng.org
foundation_property:
  - auditability
