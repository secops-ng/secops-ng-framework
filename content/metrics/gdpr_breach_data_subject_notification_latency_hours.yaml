stable_id: kri.gdpr_breach_data_subject_notification_latency_hours@v1
content_version: 0.1.0
maturity: experimental
kind: kri
title: GDPR data-subject breach-notification dispatch latency
summary: >
  Elapsed hours between controller awareness of a personal-data breach
  under the GDPR Art. 4(12) definition and dispatch of the GDPR
  Article 34(1) notification to affected data subjects, for cases where
  the breach is "likely to result in a high risk to the rights and
  freedoms of natural persons" per Art. 34(1) and no Art. 34(3)
  exemption (appropriate technical/organisational protection such as
  encryption, subsequent measures ensuring the high risk is no longer
  likely to materialise, or disproportionate-effort with public
  communication) applies. Residual-risk counterpart to any future
  `kpi.gdpr_breach_data_subject_notification_on_time@v1`. Art. 34(1)
  sets no statutory hard-hour cap ("without undue delay"); the
  operational benchmark used here is 72 hours, aligned with the
  Art. 33(1) supervisory-authority floor, so the data-subject
  notification does not lag the supervisory-authority notification
  by more than the supervisory clock itself. No non-EU default
  endpoints participate in the notification chain — the data-subject
  communication surface is an EU-hostable endpoint per the sovereign-
  stack bias.
unit: hours
direction: lower_is_better
target:
  value: 72
  comparator: "<="
  rationale: >
    GDPR Art. 34(1) requires the controller to notify affected data
    subjects "without undue delay" when the breach is likely to
    result in a high risk to the rights and freedoms of natural
    persons. There is no statutory hard-hour cap; the 72-hour value
    used here is an operational benchmark aligned with the Art. 33(1)
    supervisory-authority floor. Operators with tighter internal SLOs
    override the target in the compile target without diverging the
    catalog contract. Cases meeting an Art. 34(3) exemption
    (encryption, subsequent measures, disproportionate-effort with
    public communication) are out of scope — the individual
    notification obligation is not engaged, so no dispatch latency is
    measured; the classification-time skip is recorded on the case
    for audit but does not contribute to this indicator.
thresholds:
  - name: warn
    comparator: ">"
    value: 48
    severity: warn
  - name: high
    comparator: ">"
    value: 60
    severity: high
  - name: breach
    comparator: ">"
    value: 72
    severity: critical
measurement:
  source: workflow
  aggregation: max
  formula: >
    For each GDPR Art. 34(1) data-subject notification dispatched
    within the evaluation window, compute
    latency_hours = (dispatch_timestamp - awareness_timestamp) / 3600.
    Aggregate as `max` across dispatches — the worst-case latency the
    controller's data-subject notification pipeline delivered in the
    window, i.e. the case that came closest to (or beyond) the
    72-hour operational benchmark. Exclude in-scope cases whose
    data-subject notification dispatch step never fired so the
    indicator does not silently improve when the notification pipeline
    stalls outright; those cases surface on
    `kri.regulator_notification_overrun@v1` instead. Cases meeting an
    Art. 34(3)(a) encryption / anonymisation exemption, an
    Art. 34(3)(b) subsequent-measures exemption, or an Art. 34(3)(c)
    disproportionate-effort exemption (with equivalent public
    communication) are excluded at classification and do not
    contribute to the aggregation. Cases where the supervisory
    authority under Art. 34(4) requires the controller to notify the
    data subjects after considering the likelihood of the breach
    resulting in a high risk enter scope at that point and the clock
    runs from the original awareness_timestamp.
    Reference visualisation: a horizontal bar chart of
    dispatch_latency_hours per GDPR Art. 34(1) data-subject
    notification dispatched in the window, with vertical lines at the
    warn / high / breach thresholds (48h / 60h / 72h) and the max
    aggregate annotated as the headline figure; direction is
    `lower_is_better` so a rising max is the leading signal that the
    controller's data-subject notification pipeline is approaching
    the operational benchmark. The committed reference rendering
    lives at
    `content/metrics/gdpr_breach_data_subject_notification_latency_hours.viz.md`
    — that file is the contract for the chart shape; the compile
    target renders the executable form against operator data.
  inputs:
    - name: awareness_timestamp
      description: >
        Controller-awareness timestamp emitted by the breach-handling
        process when a candidate incident crosses the Art. 4(12)
        personal-data-breach classification threshold and the
        Art. 34(1) high-risk criterion is met with no Art. 34(3)
        exemption. Used as the start of the operational 72-hour
        data-subject notification clock. Carried on the OCSF
        Compliance Finding event the data-subject notification
        emits (status_id transition into the notified state); the
        catalog entry binds to that OCSF class shape, not to a
        communication envelope.
      telemetry_ref: telemetry.ocsf.compliance_finding@v1
      field: start_time
    - name: notification_dispatch
      description: >
        Data-subject notification chain step transition that dispatches
        the GDPR Art. 34(1) communication to affected data subjects.
        Carried on the OCSF Compliance Finding event the data-subject
        notification emits at dispatch (status_id transition into the
        notified state).
      telemetry_ref: telemetry.ocsf.compliance_finding@v1
      field: time
  window:
    duration: P30D
    sliding: true
telemetry_refs:
  - telemetry.ocsf.compliance_finding@v1
playbook_refs:
  - playbook_id: playbook.data_exfil@v1
    step_id: action--20000000-0000-4000-8000-000000000008
external_refs:
  - name: GDPR — Article 34(1) data-subject breach-notification obligation
    source: EU
    external_id: Regulation (EU) 2016/679, Art. 34(1)
    url: https://eur-lex.europa.eu/eli/reg/2016/679/oj
  - name: GDPR — Article 34(3) exemptions from data-subject notification
    source: EU
    external_id: Regulation (EU) 2016/679, Art. 34(3)
    url: https://eur-lex.europa.eu/eli/reg/2016/679/oj
  - name: GDPR — Article 4(12) personal-data-breach definition
    source: EU
    external_id: Regulation (EU) 2016/679, Art. 4(12)
    url: https://eur-lex.europa.eu/eli/reg/2016/679/oj
  - name: EDPB — Guidelines 9/2022 on personal data breach notification
    source: EDPB
    url: https://www.edpb.europa.eu/our-work-tools/our-documents/guidelines/guidelines-92022-personal-data-breach-notification_en
  - name: ISO/IEC 27004 — Information security measurement guidance
    source: ISO
    external_id: ISO/IEC 27004:2016
maintainer: metrics-wg@secops-ng.org
foundation_property:
  - auditability
