stable_id: kpi.dependency_free_ratio@v1
content_version: 0.1.0
maturity: experimental
kind: kpi
title: Dependency-free playbook ratio executable without an external SaaS binding
summary: >
  Ratio of playbooks under ``content/playbooks/`` on the evaluation
  commit that can be exercised end-to-end without a mandatory external
  SaaS binding — either every declared external step is optional, or
  the playbook ships with a documented substitutable community-hosted
  alternative — over the total playbook count. FOUNDATION §4
  (Operability) and §3 (Sovereignty) together push toward runnable
  content that does not force an operator onto a non-EU or
  vendor-locked surface just to walk the playbook end-to-end; this
  KPI tracks the surfaces where that push is being honoured.
unit: ratio
direction: higher_is_better
target:
  value: 1.0
  comparator: "=="
  rationale: >
    Every shipped playbook should be exercisable without a mandatory
    external SaaS dependency. Anything below 1.0 is a playbook an
    operator without the specific external binding cannot run from
    the reference content, weakening the framework-agnostic promise
    per FOUNDATION §4.
thresholds:
  - name: warn
    comparator: "<"
    value: 1.0
    severity: warn
  - name: breach
    comparator: "<"
    value: 0.8
    severity: high
measurement:
  source: composite
  aggregation: ratio
  formula: >
    Over the playbook tree under ``content/playbooks/`` on the
    evaluation commit, count distinct playbooks where every declared
    external step is either optional or ships with a documented
    substitutable community-hosted alternative (numerator). Divide
    by the total playbook count in the same commit (denominator).
    A playbook with one mandatory external SaaS binding does not
    count toward the numerator. The committed reference visualisation
    lives at ``content/metrics/dependency_free_ratio.viz.md`` — that
    file is the contract for the chart shape; the compile target
    renders the executable form at evaluation time.
  inputs:
    - name: playbook_artifact
      description: >
        A single playbook artifact under
        ``content/playbooks/<workflow>/playbook.cacao.json`` on the
        evaluation commit, identified by playbook stable_id.
      field: metadata.uid
      telemetry_ref: telemetry.ocsf.compliance_finding@v1
    - name: dependency_free_predicate
      description: >
        Predicate that classifies a playbook as dependency-free
        (every declared external step is optional or has a
        documented substitutable community-hosted alternative) or
        dependency-locked.
  window:
    duration: P1D
    sliding: false
external_refs:
  - name: SecOps-NG FOUNDATION §4 — Operability
    source: SecOps-NG
    url: https://github.com/secops-ng/secops-ng-framework/blob/main/docs/FOUNDATION.md
  - name: SecOps-NG FOUNDATION §3 — Sovereignty
    source: SecOps-NG
    url: https://github.com/secops-ng/secops-ng-framework/blob/main/docs/FOUNDATION.md
  - name: OCSF — Compliance Finding (class 2003)
    source: OCSF
    url: https://schema.ocsf.io/1.1.0/classes/compliance_finding
telemetry_refs:
  - telemetry.ocsf.compliance_finding@v1
maintainer: metrics-wg@secops-ng.org
foundation_property:
  - operability
  - sovereignty
