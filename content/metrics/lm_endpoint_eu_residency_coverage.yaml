stable_id: kpi.lm_endpoint_eu_residency_coverage@v1
content_version: 0.1.0
maturity: experimental
kind: kpi
title: LM endpoint EU-residency coverage across reference compile targets
summary: >
  Ratio of LM endpoints declared in compiled example artifacts under
  ``examples/<target>/<workflow>/`` that classify as EU-resident
  under the shared EU-resident LM endpoint guard at
  ``compilers/_shared/lm_endpoint_guard.py`` on the evaluation
  commit. Per F-SV-01 (ROADMAP — Language-Model endpoint residency
  guard) and docs/FOUNDATION.md §3 (Sovereignty), the project's
  default posture is that any LM endpoint reached from a compiled
  workflow lives in the European Union; ``assert_eu_resident_endpoint``
  is the compile-time hook that enforces it, and the rendered runtime
  module re-applies the check at process startup. This KPI tracks
  whether the cookbook examples the project ships actually honour
  the posture — endpoints that resolve to ``EndpointResidency.EU``
  under the guard count toward coverage; endpoints that resolve to
  ``NON_EU`` or ``UNKNOWN`` do not. The chart shape, threshold
  bands, and reference rendering are the contract for the operator-
  facing surface; the compile target is the source of truth for the
  executable form.
unit: ratio
direction: higher_is_better
target:
  value: 1.0
  comparator: "=="
  rationale: >
    The EU-residency posture is the FOUNDATION §3 default — every
    LM endpoint declared by the cookbook examples the project ships
    should classify as EU-resident under the shared guard, or be
    explicitly acknowledged as a non-EU exception under the
    documented override env var. A green ring across the three
    reference compile targets (n8n / Temporal / LangGraph) is the
    sovereignty floor; anything less than 1.0 means the project
    shipped a cookbook example that drifts from the documented
    posture without the override.
thresholds:
  - name: warn
    comparator: "<"
    value: 1.0
    severity: warn
  - name: breach
    comparator: "<"
    value: 0.9
    severity: high
measurement:
  source: composite
  aggregation: ratio
  formula: >
    For each LM endpoint extracted from a compiled example artifact
    under ``examples/<target>/<workflow>/`` on the evaluation commit
    (the same extraction the shared guard performs via
    ``extract_lm_endpoints`` against the parsed playbook), record one
    observation: 1 if ``classify_endpoint`` returns
    ``EndpointResidency.EU``, 0 otherwise (``NON_EU`` or ``UNKNOWN``).
    Aggregate as ratio across observations. The three-target ring
    (n8n, Temporal, LangGraph) is the canonical surface — per-target
    sub-ratios are a drill-down dimension, not a separate KPI.
    Reference visualisation: a horizontal bar chart of per-endpoint
    residency outcomes (1 = EU, 0 = NON_EU / UNKNOWN) per
    (workflow, target, endpoint) triple observed in the example
    suite, sliced by compile target, with a horizontal line at the
    EU-floor of 1 marking the residency predicate and the ratio
    aggregate annotated as the headline figure; the chart is the
    canonical operator-facing surface for this KPI. The committed
    reference rendering lives at
    ``content/metrics/lm_endpoint_eu_residency_coverage.viz.md`` —
    that file is the contract for the chart shape; the compile
    target renders the executable form against the example artifacts
    and the shared guard's allowlist at evaluation time.
  inputs:
    - name: declared_lm_endpoint
      description: >
        Single LM endpoint extracted from a compiled example
        artifact under ``examples/<target>/<workflow>/``. The
        extraction shape is pinned by the shared guard's
        ``extract_lm_endpoints`` walker at
        ``compilers/_shared/lm_endpoint_guard.py``, which traverses
        the parsed CACAO playbook and surfaces every endpoint a
        compiler would emit (``playbook_variables.LM_ENDPOINT.value``,
        ``workflow.<step>.x_secops_ng.lm.endpoint``, etc.). The
        catalog entry binds to that extractor's output, not to a
        vendor-specific LM client surface. Bound here as the
        executive_metrics worked example because that playbook
        exercises LM-facing steps across the three reference compile
        targets.
      playbook_ref: playbook.executive_metrics@v1
    - name: classification_outcome
      description: >
        Residency classification of one ``declared_lm_endpoint`` as
        returned by ``classify_endpoint`` in
        ``compilers/_shared/lm_endpoint_guard.py``. EU hosts match
        ``EU_ALLOWLIST_SUFFIXES`` (Mistral EU, Aleph Alpha,
        OVHcloud AI Endpoints, Scaleway Generative APIs) or carry
        an ``eu-*`` leading region label; NON_EU hosts carry a
        ``us-*`` / ``apac-*`` region label or terminate in
        ``.openai.com`` / ``.anthropic.com`` without an explicit EU
        subdomain prefix; everything else is UNKNOWN. Only EU
        outcomes count toward coverage so UNKNOWN endpoints do not
        silently improve the indicator. Bound here as the
        it_security_support_agent worked example because it carries
        LM-facing steps across the three-target ring covered by the
        per-example byte-parity goldens under ``tests/examples/``.
      playbook_ref: playbook.it_security_support_agent@v1
  window:
    duration: P1D
    sliding: false
playbook_refs:
  - playbook_id: playbook.executive_metrics@v1
  - playbook_id: playbook.it_security_support_agent@v1
  - playbook_id: playbook.phishing_triage@v1
external_refs:
  - name: SecOps-NG FOUNDATION §3 — Sovereignty
    source: SecOps-NG
    url: https://github.com/secops-ng/secops-ng-framework/blob/main/docs/FOUNDATION.md
  - name: SecOps-NG ROADMAP — F-SV-01 EU-resident LM endpoint guard
    source: SecOps-NG
    url: https://github.com/secops-ng/secops-ng-framework/blob/main/ROADMAP.md
  - name: GDPR — Chapter V cross-border transfers of personal data
    source: EU
    external_id: Regulation (EU) 2016/679, Chapter V
    url: https://eur-lex.europa.eu/eli/reg/2016/679/oj
  - name: NIS2 — Article 21(2)(d) supply chain security (motivating context — upstream-component residency)
    source: EU
    external_id: Directive (EU) 2022/2555, Art. 21(2)(d)
    url: https://eur-lex.europa.eu/eli/dir/2022/2555/oj
  - name: ENISA — Cloud security guidance, EU-residency considerations
    source: ENISA
    url: https://www.enisa.europa.eu/topics/cloud-and-big-data
maintainer: metrics-wg@secops-ng.org
foundation_property:
  - sovereignty
  - determinism
