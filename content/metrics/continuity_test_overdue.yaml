  - name: DORA — Article 11(6) annual testing of ICT business continuity policy
    source: EU
    external_id: Regulation (EU) 2022/2554, Art. 11(6)
    url: https://eur-lex.europa.eu/eli/reg/2022/2554/oj
  - name: ENISA — NIS2 essential/important entity guidance
    source: ENISA
    url: https://www.enisa.europa.eu/topics/cybersecurity-policy/nis-directive-new
  - name: ISO/IEC 27004 — Information security measurement guidance
    source: ISO
    external_id: ISO/IEC 27004:2016
maintainer: metrics-wg@secops-ng.org
foundation_property:
  - operability
  - auditability
