stable_id: kpi.coverage_threat_intel_feed@v1
content_version: 0.1.0
maturity: experimental
kind: kpi
title: Threat-intel feed coverage
summary: Ratio of in-scope threat-intel feeds the operator is consuming and matching
  against telemetry to the total feed population the community or operator has identified
  as relevant. Feed surface is vendor-neutral.
unit: ratio
direction: higher_is_better
target:
  value: 0.95
  comparator: '>='
  rationale: Community-recommended starting point for a coverage indicator. Operators
    tighten or loosen this target in their compile target configuration.
thresholds:
- name: warn
  comparator: <
  value: 0.95
  severity: warn
- name: breach
  comparator: <
  value: 0.8
  severity: high
measurement:
  source: composite
  aggregation: ratio
  formula: Ratio of in-scope assets, schedules, feeds, or surfaces covered by the
    named control surface to the total in-scope population, evaluated over a rolling
    window. Exclude entries where the in-scope population is unknown so the indicator
    does not silently improve on record-keeping gaps.
  inputs:
  - name: covered_population
    description: Count of in-scope entries currently under the named control surface.
  - name: total_population
    description: Count of in-scope entries the operator believes should be under the
      named control surface.
  window:
    duration: P30D
    sliding: true
playbook_refs:
- playbook_id: playbook.threat_intel_ingest@v1
  step_id: action--10000000-0000-4000-8000-000000000002
external_refs:
- name: NIS2 — Article 21(2)(b) incident-handling capability
  source: EU
  external_id: Directive (EU) 2022/2555, Art. 21(2)(b)
  url: https://eur-lex.europa.eu/eli/dir/2022/2555/oj
- name: ENISA — Threat Landscape methodology
  source: ENISA
  url: https://www.enisa.europa.eu/publications/enisa-threat-landscape
- name: ISO/IEC 27004 — Information security measurement guidance
  source: ISO
  external_id: ISO/IEC 27004:2016
maintainer: metrics-wg@secops-ng.org
