stable_id: kpi.coverage_threat_intel_feed@v1
content_version: 0.1.0
maturity: experimental
kind: kpi
title: Threat-intel feed coverage
summary: Ratio of in-scope threat-intel feeds the operator is consuming and matching
  against telemetry to the total feed population the community or operator has identified
  as relevant. Feed surface is vendor-neutral.
unit: ratio
direction: higher_is_better
target:
  value: 0.95
  comparator: '>='
  rationale: Community-recommended starting point for a coverage indicator. Operators
    tighten or loosen this target in their compile target configuration.
thresholds:
- name: warn
  comparator: <
  value: 0.95
  severity: warn
- name: breach
  comparator: <
  value: 0.8
  severity: high
measurement:
  source: composite
  aggregation: ratio
  formula: >
    Ratio of in-scope threat-intel feeds the operator is currently
    consuming and matching against telemetry to the total feed
    population the community or operator has identified as relevant,
    evaluated over a rolling window. Exclude feeds whose in-scope state
    is unknown so the indicator does not silently improve on
    record-keeping gaps.
    Reference visualisation: a per-feed-category stacked horizontal bar
    chart partitioned by coverage state (covered / uncovered), with the
    overall `covered_population / total_population` ratio annotated as
    the headline figure and the warn / breach thresholds overlaid on a
    companion ratio axis; the chart is the canonical operator-facing
    surface for this KPI and the compile target is the source of truth
    for the executable form. The committed reference rendering lives at
    `content/metrics/coverage_threat_intel_feed.viz.md` — that file is
    the contract for the chart shape; the compile target renders the
    executable form against operator data.
  inputs:
  - name: covered_population
    description: >
      Count of in-scope threat-intel feeds for which the operator has at
      least one activated upstream detection rule sourced from the feed
      and matching against operator telemetry inside the evaluation
      window. Carried on the OCSF Detection Finding the
      threat_intel_ingest activate-detection-rule step emits when an
      activated upstream rule matches subsequent telemetry — a feed
      counts as covered when at least one rule sourced from it produces
      a Detection Finding in the window (`finding_info.uid` records the
      rule-match identity, and the originating feed is carried on the
      rule's threat-intel provenance metadata). The catalog entry binds
      to that OCSF class shape, not to a vendor-specific TIP, blocklist,
      or SIEM rule object.
    playbook_step: action--10000000-0000-4000-8000-000000000006
    telemetry_ref: telemetry.ocsf.detection_finding@v1
    field: finding_info.uid
  - name: total_population
    description: >
      Count of in-scope threat-intel feeds the operator's scoping
      artifact declares as relevant. Sourced from the operator's feed
      scoping artifact rather than the telemetry stream — the catalog
      entry does not name a specific scoping file. Excluding this from
      a telemetry binding keeps the denominator stable against
      ingestion gaps in the feed-handling surface itself, matching the
      detection_coverage convention.
  window:
    duration: P30D
    sliding: true
telemetry_refs:
- telemetry.ocsf.detection_finding@v1
playbook_refs:
- playbook_id: playbook.threat_intel_ingest@v1
  step_id: action--10000000-0000-4000-8000-000000000002
external_refs:
- name: NIS2 — Article 21(2)(b) incident-handling capability
  source: EU
  external_id: Directive (EU) 2022/2555, Art. 21(2)(b)
  url: https://eur-lex.europa.eu/eli/dir/2022/2555/oj
- name: ENISA — Threat Landscape methodology
  source: ENISA
  url: https://www.enisa.europa.eu/publications/enisa-threat-landscape
- name: ISO/IEC 27004 — Information security measurement guidance
  source: ISO
  external_id: ISO/IEC 27004:2016
maintainer: metrics-wg@secops-ng.org
foundation_property:
  - operability
