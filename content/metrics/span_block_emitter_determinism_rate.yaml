stable_id: kpi.span_block_emitter_determinism_rate@v1
content_version: 0.1.0
maturity: experimental
kind: kpi
title: Shared OTel span-block emitter determinism rate
summary: >
  Ratio of helper-level span-block emitter determinism assertions
  that pass on the evaluation commit. The shared OTel span-block
  emitter under ``compilers/_shared/observability.py`` is the
  single-source-of-truth helper each reference compile target
  (n8n / Temporal / LangGraph) calls to wrap an emitted workflow step
  in an OpenTelemetry span — per F-CR-04, the shared helper
  ``documents the span and attribute schema and is referenced — not
  duplicated — by each per-target emitter``. The helper-level
  determinism contract is pinned at
  ``tests/compilers/_shared/test_observability.py`` and
  ``tests/compilers/_shared/test_audit_mirror_helper.py``: span-block
  output must be deterministic across two equivalent invocations,
  attribute keys must sort, ``None`` attributes must drop, multiline
  bodies must indent stably, and the audit-mirror module the helper
  renders must round-trip identically. This KPI is the helper-level
  layer; companions ``kpi.compiler_byte_parity_pass_rate@v1`` and
  ``kpi.cross_target_audit_envelope_parity_rate@v1`` pin the
  per-example and cross-target layers respectively.
unit: ratio
direction: higher_is_better
target:
  value: 1.0
  comparator: "=="
  rationale: >
    The shared helper is the single source of truth for the OTel
    span-attribute schema across the three reference compile
    targets. Per FOUNDATION §2 (Determinism) and the F-CR-04
    acceptance criteria, the helper-level emitter must be
    deterministic — same inputs MUST produce same bytes. Anything
    less than 1.0 means the helper itself is non-deterministic and
    every per-target emitter that imports it inherits the drift;
    the per-example goldens cannot stay green if the helper layer
    is red.
thresholds:
  - name: warn
    comparator: "<"
    value: 1.0
    severity: warn
  - name: breach
    comparator: "<"
    value: 0.95
    severity: high
measurement:
  source: composite
  aggregation: ratio
  formula: >
    For each helper-level determinism assertion exercised by
    ``python -m pytest tests/compilers/_shared/test_observability.py``
    and
    ``python -m pytest tests/compilers/_shared/test_audit_mirror_helper.py``
    on the evaluation commit, record one observation: 1 if the
    assertion passes, 0 if it fails. The assertion population is the
    subset of test functions in those two files that pin a
    determinism invariant of the shared span-block / audit-mirror
    helper:
    ``test_span_block_is_deterministic``,
    ``test_span_block_attribute_order_is_sorted``,
    ``test_span_block_drops_none_attributes``,
    ``test_span_block_empty_attributes_emits_empty_dict``,
    ``test_span_block_multiline_body_indents_correctly``,
    ``test_audit_mirror_module_is_deterministic``,
    ``test_audit_mirror_roundtrip``,
    ``test_envelope_is_deterministic``,
    ``test_byte_identical_envelope_across_synthetic_call_patterns``,
    ``test_append_is_idempotent``. Aggregate as ratio across
    observations. Reference visualisation: a horizontal bar chart of
    per-assertion outcomes (1 = pass, 0 = fail) sliced by the helper
    surface the assertion pins (span-block / audit-mirror), with a
    horizontal line at the pass-floor of 1 and the ratio aggregate
    annotated as the headline figure; the chart is the canonical
    operator-facing surface for this KPI. The committed reference
    rendering lives at
    ``content/metrics/span_block_emitter_determinism_rate.viz.md`` —
    that file is the contract for the chart shape; the compile target
    renders the executable form against the helper-level determinism
    test files at evaluation time.
  inputs:
    - name: span_block_emitter_determinism_assertion
      description: >
        Span-block emitter determinism assertion. Tests under
        ``tests/compilers/_shared/test_observability.py`` exercise
        the shared ``render_span_block`` (and sibling) helpers and
        assert: the same inputs produce byte-identical output across
        two invocations, attribute keys sort, ``None`` attributes
        drop, multiline bodies indent stably, and an empty
        attribute set still emits an empty dict. Bound here to the
        executive_metrics worked example because that playbook
        exercises the cross-target OTel wrapping the F-CR-04
        acceptance criteria pin against.
      playbook_ref: playbook.executive_metrics@v1
    - name: audit_mirror_helper_determinism_assertion
      description: >
        Audit-mirror helper determinism assertion. Tests under
        ``tests/compilers/_shared/test_audit_mirror_helper.py``
        exercise the shared ``render_audit_mirror_module`` and the
        ``AuditTrail`` API and assert envelope determinism, idempotent
        append, and byte-identical envelopes across synthetic call
        patterns. Bound here to the supply_chain_security worked
        example which carries the full three-target ring (n8n,
        temporal, langgraph) plus the OTel-wrapping assertion in
        each per-target file.
      playbook_ref: playbook.supply_chain_security@v1
  window:
    duration: P1D
    sliding: false
playbook_refs:
  - playbook_id: playbook.executive_metrics@v1
  - playbook_id: playbook.supply_chain_security@v1
  - playbook_id: playbook.asset_management@v1
external_refs:
  - name: SecOps-NG FOUNDATION §2 — Determinism
    source: SecOps-NG
    url: https://github.com/secops-ng/secops-ng-framework/blob/main/docs/FOUNDATION.md
  - name: NIS2 — Article 23 incident reporting timelines (motivating context — reviewable cross-target telemetry)
    source: EU
    external_id: Directive (EU) 2022/2555, Art. 23
    url: https://eur-lex.europa.eu/eli/dir/2022/2555/oj
  - name: ENISA — Threat Landscape methodology, telemetry-correlation discussion
    source: ENISA
    url: https://www.enisa.europa.eu/publications/enisa-threat-landscape
  - name: OpenTelemetry — Semantic conventions for spans
    source: OpenTelemetry
    url: https://opentelemetry.io/docs/specs/semconv/
maintainer: metrics-wg@secops-ng.org
foundation_property:
  - determinism
  - auditability
