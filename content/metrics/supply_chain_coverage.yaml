stable_id: kpi.supply_chain_coverage@v1
content_version: 0.1.0
maturity: experimental
kind: kpi
title: Supply-chain coverage — share of direct suppliers with a verified attestation record on the supply-chain-evidence stream
summary: >
  Performance indicator derived from the supply_chain_security
  playbook per-execution supply-chain-evidence stream. For each direct
  supplier in the operator's declared supplier register, the indicator
  asks whether at least one attestation record has been emitted to
  the evidence stream in the evaluation window with a
  non-`unverified` verdict. Falling values indicate the NIS2
  Art. 21(2)(d) direct-supplier attestation surface is receding —
  the performance counterpart to the sibling
  `kri.supplier_attestation_staleness@v1` residual-exposure indicator.

unit: ratio
direction: higher_is_better

target:
  value: 0.95
  comparator: ">="
  rationale: >
    Community-recommended starting point for a coverage indicator. A
    well-disciplined supply-chain-security practice has a verified
    attestation record on file for the vast majority of direct
    suppliers inside the operator's evaluation window; the residual
    5% accounts for suppliers newly onboarded whose first attestation
    has not yet been received. Operators under scoped programmes
    tighten this target with documented rationale in their scoped
    variants.

thresholds:
  - name: warn
    comparator: "<"
    value: 0.95
    severity: warn
  - name: breach
    comparator: "<"
    value: 0.80
    severity: high

measurement:
  source: workflow
  aggregation: ratio
  formula: >
    For each direct supplier in the operator's declared supplier
    register, count the supplier as covered if at least one
    supply-chain-evidence artifact emitted by the
    supply_chain_security playbook emit step
    (action--5c5c5c5c-0000-4000-8000-000000000003) in the evaluation
    window carries an `affected_supplier_handle` matching the
    supplier AND a non-`unverified` verdict on the closed assessment
    block. Suppliers with no evidence record on file at all, or
    whose most-recent record's `verdict` is `unverified` (the
    deferred-classification branch, treated as uncovered for
    coverage-accounting purposes), count against the denominator
    without contributing to the numerator. The coverage ratio is
    `covered_suppliers / total_registered`. Reference visualisation:
    a ratio-headline gauge with warn / breach band overlays over a
    per-supplier coverage drill-down; the committed reference
    rendering lives at
    `content/metrics/supply_chain_coverage.viz.md` — that file is
    the contract for the chart shape; the compile target renders the
    executable form against operator data.
  inputs:
    - name: covered_suppliers
      description: >
        Count of direct suppliers in the operator's supplier register
        with at least one supply-chain-evidence artifact on file in
        the evaluation window carrying a non-`unverified` verdict on
        the closed assessment block. Carried on the API Activity
        (class_uid 6003) observation the emit step writes at
        attestation publication; the affected supplier handle and
        verdict are the identity and coverage axes the count keys
        against. The catalog entry binds to that OCSF class shape,
        not to a vendor-specific supplier-registry API.
      playbook_ref: playbook.supply_chain_security@v1
      playbook_step: action--5c5c5c5c-0000-4000-8000-000000000003
      field: assessment.affected_supplier_handle
      telemetry_ref: telemetry.ocsf.api_activity@v1
    - name: total_registered
      description: >
        Count of direct suppliers declared in the operator's supplier
        register. Sourced from the operator's scoping artifact
        rather than the telemetry stream so the denominator is
        stable against evidence-store ingestion gaps, matching the
        cloud_posture_coverage and restore_drill_attestation_freshness
        conventions.
      playbook_ref: playbook.supply_chain_security@v1
  window:
    duration: P90D
    sliding: true

telemetry_refs:
  - telemetry.ocsf.api_activity@v1

playbook_refs:
  - playbook_id: playbook.supply_chain_security@v1
    step_id: action--5c5c5c5c-0000-4000-8000-000000000003

external_refs:
  - name: NIS2 — Article 21(2)(d) supply-chain security
    source: EU
    external_id: Directive (EU) 2022/2555, Art. 21(2)(d)
    url: https://eur-lex.europa.eu/eli/dir/2022/2555/oj
  - name: DORA — Article 28 register of information for ICT third-party service providers
    source: EU
    external_id: Regulation (EU) 2022/2554, Art. 28
    url: https://eur-lex.europa.eu/eli/reg/2022/2554/oj
  - name: CRA — Article 13(4) component due diligence
    source: EU
    external_id: Regulation (EU) 2024/2847, Art. 13(4)
    url: https://eur-lex.europa.eu/eli/reg/2024/2847/oj
  - name: NIST SP 800-53 Rev. 5 — SR-3 Supply Chain Controls and Processes
    source: NIST
    external_id: NIST SP 800-53 Rev. 5 SR-3
    url: https://csrc.nist.gov/projects/risk-management/sp800-53-controls/release-search#!/control?version=5.1&number=SR-3
  - name: ENISA — Good practices for supply-chain security
    source: ENISA
    url: https://www.enisa.europa.eu/topics/risk-management

maintainer: metrics-wg@secops-ng.org

foundation_property:
  - auditability
  - operability
