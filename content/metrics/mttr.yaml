stable_id: kpi.mttr_critical@v1
content_version: 0.1.0
maturity: experimental
kind: kpi
title: Mean time to respond — critical severity
summary: >
  Time elapsed between the first authoritative detection firing that opens
  an incident record and the first containment action recorded in the
  response playbook, scoped to incidents classified at critical severity.
  Measured end-to-end across the response pipeline so that triage latency,
  analyst handoffs, and orchestration step latency all contribute.
  SecOps-NG does not pick a response vendor; the catalog entry is
  vendor-neutral and the compile target is the source of truth for the
  executable form.

unit: minutes
direction: lower_is_better

target:
  value: 60
  comparator: "<="
  rationale: >
    Community-recommended starting point for the unscoped catalog
    baseline at critical severity. Lower-severity variants (for example
    kpi.mttr_high@v1) loosen this target and live as separate catalog
    entries.

thresholds:
  - name: warn
    comparator: ">"
    value: 60
    severity: warn
  - name: breach
    comparator: ">"
    value: 240
    severity: high

measurement:
  source: workflow
  aggregation: p95
  formula: >
    For each critical-severity incident closed within the evaluation
    window, compute (first_containment_action_timestamp -
    first_detection_fire_timestamp) in minutes. Aggregate as p95 across
    incidents. Exclude incidents where the containment step never fired
    (record-keeping gap) so the indicator does not silently improve when
    the response pipeline stalls.
    Reference visualisation: a horizontal bar chart of
    remediation_latency_minutes per closed critical incident in the
    window with the warn / breach thresholds overlaid as vertical
    lines and the p95 aggregate annotated as the headline figure; the
    bar chart is the canonical operator-facing surface for this KPI
    and the compile target is the source of truth for the executable
    form. The committed reference rendering lives at
    `content/metrics/mttr.viz.md` — that file is the contract for the
    chart shape; the compile target renders the executable form
    against operator data.
  inputs:
    - name: first_detection_fire
      description: >
        First authoritative detection firing that opened the incident
        record at critical severity. Carried on the OCSF Detection
        Finding meta-finding the detection_engineering measure-rule-
        version step emits and that SIEM rule matches downstream emit
        at runtime; the catalog entry binds to that OCSF class shape,
        not to a vendor-specific rule object. Catalog entry is
        detection-vendor neutral; the compile target resolves the
        concrete detection identifier.
      telemetry_ref: telemetry.ocsf.detection_finding@v1
      field: finding_info.uid
    - name: first_containment_action
      description: >
        First playbook step transition in the response workflow whose
        purpose is to limit blast radius (isolate, block, revoke,
        quarantine). Bound to the canonical containment step of the
        compiled response playbook. The resolution-endpoint timestamp
        is carried on the OCSF Incident Finding the incident_management
        playbook emits when the incident record transitions out of the
        initial-triage status into a containment-active status; the
        catalog entry binds to that OCSF class shape, not to a
        vendor-specific case-management object. The `incident.status_id`
        transition on that class is the evaluation anchor; the
        playbook_step name pins which transition counts as the
        first containment action in the compiled response playbook.
      playbook_step: containment
      telemetry_ref: telemetry.ocsf.incident_finding@v1
      field: incident.status_id
  window:
    duration: P30D
    sliding: true

telemetry_refs:
  - telemetry.ocsf.detection_finding@v1
  - telemetry.ocsf.incident_finding@v1

external_refs:
  # Primary regulatory anchors. Only IDs already named in
  # content/mappings/{nis2,dora}/*.yaml are listed.
  - name: NIS2 — Article 21(2)(b) incident-handling capability (respond)
    source: EU
    external_id: Directive (EU) 2022/2555, Art. 21(2)(b)
    url: https://eur-lex.europa.eu/eli/dir/2022/2555/oj
  - name: NIS2 — Article 23 incident reporting timelines (motivating context)
    source: EU
    external_id: Directive (EU) 2022/2555, Art. 23
    url: https://eur-lex.europa.eu/eli/dir/2022/2555/oj
  - name: DORA — Article 19(4)(a) initial-4h major-incident notification (motivating context)
    source: EU
    external_id: Regulation (EU) 2022/2554, Art. 19(4)(a)
    url: https://eur-lex.europa.eu/eli/reg/2022/2554/oj
  - name: ENISA — Threat Landscape methodology, response-latency discussion
    source: ENISA
    url: https://www.enisa.europa.eu/publications/enisa-threat-landscape
  - name: ISO/IEC 27004 — Information security measurement guidance
    source: ISO
    external_id: ISO/IEC 27004:2016

maintainer: metrics-wg@secops-ng.org
