stable_id: kpi.cra_notification_72h_on_time@v1
content_version: 0.1.0
maturity: experimental
kind: kpi
title: CRA 72-hour notification on-time rate
summary: >
  Ratio of CRA Article 14(2) 72-hour notifications dispatched within 72 hours of operator awareness to total in-scope notifications in the evaluation window. Measures whether the CRA Article 14(2) 72-hour regulator-notification
  clock is held by the operator's submission pipeline end-to-end, including
  the orchestration step latency between awareness and dispatch.
unit: ratio
direction: higher_is_better
target:
  value: 1.00
  comparator: ">="
  rationale: >
    Regulator-notification clocks under CRA Article 14 are hard
    obligations: the on-time rate target is 100% and any miss is a
    reportable compliance exception.
thresholds:
  - name: warn
    comparator: "<"
    value: 1.00
    severity: warn
  - name: breach
    comparator: "<"
    value: 0.95
    severity: critical
measurement:
  source: workflow
  aggregation: ratio
  formula: >
    For each Article 14(2) notification dispatched within the evaluation
    window, compute whether the dispatch timestamp is earlier than
    (awareness_timestamp + clock). Ratio = on_time_count /
    dispatched_count. Exclude in-scope cases whose dispatch step never
    fired so the indicator does not silently improve when the
    notification pipeline stalls.
    Reference visualisation: a horizontal bar chart of
    dispatch_margin_minutes per CRA Article 14(2) notification dispatched
    in the window, with a vertical line at zero marking the on-time
    predicate and the ratio aggregate annotated as the headline figure
    against the warn / breach bands; the chart is the canonical
    operator-facing surface for this KPI and the compile target is the
    source of truth for the executable form. The committed reference
    rendering lives at
    `content/metrics/cra_notification_72h_on_time.viz.md` — that file is the contract for
    the chart shape; the compile target renders the executable form
    against operator data.
  inputs:
    - name: awareness_timestamp
      description: >
        Operator-awareness timestamp recorded by the CRA reporting
        trigger assessment step, used as the start of the 72-hour clock.
        Carried on the OCSF Incident Finding event the vuln_intake
        reporting-trigger assessment step emits (status_id transition
        into the CRA-reportable state); the catalog entry binds to that
        OCSF class shape, not to a regulator-submission envelope.
      playbook_step: action--01a17a01-0000-4000-8000-000000000004
      telemetry_ref: telemetry.ocsf.incident_finding@v1
      field: start_time
    - name: notification_dispatch
      description: >
        Regulator-notification chain step transition that dispatches the
        72h notification with corrective / mitigating measures.
        Carried on the OCSF Incident Finding event the regulator-
        notification step emits (status_id transition into the notified
        state).
      playbook_step: action--01a17a01-0000-4000-8000-000000000006
      telemetry_ref: telemetry.ocsf.incident_finding@v1
      field: time
  window:
    duration: P30D
    sliding: true
telemetry_refs:
  - telemetry.ocsf.incident_finding@v1
playbook_refs:
  - playbook_id: playbook.vuln_intake@v1
    step_id: action--01a17a01-0000-4000-8000-000000000006
external_refs:
  - name: CRA — Article 14(2) reporting obligation
    source: EU
    external_id: Regulation (EU) 2024/2847, Art. 14
    url: https://eur-lex.europa.eu/eli/reg/2024/2847/oj
  - name: ENISA — single reporting platform for CRA Article 14 submissions
    source: ENISA
    url: https://www.enisa.europa.eu/
  - name: ISO/IEC 27004 — Information security measurement guidance
    source: ISO
    external_id: ISO/IEC 27004:2016
maintainer: metrics-wg@secops-ng.org
