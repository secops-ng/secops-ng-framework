stable_id: kpi.operator_onboarding_pass_rate@v1
content_version: 0.1.0
maturity: experimental
kind: kpi
title: Operator onboarding pass rate across examples runnable from a clean environment inside 30 minutes
summary: >
  Ratio of worked-example workflows under ``examples/`` on the
  evaluation commit that a first-time operator can bring up from a
  clean environment inside a 30-minute wall-clock budget by following
  only the shipped documentation — over the total worked-example
  count. FOUNDATION §4 (Operability) requires that a new operator
  can pick up a shipped example and land on a running workflow
  quickly; this KPI tracks whether the onboarding surface is
  holding up its side of the contract.
unit: ratio
direction: higher_is_better
target:
  value: 1.0
  comparator: "=="
  rationale: >
    Every shipped worked example should be bring-up-able from a
    clean environment inside 30 minutes by following the shipped
    documentation alone. Anything below 1.0 is an example where the
    onboarding docs, dependencies, or defaults are getting in the
    way of an operator picking the framework up.
thresholds:
  - name: warn
    comparator: "<"
    value: 1.0
    severity: warn
  - name: breach
    comparator: "<"
    value: 0.8
    severity: high
measurement:
  source: composite
  aggregation: ratio
  formula: >
    For each worked-example workflow under ``examples/`` on the
    evaluation commit, record one observation of the onboarding
    dry-run outcome: 1 if a first-time operator following the shipped
    documentation alone brings the example up in a clean environment
    inside a 30-minute wall-clock budget, 0 otherwise. Aggregate as
    ratio across observations. The committed reference visualisation
    lives at ``content/metrics/operator_onboarding_pass_rate.viz.md``
    — that file is the contract for the chart shape; the compile
    target renders the executable form at evaluation time.
  inputs:
    - name: onboarding_dry_run_observation
      description: >
        One first-time-operator onboarding dry-run against a worked
        example under ``examples/<workflow>/``, measured in a clean
        environment against the shipped documentation and pinned to
        a 30-minute wall-clock budget.
      field: activity_id
      telemetry_ref: telemetry.ocsf.api_activity@v1
  window:
    duration: P30D
    sliding: false
external_refs:
  - name: SecOps-NG FOUNDATION §4 — Operability
    source: SecOps-NG
    url: https://github.com/secops-ng/secops-ng-framework/blob/main/docs/FOUNDATION.md
  - name: OCSF — API Activity (class 6003)
    source: OCSF
    url: https://schema.ocsf.io/1.1.0/classes/api_activity
telemetry_refs:
  - telemetry.ocsf.api_activity@v1
maintainer: metrics-wg@secops-ng.org
foundation_property:
  - operability
