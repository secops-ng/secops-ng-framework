stable_id: kri.control_effectiveness@v1
content_version: 0.1.0
maturity: experimental
kind: kri
title: Control effectiveness — residual exposure from attestation state
summary: >
  Residual exposure indicator derived from the operator's control
  attestation state. For each in-scope control, the most recent
  attestation places it in one of four states: effective, partially
  effective, ineffective, or overdue (no current attestation within the
  control's review cadence). The indicator is the share of in-scope
  controls NOT in the effective state, weighted equally across controls.
  Higher values mean more residual exposure from the control catalog's
  own self-assessment, before any compensating-control credit.

unit: ratio
direction: lower_is_better

target:
  value: 0.1
  comparator: "<="
  rationale: >
    Community-recommended starting point for the unscoped catalog
    baseline. Operators under DORA or NIS2 essential-entity scope
    typically set this lower in their own scoped variants and split it
    per control family.

thresholds:
  - name: warn
    comparator: ">"
    value: 0.1
    severity: warn
  - name: breach
    comparator: ">"
    value: 0.25
    severity: high
  - name: critical
    comparator: ">"
    value: 0.5
    severity: critical

measurement:
  source: control
  aggregation: ratio
  formula: >
    Let K = set of in-scope controls. For each control k in K, take its
    most recent attestation as of the evaluation timestamp. Let
    E = subset of K whose latest attestation is `effective`. Report
    (|K| - |E|) / |K|. Controls without any attestation, or whose
    latest attestation predates the control's declared review cadence,
    count as overdue (i.e. NOT effective). Compensating-control credit
    is out of scope of this indicator and lives in a separate KRI.
    Reference visualisation: a ratio-headline gauge with warn / breach
    / critical overlays over a per-control-family non-effective-share
    drill-down; the committed reference rendering lives at
    `content/metrics/control_effectiveness.viz.md` — that file is the
    contract for the chart shape; the compile target renders the
    executable form against operator data.
  inputs:
    - name: in_scope_controls
      description: >
        Set of controls the operator has declared in scope. Carried on
        the OCSF Compliance Finding event the operator's control
        catalog emits at each attestation cycle — every in-scope
        control surfaces as one Compliance Finding record keyed on
        `compliance.control` (the catalog control identifier), so the
        in-scope population is the distinct set of control identifiers
        observed across the cycle. The catalog entry binds to that
        OCSF class shape, not to a vendor-specific GRC, SSP, or
        attestation-tool object.
      telemetry_ref: telemetry.ocsf.compliance_finding@v1
      field: compliance.control
    - name: latest_attestation
      description: >
        Most recent attestation per control as of the evaluation
        timestamp. Carried on the same OCSF Compliance Finding event
        the operator's control catalog emits at each attestation
        cycle — the latest record per `compliance.control` carries the
        effectiveness state on `compliance.status_id` (mapped to
        effective / partially effective / ineffective in
        `compliance.status`) and the attestation timestamp on `time`,
        anchoring both axes the indicator needs on the same OCSF class
        as the in-scope-controls input. A control whose latest
        attestation predates its declared review cadence counts as
        overdue (NOT effective) per the formula.
      telemetry_ref: telemetry.ocsf.compliance_finding@v1
      field: compliance.status_id
  window:
    duration: P1D
    sliding: false

telemetry_refs:
  - telemetry.ocsf.compliance_finding@v1

external_refs:
  # Primary regulatory anchors. Only IDs already named in
  # content/mappings/{nis2,dora}/*.yaml are listed.
  - name: NIS2 — Article 21(2)(f) effectiveness assessment of risk-management measures
    source: EU
    external_id: Directive (EU) 2022/2555, Art. 21(2)(f)
    url: https://eur-lex.europa.eu/eli/dir/2022/2555/oj
  - name: NIS2 — Article 21 risk-management measures (umbrella)
    source: EU
    external_id: Directive (EU) 2022/2555, Art. 21
    url: https://eur-lex.europa.eu/eli/dir/2022/2555/oj
  # DORA: no natural anchor in content/mappings/dora/*.yaml — the
  # files we ship cover Art. 18/19/28/30 (incident classification +
  # reporting, third-party register, contractual clauses) and
  # Art. 9 vulnerability management. The umbrella ICT
  # risk-management-framework article (Art. 6) is not yet in the
  # mappings tree; leave unanchored on the DORA side until it lands.
  - name: DORA — ICT risk-management framework (umbrella context)
    source: EU
    external_id: Regulation (EU) 2022/2554
    url: https://eur-lex.europa.eu/eli/reg/2022/2554/oj
  - name: ISO/IEC 27004 — Information security measurement guidance
    source: ISO
    external_id: ISO/IEC 27004:2016
  - name: ENISA — Risk management methodology
    source: ENISA
    url: https://www.enisa.europa.eu/topics/risk-management

maintainer: metrics-wg@secops-ng.org
