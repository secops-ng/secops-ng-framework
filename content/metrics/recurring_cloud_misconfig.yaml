stable_id: kri.recurring_cloud_misconfig@v1
content_version: 0.1.0
maturity: experimental
kind: kri
title: Recurring cloud misconfiguration rate
summary: Ratio of cloud_misconfiguration findings re-observed within the evaluation
  window after a prior remediation closed them to total findings observed in the window.
  Rising values indicate that remediations are not durable.
unit: ratio
direction: lower_is_better
measurement:
  source: composite
  aggregation: ratio
  formula: 'Computed from the lower content layers per the inputs below. The catalog
    entry is the contract; the compile target is the source of truth for the executable
    form. Reference visualisation: a ratio-headline gauge over a per-rule-family
    recurrence-rate drill-down, sliced by cloud-misconfiguration rule family; the
    committed reference rendering lives at `content/metrics/recurring_cloud_misconfig.viz.md`
    — that file is the contract for the chart shape; the compile target renders the
    executable form against operator data.'
  inputs:
  - name: numerator
    description: >
      Population of cloud_misconfiguration findings re-observed within
      the evaluation window after a prior remediation had closed them.
      Carried on the OCSF Detection Finding the cloud-posture surface
      emits at each posture-rule firing; the recurring subset is the set
      of findings whose `finding_info.uid` resolves to a posture-rule /
      container pair that had a prior closed state earlier in the case
      ledger and re-fired inside the window. The catalog entry binds to
      that OCSF class shape, not to a vendor-specific CSPM finding
      object.
    telemetry_ref: telemetry.ocsf.detection_finding@v1
    field: finding_info.uid
  - name: denominator
    description: >
      Reference population of all cloud_misconfiguration findings
      observed in the evaluation window, regardless of whether the
      finding represents a first occurrence or a recurrence. Carried on
      the same OCSF Detection Finding class as the numerator; the
      catalog entry binds to that OCSF class shape, not to a vendor-
      specific CSPM finding object.
    telemetry_ref: telemetry.ocsf.detection_finding@v1
    field: finding_info.uid
  window:
    duration: P30D
    sliding: true
telemetry_refs:
- telemetry.ocsf.detection_finding@v1
playbook_refs:
- playbook_id: playbook.cloud_misconfiguration@v1
  step_id: action--30000000-0000-4000-8000-000000000005
- playbook_id: playbook.cloud_misconfiguration@v1
  step_id: action--30000000-0000-4000-8000-00000000000b
