stable_id: kpi.mttd_exfil@v1
content_version: 0.1.0
maturity: experimental
kind: kpi
title: Mean time to detect — data exfiltration
summary: Time elapsed between the earliest observable evidence in the operator's telemetry
  stream and the first authoritative detection firing that opens an incident record,
  scoped to incidents that involve confirmed or suspected exfiltration of operator-controlled
  data. Measured end-to-end across the detection pipeline so that ingestion, enrichment,
  and rule-evaluation latency all contribute. SecOps-NG does not pick a detection
  vendor; the catalog entry is vendor-neutral and the compile target is the source
  of truth for the executable form.
unit: minutes
direction: lower_is_better
measurement:
  source: composite
  aggregation: p95
  formula: 'For each incident in scope closed within the evaluation window, compute
    (first_detection_fire_timestamp - earliest_telemetry_event_timestamp) in minutes
    and aggregate as p95. Exclude incidents where the earliest telemetry timestamp
    is unknown so the indicator does not silently improve when ingestion breaks.
    Reference visualisation: a horizontal bar chart of detection_latency_minutes per
    closed exfiltration-rooted incident in the window with the p95 aggregate annotated
    as the headline figure; this scoped variant inherits the threshold-band shape from
    kpi.mttd@v1 and operators with NIS2 Art. 23 early-warning obligations typically
    tighten exfiltration-specific numeric values in their own scoped overrides given
    the reporting clock anchored on this metric. The committed reference rendering
    lives at `content/metrics/mttd_exfil.viz.md` — that file is the contract for the
    chart shape; the compile target renders the executable form against operator data.'
  inputs:
  - name: earliest_telemetry_event
    description: Earliest event in the telemetry stream that, in hindsight, was part
      of the incident's causal chain.
  - name: first_detection_fire
    description: First authoritative detection firing that opened the incident record.
      Catalog entry is detection-vendor-neutral.
  window:
    duration: P30D
    sliding: true
playbook_refs:
