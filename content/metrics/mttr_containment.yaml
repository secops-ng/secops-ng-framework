stable_id: kpi.mttr_containment@v1
content_version: 0.1.0
maturity: experimental
kind: kpi
title: Mean time to respond — containment (all incidents)
summary: Time elapsed between the first authoritative detection firing and the first
  recorded response action in the playbook, scoped to all incidents closed within
  the evaluation window, measuring time to first containment action. Measured end-to-end
  across the response pipeline so that triage latency, analyst handoffs, and orchestration
  step latency all contribute. SecOps-NG does not pick a response vendor; the catalog
  entry is vendor-neutral and the compile target is the source of truth for the executable
  form.
unit: minutes
direction: lower_is_better
measurement:
  source: workflow
  aggregation: p95
  formula: 'For each incident in scope closed within the evaluation window, compute
    (first_response_action_timestamp - first_detection_fire_timestamp) in minutes
    and aggregate as p95. Exclude incidents where the scoped response step never fired
    so the indicator does not silently improve when the response pipeline stalls.
    Reference visualisation: a horizontal bar chart of remediation_latency_minutes
    per closed in-scope incident in the window with the p95 aggregate annotated as
    the headline figure; this scoped variant inherits the threshold-band shape from
    kpi.mttr_critical@v1 and operators typically tune containment-specific numeric
    values in their own scoped overrides. The committed reference rendering lives
    at `content/metrics/mttr_containment.viz.md` — that file is the contract for
    the chart shape; the compile target renders the executable form against operator
    data.'
  inputs:
  - name: first_detection_fire
    description: First authoritative detection firing that opened the incident record
      at the scoped class. Carried on the OCSF Detection Finding meta-finding the
      detection_engineering measure-rule-version step emits and that SIEM rule matches
      downstream emit at runtime; the catalog entry binds to that OCSF class shape,
      not to a vendor-specific rule object.
    telemetry_ref: telemetry.ocsf.detection_finding@v1
    field: finding_info.uid
  - name: first_response_action
    description: First playbook step transition whose purpose matches the scoped response
      class (containment). Bound to the canonical step of the compiled response playbook.
      The resolution-endpoint timestamp is carried on the OCSF Incident Finding the
      incident_management playbook emits when the incident record transitions out of
      the initial-triage status into a containment-active status; the catalog entry
      binds to that OCSF class shape, not to a vendor-specific case-management object.
      The `incident.status_id` transition on that class is the evaluation anchor;
      the playbook_step pins which transition counts as the first response action
      in the compiled response playbook.
    playbook_step: containment
    telemetry_ref: telemetry.ocsf.incident_finding@v1
    field: incident.status_id
  window:
    duration: P30D
    sliding: true
telemetry_refs:
- telemetry.ocsf.detection_finding@v1
- telemetry.ocsf.incident_finding@v1
playbook_refs:
- playbook_id: playbook.data_exfil@v1
  step_id: action--20000000-0000-4000-8000-000000000005
- playbook_id: playbook.ransomware_containment@v1
  step_id: action--30000000-0000-4000-8000-000000000005
- playbook_id: playbook.ransomware_containment@v1
  step_id: action--30000000-0000-4000-8000-000000000006
- playbook_id: playbook.ransomware_containment@v1
  step_id: action--30000000-0000-4000-8000-000000000007
