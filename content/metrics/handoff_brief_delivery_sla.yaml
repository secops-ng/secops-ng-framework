stable_id: kpi.handoff_brief_delivery_sla@v1
content_version: 0.1.0
maturity: experimental
kind: kpi
title: Handoff-brief delivery SLA
summary: Ratio of shift-handoff or on_call_rotation handoff briefs delivered within
  their committed time-window to total in-scope handoffs in the evaluation window.
  Rising values indicate durable handoff hygiene.
unit: ratio
direction: higher_is_better
measurement:
  source: composite
  aggregation: ratio
  formula: >
    Computed from the lower content layers per the inputs below. The
    catalog entry is the contract; the compile target is the source of
    truth for the executable form. Reference visualisation: a horizontal
    bar chart of delivery_margin_minutes per dispatched handoff in the
    evaluation window, sliced by handoff kind, with a vertical line at
    zero marking the on-time predicate and the ratio aggregate
    annotated as the headline figure; the chart is the canonical
    operator-facing surface for this KPI. The committed reference
    rendering lives at
    `content/metrics/handoff_brief_delivery_sla.viz.md` — that file is
    the contract for the chart shape; the compile target renders the
    executable form against operator data.
  inputs:
  - name: numerator
    description: >
      Population of dispatched shift-handoff briefs whose
      notify-incoming-on-call delivery dispatch landed inside the
      committed time-window for the rotation boundary. Carried on the
      OCSF API Activity event the on_call_rotation
      notify-incoming-on-call step emits at delivery dispatch
      (request metadata records compose-time and deliver-time
      independently so the on-time predicate can be evaluated against
      the operator's pre-bound channel). The catalog entry binds to
      that OCSF class shape, not to a vendor-specific paging,
      messaging, or email product.
    playbook_step: action--30000000-0000-4000-8000-000000000006
    telemetry_ref: telemetry.ocsf.api_activity@v1
    field: time
  - name: denominator
    description: >
      Reference population of in-scope shift-handoff briefs the
      on_call_rotation generate-handoff-brief step composed for
      rotation boundaries in the evaluation window. Carried on the
      OCSF API Activity event the generate-handoff-brief step emits at
      brief-artifact emission to the structured handoff store
      (start_time anchors the compose-time event for each composed
      brief), regardless of whether the subsequent delivery dispatch
      landed inside the committed window.
    playbook_step: action--30000000-0000-4000-8000-000000000005
    telemetry_ref: telemetry.ocsf.api_activity@v1
    field: start_time
  window:
    duration: P30D
    sliding: true
telemetry_refs:
- telemetry.ocsf.api_activity@v1
playbook_refs:
- playbook_id: playbook.on_call_rotation@v1
  step_id: action--30000000-0000-4000-8000-000000000005
- playbook_id: playbook.on_call_rotation@v1
  step_id: action--30000000-0000-4000-8000-000000000006
external_refs:
- name: NIS2 — Article 21(2)(b) incident-handling capability
  source: EU
