stable_id: kpi.handoff_brief_delivery_sla@v1
content_version: 0.1.0
maturity: experimental
kind: kpi
title: Handoff-brief delivery SLA
summary: Ratio of shift-handoff or on-call-rotation handoff briefs delivered within
  their committed time-window to total in-scope handoffs in the evaluation window.
  Rising values indicate durable handoff hygiene.
unit: ratio
direction: higher_is_better
measurement:
  source: composite
  aggregation: ratio
  formula: Computed from the lower content layers per the inputs below. The catalog
    entry is the contract; the compile target is the source of truth for the executable
    form.
  inputs:
  - name: numerator
    description: Population matching the indicator's success (or, for lower-is-better,
      failure) condition.
  - name: denominator
    description: Reference population the numerator is normalised against.
  window:
    duration: P30D
    sliding: true
playbook_refs:
- playbook_id: playbook.on_call_rotation@v1
  step_id: action--30000000-0000-4000-8000-000000000005
- playbook_id: playbook.on_call_rotation@v1
  step_id: action--30000000-0000-4000-8000-000000000006
external_refs:
