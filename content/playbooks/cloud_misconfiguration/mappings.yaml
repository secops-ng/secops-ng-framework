# Cross-references for the cloud_misconfiguration playbook.
#
# This file is the playbook's outbound view of the content model: it
# pins OSCAL controls, MITRE D3FEND defensive techniques, OCSF event
# classes consumed/emitted, and the EU regulatory clauses this
# playbook helps operationalise. Inbound references live in
# content/mappings/{nis2,dora}/ so the graph is closed in both
# directions.
#
# This playbook is the operational engine for the CSPM / posture-
# management response chain: it ingests a posture finding, enriches
# it with cloud-resource ownership, suppresses known-benign or
# already-exception'd deviations, notifies the resource owner along
# the operator's pre-bound channel, drives an attested guided
# remediation, and re-scans to verify the fix actually stuck. A
# failing re-scan escalates and is tracked against the recurring-
# misconfiguration KRI so chronic deviation surfaces in the metrics
# layer rather than quietly closing on an unverified attempt.
#
# Upstream / downstream closure: this playbook is content-model
# independent of the incident_management engine — a posture finding
# that escalates here stays inside the CSPM remediation surface and
# does not auto-route into the regulator-notification chain unless
# the operator's classification lifts the case to incident-grade.
# When that lift happens, the case envelope is handed off to
# playbook.incident_management@v1 the same way the other
# detection-chain playbooks do (the data-exfil overlay documents
# that pattern in full).
#
# CRA closure: the schema's top-level keys are fixed
# (oscal/d3fend/ocsf/nis2/dora). CRA cross-references for this
# playbook are therefore expressed inbound only — entries
# cra:annex-i-1-secure-by-default and cra:annex-i-1-attack-surface
# in content/mappings/cra/annex-i-1-essential-cybersecurity.yaml
# already list playbook.cloud_misconfiguration@v1 on their
# playbook_refs (secure-by-default configuration and minimal-
# attack-surface essential-cybersecurity-requirements on Annex I §1).
# No outbound CRA Art. 14 incident-reporting closure is asserted
# here: a posture finding only becomes Art. 14 reportable when it
# rises to incident-grade and is dispatched via
# playbook.incident_management@v1.
#
# GDPR closure: inbound GDPR clause files are not carried as YAML
# cross-references in content/mappings/gdpr/ today (the regime is
# expressed there as per-workflow Records of Processing Activity,
# not as Art. 32 / 33 clause anchors); the per-workflow Art. 30 RoPA
# for this playbook lives at
# content/mappings/gdpr/data-flow-cloud_misconfiguration.md and
# covers the resource-ownership enrichment and owner-notification
# processing the steps below operate on. When a GDPR clause-file
# convention lands, an inbound entry for Art. 32 (security of
# processing — appropriate technical and organisational measures,
# the legal anchor a misconfiguration of personal-data-bearing
# resources actually trips) against this playbook can be added
# without a schema change.
#
# Schema: schemas/playbook-mappings.schema.json
playbook: playbook.cloud_misconfiguration@v1

oscal:
  # NIST SP 800-53 Rev. 5 controls exercised by the ingest, enrich,
  # suppress, notify, guided-remediation, re-scan and escalate steps.
  # Catalogue URLs resolve to the public NIST OSCAL repository.
  - control_ref: control.baseline_configuration@v1
    oscal_catalog: NIST SP 800-53 Rev. 5
    control_id: CM-2
    title: Baseline Configuration
    url: https://csrc.nist.gov/projects/risk-management/sp800-53-controls/release-search#!/control?version=5.1&number=CM-2
    notes: >-
      Anchors the ingest and re-scan steps as the documented baseline
      the CSPM rule fingerprint is evaluated against: a posture
      finding is by construction a deviation from a baseline
      configuration, and the re-scan re-evaluates the same baseline
      after the guided remediation has been applied.

  - control_ref: control.configuration_settings@v1
    oscal_catalog: NIST SP 800-53 Rev. 5
    control_id: CM-6
    title: Configuration Settings
    url: https://csrc.nist.gov/projects/risk-management/sp800-53-controls/release-search#!/control?version=5.1&number=CM-6
    notes: >-
      Covers the guided-remediation step: the operator-bound
      configuration change (IaC pull request or runbook execution)
      brings the affected resource back into conformance with the
      mandated configuration settings the deviation tripped against.

  - oscal_catalog: NIST SP 800-53 Rev. 5
    control_id: CM-8
    title: System Component Inventory
    url: https://csrc.nist.gov/projects/risk-management/sp800-53-controls/release-search#!/control?version=5.1&number=CM-8
    notes: >-
      Covers the enrich-resource-and-owner step: resolution of
      tenant, account, region, resource type, tags, and accountable
      owner against the operator's cloud-inventory and ownership
      graph is the discharge of the system-component-inventory
      discipline. The downstream owner-notification routing depends
      on this enrichment being trustworthy.

  - control_ref: control.access_enforcement@v1
    oscal_catalog: NIST SP 800-53 Rev. 5
    control_id: AC-3
    title: Access Enforcement
    url: https://csrc.nist.gov/projects/risk-management/sp800-53-controls/release-search#!/control?version=5.1&number=AC-3
    notes: >-
      Covers the guided-remediation step for the over-permissive-
      identity branch (public storage exposure, world-readable
      object stores, over-broad IAM policies): the remediation
      tightens the access-enforcement decision so only the declared
      principals retain access to the affected resource.

  - control_ref: control.least_privilege@v1
    oscal_catalog: NIST SP 800-53 Rev. 5
    control_id: AC-6
    title: Least Privilege
    url: https://csrc.nist.gov/projects/risk-management/sp800-53-controls/release-search#!/control?version=5.1&number=AC-6
    notes: >-
      Covers the guided-remediation step for the over-permissive-
      identity branch where the violation is a privilege-escalation
      pattern (wildcards on actions or resources, admin-equivalent
      roles bound to a workload identity): the remediation reduces
      the bound permissions to the documented minimum the workload
      requires.

  - oscal_catalog: NIST SP 800-53 Rev. 5
    control_id: SC-7
    title: Boundary Protection
    url: https://csrc.nist.gov/projects/risk-management/sp800-53-controls/release-search#!/control?version=5.1&number=SC-7
    notes: >-
      Covers the guided-remediation step for the over-permissive-
      baseline branch on network controls (security group / NSG /
      firewall rule allowing 0.0.0.0/0 on a sensitive port,
      missing private-endpoint enforcement): the remediation
      restores the documented boundary so traffic to and from the
      affected resource is constrained to the declared paths.

  - oscal_catalog: NIST SP 800-53 Rev. 5
    control_id: SC-28
    title: Protection of Information at Rest
    url: https://csrc.nist.gov/projects/risk-management/sp800-53-controls/release-search#!/control?version=5.1&number=SC-28
    notes: >-
      Covers the guided-remediation step for the missing-encryption
      branch (unencrypted storage volume, bucket without
      server-side-encryption, key-vault with deletion-protection
      disabled): the remediation enables the mandated at-rest
      protection on the affected resource.

  - oscal_catalog: NIST SP 800-53 Rev. 5
    control_id: SI-4
    title: System Monitoring
    url: https://csrc.nist.gov/projects/risk-management/sp800-53-controls/release-search#!/control?version=5.1&number=SI-4
    notes: >-
      Anchors the ingest step's input and the re-scan step's
      verification surface: the CSPM / posture-management layer
      that emits the originating Compliance Finding and that
      re-evaluates the rule after remediation is the operator's
      system-monitoring layer for cloud baselines.

  - oscal_catalog: NIST SP 800-53 Rev. 5
    control_id: IR-4
    title: Incident Handling
    url: https://csrc.nist.gov/projects/risk-management/sp800-53-controls/release-search#!/control?version=5.1&number=IR-4
    notes: >-
      Covers the notify-owner and escalate steps as the playbook's
      discharge of the incident-handling capability for the
      cloud-misconfiguration case set: a posture deviation is
      triaged, the responsible owner is paged along the operator's
      pre-bound channel, and a failing re-scan escalates to the
      security-engineering on-call so the case is not closed on an
      unverified remediation.

  - oscal_catalog: NIST SP 800-53 Rev. 5
    control_id: IR-5
    title: Incident Monitoring
    url: https://csrc.nist.gov/projects/risk-management/sp800-53-controls/release-search#!/control?version=5.1&number=IR-5
    notes: >-
      Covers the per-case timeline anchors the playbook stamps from
      ingest through guided remediation, re-scan and (where
      remediation fails) escalation: the MTTD, MTTR and
      cloud-posture-coverage KPIs plus the recurring-misconfig KRI
      declared on the CACAO x_secops_ng.metric_refs all read against
      the monitoring discipline this control demands.

d3fend:
  # MITRE D3FEND v1.0.0 defensive technique tags per playbook step.
  # CACAO step UUIDs are pinned where the technique applies to a
  # single step.
  - step: action--30000000-0000-4000-8000-000000000002
    d3fend_id: D3-RAPA
    d3fend_name: Resource Access Pattern Analysis
    url: https://d3fend.mitre.org/technique/d3f:ResourceAccessPatternAnalysis/
    notes: >-
      ingest finding — the CSPM / posture-management layer's
      continuous evaluation of cloud resources against a documented
      baseline is the Detect-tactic resource-access-pattern-analysis
      this step's input is sourced from. The CACAO external_references
      cite D3-RAPA directly as the upstream Detect technique.

  - step: action--30000000-0000-4000-8000-000000000003
    d3fend_id: D3-AI
    d3fend_name: Asset Inventory
    url: https://d3fend.mitre.org/technique/d3f:AssetInventory/
    notes: >-
      enrich resource and owner — resolution of the affected
      resource against the cloud inventory (tenant, account,
      region, resource type, tags) and the ownership graph
      (accountable owner, classification) is the Harden-tactic
      asset-inventory discipline the rest of the playbook depends
      on for routing and severity resolution.

  - step: action--30000000-0000-4000-8000-000000000006
    d3fend_id: D3-IRA
    d3fend_name: Incident Response Analysis
    url: https://d3fend.mitre.org/technique/d3f:IncidentResponseAnalysis/
    notes: >-
      notify owner — hand-off along the operator's pre-bound channel
      (ticketing / chat / paging per __severity__) carrying the
      finding, the affected resource, the violated baseline, and a
      pointer to the guided-remediation runbook the next step
      references.

  - step: action--30000000-0000-4000-8000-000000000007
    d3fend_id: D3-SCP
    d3fend_name: System Configuration Permissions
    url: https://d3fend.mitre.org/technique/d3f:SystemConfigurationPermissions/
    notes: >-
      guided remediation — application of the remediation bound to
      the violated baseline rule via attested change (IaC pull
      request or runbook execution). The operator's IaC-policy /
      configuration-permissions surface is the Harden-tactic
      system-configuration-permissions control the remediation
      lands through; the CACAO external_references cite D3-SCP
      directly as the upstream Harden technique.

  - step: action--30000000-0000-4000-8000-000000000008
    d3fend_id: D3-RAPA
    d3fend_name: Resource Access Pattern Analysis
    url: https://d3fend.mitre.org/technique/d3f:ResourceAccessPatternAnalysis/
    notes: >-
      re-scan — targeted re-evaluation of the same baseline rule
      against the affected resource. The verdict
      (__remediation_verified__) is the Detect-tactic
      resource-access-pattern-analysis output that closes the case
      on success or routes into escalation on failure.

  - step: action--30000000-0000-4000-8000-00000000000b
    d3fend_id: D3-IRA
    d3fend_name: Incident Response Analysis
    url: https://d3fend.mitre.org/technique/d3f:IncidentResponseAnalysis/
    notes: >-
      escalate — composition of the escalation payload (finding,
      attempted remediation, failing re-scan evidence) and
      hand-off along the operator's pre-bound paging channel,
      tracked against the recurring-misconfiguration KRI so
      chronic unremediated deviations surface in the metrics layer.

ocsf:
  # OCSF v1.3.0 telemetry bindings. The ingest step consumes the
  # originating CSPM posture finding shaped as a Compliance Finding;
  # the same class is also produced by Sigma-rule matches against
  # cloud audit logs cited under the CACAO x_secops_ng.detection_refs
  # (cspm_finding_critical, public_storage_bucket) delivered as a
  # Detection Finding the operator's posture-management layer
  # normalises into the Compliance Finding shape before this
  # playbook sees it. The re-scan step emits a fresh Compliance
  # Finding (verifying or refuting the original deviation). The
  # suppress, notify-owner and escalate steps emit Compliance
  # Findings keyed to the case so the MTTD / MTTR / cloud-posture-
  # coverage KPIs and the recurring-misconfig KRI can audit timing
  # and recurrence.
  #
  # Cloud Resources Inventory Info (class_uid 5023, OCSF 1.4.0)
  # feeds the resource-and-owner enrichment step. The original gap
  # note deferred this binding until the catalogue baseline lifted
  # to 1.4.0 — which every artifact under content/telemetry/ now
  # pins — and anticipated the artifact under the invented name
  # `cloud_resource_inventory`; it landed under the exact upstream
  # class name instead. Provenance: #875.
  - id: telemetry.ocsf.cloud_resources_inventory_info@v1
    category_uid: 5
    category_name: Discovery
    class_uid: 5023
    class_name: Cloud Resources Inventory Info
    ocsf_version: "1.4.0"
    direction: consumes
    notes: >-
      Consumed at enrich-resource-and-owner: the inventory record
      for the misconfigured resource supplies its type, account
      and ownership metadata so the finding routes to the owning
      team rather than a shared queue. Schema:
      https://schema.ocsf.io/1.4.0/classes/cloud_resources_inventory_info
  - id: telemetry.ocsf.compliance_finding@v1
    category_uid: 2
    category_name: Findings
    class_uid: 2003
    class_name: Compliance Finding
    ocsf_version: "1.3.0"
    direction: consumes
    notes: >-
      Consumed at the ingest step: the originating CSPM / posture
      finding (rule fingerprint, affected resource, evaluated
      baseline, first-observed timestamp) is delivered as a
      Compliance Finding the playbook normalises and hydrates with
      ownership context. Schema:
      https://schema.ocsf.io/1.3.0/classes/compliance_finding

  - id: telemetry.ocsf.detection_finding@v1
    category_uid: 2
    category_name: Findings
    class_uid: 2004
    class_name: Detection Finding
    ocsf_version: "1.3.0"
    direction: consumes
    notes: >-
      Consumed at the ingest step alongside the Compliance Finding
      when the originating signal is an upstream Sigma match
      against cloud audit logs (cspm_finding_critical,
      public_storage_bucket referenced under the CACAO
      x_secops_ng.detection_refs) rather than a native CSPM
      baseline evaluation. The operator's posture-management layer
      normalises both shapes into the Compliance Finding the rest
      of the playbook branches on. Schema:
      https://schema.ocsf.io/1.3.0/classes/detection_finding

  - id: telemetry.ocsf.compliance_finding@v1
    category_uid: 2
    category_name: Findings
    class_uid: 2003
    class_name: Compliance Finding
    ocsf_version: "1.3.0"
    direction: emits
    notes: >-
      Emitted by the suppress, notify-owner, re-scan and escalate
      steps: each milestone (suppression record, owner notification
      stamp, re-scan verdict, escalation submission) is recorded as
      a Compliance Finding keyed to the originating case so the
      MTTD / MTTR / cloud-posture-coverage KPIs and the recurring-
      misconfig KRI declared on the CACAO x_secops_ng.metric_refs
      can audit on-time progression and chronic deviation. Schema:
      https://schema.ocsf.io/1.3.0/classes/compliance_finding

nis2:
  # Inbound entries live at content/mappings/nis2/article-21-2-e.yaml
  # (id nis2:art-21-2-e — security in network and information
  # systems acquisition, development and maintenance) and
  # content/mappings/nis2/article-21-2-i.yaml
  # (id nis2:art-21-2-i — HR security, access control and asset
  # management), both backlinking to playbook.cloud_misconfiguration@v1.
  - mapping_id: nis2:art-21-2-e
    article: 21(2)(e)
    notes: >-
      NIS2 Art. 21(2)(e) requires security in network and
      information systems acquisition, development and maintenance.
      The cloud_misconfiguration playbook is the operational
      discharge of the baseline-deviation, IaC guardrail, and
      remediation surface this obligation demands: continuous
      evaluation of cloud-baseline rules, attested remediation, and
      re-scan-driven verification so a deviation cannot quietly
      persist.

  - mapping_id: nis2:art-21-2-i
    article: 21(2)(i)
    notes: >-
      NIS2 Art. 21(2)(i) requires HR security, access-control, and
      asset-management policies. The cloud_misconfiguration
      playbook discharges the asset-management and least-privilege
      surface for cloud resources: the enrich step resolves the
      affected resource against the cloud inventory and ownership
      graph (asset management), and the guided-remediation step
      reduces over-permissive identity bindings to the documented
      minimum (least privilege) on the over-permissive-identity
      branch.

dora:
  # Inbound entries live at content/mappings/dora/article-9-and-rts-vuln-mgmt.yaml
  # (id dora:art-9-vuln-mgmt — protection and prevention, including
  # secure-configuration baselines under the JC RTS on ICT risk
  # management framework, Commission Delegated Regulation (EU)
  # 2024/1774), backlinking to playbook.cloud_misconfiguration@v1.
  - mapping_id: dora:art-9-vuln-mgmt
    article: "9(4)(a)"
    notes: >-
      DORA Art. 9(4)(a), operationalised by the JC RTS on ICT risk
      management framework (Commission Delegated Regulation (EU)
      2024/1774) Article 10, requires documented vulnerability and
      patch management procedures covering identification, risk-
      based prioritisation, and tracking of remediation to closure.
      The cloud_misconfiguration playbook discharges the
      cloud-baseline-deviation slice of that obligation: ingest a
      posture finding, enrich it with ownership, drive guided
      remediation, re-scan to verify closure, and escalate when
      remediation does not stick so the recurring-misconfig KRI
      catches chronic exceptions.

cra:
  # Inbound entries live at:
  # - content/mappings/cra/annex-i-1-essential-cybersecurity.yaml (`cra:annex-i-1-secure-by-default`, `cra:annex-i-1-attack-surface`)
  # All backlink to playbook.cloud_misconfiguration@v1.
  - mapping_id: cra:annex-i-1-secure-by-default
    article: "Annex I §1(b)"
    notes: >-
      Outbound backlink for the inbound entry in annex-i-1-essential-cybersecurity.yaml.
  - mapping_id: cra:annex-i-1-attack-surface
    article: "Annex I §1(j)"
    notes: >-
      Outbound backlink for the inbound entry in annex-i-1-essential-cybersecurity.yaml.
