# Cross-references for the ddos_response playbook.
#
# This file is the playbook's outbound view of the content model: it
# pins OSCAL controls, OCSF event classes consumed/emitted, and the EU
# regulatory clauses this playbook helps operationalise. Inbound
# references live in content/mappings/{nis2,dora,cra}/ so the graph is
# closed in both directions.
#
# This playbook operationalises the incident-handling capability for
# the availability/denial-of-service attack dimension: detect an
# availability anomaly against a monitored service, classify the
# attack vector (volumetric, protocol, application-layer), engage the
# operator's pre-bound mitigation surface (upstream scrubbing,
# rate-limit / WAF posture change, or failover to a documented
# standby), validate restoration against the documented availability
# objective, capture the dated evidence record, and notify the
# incident-management owner. The playbook does not author the
# operator's anti-DDoS architecture; it operationalises a documented
# response posture that lives on the operator's network and
# continuity surfaces.
#
# Status: CORE. The SKELETON overlay anchored the regulatory and
# control surface (NIS2 Art. 21(2)(b) inbound + OSCAL IR-4 / IR-5);
# this CORE layer adds the D3FEND defensive-technique bindings for
# the detect-availability-anomaly, classify-attack-vector, and
# validate-service-restoration steps, and closes the DORA mapping
# graph (inbound at content/mappings/dora/article-11-availability-
# response.yaml + outbound here). EXTEND-layer cards wire the
# time-to-mitigation and availability-restoration metric emitters
# against the operator's evidence store. CRA closure is deferred to
# a separate inbound-closure card under content/mappings/cra/ — the
# CRA orphan_skip entry for this playbook is left in place pending
# that work.
#
# D3FEND closure (per-step rationale):
#   - detect-availability-anomaly and validate-service-restoration
#     are pinned to D3-NTA (Network Traffic Analysis): the dated
#     examination of synthetic-probe results and edge / origin
#     throughput / error-rate / latency series against the documented
#     availability objective is the network-traffic-analysis
#     discipline D3-NTA names, narrowed to the operator's own
#     monitored services and the operator's own declared availability
#     objective — same technique, posture-readiness scope rather than
#     adversary-attribution scope. Read-only: the playbook records
#     observations and produces the dated availability-incident
#     record, it does not author the operator's detection surface.
#   - classify-attack-vector is pinned to D3-NTA on the same
#     network-traffic-analysis discipline applied to packet-capture /
#     flow-record sources to discriminate volumetric / protocol /
#     application-layer vectors. The classification record is the
#     audit-evident output of the analysis pass and conditions which
#     branch the engage-mitigation step takes.
#   - engage-mitigation is deliberately NOT pinned. The rate-limit /
#     WAF posture-change discipline maps onto D3-NTF (Network Traffic
#     Filtering) and D3-OTF (Outbound Traffic Filtering), and the
#     failover-engagement discipline maps onto D3-SCP (System
#     Configuration Permissions), but those Harden-tactic techniques
#     are the runtime enforcement disciplines owned by the operator's
#     network surface (upstream scrubbing provider, edge / WAF, DNS /
#     load-balancer failover orchestration), exercised under the
#     operator's pre-bound response posture. This playbook engages
#     those surfaces against a documented binding — it does not
#     author the filter rule, the scrubber binding, or the failover
#     target. Pinning a Harden-tactic D3FEND tag here would force the
#     technique onto a runtime-countermeasure surface this playbook
#     does not discharge, mirroring the MFA/CRYPTO precedent of
#     anchoring on Detect-tactic techniques rather than the Harden-
#     tactic technique that names the enforcement itself. The
#     architectural anchor for the rate-limit / WAF posture and the
#     failover-target designation belongs on a future
#     infra_posture_management overlay where posture authoring lives,
#     not on the per-event response. This gap is documented per the
#     HYG precedent rather than carrying a forced pin.
#   - evidence-capture is deliberately NOT pinned. Per-execution
#     artifact emission of the dated availability-incident record for
#     downstream audit consumption is an evidence-stream emission
#     discipline, not a runtime countermeasure or a detection step,
#     and forcing it onto a D3FEND tag would misrepresent the
#     technique. This step is anchored on the IR-5 OSCAL control
#     above. Mirrors the mfa_secured_comms / crypto_posture_management
#     / backup_recovery / cyber_hygiene_training evidence-capture gap
#     notes.
#   - notify-incident-management-owner is deliberately NOT pinned.
#     Delivery of the evidence reference to the incident-management
#     owner along the operator's pre-bound channel is a notification
#     discipline, not a defensive technique. Mirrors the
#     mfa_secured_comms notify-authentication-owner,
#     crypto_posture_management notify-crypto-owner, and
#     backup_recovery notify-continuity-owner gap notes.
# Detection bindings for individual availability-anomaly / vector-
# classification upstream rule fingerprints are consumed via the
# existing OCSF telemetry bindings (Network Activity 4001 on the
# observation side, API Activity 6003 on the engagement / emission
# side) rather than authored as Sigma references on this overlay; the
# operator's posture-management layer is the upstream of those
# signal shapes, and no stable Sigma rule ids are pinned on this
# overlay (the operator owns those fingerprints).
#
# Deliberate OSCAL omissions:
#   - CP-2 (Contingency Plan) is NOT pinned: this playbook operates
#     the per-incident response slice (detect-classify-mitigate-
#     validate) against an availability event, not the contingency-
#     plan authoring lifecycle. CP-2 anchors the operator's
#     plan-authoring surface, which lives in governance
#     documentation; pinning CP-2 here would conflate the per-event
#     mitigation discipline with the plan-authoring surface.
#   - SC-5 (Denial-of-service Protection) is NOT pinned: SC-5 anchors
#     the documented architectural defence (rate-limit posture,
#     upstream scrubber binding, failover-target designation), which
#     is the operator's standing posture rather than the per-incident
#     response this playbook operates. The architectural anchor
#     belongs on a future infra_posture_management overlay where
#     posture authoring lives, not on the per-event response.
#   - AU-2 (Event Logging) is NOT pinned: the playbook emits OCSF
#     records, but the operator's audit-event policy is upstream of
#     this playbook.
#
# DORA closure: the inbound entry on the DORA side lives at
# content/mappings/dora/article-11-availability-response.yaml (id
# dora:art-11-availability-response — DORA Art. 11 per-vector
# availability-incident response slice, detect-classify-mitigate-
# validate discharge against the availability/denial-of-service
# attack dimension). The matching outbound dora: entry below closes
# the graph. The per-vector availability-response slice is authored
# as a distinct DORA entry rather than overloaded onto the existing
# dora:art-11-response-recovery entry (which covers the documented
# incident-handling capability anchor paired with backup attestations
# and restore-drill records) — the two slices discharge independent
# operational disciplines and are mapped separately to preserve the
# atom-per-obligation shape DORA Art. 9 carries across vuln-mgmt /
# access-mgmt / crypto / authentication and DORA Art. 13 carries
# across the learning-loop / training-and-awareness slices. The
# lifecycle owner once the incident has been opened remains
# playbook.incident_management@v1, which already carries
# dora:art-18-classification, dora:art-19-initial-4h,
# dora:art-19-intermediate-72h, and dora:art-19-final-one-month on
# its overlay; ddos_response operationalises the per-vector response
# under that lifecycle, it does not replace it.
#
# CRA closure: the inbound entry on the CRA side lives at
# content/mappings/cra/annex-i-1-h-availability-ddos-response.yaml
# (id cra:annex-i-1-h-availability-ddos-response — Annex I §1(h)
# availability, per-event DDoS / availability-incident response
# lane). Third companion under §1(h) alongside
# cra:annex-i-1-availability (containment lane, pinned to
# ransomware_containment) and
# cra:annex-i-1-h-availability-restore-drill (restore-drill lane,
# pinned to backup_recovery). The matching outbound cra: entry
# below closes the graph.
#
# GDPR closure: a per-workflow Records of Processing Activity entry
# accompanies this overlay at
# content/mappings/gdpr/data-flow-ddos_response.md. The workflow
# operates on network-anomaly metrics, service identifiers, and
# attestation records; no personal data is processed.
#
# Schema: schemas/playbook-mappings.schema.json
playbook: playbook.ddos_response@v1

oscal:
  # NIST SP 800-53 Rev. 5 controls exercised by the detect-availability-
  # anomaly, classify-attack-vector, engage-mitigation, validate-
  # service-restoration, evidence-capture, and notify-incident-
  # management-owner steps.
  - oscal_catalog: NIST SP 800-53 Rev. 5
    control_id: IR-4
    title: Incident Handling
    url: https://csrc.nist.gov/projects/risk-management/sp800-53-controls/release-search#!/control?version=5.1&number=IR-4
    notes: >-
      Anchors the playbook end-to-end as the incident-handling
      capability for the availability/denial-of-service case set:
      detect-to-classify-to-mitigate-to-validate exercised step-by-
      step, with the dated evidence record produced by the
      evidence-capture step closing the audit-evident loop. The
      same control anchors the sibling per-incident playbooks
      (identity_compromise, data_exfil, ransomware_containment) so
      the incident-handling capability is named consistently across
      the case set.

  - oscal_catalog: NIST SP 800-53 Rev. 5
    control_id: IR-5
    title: Incident Monitoring
    url: https://csrc.nist.gov/projects/risk-management/sp800-53-controls/release-search#!/control?version=5.1&number=IR-5
    notes: >-
      Covers the detect-availability-anomaly and validate-service-
      restoration steps: IR-5 demands tracking and documentation of
      incidents. The synthetic-probe / edge-telemetry observations
      captured at detect and the documented-availability-objective
      measurements captured at validate are the durable monitoring
      artefact the rest of the playbook reads against. The dated
      evidence record produced by the evidence-capture step is the
      audit-evident output IR-5 reviewers consume.

d3fend:
  # MITRE D3FEND v1.0.0 defensive technique tags per playbook step.
  # CACAO step UUIDs are pinned to the real action UUIDs resolved
  # from content/playbooks/ddos_response/playbook.cacao.json (six
  # action bodies: detect-availability-anomaly, classify-attack-
  # vector, engage-mitigation, validate-service-restoration,
  # evidence-capture, notify-incident-management-owner). The Detect
  # tactic in D3FEND v1.0.0 carries Network Traffic Analysis (D3-NTA)
  # — dated examination of network observations against the
  # operator's declared availability objective — which is the
  # discipline the detect-availability-anomaly, classify-attack-
  # vector, and validate-service-restoration steps operate. The
  # engage-mitigation, evidence-capture, and notify-incident-
  # management-owner steps are deliberately not pinned to a D3FEND
  # technique and the gaps are documented in the header and in
  # comments below (mirroring the runtime-enforcement gap-note
  # precedent on mfa_secured_comms and the inventory / emission /
  # delivery gap-note precedents on crypto_posture_management,
  # backup_recovery, infra_posture_management, iam_auditor,
  # on_call_rotation, and cyber_hygiene_training).
  - step: action--60000000-0000-4000-8000-000000000002
    d3fend_id: D3-NTA
    d3fend_name: Network Traffic Analysis
    url: https://d3fend.mitre.org/technique/d3f:NetworkTrafficAnalysis/
    notes: >-
      detect-availability-anomaly — the dated examination of
      synthetic-probe results and edge / origin throughput /
      error-rate / latency series against __protected_service__'s
      documented availability objective is the network-traffic-
      analysis discipline D3-NTA names. D3FEND frames Network
      Traffic Analysis as the analysis of network traffic to
      identify adversarial behaviour; the playbook narrows that
      lens to the operator's own monitored services and the
      operator's own declared availability objective — same
      technique, posture-readiness scope rather than adversary-
      attribution scope. Read-only and side-effect-free: no
      filter mutation, no posture push, no traffic shaping. The
      observations aggregated into __availability_incident_id__
      are the audit-evident output of the Network Traffic
      Analysis pass and condition whether the classify-attack-
      vector branch executes. Detection bindings for individual
      availability-anomaly upstream rule fingerprints are consumed
      via the Network Activity (4001) telemetry binding below
      rather than authored as Sigma references on this overlay;
      the operator's posture-management layer is the upstream of
      those signal shapes.

  - step: action--60000000-0000-4000-8000-000000000003
    d3fend_id: D3-NTA
    d3fend_name: Network Traffic Analysis
    url: https://d3fend.mitre.org/technique/d3f:NetworkTrafficAnalysis/
    notes: >-
      classify-attack-vector — the discrimination of volumetric
      (UDP / ICMP / amplification flood), protocol (SYN / TCP
      state-exhaustion), and application-layer (HTTP / TLS /
      slow-loris) vectors against the operator's documented
      vector taxonomy reads packet-capture and flow-record
      sources alongside the network surface the detect step
      already examined. The same Network Traffic Analysis
      discipline names the discrimination pass: dated examination
      of network observations to characterise the attack vector,
      narrowed to the operator's own monitored surface. The
      classification record is the audit-evident output of the
      analysis pass and conditions which branch the
      engage-mitigation step takes (upstream-scrubbing
      activation, rate-limit / WAF posture change, or failover
      orchestration). The Detect-tactic D3-NTA anchor is shared
      with the detect-availability-anomaly step because anomaly
      detection and vector classification are produced by the
      same network-traffic-analysis walk against the same
      monitored surface; the discipline is named consistently
      across both halves of the detection-and-triage surface
      this playbook operates.

  - step: action--60000000-0000-4000-8000-000000000005
    d3fend_id: D3-NTA
    d3fend_name: Network Traffic Analysis
    url: https://d3fend.mitre.org/technique/d3f:NetworkTrafficAnalysis/
    notes: >-
      validate-service-restoration — the post-engagement
      examination of the protected service against its documented
      availability objective (latency, error rate, throughput)
      for the documented validation window is the adjacent dated-
      examination of the same network surface the
      detect-availability-anomaly step examined on the anomaly-
      detection side. The read-only-by-contract constraint applies
      here too: the playbook does NOT force traffic, re-route, or
      mutate posture, it records the post-engagement observation
      and the deviation against the documented availability
      objective. The __availability_restoration__ artifact feeds
      the kpi.mttr_containment@v1 metric alongside the detect-
      availability-anomaly observation. The Detect-tactic D3-NTA
      anchor is shared with the detect and classify steps because
      the three observations are produced by the same network-
      traffic-analysis walk against the same monitored surface,
      separated only by the engage-mitigation step that conditions
      the post-engagement window.

  # engage-mitigation (action--60000000-0000-4000-8000-000000000004)
  # is deliberately NOT pinned to a D3FEND technique. The rate-limit
  # / WAF posture-change discipline maps onto D3-NTF (Network
  # Traffic Filtering) and D3-OTF (Outbound Traffic Filtering), and
  # the failover-engagement discipline maps onto D3-SCP (System
  # Configuration Permissions), but those Harden-tactic techniques
  # are the runtime enforcement disciplines owned by the operator's
  # network surface (upstream scrubbing provider, edge / WAF, DNS /
  # load-balancer failover orchestration), exercised under the
  # operator's pre-bound response posture. This playbook engages
  # those surfaces against a documented binding — it does not
  # author the filter rule, the scrubber binding, or the failover
  # target. Pinning a Harden-tactic D3FEND tag here would force the
  # technique onto a runtime-countermeasure surface this playbook
  # does not discharge, mirroring the mfa_secured_comms decision to
  # anchor on Detect-tactic D3-AM rather than Harden-tactic D3-MFA.
  # The architectural anchor for the rate-limit / WAF posture and
  # the failover-target designation belongs on a future
  # infra_posture_management overlay where posture authoring lives,
  # not on the per-event response.
  #
  # evidence-capture (action--60000000-0000-4000-8000-000000000006)
  # is deliberately NOT pinned to a D3FEND technique. Per-execution
  # artifact emission of the dated availability-incident record for
  # downstream audit consumption is an evidence-stream emission
  # discipline, not a runtime countermeasure or a detection step,
  # and forcing it onto a D3FEND tag would misrepresent the
  # technique. This step is anchored on the IR-5 OSCAL control
  # above. Mirrors the mfa_secured_comms evidence-capture,
  # crypto_posture_management evidence-capture, backup_recovery
  # evidence-capture, and cyber_hygiene_training evidence-capture
  # gap notes.
  #
  # notify-incident-management-owner (action--60000000-0000-4000-
  # 8000-000000000007) is deliberately NOT pinned to a D3FEND
  # technique. Delivery of the evidence reference to the
  # incident-management owner along the operator's pre-bound
  # channel is a notification discipline, not a defensive
  # technique. Mirrors the mfa_secured_comms notify-authentication-
  # owner, crypto_posture_management notify-crypto-owner,
  # backup_recovery notify-continuity-owner, and
  # cyber_hygiene_training notify-gaps gap notes.

ocsf:
  # OCSF v1.3.0 telemetry bindings. The detect-availability-anomaly
  # and validate-service-restoration steps read network-side
  # observations (synthetic-probe results, edge / origin throughput
  # / error-rate / latency series); the classify-attack-vector step
  # reads the same network surface plus operator-bound packet-
  # capture / flow-record sources; the engage-mitigation,
  # evidence-capture, and notify steps interact with operator API
  # surfaces (upstream-scrubbing provider activation, rate-limit /
  # WAF posture-change ticketing, failover orchestration, evidence
  # store, notification channel). Two classes anchor the
  # discipline: Network Activity on the observation-side and API
  # Activity on the engagement / emission / delivery side.
  - id: telemetry.network_activity@v1
    category_uid: 4
    category_name: Network Activity
    class_uid: 4001
    class_name: Network Activity
    ocsf_version: "1.3.0"
    direction: consumes
    notes: >-
      Consumed at the detect-availability-anomaly step (synthetic-
      probe results, edge / origin throughput / error-rate /
      latency series against __protected_service__), at the
      classify-attack-vector step (same network surface plus
      operator-bound packet-capture / flow-record sources to
      classify volumetric / protocol / application-layer vectors),
      and at the validate-service-restoration step (post-
      engagement observation of the protected service against its
      documented availability objective for the documented
      validation window). Schema:
      https://schema.ocsf.io/1.3.0/classes/network_activity

  - id: telemetry.ocsf.api_activity@v1
    category_uid: 6
    category_name: Application Activity
    class_uid: 6003
    class_name: API Activity
    ocsf_version: "1.3.0"
    direction: both
    notes: >-
      Consumed at the engage-mitigation step (write calls against
      the operator's upstream-scrubbing provider activation
      endpoint, the operator's edge surface for rate-limit / WAF
      posture-change pushes, or the operator's failover
      orchestration surface). Emitted at the evidence-capture step
      (write call publishing the dated availability-incident
      evidence record to the operator's evidence store) and at the
      notify-incident-management-owner step (delivery dispatch to
      the incident-management owner's pre-bound channel). Schema:
      https://schema.ocsf.io/1.3.0/classes/api_activity

nis2:
  # Inbound entry that backlinks playbook.ddos_response@v1:
  #   - content/mappings/nis2/article-21-2-b.yaml
  #     (id nis2:art-21-2-b — incident-handling capability)
  # Pinned outbound below to close the graph.
  - mapping_id: nis2:art-21-2-b
    article: 21(2)(b)
    notes: >-
      NIS2 Art. 21(2)(b) requires essential and important entities
      to operate an incident-handling capability covering detection,
      triage, containment, remediation, and capture of lessons
      learned. The ddos_response playbook is the operational
      discharge of the capability for the availability/denial-of-
      service attack dimension — the case set currently leans on
      phishing / identity / ransomware playbooks for the per-
      incident response, none of which carry the availability-
      attack surface. The detect-availability-anomaly and
      classify-attack-vector steps cover the detection / triage
      slice; the engage-mitigation step covers the containment /
      remediation slice against the operator's pre-bound response
      surface (upstream scrubbing, rate-limit / WAF posture change,
      failover); the validate-service-restoration and
      evidence-capture steps close the loop with audit-evident
      observation of recovery against the documented availability
      objective. Lessons-learned is handed off to
      playbook.post_incident_review@v1, which is the canonical
      lessons-learned owner across the case set.

dora:
  # Inbound entry that backlinks playbook.ddos_response@v1:
  #   - content/mappings/dora/article-11-availability-response.yaml
  #     (id dora:art-11-availability-response — DORA Art. 11
  #     per-vector availability-incident response slice; companion
  #     to article-11.yaml's documented incident-handling capability
  #     anchor)
  # Pinned outbound below to close the graph.
  - mapping_id: dora:art-11-availability-response
    article: "11"
    notes: >-
      DORA Art. 11 requires financial entities to operate
      response-and-recovery plans that minimise the impact of an
      ICT-related incident on the availability dimension of
      critical or important functions: detect the availability
      anomaly on the protected service, classify the attack vector
      against the documented vector taxonomy, engage the
      documented mitigation discipline against the operator's
      pre-bound response surface (upstream scrubbing activation,
      rate-limit / WAF posture change, or failover to a documented
      standby), validate restoration against the documented
      recovery time objective, and capture the dated availability-
      incident evidence record. The ddos_response playbook is the
      per-event materialisation of that obligation's detect-
      classify-mitigate-validate discharge against the
      availability/denial-of-service attack dimension — the same
      discharge shape NIS2 Art. 21(2)(b) anchors on for the
      availability/denial-of-service incident-handling slice. This
      outbound entry is the structural closure of that backlink
      and is the per-vector availability-response slice of the
      broader Art. 11 response-and-recovery surface (companion to
      dora:art-11-response-recovery, which carries the documented
      incident-handling capability anchor paired with backup
      attestations and restore-drill records). The lifecycle owner
      once the incident has been opened remains
      playbook.incident_management@v1, which already carries
      dora:art-18-classification, dora:art-19-initial-4h,
      dora:art-19-intermediate-72h, and dora:art-19-final-one-month
      on its overlay; ddos_response operationalises the per-vector
      response under that lifecycle, it does not replace it.

cra:
  # Inbound entry that backlinks playbook.ddos_response@v1:
  #   - content/mappings/cra/annex-i-1-h-availability-ddos-response.yaml
  #     (id cra:annex-i-1-h-availability-ddos-response — Annex I
  #     §1(h) availability, per-event DDoS / availability-incident
  #     response lane; third companion under §1(h) alongside
  #     cra:annex-i-1-availability (containment lane, pinned to
  #     ransomware_containment) and
  #     cra:annex-i-1-h-availability-restore-drill (restore-drill
  #     lane, pinned to backup_recovery))
  # Pinned outbound below to close the graph.
  - mapping_id: cra:annex-i-1-h-availability-ddos-response
    article: Annex I §1(h)
    notes: >-
      Outbound backlink for the inbound entry in
      annex-i-1-h-availability-ddos-response.yaml. The per-event
      DDoS / availability-incident response lane discharges the
      operator-side §1(h) availability-of-essential-functions
      obligation by restoring service availability after volumetric,
      protocol, or application-layer attack, complementary to (not
      overlapping with) the backup_recovery restore-drill lane
      (cra:annex-i-1-h-availability-restore-drill) and the
      ransomware_containment containment lane
      (cra:annex-i-1-availability) already pinned under this clause.
      The NIS2 parallel (nis2:art-21-2-b) and DORA parallel
      (dora:art-11-availability-response) are already pinned on this
      overlay above; the CRA backlink completes the regulatory
      triplet.
