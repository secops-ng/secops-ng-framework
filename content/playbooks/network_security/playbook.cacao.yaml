playbook_variables:
  __reconciliation_window__:
    type: string
    description: >-
      Identifier of the reconciliation window this run discharges
      (scheduled-cadence reference, on-demand reconciliation
      reference, or operator-initiated trigger). Names which
      posture cohort the run reconciled against; the wall-clock
      instant lives on the evidence record itself.
    external: true
  __segment_inventory_id__:
    type: string
    description: >-
      Identifier of the reconciled segment-inventory the
      inventory step composed from the operator's documented
      network-inventory sources (declarative infrastructure-as-
      code records, cloud-provider VPC/subnet APIs, on-premise
      network-controller inventories). Consumed downstream by the
      policy-evaluation and violation-detection steps.
    external: false
  __policy_snapshot_id__:
    type: string
    description: >-
      Identifier of the segmentation-policy snapshot the
      policy-evaluation step read from the operator's documented
      policy source (declared zone-transit matrix, per-segment
      allowance set). The pinned snapshot lets the evidence
      artifact identify which policy revision the reconciliation
      was run against.
    external: false
  __violation_set_id__:
    type: string
    description: >-
      Identifier of the per-violation set the detect step emits
      against the segment-inventory / policy-snapshot pair. Each
      violation carries a segment-pair identifier, an observed-
      reachability marker, a policy-allowance marker, and a
      classification token (undocumented-transit, unauthorised-
      egress, boundary-control-drift). The set may be empty (no
      violation against the current window) — the empty case is
      still emitted explicitly so the audit-evident chain is
      closed.
    external: false
  __remediation_action_id__:
    type: string
    description: >-
      Identifier of the engaged remediation action against the
      operator's pre-bound remediation surface (per-segment ACL /
      firewall-rule change, boundary-control posture-change
      ticket, or short-circuit isolation of the offending path).
      Empty when __violation_set_id__ resolved empty. Always
      populated when there is at least one violation, including
      on the short-circuit branch.
    external: false
  __posture_evidence_id__:
    type: string
    description: >-
      Identifier of the dated network-security-posture evidence
      artifact the generate step published to the operator's
      evidence store. Always populated, including on the
      empty-violation-set branch — the closure record is the
      audit-evident output that names the segment inventory, the
      policy snapshot, the violation set, and the remediation
      action for the reconciliation window.
    external: false
workflow_start: start--7e750001-0000-4000-8000-000000000001
workflow:
  start--7e750001-0000-4000-8000-000000000001:
    type: start
    name: netsec_posture_start
    on_completion: action--7e750001-0000-4000-8000-000000000002
  action--7e750001-0000-4000-8000-000000000002:
    type: action
    name: inventory_network_segments
    description: >-
      SKELETON — enumerate the documented network segments on the
      operator's own deployed estate by pulling from the
      operator's declared network-inventory sources (declarative
      infrastructure-as-code records for VLAN / VPC / subnet /
      zone definitions, cloud-provider network APIs, on-premise
      network-controller inventories). Composes the operator-
      authoritative segment inventory for the reconciliation
      window under the operator's documented source-precedence
      ordering and pins __segment_inventory_id__ (deterministic
      derivation over the canonical, source-precedence-ordered
      segment record list). Read-only against each source. TODO
      (CORE): pin the inventory-source adapter Protocols, the
      deterministic snapshot-id derivation, and the
      segment-record schema.
    action_body: TODO
    on_completion: action--7e750001-0000-4000-8000-000000000003
    in_args:
      - __reconciliation_window__
    out_args:
      - __segment_inventory_id__
    agent_target: netsec_posture_worker
    x_secops_ng:
      control_refs:
        - control.network_boundary_protection@v1
      telemetry_refs:
        - telemetry.ocsf.network_activity@v1
  action--7e750001-0000-4000-8000-000000000003:
    type: action
    name: evaluate_segmentation_policy
    description: >-
      SKELETON — evaluate the documented segmentation policy
      (declared zone-transit matrix, per-segment allowance set)
      against the reconciled segment inventory for the window.
      Reads the current policy snapshot from the operator's
      documented policy source and pins __policy_snapshot_id__ so
      the evidence artifact identifies which revision the
      reconciliation ran against. Records the per-segment-pair
      allowance state (allowed / denied / conditional) for the
      detect step to compare observed reachability against. TODO
      (CORE): pin the policy-source adapter, the policy-schema
      normaliser, and the allowance-evaluation algebra.
    action_body: TODO
    on_completion: action--7e750001-0000-4000-8000-000000000004
    in_args:
      - __reconciliation_window__
      - __segment_inventory_id__
    out_args:
      - __policy_snapshot_id__
    agent_target: netsec_posture_worker
    x_secops_ng:
      control_refs:
        - control.network_boundary_protection@v1
      telemetry_refs:
        - telemetry.ocsf.network_activity@v1
  action--7e750001-0000-4000-8000-000000000004:
    type: action
    name: detect_policy_violations
    description: >-
      SKELETON — compute the per-segment-pair violation set by
      comparing observed reachability posture (network-traffic
      observations, boundary-control state, reachability probes
      pulled from the operator's documented telemetry sources)
      against the policy-snapshot allowance state. Classify each
      violation into the documented taxonomy (undocumented-
      transit, unauthorised-egress, boundary-control-drift) and
      pin __violation_set_id__. Empty violation set is emitted
      explicitly so the closure record identifies a
      clean-window reconciliation rather than a skipped step.
      TODO (CORE): pin the reachability-observation adapter, the
      violation-classification primitives, and the deterministic
      violation-record schema.
    action_body: TODO
    on_completion: action--7e750001-0000-4000-8000-000000000005
    in_args:
      - __segment_inventory_id__
      - __policy_snapshot_id__
    out_args:
      - __violation_set_id__
    agent_target: netsec_posture_worker
    x_secops_ng:
      control_refs:
        - control.network_boundary_protection@v1
      telemetry_refs:
        - telemetry.ocsf.network_activity@v1
  action--7e750001-0000-4000-8000-000000000005:
    type: action
    name: enforce_remediation
    description: >-
      SKELETON — engage the operator's pre-bound remediation
      surface against each violation in __violation_set_id__ per
      the operator's documented per-classification remediation
      binding (per-segment ACL / firewall-rule change ticket,
      boundary-control posture-change ticket, or short-circuit
      isolation of the offending path). Pins
      __remediation_action_id__ against the engaged action; empty
      when the violation set is empty. The playbook does not
      author the operator's remediation architecture — it
      dispatches against pre-bound surfaces the operator's
      change-management posture already documents. TODO (CORE):
      pin the remediation-surface adapter Protocols, the per-
      classification dispatch table, and the remediation-record
      schema.
    action_body: TODO
    on_completion: action--7e750001-0000-4000-8000-000000000006
    in_args:
      - __violation_set_id__
    out_args:
      - __remediation_action_id__
    agent_target: netsec_posture_worker
    x_secops_ng:
      control_refs:
        - control.network_boundary_protection@v1
      telemetry_refs:
        - telemetry.ocsf.network_activity@v1
  action--7e750001-0000-4000-8000-000000000006:
    type: action
    name: generate_posture_evidence_artifact
    description: >-
      SKELETON — publish the dated network-security-posture
      evidence artifact to the operator's evidence store. The
      artifact names __reconciliation_window__,
      __segment_inventory_id__, __policy_snapshot_id__,
      __violation_set_id__, and __remediation_action_id__ so the
      audit-evident chain closes end-to-end for the window. Pins
      __posture_evidence_id__ against the persisted record.
      Always emitted, including on the empty-violation-set
      branch — the closure record is the primary audit-evident
      output of the reconciliation regardless of whether any
      violation was surfaced. TODO (CORE): pin the evidence-store
      adapter, the artifact schema, and the retention discipline.
    action_body: TODO
    on_completion: end--7e750001-0000-4000-8000-000000000007
    in_args:
      - __reconciliation_window__
      - __segment_inventory_id__
      - __policy_snapshot_id__
      - __violation_set_id__
      - __remediation_action_id__
    out_args:
      - __posture_evidence_id__
    agent_target: netsec_posture_worker
    x_secops_ng:
      control_refs:
        - control.network_boundary_protection@v1
      telemetry_refs:
        - telemetry.ocsf.network_activity@v1
  end--7e750001-0000-4000-8000-000000000007:
    type: end
    name: netsec_posture_end
