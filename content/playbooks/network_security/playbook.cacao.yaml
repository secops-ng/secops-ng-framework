type: playbook
spec_version: "2.0"
id: playbook--7e750001-0000-4000-8000-000000000001
name: Network security and segmentation posture
description: >-
  SKELETON — CACAO v2 scaffold for the operator-side network-security
  and segmentation posture-management lifecycle anchored to NIS2
  Art. 21(2)(e) (security in network and information systems) and to
  DORA Art. 9 read against the JC RTS on ICT risk management
  framework (Commission Delegated Regulation (EU) 2024/1774) network-
  security articles. Operates the per-window reconciliation of the
  operator's declared segmentation policy against the observed
  network-boundary state on the operator's own deployed estate: enumerate
  the documented network segments (VLAN / VPC / subnet / zone
  identifiers pulled from the operator's declarative network-inventory
  sources), evaluate the segmentation-policy allowances against the
  observed per-segment reachability posture, detect policy violations
  (undocumented cross-segment reachability, unauthorised egress paths,
  boundary-control drift against the declared zone-transit matrix),
  enforce remediation against the operator's pre-bound remediation
  surface (per-segment ACL / firewall-rule change, boundary-control
  posture-change ticket, or short-circuit isolation of the offending
  path), and generate the dated network-security-posture evidence
  artifact for the reconciliation window. The playbook does not author
  the operator's segmentation policy or the segmentation architecture
  itself; it operationalises a documented reconciliation posture
  against pre-bound segmentation sources and pre-bound remediation
  surfaces. A sibling CORE card lands the deterministic per-step
  primitives (segment-inventory reconciliation, policy-evaluation
  algebra, violation-classification, remediation-dispatch adapters)
  together with the per-target compiler emissions; a sibling EXTEND
  card lands the cookbook walkthrough and the segmentation-drift and
  unauthorised-egress-cardinality metric emitters.
playbook_types:
  - investigation
  - remediation
