  # Inbound entries live at:
  # - content/mappings/cra/annex-i-1-l-logging-monitoring-detection-engineering.yaml (`cra:annex-i-1-l-logging-monitoring-detection-engineering`)
  # All backlink to playbook.detection_engineering@v1.
  - mapping_id: cra:annex-i-1-l-logging-monitoring-detection-engineering
