# Outbound playbook-mappings overlay for supply_chain_security.
#
# Per the schema's `additionalProperties: false`, all six structural
# keys must be present; empty arrays mark surfaces whose closure is
# delegated to sibling EXTEND-mappings cards per the ROADMAP fan-out
# (one standard at a time). The NIS2 Art. 21(2)(d) closure landed
# in this overlay alongside the matching addition of
# playbook.supply_chain_security@v1 to the inbound playbook_refs at
# content/mappings/nis2/article-21-2-d.yaml. The DORA Art. 28
# (third-party register) closure landed alongside the matching
# addition of playbook.supply_chain_security@v1 to the inbound
# playbook_refs at content/mappings/dora/article-19-and-28.yaml
# (id dora:art-28-third-party-register). The CRA Art. 13(4)
# (component due-diligence, supplier-attestation channel)
# closure landed alongside the matching addition of
# playbook.supply_chain_security@v1 to the inbound playbook_refs
# at content/mappings/cra/article-13-4-component-due-diligence-contracts.yaml
# (id cra:art-13-4-component-due-diligence-contracts). OSCAL,
# D3FEND, and OCSF closures remain delegated to their own
# sibling cards.
#
# Schema: schemas/playbook-mappings.schema.json
playbook: playbook.supply_chain_security@v1

oscal: []

d3fend: []

ocsf: []

nis2:
  # Inbound entry backlinks playbook.supply_chain_security@v1:
  #   - content/mappings/nis2/article-21-2-d.yaml
  #     (id nis2:art-21-2-d — supply-chain security; security
  #     characteristics of direct suppliers and service providers,
  #     with periodic re-attestation)
  # The supply_chain_security playbook is the orchestration spine
  # that composes the two pre-existing surfaces already pinned on
  # the inbound entry: the runtime supply-chain evidence stream
  # operated by playbook.threat_intel_ingest@v1 and the
  # contract-time obligation-evidence stream operated by
  # playbook.contractual_obligations_tracker@v1. This outbound
  # entry is the structural closure of that backlink; OSCAL,
  # D3FEND, OCSF, DORA, and CRA closures land via their own
  # EXTEND-mappings sibling cards per the ROADMAP fan-out.
  - mapping_id: nis2:art-21-2-d
    article: 21(2)(d)
    notes: >-
      NIS2 Art. 21(2)(d) requires entities to address supply-chain
      security including the security characteristics of direct
      suppliers and service providers, with periodic
      re-attestation. The supply_chain_security playbook is the
      operator-side composition surface that joins the two
      contributing streams the article requires: the runtime
      F-CP-03 supply-chain evidence stream (per-execution external
      provider dependencies, operated by
      playbook.threat_intel_ingest@v1) and the contract-time
      F-WF-10 contractual-obligations stream (per-supplier accepted
      obligations and per-clause review cadence, operated by
      playbook.contractual_obligations_tracker@v1). The inbound
      entry's evidence_stream_refs lists both `supply-chain` and
      `contractual-obligations`; this outbound entry closes the
      graph by pinning the orchestration playbook against the
      Article so the periodic re-attestation surface the article
      requires has an explicit owning workflow.

dora:
  # Inbound entry backlinks playbook.supply_chain_security@v1:
  #   - content/mappings/dora/article-19-and-28.yaml
  #     (id dora:art-28-third-party-register — register of
  #     information in relation to all contractual arrangements
  #     with ICT third-party service providers, including the
  #     function supported, criticality assessment,
  #     sub-contracting chain, and data-location indicators).
  # This outbound entry is the structural closure of that
  # backlink. The two contributing streams the supply_chain_security
  # playbook composes are already pinned on sibling DORA entries:
  # the runtime supply-chain evidence stream operated by
  # playbook.threat_intel_ingest@v1 lands on
  # dora:art-19-cyber-threat-voluntary, and the contract-time
  # obligation-evidence stream operated by
  # playbook.contractual_obligations_tracker@v1 lands on
  # dora:art-28-third-party-register and
  # dora:art-30-contractual-clauses. CRA closure remains delegated
  # to its own EXTEND-mappings sibling card.
  - mapping_id: dora:art-28-third-party-register
    article: "28"
    notes: >-
      DORA Art. 28 requires financial entities to maintain a register
      of information for all contractual arrangements with ICT
      third-party service providers, kept current as supplier sets,
      criticality assessments, sub-contracting chains, and
      data-location indicators drift. The supply_chain_security
      playbook is the operator-side orchestration spine that joins
      the two contributing streams the register's living-artifact
      requirement implies: the runtime F-CP-03 supply-chain evidence
      stream (per-execution external provider dependencies, SBOM
      correlation, supplier-attestation lookup, operated by
      playbook.threat_intel_ingest@v1) and the contract-time F-WF-10
      contractual-obligations stream (per-supplier accepted
      obligations and per-clause review cadence, operated by
      playbook.contractual_obligations_tracker@v1). The
      assess-supplier-signal / record-supplier-evidence step pair
      canonicalises a raw supplier signal into the closed assessment
      block the register's criticality and re-attestation surface
      consumes, so any drift on a direct supplier the runtime stream
      flags re-enters the register the Article anchors. The inbound
      entry's playbook_refs lists both
      playbook.contractual_obligations_tracker@v1 and
      playbook.supply_chain_security@v1; this outbound entry closes
      the graph by pinning the orchestration playbook against the
      Article so the periodic re-attestation surface the Article
      requires has an explicit owning workflow. control_refs and
      metric_refs are not extended on the inbound entry: the
      playbook declares only control.supplier_inventory@v1 (already
      on the entry) and no additional metric_refs of its own.
      Convention follows the NIS2 Art. 21(2)(d) entry on this same
      overlay and the infra_posture_management overlay closure on
      PR #437 (inbound backlink + outbound pin, additional
      control/metric lifts deferred to follow-on cards).

cra:
  # Inbound entry backlinks playbook.supply_chain_security@v1:
  #   - content/mappings/cra/article-13-4-component-due-diligence-contracts.yaml
  #     (id cra:art-13-4-component-due-diligence-contracts —
  #     component due-diligence, supplier-attestation channel:
  #     contract-time obligation set per direct supplier, including
  #     security-control commitments, attestation cadences,
  #     sub-processor disclosure, breach-notification windows, and
  #     audit/termination rights).
  # This outbound entry is the structural closure of that
  # backlink. The two contributing streams the
  # supply_chain_security playbook composes are already pinned on
  # sibling CRA surfaces: the contract-time obligation-evidence
  # stream operated by playbook.contractual_obligations_tracker@v1
  # lands on cra:art-13-4-component-due-diligence-contracts, and
  # the runtime supply-chain evidence stream operated by
  # playbook.threat_intel_ingest@v1 is composed in via the
  # orchestration spine this entry pins. With this entry all four
  # regulatory mapping trees (nis2/dora/cra/gdpr) reach the
  # supply_chain_security playbook with both inbound backlink and
  # outbound pin closed; OSCAL, D3FEND, and OCSF closures remain
  # delegated to their own EXTEND-mappings sibling cards.
  - mapping_id: cra:art-13-4-component-due-diligence-contracts
    article: 13(4)
    notes: >-
      CRA Art. 13(4) requires manufacturers to exercise due diligence
      when integrating third-party components so they do not
      compromise the cybersecurity of the product with digital
      elements, operationalised on the inbound entry as the
      contract-time obligation channel that captures, per direct
      supplier, the per-clause obligations the manufacturer has
      accepted in writing plus the per-obligation review schedule
      that keeps the due-diligence record live across the product
      lifecycle. The supply_chain_security playbook is the
      operator-side composition surface that joins the two
      contributing streams the Article's due-diligence requirement
      implies: the runtime F-CP-03 supply-chain evidence stream
      (per-execution external provider dependencies, operated by
      playbook.threat_intel_ingest@v1) and the contract-time F-WF-10
      contractual-obligations stream (per-supplier accepted
      obligations and per-clause review cadence, operated by
      playbook.contractual_obligations_tracker@v1). The inbound
      entry's playbook_refs lists both
      playbook.contractual_obligations_tracker@v1 and
      playbook.supply_chain_security@v1; this outbound entry closes
      the graph by pinning the orchestration playbook against the
      Article so the per-supplier due-diligence record the Article
      requires has an explicit owning workflow. Convention follows
      the NIS2 Art. 21(2)(d) and DORA Art. 28 entries on this same
      overlay (inbound backlink + outbound pin, additional
      control/metric lifts deferred to follow-on cards).
