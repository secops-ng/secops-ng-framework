# Outbound playbook-mappings overlay for supply_chain_security.
#
# Per the schema's `additionalProperties: false`, all six structural
# keys must be present; empty arrays mark surfaces whose closure is
# delegated to sibling EXTEND-mappings cards per the ROADMAP fan-out
# (one standard at a time). The NIS2 Art. 21(2)(d) closure landed
# in this overlay alongside the matching addition of
# playbook.supply_chain_security@v1 to the inbound playbook_refs at
# content/mappings/nis2/article-21-2-d.yaml. OSCAL, D3FEND, OCSF,
# DORA, and CRA closures remain delegated to their own sibling
# cards.
#
# Schema: schemas/playbook-mappings.schema.json
playbook: playbook.supply_chain_security@v1

oscal: []

d3fend: []

ocsf: []

nis2:
  # Inbound entry backlinks playbook.supply_chain_security@v1:
  #   - content/mappings/nis2/article-21-2-d.yaml
  #     (id nis2:art-21-2-d — supply-chain security; security
  #     characteristics of direct suppliers and service providers,
  #     with periodic re-attestation)
  # The supply_chain_security playbook is the orchestration spine
  # that composes the two pre-existing surfaces already pinned on
  # the inbound entry: the runtime supply-chain evidence stream
  # operated by playbook.threat_intel_ingest@v1 and the
  # contract-time obligation-evidence stream operated by
  # playbook.contractual_obligations_tracker@v1. This outbound
  # entry is the structural closure of that backlink; OSCAL,
  # D3FEND, OCSF, DORA, and CRA closures land via their own
  # EXTEND-mappings sibling cards per the ROADMAP fan-out.
  - mapping_id: nis2:art-21-2-d
    article: 21(2)(d)
    notes: >-
      NIS2 Art. 21(2)(d) requires entities to address supply-chain
      security including the security characteristics of direct
      suppliers and service providers, with periodic
      re-attestation. The supply_chain_security playbook is the
      operator-side composition surface that joins the two
      contributing streams the article requires: the runtime
      F-CP-03 supply-chain evidence stream (per-execution external
      provider dependencies, operated by
      playbook.threat_intel_ingest@v1) and the contract-time
      F-WF-10 contractual-obligations stream (per-supplier accepted
      obligations and per-clause review cadence, operated by
      playbook.contractual_obligations_tracker@v1). The inbound
      entry's evidence_stream_refs lists both `supply-chain` and
      `contractual-obligations`; this outbound entry closes the
      graph by pinning the orchestration playbook against the
      Article so the periodic re-attestation surface the article
      requires has an explicit owning workflow.

dora: []

cra: []
