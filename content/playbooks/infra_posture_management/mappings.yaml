cra:
  # Inbound entries live at:
  # - content/mappings/cra/annex-i-1-b-secure-by-default-infra-posture.yaml (`cra:annex-i-1-b-secure-by-default-infra-posture`)
  # All backlink to playbook.infra_posture_management@v1.
  - mapping_id: cra:annex-i-1-b-secure-by-default-infra-posture
    article: "Annex I §1(b)"
    notes: >-
      Outbound backlink for the inbound entry in annex-i-1-b-secure-by-default-infra-posture.yaml.
