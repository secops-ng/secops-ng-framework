# Cross-references for the identity_compromise playbook.
#
# This file is the playbook's outbound view of the content model: it
# pins OSCAL controls, MITRE D3FEND defensive techniques, OCSF event
# classes consumed/emitted, and the EU regulatory clauses this
# playbook helps operationalise. Inbound references live in
# content/mappings/{nis2,dora}/ so the graph is closed in both
# directions.
#
# CRA closure: the schema's top-level keys are fixed
# (oscal/d3fend/ocsf/nis2/dora). CRA cross-references for this
# playbook are therefore expressed inbound only — an entry in
# content/mappings/cra/annex-i-1-essential-cybersecurity.yaml
# (cra:annex-i-1-authentication-and-least-privilege) already
# backlinks to playbook.identity_compromise@v1 as the agentic anchor
# for Annex I §1(d) authentication and least-privilege evidence.
# Identity compromise on its own is sub-threshold for CRA Art. 14
# product-side vulnerability notification (the CRA notification
# chain is exercised by the vuln_intake playbook); identity events
# are escalated into the NIS2 Art. 23 and DORA Art. 19 incident
# notification flows below when the threshold is met.
#
# GDPR closure: the per-workflow Art. 30 Record of Processing
# Activity for this playbook lives at
# content/mappings/gdpr/data-flow-identity_compromise.md and covers
# the principal-identifier processing (sign-in metadata, MFA state,
# session-revocation events) that the steps below operate on.
#
# Schema: schemas/playbook-mappings.schema.json
playbook: playbook.identity_compromise@v1

oscal:
  # NIST SP 800-53 Rev. 5 controls exercised by the triage,
  # MFA-reset, session-revocation, lateral-movement hunt, and IAM
  # audit steps. Catalogue URLs resolve to the public NIST OSCAL
  # repository.
  - id: control.account_management@v1
    oscal_catalog: NIST SP 800-53 Rev. 5
    control_id: AC-2
    title: Account Management
    url: https://csrc.nist.gov/projects/risk-management/sp800-53-controls/release-search#!/control?version=5.1&number=AC-2
    notes: >-
      Anchors the IAM audit and persistence-removal step: review of
      the principal's account state, group memberships, and any
      residual third-party app grants or conditional-access
      exceptions left behind by the compromise.

  - id: control.account_management_disable_accounts@v1
    oscal_catalog: NIST SP 800-53 Rev. 5
    control_id: AC-2(13)
    title: Account Management | Disable Accounts for High-Risk Individuals
    url: https://csrc.nist.gov/projects/risk-management/sp800-53-controls/release-search#!/control?version=5.1&number=AC-2(13)
    notes: >-
      Covers the session-revocation step where the compromised
      principal is forced out of every active IdP and downstream
      SaaS session pending re-enrolment — the operational analogue
      of disabling a high-risk account for the duration of the
      containment window.

  - id: control.identifier_management@v1
    oscal_catalog: NIST SP 800-53 Rev. 5
    control_id: IA-4
    title: Identifier Management
    url: https://csrc.nist.gov/projects/risk-management/sp800-53-controls/release-search#!/control?version=5.1&number=IA-4
    notes: >-
      Covers the principal-context hydration at the triage step:
      role, group memberships, and identifier resolution against
      the IdP so downstream steps act on a unique, authoritative
      principal.

  - id: control.authenticator_management@v1
    oscal_catalog: NIST SP 800-53 Rev. 5
    control_id: IA-5
    title: Authenticator Management
    url: https://csrc.nist.gov/projects/risk-management/sp800-53-controls/release-search#!/control?version=5.1&number=IA-5
    notes: >-
      Covers the MFA-reset step: revocation of existing TOTP /
      WebAuthn registrations, invalidation of app passwords, and
      forced re-enrolment of authenticators for the compromised
      principal.

  - id: control.multi_factor_authentication@v1
    oscal_catalog: NIST SP 800-53 Rev. 5
    control_id: IA-2(1)
    title: Identification and Authentication (Organizational Users) | Multi-Factor Authentication to Privileged Accounts
    url: https://csrc.nist.gov/projects/risk-management/sp800-53-controls/release-search#!/control?version=5.1&number=IA-2(1)
    notes: >-
      Reinforces the MFA-reset step on the privileged-account side:
      re-enrolment of multi-factor authenticators is the
      operational evidence that the privileged path stays gated
      after containment.

  - id: control.incident_handling@v1
    oscal_catalog: NIST SP 800-53 Rev. 5
    control_id: IR-4
    title: Incident Handling
    url: https://csrc.nist.gov/projects/risk-management/sp800-53-controls/release-search#!/control?version=5.1&number=IR-4
    notes: >-
      Anchors the playbook end-to-end as the incident-handling
      capability for credential-theft / MFA-bypass / suspicious
      sign-in cases: detection-to-containment-to-recovery exercised
      step-by-step.

  - id: control.incident_reporting@v1
    oscal_catalog: NIST SP 800-53 Rev. 5
    control_id: IR-6
    title: Incident Reporting
    url: https://csrc.nist.gov/projects/risk-management/sp800-53-controls/release-search#!/control?version=5.1&number=IR-6
    notes: >-
      Covers the NIS2 Art. 23 / DORA Art. 19 regulator-notification
      chain triggered when an identity compromise crosses the
      significant-incident threshold (impact on essential services,
      data exposure, or financial entity classification); the
      24h early-warning, the 72h notification, and the
      intermediate / final report artefacts are emitted along this
      branch.

  - id: control.audit_review_analysis_reporting@v1
    oscal_catalog: NIST SP 800-53 Rev. 5
    control_id: AU-6
    title: Audit Record Review, Analysis, and Reporting
    url: https://csrc.nist.gov/projects/risk-management/sp800-53-controls/release-search#!/control?version=5.1&number=AU-6
    notes: >-
      Covers the lateral-movement hunt step: review and correlation
      of audit records (STS AssumeRole traces, OAuth grants,
      cross-tenant sign-ins, downstream API activity) attributable
      to the compromised principal within the configured lookback
      window.

d3fend:
  # MITRE D3FEND v1.0.0 defensive technique tags per playbook step.
  # CACAO step UUIDs are pinned where the technique applies to a
  # single step.
  - step: action--30000000-0000-4000-8000-000000000002
    d3fend_id: D3-UBA
    d3fend_name: User Behavior Analysis
    url: https://d3fend.mitre.org/technique/d3f:UserBehaviorAnalysis/
    notes: >-
      triage identity signal — hydrating the originating
      identity-protection signal (impossible-travel, password-spray,
      MFA-bypass, suspicious OAuth grant) with principal context
      and recent sign-in history to decide whether the compromise
      is confirmed.

  - step: action--30000000-0000-4000-8000-000000000004
    d3fend_id: D3-MFA
    d3fend_name: Multi-factor Authentication
    url: https://d3fend.mitre.org/technique/d3f:Multi-factorAuthentication/
    notes: >-
      reset MFA factors — forced re-enrolment of TOTP / WebAuthn
      registrations and invalidation of app passwords so the
      privileged path stays gated by a strong second factor after
      containment.

  - step: action--30000000-0000-4000-8000-000000000005
    d3fend_id: D3-ACI
    d3fend_name: Authentication Cache Invalidation
    url: https://d3fend.mitre.org/technique/d3f:AuthenticationCacheInvalidation/
    notes: >-
      revoke active sessions — invalidation of live sessions,
      refresh tokens, and persistent device grants across the IdP
      and downstream SaaS so the attacker is forced back through
      the gated re-authentication path.

  - step: action--30000000-0000-4000-8000-000000000006
    d3fend_id: D3-UBA
    d3fend_name: User Behavior Analysis
    url: https://d3fend.mitre.org/technique/d3f:UserBehaviorAnalysis/
    notes: >-
      lateral-movement hunt — behavioural review of downstream
      activity attributable to the compromised principal (STS /
      AssumeRole traces, OAuth grants, cross-tenant sign-ins) over
      the configured lookback window.

  - step: action--30000000-0000-4000-8000-000000000006
    d3fend_id: D3-NTA
    d3fend_name: Network Traffic Analysis
    url: https://d3fend.mitre.org/technique/d3f:NetworkTrafficAnalysis/
    notes: >-
      lateral-movement hunt — API and audit-log traffic analysis
      against the principal's blast radius to surface downstream
      pivot attempts that the behavioural review alone would miss.

  - step: action--30000000-0000-4000-8000-000000000007
    d3fend_id: D3-AM
    d3fend_name: Account Monitoring
    url: https://d3fend.mitre.org/technique/d3f:AccountMonitoring/
    notes: >-
      IAM audit and persistence removal — review of the
      principal's IAM surface for residual persistence (rogue
      OAuth consents, third-party app grants, conditional-access
      exceptions) left behind by the compromise.

  - step: action--30000000-0000-4000-8000-000000000007
    d3fend_id: D3-LAM
    d3fend_name: Local Account Monitoring
    url: https://d3fend.mitre.org/technique/d3f:LocalAccountMonitoring/
    notes: >-
      IAM audit and persistence removal — cloud-IAM
      least-privilege evidence on the principal: removal of
      lingering role assumptions, app-password remnants, and
      conditional-access exceptions on the cloud-identity side.

  - step: action--30000000-0000-4000-8000-000000000007
    d3fend_id: D3-SCP
    d3fend_name: System Configuration Permissions
    url: https://d3fend.mitre.org/technique/d3f:SystemConfigurationPermissions/
    notes: >-
      IAM audit and persistence removal — review and tightening of
      configuration-level permissions (third-party app grants,
      conditional-access policy exceptions) that the compromise
      may have used to maintain access.

ocsf:
  # OCSF v1.3.0 telemetry bindings. The triage and lateral-movement
  # hunt steps consume identity telemetry (Authentication +
  # API Activity). The MFA-reset, session-revocation, and IAM
  # audit steps emit Account Change records keyed to the
  # principal. The Detection Finding consumed side carries the
  # upstream Sigma rule match that originated the case. A
  # Compliance Finding is emitted when the NIS2 Art. 23 / DORA
  # Art. 19 notification branch fires.
  - id: telemetry.detection_finding@v1
    category_uid: 2
    category_name: Findings
    class_uid: 2004
    class_name: Detection Finding
    ocsf_version: "1.3.0"
    direction: consumes
    notes: >-
      Consumed at the triage step: the originating
      identity-protection signal (impossible-travel, password-spray,
      MFA-bypass, suspicious OAuth grant) is delivered as a
      Detection Finding produced by the upstream Sigma rule
      referenced under external_references on the CACAO playbook.
      Schema: https://schema.ocsf.io/1.3.0/classes/detection_finding

  - id: telemetry.authentication@v1
    category_uid: 3
    category_name: Identity & Access Management
    class_uid: 3002
    class_name: Authentication
    ocsf_version: "1.3.0"
    direction: consumes
    notes: >-
      Consumed at the triage and lateral-movement hunt steps:
      sign-in metadata for the compromised principal across the
      configured lookback window — successful and failed
      authentications, MFA-challenge outcomes, conditional-access
      decisions. Schema:
      https://schema.ocsf.io/1.3.0/classes/authentication

  - id: telemetry.api_activity@v1
    category_uid: 6
    category_name: Application Activity
    class_uid: 6003
    class_name: API Activity
    ocsf_version: "1.3.0"
    direction: consumes
    notes: >-
      Consumed at the lateral-movement hunt step: API-call traces
      (cloud control-plane actions, STS / AssumeRole chains,
      downstream SaaS API hits) attributable to the compromised
      principal during the lookback window. Schema:
      https://schema.ocsf.io/1.3.0/classes/api_activity

  - id: telemetry.account_change@v1
    category_uid: 3
    category_name: Identity & Access Management
    class_uid: 3001
    class_name: Account Change
    ocsf_version: "1.3.0"
    direction: emits
    notes: >-
      Emitted by the MFA-reset, session-revocation, and IAM audit
      steps: each containment action on the principal (factor
      revocation, session invalidation, OAuth-grant withdrawal,
      conditional-access exception removal) is recorded as an
      Account Change event so the timeline-signal controls can
      audit on-time containment KPIs. Schema:
      https://schema.ocsf.io/1.3.0/classes/account_change

  - id: telemetry.compliance_finding@v1
    category_uid: 2
    category_name: Findings
    class_uid: 2003
    class_name: Compliance Finding
    ocsf_version: "1.3.0"
    direction: emits
    notes: >-
      Emitted by the regulator-notification branch when the
      incident crosses the NIS2 Art. 23 / DORA Art. 19 threshold:
      one Compliance Finding per 24-hour early-warning, 72-hour
      notification, and intermediate / final report, keyed to the
      case so the timeline-signal controls can audit on-time
      delivery. Schema:
      https://schema.ocsf.io/1.3.0/classes/compliance_finding

nis2:
  # Inbound entries live at content/mappings/nis2/article-21-2-b.yaml
  # (id nis2:art-21-2-b), content/mappings/nis2/article-21-2-i.yaml
  # (id nis2:art-21-2-i), and content/mappings/nis2/article-23.yaml
  # (ids nis2:art-23-early-warning, nis2:art-23-notification-72h),
  # all backlinking to playbook.identity_compromise@v1.
  - mapping_id: nis2:art-21-2-b
    article: 21(2)(b)
    notes: >-
      NIS2 Art. 21(2)(b) requires an incident-handling capability.
      The identity_compromise playbook is the operational artefact
      that operationalises this obligation for the credential-theft
      / MFA-bypass / suspicious sign-in case set.

  - mapping_id: nis2:art-21-2-i
    article: 21(2)(i)
    notes: >-
      NIS2 Art. 21(2)(i) covers HR security and access-control with
      joiner-mover-leaver and privileged-access review evidence.
      The IAM audit and persistence-removal step is the operational
      evidence for least-privilege enforcement on the principal
      after a compromise.

  - mapping_id: nis2:art-23-early-warning
    article: 23(4)(a)
    notes: >-
      NIS2 Art. 23(4)(a) requires a 24-hour early-warning to the
      competent authority for significant incidents. The
      identity_compromise playbook escalates to this branch when
      the compromise crosses the significant-incident threshold
      (impact on essential services, lateral-movement confirmed,
      data-exposure indicator).

  - mapping_id: nis2:art-23-notification-72h
    article: 23(4)(b)
    notes: >-
      NIS2 Art. 23(4)(b) requires a 72-hour notification with an
      initial assessment of severity and impact. The
      identity_compromise playbook produces the lateral-movement
      hunt findings and the IAM-audit residue that feed the
      assessment.

dora:
  # Inbound entries live at content/mappings/dora/article-19-and-28.yaml
  # (ids dora:art-18-classification, dora:art-19-initial-4h,
  # dora:art-19-intermediate-72h), all backlinking to
  # playbook.identity_compromise@v1.
  - mapping_id: dora:art-18-classification
    article: "18(1)"
    notes: >-
      DORA Art. 18(1) requires classification of ICT-related
      incidents against the criteria in the JC RTS on incident
      classification. The identity_compromise playbook produces
      the principal-blast-radius and lateral-movement evidence
      that drives the classification decision.

  - mapping_id: dora:art-19-initial-4h
    article: "19(4)(a)"
    notes: >-
      DORA Art. 19(4)(a) requires an initial notification within 4
      hours of classification as a major incident. The
      identity_compromise playbook's containment artefacts (MFA
      reset, session revocation, principal-scope hunt results)
      anchor the initial notification payload.

  - mapping_id: dora:art-19-intermediate-72h
    article: "19(4)(b)"
    notes: >-
      DORA Art. 19(4)(b) requires an intermediate notification
      within 72 hours with updated assessment. The
      identity_compromise playbook's IAM-audit findings and
      lateral-movement closure feed the updated assessment for
      the intermediate report.

cra:
  # Inbound entries live at:
  # - content/mappings/cra/annex-i-1-essential-cybersecurity.yaml (`cra:annex-i-1-access-control`)
  # All backlink to playbook.identity_compromise@v1.
  - mapping_id: cra:annex-i-1-access-control
    article: "Annex I §1(d)"
    notes: >-
      Outbound backlink for the inbound entry in annex-i-1-essential-cybersecurity.yaml.
