# Cross-references for the security_awareness_training playbook.
#
# Programme-lifecycle SKELETON overlay for the structured security-
# awareness training programme required by NIS2 Art. 21(2)(g). This
# playbook is the programme-authoring companion to the already-shipped
# playbook.cyber_hygiene_training@v1 operational per-cycle materialisation
# and to the reactive playbook.phishing_triage@v1 under the same clause.
#
# Status: SKELETON. The regulatory and control surface is pinned here;
# telemetry emit bindings, per-cohort programme-governance KPIs, and
# per-target compile examples are owned by CORE / EXTEND siblings. The
# d3fend block carries a SKELETON placeholder to be closed in CORE.
#
# Schema: schemas/playbook-mappings.schema.json
playbook: playbook.security_awareness_training@v1

oscal:
  - id: control.training_needs_assessment@v1
    oscal_catalog: NIST SP 800-53 Rev. 5
    control_id: AT-2
    title: Literacy Training and Awareness
    url: https://csrc.nist.gov/projects/risk-management/sp800-53-controls/release-search#!/control?version=5.1&number=AT-2
    todo: true
    notes: >-
      SKELETON pin for the schedule-assessment step. AT-2 anchors the
      training-needs assessment surface; the stable_id
      control.training_needs_assessment@v1 will be finalised in CORE
      once the control_xref is authored.

  - id: control.training_curriculum@v1
    oscal_catalog: ISO/IEC 27001:2022
    control_id: A.6.3
    title: Information security awareness, education and training
    url: https://www.iso.org/standard/27001
    todo: true
    notes: >-
      SKELETON pin for the design-content step. ISO/IEC 27001 Annex
      A.6.3 anchors the programme-level curriculum-authoring surface;
      the stable_id control.training_curriculum@v1 will be finalised
      in CORE once the control_xref is authored.

  - id: control.training_delivery@v1
    oscal_catalog: NIST SP 800-53 Rev. 5
    control_id: AT-3
    title: Role-based Training
    url: https://csrc.nist.gov/projects/risk-management/sp800-53-controls/release-search#!/control?version=5.1&number=AT-3
    todo: true
    notes: >-
      SKELETON pin for the deliver-training step. AT-3 anchors the
      role-based training-delivery surface; the stable_id
      control.training_delivery@v1 will be finalised in CORE once the
      control_xref is authored.

  - id: control.training_records@v1
    oscal_catalog: NIST SP 800-53 Rev. 5
    control_id: AT-4
    title: Training Records
    url: https://csrc.nist.gov/projects/risk-management/sp800-53-controls/release-search#!/control?version=5.1&number=AT-4
    todo: true
    notes: >-
      SKELETON pin for the record-completion, report-gaps, and
      review-cycle steps. AT-4 anchors the training-records retention
      surface (per-staff completion, per-cohort aggregate, dated
      cycle-review artifact). Shared with the cyber_hygiene_training
      overlay's AT-4 pin — the two playbooks discharge the programme
      and operational-execution halves of the same records
      obligation.

d3fend:
  - d3fend_id: D3-TODO
    d3fend_name: SKELETON placeholder
    todo: true
    notes: >-
      SKELETON placeholder. D3FEND closure follows the precedent set
      on playbook.cyber_hygiene_training@v1 (empty d3fend block with
      per-step gap rationale in the header) once the CORE-layer
      defensibility analysis is authored. The programme-lifecycle
      steps here are posture-readiness surfaces upstream of any
      runtime countermeasure, so a real D3FEND anchor may not exist;
      the CORE card decides whether to carry a forced tag or close
      the block empty with a documented gap-note.

ocsf:
  - id: telemetry.api_activity@v1
    category_uid: 6
    category_name: Application Activity
    class_uid: 6003
    class_name: API Activity
    ocsf_version: "1.3.0"
    direction: both
    todo: true
    notes: >-
      SKELETON placeholder for the operator-API-surface read/write
      shape (HR / identity source for assessment, learning-management
      surface for delivery and completion, evidence store for cycle
      review). CORE finalises consumer/emitter directionality per
      step; EXTEND wires the Compliance Finding (2003) emit binding
      for programme-governance deviations if scoped.

nis2:
  - mapping_id: nis2:art-21-2-g
    article: 21(2)(g)
    notes: >-
      NIS2 Art. 21(2)(g) primary anchor. This playbook is the
      PROGRAMME-lifecycle sibling under the clause: schedule-assessment
      → design-content → deliver-training → record-completion →
      report-gaps → review-cycle authors the structured training
      programme the reactive playbook.phishing_triage@v1 and the
      operational playbook.cyber_hygiene_training@v1 discharge on a
      per-cycle basis. The inbound entry at
      content/mappings/nis2/article-21-2-g.yaml will backlink
      playbook.security_awareness_training@v1 in the CORE / EXTEND
      graph-closure card.

dora: []
  # No direct DORA touchpoint declared at SKELETON. The DORA parallel
  # for the training-and-awareness slice is already carried on
  # playbook.cyber_hygiene_training@v1 against
  # dora:art-13-training-awareness. If a distinct programme-lifecycle
  # DORA slice is later scoped, it lands here in CORE.

cra: []
  # No direct CRA touchpoint declared at SKELETON. The CRA parallel
  # for the staff-cyber-hygiene-and-awareness slice is already carried
  # on playbook.cyber_hygiene_training@v1 against
  # cra:art-13-6-staff-cyber-hygiene-awareness.

gdpr:
  - mapping_id: gdpr:art-32-1-b
    article: 32(1)(b)
    todo: true
    notes: >-
      SKELETON pin. GDPR Art. 32(1)(b) requires the controller and
      processor to ensure the ongoing confidentiality, integrity,
      availability, and resilience of processing systems and services;
      the CJEU / EDPB reading extends this to staff-training as an
      organisational-measures effectiveness limb. The inbound entry
      at content/mappings/gdpr/article-32-security-of-processing.yaml
      will backlink playbook.security_awareness_training@v1 in the
      CORE / EXTEND graph-closure card.
