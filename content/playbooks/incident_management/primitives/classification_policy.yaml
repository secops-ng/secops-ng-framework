# Significance + cross-border classification policy for the
# incident_management workflow. Deterministic, table-driven — the
# significance / cross-border flags consumed by the regulator-
# submission stages are decided by exactly the row whose criteria
# match the intake-event signals.
#
# The contributor diff for a policy change is a diff over this YAML
# (with the unit tests in tests/playbooks/incident_management/
# pinning the table against the loader). No DSPy reach: this is the
# class of fact ``docs/FOUNDATION.md`` § LLM determinism reserves for
# code.
#
# Significance — NIS2 Article 23(3) reading:
#   * affected_essential_service_count is the count of distinct
#     essential or important services (under NIS2 Annex I/II) the
#     incident has materially impacted. Any positive count is a
#     significance signal in its own right.
#   * member_states_affected_count counts the EU member states whose
#     users / operators were materially affected. Two or more is
#     itself a significance signal and is also the gate for
#     cross-border (see below).
#   * disruption_severity is the operator-graded severity of the
#     service disruption: ``none``, ``minor`` (degraded but
#     continuing), ``major`` (interruption with workaround),
#     ``severe`` (full interruption).
#   * data_classification is the most sensitive classification of
#     data the incident touched: ``none``, ``internal``,
#     ``regulated`` (GDPR personal data, NIS2 essential-service
#     operational data), ``special_category`` (GDPR Article 9 special
#     categories, payment data).
#
# Cross-border — NIS2 Article 23(6) reading:
#   * Two or more member states materially affected → cross-border.
#   * One member state but a non-empty cross_border_supply_chain
#     flag from the intake event → cross-border (the operator's
#     supply chain crosses a border even if the in-territory effect
#     is single-state).
#
# Each row carries:
#   * ``id``: stable handle so a test pins behaviour to a single
#     rule; an audit-trail event references the rule by id.
#   * ``description``: short human-readable purpose.
#   * ``when``: criteria block. All conditions in the block AND
#     together; a row fires when every key matches.
#   * ``then``: verdict block — the assignment that fires.
#
# Rule ordering is the evaluation order. The first row whose ``when``
# block matches sets the verdict for that flag; later rows for that
# flag are skipped. ``default`` rows close the table.

version: 1
significance_rules:
  - id: sig.special_category_data
    description: >-
      Any special-category data (GDPR Art 9, payment data) is a
      significant incident on contact alone — the regulator clock
      runs irrespective of disruption severity.
    when:
      data_classification: special_category
    then:
      significant: true
      reason: special_category data touched (GDPR Art 9 / payment-class)

  - id: sig.severe_disruption
    description: >-
      Severe disruption (full service interruption) is itself a
      significance signal even when the data touched is internal.
    when:
      disruption_severity: severe
    then:
      significant: true
      reason: disruption_severity=severe (full service interruption)

  - id: sig.major_disruption_with_regulated_data
    description: >-
      Major disruption combined with regulated personal or
      essential-service operational data lands inside the NIS2 Art
      23(3) significance reading.
    when:
      disruption_severity: major
      data_classification: regulated
    then:
      significant: true
      reason: >-
        disruption_severity=major on regulated data
        (GDPR personal / NIS2 operational)

  - id: sig.multi_member_state
    description: >-
      Two or more member states materially affected is itself a
      significance signal; cross-border is established by the
      sibling rule.
    when:
      member_states_affected_count_at_least: 2
    then:
      significant: true
      reason: member_states_affected_count >= 2

  - id: sig.multi_essential_service
    description: >-
      Two or more affected essential / important services is a
      significance signal; a single affected service is a softer
      input that requires either severe disruption or regulated
      data to flip the significance flag.
    when:
      affected_essential_service_count_at_least: 2
    then:
      significant: true
      reason: affected_essential_service_count >= 2

  - id: sig.single_essential_service_major_or_severe
    description: >-
      A single affected essential / important service combined with
      major or severe disruption is significant.
    when:
      affected_essential_service_count_at_least: 1
      disruption_severity_at_least: major
    then:
      significant: true
      reason: >-
        affected_essential_service_count >= 1
        and disruption_severity >= major

  - id: sig.default_not_significant
    description: >-
      Catch-all: an incident that has not matched any of the
      significance rules above is not a NIS2 Art 23(3) significant
      incident. The intake-only audit-close branch in the source
      playbook handles this case.
    when: {}
    then:
      significant: false
      reason: no significance rule matched

cross_border_rules:
  - id: cb.multi_member_state
    description: Two or more member states affected → cross-border.
    when:
      member_states_affected_count_at_least: 2
    then:
      cross_border: true
      reason: member_states_affected_count >= 2

  - id: cb.single_state_supply_chain
    description: >-
      One member state directly affected, but the operator's
      supply chain crosses a border — cross-border under NIS2 Art
      23(6) supply-chain reading.
    when:
      member_states_affected_count_at_least: 1
      cross_border_supply_chain: true
    then:
      cross_border: true
      reason: >-
        single-state in-territory effect with
        cross_border_supply_chain=true

  - id: cb.default_not_cross_border
    description: Catch-all — no cross-border signal matched.
    when: {}
    then:
      cross_border: false
      reason: no cross-border rule matched
