  # entities.
  - mapping_id: nis2:todo-ai-risk-analysis
    todo: true
    notes: >-
      Placeholder pending the sibling G-02 card. Anticipated inbound
      anchor is nis2:art-21-2-a (policies on risk analysis and
      information-system security). The Art. 9(2) risk-analysis step
      of this playbook is the AI-system-specific execution surface
      for the risk-analysis policy obligation NIS2 imposes on
