# Cross-references for the agentic_threat_response playbook.
#
# SKELETON overlay — pins the outbound view of the content model for
# the agentic-threat detection and response scaffold. This directory
# ships CACAO workflow shape and structural anchors only; sibling CORE
# and EXTEND cards replace the todo-flagged placeholders with real
# OSCAL / D3FEND / OCSF identifiers, KPI hooks, and compile-target
# emissions.
#
# Inbound closure at SKELETON time:
#   - NIS2:  playbook.agentic_threat_response@v1 is added to the
#            playbook_refs list on content/mappings/nis2/article-21-2-b.yaml
#            (incident-handling capability, id nis2:art-21-2-b) and on
#            content/mappings/nis2/article-21-2-e.yaml (security in
#            acquisition, development and maintenance — the agentic-
#            tool supply-chain surface, id nis2:art-21-2-e).
#   - DORA:  no inbound YAML edge at SKELETON time. The DORA major-
#            incident-classification and reporting engine is already
#            anchored on playbook.incident_management@v1, which this
#            playbook hands off to via the escalate step. A sibling
#            CORE / EXTEND card revisits the DORA cross-regime graph
#            once the JC RTS on ICT risk management framework
#            (Commission Delegated Regulation (EU) 2024/1774) coverage
#            is extended to the agentic-tradecraft indicator class.
#            Skip entry (with SKELETON rationale) lives at
#            content/mappings/dora/_orphan_skip.yaml.
#   - CRA:   no inbound YAML edge at SKELETON time. CRA Annex I §1(d)
#            access-control obligations are already anchored on the
#            operator-side identity_compromise / iam_auditor lane; the
#            agentic-threat-response scaffold is the incident-response
#            side, not the product-security side CRA governs. A sibling
#            CORE / EXTEND card revisits the CRA cross-regime graph if
#            a documented product-security interaction surfaces. Skip
#            entry (with SKELETON rationale) lives at
#            content/mappings/cra/_orphan_skip.yaml.
#   - GDPR:  no inbound YAML edge at SKELETON time. The GDPR data-flow
#            surface (Article 30 RoPA) for this playbook is deferred to
#            the CORE card that authors
#            content/mappings/gdpr/data-flow-agentic_threat_response.md.
#            Skip entry lives at content/mappings/gdpr/_orphan_skip.yaml.
#
# Schema: schemas/playbook-mappings.schema.json
playbook: playbook.agentic_threat_response@v1

