# Cross-references for the patch_management playbook.
#
# This file is the playbook's outbound view of the content model: it
# pins OSCAL controls, OCSF event classes consumed/emitted, and the EU
# regulatory clauses this playbook helps operationalise. Inbound
# references live in content/mappings/{nis2,dora,cra}/ so the graph is
# closed in both directions.
#
# This playbook operationalises the patch / update maintenance
# capability against the operator's own deployed estate: detect a
# security update available against a tracked package / image /
# firmware line, classify the update against the operator's
# documented patch-criticality taxonomy (security-critical, security-
# routine, feature-only), stage the rollout against the operator's
# documented deployment-ring topology (test → canary → broad),
# validate the canary ring against documented health gates, fan out
# to the remaining rings on a green canary, capture the dated patch-
# application evidence record, and notify the maintenance owner. The
# playbook does not author the operator's patch-distribution
# architecture itself; it operationalises the documented rollout
# posture against an already-provisioned update channel and ring
# topology.
#
# Status: CORE. The SKELETON overlay anchored the regulatory and
# control surface (NIS2 Art. 21(2)(e) inbound + OSCAL SI-2 / SI-2(2));
# this CORE layer adds the D3FEND defensive-technique bindings for
# the detect-patch-availability, classify-patch-criticality, stage-
# rollout-to-canary-ring, and fan-out-to-broad-rings steps, lifts
# per-step metric_refs onto the CACAO artifact, and closes the DORA
# mapping graph (inbound at content/mappings/dora/article-9-
# maintenance-patch-rollout.yaml + outbound here). EXTEND-layer cards
# wire the per-target compiler emissions (n8n / Temporal / LangGraph
# goldens) once the CORE bindings land. CRA closure is deferred to a
# separate inbound-closure card under content/mappings/cra/ — the
# CRA orphan_skip entry for this playbook is left in place pending
# that work.
#
# D3FEND closure (per-step rationale):
#   - detect-patch-availability is pinned to D3-OAM (Operational
#     Activity Mapping): receiving operational vulnerability /
#     advisory data from an external coordinated-disclosure or
#     vendor-feed channel to inform defensive activity is the
#     operational-activity-mapping discipline D3-OAM names.
#     Mirrors the vuln_intake intake-step anchor on D3-OAM (which
#     intakes the same advisory class on the inbound coordinated-
#     disclosure surface) — same technique, maintenance-rollout
#     scope rather than vulnerability-handling-lifecycle scope.
#     Read-only: the playbook records the advisory observation
#     against the documented deployment-inventory row, it does not
#     author the operator's advisory-intake surface.
#   - classify-patch-criticality is pinned to D3-SYSVA (System
#     Vulnerability Assessment): CVSS / EPSS / exploit-status
#     enrichment of the advisory against the operator's documented
#     patch-criticality taxonomy is the system-vulnerability-
#     assessment discipline D3-SYSVA names. Mirrors the vuln_intake
#     triage-step anchor on D3-SYSVA (severity scoring on the
#     inbound coordinated-disclosure side) — same technique, here
#     applied to the patch-rollout cadence decision (security-
#     critical / security-routine / feature-only) rather than the
#     vulnerability-handling-lifecycle severity band.
#   - stage-rollout-to-canary-ring is pinned to D3-SU (Software
#     Update): engaging the update against the operator's pre-bound
#     canary cohort via the documented distribution channel is the
#     software-update discipline D3-SU names. Mirrors the
#     vuln_intake per-severity-response anchor on D3-SU and the
#     control.patch_evidence@v1 control file's D3-SU pin — same
#     technique, here narrowed to the staged-engagement slice
#     against the operator's documented ring topology rather than
#     the per-severity dissemination cadence.
#   - fan-out-to-broad-rings is pinned to D3-SU (Software Update):
#     engaging the update against the remaining rings of the
#     operator's documented deployment-ring topology on a green
#     canary is the same software-update discipline applied to the
#     broad-engagement slice. The Software-Update anchor is shared
#     with the stage-rollout-to-canary-ring step because both
#     halves of the rollout discharge the same D3-SU technique
#     against the same documented distribution channel, separated
#     only by the validate-canary gate that conditions the broad
#     engagement.
#   - validate-canary is deliberately NOT pinned. The functional-
#     probe / error-rate / latency / rollback-readiness
#     observation against the documented validation window reads
#     the operator's documented canary-health endpoints; the
#     health-gate signal shapes (synthetic probes, application
#     metrics, rollback-readiness attestation) are the operator's
#     upstream rather than a single D3FEND technique this playbook
#     discharges — synthetic probes lean toward D3-NTA (Network
#     Traffic Analysis) but the same gate also reads application-
#     side error-rate / latency series and rollback-readiness
#     attestation, neither of which is the network-traffic-analysis
#     discipline D3-NTA names. Pinning a single D3FEND tag would
#     misrepresent the validation surface. Mirrors the
#     ddos_response engage-mitigation gap-note precedent of
#     refusing a forced pin on a surface this playbook engages
#     against an operator-bound binding rather than authors.
#   - evidence-capture is deliberately NOT pinned. Per-execution
#     artifact emission of the dated patch-application evidence
#     record for downstream audit consumption is an evidence-stream
#     emission discipline, not a runtime countermeasure or a
#     detection step, and forcing it onto a D3FEND tag would
#     misrepresent the technique. This step is anchored on the
#     SI-2(2) OSCAL control above. Mirrors the ddos_response /
#     mfa_secured_comms / crypto_posture_management / backup_recovery
#     / cyber_hygiene_training evidence-capture gap notes.
#   - notify-maintenance-owner is deliberately NOT pinned.
#     Delivery of the evidence reference to the maintenance owner
#     along the operator's pre-bound channel is a notification
#     discipline, not a defensive technique. Mirrors the
#     ddos_response notify-incident-management-owner,
#     mfa_secured_comms notify-authentication-owner,
#     crypto_posture_management notify-crypto-owner, and
#     backup_recovery notify-continuity-owner gap notes.
# Detection bindings for individual canary-engagement / broad-fan-out
# / rollback-readiness upstream rule fingerprints are consumed via
# the existing OCSF API Activity (6003) telemetry binding rather
# than authored as Sigma references on this overlay; the operator's
# posture-management layer is the upstream of those signal shapes,
# and no stable Sigma rule ids are pinned on this overlay (the
# operator owns those fingerprints).
#
# Deliberate OSCAL omissions:
#   - CM-3 (Configuration Change Control) is NOT pinned: this
#     playbook operationalises the per-update rollout slice
#     (detect-classify-stage-validate-fan-out), not the operator's
#     standing change-management process. CM-3 anchors the
#     operator's change-control authoring surface, which lives in
#     governance documentation; pinning CM-3 here would conflate
#     the per-event rollout discipline with the change-control
#     plan-authoring surface.
#   - RA-5 (Vulnerability Monitoring and Scanning) is NOT pinned:
#     vulnerability scanning / advisory ingestion is the upstream
#     of the patch_management trigger surface, not the operational
#     discharge this playbook owns. The vuln-scanning / advisory-
#     intake discipline is anchored by playbook.vuln_intake@v1 and
#     playbook.codebase_vuln_management@v1 in their own overlays.
#   - AU-2 (Event Logging) is NOT pinned: the playbook emits OCSF
#     records, but the operator's audit-event policy is upstream of
#     this playbook.
#
# GDPR closure: a per-workflow Records of Processing Activity entry
# accompanies this overlay at
# content/mappings/gdpr/data-flow-patch_management.md (deferred to
# the CORE-layer sibling under the same gap-note discipline). The
# workflow operates on deployment-inventory identifiers, advisory
# references, ring-cohort identifiers, and attestation records; no
# personal data is processed.
#
# Schema: schemas/playbook-mappings.schema.json
playbook: playbook.patch_management@v1

oscal:
  # NIST SP 800-53 Rev. 5 controls exercised by the detect-patch-
  # availability, classify-patch-criticality, stage-rollout-to-
  # canary-ring, validate-canary, fan-out-to-broad-rings, evidence-
  # capture, and notify-maintenance-owner steps.
  - control_ref: control.patch_evidence@v1
    oscal_catalog: NIST SP 800-53 Rev. 5
    control_id: SI-2
    title: Flaw Remediation
    url: https://csrc.nist.gov/projects/risk-management/sp800-53-controls/release-search#!/control?version=5.1&number=SI-2
    notes: >-
      Anchors the playbook end-to-end as the flaw-remediation /
      patch-management capability: identify, report, and correct
      flaws by installing security-relevant updates against the
      operator's deployed estate. The detect-classify-stage-
      validate-fan-out shape closes the loop with a dated patch-
      application evidence record produced by the evidence-capture
      step. The same control file
      (content/controls/control.patch_evidence@v1.yaml) carries
      the CRA Annex I §2 security-updates cross-reference for
      downstream CRA inbound-closure cards.

  - control_ref: control.patch_evidence@v1
    oscal_catalog: NIST SP 800-53 Rev. 5
    control_id: SI-2(2)
    title: Automated Flaw Remediation Status
    url: https://csrc.nist.gov/projects/risk-management/sp800-53-controls/release-search#!/control?version=5.1&number=SI-2
    notes: >-
      Covers the validate-canary and evidence-capture steps: SI-2(2)
      demands automated determination of the state of system
      components with regard to flaw remediation. The canary health
      gate observation captured at validate and the broad-rollout id
      captured at fan-out form the durable status artefact SI-2(2)
      reviewers consume; the dated evidence record produced by the
      evidence-capture step is the audit-evident output.

d3fend:
  # MITRE D3FEND v1.0.0 defensive technique tags per playbook step.
  # CACAO step UUIDs are pinned to the real action UUIDs resolved
  # from content/playbooks/patch_management/playbook.cacao.json
  # (seven action bodies: detect-patch-availability, classify-patch-
  # criticality, stage-rollout-to-canary-ring, validate-canary,
  # fan-out-to-broad-rings, evidence-capture, notify-maintenance-
  # owner). Four steps carry per-step D3FEND pins: D3-OAM on the
  # detect step, D3-SYSVA on the classify step, and D3-SU on both
  # the stage-rollout-to-canary-ring and fan-out-to-broad-rings
  # steps. The validate-canary, evidence-capture, and notify-
  # maintenance-owner steps are deliberately not pinned and the
  # gaps are documented in the header above and in comments below
  # (mirroring the ddos_response runtime-enforcement / emission /
  # delivery gap-note precedents).
  - step: action--70000000-0000-4000-8000-000000000002
    d3fend_id: D3-OAM
    d3fend_name: Operational Activity Mapping
    url: https://d3fend.mitre.org/technique/d3f:OperationalActivityMapping/
    notes: >-
      detect-patch-availability — receiving operational
      vulnerability / advisory data from an external coordinated-
      disclosure or vendor-feed channel against __update_subject__
      to inform defensive activity (the maintenance-rollout
      discharge) is the operational-activity-mapping discipline
      D3-OAM names. Mirrors the vuln_intake intake-step anchor on
      D3-OAM, which intakes the same advisory class on the inbound
      coordinated-disclosure surface; same technique, here narrowed
      to the maintenance-rollout scope rather than the
      vulnerability-handling-lifecycle scope. Read-only: the
      playbook records the advisory observation against the
      documented deployment-inventory row, it does not author the
      operator's advisory-intake surface. Detection bindings for
      individual advisory-intake upstream rule fingerprints are
      consumed via the API Activity (6003) telemetry binding below
      rather than authored as Sigma references on this overlay; the
      operator's advisory-intake layer is the upstream of those
      signal shapes.

  - step: action--70000000-0000-4000-8000-000000000003
    d3fend_id: D3-SYSVA
    d3fend_name: System Vulnerability Assessment
    url: https://d3fend.mitre.org/technique/d3f:SystemVulnerabilityAssessment/
    notes: >-
      classify-patch-criticality — CVSS / EPSS / exploit-status
      enrichment of the advisory against the operator's documented
      patch-criticality taxonomy (security-critical, security-
      routine, feature-only) is the system-vulnerability-assessment
      discipline D3-SYSVA names. Mirrors the vuln_intake triage-
      step anchor on D3-SYSVA, which scores the same advisory
      class on the inbound coordinated-disclosure side; same
      technique, here applied to the patch-rollout cadence
      decision against the operator's deployed estate rather than
      the vulnerability-handling-lifecycle severity band. The
      classification record (__patch_criticality__) is the audit-
      evident output of the assessment pass and conditions the
      rollout cadence selected at the stage-rollout-to-canary-ring
      step.

  - step: action--70000000-0000-4000-8000-000000000004
    d3fend_id: D3-SU
    d3fend_name: Software Update
    url: https://d3fend.mitre.org/technique/d3f:SoftwareUpdate/
    notes: >-
      stage-rollout-to-canary-ring — engaging the update against
      the operator's pre-bound canary cohort via the documented
      distribution channel (package mirror, image registry,
      firmware-distribution surface) is the software-update
      discipline D3-SU names. Mirrors the vuln_intake per-severity-
      response anchor on D3-SU and the control.patch_evidence@v1
      control file's D3-SU pin; same technique, here narrowed to
      the staged-engagement slice against the operator's documented
      ring topology rather than the per-severity dissemination
      cadence. The staged ring identifier (__staged_ring_id__) is
      the durable artefact of the staged-engagement slice and is
      consumed by the validate-canary and evidence-capture steps.

  - step: action--70000000-0000-4000-8000-000000000006
    d3fend_id: D3-SU
    d3fend_name: Software Update
    url: https://d3fend.mitre.org/technique/d3f:SoftwareUpdate/
    notes: >-
      fan-out-to-broad-rings — engaging the update against the
      remaining rings of the operator's documented deployment-ring
      topology on a green canary is the same software-update
      discipline applied to the broad-engagement slice. The D3-SU
      anchor is shared with the stage-rollout-to-canary-ring step
      because both halves of the rollout discharge the same
      software-update technique against the same documented
      distribution channel, separated only by the validate-canary
      gate that conditions the broad engagement. On an unhealthy
      canary the step is skipped and __broad_rollout_id__ is left
      empty; the evidence-capture step still publishes the dated
      record with the skip marker so the audit-evident chain is
      closed without forcing the broad rollout against a failing
      canary.

  # validate-canary (action--70000000-0000-4000-8000-000000000005)
  # is deliberately NOT pinned. The functional-probe / error-rate /
  # latency / rollback-readiness observation against the documented
  # validation window reads the operator's documented canary-health
  # endpoints; the health-gate signal shapes (synthetic probes,
  # application metrics, rollback-readiness attestation) are the
  # operator's upstream rather than a single D3FEND technique this
  # playbook discharges — synthetic probes lean toward D3-NTA
  # (Network Traffic Analysis) but the same gate also reads
  # application-side error-rate / latency series and rollback-
  # readiness attestation, neither of which is the network-traffic-
  # analysis discipline D3-NTA names. Pinning a single D3FEND tag
  # would misrepresent the validation surface. Mirrors the
  # ddos_response engage-mitigation gap-note precedent of refusing
  # a forced pin on a surface this playbook engages against an
  # operator-bound binding rather than authors.
  #
  # evidence-capture (action--70000000-0000-4000-8000-000000000007)
  # is deliberately NOT pinned. Per-execution artifact emission of
  # the dated patch-application evidence record for downstream
  # audit consumption is an evidence-stream emission discipline,
  # not a runtime countermeasure or a detection step, and forcing
  # it onto a D3FEND tag would misrepresent the technique. This
  # step is anchored on the SI-2(2) OSCAL control above. Mirrors
  # the ddos_response evidence-capture and the mfa_secured_comms /
  # crypto_posture_management / backup_recovery /
  # cyber_hygiene_training evidence-emission gap notes.
  #
  # notify-maintenance-owner
  # (action--70000000-0000-4000-8000-000000000008) is deliberately
  # NOT pinned. Delivery of the evidence reference to the
  # maintenance owner along the operator's pre-bound channel
  # (ticketing system, chat thread, change-management board) is a
  # notification discipline, not a defensive technique. Mirrors the
  # ddos_response notify-incident-management-owner,
  # mfa_secured_comms notify-authentication-owner,
  # crypto_posture_management notify-crypto-owner, and
  # backup_recovery notify-continuity-owner gap notes.

ocsf:
  # OCSF v1.3.0 telemetry bindings. The detect-patch-availability,
  # classify-patch-criticality, stage-rollout, fan-out, evidence-
  # capture, and notify-maintenance-owner steps interact with
  # operator API surfaces (advisory-intake feeds, distribution-
  # channel push endpoints, change-management ticketing, evidence
  # store, notification channel). The validate-canary step reads
  # the operator's documented health gates (functional probes,
  # error-rate / latency deviation) which generally land on the
  # same API surface in this SKELETON layer; richer per-step
  # telemetry bindings (e.g. OCSF Configuration State for canary
  # configuration drift, OCSF Network Activity for canary-traffic
  # health) are deferred to CORE-layer cards once stable upstream
  # signal shapes are selected.
  - id: telemetry.api_activity@v1
    category_uid: 6
    category_name: Application Activity
    class_uid: 6003
    class_name: API Activity
    ocsf_version: "1.3.0"
    direction: both
    notes: >-
      Consumed at the detect-patch-availability and classify-patch-
      criticality steps (reads against the operator's documented
      advisory-intake surface and severity / exploit-status
      enrichment endpoints), at the stage-rollout-to-canary-ring and
      fan-out-to-broad-rings steps (write calls against the
      operator's distribution-channel push endpoints and change-
      management ticketing), and at the validate-canary step (reads
      against the operator's documented canary-health endpoints).
      Emitted at the evidence-capture step (write call publishing
      the dated patch-application evidence record to the operator's
      evidence store) and at the notify-maintenance-owner step
      (delivery dispatch to the maintenance owner's pre-bound
      channel). Schema:
      https://schema.ocsf.io/1.3.0/classes/api_activity

nis2:
  # Inbound entry that backlinks playbook.patch_management@v1:
  #   - content/mappings/nis2/article-21-2-e.yaml
  #     (id nis2:art-21-2-e — security in acquisition, development
  #     and maintenance)
  # Pinned outbound below to close the graph. The matching
  # `playbook_refs:` addition on the NIS2 side lands in this same
  # SKELETON PR so the orphan-CI graph closes on the NIS2 axis
  # without a skip entry.
  - mapping_id: nis2:art-21-2-e
    article: 21(2)(e)
    notes: >-
      NIS2 Art. 21(2)(e) requires essential and important entities
      to apply security in network and information systems
      acquisition, development, and MAINTENANCE. The patch_management
      playbook is the operational discharge of the maintenance limb
      against the operator's own deployed estate — the case set
      currently leans on vuln_intake / codebase_vuln_management for
      the vulnerability-handling and SBOM-disclosure limbs, neither
      of which carries the patch / update rollout discipline against
      the operator's deployed estate (vuln_intake is the inbound
      coordinated-disclosure intake surface; codebase_vuln_management
      is the SBOM-driven dependency-review surface for software the
      operator ships). The detect-patch-availability and classify-
      patch-criticality steps cover the advisory-intake and
      triage slice; the stage-rollout-to-canary-ring and validate-
      canary steps cover the staged-engagement slice against the
      operator's documented ring topology; the fan-out-to-broad-
      rings step covers the broad-engagement slice on a green canary;
      the evidence-capture step closes the loop with audit-evident
      observation of the patch application across the validation
      window.

dora:
  # Inbound entry that backlinks playbook.patch_management@v1:
  #   - content/mappings/dora/article-9-maintenance-patch-rollout.yaml
  #     (id dora:art-9-maintenance-patch-rollout — DORA Art. 9(4)(a)
  #     per-event maintenance / patch-rollout slice; companion to
  #     article-9-and-rts-vuln-mgmt.yaml's vulnerability-handling
  #     anchor at dora:art-9-vuln-mgmt)
  # Pinned outbound below to close the graph. The orphan-CI skip
  # entry for patch_management under
  # content/mappings/dora/_orphan_skip.yaml is removed in this same
  # CORE PR — the grace-window skip is no longer needed once the
  # real edge lands.
  - mapping_id: dora:art-9-maintenance-patch-rollout
    article: "9(4)(a)"
    notes: >-
      DORA Art. 9(4)(a) requires financial entities to operate the
      protection-and-prevention surface of their ICT risk management
      framework against the operator's deployed estate; the operative
      detail is in the Level 2 RTS (Commission Delegated Regulation
      (EU) 2024/1774, JC RTS on ICT risk management framework)
      Article 10 (Vulnerability and patch management procedures),
      including testing and rollback. The patch_management playbook
      is the per-event materialisation of the maintenance / patch-
      rollout slice of that obligation against the operator's
      deployed estate: detect-classify-stage-validate-fan-out against
      the documented ring topology with a dated patch-application
      evidence record. This outbound entry is the structural closure
      of the dora:art-9-maintenance-patch-rollout backlink and is
      the per-event maintenance / patch-rollout companion to
      dora:art-9-vuln-mgmt (vulnerability-handling lifecycle anchor
      on the inbound CVD-intake and codebase-side surfaces); both
      anchor on the same Art. 9(4)(a) surface and JC RTS Art. 10
      Level 2 detail but discharge independent operational
      disciplines and are mapped separately to keep the inbound
      graph atom-per-obligation. Mirrors the F-WF-DOS CORE precedent
      of authoring a distinct per-event slice rather than
      overloading an existing entry.

cra:
  # Inbound entry that backlinks playbook.patch_management@v1:
  #   - content/mappings/cra/annex-i-2-security-updates-rollout.yaml
  #     (id cra:annex-i-2-security-updates-rollout — CRA Annex I §2
  #     per-event maintenance-rollout slice against the operator's
  #     deployed estate; companion to article-14-and-annex-i.yaml's
  #     §2(7) dissemination-cadence anchor at
  #     cra:annex-i-2-security-updates, which pins vuln_intake)
  # Pinned outbound below to close the graph. The orphan-CI skip
  # entry for patch_management under
  # content/mappings/cra/_orphan_skip.yaml is removed in this same
  # closure PR — the documented grace-window skip is no longer
  # needed once the real edge lands.
  - mapping_id: cra:annex-i-2-security-updates-rollout
    article: Annex I §2
    notes: >-
      CRA Annex I §2 requires manufacturers to provide security
      updates to address identified vulnerabilities throughout the
      declared support period; the §2(7) limb in particular requires
      that the updates be disseminated without delay and accompanied
      by advisory messages. The dissemination-cadence side is anchored
      by cra:annex-i-2-security-updates in article-14-and-annex-i.yaml
      against playbook.vuln_intake@v1 (inbound coordinated-disclosure
      surface that produces the update + advisory pair). The per-event
      maintenance-rollout side against the operator's own deployed
      estate is what patch_management operationalises: detect that a
      security update is available against a tracked package / image /
      firmware line, classify it against the documented patch-
      criticality taxonomy, stage the rollout against the documented
      deployment-ring topology, validate the canary, fan out on a
      green canary, and capture the dated patch-application evidence
      record. The two §2 entries discharge independent operational
      disciplines and are mapped separately to keep the inbound graph
      atom-per-obligation — mirrors the cra:annex-i-1-availability /
      cra:annex-i-1-h-availability-restore-drill split on §1(h).
      Cross-links: the OSCAL anchor is SI-2 / SI-2(2) on
      control.patch_evidence@v1 (which already carries the CRA Annex I
      §2 security-updates cross-reference); the NIS2 parallel is
      nis2:art-21-2-e (security in acquisition, development and
      maintenance — maintenance limb); the DORA parallel is
      dora:art-9-maintenance-patch-rollout (Art. 9(4)(a) per-event
      maintenance / patch-rollout slice under JC RTS Art. 10).
