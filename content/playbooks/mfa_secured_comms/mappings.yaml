# Cross-references for the mfa_secured_comms playbook.
#
# This file is the playbook's outbound view of the content model: it
# pins OSCAL controls, OCSF event classes consumed/emitted, and the EU
# regulatory clauses this playbook helps operationalise. Inbound
# references live in content/mappings/{nis2,dora}/ so the graph is
# closed in both directions.
#
# This playbook operates the multi-factor / continuous-authentication
# and secured-communications posture surface required by NIS2 Art.
# 21(2)(j): probe MFA coverage across in-scope principals, assess
# whether continuous-authentication signals are observed on long-lived
# sessions, verify the out-of-band emergency communications channel
# is reachable independently of the primary information-system path,
# capture a dated posture-attestation artifact, and notify the
# authentication owner. The playbook does not author the
# authentication or secured-communications policy itself; it
# operationalises a policy that lives in the operator's governance
# documentation.
#
# Status: SKELETON. CORE-layer cards add the detection bindings for
# missing-MFA / stale-session / unreachable-OOB signals once stable
# upstream rule ids are selected; an EXTEND card wires the
# session-staleness KPI and OOB-reachability KPI emitters against
# the operator's evidence store. This overlay anchors the regulatory
# and control surface only.
#
# Deliberate OSCAL omissions:
#   - IA-5 (Authenticator Management) is the obvious sibling anchor
#     of IA-2, but it covers the full authenticator lifecycle
#     (issuance, change, revocation, binding). This playbook
#     operates the per-window enforcement-state and enrolment-state
#     probe slice of that lifecycle only; the authenticator-
#     management surface itself belongs to the operator's identity
#     governance, not to this exercise playbook. Pinning IA-5 here
#     would double-count the control surface.
#   - IR-4 (Incident Handling) is NOT pinned: the OOB-channel
#     verification is a posture exercise that tests the readiness
#     of the emergency channel, not the incident-handling capability
#     that uses it. IR-4 anchors the incident_management playbook;
#     pinning it here would cross-claim that surface.
#   - AU-2 (Event Logging) is NOT pinned: the playbook emits OCSF
#     API Activity records, but the operator's audit-event policy is
#     upstream of this playbook.
#
# D3FEND closure: D3FEND v1.0.0 frames its defensive techniques
# around runtime countermeasures against adversary behaviours. The
# discipline this playbook operates — periodic MFA-coverage probing,
# continuous-authentication assessment, and OOB-channel readiness
# verification — is a posture-readiness exercise rather than a
# runtime countermeasure against an adversary behaviour. The d3fend
# block is intentionally empty rather than carrying a forced tag,
# mirroring the gap-note precedent on the crypto_posture_management,
# backup_recovery, and on_call_rotation overlays. Detection bindings
# for missing-MFA / stale-session / unreachable-OOB signals are
# owned by the CORE-layer detection card once stable upstream rule
# ids are selected.
#
# CRA closure: the playbook-mappings schema's top-level keys are
# fixed (oscal/d3fend/ocsf/nis2/dora/cra). CRA cross-references are
# not expressed for this playbook either inbound or outbound.
# mfa_secured_comms is an operator-side posture-exercise surface;
# CRA Art.13 product-notification and Annex I vulnerability-handling
# obligations do not attach here. No outbound CRA entries are
# emitted on this overlay.
#
# DORA closure: DORA Art. 9(4)(b) authentication controls and the JC
# RTS on ICT risk management framework (Commission Delegated Reg.
# (EU) 2024/1774) carry authentication and secured-communications
# obligations that overlap this playbook's scope. The inbound entry
# on the DORA side has not yet been authored; a sibling card closes
# the DORA graph by adding the inbound link and the outbound entry
# here in one PR rather than landing a one-sided edge. No outbound
# DORA entry is emitted on this SKELETON overlay.
#
# Schema: schemas/playbook-mappings.schema.json
playbook: playbook.mfa_secured_comms@v1

oscal:
  # NIST SP 800-53 Rev. 5 controls exercised by the probe-mfa-coverage,
  # assess-continuous-auth, verify-oob-channels, and evidence-capture
  # steps.
  - id: control.identification_and_authentication@v1
    oscal_catalog: NIST SP 800-53 Rev. 5
    control_id: IA-2
    title: Identification and Authentication (Organizational Users)
    url: https://csrc.nist.gov/projects/risk-management/sp800-53-controls/release-search#!/control?version=5.1&number=IA-2
    notes: >-
      Anchors the probe-mfa-coverage and assess-continuous-auth
      steps: IA-2 requires the organisation to uniquely identify and
      authenticate organisational users, and IA-2(1) and IA-2(2)
      require multi-factor authentication to privileged and
      non-privileged accounts. The MFA-coverage snapshot is the
      per-window measurement of enrolment and enforcement state
      against the declared policy; the continuous-authentication
      assessment is the per-window measurement of session-age and
      re-authentication cadence on long-lived sessions. The dated
      attestation emitted by the evidence-capture step is the
      audit-evident record IA-2 reviewers read against the declared
      authentication policy.

  - id: control.alternate_communications@v1
    oscal_catalog: NIST SP 800-53 Rev. 5
    control_id: CP-8
    title: Telecommunications Services
    url: https://csrc.nist.gov/projects/risk-management/sp800-53-controls/release-search#!/control?version=5.1&number=CP-8
    notes: >-
      Anchors the verify-oob-channels step: CP-8 requires the
      organisation to establish alternate telecommunications services
      with priority-of-service provisions to support resumption of
      essential mission and business functions. The per-channel
      record of reachability, independence-path verification, and
      last-tested timestamp is the per-window evidence that the
      out-of-band emergency communications channel remains reachable
      independently of the primary information-system path.

d3fend: []
  # D3FEND v1.0.0 carries no defensive-technique anchor that matches
  # the periodic MFA-coverage probing, continuous-authentication
  # assessment, and OOB-channel readiness verification discipline
  # this playbook operates without misrepresenting it. The block is
  # intentionally empty rather than carrying a forced tag, mirroring
  # the gap-note precedent documented in the header. Detection
  # bindings for missing-MFA / stale-session / unreachable-OOB
  # signals are owned by the CORE-layer detection card once stable
  # upstream rule ids are selected.

ocsf:
  # OCSF v1.3.0 telemetry bindings. The probe-mfa-coverage,
  # assess-continuous-auth, verify-oob-channels, evidence-capture,
  # and notify steps all interact with operator API surfaces (the
  # identity-provider surface, the session-management surface, the
  # out-of-band channel test endpoints, the evidence store, the
  # notification channel). API Activity (6003) is the consistent
  # class across both consumed and emitted records.
  - id: telemetry.api_activity@v1
    category_uid: 6
    category_name: Application Activity
    class_uid: 6003
    class_name: API Activity
    ocsf_version: "1.3.0"
    direction: both
    notes: >-
      Consumed at the probe-mfa-coverage step (read calls against
      the identity-provider surface to resolve enrolment and
      enforcement state per principal), at the assess-continuous-
      auth step (read calls against the session-management surface
      for session age and re-authentication events), and at the
      verify-oob-channels step (test transactions against the
      out-of-band channel endpoints — modelled as read-only API
      activity). Emitted at the evidence-capture step (write call
      publishing the dated posture-attestation record to the
      operator's evidence store) and at the notify-authentication-
      owner step (delivery dispatch to the authentication owner's
      pre-bound channel). The api_activity records carry the
      request metadata the kri.mfa_coverage_gaps@v1 metric reads.
      Schema: https://schema.ocsf.io/1.3.0/classes/api_activity

nis2:
  # Inbound entries that backlink playbook.mfa_secured_comms@v1:
  #   - content/mappings/nis2/article-21-2-j.yaml
  #     (id nis2:art-21-2-j — use of multi-factor or continuous
  #     authentication, secured voice/video/text communications,
  #     and secured emergency communications systems)
  # Pinned outbound below to close the graph.
  - mapping_id: nis2:art-21-2-j
    article: 21(2)(j)
    notes: >-
      NIS2 Art. 21(2)(j) requires essential and important entities
      to operate multi-factor or continuous authentication, secured
      voice/video/text communications, and secured emergency
      communications systems inside the entity where appropriate.
      The mfa_secured_comms playbook is the per-cycle materialisation
      of that obligation's measurement and attestation surface: the
      MFA-coverage probe, the continuous-authentication assessment,
      the OOB-channel verification, and the dated posture-attestation
      record published to the operator's evidence store are the
      audit-evident discharge of the clause. The
      kri.mfa_coverage_gaps@v1 metric trips on MFA-coverage
      regressions. The inbound entry pins the same control_refs
      (control.mfa_state_probe@v1, control.oob_channel_probe@v1) as
      this overlay; this outbound entry is the structural closure of
      that backlink.

dora: []
  # SKELETON scope is NIS2 Art.21(2)(j) only. DORA Art. 9(4)(b)
  # authentication controls and the JC RTS on ICT risk management
  # framework (Commission Delegated Reg. (EU) 2024/1774) carry
  # authentication and secured-communications obligations that
  # overlap this playbook's scope, but the inbound entry on the
  # DORA side has not yet been authored. A sibling card closes the
  # DORA graph by adding the inbound link and the outbound entry
  # here in one PR rather than landing a one-sided edge. No outbound
  # DORA entry is emitted on this SKELETON overlay.

cra: []
  # See CRA closure note in the header — no CRA cross-references
  # attach to the operator-side authentication and secured-
  # communications posture exercise surface this playbook operates.
