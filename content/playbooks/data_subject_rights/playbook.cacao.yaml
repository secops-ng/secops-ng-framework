type: playbook
spec_version: "2.0"
id: playbook--d5b17a15-0000-4000-8000-000000000001
name: GDPR Article 15-22 data subject rights (DSR) intake and fulfilment
description: >-
  CACAO v2 playbook for the operator-side data subject rights (DSR)
  intake and fulfilment lifecycle a controller runs when a data
  subject exercises one of the GDPR Chapter III rights against
  personal data the controller holds. Covers Article 15 (access),
  Article 16 (rectification), Article 17 (erasure), Article 18
  (restriction), Article 20 (portability) and Article 21 (objection);
  Article 22 (automated individual decision-making) is an in-scope
  classifier axis routed to the controller's human-in-the-loop review
  surface, not a parallel workflow. The lifecycle chains seven bound
  action steps around one verification gate: receive_request →
  verify_identity → classify_request → [identity verified?] →
  route_to_data_owners → compile_fulfilment_evidence →
  send_controller_response → record_outcome, with the unverified
  branch short-circuiting from the gate to the Article 12(6)
  additional-information response and an unverified_subject outcome.
  Every action step binds a deterministic primitive under primitives/
  (bound since the CORE-WIRE card; stable at content_version 1.0.0);
  the intake surface, the verification surface, the data-inventory
  join, owner transport, secure delivery and the evidence store are
  adapter-bound operator surfaces the operator wires. The Article
  12(3) one-month clock is anchored on the supplied receipt instant
  and an extension is representable only with its justification. CACAO
  v2 + SecOps-NG content-model extensions.
playbook_types:
  - notification
  - investigation
created_by: identity--5a509a09-5a50-45a5-85a5-095a509a509a
created: "2026-07-03T00:00:00Z"
modified: "2026-07-03T00:00:00Z"
valid_from: "2026-07-03T00:00:00Z"
labels:
  - gdpr
  - article-15
  - article-16
  - article-17
  - article-18
  - article-20
  - article-21
  - article-22
  - data-subject-rights
  - dsr
external_references:
  - name: OASIS CACAO v2.0
    description: >-
      Workflow step types (start, action, end), variable
      conventions, x_ extension namespace.
    source: OASIS Open
  - name: >-
      General Data Protection Regulation (EU) 2016/679 —
      Chapter III, Articles 15-22
    source: Official Journal of the European Union
    url: https://eur-lex.europa.eu/eli/reg/2016/679/oj
  - name: "GDPR Article 12 — transparent information, communication and modalities for the exercise of the rights of the data subject"
    source: Official Journal of the European Union
    url: https://eur-lex.europa.eu/eli/reg/2016/679/oj
  - name: >-
      EDPB Guidelines 01/2022 on data subject rights — right of
      access
    source: European Data Protection Board
playbook_variables:
  __case_id__:
    type: string
    description: >-
      DSR case identifier assigned at intake. Correlation key across
      identity verification, classification, data-owner routing,
      evidence compilation, controller response, and outcome recording
      so a reviewer can join the full request-fulfilment lifecycle
      into a single reportable-event ledger keyed to the operator's
      Article 5(2) accountability surface. Extracted at the compile
      target's adapter seam from __dsr_case__.case_id.
    external: false
  __subject_contact__:
    type: string
    description: >-
      Contact channel supplied by the data subject at intake (email
      address, postal address, sovereign IdP-bound identifier, or
      authenticated in-app account handle). Read by verify_identity to
      bind the request to the subject on the controller's declared
      subject-verification surface and by send_controller_response to
      route the outbound envelope. Treated as personal data
      throughout; retention and transfer discipline follow the
      operator's DSR data-flow documentation. Mirrored on
      __dsr_case__.subject_contact; supplied by the subject through
      the intake surface.
    external: true
  __request_type__:
    type: string
    description: >-
      Classified request axis. One of: access (Article 15),
      rectification (Article 16), erasure (Article 17), restriction
      (Article 18), portability (Article 20), objection (Article 21),
      automated-decision-review (Article 22 concern). Determines
      routing to data-store owners and the shape of the fulfilment-
      evidence pack. Extracted at the adapter seam from
      __classification__.request_type; the adapter's own
      classification enters as __classified_request_type__.
    external: false
  __identity_verified__:
    type: boolean
    description: >-
      Whether verify_identity succeeded on the controller's declared
      subject-verification surface (sovereign IdP integration point on
      the SecOps-NG substrate). A false outcome short-circuits the
      workflow into a rejection or an additional-information request
      under Article 12(6) rather than fulfilling the request against
      an unverified subject. Extracted at the adapter seam from
      __verification_record__.identity_verified; the predicate of the
      verification gate.
    external: false
  __data_owner_manifest__:
    type: string
    description: >-
      Reference to the routed data-store owner list resolved by
      route_to_data_owners against the operator's declared data-
      inventory surface. Enumerates the per-owner acknowledgement
      envelopes the workflow expects back before
      compile_fulfilment_evidence can close. Empty until
      route_to_data_owners resolves the owner set for the classified
      request. Extracted at the adapter seam from
      __owner_manifest__.manifest_id.
    external: false
  __fulfilment_pack_ref__:
    type: string
    description: >-
      Reference to the compiled fulfilment evidence pack (portability
      data package, erasure-attestation set, rectification
      confirmation, access-copy assembly, or restriction-scope
      envelope depending on __request_type__). Populated before
      send_controller_response gates on the Article 12(3) one-month
      window. Extracted at the adapter seam from
      __fulfilment_pack__.fulfilment_pack_ref; null on the unverified
      branch, where no pack is compiled.
    external: false
  __response_deadline__:
    type: string
    description: >-
      ISO 8601 timestamp of the Article 12(3) response deadline
      derived from __request_received_ts__ plus one month, with an
      extension marker where the controller has invoked the Article
      12(3) two-month extension. send_controller_response MUST send on
      or before this deadline; the on-time-response KPI reads against
      this value. Extracted at the adapter seam from
      __classification__.response_deadline.
    external: false
  __request_received_ts__:
    type: string
    description: >-
      ISO 8601 timestamp when the request was received on the
      controller's DSR intake surface. Anchors the Article 12(3)
      response-window clock. Stamped by receive_request. Supplied on
      the raw request by the intake surface and extracted at the
      adapter seam from __dsr_case__.request_received_ts.
    external: false
  __outcome_code__:
    type: string
    description: >-
      Terminal outcome recorded on the case. One of: fulfilled,
      partially_fulfilled, refused_manifestly_unfounded,
      refused_excessive, refused_exemption_applies,
      extended_two_months, unverified_subject. Feeds the operator's
      Article 5(2) accountability posture and any downstream regulator
      query. Extracted at the adapter seam from
      __outcome_record__.outcome_code; the handler's decision enters
      as __outcome_decision__.
    external: false
  __raw_request__:
    type: dictionary
    description: >-
      Raw request record handed over by the intake surface adapter for
      intake.open_dsr_case: subject_contact, stated_request,
      request_received_ts (the Zulu instant the surface received it —
      the Article 12(3) anchor), article_22_concern_noted (real
      boolean). Personal data carried opaquely.
    external: true
  __intake_channel__:
    type: string
    description: >-
      Which DSR intake surface received the request:
      privacy_policy_address, in_app_portal or paper_channel. Part of
      the content-derived case identity.
    external: true
  __dsr_case__:
    type: dictionary
    description: >-
      Case envelope composed by intake.open_dsr_case: case_id,
      intake_channel, subject_contact, stated_request,
      request_received_ts, article_22_concern_noted. The adapter
      extracts __case_id__ and __request_received_ts__ and mirrors
      __subject_contact__.
    external: false
  __verification_method__:
    type: string
    description: >-
      Which verification path the surface used: idp_sso_assertion
      (primary, where the subject holds an authenticated account on
      the controller's IdP), identity_document_check, shared_secret or
      channel_of_record_callback. Consumed by
      verification.record_identity_verification.
    external: true
  __verification_result__:
    type: boolean
    description: >-
      The verification surface's verdict as a real boolean — a string
      'false' is refused. Consumed by
      verification.record_identity_verification; recorded as
      __identity_verified__.
    external: true
  __verification_evidence_ref__:
    type: string
    description: >-
      Role-shaped pointer to the verification evidence on the
      controller's verification surface. The evidence itself —
      including anything the subject supplied to prove identity —
      stays there (sovereign-stack constraint).
    external: true
  __verification_record__:
    type: dictionary
    description: >-
      Verification record composed by
      verification.record_identity_verification: case_id,
      verification_method, identity_verified, evidence_ref — a closed
      key set carrying no subject-supplied attribute. The adapter
      extracts __identity_verified__.
    external: false
  __classified_request_type__:
    type: string
    description: >-
      The adapter's classification of the subject's stated request
      onto the closed Chapter III taxonomy (access, rectification,
      erasure, restriction, portability, objection,
      automated_decision_review). Consumed by
      classification.classify_request, which pins the article and the
      deadline.
    external: true
  __extension_decision__:
    type: dictionary
    description: >-
      The controller's Article 12(3) extension decision, or null when
      none: further_months (1 or 2 — two further months is the upper
      bound) and a non-empty justification. There is no unjustified
      shape. Consumed by classification.classify_request and echoed as
      the extension notice by response.compose_controller_response.
    external: true
  __classification__:
    type: dictionary
    description: >-
      Classification envelope composed by
      classification.classify_request: request_type, article,
      request_received_ts, base_deadline, response_deadline,
      extension, human_review_required. The adapter extracts
      __request_type__ and __response_deadline__.
    external: false
  __owner_rows__:
    type: string
    description: >-
      JSON-native list of the owner rows the adapter resolved against
      the controller's declared data-inventory surface — one record
      per (owner_ref, store_ref) holding personal data on the subject.
      Consumed by routing.resolve_data_owner_manifest; the join itself
      is a runtime query of the controller's own records.
    external: true
  __owner_manifest__:
    type: dictionary
    description: >-
      Owner manifest composed by routing.resolve_data_owner_manifest:
      manifest_id, case_id, request_type, evidence_ask, expected
      (owner_ref, store_ref, ack_id per routed envelope). The adapter
      extracts __data_owner_manifest__; the fulfilment binding
      consumes the whole manifest.
    external: false
  __owner_returns__:
    type: string
    description: >-
      JSON-native list of the owner acknowledgement envelopes returned
      against the manifest for fulfilment.compile_fulfilment_pack:
      ack_id, evidence_ref, optional qualification (an Article 17(3)
      retention exemption, an overriding-legitimate-interest
      determination). Transport and timeouts are the adapter's.
    external: true
  __fulfilment_pack__:
    type: dictionary
    description: >-
      Fulfilment pack composed by fulfilment.compile_fulfilment_pack:
      fulfilment_pack_ref, case_id, request_type, evidence_ask, items
      (owner_ref, store_ref, ack_id, evidence_ref, qualification),
      qualified_items. The adapter extracts __fulfilment_pack_ref__.
    external: false
  __dispatch_ts__:
    type: string
    description: >-
      Zulu instant the compile target's delivery adapter dispatches
      the controller's response. Judged against __response_deadline__
      by response.compose_controller_response; lateness is recorded,
      never absorbed.
    external: true
  __refusal_decision__:
    type: dictionary
    description: >-
      The controller's refusal decision, or null when the request is
      not refused: ground (manifestly_unfounded, excessive — Article
      12(5) — or exemption_applies for a Chapter III sub-exemption)
      and non-empty reasons. The composed refusal always carries the
      Article 77 and Article 79 remedies.
    external: true
  __identity_followup__:
    type: dictionary
    description: >-
      The Article 12(6) additional-information request the controller
      sends on the unverified branch, or null when identity was
      verified: non-empty reasons naming what the requester must
      supply. Exclusive with the pack and the refusal.
    external: true
  __controller_response__:
    type: dictionary
    description: >-
      Response envelope composed by
      response.compose_controller_response: disposition (fulfilment,
      refusal or additional_information_request), fulfilment_pack_ref,
      refusal, additional_information_request, extension_notice,
      response_deadline, dispatch_ts, responded_on_time. Delivered by
      the subject-facing channel adapter; the outcome binding reads
      .dispatch_ts.
    external: false
  __outcome_decision__:
    type: string
    description: >-
      The case handler's terminal outcome code from the closed
      vocabulary (fulfilled, partially_fulfilled,
      refused_manifestly_unfounded, refused_excessive,
      refused_exemption_applies, extended_two_months,
      unverified_subject). Consumed by outcome.record_case_outcome and
      recorded as __outcome_code__.
    external: true
  __outcome_record__:
    type: dictionary
    description: >-
      Outcome record composed by outcome.record_case_outcome:
      record_id, case_id, outcome_code, response_dispatch_ts,
      response_deadline, responded_on_time, deadline_delta_seconds,
      fulfilment_pack_ref. Persisted by the evidence-store adapter;
      the adapter extracts __outcome_code__.
    external: false
workflow_start: start--d5b17a15-0000-4000-8000-000000000001
workflow:
  start--d5b17a15-0000-4000-8000-000000000001:
    type: start
    name: dsr_start
    on_completion: action--d5b17a15-0000-4000-8000-000000000002
  action--d5b17a15-0000-4000-8000-000000000002:
    type: action
    name: receive_request
    description: >-
      Receive a data subject rights request through the controller's
      DSR intake surface — privacy-policy address, subject-facing in-
      app portal, or paper channel accepted per the controller's DSR
      policy: intake.open_dsr_case validates the adapter's raw request
      against the closed intake-channel enum, canonicalises the
      subject contact and the stated request as opaque personal data
      (never inspected beyond NFKC), anchors the Article 12(3) clock
      on the supplied __request_received_ts__ (a Zulu instant the
      intake surface stamped — never a clock read inside the
      primitive), notes any Article 22 concern raised on the request
      body as a real boolean, and derives __case_id__ from the request
      content so the same request re-received resolves to the same
      case. Bound since the CORE-WIRE card: the binding assigns the
      case envelope to __dsr_case__ and the compile target's adapter
      extracts the documented out_args (__case_id__,
      __request_received_ts__; __subject_contact__ mirrors the
      envelope field) — the marshalling seam every bound playbook
      documents.
    on_completion: action--d5b17a15-0000-4000-8000-000000000003
    in_args:
      - __raw_request__
      - __intake_channel__
    out_args:
      - __dsr_case__
      - __case_id__
      - __request_received_ts__
      - __subject_contact__
    agent_target: dsr_intake
    x_secops_ng:
      control_refs:
        - control.account_management@v1
      telemetry_refs:
        - telemetry.ocsf.compliance_finding@v1
      core_body:
        primitive: content.playbooks.data_subject_rights.primitives.intake.open_dsr_case
        in:
          raw_request: __raw_request__
          intake_channel: __intake_channel__
        out: __dsr_case__
  action--d5b17a15-0000-4000-8000-000000000003:
    type: action
    name: verify_identity
    description: >-
      Verify the requesting party is the data subject the request
      concerns on the controller's declared subject-verification
      surface: verification.record_identity_verification records the
      surface's verdict under the closed method vocabulary — the
      sovereign IdP SSO assertion where the subject holds an
      authenticated account, otherwise the out-of-band paths
      (recognised identity document check, subject-supplied shared
      secret, call-back to a channel of record) — together with the
      role-shaped evidence pointer. The record stores no subject-
      supplied attribute (sovereign-stack constraint: identity is
      resolved against the controller's own records at runtime; what
      the subject supplied stays on the verification surface). A false
      verdict is data: the gate after classification routes the case
      into the Article 12(6) additional-information response rather
      than fulfilling against an unverified subject. The binding
      assigns the record to __verification_record__; the adapter
      extracts __identity_verified__.
    on_completion: action--d5b17a15-0000-4000-8000-000000000004
    in_args:
      - __case_id__
      - __verification_method__
      - __verification_result__
      - __verification_evidence_ref__
    out_args:
      - __verification_record__
      - __identity_verified__
    agent_target: dsr_intake
    x_secops_ng:
      control_refs:
        - control.access_enforcement@v1
        - control.service_identification_authentication@v1
      telemetry_refs:
        - telemetry.ocsf.compliance_finding@v1
      core_body:
        primitive: content.playbooks.data_subject_rights.primitives.verification.record_identity_verification
        in:
          case_id: __case_id__
          verification_method: __verification_method__
          identity_verified: __verification_result__
          evidence_ref: __verification_evidence_ref__
        out: __verification_record__
  action--d5b17a15-0000-4000-8000-000000000004:
    type: action
    name: classify_request
    description: >-
      Resolve the request onto the closed Chapter III taxonomy and
      compute the Article 12(3) response deadline:
      classification.classify_request pins the article for the
      classified type — access (Article 15), rectification (Article
      16), erasure (Article 17), restriction (Article 18), portability
      (Article 20), objection (Article 21), automated-decision-review
      (Article 22 concern, which sets the human-review handoff flag;
      this lifecycle never reviews the underlying automated decision)
      — and derives __response_deadline__ as __request_received_ts__
      plus one calendar month, end-of-month clamped, plus the further
      months of a recorded Article 12(3) extension; an extension is
      representable only with its justification and one or two further
      months. Classification runs before the verification gate because
      the clock runs from receipt regardless of the verdict, so both
      branches carry a deadline. Resolving the subject's free text
      plus operator hints to the type is the adapter's
      (__classified_request_type__); the binding assigns the envelope
      to __classification__ and the adapter extracts __request_type__
      and __response_deadline__.
    on_completion: if-condition--d5b17a15-0000-4000-8000-000000000009
    in_args:
      - __case_id__
      - __classified_request_type__
      - __request_received_ts__
      - __extension_decision__
    out_args:
      - __classification__
      - __request_type__
      - __response_deadline__
    agent_target: dsr_intake
    x_secops_ng:
      control_refs:
        - control.account_management@v1
      telemetry_refs:
        - telemetry.ocsf.compliance_finding@v1
      core_body:
        primitive: content.playbooks.data_subject_rights.primitives.classification.classify_request
        in:
          request_type: __classified_request_type__
          request_received_ts: __request_received_ts__
          extension: __extension_decision__
        out: __classification__
  if-condition--d5b17a15-0000-4000-8000-000000000009:
    type: if-condition
    name: identity verified?
    description: >-
      Gate on the verification verdict. True routes into data-owner
      routing and fulfilment. False short-circuits to
      send_controller_response, where the adapter supplies the Article
      12(6) additional-information request and the case closes as
      unverified_subject — data owners are never asked to assemble a
      subject's data for an unverified requester. The gate sits after
      classification so the Article 12(3) deadline is on record for
      both branches.
    condition: __identity_verified__
    on_success: action--d5b17a15-0000-4000-8000-000000000005
    on_failure: action--d5b17a15-0000-4000-8000-000000000007
  action--d5b17a15-0000-4000-8000-000000000005:
    type: action
    name: route_to_data_owners
    description: >-
      Resolve the per-request owner manifest:
      routing.resolve_data_owner_manifest takes the owner rows the
      adapter resolved against the controller's declared data-
      inventory surface (which stores hold personal data on the
      subject is a runtime join against the controller's own records)
      and emits one acknowledgement envelope per (owner, store) with
      the request-type-appropriate evidence ask — access: assembled
      subject copy; rectification: applied correction; erasure:
      deletion or Article 17(3) retention-exemption record;
      restriction: applied restriction marker; portability: structured
      data package; objection: cessation or overriding-legitimate-
      interest note; automated-decision-review: the human-review
      referral record — with deterministic acknowledgement ids;
      duplicate rows collapse and an empty owner set fails loud.
      Owner-envelope transport and the owner-side response-timeout
      policy are the adapter's. The binding assigns the manifest to
      __owner_manifest__; the adapter extracts __data_owner_manifest__
      (the manifest id).
    on_completion: action--d5b17a15-0000-4000-8000-000000000006
    in_args:
      - __case_id__
      - __request_type__
      - __owner_rows__
    out_args:
      - __owner_manifest__
      - __data_owner_manifest__
    agent_target: dsr_intake
    x_secops_ng:
      control_refs:
        - control.account_management@v1
      telemetry_refs:
        - telemetry.ocsf.compliance_finding@v1
      core_body:
        primitive: content.playbooks.data_subject_rights.primitives.routing.resolve_data_owner_manifest
        in:
          case_id: __case_id__
          request_type: __request_type__
          owner_rows: __owner_rows__
        out: __owner_manifest__
  action--d5b17a15-0000-4000-8000-000000000006:
    type: action
    name: compile_fulfilment_evidence
    description: >-
      Assemble the fulfilment pack from the owner acknowledgements
      returned against the manifest:
      fulfilment.compile_fulfilment_pack closes the pack only when
      every expected owner has returned (a missing return fails loud —
      an incomplete pack that looks complete is exactly the Article
      5(2) accountability gap), refuses returns the manifest never
      routed and duplicate returns for one acknowledgement, and
      carries lawful qualifications — an Article 17(3) retention
      exemption on an erasure, an overriding-legitimate-interest
      determination on an objection — as data on the pack. The per-
      request-type pack shapes (subject-copy assembly with the Article
      15(1) meta-information, applied-correction attestation, deletion
      attestation, restriction markers, the Article 20(1) machine-
      readable package, cessation record) are the evidence the owners
      return by reference. The binding assigns the pack to
      __fulfilment_pack__; the adapter extracts the content-derived
      __fulfilment_pack_ref__.
    on_completion: action--d5b17a15-0000-4000-8000-000000000007
    in_args:
      - __owner_manifest__
      - __owner_returns__
    out_args:
      - __fulfilment_pack__
      - __fulfilment_pack_ref__
    agent_target: dsr_intake
    x_secops_ng:
      control_refs:
        - control.incident_timeline_signals@v1
      telemetry_refs:
        - telemetry.ocsf.compliance_finding@v1
      core_body:
        primitive: content.playbooks.data_subject_rights.primitives.fulfilment.compile_fulfilment_pack
        in:
          manifest: __owner_manifest__
          owner_returns: __owner_returns__
        out: __fulfilment_pack__
  action--d5b17a15-0000-4000-8000-000000000007:
    type: action
    name: send_controller_response
    description: >-
      Compose the controller's response to the data subject on or
      before __response_deadline__ under the Article 12 modalities
      (concise, transparent, intelligible, easily accessible, clear
      and plain language): response.compose_controller_response
      carries exactly one disposition — the fulfilment pack
      (__fulfilment_pack_ref__), a refusal under Article 12(5) or a
      Chapter III sub-exemption (__refusal_decision__, always carrying
      the reasons and the subject's onward remedies under Article 77
      and Article 79 — a remedy-free refusal is not representable), or
      the Article 12(6) additional-information request on the
      unverified branch (__identity_followup__) — plus the extension
      notice with its reasons where the controller invoked Article
      12(3). Lateness is computed from the adapter-stamped
      __dispatch_ts__ against the deadline and recorded, never
      absorbed: a late response still goes out. Secure delivery on the
      subject-facing channel is the compile target's adapter; the
      binding assigns the envelope to __controller_response__.
    on_completion: action--d5b17a15-0000-4000-8000-000000000008
    in_args:
      - __case_id__
      - __request_type__
      - __subject_contact__
      - __response_deadline__
      - __dispatch_ts__
      - __fulfilment_pack_ref__
      - __refusal_decision__
      - __extension_decision__
      - __identity_followup__
    out_args:
      - __controller_response__
    agent_target: dsr_intake
    x_secops_ng:
      control_refs:
        - control.incident_timeline_signals@v1
      telemetry_refs:
        - telemetry.ocsf.compliance_finding@v1
      core_body:
        primitive: content.playbooks.data_subject_rights.primitives.response.compose_controller_response
        in:
          case_id: __case_id__
          request_type: __request_type__
          subject_contact: __subject_contact__
          response_deadline: __response_deadline__
          dispatch_ts: __dispatch_ts__
          fulfilment_pack_ref: __fulfilment_pack_ref__
          refusal: __refusal_decision__
          extension: __extension_decision__
          additional_information_request: __identity_followup__
        out: __controller_response__
  action--d5b17a15-0000-4000-8000-000000000008:
    type: action
    name: record_outcome
    description: >-
      Record the terminal outcome on the controller's evidence store
      keyed to __case_id__: outcome.record_case_outcome takes the
