type: playbook
spec_version: "2.0"
id: playbook--d5b17a15-0000-4000-8000-000000000001
name: GDPR Article 15-22 data subject rights (DSR) intake and fulfilment
description: >-
  SKELETON — CACAO v2 scaffold for the operator-side data subject
  rights (DSR) intake and fulfilment lifecycle a controller runs
  when a data subject exercises one of the GDPR Chapter III rights
  against personal data the controller holds. Covers Article 15
  (access), Article 16 (rectification), Article 17 (erasure / right
  to be forgotten), Article 18 (restriction of processing), Article
  20 (portability), and Article 21 (objection). Article 22
  (automated individual decision-making) is treated as an
  in-scope classifier axis on receive_request rather than a
  standalone lane — a request that names an Article 22 concern is
  classified accordingly and routed to the controller's
  human-in-the-loop review surface as part of the fulfilment
  envelope, not as a parallel workflow. The lifecycle chains seven
  steps: receive_request → verify_identity (sovereign IdP
  integration point) → classify_request → route_to_data_owners →
  compile_fulfilment_evidence → send_controller_response (within
  the Article 12(3) one-month response window, extendable by two
  further months where necessary under Article 12(3)) →
  record_outcome (durable evidence-store record for the
  controller's Article 5(2) accountability posture and any
  downstream regulator query). SKELETON only: subject-verification
  primitive, per-data-store owner-routing catalogue, and the
  outbound response envelope templates (portability data-package
  format, erasure-attestation letter, rectification confirmation)
  are declared as adapter-bound surfaces the operator wires; a
  sibling CORE card lands the templates, the D3FEND tag selection
  closure, and the OSCAL binding closure. CACAO v2 + SecOps-NG
  content-model extensions.
playbook_types:
  - notification
  - investigation
created_by: identity--5a509a09-5a50-45a5-85a5-095a509a509a
