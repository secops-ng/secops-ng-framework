  # this PR — the graph is already closed.
  - mapping_id: nis2:art-21-2-i
    article: 21(2)(i)
    notes: >-
      NIS2 Art. 21(2)(i) requires human-resources security,
      access-control policies, and asset management — including
      joiner-mover-leaver evidence, privileged-access review
      cadence, and asset-inventory delta capture. The
      onboarding_offboarding_tracker playbook is the operational
      discharge of the per-lifecycle-event grant/revoke-
      confirmation slice of that obligation: one access-evidence
      artifact per joiner / mover / leaver event, shaped against
      schemas/evidence/access.schema.json, carrying the resolved
      role-shaped caller identity and the closed observed
      capability list the principal holds after the declared
      delta was applied. The per-execution capability-inventory
      half of the obligation is operated by playbook.iam_auditor@v1
      on the same F-CP-07 access stream; the two playbooks
      discharge complementary halves of the obligation surface,
      and the inbound entry already lists both in its
      playbook_refs for exactly that reason. This outbound entry
      is the structural closure of that backlink.

