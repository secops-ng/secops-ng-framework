# Cross-references for the iam_auditor playbook.
#
# This file is the playbook's outbound view of the content model: it
# pins OSCAL controls, MITRE D3FEND defensive techniques, OCSF event
# classes consumed/emitted, and the EU regulatory clauses this
# playbook helps operationalise. Inbound references live in
# content/mappings/{nis2,dora}/ so the graph is closed in both
# directions.
#
# This playbook is the per-execution capability-inventory engine for
# the F-CP-07 access-evidence stream: on every run of a compiled
# workflow, resolve the caller identity that invoked the running
# form, walk the closed capability list (verb.resource tokens) that
# identity held at execution time, and emit one access-evidence
# artifact shaped against schemas/evidence/access.schema.json. The
# artifact carries the workflow id, execution id, compile target,
# regulation_refs, control_refs, captured_at, and provenance; it is
# the continuous-attestation counterpart to the per-lifecycle-event
# grant/revoke evidence playbook.onboarding_offboarding_tracker@v1
# (F-WF-11) emits on the same F-CP-07 stream against the same
# `schemas/evidence/access.schema.json` envelope.
#
# Caller principals are role-shaped by design (service-account name,
# workflow-runtime principal id, automation role). Personal-user
# principals are rejected at the F-CP-07 primitive boundary; the
# regex pinned by `schemas/evidence/access.schema.json` fails the
# step loud rather than silently widening scope to natural persons.
# This boundary is what lets the GDPR closure below default to
# inbound-only (see GDPR closure note).
#
# Deliberate OSCAL omissions (mirror of the SC-8 / SA-11 omission-note
# pattern from the cloud_misconfiguration and codebase_vuln_management
# overlays):
#   - AC-5 (Separation of Duties) is NOT pinned: the playbook
#     enumerates capabilities a single caller principal holds at
#     execution time; it does not assert separation-of-duties
#     between roles. A separation-of-duties pin would belong on the
#     governance content surface that defines the role split, not
#     on this per-execution inventory step.
#   - IA-2 (Identification and Authentication — Organizational
#     Users) is NOT pinned: the workflow rejects personal-user
#     principals at the primitive boundary (see header). IA-9
#     (Service Identification and Authentication) is the control
#     that covers the service / automation / workflow-runtime
#     principals this playbook actually resolves and is pinned
#     below in its place.
#   - AU-2 (Event Logging) is NOT pinned: the playbook emits OCSF
#     Account Change records as the access-evidence carrier, but
#     defining the operator's audit-event policy is upstream of
#     this playbook. The emitted records are consumed by the
#     operator's existing OCSF store under its AU-2 policy.
#   - AC-7 (Unsuccessful Logon Attempts) is NOT pinned: failure
#     handling on caller-identity resolution is delegated to the
#     compile target's runtime (n8n / Temporal / LangGraph) and the
#     operator's IdP; the playbook does not implement lockout or
#     throttling logic itself.
#
# CRA closure: the schema's top-level keys are fixed
# (oscal/d3fend/ocsf/nis2/dora). CRA cross-references for this
# playbook are expressed inbound only. The iam_auditor is an
# operator-side continuous-attestation surface — caller-identity
# resolution and capability enumeration over the operator's running
# workflows — not a product-side incident reporting or vulnerability
# disclosure flow. CRA Art. 14 product-notification obligations and
# Annex I vulnerability-handling requirements therefore do not
# attach here. The Annex I §1(d) access-control essential
# requirement does attach: the inbound pin lives at
# content/mappings/cra/annex-i-1-d-access-control-iam-auditor.yaml
# (id cra:annex-i-1-d-access-control-iam-auditor), companion to the
# existing cra:annex-i-1-access-control entry which pins
# identity_compromise for the agentic-anchor side; this overlay's
# discharge is the periodic access-attestation lane. No outbound
# CRA pin block is emitted on this overlay because the schema does
# not currently carry a CRA key; the footer comment below points
# at the inbound file.
#
# DORA closure: DORA Art. 9 ICT-protection (Regulation (EU) 2022/2554)
# and the JC RTS on ICT risk-management framework (Commission Delegated
# Regulation (EU) 2024/1774) carry the access-management and
# authentication-governance obligations the iam_auditor playbook
# operationally discharges on the financial-entity side. The
# access-management slice is anchored on the inbound side at
# content/mappings/dora/article-9-access-management.yaml
# (id dora:art-9-access-mgmt — DORA Art. 9(4)(c) operationalised by
# the JC RTS Arts. 20–22 on identity management, access management,
# and authentication) which backlinks playbook.iam_auditor@v1; the
# outbound pin lands below alongside the NIS2 Art. 21(2)(i) entry.
# The vulnerability/patch slice of the same Art. 9 anchor lives in
# the sibling content/mappings/dora/article-9-and-rts-vuln-mgmt.yaml
# and does not attach to this playbook.
#
# GDPR closure: inbound GDPR clause files are not carried as YAML
# cross-references in content/mappings/gdpr/ today (the regime is
# expressed there as per-workflow Records of Processing Activity,
# not as Art. 32 / 33 clause anchors); the per-workflow Art. 30 RoPA
# for this playbook already lives at
# content/mappings/gdpr/data-flow-iam_auditor.md and covers the
# caller-principal reference, capability-list, and execution-
# metadata processing the steps below operate on, scored on the
# worst-case assumption that the runtime principal is attributable
# to a natural person. By design the primitive boundary rejects
# personal-user principals (role-shaped handles only); for
# executions invoked by a non-personal service or workload identity
# no personal data is processed and GDPR does not engage. When a
# GDPR clause-file convention lands, an inbound entry for Art. 32
# (security of processing — appropriate technical and organisational
# measures, including the continuous access-attestation discipline
# this playbook discharges) against this playbook can be added
# without a schema change.
#
# Schema: schemas/playbook-mappings.schema.json
playbook: playbook.iam_auditor@v1

oscal:
  # NIST SP 800-53 Rev. 5 controls exercised by the enumerate-
  # identities, enumerate-capabilities, and emit-access-evidence
  # steps. Catalogue URLs resolve to the public NIST OSCAL
  # repository.
  - id: control.account_management@v1
    oscal_catalog: NIST SP 800-53 Rev. 5
    control_id: AC-2
    title: Account Management
    url: https://csrc.nist.gov/projects/risk-management/sp800-53-controls/release-search#!/control?version=5.1&number=AC-2
    notes: >-
      Anchors the enumerate-identities step: AC-2 requires the
      organisation to identify and manage system accounts and to
      monitor their use. The role-shaped caller principal resolved
      from the compile target's runtime (n8n credential binding,
      Temporal worker identity, LangGraph runtime principal) and
      pinned to the access-evidence artifact is the per-execution
      attestation that the running workflow was invoked by a known
      managed account.

  - id: control.access_enforcement@v1
    oscal_catalog: NIST SP 800-53 Rev. 5
    control_id: AC-3
    title: Access Enforcement
    url: https://csrc.nist.gov/projects/risk-management/sp800-53-controls/release-search#!/control?version=5.1&number=AC-3
    notes: >-
      Covers the enumerate-capabilities step: AC-3 demands
      enforcement of approved authorisations for logical access to
      information and system resources in accordance with applicable
      access-control policies. The closed capability list
      (verb.resource tokens) the resolved caller held at execution
      time is the runtime-side assertion of which authorisations
      the access-enforcement layer was honouring on this run; the
      F-PT-01 platform card carries the orthogonal boot-time
      guarantee that the caller actually held those capabilities,
      and is intentionally out of scope here.

  - id: control.least_privilege@v1
    oscal_catalog: NIST SP 800-53 Rev. 5
    control_id: AC-6
    title: Least Privilege
    url: https://csrc.nist.gov/projects/risk-management/sp800-53-controls/release-search#!/control?version=5.1&number=AC-6
    notes: >-
      Anchors the enumerate-capabilities step's review surface:
      AC-6 requires the organisation to employ the principle of
      least privilege and to periodically review and re-evaluate
      privileges. The per-execution capability list this playbook
      emits is the evidence stream the operator's access-governance
      / IAM-review function reads to satisfy that periodic review
      obligation, and the kpi.cloud_posture_coverage@v1 metric
      declared on the playbook's x_secops_ng.metric_refs joins
      against the same artifacts to surface least-privilege
      coverage.

  - id: control.service_identification_authentication@v1
    oscal_catalog: NIST SP 800-53 Rev. 5
    control_id: IA-9
    title: Service Identification and Authentication
    url: https://csrc.nist.gov/projects/risk-management/sp800-53-controls/release-search#!/control?version=5.1&number=IA-9
    notes: >-
      Covers the enumerate-identities step's principal-resolution
      surface: IA-9 demands identification and authentication of
      system services and the processes acting on behalf of system
      services. Because the playbook's primitive boundary rejects
      personal-user principals and accepts only role-shaped
      handles (service_account, workflow_runtime, automation_role),
      IA-9 is the right anchor for the principal types this
      workflow resolves — and is pinned in place of IA-2
      (Identification of Organizational Users) per the deliberate-
      omission note in the header.

  - id: control.system_component_inventory@v1
    oscal_catalog: NIST SP 800-53 Rev. 5
    control_id: CM-8
    title: System Component Inventory
    url: https://csrc.nist.gov/projects/risk-management/sp800-53-controls/release-search#!/control?version=5.1&number=CM-8
    notes: >-
      Covers the enumerate-capabilities step's inventory surface:
      CM-8 requires a current, accurate, and maintained inventory
      of system components. The closed capability list emitted
      per execution is the machine-readable inventory artefact for
      the identity component of the workflow's running form — the
      verb.resource tokens the resolved caller held at execution
      time, captured as the audit-evident inventory entry the
      access-evidence artifact carries.

d3fend:
  # MITRE D3FEND v1.0.0 defensive technique tags per playbook step.
  # CACAO step UUIDs are pinned to the real action UUIDs resolved
  # from content/playbooks/iam_auditor/playbook.cacao.json (three
  # action bodies: enumerate-identities, enumerate-capabilities,
  # emit-access-evidence). D3FEND v1.0.0 does not carry a
  # dedicated technique for per-execution caller-identity
  # attestation or capability-list emission against a workflow
  # runtime; the closest defensive-technique anchors are pinned
  # below with the gap documented in line, mirroring the D3-SWI
  # precedent on codebase_vuln_management.
  - step: action--08aa0d10-0000-4000-8000-000000000002
    d3fend_id: D3-AM
    d3fend_name: Account Monitoring
    url: https://d3fend.mitre.org/technique/d3f:AccountMonitoring/
    notes: >-
      enumerate-identities — resolving the caller principal that
      invoked the compiled workflow on this execution is the
      Detect-tactic account-monitoring discipline on the workflow
      runtime: the principal is pinned to the per-execution
      access-evidence artifact and feeds the operator's
      access-governance review surface. The compile target's
      runtime (n8n credential binding, Temporal worker identity,
      LangGraph runtime principal) is the source of truth the
      step reads.

  - step: action--08aa0d10-0000-4000-8000-000000000003
    d3fend_id: D3-UAP
    d3fend_name: User Account Permissions
    url: https://d3fend.mitre.org/technique/d3f:UserAccountPermissions/
    notes: >-
      enumerate-capabilities — walking the closed capability list
      (verb.resource tokens) the resolved caller held at execution
      time is the per-execution materialisation of the user-
      account-permissions defensive discipline. D3FEND v1.0.0
      frames D3-UAP around the explicit modelling and restriction
      of what a given account is permitted to do; this playbook
      emits the audit-trail half of that modelling — the closed
      list as observed at execution — so the operator's least-
      privilege review can join the observed list against the
      intended grant set. D3FEND v1.0.0 does not carry a
      dedicated capability-enumeration / IAM-introspection
      technique; D3-UAP is the closest defensive-technique anchor
      and is pinned with this gap note, mirroring the D3-SWI
      precedent on codebase_vuln_management.

  - step: action--08aa0d10-0000-4000-8000-000000000003
    d3fend_id: D3-SCP
    d3fend_name: System Configuration Permissions
    url: https://d3fend.mitre.org/technique/d3f:SystemConfigurationPermissions/
    notes: >-
      enumerate-capabilities — the closed capability list the
      caller held includes configuration-level grants
      (verb.resource tokens addressing IAM, policy, and identity-
      configuration surfaces). D3-SCP is pinned alongside D3-UAP
      because system-configuration permissions and account
      permissions are produced by the same IAM walk but discharge
      distinct D3FEND techniques; the identity_compromise overlay
      uses the same D3-SCP / D3-LAM split on the IAM audit and
      persistence removal step.

  - step: action--08aa0d10-0000-4000-8000-000000000004
    d3fend_id: D3-AM
    d3fend_name: Account Monitoring
    url: https://d3fend.mitre.org/technique/d3f:AccountMonitoring/
    notes: >-
      emit-access-evidence — combining the caller-identity block
      and capability list into one access-evidence artifact shaped
      against schemas/evidence/access.schema.json and emitting it
      to the operator-configured access-evidence store is the
      audit-trail materialisation of the same account-monitoring
      technique D3-AM frames around enumerate-identities. The
      emission is byte-stable: same execution inputs and same
      compile target re-derive the same artifact_id (SHA-256 of
      workflow_id|execution_id|compile_target) so the downstream
      kpi.cloud_posture_coverage@v1 metric is auditable.

ocsf:
  # OCSF v1.3.0 telemetry bindings. The enumerate-identities step
  # consumes Authentication (3002) from the compile target's
  # runtime / IdP to pin the resolved principal reference. The
  # enumerate-capabilities step consumes API Activity (6003) from
  # the operator's IAM provider read calls. The emit-access-
  # evidence step emits an Account Change (3001) record carrying
  # the access-evidence artifact reference so the kpi.cloud_
  # posture_coverage@v1 metric declared on the playbook's
  # x_secops_ng.metric_refs can audit per-execution coverage
  # against the operator's identity inventory. The shape of the
  # emitted access-evidence artifact itself is a content-model-
  # native evidence shape (see
  # schemas/evidence/access.schema.json) rather than an OCSF
  # class — the OCSF binding below pins the runtime-side telemetry
  # surface the operator's SIEM/identity store reads, not the
  # durable evidence artefact the access store retains.
  - id: telemetry.authentication@v1
    category_uid: 3
    category_name: Identity & Access Management
    class_uid: 3002
    class_name: Authentication
    ocsf_version: "1.3.0"
    direction: consumes
    notes: >-
      Consumed at the enumerate-identities step: sign-in / runtime-
      principal-bind records from the compile target's runtime
      (n8n credential binding, Temporal worker identity,
      LangGraph runtime principal) and the operator's IdP anchor
      the role-shaped caller principal the access-evidence
      artifact carries. Schema:
      https://schema.ocsf.io/1.3.0/classes/authentication

  - id: telemetry.api_activity@v1
    category_uid: 6
    category_name: Application Activity
    class_uid: 6003
    class_name: API Activity
    ocsf_version: "1.3.0"
    direction: consumes
    notes: >-
      Consumed at the enumerate-capabilities step: read calls
      against the operator's IAM provider (cloud IAM, IdP role
      surface, capability registry) that produce the closed
      verb.resource token list. The api_activity records carry
      the request metadata the primitive canonicalises (NFKC +
      lower-case) and dedups so re-runs collapse to byte-identical
      bytes. Schema:
      https://schema.ocsf.io/1.3.0/classes/api_activity

  - id: telemetry.account_change@v1
    category_uid: 3
    category_name: Identity & Access Management
    class_uid: 3001
    class_name: Account Change
    ocsf_version: "1.3.0"
    direction: emits
    notes: >-
      Emitted by the emit-access-evidence step: each emission
      records an Account Change keyed to the resolved caller
      principal carrying the access-evidence artifact reference,
      regulation_refs (typically `["nis2:art-21-2-i"]`),
      control_refs, captured_at, and provenance. The Account
      Change class is used for the runtime-side audit surface
      even though no grant mutation occurred on this execution —
      the per-execution attestation is the IAM-ledger event the
      operator's SIEM joins against. Schema:
      https://schema.ocsf.io/1.3.0/classes/account_change

nis2:
  # Inbound entry lives at
  # content/mappings/nis2/article-21-2-i.yaml
  # (id nis2:art-21-2-i — HR security, access-control policies,
  # and asset management) and already backlinks
  # playbook.iam_auditor@v1 on its playbook_refs list alongside
  # playbook.onboarding_offboarding_tracker@v1 (the per-lifecycle-
  # event grant/revoke counterpart on the same F-CP-07 access
  # stream).
  - mapping_id: nis2:art-21-2-i
    article: 21(2)(i)
    notes: >-
      NIS2 Art. 21(2)(i) requires human-resources security,
      access-control policies, and asset management — including
      joiner-mover-leaver evidence, privileged-access review
      cadence, and asset-inventory delta capture. The iam_auditor
      playbook is the operational discharge of the continuous-
      access-attestation slice of that obligation: per-execution
      caller-identity resolution and closed-capability enumeration
      against the running workflow, emitted as one access-evidence
      artifact per execution against
      schemas/evidence/access.schema.json. The per-lifecycle-event
      grant/revoke-confirmation half of the obligation is
      operated by playbook.onboarding_offboarding_tracker@v1 on
      the same F-CP-07 access stream; the two playbooks discharge
      complementary halves of the obligation surface.

dora:
  # Inbound entry lives at
  # content/mappings/dora/article-9-access-management.yaml
  # (id dora:art-9-access-mgmt — DORA Art. 9(4)(c) access-management
  # policies operationalised by the JC RTS on ICT risk-management
  # framework, Commission Delegated Regulation (EU) 2024/1774,
  # Arts. 20–22 on identity management, access management, and
  # authentication) and already backlinks playbook.iam_auditor@v1
  # alongside playbook.onboarding_offboarding_tracker@v1 (the
  # per-lifecycle-event grant/revoke counterpart on the same F-CP-07
  # access stream). The vulnerability/patch slice of Art. 9 (sibling
  # file article-9-and-rts-vuln-mgmt.yaml, id dora:art-9-vuln-mgmt)
  # is intentionally NOT pinned here: that file is vulnerability and
  # patch management scoped and does not attach to the per-execution
  # capability-inventory discipline this playbook discharges.
  - mapping_id: dora:art-9-access-mgmt
    article: 9(4)(c)
    notes: >-
      DORA Art. 9(4)(c) requires access-management arrangements
      allocated on a need-to-know, need-to-use, and least-privilege
      basis, operationalised by the JC RTS Arts. 20–22. The
      iam_auditor playbook is the operational discharge of the
      continuous-access-attestation slice of that obligation:
      per-execution caller-identity resolution and closed-capability
      enumeration against the running workflow, emitted as one
      access-evidence artifact per execution against
      schemas/evidence/access.schema.json. The per-lifecycle-event
      grant/revoke-confirmation half of the obligation is operated
      by playbook.onboarding_offboarding_tracker@v1 on the same
      F-CP-07 access stream; the two playbooks discharge
      complementary halves of the obligation surface, mirroring the
      NIS2 Art. 21(2)(i) pairing above.

# CRA closure (footer): the schema's top-level keys are fixed
# (oscal/d3fend/ocsf/nis2/dora). The inbound CRA backlink for this
# playbook lives at
# content/mappings/cra/annex-i-1-d-access-control-iam-auditor.yaml
# (id cra:annex-i-1-d-access-control-iam-auditor) — Annex I §1(d)
# access control, periodic access-attestation lane. Companion to
# cra:annex-i-1-access-control in
# content/mappings/cra/annex-i-1-essential-cybersecurity.yaml which
# pins identity_compromise for the agentic-anchor / unauthorised-
# access-response side of the same clause. No outbound pin block is
# emitted here because the schema does not currently carry a CRA
# key; the EXTEND layer that adds CRA to the schema is filed as a
# sibling card.
