# Cross-references for the cyber_hygiene_training playbook.
#
# This file is the playbook's outbound view of the content model: it
# pins OSCAL controls, OCSF event classes consumed/emitted, and the EU
# regulatory clauses this playbook helps operationalise. Inbound
# references live in content/mappings/{nis2,dora}/ so the graph is
# closed in both directions.
#
# This playbook operates the basic cyber-hygiene and staff security-
# training posture surface required by NIS2 Art. 21(2)(g) and DORA
# Art. 13(6): inventory the in-scope training roster against the
# declared training scope, schedule the per-cycle awareness and role-
# based training assignments, run the cycle's phishing-simulation
# exercise, track completion of mandatory training and report-rate on
# the simulation, capture a dated training-attestation artifact, and
# notify the training owner of any gaps. The playbook does not author
# the training or hygiene policy itself; it operationalises a policy
# that lives in the operator's governance documentation.
#
# Status: CORE. The SKELETON overlay anchored the regulatory and
# control surface; this CORE layer adds the OCSF Compliance Finding
# (2003) emit binding for the per-staff and per-cohort training and
# simulation-outcome deviation records, and closes the DORA mapping
# graph (inbound at content/mappings/dora/article-13-6-training.yaml +
# outbound here). The d3fend block remains empty after the CORE-layer
# defensibility analysis — see the D3FEND closure section below for
# the per-step gap rationale. An EXTEND card wires the per-cohort
# training-overdue KPI emitters against the operator's evidence store.
#
# Deliberate OSCAL omissions:
#   - AT-2(2) (Insider Threat) is NOT pinned: insider-threat awareness
#     is a distinct training enhancement with its own programme
#     ownership; pinning it here would over-claim the scope of the
#     baseline awareness and role-based training surface this
#     playbook operates.
#   - PM-13 (Security and Privacy Workforce) is NOT pinned: PM-13
#     anchors the broader workforce-development programme (job
#     postings, qualification standards, succession planning) which
#     is upstream of the per-cycle training-execution slice this
#     playbook operates.
#   - AU-2 (Event Logging) is NOT pinned: the playbook emits OCSF
#     API Activity records, but the operator's audit-event policy is
#     upstream of this playbook.
#
# D3FEND closure: D3FEND v1.0.0 frames its defensive techniques
# around runtime countermeasures against adversary behaviours. The
# discipline this playbook operates — periodic awareness and role-
# based training scheduling, phishing-simulation exercise execution,
# and completion tracking — is a posture-readiness exercise rather
# than a runtime countermeasure against an adversary behaviour. The
# control_xref files for control.training_attestation@v1 and
# control.phishing_simulation@v1 do reference D3-UA (User Behavior
# Analysis) for the analytic surface that consumes training and
# simulation outcomes, but this playbook does not itself implement
# behavioural analytics; it produces the per-cycle training and
# simulation artifacts that D3-UA-aligned analytics consume
# downstream. Pinning D3-UA on the inventory-training-roster,
# schedule-training-cycle, run-phishing-simulation, track-completion,
# evidence-capture, or notify-gaps steps would force the technique
# onto a producer surface it does not discharge — D3-UA names the
# downstream analytic consumer of these artifacts, not the producer.
# The phishing-simulation exercise is the closest candidate for a
# Detect-tactic anchor, but D3FEND v1.0.0 carries no defensive
# technique for documented exercise-traffic dispatch distinct from
# the operator's mailflow surface itself; the simulation produces
# the per-recipient click/report record that D3-UA-aligned analytics
# consume downstream, it is not itself an account-monitoring or
# user-behaviour-analysis pass. The d3fend block is therefore
# intentionally empty rather than carrying a forced tag, mirroring
# the gap-note precedent on mfa_secured_comms (gap-note on the
# verify-oob-channels / evidence-capture / notify-authentication-
# owner steps), crypto_posture_management (gap-note on the
# evidence-capture / notify-crypto-owner steps), backup_recovery
# (gap-note on the evidence-capture / notify-continuity-owner steps),
# infra_posture_management (gap-note on the evidence-capture step),
# iam_auditor (gap-note on the emit-access-evidence step), and
# on_call_rotation (gap-note on the handoff-brief step). Detection
# bindings for individual missed-training / simulation-click upstream
# rule fingerprints are consumed via the Compliance Finding (2003)
# telemetry binding below rather than authored as Sigma references on
# this overlay; the operator's posture-management layer is the
# upstream of those signal shapes.
#
# CRA closure: the inbound entry on the CRA side lives at
# content/mappings/cra/article-13-6-staff-cyber-hygiene-awareness.yaml
# (id cra:art-13-6-staff-cyber-hygiene-awareness — Art.13(6) staff
# cyber-hygiene and awareness lane). That entry is the third sibling
# under Art.13(6) alongside cra:art-13-vuln-handling-process
# (documentation-process side, in article-13.yaml) and
# cra:art-13-6-third-party-vuln-awareness (upstream advisory-feed and
# CSIRT-bulletin ingestion); cyber_hygiene_training pins the
# workforce-readiness half — per-cycle awareness and role-based
# training, phishing-simulation exercise, completion-tracking, and a
# dated training-attestation record. The matching outbound entry on
# this overlay closes the graph.
#
# DORA closure: the inbound entry on the DORA side lives at
# content/mappings/dora/article-13-6-training.yaml (id
# dora:art-13-training-awareness — DORA Art. 13(6) ICT security
# awareness programmes and digital operational resilience training as
# compulsory modules in the staff training schemes). The matching
# outbound dora: entry below closes the graph. The training-and-
# awareness slice is authored as a distinct DORA entry rather than
# overloaded onto the existing dora:art-13-learning-evolving entry
# (which covers the post-ICT-related-incident-review slice of the
# same Art. 13 learning-and-evolving obligation) — the two slices
# discharge independent operational disciplines and are mapped
# separately to preserve the atom-per-obligation shape DORA Art. 9
# carries across vuln-mgmt / access-mgmt / crypto / authentication.
#
# Schema: schemas/playbook-mappings.schema.json
playbook: playbook.cyber_hygiene_training@v1

oscal:
  # NIST SP 800-53 Rev. 5 controls exercised by the inventory-training-
  # roster, schedule-training-cycle, run-phishing-simulation, track-
  # completion, and evidence-capture steps.
  - id: control.literacy_training_and_awareness@v1
    oscal_catalog: NIST SP 800-53 Rev. 5
    control_id: AT-2
    title: Literacy Training and Awareness
    url: https://csrc.nist.gov/projects/risk-management/sp800-53-controls/release-search#!/control?version=5.1&number=AT-2
    notes: >-
      Anchors the inventory-training-roster, schedule-training-cycle,
      and run-phishing-simulation steps: AT-2 requires the
      organisation to provide security literacy training to system
      users (including managers, senior executives, and contractors)
      consistent with assigned roles and responsibilities, and AT-2(3)
      (Social Engineering and Mining) explicitly contemplates practical
      exercises that simulate social-engineering attacks. The roster
      snapshot is the per-cycle measurement of which staff are
      in-scope for the awareness programme; the cycle assignment is
      the per-cycle scheduling of that programme against declared
      cadence; the phishing-simulation run is the AT-2(3) practical
      exercise.

  - id: control.role_based_training@v1
    oscal_catalog: NIST SP 800-53 Rev. 5
    control_id: AT-3
    title: Role-based Training
    url: https://csrc.nist.gov/projects/risk-management/sp800-53-controls/release-search#!/control?version=5.1&number=AT-3
    notes: >-
      Anchors the inventory-training-roster and schedule-training-
      cycle steps for the role-based training tracks: AT-3 requires
      the organisation to provide role-based security training to
      personnel with assigned security roles and responsibilities
      before authorising access, when required by changes, and
      thereafter at the declared cadence. The roster snapshot
      preserves the per-staff role-based-track assignment so the
      scheduling step can issue per-role training intents on the
      declared cadence; the completion-tracking step records role-
      based overdue separately from awareness overdue so the
      attestation surfaces the two surfaces independently.

  - id: control.training_records@v1
    oscal_catalog: NIST SP 800-53 Rev. 5
    control_id: AT-4
    title: Training Records
    url: https://csrc.nist.gov/projects/risk-management/sp800-53-controls/release-search#!/control?version=5.1&number=AT-4
    notes: >-
      Anchors the track-completion and evidence-capture steps: AT-4
      requires the organisation to document and monitor security
      training activities, including basic literacy training and
      specific role-based training, and to retain the records for the
      declared retention period. The completion-tracking artifact is
      the per-staff and per-cohort record of completion state against
      the cycle assignments; the dated training-attestation emitted by
      the evidence-capture step is the audit-evident record AT-4
      reviewers read against the operator's declared retention
      policy.

d3fend: []
  # See the D3FEND closure section in the header for the per-step gap
  # rationale. Summary: D3FEND v1.0.0 carries no defensive technique
  # whose discipline matches the producer surface this playbook
  # operates (periodic awareness and role-based training scheduling,
  # phishing-simulation exercise execution, completion tracking, and
  # dated training-attestation emission). D3-UA (User Behavior
  # Analysis) referenced from the control_xref files for
  # control.training_attestation@v1 and control.phishing_simulation@v1
  # names the downstream analytic consumer of the per-cycle artifacts
  # this playbook produces, not the producer; pinning D3-UA on any of
  # the inventory-training-roster, schedule-training-cycle, run-
  # phishing-simulation, track-completion, evidence-capture, or
  # notify-gaps steps would force the technique onto a producer
  # surface it does not discharge. The block is intentionally empty
  # rather than carrying a forced tag, mirroring the gap-note
  # precedent on mfa_secured_comms (verify-oob-channels / evidence-
  # capture / notify-authentication-owner gap notes),
  # crypto_posture_management, backup_recovery,
  # infra_posture_management, iam_auditor, and on_call_rotation.
  # Detection bindings for individual missed-training and simulation-
  # click upstream rule fingerprints are consumed via the Compliance
  # Finding (2003) telemetry binding below; the operator's posture-
  # management layer owns those fingerprints. SecOps-NG does not pin
  # stable Sigma rule ids on this overlay.

ocsf:
  # OCSF v1.3.0 telemetry bindings. The inventory-training-roster,
  # schedule-training-cycle, run-phishing-simulation, track-
  # completion, evidence-capture, and notify-gaps steps all interact
  # with operator API surfaces (the HR / identity source, the
  # learning-management surface, the phishing-simulation dispatch
  # endpoint, the evidence store, the notification channel). API
  # Activity (6003) is the consistent class across both consumed and
  # emitted records for the read/write surfaces; Compliance Finding
  # (2003) carries the per-staff and per-cohort training-and-
  # simulation deviation records the track-completion step emits into
  # the operator's posture-management layer (the upstream of any
  # Sigma detection-binding a SIEM consumes from those deviations).
  - id: telemetry.api_activity@v1
    category_uid: 6
    category_name: Application Activity
    class_uid: 6003
    class_name: API Activity
    ocsf_version: "1.3.0"
    direction: both
    notes: >-
      Consumed at the inventory-training-roster step (read calls
      against the operator's HR / identity source to resolve cohort
      and role membership against __training_scope__), at the
      track-completion step (read calls against the learning-
      management surface for completion state per staff and per
      track). Emitted at the schedule-training-cycle step (write
      calls publishing cycle assignment intents to the learning-
      management surface), at the run-phishing-simulation step
      (write calls dispatching the simulation exercise to the
      enrolled cohorts — modelled as documented exercise traffic
      against the simulation endpoint, not against production
      mailflow controls), at the evidence-capture step (write call
      publishing the dated training-attestation record to the
      operator's evidence store), and at the notify-gaps step
      (delivery dispatch to the training owner's pre-bound
      channel). The api_activity records carry the request metadata
      the kpi.training_completion_rate@v1 and
      kpi.phishing_sim_click_rate@v1 metrics read. Schema:
      https://schema.ocsf.io/1.3.0/classes/api_activity

  - id: telemetry.compliance_finding@v1
    category_uid: 2
    category_name: Findings
    class_uid: 2003
    class_name: Compliance Finding
    ocsf_version: "1.3.0"
    direction: emits
    notes: >-
      Emitted by the track-completion and run-phishing-simulation
      steps as the structured per-staff and per-cohort deviation
      records the completion-tracking pass and the simulation
      outcome aggregate produce against the declared training
      policy: staff with mandatory awareness training overdue past
      the cycle due-date, staff with role-based training overdue
      past the cycle due-date, cohorts whose completion-rate is
      below the declared target, cohorts whose simulation click-
      rate exceeds the declared threshold, cohorts whose report-
      rate is below the declared threshold, and staff with no
      declared training requirement in the operator's policy (the
      policy-gap branch — reported separately from completion gaps)
      each yield one Compliance Finding keyed to (__cycle_id__,
      staff-or-cohort-id) so the operator's posture-management
      layer can route the deviation to the training owner and so
      the SIEM has a stable rule_fingerprint to query against.
      Read-only posture-readiness framing — the Compliance Finding
      records what the operator's policy says and what the
      completion-tracking pass observed; no training assignment
      mutation, completion-state mutation, or roster mutation is
      represented (the playbook does not author the operator's
      training policy or override the learning-management surface's
      completion records). The Compliance Finding stream is the
      upstream of any Sigma detection-binding a downstream consumer
      chooses to author against missed-training / simulation-click
      / report-rate rule fingerprints; SecOps-NG does not pin
      stable Sigma rule ids on this overlay (the operator's
      posture-management layer owns those fingerprints). Schema:
      https://schema.ocsf.io/1.3.0/classes/compliance_finding

nis2:
  # Inbound entries that backlink playbook.cyber_hygiene_training@v1:
  #   - content/mappings/nis2/article-21-2-g.yaml
  #     (id nis2:art-21-2-g — basic cyber-hygiene practices and
  #     cybersecurity training for staff, including phishing-
  #     simulation exercises, with completion tracked)
  # Pinned outbound below to close the graph.
  - mapping_id: nis2:art-21-2-g
    article: 21(2)(g)
    notes: >-
      NIS2 Art. 21(2)(g) requires essential and important entities
      to operate basic cyber-hygiene practices and cybersecurity
      training for staff, including phishing-simulation exercises,
      with completion tracked. The cyber_hygiene_training playbook
      is the PROACTIVE per-cycle materialisation of that obligation:
      the training-roster snapshot, the cycle assignments, the
      phishing-simulation run, the completion-tracking aggregate,
      and the dated training-attestation record published to the
      operator's evidence store are the audit-evident discharge of
      the clause. (The existing playbook.phishing_triage@v1 backlink
      on the same mapping covers the REACTIVE phishing-incident
      surface; this playbook covers the proactive training and
      simulation surface — the two are complementary, not
      duplicative.) The kpi.training_completion_rate@v1 metric
      trips on training-completion-rate regressions; the
      kpi.phishing_sim_click_rate@v1 metric trips on simulation
      click-rate regressions. The inbound entry pins the same
      control_refs (control.training_attestation@v1,
      control.phishing_simulation@v1) as this overlay; this
      outbound entry is the structural closure of that backlink.

dora:
  # Inbound entry that backlinks playbook.cyber_hygiene_training@v1:
  #   - content/mappings/dora/article-13-6-training.yaml
  #     (id dora:art-13-training-awareness — DORA Art. 13(6) ICT
  #     security awareness programmes and digital operational
  #     resilience training as compulsory modules in the staff
  #     training schemes, applicable to all staff and members of
  #     senior management, with a level of complexity commensurate
  #     to the remit of their functions)
  # Pinned outbound below to close the graph.
  - mapping_id: dora:art-13-training-awareness
    article: 13(6)
    notes: >-
      DORA Art. 13(6) requires financial entities to develop ICT
      security awareness programmes and digital operational
      resilience training as compulsory modules in the staff
      training schemes, applicable to all staff and members of
      senior management, with a level of complexity commensurate to
      the remit of their functions. The cyber_hygiene_training
      playbook is the per-cycle materialisation of that obligation's
      measurement and attestation surface — the same discharge
      shape NIS2 Art. 21(2)(g) anchors on. The training-roster
      snapshot, the cycle assignments, the phishing-simulation run,
      the completion-tracking aggregate, and the dated training-
      attestation record published to the operator's evidence store
      are the audit-evident discharge of the clause. The
      kpi.training_completion_rate@v1 metric trips on training-
      completion-rate regressions; the kpi.phishing_sim_click_rate@v1
      metric trips on simulation click-rate regressions. The
      inbound entry pins the same control_refs
      (control.training_attestation@v1, control.phishing_simulation@v1)
      as this overlay; this outbound entry is the structural closure
      of that backlink and is the training-and-awareness slice of
      the broader Art. 13 learning-and-evolving surface (companion
      to dora:art-13-learning-evolving, which covers the post-ICT-
      related-incident-review slice — the two slices discharge
      independent operational disciplines and are mapped separately
      to preserve the atom-per-obligation shape).

cra:
  - mapping_id: cra:art-13-6-staff-cyber-hygiene-awareness
    article: "13(6)"
    notes: >-
      Outbound backlink for the inbound entry in
      article-13-6-staff-cyber-hygiene-awareness.yaml. Third sibling
      under Art.13(6) alongside cra:art-13-vuln-handling-process (the
      documentation-process side, in article-13.yaml) and
      cra:art-13-6-third-party-vuln-awareness (the upstream advisory-
      feed and CSIRT-bulletin ingestion side); cyber_hygiene_training
      pins the workforce-readiness half — per-cycle awareness and
      role-based training, phishing-simulation exercise, completion-
      tracking aggregate, and a dated training-attestation record.
      The NIS2 parallel (nis2:art-21-2-g) and DORA parallel
      (dora:art-13-training-awareness) are already pinned on this
      overlay above; the CRA backlink completes the regulatory
      triplet.
