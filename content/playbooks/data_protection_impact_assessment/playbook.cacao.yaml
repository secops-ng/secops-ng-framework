type: playbook
spec_version: "2.0"
id: playbook--d91a35c0-0000-4000-8000-000000000001
name: GDPR Article 35 data protection impact assessment (DPIA) lifecycle
description: >-
  SKELETON — CACAO v2 scaffold for the operator-side data
  protection impact assessment (DPIA) lifecycle a controller runs
  before deploying processing that is likely to result in a high
  risk to the rights and freedoms of natural persons under GDPR
  Article 35. Distinct from the after-the-fact breach-notification
  lane (Articles 33-34) and from the subject-initiated rights
  lifecycle (Articles 15-22): this is the proactive ex-ante
  assessment lane that runs before the processing is bound to
  production. The lifecycle chains ten steps: screen_dpia_triggers
  against the Article 35(3) mandatory-DPIA triggers (novel
  technology, large-scale processing, systematic-monitoring)
  and the operator's supervisory-authority Article 35(4) blacklist
  → classify_processing_type against the processing-inventory
  surface → gather_processing_description (Article 35(7)(a):
  purposes, categories of data and subjects, recipients,
  retention) → assess_necessity_and_proportionality (Article
  35(7)(b)) → identify_and_assess_risks to rights and freedoms
  (Article 35(7)(c)) → identify_and_document_mitigations
  (Article 35(7)(d): safeguards, security measures, mechanisms)
  → dpo_consultation to obtain the Data Protection Officer's
  advice under Article 35(2) → determine_article_36_gate on the
  residual-risk threshold that triggers prior consultation with
  the supervisory authority under Article 36(1) → produce_dpia_document
  as the durable artifact recording the assessment for the
  operator's Article 5(2) accountability posture →
  schedule_review_cadence with a re-assessment hook at each
  material processing change under Article 35(11). Evidence
  outputs: dpia-screening-result, dpia-document, dpo-consultation-
  record, article-36-pre-consultation-flag (boolean). SKELETON
  only: the processing-inventory adapter, the risk-taxonomy
  binding, and the DPIA-document template are declared as
  adapter-bound surfaces the operator wires; a sibling CORE card
  lands the templates, the OSCAL binding closure, and the
  supervisory-authority pre-consultation submission chain. CACAO
  v2 + SecOps-NG content-model extensions.
playbook_types:
  - notification
  - investigation
created_by: identity--5a509a09-5a50-45a5-85a5-095a509a509a
created: "2026-07-04T00:00:00Z"
modified: "2026-07-04T00:00:00Z"
valid_from: "2026-07-04T00:00:00Z"
labels:
  - gdpr
  - article-35
  - article-36
  - dpia
  - data-protection-impact-assessment
  - accountability
external_references:
  - name: OASIS CACAO v2.0
    description: >-
      Workflow step types (start, action, end), variable
      conventions, x_ extension namespace.
    source: OASIS Open
  - name: >-
      General Data Protection Regulation (EU) 2016/679 —
      Article 35 (data protection impact assessment)
    source: Official Journal of the European Union
    url: https://eur-lex.europa.eu/eli/reg/2016/679/oj
  - name: >-
      General Data Protection Regulation (EU) 2016/679 —
      Article 36 (prior consultation)
    source: Official Journal of the European Union
    url: https://eur-lex.europa.eu/eli/reg/2016/679/oj
  - name: >-
      Article 29 Working Party WP248 rev.01 — Guidelines on
      Data Protection Impact Assessment (DPIA), endorsed by
      the EDPB
    source: European Data Protection Board
playbook_variables:
  __dpia_case_id__:
    type: string
    description: >-
      DPIA case identifier assigned at screen_dpia_triggers.
      Correlation key across screening, description gathering,
      necessity assessment, risk assessment, mitigation
      documentation, DPO consultation, Article 36 gating,
      document production, and review scheduling so a reviewer
      can join the full assessment lifecycle into a single
      accountability-ledger record.
    external: false
  __processing_ref__:
    type: string
    description: >-
      Reference to the processing operation under assessment,
      resolved against the operator's processing-inventory
      surface (the Article 30 record of processing activities
      is the canonical join key). Read by every downstream step
      to scope the assessment to a single processing envelope.
    external: true
  __dpia_required__:
    type: boolean
    description: >-
      Whether the screening step concludes that a DPIA is
      required for __processing_ref__. Set by
      screen_dpia_triggers against the Article 35(3)(a-c)
      mandatory-DPIA triggers, the operator's supervisory-
      authority Article 35(4) blacklist, and the general
      Article 35(1) high-risk test. A false outcome short-
      circuits the workflow with a documented screening
      result; the operator retains the negative screening as
      part of the Article 5(2) accountability record.
    external: false
  __screening_result_ref__:
    type: string
    description: >-
      Reference to the screening-decision artifact produced by
      screen_dpia_triggers. Records the trigger set evaluated,
      the outcome, and the reasoning; retained on the
      accountability ledger whether or not a full DPIA is
      subsequently produced.
    external: false
  __processing_description_ref__:
    type: string
    description: >-
      Reference to the systematic description of the envisaged
      processing operations and their purposes assembled by
      gather_processing_description per Article 35(7)(a):
      purposes, categories of personal data and data subjects,
      recipients, envisaged retention, and where applicable
      the legitimate interest pursued by the controller.
    external: false
  __risk_assessment_ref__:
    type: string
    description: >-
      Reference to the assessment of the risks to the rights
      and freedoms of data subjects produced by
      identify_and_assess_risks per Article 35(7)(c). Records
      the risk taxonomy applied, the per-risk likelihood-and-
      severity determination, and the residual-risk profile
      that feeds determine_article_36_gate.
    external: false
  __mitigations_ref__:
    type: string
    description: >-
      Reference to the measures envisaged to address the risks
      documented by identify_and_document_mitigations per
      Article 35(7)(d): safeguards, security measures, and
      mechanisms to ensure the protection of personal data
      and demonstrate compliance with the Regulation, taking
      into account the rights and legitimate interests of
      data subjects and other persons concerned.
    external: false
  __dpo_consultation_ref__:
    type: string
    description: >-
      Reference to the DPO consultation record produced by
      dpo_consultation per Article 35(2). Where the controller
      has designated a Data Protection Officer, that officer's
      advice on the assessment is recorded on the case; where
      no DPO has been designated (Article 37 does not require
      it), the record documents that fact instead.
    external: false
  __article_36_pre_consultation_flag__:
    type: boolean
    description: >-
      Whether the assessment concludes that the residual risk,
      absent measures taken to mitigate it, would result in a
      high risk under Article 36(1) and therefore triggers
      prior consultation with the supervisory authority
      before the processing may begin. Set by
      determine_article_36_gate against the risk-and-
      mitigations pair.
    external: false
  __dpia_document_ref__:
    type: string
    description: >-
      Reference to the durable DPIA document artifact
      produced by produce_dpia_document. Records the assembled
      Article 35(7)(a)-(d) content, the DPO advice under
      Article 35(2), the Article 36 gate outcome, and the
      review-cadence schedule; the artifact is the operator's
      accountability record under Article 5(2) and the primary
      response to any subsequent Article 58(1)(a) supervisory-
      authority information order.
    external: false
  __review_cadence__:
    type: string
    description: >-
      ISO 8601 duration recording the scheduled DPIA review
      cadence set by schedule_review_cadence per Article
      35(11). At minimum, the review is triggered on any
      material change to the processing envelope; the cadence
      duration records the maximum interval between reviews
      absent such a change.
    external: false
workflow_start: start--d91a35c0-0000-4000-8000-000000000001
workflow:
  start--d91a35c0-0000-4000-8000-000000000001:
    type: start
    name: dpia_start
    on_completion: action--d91a35c0-0000-4000-8000-000000000002
  action--d91a35c0-0000-4000-8000-000000000002:
    type: action
    name: screen_dpia_triggers
    description: >-
      SKELETON — screen __processing_ref__ against the Article
      35(3)(a-c) mandatory-DPIA triggers (systematic and
      extensive evaluation of personal aspects based on
      automated processing; large-scale processing of special
      categories of data or personal data relating to criminal
      convictions and offences; systematic monitoring of a
      publicly accessible area on a large scale), against the
      operator's supervisory-authority Article 35(4) list of
      processing kinds that require a DPIA in the operator's
      jurisdiction, and against the general Article 35(1)
      likely-to-result-in-a-high-risk test taking into
      account the nature, scope, context and purposes of the
      processing. Assigns __dpia_case_id__, sets
      __dpia_required__, and records __screening_result_ref__
      on the accountability ledger. A false outcome short-
      circuits the lifecycle with the negative screening
      retained as part of the operator's Article 5(2)
      accountability record. TODO (CORE): pin the operator's
      supervisory-authority Article 35(4) list adapter and the
      novel-technology signal (WP248 rev.01 criteria).
    on_completion: action--d91a35c0-0000-4000-8000-000000000003
    in_args:
      - __processing_ref__
    out_args:
      - __dpia_case_id__
      - __dpia_required__
      - __screening_result_ref__
    agent_target: dpia_assessor
    x_secops_ng:
      control_refs:
        - control.risk_management_policy@v1
      telemetry_refs:
        - telemetry.ocsf.compliance_finding@v1
  action--d91a35c0-0000-4000-8000-000000000003:
    type: action
    name: classify_processing_type
    description: >-
      SKELETON — classify the processing envelope against the
      operator's processing-inventory surface (the Article 30
      record of processing activities as canonical join key)
      so downstream steps read a common shape: personal-data
      categories, special-category involvement, subject
      categories (including vulnerable-subject axes such as
      children, employees, patients), controller-vs-processor
      role, and the lawful-basis attribution the processing
      relies on under Article 6 (and where applicable
      Article 9(2)). Anchors the assessment scope; does not
      itself perform the risk determination. TODO (CORE): pin
      the RoPA-inventory adapter and the vulnerable-subject
      axis catalogue.
    on_completion: action--d91a35c0-0000-4000-8000-000000000004
    in_args:
      - __dpia_case_id__
      - __processing_ref__
    agent_target: dpia_assessor
    x_secops_ng:
      control_refs:
        - control.risk_management_policy@v1
      telemetry_refs:
        - telemetry.ocsf.compliance_finding@v1
  action--d91a35c0-0000-4000-8000-000000000004:
    type: action
    name: gather_processing_description
    description: >-
      SKELETON — assemble the systematic description of the
      envisaged processing operations and their purposes per
      Article 35(7)(a): purposes of the processing, categories
      of personal data and of data subjects, recipients or
      categories of recipients (including any transfers to
      third countries or international organisations),
      envisaged retention periods or the criteria used to
      determine them, and where applicable the legitimate
      interests pursued by the controller. Records
      __processing_description_ref__ so downstream steps read
      a stable description surface. TODO (CORE): pin the
      RoPA-extraction adapter and the transfer-legs
      cross-reference.
    on_completion: action--d91a35c0-0000-4000-8000-000000000005
    in_args:
      - __dpia_case_id__
      - __processing_ref__
    out_args:
      - __processing_description_ref__
    agent_target: dpia_assessor
    x_secops_ng:
      control_refs:
        - control.risk_management_policy@v1
      telemetry_refs:
        - telemetry.ocsf.compliance_finding@v1
  action--d91a35c0-0000-4000-8000-000000000005:
    type: action
    name: assess_necessity_and_proportionality
    description: >-
      SKELETON — assess the necessity and proportionality of
      the processing operations in relation to the purposes
      per Article 35(7)(b). Necessity: whether the processing
      is required to achieve the purpose or whether a less-
      intrusive alternative would suffice. Proportionality:
      whether the categories of data and the scope of the
      processing are commensurate with the purpose and not
      excessive. Records the reasoning on the case; the
      outcome feeds the risk assessment and the mitigations
      identification downstream. TODO (CORE): pin the
      necessity-and-proportionality assessment template.
    on_completion: action--d91a35c0-0000-4000-8000-000000000006
    in_args:
      - __dpia_case_id__
      - __processing_description_ref__
    agent_target: dpia_assessor
    x_secops_ng:
      control_refs:
        - control.risk_management_policy@v1
      telemetry_refs:
        - telemetry.ocsf.compliance_finding@v1
  action--d91a35c0-0000-4000-8000-000000000006:
    type: action
    name: identify_and_assess_risks
    description: >-
      SKELETON — identify and assess the risks to the rights
      and freedoms of natural persons the processing
      generates per Article 35(7)(c). Applies the operator's
      declared risk taxonomy over the risk-source, risk-
      event, and impact axes (illegitimate access,
      unauthorised modification, disappearance of personal
      data — the three EDPB reference risk categories — plus
      operator-declared context-specific axes). Records
      per-risk likelihood and severity and the residual-risk
      profile that determine_article_36_gate reads
      downstream. Records __risk_assessment_ref__. TODO
      (CORE): pin the risk-taxonomy binding and the residual-
      risk calibration surface.
    on_completion: action--d91a35c0-0000-4000-8000-000000000007
    in_args:
      - __dpia_case_id__
      - __processing_description_ref__
    out_args:
      - __risk_assessment_ref__
    agent_target: dpia_assessor
    x_secops_ng:
      control_refs:
        - control.risk_management_policy@v1
        - control.incident_timeline_signals@v1
      telemetry_refs:
        - telemetry.ocsf.compliance_finding@v1
  action--d91a35c0-0000-4000-8000-000000000007:
    type: action
    name: identify_and_document_mitigations
    description: >-
      SKELETON — identify and document the measures envisaged
      to address the risks per Article 35(7)(d): safeguards,
      security measures, and mechanisms to ensure the
      protection of personal data and demonstrate compliance
      with the Regulation, taking into account the rights and
      legitimate interests of data subjects and other persons
      concerned. Records __mitigations_ref__ and pins the
      per-risk mitigation attribution so
      determine_article_36_gate can read the residual risk
      after mitigation. TODO (CORE): pin the safeguards
      catalogue and the security-measure control-reference
      binding.
    on_completion: action--d91a35c0-0000-4000-8000-000000000008
    in_args:
      - __dpia_case_id__
      - __risk_assessment_ref__
    out_args:
      - __mitigations_ref__
    agent_target: dpia_assessor
    x_secops_ng:
      control_refs:
        - control.risk_management_policy@v1
      telemetry_refs:
        - telemetry.ocsf.compliance_finding@v1
  action--d91a35c0-0000-4000-8000-000000000008:
    type: action
    name: dpo_consultation
    description: >-
      SKELETON — seek the advice of the Data Protection
      Officer where the controller has designated one, per
      Article 35(2). The DPO reviews the assembled
      description, necessity-and-proportionality assessment,
      risk assessment, and mitigations documentation and
      records advice on the DPIA case. Where the controller
      has not designated a DPO because Article 37 does not
      require it, the record documents that fact and the
      alternative accountability surface the controller
      relies on. Records __dpo_consultation_ref__. TODO
      (CORE): pin the DPO-consultation intake adapter and
      the alternative-accountability-surface record where
      no DPO is designated.
    on_completion: action--d91a35c0-0000-4000-8000-000000000009
    in_args:
      - __dpia_case_id__
      - __processing_description_ref__
      - __risk_assessment_ref__
      - __mitigations_ref__
    out_args:
      - __dpo_consultation_ref__
    agent_target: dpia_assessor
    x_secops_ng:
      control_refs:
        - control.risk_management_policy@v1
      telemetry_refs:
        - telemetry.ocsf.compliance_finding@v1
  action--d91a35c0-0000-4000-8000-000000000009:
    type: action
    name: determine_article_36_gate
    description: >-
      SKELETON — determine whether the residual risk, absent
      measures taken by the controller to mitigate it, would
      result in a high risk under Article 36(1) and therefore
      triggers prior consultation with the supervisory
      authority before the processing may begin. Reads the
      risk assessment against the applied mitigations and
      sets __article_36_pre_consultation_flag__. Where the
      flag is true, the controller must consult the
      supervisory authority under Article 36(1) and the
      processing may not begin until the consultation window
      completes (Article 36(2): up to eight weeks, extendable
      by six weeks taking into account the complexity of the
      intended processing). TODO (CORE): pin the supervisory-
      authority pre-consultation submission chain and the
      Article 36(2) consultation-window gate.
    on_completion: action--d91a35c0-0000-4000-8000-00000000000a
    in_args:
      - __dpia_case_id__
      - __risk_assessment_ref__
      - __mitigations_ref__
    out_args:
      - __article_36_pre_consultation_flag__
    agent_target: dpia_assessor
    x_secops_ng:
      control_refs:
        - control.risk_management_policy@v1
      telemetry_refs:
        - telemetry.ocsf.compliance_finding@v1
  action--d91a35c0-0000-4000-8000-00000000000a:
    type: action
    name: produce_dpia_document
    description: >-
      SKELETON — produce the durable DPIA document artifact
      for the case. Assembles the Article 35(7)(a)-(d)
      content (systematic description, necessity-and-
      proportionality, risk assessment, mitigations), the
      Article 35(2) DPO advice, the Article 36 gate outcome,
      and the review-cadence schedule into the operator's
      declared DPIA-document template. Records
      __dpia_document_ref__ on the accountability ledger.
      The document is the primary response to any subsequent
      Article 58(1)(a) supervisory-authority information
      order and the operator's Article 5(2) accountability
      artifact for this processing envelope. TODO (CORE):
      pin the DPIA-document template and the evidence-store
      binding.
    on_completion: action--d91a35c0-0000-4000-8000-00000000000b
    in_args:
      - __dpia_case_id__
      - __processing_description_ref__
      - __risk_assessment_ref__
      - __mitigations_ref__
      - __dpo_consultation_ref__
      - __article_36_pre_consultation_flag__
    out_args:
      - __dpia_document_ref__
    agent_target: dpia_assessor
    x_secops_ng:
      control_refs:
        - control.risk_management_policy@v1
        - control.incident_timeline_signals@v1
      telemetry_refs:
        - telemetry.ocsf.compliance_finding@v1
  action--d91a35c0-0000-4000-8000-00000000000b:
    type: action
    name: schedule_review_cadence
    description: >-
      SKELETON — schedule the DPIA review cadence per Article
      35(11). At minimum, the review is triggered on any
      material change to the risk represented by the
      processing envelope (change in categories of data,
      subjects, recipients, retention, purpose, or
      underlying-technology substrate). Records
      __review_cadence__ as the maximum interval between
      reviews absent such a change, and pins the review
      trigger to the operator's change-management surface.
      TODO (CORE): pin the change-management adapter and the
      review-trigger evidence-emission binding.
    on_completion: end--d91a35c0-0000-4000-8000-00000000000f
    in_args:
      - __dpia_case_id__
      - __dpia_document_ref__
    out_args:
      - __review_cadence__
    agent_target: dpia_assessor
    x_secops_ng:
      control_refs:
        - control.risk_management_policy@v1
      telemetry_refs:
        - telemetry.ocsf.compliance_finding@v1
  end--d91a35c0-0000-4000-8000-00000000000f:
    type: end
    name: dpia_end
