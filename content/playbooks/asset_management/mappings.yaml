# Cross-references for the asset_management playbook.
#
# This file is the playbook's outbound view of the content model: it
# pins OSCAL controls, OCSF event classes consumed/emitted, and the EU
# regulatory clauses this playbook helps operationalise. Inbound
# references live in content/mappings/{nis2,dora,cra}/ so the graph is
# closed in both directions.
#
# This playbook operationalises the asset and configuration management
# capability against the operator's own deployed estate: ingest the
# documented inventory-source set on a scheduled cadence (CMDB,
# declarative infrastructure-as-code records, cloud-provider asset
# APIs, endpoint-management agents), reconcile them into the operator-
# authoritative snapshot for the current window, compute the per-asset
# delta against the previous documented snapshot, classify each delta
# against the operator's documented delta taxonomy (new-managed,
# unmanaged-discovered, decommissioned, baseline-drift), capture the
# dated asset-inventory-delta evidence record, and notify the
# inventory owner. The playbook does not author the operator's
# inventory-source architecture itself; it operationalises a
# documented reconciliation posture against pre-bound sources.
#
# Status: SKELETON + EXTEND-mappings-DORA + EXTEND-mappings-D3FEND.
# The NIS2 Art. 21(2)(i)
# asset-management anchor was pinned at the SKELETON layer. The
# EXTEND-mappings-DORA card adds the DORA Art. 8 (identification
# function — asset / configuration register, exercised under the
# JC RTS on ICT risk management framework — Commission Delegated
# Regulation (EU) 2024/1774) inbound anchor and the reciprocal
# outbound entry below, closing the orphan-CI graph on the DORA
# axis and removing the asset_management skip entry from
# content/mappings/dora/_orphan_skip.yaml. CORE-layer cards add the
# D3FEND defensive-technique bindings (D3-AI Asset Inventory on the
# reconcile step, D3-SWI Software Inventory on the ingest step,
# candidate D3-SYSCONFIG / D3-BCA on the baseline-drift
# classification slice) once stable upstream rule ids are selected
# together with the deterministic per-step primitives; EXTEND-layer
# cards wire the asset-inventory-drift and unmanaged-asset-
# cardinality metric emitters against the operator's evidence
# store. CRA Annex I §1(c) / §1(e) (manufacturer obligations for
# components and configurations delivered with a product) remains
# a defensible upstream anchor on the CRA axis, but no CRA inbound
# entry currently backlinks playbook.asset_management@v1; the CRA
# inbound-closure is a separate sibling card and the CRA grace-
# window skip entry stays in place under
# content/mappings/cra/_orphan_skip.yaml pending that work.
# Mirrors the patch_management and ddos_response per-axis inbound-
# closure precedents.
#
# Deliberate OSCAL omissions:
#   - CM-2 (Baseline Configuration) is NOT pinned at the SKELETON
#     layer: baseline-drift detection is one of the four delta-
#     taxonomy buckets but the baseline-authoring surface itself
#     lives on the operator's configuration-management documentation
#     upstream of this playbook. CORE-PRIM cards may extend the
#     OSCAL block with CM-2 once the baseline-drift classification
#     primitive lands together with its deterministic body, so the
#     mapping reflects the playbook's actual discharge rather than
#     a forward-looking pin.
#   - CM-3 (Configuration Change Control) is NOT pinned: this
#     playbook operationalises the per-window reconciliation slice
#     (ingest-reconcile-delta-classify), not the operator's standing
#     change-management process. CM-3 anchors the operator's
#     change-control authoring surface, which lives in governance
#     documentation; pinning CM-3 here would conflate the per-window
#     reconciliation discipline with the change-control plan-
#     authoring surface. Mirrors the patch_management CM-3 omission
#     gap note.
#   - AU-2 (Event Logging) is NOT pinned: the playbook emits OCSF
#     records, but the operator's audit-event policy is upstream of
#     this playbook.
#
# GDPR closure: a per-workflow Records of Processing Activity entry
# accompanies this overlay at
# content/mappings/gdpr/data-flow-asset_management.md. The workflow
# operates on asset identifiers, inventory-source identifiers,
# snapshot identifiers, delta identifiers, configuration-baseline
# observations, and attestation records; no personal data is
# processed.
#
# Schema: schemas/playbook-mappings.schema.json
playbook: playbook.asset_management@v1

oscal:
  # NIST SP 800-53 Rev. 5 controls exercised by the ingest-inventory-
  # sources, reconcile-authoritative-inventory, compute-delta,
  # classify-delta, capture-evidence, and notify-inventory-owner
  # steps. The single SKELETON pin anchors the playbook end-to-end
  # against CM-8 / CM-8(2); CM-2 (baseline configuration) is held
  # back to the CORE layer where the baseline-drift primitive lands
  # together with its deterministic body (see header gap note).
  - control_ref: control.asset_inventory_delta@v1
    oscal_catalog: NIST SP 800-53 Rev. 5
    control_id: CM-8
    title: System Component Inventory
    url: https://csrc.nist.gov/projects/risk-management/sp800-53-controls/release-search#!/control?version=5.1&number=CM-8
    notes: >-
      Anchors the playbook end-to-end as the system-component-
      inventory capability: develop and document an inventory of
      system components that accurately reflects the system,
      includes all components within the authorization boundary,
      and is at the level of granularity deemed necessary for
      tracking and reporting. The ingest-reconcile-delta-classify
      shape composes the operator-authoritative snapshot for the
      current window and surfaces the per-asset delta against the
      previous documented snapshot; the capture-evidence step
      closes the loop with a dated asset-inventory-delta evidence
      record.

  - control_ref: control.asset_inventory_delta@v1
    oscal_catalog: NIST SP 800-53 Rev. 5
    control_id: CM-8(2)
    title: Automated Maintenance
    url: https://csrc.nist.gov/projects/risk-management/sp800-53-controls/release-search#!/control?version=5.1&number=CM-8
    notes: >-
      Covers the reconcile-authoritative-inventory and compute-
      delta steps: CM-8(2) demands automated mechanisms to help
      maintain an up-to-date, complete, accurate, and readily
      available inventory of system components. The deterministic
      snapshot-id derivation and the per-asset delta normalisation
      (owned by CORE-PRIM) are the mechanical evidence trail
      CM-8(2) reviewers consume; the dated evidence record produced
      by the capture-evidence step is the audit-evident output.

d3fend:
  # MITRE D3FEND v1.0.0 defensive technique tags per playbook step.
  # CACAO step UUIDs are pinned to the real action UUIDs resolved
  # from content/playbooks/asset_management/playbook.cacao.json
  # (six action bodies: ingest-inventory-sources, reconcile-
  # authoritative-inventory, compute-delta, classify-delta,
  # capture-evidence, notify-inventory-owner). Two steps carry
  # per-step D3FEND pins: D3-SWI on the ingest-inventory-sources
  # step and D3-AI on the reconcile-authoritative-inventory step.
  # The compute-delta, classify-delta, capture-evidence, and
  # notify-inventory-owner steps are deliberately not pinned and
  # the gaps are documented in the comments below (mirroring the
  # patch_management and ddos_response per-step gap-note
  # precedents — defensible technique anchors only, no weak
  # bindings forced onto the per-window reconciliation discipline
  # the playbook actually discharges).
  #
  # Upstream anchor: content/controls/control.asset_inventory_delta@v1.yaml
  # already carries D3-AI (Asset Inventory) and D3-SWI (Software
  # Inventory) on the control-side overlay; this EXTEND-mappings-
  # D3FEND card is the per-step lift of the same two techniques
  # onto the playbook overlay, narrowed to the ingest- and
  # reconcile-side disciplines that produce the inventory the
  # control names.
  - step: action--80000000-0000-4000-8000-000000000002
    d3fend_id: D3-SWI
    d3fend_name: Software Inventory
    url: https://d3fend.mitre.org/technique/d3f:SoftwareInventory/
    notes: >-
      ingest-inventory-sources — pulling each documented
      inventory-source's snapshot of declared and observed assets
      into the playbook's working set (CMDB rows, declarative
      infrastructure-as-code records, cloud-provider asset-API
      responses, endpoint-management agent inventories) is the
      software-inventory discipline D3-SWI names: collection of
      information about software present on systems against the
      operator's deployed estate. D3FEND v1.0.0 frames D3-SWI as
      the inventory-collection technique on the software side
      specifically; the ingest step's source set is the
      software-and-component inventory surface the operator's
      documented sources expose, narrowed to the per-window
      reconciliation cadence this playbook discharges rather than
      the standing software-asset-register authoring surface
      upstream of the playbook. Read-only against each source: the
      step records the per-source observations under the
      operator's documented source-precedence ordering, it does
      not write back into the operator's CMDB or IaC declarations.
      Mirrors the control.asset_inventory_delta@v1 control file's
      D3-SWI pin; same technique, here narrowed to the per-window
      ingest slice rather than the standing inventory surface.

  - step: action--80000000-0000-4000-8000-000000000003
    d3fend_id: D3-AI
    d3fend_name: Asset Inventory
    url: https://d3fend.mitre.org/technique/d3f:AssetInventory/
    notes: >-
      reconcile-authoritative-inventory — composing the operator-
      authoritative snapshot for the current reconciliation window
      from the ingested source set by merging per-source asset
      observations under the operator's documented source-
      precedence ordering, and pinning the deterministic snapshot
      id (SHA-256 over the canonical, source-precedence-ordered,
      normalised asset record list) is the asset-inventory
      discipline D3-AI names: the maintenance of an authoritative
      record of the assets the operator is responsible for.
      D3FEND v1.0.0 frames D3-AI as the asset-side counterpart to
      D3-SWI; the reconcile step is the asset-record reconciliation
      slice against the operator's deployed estate, narrowed to
      the per-window snapshot the playbook discharges. The
      reconciled snapshot id is the audit-evident output of the
      reconciliation pass and is consumed by the compute-delta /
      classify-delta / capture-evidence steps. Read-only against
      the source set: correcting drift is the operator's
      downstream lever, the playbook only surfaces the
      observation. Mirrors the control.asset_inventory_delta@v1
      control file's D3-AI pin; same technique, here narrowed to
      the per-window reconciliation slice rather than the
      standing asset-register surface.

  # Deliberate D3FEND omissions:
  #   - compute-delta (action--80000000-0000-4000-8000-000000000004)
  #     and classify-delta
  #     (action--80000000-0000-4000-8000-000000000005) are NOT
  #     pinned. The candidate techniques considered for the
  #     baseline-drift slice of classify-delta (D3-SYSCONFIG /
  #     D3-BCA family — variants of System Configuration /
  #     Baseline-Configuration-Authority) do not land on a
  #     defensible per-step anchor for this playbook: the playbook
  #     surfaces baseline-drift as one of four delta-taxonomy
  #     buckets against the operator's documented configuration
  #     baseline, it does not author the baseline itself. The
  #     baseline-authoring surface and the configuration-authority
  #     surface live upstream of this playbook (operator
  #     configuration-management documentation, IaC declaration
  #     authoring), so pinning a Baseline-Configuration-Authority
  #     technique on the classify step would conflate the per-
  #     window delta-classification discipline with the upstream
  #     authoring surface — exactly the conflation the CM-2 /
  #     CM-3 OSCAL omissions documented in the header avoid on
  #     the control axis. The upstream control file does not pin
  #     a baseline-side D3FEND technique either, so the per-step
  #     lift here mirrors the upstream anchor rather than forcing
  #     a weak binding. The compute-delta step is the deterministic
  #     diff slice between the reconciled snapshot and the
  #     previous documented snapshot; no defensive-technique
  #     anchor in D3FEND v1.0.0 names that internal pass at a
  #     resolution finer than the D3-AI / D3-SWI inventory
  #     disciplines the reconcile and ingest steps already carry.
  #   - capture-evidence (action--80000000-0000-4000-8000-
  #     000000000006) is NOT pinned: the dated evidence-emission
  #     slice produces the audit-evident asset-inventory-delta
  #     record, it does not itself execute a defensive technique
  #     against the operator's deployed estate. Mirrors the
  #     patch_management evidence-capture and ddos_response
  #     evidence-capture gap-note precedents.
  #   - notify-inventory-owner (action--80000000-0000-4000-8000-
  #     000000000007) is NOT pinned: the notification-delivery
  #     slice is the operator-side handoff to the inventory owner,
  #     not a defensive-technique discharge. Mirrors the
  #     patch_management notify-maintenance-owner and
  #     ddos_response notify-incident-management-owner gap-note
  #     precedents.

ocsf:
  # OCSF v1.3.0 telemetry bindings. The ingest-inventory-sources,
  # reconcile-authoritative-inventory, compute-delta, classify-
  # delta, capture-evidence, and notify-inventory-owner steps
  # interact with operator API surfaces (CMDB endpoints, IaC state
  # backends, cloud-provider asset APIs, endpoint-management agent
  # control planes, evidence store, notification channel). Richer
  # per-step telemetry bindings (e.g. OCSF Inventory Info for the
  # reconciled snapshot, OCSF Configuration State for the baseline-
  # drift slice) are deferred to CORE-layer cards once stable
  # upstream signal shapes are selected.
  - id: telemetry.api_activity@v1
    category_uid: 6
    category_name: Application Activity
    class_uid: 6003
    class_name: API Activity
    ocsf_version: "1.3.0"
    direction: both
    notes: >-
      Consumed at the ingest-inventory-sources step (reads against
      the operator's documented inventory-source set: CMDB,
      declarative IaC state backend, cloud-provider asset APIs,
      endpoint-management agent control plane) and at the
      reconcile-authoritative-inventory / compute-delta / classify-
      delta steps (read calls against the previous documented
      snapshot and the operator's documented delta-taxonomy
      reference). Emitted at the capture-evidence step (write call
      publishing the dated asset-inventory-delta evidence record
      to the operator's evidence store) and at the notify-
      inventory-owner step (delivery dispatch to the inventory
      owner's pre-bound channel). Schema:
      https://schema.ocsf.io/1.3.0/classes/api_activity

nis2:
  # Inbound entry that backlinks playbook.asset_management@v1:
  #   - content/mappings/nis2/article-21-2-i.yaml
  #     (id nis2:art-21-2-i — human resources security, access-
  #     control policies, and asset management)
  # Pinned outbound below to close the graph. The matching
  # `playbook_refs:` addition on the NIS2 side lands in this same
  # SKELETON PR so the orphan-CI graph closes on the NIS2 axis
  # without a skip entry.
  - mapping_id: nis2:art-21-2-i
    article: 21(2)(i)
    notes: >-
      NIS2 Art. 21(2)(i) requires essential and important entities
      to apply asset-management measures alongside HR-security and
      access-control measures. The asset_management playbook is
      the operational discharge of the asset-management limb
      against the operator's own deployed estate — the case set
      currently leans on iam_auditor, onboarding_offboarding_tracker,
      cloud_misconfiguration, and identity_compromise for the HR-
      security and access-control limbs of the same clause; none
      of those carries the per-window inventory reconciliation and
      delta-capture discipline against the operator's documented
      asset sources. The ingest-inventory-sources and reconcile-
      authoritative-inventory steps cover the inventory-source
      reconciliation slice; the compute-delta and classify-delta
      steps cover the per-asset delta surfacing against the
      operator's documented delta taxonomy; the capture-evidence
      step closes the loop with audit-evident observation of the
      reconciliation outcome across the reconciliation window.

dora:
  # Inbound entry that backlinks playbook.asset_management@v1:
  #   - content/mappings/dora/article-8.yaml
  #     (id dora:art-8-identification — DORA Art. 8 identification
  #     function: asset / configuration register, exercised under
  #     the JC RTS on ICT risk management framework — Commission
  #     Delegated Regulation (EU) 2024/1774)
  # Pinned outbound below to close the graph. The orphan-CI skip
  # entry for asset_management under
  # content/mappings/dora/_orphan_skip.yaml is removed in this same
  # EXTEND-mappings-DORA PR — the grace-window skip is no longer
  # needed once the real edge lands.
  - mapping_id: dora:art-8-identification
    article: "8"
    notes: >-
      DORA Art. 8 (identification function) requires financial
      entities to identify, classify and adequately document all
      ICT-supported business functions, information assets and ICT
      assets supporting those functions, and their interdependencies,
      and to review the inventory at least annually and upon every
      major change. The operative detail for the asset / configuration
      register surface is in the Level 2 RTS (Commission Delegated
      Regulation (EU) 2024/1774, JC RTS on ICT risk management
      framework). The asset_management playbook is the per-window
      reconciliation materialisation of that surface against the
      operator's deployed estate: ingest the documented inventory-
      source set (CMDB, declarative infrastructure-as-code records,
      cloud-provider asset APIs, endpoint-management agents),
      reconcile to the operator-authoritative snapshot for the
      current window, compute and classify the per-asset delta
      against the documented delta taxonomy (new-managed, unmanaged-
      discovered, decommissioned, baseline-drift), and capture the
      dated asset-inventory-delta evidence record. This outbound
      entry is the structural closure of the
      dora:art-8-identification backlink. Out of scope of this
      playbook's discharge: the supplier-inventory limb of Art. 8
      (anchored end-to-end by control.supplier_inventory@v1; the
      third-party-management playbook slice is owned by a separate
      inbound-closure card) and the SBOM-capture limb on in-house
      product assets (anchored end-to-end by control.sbom_capture@v1
      against CRA Annex I §2, owned on the CRA axis). Mirrors the
      patch_management DORA Art. 9(4)(a) inbound-closure precedent
      and the ddos_response DORA Art. 11 inbound-closure precedent:
      a single per-discipline outbound entry pinned against the
      atom-per-obligation inbound anchor.

cra:
  # No CRA inbound entry currently backlinks
  # playbook.asset_management@v1, and the scope-mapping review
  # has now concluded this is a durable, reviewed deferral
  # rather than an open TODO. The estate-wide asset
  # reconciliation discharge this playbook owns is materially
  # an operator obligation under NIS2 Art. 21(2)(i) and
  # DORA Art. 8(4) — both axes are closed (see the nis2: and
  # dora: blocks above). CRA Annex I is product-by-product
  # manufacturer scope: every operator-side clause that asset
  # visibility could plausibly anchor against (§1(b) secure-by-
  # default, §1(c) configuration security, §1(d) access control,
  # §1(e) protection from unauthorised access, §1(l) logging /
  # monitoring) is already pinned to the playbook that actually
  # discharges it (cloud_misconfiguration /
  # infra_posture_management / iam_auditor /
  # onboarding_offboarding_tracker / mfa_secured_comms /
  # crypto_posture_management / identity_compromise / the
  # detection-engineering and alert-triage lanes). Adding an
  # asset_management pin to any of those would duplicate the
  # discharge and dilute the existing inbound. The
  # clause-by-clause review is recorded under the
  # asset_management entry in
  # content/mappings/cra/_orphan_skip.yaml; the orphan-CI
  # closure for this playbook on the CRA axis is audited there
  # as a reviewed skip rather than a pending gap. Re-open the
  # review if CRA secondary acts carve an operator-side
  # inventory anchor not already covered by the pins above.
  []
