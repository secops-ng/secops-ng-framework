# Cross-references for the nis2_art20_governance playbook.
#
# Outbound view of the content model: pins OSCAL controls, MITRE
# D3FEND defensive techniques, OCSF event classes emitted, and the
# EU regulatory clauses this playbook helps operationalise. Inbound
# references live in content/mappings/nis2/ so the graph is closed
# in both directions.
#
# This playbook operates the NIS2 Directive (EU) 2022/2555 Article
# 20 management-body cybersecurity governance surface: convene the
# management-body cybersecurity review cycle on the documented
# cadence (Art. 20(1)), present the current Art. 21(2)(a)-(j) risk-
# posture and compliance status to the management body, record the
# management-body approval of the cybersecurity risk-management
# measures and the associated Art. 20(2) training-completion
# attestation for management-body members, and emit the dated
# governance-record evidence artifact so the auditable-lifecycle
# obligation is closed on every cycle. Distinct from the sibling
# nis2_self_assessment playbook (the whole-Article-21 evidence
# roll-up on the operator's declared self-assessment cadence) and
# from the F-CP-06 effectiveness loop (per-metric snapshots on the
# evaluation-window cadence): this is the management-body approval
# discipline the Article 20(1) obligation names on the governance-
# body axis.
#
# Status: SKELETON. The SKELETON pins the two NIS2 Art. 20 inbound
# anchors (art-20-1 management-body approval + art-20-2 management-
# body training), the OSCAL PM-2 (Information Security Program
# Leadership Role) and SA-2 (Allocation of Resources) anchors, the
# D3FEND D3-PSEP (Policy and Standards Enforcement Process) cluster
# on the approve_risk_measures step, and the OCSF API Activity
# (6003) class the log_governance_evidence step emits. CORE-layer
# cards land the deterministic per-step primitives and the byte-
# parity goldens under examples/{n8n,temporal,langgraph}/
# nis2_art20_governance/. An EXTEND card wires the practitioner
# cookbook and any KPI/KRI emitters (e.g. a management-body
# training-overdue KRI) once the metric shapes are ratified.
#
# Sovereign-stack note: no proprietary governance-tooling surface
# is assumed. The governance-cadence catalogue and the management-
# body member roster live in the operator's own governance
# documentation upstream of this playbook. The evidence artifact
# is a plain JSON governance-record; the evidence-sink is whatever
# EU-hostable object surface the operator already runs.
#
# Deliberate OSCAL omissions:
#   - PM-1 (Information Security Program Plan) is NOT pinned: the
#     program-plan authoring surface lives in the operator's
#     governance documentation upstream of this playbook. Article
#     20(1) is the management-body approval discipline against a
#     plan that already exists; this playbook operates the
#     approval-cycle discipline, not the plan-authoring surface.
#   - PM-13 (Security and Privacy Workforce) is NOT pinned: the
#     workforce-development programme is upstream of the per-cycle
#     management-body training-completion attestation Article
#     20(2) names on the management-body axis specifically.
#   - AT-3 (Role-Based Training) is NOT pinned: role-based training
#     for the broader workforce is discharged under Article 21(2)(g)
#     via the cyber_hygiene_training playbook. Article 20(2)
#     narrows to the management-body member roster, which is a
#     distinct roster from the general-staff training roster; the
#     Article 21(2)(g) discharge is not a substitute.
#
# GDPR closure: no per-workflow Records of Processing Activity
# entry is required; this playbook operates on governance-cycle
# identifiers, review-event identifiers, posture-snapshot
# identifiers, approval-record identifiers, and evidence-record
# identifiers. Management-body-member identity references carried
# in the Article 20(2) training-completion attestation are
# personal data, but they are recorded verbatim from the operator's
# existing management-body member roster (the ROPA for which is
# authored upstream in the operator's governance documentation);
# this playbook composes the per-cycle governance view over that
# roster, it does not create a new personal-data collection
# surface.
#
# Schema: schemas/playbook-mappings.schema.json
playbook: playbook.nis2_art20_governance@v1

oscal:
  # NIST SP 800-53 Rev. 5 anchors for the management-body
  # governance and resource-allocation surface. PM-2 anchors the
  # management-body leadership-role discipline the Art. 20(1)
  # approval obligation names; SA-2 anchors the resource-
  # allocation lever the management-body approval carries (an
  # approved risk-management measure that is not funded is not a
  # discharged measure). The SKELETON pins both anchors as
  # placeholder control URNs; sibling CORE cards populate the
  # control-xref files under content/controls/ if the ICT-risk-
  # governance anchor at control.ict_risk_governance@v1 (which
  # already pins PM-2) does not consolidate the anchor.
  - id: control.information_security_program_plan@v1
    oscal_catalog: NIST SP 800-53 Rev. 5
    control_id: PM-2
    title: Information Security Program Leadership Role
    url: https://csrc.nist.gov/projects/risk-management/sp800-53-controls/release-search#!/control?version=5.1&number=PM-2
    todo: true
    notes: >-
      SKELETON placeholder — anchors the schedule_management_review,
      present_risk_posture, approve_risk_measures, and
      log_governance_evidence steps to the PM-2 information-security
      program leadership-role discipline. PM-2 requires the
      organisation to appoint a senior official with the mission
      and resources to coordinate, develop, implement, and maintain
      an organisation-wide information security program; the
      management-body approval cycle NIS2 Art. 20(1) names is the
      board-level oversight discipline that closes over that
      leadership role. CORE-layer cards resolve this placeholder
      against either a dedicated control.information_security_program_plan
      xref file (if the plan-authoring surface warrants its own
      URN) or a consolidation into control.ict_risk_governance@v1
      (which already pins PM-2). The todo flag stays set until that
      resolution lands.
  - id: control.resource_allocation@v1
    oscal_catalog: NIST SP 800-53 Rev. 5
    control_id: SA-2
    title: Allocation of Resources
    url: https://csrc.nist.gov/projects/risk-management/sp800-53-controls/release-search#!/control?version=5.1&number=SA-2
    todo: true
    notes: >-
      SKELETON placeholder — anchors the approve_risk_measures step
      to the SA-2 resource-allocation discipline. SA-2 requires the
      organisation to determine information security and privacy
      requirements for each system, determine, document, and
      allocate the resources required to protect the system, and
      establish a discrete line item for those resources in
      organisational programming and budgeting documentation. The
      management-body approval cycle NIS2 Art. 20(1) names is the
      governance-body decision surface that closes over resource
      allocation for the Art. 21 risk-management measures: an
      approved measure that is not resourced is not a discharged
      measure. CORE-layer cards resolve this placeholder against a
      populated control.resource_allocation xref file. The todo
      flag stays set until that resolution lands.

d3fend:
  # MITRE D3FEND v1.0.0 defensive-technique tag on the
  # approve_risk_measures step. The management-body approval of
  # cybersecurity risk-management measures is a policy-and-
  # standards-enforcement-process discharge on the governance-body
  # axis: the management body approves the measures the operator
  # must implement, and that approval is the enforcement-cadence
  # record subsequent controls rest on. Read-only against the
  # operator's evidence surface: the step composes the per-cycle
  # governance decision, it does not mutate any operational control
  # surface.
  #
  # Only the approval step carries a per-step D3FEND pin; the
  # schedule, present, and log steps are deliberately not pinned
  # and the gaps are documented in the comments below (mirroring
  # the per-step gap-note precedents on nis2_self_assessment and
  # cyber_hygiene_training).
  - step: action--a2000000-0000-4000-8000-000000000004
    d3fend_id: D3-PSEP
    d3fend_name: Policy and Standards Enforcement Process
    url: https://d3fend.mitre.org/technique/d3f:PolicyAndStandardsEnforcementProcess/
    notes: >-
      approve_risk_measures — the management-body approval of the
      cybersecurity risk-management measures presented in the per-
      cycle posture snapshot is the policy-and-standards-
      enforcement-process discipline D3-PSEP names: the governance-
      body decision that pins which measures the operator is
      committed to implement, on what timeline, and with which
      resource allocation. D3FEND frames D3-PSEP as the process by
      which policies and standards are enforced across the
      organisation on the governance-body axis specifically; the
      approve step is the management-body-level materialisation of
      that discipline for NIS2 Art. 20(1) purposes. Read-only-by-
      contract — no operational control surface is mutated at this
      step; the approval record captures the governance-decision
      outcome, and downstream controls consume that record on the
      subsequent cadence they run against. Sibling EXTEND cards
      may add additional per-step D3FEND anchors (e.g. D3-OAM
      Operational Activity Mapping on the present_risk_posture step
      if the posture-composition slice is later scoped as a
      distinct defensive technique rather than a read-only
      composition pass).

  # Deliberate D3FEND omissions:
  #   - schedule_management_review
  #     (action--a2000000-0000-4000-8000-000000000002) is NOT
  #     pinned: the review-scheduling slice is a read-only pass
  #     against the operator's governance-cadence catalogue, not
  #     a defensive-technique discharge. Mirrors the
  #     nis2_self_assessment collect-clause-evidence gap-note
  #     precedent.
  #   - present_risk_posture
  #     (action--a2000000-0000-4000-8000-000000000003) is NOT
  #     pinned: the posture-composition slice is a read-only
  #     view over the operator's evidence store, not a defensive-
  #     technique discharge. Mirrors the nis2_self_assessment
  #     map-evidence-to-clauses gap-note precedent.
  #   - log_governance_evidence
  #     (action--a2000000-0000-4000-8000-000000000005) is NOT
  #     pinned: the dated evidence-emission slice produces the
  #     audit-evident governance record, it does not itself
  #     execute a defensive technique. Mirrors the
  #     nis2_self_assessment report-attestation gap-note
  #     precedent.

ocsf:
  # OCSF v1.3.0 telemetry binding. The log_governance_evidence
  # step emits an API Activity (6003) record carrying the
  # governance-cycle, review, posture-snapshot, and approval-
  # record identifiers plus the captured_at timestamp — the
  # audit-evident carrier the NIS2 Art. 20(1) evidence-stream
  # review reads. The schedule, present, and approve steps
  # interact with operator API surfaces (governance-cadence
  # catalogue, evidence store, governance-decision record) so
  # the class carries the both-directions binding on this
  # playbook rather than the emit-only binding.
  - id: telemetry.ocsf.api_activity@v1
    category_uid: 6
    category_name: Application Activity
    class_uid: 6003
    class_name: API Activity
    ocsf_version: "1.3.0"
    direction: both
    notes: >-
      Consumed at the schedule_management_review step (read against
      the operator's governance-cadence catalogue), at the
      present_risk_posture step (read against the operator's
      evidence store for the current Article 21(2)(a)-(j) coverage
      buckets), and at the approve_risk_measures step (read against
      the operator's management-body-decision record surface).
      Emitted at the log_governance_evidence step as the dated
      governance-record evidence artifact carrying the governance-
      cycle, review, posture-snapshot, and approval-record
      identifiers plus the captured_at timestamp. Reuses the same
      API Activity envelope already exercised by the
      nis2_self_assessment report-attestation step. Schema:
      https://schema.ocsf.io/1.3.0/classes/api_activity

nis2:
  # Inbound entries that backlink playbook.nis2_art20_governance@v1:
  #   - content/mappings/nis2/article-20.yaml (nis2:art-20-1
  #     management-body approval, nis2:art-20-2 management-body
  #     training)
  # Pinned outbound below to close the graph. Article 20(1) is the
  # governance-body approval discipline; Article 20(2) is the
  # management-body training obligation the approval cycle carries
  # the attestation for.
  - mapping_id: nis2:art-20-1
    article: "20(1)"
    notes: >-
      NIS2 Directive (EU) 2022/2555 Article 20(1) requires the
      management bodies of essential and important entities to
      approve the cybersecurity risk-management measures taken by
      those entities to comply with Article 21, oversee their
      implementation, and be held liable for infringements. The
      nis2_art20_governance playbook is the operational discharge
      of that obligation on the governance-body cadence: the
      four-step approval cycle (schedule review, present posture,
      approve measures, log evidence) produces the dated
      governance-record evidence artifact the auditable-lifecycle
      obligation names.
  - mapping_id: nis2:art-20-2
    article: "20(2)"
    notes: >-
      NIS2 Directive (EU) 2022/2555 Article 20(2) requires the
      members of the management body of essential and important
      entities to follow training on a regular basis so they gain
      sufficient knowledge and skills to identify risks and assess
      cybersecurity risk-management practices and their impact on
      the services provided by the entity, and to encourage the
      entity to offer similar training to all employees on a
      regular basis. The management-body training-completion
      attestation is carried on the approve_risk_measures step's
      approval-record artifact for management-body members
      specifically; general-staff training obligations under Art.
      20(2)'s "similar training to all employees" clause are
      discharged under Art. 21(2)(g) via
      playbook.cyber_hygiene_training@v1, which is the appropriate
      lane for the workforce-wide training-programme surface.

dora:
  # No DORA inbound entry backlinks
  # playbook.nis2_art20_governance@v1 at SKELETON. DORA's
  # equivalent management-body governance surface (Art. 5(2)(a)
  # digital-identity governance under the broader Art. 5
  # governance-and-organisation obligation, plus Art. 5(2)(b)
  # approval of the ICT risk-management framework by the
  # management body) does overlap the discipline this playbook
  # discharges on the governance-body axis, but DORA is regime-
  # specific to financial entities and anchors on a different
  # approval-cycle catalogue. A sibling G-02 card may add a
  # dora:art-5-management-body-approval inbound entry once the
  # DORA-side approval-cycle atom is confirmed as a distinct
  # scope rather than a lift of the NIS2 anchor. Until then the
  # closure lands via the NIS2 Art. 20 umbrella.
  []

cra:
  # No CRA (Regulation (EU) 2024/2847) touchpoint on this
  # playbook. CRA operates on product security of products with
  # digital elements; management-body approval of an operator's
  # own cybersecurity risk-management measures is an operator-
  # side governance discipline downstream of any product-side
  # CRA obligation.
  []
