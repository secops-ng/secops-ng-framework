# Cross-references for the dora_tlpt_programme playbook.
#
# This file is the playbook's outbound view of the content model: it
# pins OSCAL controls, MITRE D3FEND defensive techniques, OCSF event
# classes consumed / emitted, and the EU regulatory clauses this
# playbook helps operationalise. Inbound references live in
# content/mappings/{nis2,dora,cra,gdpr}/ so the graph is closed in
# both directions.
#
# This playbook is the operator-side DORA Chapter IV digital
# operational resilience testing (DORT) programme discipline — Art. 24
# (general requirements for the testing of digital operational
# resilience) and Art. 26 (advanced testing of ICT tools, systems and
# processes based on threat-led penetration testing, anchored on the
# ECB TIBER-EU framework as the implementation reference). Distinct
# from the dora_ict_risk_selfassess whole-Chapter II roll-up and from
# the per-section producing playbooks the roll-up aggregates.
#
# Status: CORE (F-WF-DORA-TLPT CORE). The CORE tier layers the
# compile-target parity lane (three worked examples + byte-parity
# goldens under examples/{n8n,temporal,langgraph}/dora_tlpt_programme/
# and tests/examples/{n8n,temporal,langgraph}/dora_tlpt_programme/)
# on top of the SKELETON scaffold, absorbs the CA-8 (Penetration
# Testing) OSCAL anchor into the existing control.control_
# effectiveness_test@v1 overlay per the SKELETON handoff option,
# confirms the SKELETON's D3-OAM candidate on the remediation-
# tracking step, and closes the NIS2 + GDPR outbound graph on the
# effectiveness-testing lane (nis2:art-21-2-f, gdpr:art-32-1-d).
# The CRA / EU AI Act axes stay as reviewed skips against the
# respective _orphan_skip.yaml manifests — rationale unchanged from
# SKELETON.
#
# Deliberate OSCAL notes:
#   - NIST SP 800-53 Rev. 5 CA-8 (Penetration Testing) is the direct
#     penetration-testing anchor for the red-team engagement lane. At
#     CORE, CA-8 is deliberately absorbed into the existing
#     control.control_effectiveness_test@v1 surface (already pinned
#     end-to-end via the CA-2 anchor) rather than lifted onto a new
#     control.penetration_testing@v1 overlay: CA-8 is a specialised
#     control-effectiveness discipline on the penetration-testing
#     sub-slice, and the TLPT programme's audit-evident output (the
#     findings register + dated competent-authority remediation
#     attestation) is the same evidence surface CA-2's Control
#     Assessments anchor and the CA-2 effectiveness slice both read
#     against. The CA-2 entry below carries the CA-8 rationale in
#     its notes body; a new content/controls/control.penetration_
#     testing@v1 overlay is deliberately NOT introduced at CORE to
#     keep the controls catalogue lean around a single well-scoped
#     effectiveness-testing surface. Reviewers who prefer a separate
#     top-level CA-8 pin can lift it in a follow-on sibling card
#     without altering the outbound-edge graph.
#   - CA-7 (Continuous Monitoring) is NOT pinned: the TLPT programme
#     is a cadenced, competent-authority-gated engagement discipline
#     rather than a continuous-monitoring discipline. Continuous
#     monitoring lives on the dora_ict_risk_selfassess and F-CP-06
#     effectiveness-loop surfaces. Pinning CA-7 here would misrepresent
#     the mandatory-TLPT-cycle rhythm.
#
# Deliberate DORA-axis coverage boundary:
#   - Article 25 (Testing of ICT tools and systems), which sits
#     between Art. 24 and Art. 26 in Chapter IV, prescribes the
#     specific-testing-methodology surface (vulnerability
#     assessments, scenario-based tests, compatibility testing,
#     performance testing, end-to-end testing, penetration testing)
#     the operator discharges under the broader Art. 24 general-
#     requirements umbrella. This playbook anchors on the Art. 24
#     scope + Art. 26 TLPT-programme axes; the Art. 25 per-methodology
#     axis is either absorbed onto sibling per-methodology playbooks
#     (e.g. vuln_intake for vulnerability-assessment testing,
#     detection_engineering for detection-rule effectiveness testing)
#     or lifted onto its own SKELETON in a follow-on card. Recording
#     the boundary here so reviewers see the intentional Art. 25
#     handoff shape rather than a silent gap.
#   - Article 27 (Requirements for testers for the carrying out of
#     TLPT) prescribes the tester-selection criteria (certification,
#     independence, professional-indemnity insurance) the operator
#     applies at the red-team-scoping-approval step. This playbook
#     consumes the Art. 27 criteria at the scoping-approval step but
#     does not itself lift Art. 27 as a top-level atom on the
#     inbound mapping; the criteria are cited in the mapping's
#     notes body against the dora:art-24-26-dort-tlpt-programme
#     entry.
#
# NIS2 closure: CORE pins the outbound edge to
# nis2:art-21-2-f (policies and procedures to assess the effectiveness
# of cybersecurity risk-management measures) on the effectiveness-
# testing lane. NIS2 does not carry a direct threat-led-penetration-
# testing programme obligation at the shape of DORA Art. 26, but
# Art. 21(2)(f) is the adjacent effectiveness-testing anchor and the
# TLPT programme is a specialised form of effectiveness testing —
# competent-authority-notified, cadenced against JC 2022 03, and
# discharged by an independent red-team engagement against the
# operator's declared critical or important functions. The audit-
# evident findings register and dated remediation attestation the
# TLPT programme emits are the same effectiveness-evidence shape
# Art. 21(2)(f) requires operators to keep. Co-anchored with the
# sibling detection_engineering + nis2_self_assessment playbooks
# already pinned on nis2:art-21-2-f: the three playbooks together
# cover detection-rule effectiveness, whole-Article-21 self-
# assessment, and threat-led-penetration-testing effectiveness on
# the same clause. The matching playbook_refs: entry on
# content/mappings/nis2/article-21-2-f.yaml lands in this same CORE
# PR so the graph is closed in both directions. The
# dora_tlpt_programme entry in content/mappings/nis2/_orphan_skip.yaml
# is removed in the same PR so the orphan-CI assertion re-arms
# against regressions.
#
# CRA closure: no CRA inbound entry currently backlinks
# playbook.dora_tlpt_programme@v1, and this is a durable, reviewed
# deferral rather than an open TODO. CRA Annex I is product-by-
# product manufacturer scope; the operator-side TLPT programme
# discipline is regime-specific to financial entities under DORA
# and does not cross-map onto the CRA product-lifecycle surface.
# The CRA clause-by-clause review is recorded under the
# dora_tlpt_programme entry in content/mappings/cra/_orphan_skip.yaml.
# Mirrors the dora_ict_risk_selfassess CRA-axis precedent.
#
# GDPR closure: CORE pins the outbound edge to
# gdpr:art-32-1-d-regular-testing-and-effectiveness on the periodic-
# testing / effectiveness-evaluation lane. GDPR Art. 32(1)(d)
# requires the controller and processor to implement a process for
# regularly testing, assessing, and evaluating the effectiveness of
# technical and organisational measures for ensuring the security
# of the processing. The TLPT programme, discharged on the
# mandatory-TLPT cycle prescribed by the competent authority under
# DORA Art. 26(1), is a specialised form of that regular-testing-
# and-effectiveness discipline for financial entities in scope of
# both regimes — the same red-team engagement and its findings
# register / remediation-attestation output that discharge DORA
# Art. 26(8) also discharge the periodic-testing limb of GDPR
# Art. 32(1)(d) where in-scope critical or important functions
# process personal data. Co-anchored with the sibling
# detection_engineering, infra_posture_management, backup_recovery,
# cyber_hygiene_training, and nis2_self_assessment playbooks
# already pinned on gdpr:art-32-1-d — the six playbooks together
# cover the detection, configuration-baseline, backup-restore,
# training-organisational-measures, whole-NIS2-Article-21 self-
# assessment, and threat-led-penetration-testing lanes of the
# regular-testing discipline. The per-workflow GDPR data-flow record
# at content/mappings/gdpr/data-flow-dora_tlpt_programme.md remains
# authoritative for the per-workflow ROPA surface (accountability-
# owner attribution, tester-roster attribution, attestation-
# signatory attribution). Red-team engagement outputs may
# incidentally carry personal data where an in-scope critical or
# important function processes personal data; that discharge is on
# the producing surface (the in-scope function's own playbook and
# its own data-flow record), not on this testing-programme
# lifecycle. The matching playbook_refs: entry on
# content/mappings/gdpr/article-32-security-of-processing.yaml lands
# in this same CORE PR so the graph is closed in both directions.
# The dora_tlpt_programme entry in
# content/mappings/gdpr/_orphan_skip.yaml is removed in the same PR
# so the orphan-CI assertion re-arms against regressions.
#
# EU AI Act closure: no EU AI Act inbound entry currently backlinks
# playbook.dora_tlpt_programme@v1, and this is a durable, reviewed
# deferral rather than an open TODO. EU AI Act Art. 15 accuracy /
# robustness / cybersecurity is the closest neighbouring
# testing-discipline anchor, but is a product-lifecycle obligation
# on providers of high-risk AI systems rather than an operator-side
# TLPT programme obligation. The EU AI Act clause-by-clause review
# is recorded under the dora_tlpt_programme entry in
# content/mappings/eu_ai_act/_orphan_skip.yaml.
#
# Schema: schemas/playbook-mappings.schema.json
playbook: playbook.dora_tlpt_programme@v1

oscal:
  # NIST SP 800-53 Rev. 5 control anchoring the four steps of the
  # TLPT programme lifecycle. The SKELETON pins CA-2 (Control
  # Assessments) via the existing control.security_assessment@v1
  # overlay end-to-end; CA-8 (Penetration Testing) is the direct
  # anchor for the red-team engagement lane and is deferred to the
  # sibling CORE card per the header note.
  - id: control.security_assessment@v1
    oscal_catalog: NIST SP 800-53 Rev. 5
    control_id: CA-2
    title: Control Assessments
    url: https://csrc.nist.gov/projects/risk-management/sp800-53-controls/release-search#!/control?version=5.1&number=CA-2
    notes: >-
      Anchors the playbook end-to-end as the control-assessment
      capability against the operator's ICT operations: CA-2 requires
      the operator to develop, review, and approve a control
      assessment plan, assess the controls in the system and its
      environment of operation to determine the extent to which the
      controls are implemented correctly, operating as intended, and
      producing the desired outcome, and produce a control assessment
      report. The DORT programme lifecycle composes the scope
      catalogue, discharges the TLPT trigger-and-planning gate,
      packages the red-team scoping submission for competent-authority
      approval, and emits the dated remediation attestation — the
      audit-evident report CA-2 reviewers consume, here narrowed to
      the DORA Chapter IV testing-programme surface. CA-8
      (Penetration Testing) is the direct anchor for the red-team
      engagement lane and is deferred to the sibling CORE card per
      the header-note handoff shape.

  - id: control.control_effectiveness_test@v1
    oscal_catalog: NIST SP 800-53 Rev. 5
    control_id: CA-2
    title: Control Assessments (effectiveness-testing slice; absorbs CA-8 Penetration Testing)
    url: https://csrc.nist.gov/projects/risk-management/sp800-53-controls/release-search#!/control?version=5.1&number=CA-2
    notes: >-
      Covers the remediation-tracking step specifically: the findings
      register the red-team engagement produces plus the dated
      remediation attestation together discharge the effectiveness-
      testing slice of CA-2, narrowed to the DORA Art. 26(8)
      remediation-tracking obligation. The attestation is the
      audit-evident output the competent authority reads for the
      remediation lane of the TLPT programme.
      At CORE this overlay also absorbs NIST SP 800-53 Rev. 5 CA-8
      (Penetration Testing) as a deliberate scope-widening rather
      than lifting a separate control.penetration_testing@v1 entry:
      CA-8 requires the operator to conduct penetration testing on
      the system and its environment of operation, and the TLPT
      programme's red-team engagement (packaged for competent-
      authority approval at red_team_scoping_approval and discharged
      into the findings register at remediation-tracking) is the
      DORA-narrowed application of that discipline. CA-8's specific
      demands (independent tester posture, defined rules of
      engagement, remediation follow-up) are all present on the
      TLPT lifecycle steps this control anchors, so the effectiveness-
      testing slice is the natural home. A follow-on sibling card
      may lift CA-8 onto its own overlay if a downstream reviewer
      needs a discrete pin — the outbound-edge graph does not change.

d3fend:
  # MITRE D3FEND v1.0.0 defensive technique pin per playbook step.
  # CORE confirms the SKELETON candidate: D3-OAM (Operational
  # Activity Mapping) on the remediation-tracking step is the correct
  # defensive-technique anchor for the write-side lifecycle framing —
  # mapping the red-team engagement findings onto the operator's
  # declared severity rubric and remediation-timeline model IS the
  # operational-activity-mapping discipline D3FEND v1.0.0 names.
  # D3FEND v1.0.0 does not carry a distinct threat-led-penetration-
  # testing programme technique, so the other three action steps
  # (define_dort_scope, tlpt_trigger_and_planning_gate,
  # red_team_scoping_approval) are deliberately NOT pinned and the
  # gaps are documented per step below, mirroring the per-step
  # pin-where-it-fits / document-the-gap pattern the sibling
  # dora_ict_risk_selfassess overlay applies on D3-OAM.
  - step: action--55000000-0000-4000-8000-000000000005
    d3fend_id: D3-OAM
    d3fend_name: Operational Activity Mapping
    url: https://d3fend.mitre.org/technique/d3f:OperationalActivityMapping/
    notes: >-
      remediation tracking — mapping the red-team engagement findings
      onto the operator's declared severity rubric and remediation-
      timeline model is the operational-activity-mapping discipline
      D3-OAM names. The findings-register composition step reads the
      engagement output against __red_team_scoping_id__ and produces
      per-finding records with id, severity, affected function,
      affected ICT asset, evidence pointer, and initial remediation
      timeline; the downstream dated competent-authority remediation
      attestation is the audit-evident summary of that mapping.
      D3-OAM here names the write-side activity-mapping discipline
      (composing the operational-activity view from the engagement
      output), distinct from the read-side assessment framing the
      dora_ict_risk_selfassess overlay applied on the same technique
      — the two overlays anchor D3-OAM on adjacent but non-
      overlapping surfaces (read-side coverage-scoring vs write-side
      findings-mapping) and both are legitimate under the D3FEND
      technique definition.
  #
  # define DORT scope (action--55000000-0000-4000-8000-000000000002)
  # is deliberately NOT pinned to a D3FEND technique. D3FEND v1.0.0
  # does not carry a defensive technique for scope-catalogue
  # composition against the operator's business-service / ICT-asset
  # / ICT third-party registers distinct from the downstream
  # activity-mapping surface it feeds; the scope catalogue is the
  # upstream of the operational-activity-mapping discipline rather
  # than the mapping itself. This step is anchored on the CA-2
  # OSCAL control above where the control-assessment planning
  # obligation actually lives. Mirrors the sibling
  # dora_ict_risk_selfassess overlay's per-step gap-note pattern.
  #
  # TLPT trigger and planning gate (action--55000000-0000-4000-8000-000000000003)
  # is deliberately NOT pinned to a D3FEND technique. D3FEND v1.0.0
  # does not carry a defensive technique for mandatory-testing-
  # decision governance distinct from the downstream engagement
  # discipline it feeds — the JC 2022 03 criteria evaluation and
  # the competent-authority notification are a compliance-governance
  # surface, not a runtime countermeasure. This step is anchored on
  # the CA-2 OSCAL control above.
  #
  # red-team scoping approval (action--55000000-0000-4000-8000-000000000004)
  # is deliberately NOT pinned to a D3FEND technique. D3FEND v1.0.0
  # does not carry a distinct threat-led-penetration-testing
  # programme technique on either the Deceive or Isolate tactics
  # that would capture the operator-side scoping-submission
  # discipline; the closest candidate is on the offensive
  # ATT&CK-adjacent side of the framework rather than on the
  # defensive-technique catalogue this file pins. This step is
  # anchored on the CA-2 OSCAL control above (which absorbs CA-8
  # per the header note) — the OSCAL surface carries the
  # penetration-testing-scoping anchor, and the D3FEND surface
  # picks up on the downstream activity-mapping step where the
  # defensive discipline actually applies.

ocsf:
  # OCSF v1.3.0 telemetry binding. All four action steps interact
  # with operator API surfaces (business-service / ICT-asset /
  # ICT third-party registers at the scope step, competent-authority
  # notification / approval channel at the trigger and scoping-approval
  # steps, evidence store at the remediation-tracking step). API
  # Activity (6003) is the consistent class across both consumed and
  # emitted records for these read / write surfaces. Richer per-step
  # telemetry bindings (e.g. OCSF Compliance Finding on the
  # remediation-status roll-up) are deferred to CORE-layer cards once
  # stable upstream signal shapes are selected.
  - id: telemetry.api_activity@v1
    category_uid: 6
    category_name: Application Activity
    class_uid: 6003
    class_name: API Activity
    ocsf_version: "1.3.0"
    direction: both
    notes: >-
      Consumed at the define-DORT-scope step (reads against the
      operator's business-service register, ICT-asset register, and
      ICT third-party service-provider register). Consumed and
      emitted at the TLPT-trigger-and-planning-gate step (reads
      against the operator's declared __entity_significance_tier__
      and the JC 2022 03 criteria model; emits the competent-authority
      notification against the adapter binding declared under
      patterns.dora_tlpt_programme on the sibling EXTEND card).
      Consumed and emitted at the red-team-scoping-approval step
      (packages the scoping submission and dispatches to the
      competent-authority approval channel; records the approval
      or deferral outcome). Emitted at the remediation-tracking step
      (write call publishing the dated competent-authority
      remediation attestation record to the operator's evidence
      store). Schema:
      https://schema.ocsf.io/1.3.0/classes/api_activity

nis2:
  # Inbound entry that backlinks playbook.dora_tlpt_programme@v1:
  #   - content/mappings/nis2/article-21-2-f.yaml
  #     (nis2:art-21-2-f — policies and procedures to assess the
  #     effectiveness of cybersecurity risk-management measures)
  # Pinned outbound below to close the graph. Co-anchored with the
  # sibling detection_engineering + nis2_self_assessment playbooks
  # already pinned on nis2:art-21-2-f: the three playbooks together
  # cover detection-rule effectiveness, whole-Article-21 self-
  # assessment, and threat-led-penetration-testing effectiveness on
  # the same clause. The matching playbook_refs: entry on
  # content/mappings/nis2/article-21-2-f.yaml lands in this same CORE
  # PR so the graph is closed in both directions.
  - mapping_id: nis2:art-21-2-f
    article: 21(2)(f)
    notes: >-
      NIS2 Art. 21(2)(f) requires essential and important entities to
      operate policies and procedures to assess the effectiveness of
      cybersecurity risk-management measures. This playbook is the
      threat-led-penetration-testing effectiveness lane of that
      obligation for financial entities in scope of both regimes: the
      TLPT programme discharges the effectiveness-assessment
      discipline on the operator's ICT tools and systems supporting
      critical or important functions via an independent red-team
      engagement, and the findings register + dated competent-
      authority remediation attestation are the effectiveness-
      evidence artifacts Art. 21(2)(f) names. Co-anchored with the
      sibling detection_engineering playbook (detection-rule
      effectiveness lane, per-rule-version effectiveness snapshots)
      and the sibling nis2_self_assessment playbook (whole-Article-21
      self-assessment roll-up); this playbook adds the TLPT-
      effectiveness lane on top. NIS2 does not carry a direct TLPT-
      programme obligation at the shape of DORA Art. 26, so this pin
      is the adjacent-effectiveness-anchor closure rather than a
      direct threat-led-penetration-testing atom.

dora:
  # Inbound entry that backlinks playbook.dora_tlpt_programme@v1:
  #   - content/mappings/dora/article-24-26.yaml
  #     (dora:art-24-26-dort-tlpt-programme — Art. 24 general
  #     requirements for the testing of digital operational
  #     resilience and Art. 26 advanced testing based on TLPT)
  # The matching playbook_refs: entry on the new inbound file lands
  # in this same SKELETON PR so the orphan-CI graph closes on the
  # DORA axis end-to-end without a skip entry.
  - mapping_id: dora:art-24-26-dort-tlpt-programme
    article: "24; 26"
    notes: >-
      DORA Chapter IV digital operational resilience testing — the
      Art. 24 general-requirements-for-testing surface (identify the
      critical or important functions, supporting ICT assets, and
      third-party dependencies in scope; discharge a periodic
      testing programme) and the Art. 26 advanced-testing-based-on-
      TLPT surface (mandatory-TLPT decision under the JC 2022 03
      criteria; competent-authority notification and scoping
      approval; findings-register and dated remediation attestation).
      This playbook is the operator-side lifecycle materialisation
      of both surfaces on the mandatory-TLPT-cycle cadence
      prescribed by the competent authority. The Art. 27
      testers-requirements criteria are consumed at the scoping-
      approval step and cited in the inbound file's notes body
      without a separate top-level atom (a single-clause child that
      only gates a step on this playbook does not warrant a fan-out
      to a per-Article inbound file). Level 2 detail on the
      testing-programme scope lives in the JC RTS on ICT
      risk-management framework (Commission Delegated Regulation
      (EU) 2024/1774) Articles 25 and 26; the TIBER-EU framework is
      the implementation reference the TLPT-lifecycle steps read
      against.

cra: []

gdpr:
  # Inbound entry that backlinks playbook.dora_tlpt_programme@v1:
  #   - content/mappings/gdpr/article-32-security-of-processing.yaml
  #     (gdpr:art-32-1-d-regular-testing-and-effectiveness —
  #     regular testing, assessing, and evaluating the effectiveness
  #     of technical and organisational measures)
  # Pinned outbound below to close the graph. Co-anchored with the
  # sibling detection_engineering, infra_posture_management,
  # backup_recovery, cyber_hygiene_training, and nis2_self_assessment
  # playbooks already pinned on gdpr:art-32-1-d — the six playbooks
  # together cover the detection, configuration-baseline,
  # backup-restore, training-organisational-measures, whole-NIS2-
  # Article-21 self-assessment, and threat-led-penetration-testing
  # lanes of the regular-testing discipline. The matching
  # playbook_refs: entry on
  # content/mappings/gdpr/article-32-security-of-processing.yaml lands
  # in this same CORE PR so the graph is closed in both directions.
  - mapping_id: gdpr:art-32-1-d-regular-testing-and-effectiveness
    article: "32(1)(d)"
    notes: >-
      GDPR Art. 32(1)(d) requires the controller and processor to
      implement a process for regularly testing, assessing, and
      evaluating the effectiveness of technical and organisational
      measures for ensuring the security of the processing. The TLPT
      programme, discharged on the mandatory-TLPT cycle prescribed
      by the competent authority under DORA Art. 26(1), is a
      specialised form of that regular-testing-and-effectiveness
      discipline for financial entities in scope of both regimes:
      the red-team engagement exercises the operator's security
      measures on the in-scope critical or important functions, the
      findings register records the effectiveness gaps discovered,
      and the dated remediation attestation is the audit-evident
      record that the security measures continue to meet the
      level-of-security-appropriate-to-the-risk threshold over time.
      Where in-scope critical or important functions process
      personal data, the same engagement + attestation output
      discharges the Art. 32(1)(d) periodic-testing limb alongside
      the DORA Art. 26(8) remediation-tracking obligation. The
      per-workflow GDPR data-flow record at
      content/mappings/gdpr/data-flow-dora_tlpt_programme.md remains
      authoritative for the per-workflow ROPA surface
      (accountability-owner attribution, tester-roster attribution,
      attestation-signatory attribution).
