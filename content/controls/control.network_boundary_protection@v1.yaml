stable_id: control.network_boundary_protection@v1
title: Network boundary protection and segmentation
summary: >-
  Operator maintains a documented segmentation policy (zone-transit
  matrix, per-segment allowance set) and reconciles it per window
  against the observed network posture on the deployed estate, so
  that boundary-control drift and unauthorised cross-segment
  reachability surface as classified violations with dated evidence.

