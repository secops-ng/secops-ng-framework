stable_id: control.account_management@v1
title: Account management
summary: >-
  Operator manages the full lifecycle of system and service accounts —
  request, approval, creation, modification, review, disablement, and
  removal — so every active account maps to a current, authorised role
  and stale accounts do not linger.

