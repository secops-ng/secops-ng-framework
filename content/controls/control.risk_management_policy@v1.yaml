# SecOps-NG control file — cross-reference layer.
# Schema: content-model/control_xref.schema.json
stable_id: control.risk_management_policy@v1
title: Risk management policy
summary: >-
  Operator adopts, approves, and periodically re-assesses the
  information-security risk-management policy, with dated ownership and
  a documented re-assessment cadence.

oscal_refs:
  - catalog: "NIST 800-53 rev5"
    control_id: "PM-9"
    title: "Risk Management Strategy"
  - catalog: "NIST 800-53 rev5"
    control_id: "RA-3"
    title: "Risk Assessment"
  - catalog: "ISO/IEC 27001:2022"
    control_id: "A.5.1"
    title: "Policies for information security"
  - catalog: "NIS2 Article 21(2)"
    control_id: "art21-2-a"
    title: "Risk analysis and information system security policies"

d3fend_refs:
  - d3f_id: D3-OAM
    technique_name: "Operational Activity Mapping"
    url: https://d3fend.mitre.org/technique/d3f:OperationalActivityMapping/

# Re-assessment cadence consumed by the risk-analysis evidence stream
# (content/evidence/risk-analysis/) and by the kri.control_effectiveness@v1
# overdue calculation. ISO-8601 duration. Annual baseline mirrors the NIS2
# Art. 21(2)(a) periodic-re-assessment expectation and the DORA Art. 5–6
# annual-review obligation; operators with a stricter scoped variant may
# override locally without changing this default.
review_cadence: P1Y

provenance:
  source_url: https://d3fend.mitre.org/technique/d3f:OperationalActivityMapping/
  captured_at: '2026-05-30'
