stable_id: control.incident_timeline_signals@v1
title: Incident timeline signal capture
summary: >-
  Operator captures the regulated clock signals — discovery,
  classification, containment, recovery, notification — on every in-
  scope incident so NIS2 / DORA / CRA notification SLAs can be computed
  and audited from a single source.

