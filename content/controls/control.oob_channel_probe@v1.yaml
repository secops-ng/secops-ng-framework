stable_id: control.oob_channel_probe@v1
title: Out-of-band emergency channel probe
summary: >-
  Operator periodically tests the out-of-band emergency communications
  channel (voice, secure messaging, paging) to confirm it is reachable
  independently of the primary information-system path.

