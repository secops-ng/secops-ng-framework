stable_id: control.least_privilege@v1
title: Least privilege
summary: >-
  Operator authorises access for users, processes, and services only
  with the privileges strictly necessary to accomplish assigned tasks,
  and reviews entitlements periodically so unused or over-broad rights
  are removed.

