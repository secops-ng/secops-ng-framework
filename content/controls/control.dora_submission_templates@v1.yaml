  - catalog: "NIST 800-53 rev5"
    control_id: "IR-6"
    title: "Incident Reporting"
  - catalog: "ISO/IEC 27001:2022"
    control_id: "A.5.25"
    title: "Assessment and decision on information security events"
  - catalog: "DORA Article 5"
    control_id: "art-19"
    title: "Reporting of major ICT-related incidents"

d3fend_refs:
  - d3f_id: D3-IRA
    technique_name: "Incident Response Analysis"
    url: https://d3fend.mitre.org/technique/d3f:IncidentResponseAnalysis/

provenance:
  source_url: https://d3fend.mitre.org/technique/d3f:IncidentResponseAnalysis/
  captured_at: '2026-05-30'
  notes: >-
    Templates are the submission shape; clock-driven signal capture is
    anchored separately under control.incident_timeline_signals@v1.
