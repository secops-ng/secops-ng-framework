stable_id: control.service_identification_authentication@v1
title: Service identification and authentication
summary: >-
  Operator uniquely identifies and authenticates non-organisational
  services and workloads — including machine-to-machine and inter-service
  calls — before granting access to protected resources, so every
  workload identity is anchored to a verifiable credential.

