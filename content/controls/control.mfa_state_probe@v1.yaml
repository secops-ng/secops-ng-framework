stable_id: control.mfa_state_probe@v1
title: MFA state probe
summary: >-
  Operator periodically probes identity providers to confirm multi-
  factor or continuous authentication is enforced on every principal in
  scope, surfacing exceptions for remediation.

oscal_refs:
  - catalog: "NIST 800-53 rev5"
    control_id: "IA-2(1)"
    title: "Multi-factor Authentication to Privileged Accounts"
  - catalog: "NIST 800-53 rev5"
    control_id: "IA-2(2)"
    title: "Multi-factor Authentication to Non-privileged Accounts"
  - catalog: "ISO/IEC 27001:2022"
    control_id: "A.8.5"
    title: "Secure authentication"
  - catalog: "NIS2 Article 21(2)"
    control_id: "art21-2-j"
    title: "Multi-factor or continuous authentication"

d3fend_refs:
  - d3f_id: D3-MFA
    technique_name: "Multi-factor Authentication"
    url: https://d3fend.mitre.org/technique/d3f:Multi-factorAuthentication/
    offensive_techniques_attack:
      - T1078
      - T1110

provenance:
  source_url: https://d3fend.mitre.org/technique/d3f:Multi-factorAuthentication/
  captured_at: '2026-05-30'
