stable_id: control.dora_major_classifier@v1
title: DORA major incident classifier
summary: >-
  Operator applies the DORA Article 18 classification criteria (clients
  affected, reputational impact, duration, geographical spread, data
  losses, criticality, economic impact) on every ICT-related incident so
  the major-incident threshold is evaluated consistently.

