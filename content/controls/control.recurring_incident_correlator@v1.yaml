stable_id: control.recurring_incident_correlator@v1
title: Recurring-incident correlator
summary: >-
  Operator correlates ICT-related incidents over a six-month rolling
  window on apparent root cause so a recurring pattern that aggregates
  over the major-incident threshold is detected and escalated.

