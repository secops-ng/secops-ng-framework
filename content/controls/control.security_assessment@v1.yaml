# SecOps-NG control file — cross-reference layer.
# Schema: content-model/control_xref.schema.json
stable_id: control.security_assessment@v1
title: Security control assessment
summary: >-
  Operator runs a structured assessment of a declared control to
  determine whether it is implemented correctly, operating as
  intended, and producing the desired outcome, and archives the
  assessment record (criteria, evidence, verdict) so the control's
  fitness is auditable across review cycles. Distinct from
  control_effectiveness_test (which measures a running control's
  output against thresholds): security_assessment is the peer-review
  / criteria-based judgement loop that gates a control change before
  it ships.

