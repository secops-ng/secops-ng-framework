stable_id: control.crisis_communication_plan@v1
title: Crisis communication plan
summary: >-
  Operator maintains crisis communication plans that enable responsible
  disclosure of major ICT-related incidents and vulnerabilities to
  clients, counterparts, the public, and staff, with at least one
  designated owner for external communications.

