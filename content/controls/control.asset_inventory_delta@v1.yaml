stable_id: control.asset_inventory_delta@v1
title: Asset inventory delta capture
summary: >-
  Operator maintains an authoritative inventory of information and ICT
  assets and captures the delta between scheduled snapshots so that
  unmanaged or undocumented assets surface as exceptions.

