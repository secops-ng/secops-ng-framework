stable_id: control.baseline_configuration@v1
title: Baseline configuration
summary: >-
  Operator develops, documents, and maintains a current baseline
  configuration for systems and services — including hardened defaults,
  approved component inventories, and declared deviations — as the
  reference state every running system is measured against.

