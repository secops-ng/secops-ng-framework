      - kri.regulator_notification_overrun@v1

  - id: nis2:art-23-final-report
    regulation:
      name: NIS2
      instrument: Directive (EU) 2022/2555
      celex: 32022L2555
      article: 23(4)(d)
      url: https://eur-lex.europa.eu/eli/dir/2022/2555/oj
    obligation: >-
      Submit a final report no later than one month after the incident
      notification, containing a detailed description of the incident,
      the type of threat or root cause, applied and ongoing mitigation
      measures, and where applicable the cross-border impact.
    status: draft
    control_refs:
      - control.incident_timeline_signals@v1
    playbook_refs:
      - playbook.post_incident_review@v1
    metric_refs:
      - kpi.final_report_on_time@v1
      - kpi.review_completion_sla@v1
