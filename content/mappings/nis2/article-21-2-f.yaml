# NIS2 — Article 21(2)(f) effectiveness assessment of risk-management measures.
# Cross-ref: research brief 2026-05-15-nis2-baseline-mapping.md.
regime: nis2
entries:
  - id: nis2:art-21-2-f
    regulation:
      name: NIS2
      instrument: Directive (EU) 2022/2555
      celex: 32022L2555
      article: 21(2)(f)
      url: https://eur-lex.europa.eu/eli/dir/2022/2555/oj
    obligation: >-
      Policies and procedures to assess the effectiveness of cybersecurity
      risk-management measures, with results archived.
    status: draft
    control_refs:
      - control.control_effectiveness_test@v1
    playbook_refs:
      # F-WF-04 SKELETON: detection_engineering rule lifecycle
      # (propose -> review -> ship -> measure). The `measure` state
      # emits the per-rule-version effectiveness snapshot defined at
      # `schemas/evidence/rule-effectiveness-snapshot.schema.json`.
      - playbook.detection_engineering@v1
      - playbook.nis2_self_assessment@v1
    metric_refs:
      - kri.control_effectiveness@v1
      - kpi.control_effectiveness_coverage@v1
      - kri.overdue_effectiveness_tests@v1
    evidence_stream_refs:
      - effectiveness
    notes: >-
      The effectiveness evidence stream (F-CP-06) emits one snapshot per
      (metric, policy-or-prompt-version, evaluation-window). The
      contributor narrative lives under
      content/mappings/nis2/article-21-2-f-effectiveness.md; the typed
      artifact shape is schemas/evidence/effectiveness.schema.json.
      Periodic re-assessment cadence and archival of results are
      operator-side responsibilities discharged by the snapshot's
      captured_at and retention fields plus the upstream control's
      review_cadence.
