# NIS2 — Article 21(2)(a) risk-analysis and information-system-security policies.
# Cross-ref: research brief 2026-05-15-nis2-baseline-mapping.md.
regime: nis2
entries:
  - id: nis2:art-21-2-a
    regulation:
      name: NIS2
      instrument: Directive (EU) 2022/2555
      celex: 32022L2555
      article: 21(2)(a)
      url: https://eur-lex.europa.eu/eli/dir/2022/2555/oj
    obligation: >-
      Adopt and maintain policies on risk analysis and information system
      security, including periodic re-assessment with dated ownership.
    status: draft
    control_refs:
      - control.risk_management_policy@v1
      - control.cspm_baseline@v1
      - control.asset_inventory_delta@v1
    playbook_refs:
      - playbook.infra_posture_management@v1
    metric_refs:
      - kri.risk_register_staleness@v1
      - kpi.cloud_posture_coverage@v1
    evidence_stream_refs:
      - risk-analysis
      - posture
    notes: >-
      Most of (a) is governance (policy text, board approval) and lives in
      docs templates rather than workflow content. The agentic slice is the
      re-assessment cadence enforcement, exercised by the evidence-collector
      pattern; that slice is mapped under (f) (effectiveness assessment).
      SKELETON: `playbook.infra_posture_management@v1` is shipped with
      declarative placeholder step bodies pending CORE / EXTEND sibling
      cards. It is the continuous variant of the Shipped F-WF-02
      posture-audit lane — scheduled re-execution emits one posture-evidence
      artifact per tick (schemas/evidence/posture.schema.json, stream
      `posture`) so the periodic-re-assessment obligation has a durable
      artifact series the F-CP-06 effectiveness loop can read against.
