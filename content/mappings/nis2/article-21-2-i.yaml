# NIS2 — Article 21(2)(i) HR security, access control and asset management.
# Cross-ref: research brief 2026-05-15-nis2-baseline-mapping.md.
regime: nis2
entries:
  - id: nis2:art-21-2-i
    regulation:
      name: NIS2
      instrument: Directive (EU) 2022/2555
      celex: 32022L2555
      article: 21(2)(i)
      url: https://eur-lex.europa.eu/eli/dir/2022/2555/oj
    obligation: >-
      Human resources security, access-control policies, and asset
      management — including joiner-mover-leaver evidence,
      privileged-access review cadence, and asset inventory delta capture.
    status: draft
    control_refs:
      - control.jml_evidence@v1
      - control.privileged_access_review@v1
      - control.asset_inventory_delta@v1
      - control.cloud_identity_least_privilege@v1
    playbook_refs:
      - playbook.identity_compromise@v1
      - playbook.cloud_misconfiguration@v1
      - playbook.iam_auditor@v1
      - playbook.onboarding_offboarding_tracker@v1
      - playbook.asset_management@v1
    metric_refs:
      - kri.orphaned_privileged_accounts@v1
      - kri.asset_inventory_drift@v1
      - kpi.cloud_posture_coverage@v1
    evidence_stream_refs:
      - access
    notes: >-
      SKELETON: `playbook.iam_auditor@v1` is shipped with declarative
      placeholder step bodies pending CORE / EXTEND sibling cards.
      It is the per-execution capability-inventory producer that
      anchors the access evidence stream (F-CP-07) against this
      obligation; the schema for the artifact it emits lives at
      schemas/evidence/access.schema.json.
      `playbook.onboarding_offboarding_tracker@v1` (F-WF-11) is the
      per-lifecycle-event grant/revoke-confirmation counterpart —
      one access artifact per joiner / mover / leaver event,
      anchored on the same F-CP-07 access stream and shaped against
      the same `schemas/evidence/access.schema.json` envelope. The
      two playbooks discharge complementary halves of this
      obligation surface: the IAM auditor pins which caller invoked
      a running workflow and what capabilities that caller held;
      the on-boarding / off-boarding tracker pins the declared
      capability delta on a joiner-mover-leaver event and the
      observed confirmation that the delta landed.
