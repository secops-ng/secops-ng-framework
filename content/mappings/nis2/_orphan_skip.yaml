# NIS2 orphan-CI assertion skip manifest.
#
# Used by `tools.lint_playbook_orphans --framework nis2` (and the
# nightly multi-framework workflow) to allow a finalized playbook to
# stay without an inbound `playbook_refs:` citation under
# `content/mappings/nis2/` without tripping the G-02 KRI.
#
# Each entry is a deliberate, audited exclusion. The rationale is
# committed history; the SKELETON guard rejects any entry that lacks
# the two required fields. Removing a slug from this list re-arms the
# assertion against it immediately.
#
# A slug listed here MUST refer to a directory under
# `content/playbooks/` that carries a CACAO finalization marker
# (`playbook.cacao.json` or `playbook.cacao.yaml`). Listing a
# non-finalized or non-existent slug is a hard error.

skip:
  - slug: executive_metrics
    rationale: >-
      Reporting playbook that aggregates KPI/KRI evidence for board-
      level review; it is not the operational object of any single
      NIS2 Article 21/22/23 obligation. It surfaces indirectly via the
      `metric_refs:` on each clause's mapping rather than via
      `playbook_refs:`, which is the audited convention for reporting
      playbooks across every framework.
  - slug: cra_srp_notify
    rationale: >-
      CRA Article 14 Single Reporting Platform (SRP) notification
      chain. The playbook's outbound overlay
      (`content/playbooks/cra_srp_notify/mappings.yaml`) deliberately
      does not pin NIS2 entries: NIS2 Article 23 significant-incident
      reporting anchors on incident-management playbooks that emit
      their own regulator-notification chains, and cross-pinning the
      CRA-specific SRP submission workflow under NIS2 Art. 23 would
      misrepresent the obligation surface. The CRA inbound graph is
      closed via `content/mappings/cra/article-14-and-annex-i.yaml`.
      A sibling EXTEND card revisits the NIS2 / DORA cross-regime
      graph once the SRP intake schema is published (Commission
      pre-go-live testing period ahead of 11 September 2026) and
      ENISA documents the parallel-reporting interaction.
  - slug: data_subject_rights
    rationale: >-
      GDPR Chapter III data subject rights (DSR) intake and fulfilment
      lifecycle (Articles 15-22). The playbook's outbound overlay
      (`content/playbooks/data_subject_rights/mappings.yaml`)
      deliberately does not pin NIS2 entries: NIS2 Article 21 risk-
      management and Article 23 significant-incident reporting are
      separate obligation surfaces that anchor on the operator's
      incident-management and posture-management playbooks. Cross-
      pinning the DSR lifecycle under NIS2 would misrepresent the
      obligation surface. The GDPR inbound graph is closed via
      `content/mappings/gdpr/article-15-22-data-subject-rights.yaml`.
      A sibling CORE / EXTEND card revisits the NIS2 cross-regime
      graph if a documented interaction is authored (for example a
      NIS2 Art. 23 incident that triggers a wave of DSR requests
      would run the incident lane and the DSR lane in parallel — the
      two lanes stay separately anchored, not cross-pinned).
  - slug: data_protection_impact_assessment
    rationale: >-
      GDPR Article 35 data protection impact assessment (DPIA)
      lifecycle. The playbook's outbound overlay
      (`content/playbooks/data_protection_impact_assessment/mappings.yaml`)
      deliberately does not pin NIS2 entries: NIS2 Article 21 risk-
      management and Article 23 significant-incident reporting are
      separate obligation surfaces distinct from the GDPR Article 35
      ex-ante process obligation. Cross-pinning the DPIA lifecycle
      under NIS2 would misrepresent the obligation surface. The GDPR
      inbound graph is closed via
      `content/mappings/gdpr/article-35-dpia.yaml` (Article 35(1) /
      35(3)(a) / 35(3)(b) entries). A sibling CORE / EXTEND card
      revisits the NIS2 cross-regime graph if a documented
      interaction is authored (for example a NIS2 Art. 21(2)(f)
      effectiveness-assessment overlap on the same processing
      envelope).
  - slug: cra_cvd
    rationale: >-
      CRA Article 14 coordinated-vulnerability-disclosure (CVD)
      lifecycle. The playbook's outbound overlay
      (`content/playbooks/cra_cvd/mappings.yaml`) deliberately does
      not pin NIS2 entries: NIS2 Article 23 significant-incident
      reporting anchors on incident-management playbooks that emit
      their own regulator-notification chains, and cross-pinning the
      CRA-specific CVD lifecycle under NIS2 Art. 23 would
      misrepresent the obligation surface. The CRA inbound graph is
      closed via
      `content/mappings/cra/article-14-and-annex-i.yaml` (Annex I
      §2(2) and §2(5)). A sibling CORE / EXTEND card revisits the
      NIS2 cross-regime graph once ENISA documents the interaction
      between CRA Article 14 CVD and NIS2 Article 23 parallel
      reporting for cases that cross both thresholds.

  - slug: dora_ict_risk_selfassess
    rationale: >-
      DORA Chapter II ICT risk management whole-Chapter operator
      self-assessment roll-up. The playbook's outbound overlay
      (`content/playbooks/dora_ict_risk_selfassess/mappings.yaml`)
      deliberately does not pin NIS2 entries: NIS2 Article 21(2)
      risk-management measures already have their own whole-Article
      operator self-assessment roll-up
      (`playbook.nis2_self_assessment@v1`) that anchors against the
      ten sub-clause atoms, and cross-pinning this DORA roll-up onto
      NIS2 Article 21(2) would misrepresent the obligation surface
      (financial-entity-specific Chapter II ICT risk management
      framework versus the broader NIS2 essential/important-entity
      risk-management measures). The DORA inbound graph is closed
      via `content/mappings/dora/article-{6,7,8,10,11}.yaml` (each
      of the five Chapter II section atoms carries the outbound
      backlink). A sibling CORE / EXTEND card revisits the NIS2
      cross-regime graph if a documented interaction is authored
      (for example a shared attestation surface across
      financial-entity operators subject to both regimes).

