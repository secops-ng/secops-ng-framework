# GDPR — Art. 32(1)(a) encryption and pseudonymisation of personal data.
#
# F-MAP-GDPR CORE-3: third per-clause GDPR mapping YAML, slotting in
# beside the existing CORE-1 breach-notification cluster
# (article-33-34-personal-data-breach-notification.yaml) and the
# CORE-2 security-of-processing cluster
# (article-32-security-of-processing.yaml). This file authors the
# Art. 32(1)(a) encryption/pseudonymisation limb that the CORE-2
# header (article-32-security-of-processing.yaml, lines 37-44)
# explicitly carved out as deferred.
#
# Scope of this file:
#
#   - gdpr:art-32-1-a-encryption — pseudonymisation and encryption of
#     personal data as one of the technical-and-organisational
#     measures the operator implements under Art. 32(1) appropriate
#     to the risk. Two finalized playbooks are agentic anchors:
#
#     * crypto_posture_management holds the encryption-posture
#       surface end-to-end. Per its data-flow doc §1 and §6, the
#       playbook operates the cryptography & encryption posture
#       discipline against the operator's declared TLS endpoints,
#       cipher suites, and key-rotation cadence. The dated
#       posture-attestation record is the audit-evident artifact
#       that makes the encryption-of-personal-data capability
#       evidenced rather than asserted — the same evidence shape
#       NIS2 Art. 21(2)(h) and DORA Art. 9(2)/(3) anchor on, now
#       carrying its GDPR-side backlink. Cipher-floor and rotation
#       deviations surface via the kri.expiring_tls_certs@v1 and
#       kri.overdue_key_rotations@v1 metrics; per-endpoint and
#       per-key records flow through the Compliance Finding (2003)
#       telemetry binding.
#
#     * mfa_secured_comms holds the secured-communications limb of
#       Art. 32(1)(a) only. The mfa_secured_comms playbook's
#       "secured voice/video/text communications" surface (the
#       verify-oob-channels step against the operator's out-of-band
#       emergency-communications channels — NIS2 Art. 21(2)(j) third
#       limb, DORA Art. 9(4)(b) communications-confidentiality
#       facet) is an encryption-in-transit posture exercise: the
#       reachability and independence-path probe records that the
#       OOB channel remains an encryption-protected alternate path
#       for emergency communications, and the dated attestation is
#       the audit-evident artifact under this clause. The
#       multi-factor and continuous-authentication limbs of the
#       same playbook (probe-mfa-coverage, assess-continuous-auth)
#       are NOT Art. 32(1)(a) measures — they are access-control
#       measures that belong under Art. 32(1)(b) ongoing
#       confidentiality/integrity/availability of processing systems
#       and services. The Art. 32(1)(b) entry in
#       article-32-security-of-processing.yaml does not currently
#       cite mfa_secured_comms because that file's CORE-2 scope was
#       fixed before mfa_secured_comms was finalized; a future
#       maintenance pass on Art. 32(1)(b) re-cites the
#       authentication-enforcement limb. This file pins
#       mfa_secured_comms via the secured-communications limb only.
#
# Out of scope of this file (deliberately):
#
#   - Pseudonymisation as an independent technique. Art. 32(1)(a)
#     names pseudonymisation alongside encryption as a
#     personal-data-protection measure, but no finalized playbook
#     currently operates a pseudonymisation discipline (the
#     framework's current playbook set targets posture-exercise,
#     vulnerability-handling, breach-handling, and access-control
#     surfaces — none of which author a pseudonymisation transform
#     against subject data). The obligation text below names both
#     limbs; the playbook_refs list anchors only the encryption limb
#     until a pseudonymisation-natured playbook lands. The notes
#     section records the explicit gap so reviewers see it.
#
#   - The MFA-coverage / continuous-authentication limb of
#     mfa_secured_comms. See the per-entry scoping note above —
#     access-control belongs under Art. 32(1)(b), not under this
#     entry. The playbook is cited here only for its secured-
#     communications limb.
#
#   - cyber_hygiene_training is an organisational-measures slug
#     (security awareness and operator training under Art. 32(1)
#     organisational measures axis), not an encryption or
#     pseudonymisation measure. It is not cited here and is not
#     listed in `_orphan_skip.yaml` either — it sits in the
#     grace window and will be anchored under a sibling per-clause
#     YAML for the organisational-measures axis on a later CORE
#     slice.
#
# Cross-references:
#
#   - NIS2 parallel: content/mappings/nis2/article-21-2-h.yaml pins
#     crypto_posture_management against the NIS2 cryptography-and-
#     encryption obligation; content/mappings/nis2/article-21-2-j.yaml
#     pins mfa_secured_comms against the NIS2 multi-factor and
#     secured-communications obligation. The GDPR Art. 32(1)(a)
#     limb this file anchors is the personal-data-protection regime's
#     view of the same cryptographic surface NIS2 carries under
#     21(2)(h) and the secured-communications surface NIS2 carries
#     under 21(2)(j); the two regimes file separate evidence
#     requirements against the same underlying playbooks.
#
#   - DORA parallel: content/mappings/dora/article-9-crypto.yaml
#     pins crypto_posture_management on the DORA ICT-security-
#     policies cryptography lane; content/mappings/dora/
#     article-9-4-b-authentication.yaml pins mfa_secured_comms on
#     the DORA strong-authentication / secured-communications lane.
#     Same multi-regime dependency.
#
#   - CRA parallel: the cryptographic-posture lane is anchored at
#     content/mappings/cra/annex-i-1-e-confidentiality-crypto-posture.yaml
#     (Annex I §1(e) confidentiality of stored/transmitted data,
#     cryptographic-posture lane); the secured-comms / MFA lane is
#     anchored at
#     content/mappings/cra/annex-i-1-d-access-control-mfa-coverage.yaml
#     (Annex I §1(d) access control, MFA-coverage and
#     secured-communications lane). The three regimes (NIS2, DORA,
#     CRA) and GDPR Art. 32(1)(a) carry separate obligations against
#     the same playbook set.
#
#   - Sibling GDPR clause: content/mappings/gdpr/
#     article-32-security-of-processing.yaml carries the
#     Art. 32(1)(b) ongoing-confidentiality/integrity/availability
#     limb, the Art. 32(1)(c) restore-availability limb, and the
#     Art. 32(1)(d) regular-testing-and-effectiveness limb. The
#     Art. 32 cluster is now authored under two files (this file +
#     security-of-processing) by limb; a later CORE slice may merge
#     them if the cluster grows wider entries, but the per-clause
#     shape is the audited convention.

regime: gdpr
entries:
  - id: gdpr:art-32-1-a-encryption
    regulation:
      name: GDPR
      instrument: Regulation (EU) 2016/679
      celex: 32016R0679
      article: "32"
      url: https://eur-lex.europa.eu/eli/reg/2016/679/oj
    obligation: >-
      Implement appropriate technical and organisational measures to
      ensure a level of security appropriate to the risk, including
      as appropriate the pseudonymisation and encryption of personal
      data. Measures must take account of the state of the art, the
      costs of implementation, and the nature, scope, context, and
      purposes of processing, as well as the risk of varying
      likelihood and severity for the rights and freedoms of natural
      persons. The encryption capability must be exercisable on the
      operator's documented cryptographic surface — declared TLS
      endpoints, cipher-suite floor, key-rotation cadence, and the
      secured-communications channels that carry personal data —
      not merely declared in policy, so the protection capability is
      evidenced rather than asserted.
    status: draft
    control_refs:
      - control.crypto_policy_inventory@v1
      - control.cert_posture_scan@v1
      - control.key_rotation_evidence@v1
      - control.oob_channel_probe@v1
    playbook_refs:
      - playbook.crypto_posture_management@v1
      - playbook.cryptographic_controls@v1
      - playbook.mfa_secured_comms@v1
    metric_refs:
      - kri.expiring_tls_certs@v1
      - kri.overdue_key_rotations@v1
      - kri.mfa_coverage_gaps@v1
    evidence_stream_refs:
      - posture
    notes: >-
      crypto_posture_management is the primary agentic anchor.
      inventory-crypto-policy records the operator's declared
      algorithm floor, key-size floor, key-rotation cadence per key
      class, and TLS-version floor; probe-cert-posture exercises
      per-endpoint negotiated TLS version, cipher suite, certificate
      validity and chain, and mandated-extension presence against
      that floor; check-key-rotation exercises per-key last-rotation
      against the declared cadence. The dated posture-attestation
      published by evidence-capture is the audit-evident artifact
      that makes the encryption-of-personal-data capability evidenced
      rather than asserted; kri.expiring_tls_certs@v1 and
      kri.overdue_key_rotations@v1 are the GDPR-visible failure
      indicators. Per data-flow-crypto_posture_management.md §1, §2,
      §6, §8 the playbook introduces no new processing purpose
      against subject data — the cryptography-posture metadata it
      reads carries no personal data within Art. 4(1); the lawful
      basis for the underlying encryption processing lives on the
      operator's production-side workflows.

      mfa_secured_comms is the secondary agentic anchor, pinned via
      the secured-communications limb only. verify-oob-channels is
      the anchor against the operator's out-of-band
      emergency-communications channels: the per-channel
      reachability probe, the independence-path verification (OOB
      transit must not share the primary information-system network
      path), and the last-tested timestamp record are the per-window
      evidence that the secured-communications channel remains an
      encryption-protected alternate path for personal data flowing
      under emergency conditions. The dated attestation is the
      audit-evident artifact for the secured-comms half of this
      clause; per-channel deviation records flow through the
      Compliance Finding (2003) telemetry binding. The MFA-coverage
      and continuous-authentication limbs (probe-mfa-coverage,
      assess-continuous-auth) are access-control measures that
      belong under Art. 32(1)(b), not under this entry — per
      data-flow-mfa_secured_comms.md §1, §3, §4 they are
      enforcement-state and session-staleness measurements, not
      encryption-of-personal-data measures. The Art. 32(1)(b) entry
      in article-32-security-of-processing.yaml does not currently
      cite mfa_secured_comms (CORE-2 scope was fixed before the
      playbook was finalized); a future maintenance pass re-cites
      the authentication-enforcement limb there.
      kri.mfa_coverage_gaps@v1 is listed in metric_refs as the
      workflow-level metric the playbook emits; under this clause it
      is a context-bearing signal rather than a primary failure
      indicator.

      Level-of-security-appropriate-to-the-risk is operationally
      gated by the operator's risk-management policy
      (control.risk_management_policy@v1, anchored on Art. 24
      controller accountability), not by this YAML.

      Pseudonymisation as an independent technique is NOT anchored
      by a finalized playbook in this CORE slice. The framework's
      current playbook set does not operate a pseudonymisation
      transform against subject data; a future CORE follow-on card
      anchors the limb when a pseudonymisation-natured playbook
      lands. The obligation text retains the regulation's
      "pseudonymisation and encryption" framing; the playbook_refs
      list documents encryption-side coverage only.
