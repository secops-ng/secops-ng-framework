# GDPR orphan-CI assertion skip manifest.
#
# Used by `tools.lint_playbook_orphans --framework gdpr` (and the
# nightly per-framework workflow) to allow a finalized playbook to
# stay without an inbound `playbook_refs:` citation under
# `content/mappings/gdpr/` without tripping the G-02 KRI.
#
# Each entry is a deliberate, audited exclusion. The rationale is
# committed history; the SKELETON guard rejects any entry that lacks
# the two required fields. Removing a slug from this list re-arms the
# assertion against it immediately.
#
# A slug listed here MUST refer to a directory under
# `content/playbooks/` that carries a CACAO finalization marker
# (`playbook.cacao.json` or `playbook.cacao.yaml`). Listing a
# non-finalized or non-existent slug is a hard error.
#
# SKELETON state (G-02 / gdpr axis):
#
# At SKELETON time the `content/mappings/gdpr/` tree ships 22
# data-flow markdown documents and zero machine-readable per-clause
# YAML, so every currently-finalized playbook is technically a
# `gdpr-orphan`. Each entry below points at the existing
# `data-flow-<slug>.md` doc as interim coverage so the G-02 / gdpr
# KRI lands `ok` against the current snapshot while CORE follow-on
# cards author the per-clause `playbook_refs:` YAML. As a real YAML
# mapping lands for a slug, the matching skip entry below MUST be
# removed in the same PR so the orphan-CI assertion re-arms against
# regressions in the wired-up coverage.

skip:
  - slug: executive_metrics
    rationale: >-
      Reporting playbook that aggregates KPI/KRI evidence for board-
      level review; it is not the operational object of any single
      GDPR Article 5/24/25/32/33/34/35 obligation. It surfaces
      indirectly via the `metric_refs:` on each clause's mapping
      rather than via `playbook_refs:`, which is the audited
      convention for reporting playbooks across every framework.
      `content/mappings/gdpr/data-flow-executive_metrics.md` documents
      the indirect surface for this SKELETON snapshot.
  - slug: cra_srp_notify
    rationale: >-
      CRA Article 14 notification-chain playbook (single-report
      pathway to the coordinating CSIRT and ENISA). It is not the
      operational object of a standalone GDPR Article 5/32/33/34
      obligation — its GDPR surface is the record-of-processing entry
      for the notification pipeline itself, which
      `content/mappings/gdpr/data-flow-cra_srp_notify.md` already
      documents in full as the Article 30 ROPA entry and interim
      coverage. Per-clause `playbook_refs:` YAML wiring is deferred
      to a follow-on CORE card that authors the GDPR per-clause YAML
      set for notification / comms workflows; once that lands, the
      matching entry MUST be removed here in the same PR so the
      orphan-CI re-arms. Follows the `executive_metrics` precedent
      above.
