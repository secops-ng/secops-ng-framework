# GDPR orphan-CI assertion skip manifest.
#
# Used by `tools.lint_playbook_orphans --framework gdpr` (and the
# nightly per-framework workflow) to allow a finalized playbook to
# stay without an inbound `playbook_refs:` citation under
# `content/mappings/gdpr/` without tripping the G-02 KRI.
#
# Each entry is a deliberate, audited exclusion. The rationale is
# committed history; the SKELETON guard rejects any entry that lacks
# the two required fields. Removing a slug from this list re-arms the
# assertion against it immediately.
#
# A slug listed here MUST refer to a directory under
# `content/playbooks/` that carries a CACAO finalization marker
# (`playbook.cacao.json` or `playbook.cacao.yaml`). Listing a
# non-finalized or non-existent slug is a hard error.
#
# SKELETON state (G-02 / gdpr axis):
#
# At SKELETON time the `content/mappings/gdpr/` tree ships 22
# data-flow markdown documents and zero machine-readable per-clause
# YAML, so every currently-finalized playbook is technically a
# `gdpr-orphan`. Each entry below points at the existing
# `data-flow-<slug>.md` doc as interim coverage so the G-02 / gdpr
# KRI lands `ok` against the current snapshot while CORE follow-on
# cards author the per-clause `playbook_refs:` YAML. As a real YAML
# mapping lands for a slug, the matching skip entry below MUST be
# removed in the same PR so the orphan-CI assertion re-arms against
# regressions in the wired-up coverage.

skip:
  - slug: executive_metrics
    rationale: >-
      Reporting playbook that aggregates KPI/KRI evidence for board-
      level review; it is not the operational object of any single
      GDPR Article 5/24/25/32/33/34/35 obligation. It surfaces
      indirectly via the `metric_refs:` on each clause's mapping
      rather than via `playbook_refs:`, which is the audited
      convention for reporting playbooks across every framework.
      `content/mappings/gdpr/data-flow-executive_metrics.md` documents
      the indirect surface for this SKELETON snapshot.
      Batch-2 audit (G-02 close-out) reconfirms: no GDPR Art. 5(2)
      accountability or Art. 24 controller-responsibility clause in
      the current `content/mappings/gdpr/` article set warrants a
      direct `playbook_refs:` entry for `executive_metrics`. The
      metric_refs indirection is preserved (peer parallel:
      cra/article-13-2-3-risk-assessment-metrics.yaml,
      soc2/tsc-security.yaml, nist_csf/csf-core-functions.yaml all
      wire the slug as a metrics/effectiveness anchor, not a
      personal-data-processing anchor). Skip entry stands.

  - slug: dora_ict_risk_selfassess
    rationale: >-
      DORA Chapter II ICT risk management whole-Chapter operator
      self-assessment roll-up. The playbook operates on
      evidence-record identifiers, section atoms, playbook slugs,
      and attestation-record identifiers, none of which are personal
      data; there is no GDPR data-flow surface on the roll-up itself.
      The producing per-section playbooks (asset_management,
      supply_chain_security, detection_engineering, alert_triage,
      incident_management, backup_recovery, ransomware_containment,
      infra_posture_management, crypto_posture_management,
      on_call_rotation) each carry their own GDPR closure entry
      where relevant. A sibling CORE card authors the
      per-workflow GDPR data-flow document under
      `content/mappings/gdpr/data-flow-dora_ict_risk_selfassess.md`
      if a documented interaction surfaces.
      Batch-2 audit (G-02 close-out) reconfirms: no GDPR Art. 32
      (security of processing) or Art. 24 (implementation of
      measures) clause in the current `content/mappings/gdpr/` article
      set warrants a direct `playbook_refs:` entry for
      `dora_ict_risk_selfassess`. The roll-up operates on evidence-
      record identifiers, section atoms, playbook slugs, and
      attestation-record identifiers — none of which are personal
      data — and cross-pinning the DORA Chapter II whole-Chapter
      attestation onto Art. 32/24 would conflate the operational-
      readiness axis with GDPR's personal-data-processing axis. Per-
      section producing playbooks already carry their own GDPR
      surface where relevant. Skip entry stands.

  - slug: dora_tpr_management
    rationale: >-
      DORA Chapter V ICT third-party risk management contract-lifecycle
      spine (onboarding pre-contractual risk assessment under
      Art. 28(4) → Art. 30(2)/(3) clause-presence check → Art. 28
      register-of-information entry → periodic review with runtime
      supply-chain-evidence drift join → Art. 28(8) exit-strategy
      attestation). The playbook operates on provider handles,
      criticality determinations, contract references, and register-
      row identifiers, none of which are personal data; there is no
      GDPR data-flow surface on the contract-lifecycle spine itself.
      GDPR Article 28 data-processor arrangements within an ICT
      third-party contract are a distinct axis discharged by the
      sibling GDPR-axis mapping closure and audited separately;
      cross-pinning this DORA financial-entity ICT-service-provider
      surface onto GDPR Art. 28 would conflate the two obligation
      surfaces. A sibling CORE card authors the per-workflow GDPR
      data-flow document under
      `content/mappings/gdpr/data-flow-dora_tpr_management.md`
      if a documented interaction surfaces. Mirrors the
      dora_ict_risk_selfassess GDPR-axis precedent.
      Batch-2 audit (G-02 close-out) reconfirms against GDPR Art. 28
      (processor contracts) and Art. 32 (security obligations in
      processor contracts): GDPR Art. 28(1)/(3)/(9) is already
      discharged by `playbook.contractual_obligations_tracker@v1`
      wired at `gdpr:art-28-processor-contractual-obligations` in
      `content/mappings/gdpr/article-26-28-controller-processor.yaml`
      — that anchor governs the per-clause processor-obligation
      register-and-review discipline. `dora_tpr_management` operates
      one abstraction layer outside GDPR Art. 28: it discharges the
      DORA Chapter V ICT third-party financial-entity contract-
      lifecycle spine (pre-contractual risk assessment, Art. 30(2)/(3)
      clause-presence check, Art. 28 register-of-information row,
      periodic review, Art. 28(8) exit-strategy attestation) against
      legal-entity ICT service providers, and its outputs are provider
      handles, criticality determinations, contract references, and
      register-row identifiers — none of which are personal data.
      Wiring `dora_tpr_management` into GDPR Art. 28 would double-
      count the processor-contract obligation surface and conflate
      the DORA financial-entity ICT-service-provider axis with the
      GDPR controller-processor personal-data axis; the two are
      deliberately separate agentic anchors on the same contract
      artifact and file separate evidentiary requirements. Skip
      entry stands.


  - slug: ai_human_oversight
    rationale: >-
      Interim skip, same device as the SKELETON batch above: the
      playbook finalized on 2026-08-02 and crossed the 7-day grace
      window with no inbound GDPR citation.
      `content/mappings/gdpr/data-flow-ai_human_oversight.md`
      documents the data-flow surface for this snapshot. A real edge
      is warranted rather than a durable exclusion:
      `article-15-22-data-subject-rights.yaml` deliberately folds
      Art. 22 into the Art. 21 objection entry because
      `data_subject_rights` classifies and routes but does not itself
      review the underlying automated decision — this playbook's
      review surface is exactly the missing Art. 22(3)
      human-intervention anchor. Issue #916 authors the standalone
      `gdpr:art-22-automated-decisions` entry and removes this skip
      in the same PR.

  - slug: eu_ai_act_deployer_obligations
    rationale: >-
      Interim skip, same device as the SKELETON batch above: the
      playbook finalized on 2026-08-02 and crossed the 7-day grace
      window with no inbound GDPR citation.
      `content/mappings/gdpr/data-flow-eu_ai_act_deployer_obligations.md`
      documents the data-flow surface for this snapshot. A real edge
      is warranted rather than a durable exclusion: AI Act Art. 26(9)
      obliges deployers of high-risk AI systems to use the provider's
      Art. 13 information to comply with their GDPR Art. 35 DPIA
      duty, which makes the playbook's provider-documentation /
      FRIA surface the fourth limb of the existing
      `article-35-dpia.yaml` cluster. Issue #916 authors that edge
      and removes this skip in the same PR.

  - slug: soc2_evidence_collector
    rationale: >-
      SOC 2 Trust-Services-Criteria readiness roll-up. The playbook
      walks TSC criterion atoms, resolves committed evidence-record
      references, and emits a four-state readiness attestation — its
      inputs and outputs are criterion identifiers, evidence-record
      identifiers, and attestation states, none of which are personal
      data, so there is no GDPR processing surface to anchor a
      per-clause edge on. Its inbound graph is closed on its home
      axis (`content/mappings/soc2/` cites
      playbook.soc2_evidence_collector@v1). Mirrors the
      `executive_metrics` and `dora_ict_risk_selfassess` precedents
      above: attestation/roll-up playbooks anchor via their home
      framework, not via a personal-data-processing edge.
      `content/mappings/gdpr/data-flow-soc2_evidence_collector.md`
      documents the non-surface for the audit trail.
