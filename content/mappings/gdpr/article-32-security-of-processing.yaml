# GDPR — security-of-processing cluster (Art. 32).
#
# F-MAP-GDPR CORE-2: second per-clause GDPR mapping YAML after the
# CORE-1 breach-notification cluster (Art. 33 / Art. 34). Retires the
# matching seven SKELETON skip entries (cloud_misconfiguration,
# codebase_vuln_management, detection_engineering, iam_auditor,
# infra_posture_management, it_security_support_agent, vuln_intake) so
# the gdpr orphan-CI assertion re-arms against this cluster's slugs.
#
# Subsequent CORE follow-on slices wire additional finalized playbooks
# into this cluster as their data-flow docs land — backup_recovery on
# the Art. 32(1)(c) restore-availability limb, then ddos_response on
# the Art. 32(1)(c) availability-incident-response limb and
# cyber_hygiene_training on the Art. 32(1)(d) organisational-measures
# effectiveness limb (the latter two registered as part of the G-02
# grace-clock top-up addressing the freshly-finalized playbooks before
# the orphan-CI grace window expires).
#
# This file's most recent G-02 grace-clock top-up wires asset_management
# and patch_management onto the Art. 32(1)(b) limb as two new sibling
# entries — `gdpr:art-32-1-b-asset-baseline-and-inventory` (asset
# reconciliation and per-window inventory-delta evidence is the
# baseline-discovery surface the ongoing-confidentiality / integrity /
# availability obligation runs against; without it the other six
# Art. 32(1)(b) playbooks have no authoritative estate to apply their
# disciplines against) and `gdpr:art-32-1-b-maintenance-and-security-updates`
# (per-update rollout, ring-cohort canary validation, and dated
# patch-application evidence is the maintenance-and-security-updates
# limb of Art. 32(1)(b), distinct from the codebase-side
# vulnerability-handling integrity surface already anchored on
# codebase_vuln_management and vuln_intake — patch_management exercises
# the operator's deployed-estate update path rather than the
# operator's own codebase). Both anchor on Art. 32(1)(b) but
# discharge independent operational disciplines and are kept
# atom-per-obligation, mirroring the established shape of the
# Art. 32(1)(c) restore-availability / availability-incident-response
# pair below.
#
# Scope of this file:
#
#   - gdpr:art-32-1-b — ensuring the ongoing confidentiality,
#     integrity, availability, and resilience of processing systems
#     and services. Eight technical-security playbooks are agentic
#     anchors on the omnibus continuous-baseline entry:
#     cloud_misconfiguration and infra_posture_management
#     hold the cloud-posture confidentiality / integrity / baseline
#     surface; iam_auditor and it_security_support_agent hold the
#     access-control / operator-support confidentiality surface;
#     codebase_vuln_management and vuln_intake hold the
#     vulnerability-handling integrity surface against the operator's
#     own codebase and against coordinated-disclosure intake from
#     external reporters; cra_cvd holds the reporter-communication
#     and advisory-publication channel-security surface that carries
#     the coordinated-disclosure lifecycle from acknowledgement
#     through to public advisory under the integrity /
#     confidentiality-of-processing limb (Art. 32(1)(b));
#     cra_srp_notify holds the regulator-submission channel-security
#     surface that carries the CRA Article 14 notification chain
#     (early warning, 72-hour full notification, final report) to
#     the main-establishment CSIRT and ENISA through the Single
#     Reporting Platform under the same integrity /
#     confidentiality-of-processing limb. A dedicated per-event
#     agentic-threat sub-entry (`gdpr:art-32-1-b-agentic-threat-response`,
#     agentic_threat_response) anchors the machine-speed detect-
#     through-contain discipline against a fully-agentic adversary
#     — kept atom-per-obligation from the omnibus continuous-baseline
#     surface above, mirroring the Art. 32(1)(c) restore-availability
#     / availability-incident-response pair.
#
#   - gdpr:art-32-1-d — process for regularly testing, assessing, and
#     evaluating the effectiveness of technical and organisational
#     measures for ensuring the security of the processing.
#     detection_engineering is the agentic anchor that emits per-
#     rule-version effectiveness snapshots into the F-CP-06
#     effectiveness stream; infra_posture_management is anchored as
#     the periodic posture re-execution counterpart whose posture-
#     evidence ticks feed the same effectiveness loop. Both are the
#     workflow surfaces the data-flow docs explicitly carry as
#     regular-testing / evaluation outputs.
#
# Out of scope of this file (carved into later CORE slices):
#
#   - Art. 32(1)(a) pseudonymisation and encryption of personal data.
#     This limb does not yet have a finalized playbook whose data-flow
#     doc explicitly carries it as an agentic anchor and is deferred
#     to a later CORE slice. The Art. 32(1)(c) restore-availability
#     limb is anchored by this file (entry
#     gdpr:art-32-1-c-restore-availability below) now that
#     playbook.backup_recovery@v1 is finalized; the deferral the
#     SKELETON state of this file recorded is retired.
#
#   - Art. 25 data protection by design and by default. Several
#     SKELETON skip rationales (codebase_vuln_management,
#     infra_posture_management, vuln_intake) name Art. 25 as a
#     secondary axis alongside Art. 32. The Art. 25 entries are
#     authored under a sibling per-clause YAML as a dedicated CORE
#     by-design slice, not stretched into this security-of-processing
#     file.
#
#   - Art. 5(1)(f) integrity and confidentiality of processing as a
#     principle-level axis. The principle anchors the same operational
#     surface but is governed under Art. 5 / Art. 24 controller
#     accountability rather than under Art. 32 measures. The Art. 5
#     entries are authored under a sibling per-clause YAML in a later
#     CORE slice.
#
#   - The remaining eight SKELETON skip slugs (contractual_obligations_tracker,
#     executive_metrics, on_call_rotation, onboarding_offboarding_tracker,
#     phishing_triage, post_incident_review, supply_chain_security,
#     threat_intel_ingest) — each is a separate CORE follow-on card;
#     this file retires only the seven security-of-processing cluster
#     slugs in `_orphan_skip.yaml`.
#
# Cross-references:
#
#   - NIS2 parallel: content/mappings/nis2/article-21-2-a.yaml,
#     article-21-2-e.yaml, article-21-2-f.yaml, and article-21-2-i.yaml
#     pin the same playbook set against the NIS2 risk-management,
#     vulnerability-handling, effectiveness-assessment, and HR-security /
#     access-control measures. The GDPR Art. 32 security-of-processing
#     baseline and the NIS2 Art. 21(2) cybersecurity-risk-management
#     measures run against the same underlying control surface; the two
#     regimes carry separate obligations against the same operator
#     evidence.
#
#   - DORA parallel: content/mappings/dora/ entries under Art. 9 (ICT
#     risk management framework) anchor codebase_vuln_management and
#     vuln_intake on the JC RTS on ICT risk management framework
#     (Commission Delegated Regulation (EU) 2024/1774) Art. 10
#     vulnerability-management surface. Same multi-regime dependency.
#
#   - CRA parallel: Annex I essential cybersecurity requirements in
#     content/mappings/cra/article-14-and-annex-i.yaml carries the
#     codebase-side vulnerability-handling and SBOM-production surface
#     against the same playbooks.

regime: gdpr
entries:
  - id: gdpr:art-32-1-b-ongoing-confidentiality-integrity-availability
    regulation:
      name: GDPR
      instrument: Regulation (EU) 2016/679
      celex: 32016R0679
      article: "32"
      url: https://eur-lex.europa.eu/eli/reg/2016/679/oj
    obligation: >-
      Implement appropriate technical and organisational measures to
      ensure a level of security appropriate to the risk, including
      the ability to ensure the ongoing confidentiality, integrity,
      availability, and resilience of processing systems and
      services. Measures must take account of the state of the art,
      the costs of implementation, and the nature, scope, context,
      and purposes of processing, as well as the risk of varying
      likelihood and severity for the rights and freedoms of natural
      persons.
    status: draft
    control_refs:
      - control.cspm_baseline@v1
      - control.iac_policy_guardrail@v1
      - control.cloud_identity_least_privilege@v1
      - control.privileged_access_review@v1
      - control.mfa_state_probe@v1
      - control.patch_evidence@v1
      - control.sbom_capture@v1
      - control.vuln_disclosure_intake@v1
    playbook_refs:
      - playbook.cloud_misconfiguration@v1
      - playbook.codebase_vuln_management@v1
      - playbook.cra_cvd@v1
      - playbook.cra_srp_notify@v1
      # F-WF-EIDAS2-IDENTITY EXTEND: the eIDAS 2.0 EUDIW identity-
      # verification cycle is anchored on the ongoing-confidentiality
      # limb of Art. 32(1)(b). The playbook produces the dated
      # Account Change (OCSF 3001) audit-evidence record that gates
      # joiner-side capability provisioning against a cryptographically
      # verified PID credential and a resolved Level of Assurance;
      # that record is a primary ongoing-confidentiality artifact for
      # the access-management leg of the ongoing-security baseline.
      # NIS2 parallel: content/mappings/nis2/article-21-2-i.yaml
      # (access management). DORA parallel:
      # content/mappings/dora/article-5.yaml (digital-identity
      # governance).
      - playbook.eidas2_identity_verification@v1
      - playbook.iam_auditor@v1
      - playbook.infra_posture_management@v1
      - playbook.it_security_support_agent@v1
      - playbook.vuln_intake@v1
      - playbook.vulnerability_management@v1
    metric_refs:
      - kpi.cloud_posture_coverage@v1
      - kpi.mttd_cloud_misconfig@v1
      - kpi.mttr_cloud_misconfig@v1
      - kri.recurring_cloud_misconfig@v1
      - kpi.patch_disseminated_on_time@v1
      - kpi.vuln_disclosure_sla@v1
      - kri.cvd_intake_aging@v1
      - kri.releases_without_sbom@v1
    evidence_stream_refs:
      - posture
      - vulns
      - access
    notes: >-
      The eight cluster playbooks form the ongoing-security baseline
      end-to-end. cloud_misconfiguration is the reactive lane: a
      Cloud Security Posture Management finding against the
      configuration baseline is the integrity-of-processing event the
      workflow responds to, the remediation is the integrity
      restoration, and the targeted re-scan is the confirmation that
      the deviation no longer fires. infra_posture_management is the
      continuous counterpart: scheduled re-execution emits one
      posture-evidence artifact per tick
      (`schemas/evidence/posture.schema.json`, stream `posture`) so
      the ongoing-confidentiality / integrity / availability obligation
      has a durable artifact series rather than a point-in-time
      attestation. iam_auditor pins the per-execution capability
      inventory against the access evidence stream
      (`schemas/evidence/access.schema.json`) — the
      ongoing-confidentiality surface is exercised by recording which
      caller invoked a workflow against what capabilities and feeding
      the privileged-access-review cadence.
      it_security_support_agent is the operator-support counterpart
      whose ongoing-confidentiality surface is the
      least-privilege-by-default routing of operator interactions
      with the workflow inventory through the agent's auditable
      handle / rota / workload identifier vocabulary.
      codebase_vuln_management is the proactive integrity-of-
      processing lane against the operator's own codebase: the
      workflow walks the operator's SBOM against advisory feeds,
      tracks per-finding acknowledge / fix / disclose deadlines, and
      drives the patch evidence stream. vuln_intake is the reactive
      coordinated-disclosure counterpart: a reporter-disclosed
      vulnerability is the integrity-of-processing event, the intake
      workflow logs it against the disclosure-window clock and routes
      it to the operator's remediation lane. cra_cvd is the
      manufacturer-side coordinated-vulnerability-disclosure
      counterpart that operates the reporter-communication and
      advisory-publication chain: the reporter's inbound disclosure is
      the integrity-of-processing event the workflow acknowledges,
      the coordinate-disclosure envelope and the operator-hosted
      advisory-publication leg carry the operator's response back
      into the reporter-facing surface under the integrity /
      confidentiality-of-processing limb of Art. 32(1)(b), and the
      case correlation record joins the reporter-communication and
      advisory-publication milestones against the same audited
      channel-security discipline (encryption in transit, PGP-
      encrypted body where the reporter's key is available at
      intake, per content/mappings/gdpr/data-flow-cra_cvd.md §8).
      Anchored on the reporter-communication channel-security limb
      rather than on the vulnerability-handling integrity limb
      because the workflow's Art. 32(1)(b) surface is the outbound
      envelope discipline that carries the disclosure lifecycle, not
      the SBOM-walk / reporter-triage-to-remediation discipline that
      codebase_vuln_management and vuln_intake already anchor.
      cra_srp_notify is the regulator-submission counterpart: an
      upstream case handoff files the three CRA Art. 14 envelopes
      (24h early warning, 72h full notification, final report at
      14 days or 1 month per Art. 14(2)/(3)) against the Single
      Reporting Platform, simultaneously available to the main-
      establishment CSIRT and ENISA. The correlation record
      joining the three submission identifiers to the upstream
      case is the audit-evident artifact; SRP intake and operator-
      bound processor legs run under the channel-security
      discipline in data-flow-cra_srp_notify.md §4/§6. Distinct
      from cra_cvd (regulator vs reporter); primary GDPR surface
      remains Art. 30 ROPA.
      The level-of-security-
      appropriate-to-the-risk threshold under Art. 32(1) is
      operationally gated by the operator's risk-management policy
      (control.risk_management_policy@v1, anchored on Art. 24
      controller accountability rather than on this clause), not by
      this YAML — the clause records the agentic anchors against
      ongoing C/I/A; the policy holds the appropriateness
      determination.

  - id: gdpr:art-32-1-d-regular-testing-and-effectiveness
    regulation:
      name: GDPR
      instrument: Regulation (EU) 2016/679
      celex: 32016R0679
      article: "32"
      url: https://eur-lex.europa.eu/eli/reg/2016/679/oj
    obligation: >-
      Implement a process for regularly testing, assessing, and
      evaluating the effectiveness of technical and organisational
      measures for ensuring the security of the processing. The
      results of these assessments must be available as evidence
      that the security measures continue to meet the
      level-of-security-appropriate-to-the-risk threshold over time.
    status: draft
    control_refs:
      - control.control_effectiveness_test@v1
      - control.detection_coverage_evidence@v1
      - control.cspm_baseline@v1
      - control.restore_drill@v1
    playbook_refs:
      - playbook.detection_engineering@v1
      - playbook.infra_posture_management@v1
      - playbook.backup_recovery@v1
      - playbook.cyber_hygiene_training@v1
      - playbook.nis2_self_assessment@v1
      # F-WF-DORA-TLPT CORE: dora_tlpt_programme adds the threat-led-
      # penetration-testing lane of the regular-testing discipline
      # for financial entities in scope of both DORA Chapter IV and
      # GDPR Art. 32. The competent-authority-notified TLPT
      # programme's findings register + dated remediation attestation
      # are the effectiveness-evidence artifacts Art. 32(1)(d) names
      # where in-scope critical or important functions process
      # personal data.
      - playbook.dora_tlpt_programme@v1
    metric_refs:
      - kri.control_effectiveness@v1
      - kpi.detection_coverage@v1
      - kpi.false_positive_rate@v1
      - kpi.cloud_posture_coverage@v1
      - kpi.backup_integrity_pass_rate@v1
      - kpi.training_completion_rate@v1
      - kpi.phishing_sim_click_rate@v1
    evidence_stream_refs:
      - effectiveness
      - posture
    notes: >-
      detection_engineering is the primary agentic anchor for the
      regular-testing-and-effectiveness limb: its rule-lifecycle
      `propose -> review -> ship -> measure` cycle emits per-rule-
      version effectiveness snapshots shaped against
      `schemas/evidence/rule-effectiveness-snapshot.schema.json`
      into the F-CP-06 effectiveness evidence stream. The snapshots
      are the testable / archivable artifact the Art. 32(1)(d)
      obligation requires for the detection lane of the operator's
      security measures. infra_posture_management is the periodic
      posture-re-execution counterpart: each scheduled tick emits a
      posture-evidence artifact whose captured_at and retention
      fields hold the durability the effectiveness loop reads
      against, so the configuration-baseline lane of the operator's
      security measures has its own time-series surface against this
      clause. The NIS2 parallel under
      `nis2:art-21-2-f` anchors the same detection_engineering
      effectiveness surface against the NIS2 risk-management-
      effectiveness-assessment obligation; the GDPR and NIS2 regimes
      file separate evidence requirements against the same
      underlying effectiveness stream. backup_recovery is the
      periodic restore-drill counterpart whose dated attestation +
      drill-evidence record is the testable / archivable artifact
      Art. 32(1)(d) names for the backup-and-restore lane of the
      operator's security measures — the same drill discipline the
      Art. 32(1)(c) restore-availability entry below anchors as its
      primary obligation, surfaced here under the periodic-testing
      lens (NIS2 Art. 21(2)(c) and DORA Art. 12 both require the
      restore procedure to be tested periodically, not merely
      defined, and the kpi.backup_integrity_pass_rate@v1 metric is
      the cadence-evident anchor for that requirement under this
      clause). cyber_hygiene_training is the organisational-measures
      effectiveness counterpart: the per-cycle awareness and
      role-based-training programme is itself one of the
      organisational measures Art. 32(1) names, and the playbook's
      training-completion aggregate plus the phishing-simulation
      click / report-rate aggregate published into the dated
      training-attestation record is the testable / archivable
      artifact this clause requires for the organisational-measure
      lane of the operator's security measures. The NIS2 parallel
      under `nis2:art-21-2-g` and the DORA parallel under
      `dora:art-13-training-awareness` anchor the same playbook
      against their own training-and-awareness obligations; the three
      regimes carry separate evidence requirements against the same
      per-cycle training-attestation discipline. nis2_self_assessment is
      the whole-Article roll-up counterpart on the effectiveness lens:
      the playbook reads the operator's evidence store for the current
      self-assessment window, binds each collected evidence record to
      the NIS2 Art. 21(2)(a–j) sub-clause atom it discharges under the
      operator's four-bucket coverage rubric, and emits a dated
      attestation record whose durable form is the periodic
      effectiveness artifact Art. 32(1)(d) names against the
      whole-programme lens (rather than the per-detection-rule lens
      detection_engineering anchors or the per-drill lens
      backup_recovery anchors). The kri.control_effectiveness@v1
      metric this clause already lists is the workflow's primary
      metric hook, so the roll-up is atom-consistent with the clause
      it anchors against. The NIS2 parallel under
      `nis2:art-21-2-f` anchors the same roll-up against the
      NIS2-side effectiveness-assessment obligation; the GDPR and
      NIS2 regimes file separate evidence requirements against the
      same attestation record. Periodic re-assessment
      cadence and archival of results are operator-side responsibilities
      discharged by the snapshot's captured_at and retention fields
      plus the upstream control's review_cadence.

  - id: gdpr:art-32-1-c-restore-availability
    regulation:
      name: GDPR
      instrument: Regulation (EU) 2016/679
      celex: 32016R0679
      article: "32"
      url: https://eur-lex.europa.eu/eli/reg/2016/679/oj
    obligation: >-
      Implement appropriate technical and organisational measures to
      ensure the ability to restore the availability and access to
      personal data in a timely manner in the event of a physical or
      technical incident. The measure must be exercisable on the
      operator's documented recovery surface, not merely documented,
      so the restore capability is evidenced rather than asserted.
    status: draft
    control_refs:
      - control.backup_attestation@v1
      - control.restore_drill@v1
    playbook_refs:
      - playbook.backup_recovery@v1
      - playbook.business_continuity@v1
    metric_refs:
      - kpi.backup_integrity_pass_rate@v1
    evidence_stream_refs:
      - posture
    notes: >-
      backup_recovery is the agentic anchor for the
      restore-availability limb of Art. 32(1)(c). The playbook
      operates the periodic restore-drill discipline against the
      operator's documented isolated drill target: on a scheduled
      or operator-initiated drill window, it validates the integrity
      of the most recent in-scope backup artifact
      (checksum / manifest / decryption-key availability — the File
      Hashing D3-FH discipline the playbook overlay pins), executes
      a non-destructive restore against the drill target (the
      System Recovery Analysis D3-SRA discipline the playbook
      overlay pins), and emits a dated attestation + drill-evidence
      record carrying the observed RTO / RPO against the documented
      objectives. The attestation is the audit-evident artifact that
      makes the restore-availability capability evidenced rather
      than asserted; the kpi.backup_integrity_pass_rate@v1 metric
      audits per-attempt outcomes and is the GDPR-visible failure
      indicator for the clause. The drill is non-destructive by
      construction and the playbook framing is read-only-by-contract
      on the integrity check, so the discipline does not introduce a
      new processing purpose against the subject data; the lawful
      basis for the underlying backup processing lives on the
      operator's production-system data-flow entries under Art.
      32(1)(b) ongoing-availability and Art. 5(1)(e) storage
      limitation, not on this exercise playbook (see
      content/mappings/gdpr/data-flow-backup_recovery.md §2 lawful
      basis). The NIS2 parallel under `nis2:art-21-2-c`
      (business-continuity / backup-management / tested-restore-
      drills) and the DORA parallel under `dora:art-12-backup-
      restore` anchor the same playbook against their own
      regime-specific obligations; the three regimes carry separate
      evidence requirements against the same drill discipline. The
      Art. 32(1)(d) periodic-testing-and-effectiveness entry above
      additionally lists backup_recovery as a regular-testing
      counterpart, since "tested restore drills" engages both the
      restore-availability obligation (this clause) and the
      regular-testing-effectiveness obligation (the preceding
      entry). Art. 32(1)(c) restore-availability is the primary
      anchor — the obligation the drill discharges in substance —
      and Art. 32(1)(d) is the secondary anchor — the obligation
      the drill's periodic cadence and dated attestation
      additionally evidence. CRA parallel:
      `cra:annex-i-1-h-availability-restore-drill` (Annex I §1(h)
      availability, restore-drill lane) anchors the same playbook
      on the CRA side, completing the regulatory triplet.

  - id: gdpr:art-32-1-c-availability-incident-response
    regulation:
      name: GDPR
      instrument: Regulation (EU) 2016/679
      celex: 32016R0679
      article: "32"
      url: https://eur-lex.europa.eu/eli/reg/2016/679/oj
    obligation: >-
      Implement appropriate technical and organisational measures to
      ensure the ability to restore the availability and access to
      personal data in a timely manner in the event of a physical or
      technical incident — including the per-event availability-
      incident response discipline against denial-of-service and
      related availability attacks on services that may carry personal
      data. The measure must be exercisable on the operator's
      documented response surface, not merely documented, so the
      availability-defence capability is evidenced rather than
      asserted.
    status: draft
    control_refs:
      - control.incident_handling_capability@v1
    playbook_refs:
      - playbook.ddos_response@v1
    metric_refs:
      - kpi.mttr_containment@v1
    evidence_stream_refs:
      - posture
    notes: >-
      ddos_response is the agentic anchor for the per-event
      availability-incident response slice of Art. 32(1)(c). On an
      availability anomaly against a monitored service that may carry
      personal data on its production-side processing, the playbook
      classifies the attack vector against the documented vector
      taxonomy, engages the operator's pre-bound mitigation surface
      (upstream scrubbing, rate-limit / WAF posture change, or
      failover to a documented standby), validates service
      restoration against the documented availability objective, and
      emits the dated availability-incident evidence record as the
      audit-evident discharge of the per-event response. The
      kpi.mttr_containment@v1 metric audits mean-time-to-containment
      against the protected-service availability surface and is the
      GDPR-visible failure indicator for the clause's per-event slice.
      This entry is the per-event availability-incident-response
      counterpart to the restore-availability entry above
      (`gdpr:art-32-1-c-restore-availability`); both anchor on Art.
      32(1)(c) but discharge independent operational disciplines —
      the restore-availability slice operationalises the periodic
      restore-drill discipline on backup_recovery, while this slice
      operationalises the per-event detect-classify-mitigate-validate
      discharge against the availability attack surface on
      ddos_response. The two are kept atom-per-obligation rather than
      overloaded onto a single entry, mirroring the established
      shape DORA Art. 11 carries across article-11.yaml
      (`dora:art-11-response-recovery`, documented-capability +
      backup attestations) and article-11-availability-response.yaml
      (`dora:art-11-availability-response`, per-vector availability-
      response). Per content/mappings/gdpr/data-flow-ddos_response.md
      §2, the workflow itself processes no personal data — it
      operates on network-anomaly metrics, service identifiers,
      classified-vector enumerations, mitigation-action identifiers,
      and attestation records — so this clause anchors the workflow
      as an organisational measure protecting the availability
      dimension of personal-data processing on the protected service,
      not as a per-subject processing activity. The NIS2 parallel
      under `nis2:art-21-2-b` (incident-handling capability covering
      the availability/denial-of-service attack dimension) and the
      DORA parallel under `dora:art-11-availability-response` anchor
      the same playbook against their own regime-specific
      obligations; the three regimes carry separate evidence
      requirements against the same per-event availability-incident
      response discipline.

  - id: gdpr:art-32-1-b-asset-baseline-and-inventory
    regulation:
      name: GDPR
      instrument: Regulation (EU) 2016/679
      celex: 32016R0679
      article: "32"
      url: https://eur-lex.europa.eu/eli/reg/2016/679/oj
    obligation: >-
      Implement appropriate technical and organisational measures to
      ensure a level of security appropriate to the risk, including
      the ability to ensure the ongoing confidentiality, integrity,
      availability, and resilience of processing systems and services.
      Specifically, the per-window asset-management discipline that
      maintains the authoritative inventory of information and ICT
      assets, captures the delta between scheduled snapshots so that
      unmanaged or undocumented assets surface as exceptions, and
      records the dated asset-inventory-delta evidence as the
      audit-evident artifact of the baseline-discovery limb. The
      measure must be exercisable on the operator's documented
      inventory-source set, not merely documented, so the
      ongoing-baseline capability is evidenced rather than asserted.
    status: draft
    control_refs:
      - control.asset_inventory_delta@v1
    playbook_refs:
      - playbook.asset_management@v1
    metric_refs:
      - kri.asset_inventory_drift@v1
      - kpi.unmanaged_asset_cardinality@v1
    evidence_stream_refs:
      - posture
    notes: >-
      asset_management is the agentic anchor for the
      baseline-and-inventory limb of Art. 32(1)(b). On a scheduled
      reconciliation tick, the playbook ingests the operator's
      documented inventory-source set (CMDB, infrastructure-as-code
      records, cloud-provider asset APIs, endpoint-management agents),
      reconciles them into the operator-authoritative snapshot for
      the current window, computes the per-asset delta against the
      previous documented snapshot, classifies each delta against the
      operator's documented delta taxonomy (new-managed,
      unmanaged-discovered, decommissioned, baseline-drift), and emits
      the dated asset-inventory-delta evidence record as the
      audit-evident discharge of the per-window discipline. The
      baseline-and-inventory limb is the prerequisite surface the
      other Art. 32(1)(b) playbooks anchored on the
      ongoing-confidentiality-integrity-availability entry above
      operate against — without an authoritative estate snapshot the
      configuration-baseline, access-control, and
      vulnerability-handling disciplines have no scope to apply
      themselves to. The kri.asset_inventory_drift@v1 metric audits
      drift between the declared inventory and the reconciled
      observation, and kpi.unmanaged_asset_cardinality@v1 audits the
      unmanaged-asset count surfaced by the classify-delta step;
      both are GDPR-visible failure indicators for the clause's
      baseline-discovery limb. Per
      content/mappings/gdpr/data-flow-asset_management.md §2 the
      workflow itself processes no personal data — it operates on
      asset identifiers, inventory-source identifiers, snapshot
      identifiers, delta identifiers, configuration-baseline
      observations, and attestation records — so this clause anchors
      the workflow as an organisational measure protecting the
      ongoing-confidentiality / integrity / availability dimension
      of personal-data processing on the inventoried services, not
      as a per-subject processing activity. The Art. 5(2)
      accountability anchor was considered as an alternative limb
      but deferred: the data-flow doc frames the workflow as the
      per-window asset-management discipline NIS2 Art. 21(2)(i)
      requires operators to run against their documented
      inventory sources, and the Art. 32(1)(b) ongoing-baseline
      reading lines up one-to-one with that framing; the Art. 5(2)
      accountability surface is the operator's documented inventory
      architecture decision (which sources are authoritative, what
      the delta taxonomy is), not this playbook's per-window
      discharge of that architecture. The NIS2 parallel under
      `nis2:art-21-2-i` anchors the same playbook against the NIS2
      HR-security / access-control / asset-management measures; the
      two regimes carry separate evidence requirements against the
      same per-window reconciliation discipline. d3fend / sigma
      anchors are intentionally not pinned on this entry — the
      read-only posture-readiness framing (mirroring the MFA /
      CRYPTO / BCR CORE precedent) does not characterise asset
      reconciliation as a runtime countermeasure, and no defensible
      D3FEND or Sigma surface is available without misrepresenting
      it as one.

  - id: gdpr:art-32-1-b-maintenance-and-security-updates
    regulation:
      name: GDPR
      instrument: Regulation (EU) 2016/679
      celex: 32016R0679
      article: "32"
      url: https://eur-lex.europa.eu/eli/reg/2016/679/oj
    obligation: >-
      Implement appropriate technical and organisational measures to
      ensure a level of security appropriate to the risk, including
      the ability to ensure the ongoing confidentiality, integrity,
      availability, and resilience of processing systems and services.
      Specifically, the per-update maintenance discipline that
      classifies a security update against the operator's documented
      patch-criticality taxonomy, stages the rollout against the
      operator's documented deployment-ring topology, validates the
      canary ring against documented health gates, fans out to the
      remaining rings on a green canary, and records the dated
      patch-application evidence as the audit-evident artifact of
      the maintenance-and-security-updates limb. The measure must be
      exercisable on the operator's documented deployed estate, not
      merely documented, so the maintenance capability is evidenced
      rather than asserted.
    status: draft
    control_refs:
      - control.patch_evidence@v1
    playbook_refs:
      - playbook.patch_management@v1
    metric_refs:
      - kpi.patch_disseminated_on_time@v1
      - kpi.patch_rollout_success_rate@v1
      - kri.patch_rollout_overdue_exposure@v1
    evidence_stream_refs:
      - posture
    notes: >-
      patch_management is the agentic anchor for the
      maintenance-and-security-updates limb of Art. 32(1)(b). On a
      security update becoming available against a tracked package /
      image / firmware line, the playbook classifies the update
      against the operator's documented patch-criticality taxonomy
      (security-critical, security-routine, feature-only), stages
      the rollout against the operator's documented deployment-ring
      topology (test -> canary -> broad), validates the canary ring
      against documented functional-probe and aggregate
      error-rate / latency deviation thresholds, fans out to the
      remaining rings on a green canary, and emits the dated
      patch-application evidence record as the audit-evident
      discharge of the per-update rollout discipline. This entry is
      the deployed-estate counterpart to the codebase-side
      vulnerability-handling integrity surface anchored on the
      ongoing-confidentiality-integrity-availability entry above:
      codebase_vuln_management and vuln_intake operate on the
      operator's own codebase (SBOM-walk and reporter-disclosed
      intake), while patch_management operates the operator's
      deployed estate update path against advisory feeds the
      operator consumes. The kpi.patch_disseminated_on_time@v1
      metric audits timeliness against the documented criticality
      SLA, the kpi.patch_rollout_success_rate@v1 metric audits
      per-rollout outcomes across rings, and the
      kri.patch_rollout_overdue_exposure@v1 metric audits exposure
      drift on overdue rollouts; all three are GDPR-visible failure
      indicators for the clause's maintenance limb. Per
      content/mappings/gdpr/data-flow-patch_management.md §2 the
      workflow itself processes no personal data — it operates on
      deployment-inventory identifiers, advisory references,
      ring-cohort identifiers, canary-health gate observations,
      rollout-action identifiers, and attestation records — so this
      clause anchors the workflow as an organisational measure
      protecting the ongoing-integrity dimension of personal-data
      processing on the deployed services, not as a per-subject
      processing activity. The NIS2 parallel under `nis2:art-21-2-e`
      anchors the same playbook against the NIS2 security in
      acquisition, development and maintenance measures (alongside
      vuln_intake and cloud_misconfiguration); the two regimes
      carry separate evidence requirements against the same
      per-update rollout discipline. d3fend / sigma anchors are
      intentionally not pinned on this entry — the read-only
      posture-readiness framing (mirroring the MFA / CRYPTO / BCR
      CORE precedent) does not characterise per-update rollout as a
      runtime countermeasure, and no defensible D3FEND or Sigma
      surface is available without misrepresenting it as one.

  - id: gdpr:art-32-1-b-agentic-threat-response
    regulation:
      name: GDPR
      instrument: Regulation (EU) 2016/679
      celex: 32016R0679
      article: "32"
      url: https://eur-lex.europa.eu/eli/reg/2016/679/oj
    obligation: >-
      Implement appropriate technical and organisational measures to
      ensure a level of security appropriate to the risk, including
      the ability to ensure the ongoing confidentiality, integrity,
      availability, and resilience of processing systems and services.
      Specifically, the per-event detect-through-contain discipline
      against a fully-agentic adversary operating at machine-speed
      decision cadence — autonomous LLM-driven credential harvest,
      lateral movement, and encryption chains observed inside a
      sub-minute self-correction window — that classical rule-based
      triage is miscalibrated to intercept. The measure must be
      exercisable on the operator's documented identity and network-
      control surface, not merely documented, so the machine-speed
      containment capability is evidenced rather than asserted.
    status: draft
    control_refs:
      - control.incident_handling_capability@v1
    playbook_refs:
      - playbook.agentic_threat_response@v1
    metric_refs:
      - kpi.mttd_agentic_threat@v1
      - kpi.mttc_agentic_threat@v1
    evidence_stream_refs:
      - incidents
    notes: >-
      agentic_threat_response is the agentic anchor for the
      machine-speed adversary detect-through-contain slice of
      Art. 32(1)(b). On an agentic-threat indicator (anomalous LLM
      API call volume from a workload principal, rapid credential-
      enumeration burst inside a sub-minute self-correction window,
      or lateral movement across identity / network edges within
      the observed self-correction window), the playbook isolates
      the affected credential set at the operator's IdP (session
      and token revocation, IdP disable for the containment window
      — OSCAL AC-2(13), D3FEND D3-ACI + D3-AL) and severs the
      resolved lateral edge via a micro-segmentation call at the
      operator's network-controls surface (OSCAL AC-4 + SC-7,
      D3FEND D3-NI). Together these restore the ongoing-
      confidentiality and ongoing-integrity dimensions the clause
      names against the autonomous-adversary decision-cadence case
      set. The kpi.mttd_agentic_threat@v1 and
      kpi.mttc_agentic_threat@v1 metrics audit detection and
      containment latency against the machine-speed threshold and
      are the GDPR-visible failure indicators for the clause's
      per-event agentic-threat slice. This entry is the per-event
      agentic-threat-response counterpart to the
      ongoing-confidentiality-integrity-availability omnibus entry
      above (which anchors the continuous-baseline surface: cloud-
      posture, IAM, codebase / disclosure vulnerability handling,
      CVD and SRP channel security); both anchor on Art. 32(1)(b)
      but discharge independent operational disciplines — the
      omnibus entry operationalises the ongoing-baseline
      disciplines, while this slice operationalises the per-event
      detect-isolate-contain discharge against the autonomous-
      adversary surface. The two are kept atom-per-obligation
      rather than overloaded onto a single entry, mirroring the
      established shape Art. 32(1)(c) carries across
      restore-availability (backup_recovery periodic drill
      discipline) and availability-incident-response (ddos_response
      per-event discharge) above. The escalate step hands the case
      envelope off to playbook.incident_management@v1 for the
      Art. 33 regulator-notification chain (scored under
      content/mappings/gdpr/article-33-34-personal-data-breach-notification.yaml),
      so the workflow's Art. 32(1)(b) surface here is bounded to
      the detect-contain restoration of confidentiality / integrity
      and does not extend into the notification submission itself.
      Per content/mappings/gdpr/data-flow-agentic_threat_response.md
      §3, the workflow reads authentication and network-flow
      metadata plus identity attributes on the implicated principal
      — no content of personal communications, no special-category
      data on the happy path — so this clause anchors the workflow
      as a security measure protecting the confidentiality /
      integrity dimension of personal-data processing on the
      operator's identity and network surfaces. The NIS2 parallel
      under `nis2:art-21-2-b` (incident-handling capability) and
      `nis2:art-21-2-e` (security in acquisition, development and
      maintenance — the agentic-tool supply-chain surface the
      indicator-ingest step surveils) anchor the same playbook
      against their own regime-specific obligations; the two
      regimes carry separate evidence requirements against the
      same detect-contain discipline. DORA and CRA cross-regime
      anchors remain deferred per the playbook's outbound overlay
      at content/playbooks/agentic_threat_response/mappings.yaml.
