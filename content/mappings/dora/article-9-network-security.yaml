# DORA — Article 9 (Protection and Prevention), network-security slice.
# Companion to article-9-and-rts-vuln-mgmt.yaml (vulnerability and
# patch management), article-9-access-management.yaml (identity and
# access management), article-9-4-b-authentication.yaml
# (authentication), article-9-crypto.yaml (cryptography), and
# article-9-maintenance-patch-rollout.yaml (maintenance / patch
# rollout). This file covers the network-security and segmentation
# slice of the same Art. 9 protection-and-prevention obligation,
# operationalised by the JC RTS on ICT risk management framework
# (Commission Delegated Regulation (EU) 2024/1774) Article 12
# (Network security controls: segmentation, boundary protection,
# secure interconnection).
#
# Out of scope here: vulnerability and patch management (lives in
# article-9-and-rts-vuln-mgmt.yaml), access management (lives in
# article-9-access-management.yaml), authentication (lives in
# article-9-4-b-authentication.yaml), cryptography (lives in
# article-9-crypto.yaml), maintenance / patch rollout (lives in
# article-9-maintenance-patch-rollout.yaml), incident reporting
# (Art. 17–19), third-party risk (Art. 28+).
regime: dora
entries:
  - id: dora:art-9-network-security
    regulation:
      name: DORA
      instrument: Regulation (EU) 2022/2554
      celex: 32022R2554
      article: "9"
      url: https://eur-lex.europa.eu/eli/reg/2022/2554/oj
    obligation: >-
      Design, procure and implement ICT security policies,
      procedures, protocols and tools that ensure the resilience,
      continuity and availability of ICT systems — specifically the
      network-security and segmentation surface: segmentation of
      the ICT network on a documented zone-transit matrix,
      boundary-protection controls on the interfaces between
      zones, secure interconnection of internal and external
      systems, and periodic reconciliation of the declared
      segmentation policy against the observed network posture.
    status: draft
    control_refs:
      - control.network_boundary_protection@v1
    playbook_refs:
      - playbook.network_security@v1
    metric_refs: []
    evidence_stream_refs:
      - network
    notes: >-
      Level 1 anchor is DORA Art. 9 (protection and prevention);
      the operative detail is in the Level 2 RTS — Commission
      Delegated Regulation (EU) 2024/1774 (JC RTS on ICT risk
      management framework) Article 12 (network-security controls:
      segmentation, boundary protection, secure interconnection).
      This entry is the network-security counterpart to the
      vulnerability and patch management slice
      (article-9-and-rts-vuln-mgmt.yaml), the access-management
      slice (article-9-access-management.yaml), the authentication
      slice (article-9-4-b-authentication.yaml), the cryptography
      slice (article-9-crypto.yaml), and the maintenance / patch
      rollout slice (article-9-maintenance-patch-rollout.yaml).
      `playbook.network_security@v1` is the per-window reconciliation
      materialisation of the operator's declared segmentation
      policy against the observed network posture, cross-anchored
      on NIS2 under `nis2:art-21-2-e-network-security` in
      mappings/nis2/article-21-2-e.yaml. SKELETON — the CORE card
      lands the deterministic per-step primitives together with
      the deterministic control-side overlay under
      content/controls/control.network_boundary_protection@v1.yaml.
