# DORA — Article 19 major-ICT-incident reporting milestones.
# Cross-ref: research brief 2026-05-15-dora-incident-reporting.md §4.
regime: dora
entries:
  - id: dora:art-18-classification
    regulation:
      name: DORA
      instrument: Regulation (EU) 2022/2554
      celex: 32022R2554
      article: "18(1)"
      url: https://eur-lex.europa.eu/eli/reg/2022/2554/oj
    obligation: >-
      Classify ICT-related incidents and determine their impact based on
      the criteria specified in Article 18(1) and operationalised by the
      Commission Delegated Regulation (EU) 2024/1772 (seven primary
      criteria plus materiality thresholds; recurring-incident rule).
    status: draft
    control_refs:
      - control.dora_major_classifier@v1
    playbook_refs:
      - playbook.ransomware_containment@v1
      - playbook.data_exfil@v1
      - playbook.identity_compromise@v1
    metric_refs:
      - kri.incidents_classified_major@v1
    notes: >-
      Reference to the classification RTS is Commission Delegated
      Regulation (EU) 2024/1772 of 13 March 2024. The classifier is a
      deterministic rules engine (an activity), not a workflow.
      `playbook.phishing_triage@v1` is intentionally NOT listed here:
      phishing triage on its own is sub-threshold for DORA major
      classification. Its BEC and credential-harvest branches hand off
      to `playbook.identity_compromise@v1` and (where exfil follows)
      `playbook.data_exfil@v1`, both already in playbook_refs, so the
      escalation path is already covered without inflating the
      classification surface.

  - id: dora:art-19-initial-4h
    regulation:
      name: DORA
      instrument: Regulation (EU) 2022/2554
      celex: 32022R2554
      article: "19(4)(a)"
      url: https://eur-lex.europa.eu/eli/reg/2022/2554/oj
    obligation: >-
      Submit an initial notification of a major ICT-related incident to
      the competent authority within the deadlines set by the
      Commission ITS — as soon as possible, within 4 hours of
      classification as major, and no later than 24 hours from awareness.
    status: draft
    control_refs:
      - control.incident_timeline_signals@v1
      - control.dora_submission_templates@v1
    playbook_refs:
      - playbook.ransomware_containment@v1
      - playbook.data_exfil@v1
      - playbook.identity_compromise@v1
      - playbook.incident_management@v1
      - playbook.on_call_rotation@v1
    metric_refs:
      - kpi.dora_initial_4h_on_time@v1
      - kpi.mttr_critical@v1
      - kri.dora_initial_missed@v1
      - kpi.notification_sla_compliance@v1
      - kri.regulator_notification_overrun@v1
      - kpi.mttr_on_call_ack@v1
      - kpi.coverage_on_call_schedule@v1
      - kri.escalation_tier_breach@v1
    notes: >-
      Submission content shape is Commission Implementing Regulation
      (EU) 2024/2956 (ITS). The framework provides Pydantic-validated
      schemas mirroring the ITS templates; submission transport is
      operator-owned. The data_exfil CACAO playbook gates regulator
      notification through the `regulator notification threshold met?`
      decision step (if-condition--20000000-0000-4000-8000-000000000006)
      feeding the `notify regulator` action; the same gate pattern is
      reused by ransomware_containment and identity_compromise.
      On-call rotation is listed here because the 4-hour
      post-classification clock starts at the responder's first
      acknowledgement; a slow ack or an unbound roster slot delays the
      whole notification chain regardless of the submission step's own
      latency.

  - id: dora:art-19-intermediate-72h
    regulation:
      name: DORA
      instrument: Regulation (EU) 2022/2554
      celex: 32022R2554
      article: "19(4)(b)"
      url: https://eur-lex.europa.eu/eli/reg/2022/2554/oj
    obligation: >-
      Submit an intermediate report within 72 hours of classification of
      the incident as major (or earlier if regular activities have
      recovered), updating timestamps, affected functions and clients,
      indicators of compromise, and mitigation actions in flight.
    status: draft
    control_refs:
      - control.incident_timeline_signals@v1
      - control.dora_submission_templates@v1
    playbook_refs:
      - playbook.ransomware_containment@v1
      - playbook.data_exfil@v1
      - playbook.identity_compromise@v1
      - playbook.incident_management@v1
    metric_refs:
      - kpi.dora_intermediate_72h_on_time@v1
      - kpi.notification_sla_compliance@v1
      - kri.regulator_notification_overrun@v1

  - id: dora:art-19-final-one-month
    regulation:
      name: DORA
      instrument: Regulation (EU) 2022/2554
      celex: 32022R2554
      article: "19(4)(c)"
      url: https://eur-lex.europa.eu/eli/reg/2022/2554/oj
    obligation: >-
      Submit a final report no later than one month after submission of
      the intermediate report, containing the full root-cause analysis,
      final impact figures, completed remediation actions, lessons
      learned, action plan, and residual-risk statement.
    status: draft
    control_refs:
      - control.incident_timeline_signals@v1
      - control.dora_submission_templates@v1
    playbook_refs:
      - playbook.incident_management@v1
      - playbook.post_incident_review@v1
    metric_refs:
      - kpi.dora_final_on_time@v1
      - kpi.review_completion_sla@v1
      - kpi.corrective_action_close_rate@v1

  - id: dora:art-19-cyber-threat-voluntary
    regulation:
      name: DORA
      instrument: Regulation (EU) 2022/2554
      celex: 32022R2554
      article: "19(2)"
      url: https://eur-lex.europa.eu/eli/reg/2022/2554/oj
    obligation: >-
      Voluntary notification of significant cyber threats to the
      competent authority, with content shape defined by the relevant
      ESAs RTS/ITS. No mandatory clock; lighter content schema than a
      major-incident notification.
    status: draft
    control_refs:
      - control.dora_submission_templates@v1
    playbook_refs:
      - playbook.threat_intel_ingest@v1
    metric_refs: []

  - id: dora:art-18-recurring-incident
    regulation:
      name: DORA
      instrument: Regulation (EU) 2022/2554
      celex: 32022R2554
      article: "18(2)"
      url: https://eur-lex.europa.eu/eli/reg/2022/2554/oj
    obligation: >-
      Treat as a major incident any series of recurring incidents that
      share the same apparent root cause across a six-month rolling
      window and, in aggregate, exceed the materiality thresholds.
    status: draft
    control_refs:
      - control.recurring_incident_correlator@v1
    playbook_refs:
      - playbook.post_incident_review@v1
    metric_refs:
      - kri.recurring_incident_clusters@v1
      - kri.corrective_action_overdue@v1

  - id: dora:art-28-third-party-register
    regulation:
      name: DORA
      instrument: Regulation (EU) 2022/2554
      celex: 32022R2554
      article: "28"
      url: https://eur-lex.europa.eu/eli/reg/2022/2554/oj
    obligation: >-
      Maintain a register of information in relation to all contractual
      arrangements with ICT third-party service providers, including the
      function supported, criticality assessment, sub-contracting chain,
      and data-location indicators.
    status: draft
    control_refs:
      - control.supplier_inventory@v1
      - control.provider_attestation@v1
    playbook_refs:
      - playbook.contractual_obligations_tracker@v1
      - playbook.supply_chain_security@v1
      - playbook.dora_tpr_management@v1
    metric_refs:
      - kri.suppliers_attestation_stale@v1
    notes: >-
      Article 28 requires the third-party register to be maintained as
      a living artifact, not a one-shot inventory: the supplier set,
      criticality assessments, sub-contracting chains, and
      data-location indicators all drift as contracts are signed,
      amended, and terminated. Three playbooks compose against this
      surface. `playbook.contractual_obligations_tracker@v1` is the
      contract-time obligation-evidence stream — per-supplier accepted
      obligations and per-clause review cadence — and is the
      register's documentary half. `playbook.supply_chain_security@v1`
      is the orchestration spine that joins that contract-time stream
      to the runtime supply-chain-evidence stream operated by
      `playbook.threat_intel_ingest@v1` (per-execution external
      provider dependencies, SBOM correlation, supplier-attestation
      lookup); its assess-supplier-signal / record-supplier-evidence
      step pair canonicalises a raw supplier signal into the closed
      assessment block the register's criticality and re-attestation
      surface consumes, so any drift on a direct supplier the runtime
      surface flags re-enters the same register the Article anchors.
      `playbook.dora_tpr_management@v1` is the DORA Chapter V
      contract-lifecycle spine (onboarding pre-contractual risk
      assessment under Art. 28(4) → Art. 30(2)/(3) clause-presence
      check → Art. 28 register-of-information entry → periodic review
      with runtime supply-chain-evidence drift join → Art. 28(8)
      exit-strategy attestation); the register-entry step of that
      spine is the write surface that composes this atom into a
      closed operator-side lifecycle.
      control_refs and metric_refs are not extended here: the
      orchestration playbook declares only
      `control.supplier_inventory@v1` (already on this entry) and no
      additional metric_refs of its own. Convention follows
      article-10.yaml and article-9-and-rts-vuln-mgmt.yaml (inbound
      backlink + reuse of existing controls/metrics, additional
      control/metric lifts deferred to follow-on cards).
