# DORA — Article 14 (Communication), Chapter II.
# Companion to article-5.yaml, article-6.yaml, article-7.yaml,
# article-8.yaml, article-9-and-rts-vuln-mgmt.yaml, article-10.yaml,
# article-11.yaml, article-12.yaml (backup/restore), article-13.yaml
# (learning and evolving), and article-19-and-28.yaml. Out of scope for
# this file: Art.15+ digital operational resilience testing, Art.17+
# incident classification and reporting, Art.28+ third-party risk.
regime: dora
entries:
  - id: dora:art-14-crisis-communication
    regulation:
      name: DORA
      instrument: Regulation (EU) 2022/2554
      celex: 32022R2554
      article: "14"
      url: https://eur-lex.europa.eu/eli/reg/2022/2554/oj
    obligation: >-
      Have in place crisis communication plans enabling a responsible
      disclosure of, at least, major ICT-related incidents or
      vulnerabilities to clients, counterparts, and the public as
      appropriate, and implement communication policies for staff and
      external stakeholders that distinguish between those responsible
      for managing ICT-related incidents externally and internally, with
      at least one person tasked with implementing the communication
      strategy for ICT-related incidents and fulfilling the public and
      media function for that purpose.
    status: draft
    control_refs:
      - control.crisis_communication_plan@v1
    playbook_refs:
      - playbook.business_continuity@v1
      - playbook.mfa_secured_comms@v1
    metric_refs: []
    notes: >-
      Article 14 is the crisis-communication anchor for Chapter II. The
      agentic slice is the documented crisis communication plan with a
      named external-communications owner, distinct from the internal
      incident-handling chain established under Article 11.
