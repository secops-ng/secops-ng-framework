# DORA — Article 10 (Detection), Chapter II.
# Companion to article-5.yaml, article-6.yaml, article-7.yaml,
# article-8.yaml, article-9-and-rts-vuln-mgmt.yaml, article-11.yaml,
# and article-19-and-28.yaml. Articles 12–14 land in the
# EXTEND-recovery file. Out of scope for this file: Art.15+ digital
# operational resilience testing, Art.17+ incident classification and
# reporting, Art.28+ third-party risk.
regime: dora
entries:
  - id: dora:art-10-detection
    regulation:
      name: DORA
      instrument: Regulation (EU) 2022/2554
      celex: 32022R2554
      article: "10"
      url: https://eur-lex.europa.eu/eli/reg/2022/2554/oj
    obligation: >-
      Have in place mechanisms to promptly detect anomalous activities,
      including ICT network performance issues and ICT-related
      incidents, and to identify potential material single points of
      failure, with multiple layers of control, defined alert
      thresholds and criteria to trigger ICT-related incident detection
      and response processes, including automatic alert mechanisms for
      relevant staff.
    status: draft
    control_refs:
      - control.detection_coverage_evidence@v1
      - control.cspm_baseline@v1
    playbook_refs:
      - playbook.detection_engineering@v1
      - playbook.alert_triage@v1
    metric_refs:
      - kpi.detection_coverage@v1
      - kpi.mttd@v1
      - kpi.false_positive_rate@v1
      - kri.control_effectiveness@v1
    notes: >-
      Article 10 turns detection from a tooling claim into an
      evidenced control. The agentic slice is the dated detection-
      coverage attestation against the declared scope (logs, identity,
      cloud posture) plus the time-to-detect metric stream that proves
      the alerting actually fires. The rule-content side of that same
      surface — propose → review → ship → measure of detection
      content, with each shipped rule version carrying a paired
      effectiveness snapshot — is operated by
      `playbook.detection_engineering@v1`; the per-rule-version
      effectiveness snapshot is the audit-evident artifact that keeps
      the alert thresholds and criteria this Article calls for fit
      for purpose over time, and the false-positive-rate /
      control-effectiveness KRIs lifted onto this entry are the
      measurement complements of detection-coverage that the
      lifecycle's measure step emits. The paired inbound citation
      of `playbook.alert_triage@v1` closes the second half of the
      Article 10 discharge: Art. 10 pairs the "defined alert
      thresholds and criteria to trigger ICT-related incident
      detection and response processes" language with "automatic
      alert mechanisms for relevant staff", and the alert_triage
      playbook is the operational materialisation of that automatic-
      alert mechanism — deterministic ingest/enrich/suppress/
      prioritise of the alert stream the detection surface emits,
      handing work onto the priority-routed response branches
      (mirroring the NIS2 Art. 21(2)(b) inbound anchor on the same
      playbook, which pins the detect→triage stage of the
      incident-handling capability). The DORA Art. 18 major-
      classification escalation stays owned by the downstream
      typed-incident playbooks (identity_compromise,
      ransomware_containment, data_exfil) and by
      `playbook.incident_management@v1` on the reporting side —
      alert_triage is intentionally sub-threshold for Art. 18 and
      is cited here only for the Art. 10 detect-and-alert surface.
      control_refs are not extended here: the rule-lifecycle side
      already pins
      `control.control_effectiveness_test@v1` (NIST SP 800-53 CA-7)
      on its own overlay, but no populated cross-reference file
      under `content/controls/` currently lifts that id; the
      control_xref lint test enforces that gate, and lifting the
      CA-7 anchor onto this entry's `control_refs` is left to a
      follow-on card after the xref file lands. Convention follows
      article-9-and-rts-vuln-mgmt.yaml (inbound backlink + metric
      lift, control lift deferred to xref-landed follow-on).
