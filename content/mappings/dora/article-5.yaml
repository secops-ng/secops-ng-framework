# DORA — Article 5 (Governance and organisation), Chapter II.
# Companion to article-6.yaml (ICT risk-management framework),
# article-9-and-rts-vuln-mgmt.yaml (Art.9(4)(a) vulnerability and patch
# management), and article-19-and-28.yaml (Art.17–19 incident reporting
# + Art.28/30 third-party risk). Articles 7, 8, 10, 11 land in the
# follow-on CORE-systems file; Articles 12–14 land in the EXTEND-recovery
# file. Out of scope for this file: Art.15+ digital operational
# resilience testing, Art.17+ incident classification and reporting,
# Art.28+ third-party risk.
regime: dora
entries:
  - id: dora:art-5-governance
    regulation:
      name: DORA
      instrument: Regulation (EU) 2022/2554
      celex: 32022R2554
      article: "5"
      url: https://eur-lex.europa.eu/eli/reg/2022/2554/oj
    obligation: >-
      Establish an internal governance and control framework that ensures
      effective and prudent management of ICT risk, with the management
      body bearing ultimate responsibility for the ICT risk-management
      framework, setting roles and responsibilities for ICT functions,
      and approving and reviewing the framework at least annually.
    status: draft
    control_refs:
      - control.ict_risk_governance@v1
      - control.risk_management_policy@v1
    playbook_refs:
      # F-WF-EIDAS2-IDENTITY EXTEND: Art. 5(2)(a) digital-identity
      # governance is the DORA anchor for the eIDAS 2.0 EUDIW
      # identity-verification cycle. The playbook is the operational
      # discharge of the digital-identity-governance leg for
      # EUDIW-enabled principals: the dated Account Change (OCSF 3001)
      # audit-evidence record is the per-onboarding artifact the
      # management-body-approved ICT risk-management framework rests
      # on. Companion outbound entry in
      # content/playbooks/eidas2_identity_verification/mappings.yaml
      # pins the reverse edge.
      - playbook.eidas2_identity_verification@v1
      # F-MAP-DORA CORE (G-02): the nis2_art20_governance playbook
      # operates the management-body approval cycle (schedule review
      # → present posture → approve risk-management measures → log
      # governance-record evidence). DORA Art. 5(2)(b) requires the
      # management body of the financial entity to approve, oversee,
      # and be accountable for the implementation of the ICT
      # risk-management framework referred to in Art. 6(1); the same
      # four-step governance-cadence discipline discharges that
      # obligation for DORA-in-scope entities. The playbook's own
      # outbound mappings.yaml documents Art. 5(2)(b) as the DORA
      # equivalent management-body governance surface; this entry
      # closes the inbound edge under the Art. 5 governance-and-
      # organisation anchor. Overlaps NIS2 Art. 20(1) (management-
      # body approval of Art. 21 measures); the same playbook is
      # referenced from mappings/nis2/article-20.yaml.
      - playbook.nis2_art20_governance@v1
    metric_refs:
      - kri.risk_register_staleness@v1
    evidence_stream_refs:
      - risk-analysis
    notes: >-
      Most of Article 5 is governance text (board approval, role
      definitions, organisational placement of ICT risk) and lives in
      docs templates rather than workflow content. The agentic slice is
      the annual review cadence enforcement, exercised by the
      evidence-collector pattern shared with NIS2 Art.21(2)(a).
