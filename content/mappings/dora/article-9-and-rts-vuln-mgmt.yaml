# DORA — Article 9 (Protection and Prevention) anchor for vulnerability
# and patch management, operationalised by the JC RTS on ICT risk
# management framework (Commission Delegated Regulation (EU) 2024/1774)
# Article 10 (Vulnerability and patch management procedures).
# Companion to article-19-and-28.yaml; covers the inbound CVD intake and
# patch-management surface that is out of scope for Art 18/19 reporting
# and Art 28 third-party risk.
regime: dora
entries:
  - id: dora:art-9-vuln-mgmt
    regulation:
      name: DORA
      instrument: Regulation (EU) 2022/2554
      celex: 32022R2554
      article: "9(4)(a)"
      url: https://eur-lex.europa.eu/eli/reg/2022/2554/oj
    obligation: >-
      Develop, document and implement vulnerability and patch management
      procedures covering identification of vulnerabilities in ICT assets
      (including automated vulnerability scanning where appropriate),
      monitoring of third-party vendor and library disclosures and CVE
      feeds, risk-based prioritisation and remediation deadlines,
      tracking of remediation status to closure, and a patch management
      procedure including testing and rollback.
    status: draft
    control_refs:
      - control.vuln_disclosure_intake@v1
      - control.cspm_baseline@v1
      - control.iac_policy_guardrail@v1
    playbook_refs:
      - playbook.vuln_intake@v1
      - playbook.cloud_misconfiguration@v1
      - playbook.codebase_vuln_management@v1
      - playbook.vulnerability_management@v1
      - playbook.infra_posture_management@v1
    metric_refs:
      - kpi.vuln_disclosure_sla@v1
      - kri.cvd_intake_aging@v1
      - kpi.mttd_cloud_misconfig@v1
      - kpi.mttr_cloud_misconfig@v1
      - kpi.cloud_posture_coverage@v1
      - kri.recurring_cloud_misconfig@v1
      - kri.releases_without_sbom@v1
      - kri.control_effectiveness@v1
    evidence_stream_refs:
      - vulns
    notes: >-
      Level 1 anchor is DORA Art 9(4)(a) (information security policy);
      the operative detail is in the Level 2 RTS — Commission Delegated
      Regulation (EU) 2024/1774 (JC RTS on ICT risk management framework)
      Article 10 (Vulnerability and patch management procedures). This
      file follows the inline-cite convention used by
      article-19-and-28.yaml for the related Delegated/Implementing
      Regulations (2024/1772, 2024/2955, 2024/2956). Overlaps NIS2
      Art 21(2)(e) and CRA Annex I §2 / Art 14 on vulnerability handling;
      the same `playbook.vuln_intake@v1` is referenced from
      mappings/nis2/article-21-2-e.yaml and from
      mappings/cra/article-14-and-annex-i.yaml. The SBOM-driven
      codebase side of the same vulnerability and patch management
      surface is operated by `playbook.codebase_vuln_management@v1`
      (software-component inventory, scheduled scanning against
      advisory feeds, flaw remediation tracked against CVD-policy-
      derived deadlines, with `kri.releases_without_sbom@v1`
      covering the "no inventory" failure mode); the outbound side
      of that playbook already backlinks `dora:art-9-vuln-mgmt`.
      Follow-on: the OSCAL controls exercised on the codebase side
      (CM-8 software-component inventory, RA-5 vulnerability
      monitoring, SI-2 flaw remediation) are documented on the
      codebase-side mappings overlay but do not yet have populated
      cross-reference files under `content/controls/`; lifting them
      onto this entry's `control_refs` list is gated on those xref
      files landing and is left to a separate card.
      Coordinated vulnerability disclosure as an *outbound* CVD
      policy is not a DORA obligation in the way it is under CRA
      Annex I §2(5); only the inbound monitoring and triage side
      maps cleanly here.
      The continuous-posture-evidence side of the same Art. 9
      protection-and-prevention surface is operated by
      `playbook.infra_posture_management@v1` (collect → evaluate
      against the declared baseline → emit posture-evidence): each
      scheduled re-execution emits one posture-evidence artifact
      shaped per `schemas/evidence/posture.schema.json` (stream
      `posture`), with attestation state classified per
      (control_ref, scoped-resource-id) pair against the operator's
      declared control catalog. The artifact series is the
      audit-evident discharge of the configuration-baseline half of
      Art. 9(4)(a) — the per-execution attestation that the
      in-scope infrastructure remains in the protection-and-
      prevention posture the operator's declared baseline requires,
      and the partially_effective / ineffective deviation set that
      re-enters the operator's risk register feeds the same
      vulnerability-and-patch-management surface this entry anchors
      (a posture deviation that exposes a vulnerability surface
      enters the vuln-intake / patch-management lane via the
      F-CP-06 effectiveness loop). `kri.control_effectiveness@v1`
      is lifted onto this entry's `metric_refs` for that closure:
      the residual ineffective-attestation count is the measurement
      complement of the existing cloud-posture-coverage KPI that
      the posture-evidence stream emits, and is declared on the
      playbook side
      (`content/playbooks/infra_posture_management/playbook.cacao.json`
      x_secops_ng.metric_refs). control_refs are not extended here
      for this backlink: the playbook's own x_secops_ng pins
      `control.cspm_baseline@v1` (already on this entry's
      control_refs) plus `control.asset_inventory_delta@v1` and
      `control.cloud_identity_least_privilege@v1`; no populated
      cross-reference file under `content/controls/` currently
      lifts the latter two and the control_xref lint test enforces
      that gate, so the broader control lift is left to a follow-on
      card after the xref files land. Convention follows
      article-10.yaml (inbound backlink + metric lift, control lift
      deferred to xref-landed follow-on).
