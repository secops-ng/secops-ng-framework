# DORA — Article 13 (Learning and evolving), Chapter II.
# Companion to article-5.yaml, article-6.yaml, article-7.yaml,
# article-8.yaml, article-9-and-rts-vuln-mgmt.yaml, article-10.yaml,
# article-11.yaml, article-12.yaml (backup/restore), article-14.yaml
# (crisis communication), and article-19-and-28.yaml. Out of scope for
# this file: Art.15+ digital operational resilience testing, Art.17+
# incident classification and reporting, Art.28+ third-party risk.
regime: dora
entries:
  - id: dora:art-13-learning-evolving
    regulation:
      name: DORA
      instrument: Regulation (EU) 2022/2554
      celex: 32022R2554
      article: "13"
      url: https://eur-lex.europa.eu/eli/reg/2022/2554/oj
    obligation: >-
      Have in place capabilities and staff to gather information on
      vulnerabilities and cyber threats, ICT-related incidents (in
      particular cyber-attacks), and analyse their likely impacts on
      digital operational resilience; conduct post-ICT-related incident
      reviews after a major ICT-related incident disrupts core
      activities, analysing the causes of disruption and identifying
      required improvements to the ICT operations or to the ICT business
      continuity policy.
    status: draft
    control_refs:
      - control.post_incident_learning@v1
    playbook_refs: []
    metric_refs: []
    notes: >-
      Article 13 is the learning-loop anchor for Chapter II. The agentic
      slice is the post-incident-review record produced after every
      major ICT-related incident, capturing the causes of disruption and
      the required improvements that feed back into the ICT risk-
      management framework reviewed under Article 6.
