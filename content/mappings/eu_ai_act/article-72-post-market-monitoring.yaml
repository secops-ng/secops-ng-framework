# EU AI Act — Article 72 post-market monitoring by providers.
#
# Art. 72(1)-(2) require the provider of a high-risk AI system to
# establish and document a post-market monitoring system in a manner
# that is proportionate to the nature of the AI technology and the
# risks of the high-risk AI system. The post-market monitoring system
# shall actively and systematically collect, document and analyse
# relevant data on the performance of high-risk AI systems throughout
# their lifetime, and shall allow the provider to evaluate the
# continuous compliance of AI systems with the requirements set out in
# Chapter III, Section 2. Where relevant, post-market monitoring shall
# include an analysis of the interaction with other AI systems.
regime: eu_ai_act
entries:
  - id: eu_ai_act:art-72-post-market-monitoring
    regulation:
      name: EU AI Act
      instrument: Regulation (EU) 2024/1689
      celex: 32024R1689
      article: "72"
      url: https://eur-lex.europa.eu/eli/reg/2024/1689/oj
    obligation: >-
      Providers shall establish and document a post-market monitoring
      system in a manner that is proportionate to the nature of the
      AI technology and the risks of the high-risk AI system. The
      post-market monitoring system shall actively and systematically
      collect, document and analyse relevant data which may be
      provided by deployers or which may be collected through other
      sources on the performance of high-risk AI systems throughout
      their lifetime, and which allow the provider to evaluate the
      continuous compliance of AI systems with the requirements set
      out in Chapter III, Section 2.
    status: live
    control_refs:
      - control.risk_management_policy@v1
    playbook_refs:
      - playbook.eu_ai_act_risk_management@v1
    metric_refs:
      - kri.residual_risk_threshold_breach_count@v1
      - kpi.agentic_threat_detection_rate@v1
    evidence_stream_refs:
      - risk-analysis
    notes: >-
      Anchored on the monitor-post-market-signals step of the
      eu_ai_act_risk_management playbook. Post-market signals are the
      feedback loop into the Art. 9(2)(c) re-assessment iteration;
      a Detection Finding is emitted when a signal represents an
      anomaly that pushes a residual-risk observation across the
      Art. 9(5) acceptability threshold, and that Detection Finding
      is the machine-readable trigger for the next risk-assessment
      iteration. Same threshold-breach KRI as the Art. 9 anchor —
      the post-market loop and the ex-ante assessment share the
      residual-risk observation stream.
