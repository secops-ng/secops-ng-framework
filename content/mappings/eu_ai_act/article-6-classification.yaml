# EU AI Act — Article 6 high-risk AI system classification.
#
# Art. 6 defines the gate condition that makes the Chapter III (Section 2)
# obligations on providers of high-risk AI systems — Art. 9 risk-management,
# Art. 11 + Annex IV technical documentation, Art. 13 transparency, Art. 15
# accuracy / robustness / cybersecurity, Art. 43 conformity assessment,
# Art. 72 post-market monitoring — applicable. Two independent routes into
# the high-risk category are recognised:
#
#   - Art. 6(1): an AI system that is intended to be used as a safety
#     component of a product, or is itself a product, covered by the Union
#     harmonisation legislation listed in Annex II, and where the product
#     is required to undergo a third-party conformity assessment with a
#     view to the placing on the market or putting into service of that
#     product pursuant to the Annex II legislation.
#
#   - Art. 6(2): an AI system referred to in Annex III (see the sibling
#     annex-iii-use-cases.yaml file for the enumerated use-case areas).
#
# Art. 6(3)-(6) (provider derogation on the presumption of high-risk for
# Annex III systems and the Commission's delegated-act track) is complex
# policy scope and is deliberately deferred to a sibling card.
#
# Companion inbound files:
#   - annex-iii-use-cases.yaml — Annex III enumeration cited by Art. 6(2).
#   - article-9-risk-management.yaml — Art. 9 obligations gated by this
#     classification.
#   - article-11-technical-documentation.yaml — Art. 11 + Annex IV.
#   - article-13-transparency.yaml — Art. 13 transparency.
#   - article-72-post-market-monitoring.yaml — Art. 72 post-market.
regime: eu_ai_act
entries:
  - id: eu_ai_act:art-6-1-annex-ii-product-safety
    regulation:
      name: EU AI Act
      instrument: Regulation (EU) 2024/1689
      celex: 32024R1689
      article: "6(1)"
      url: https://eur-lex.europa.eu/eli/reg/2024/1689/oj
    obligation: >-
      An AI system shall be considered high-risk where both of the
      following conditions are fulfilled: the AI system is intended to
      be used as a safety component of a product, or the AI system is
      itself a product, covered by the Union harmonisation legislation
      listed in Annex II; and the product whose safety component
      pursuant to the first condition is the AI system, or the AI
      system itself as a product, is required to undergo a third-party
      conformity assessment, with a view to the placing on the market
      or putting into service of that product pursuant to the Union
      harmonisation legislation listed in Annex II.
    status: draft
    control_refs: []
    playbook_refs:
      - playbook.eu_ai_act_risk_management@v1
    metric_refs: []
    evidence_stream_refs: []
    notes: >-
      Gate condition on the identify-high-risk-AI-system step of the
      eu_ai_act_risk_management playbook. Art. 6(1) is the Annex II
      product-safety intersection route: an AI system that is a safety
      component of, or is itself, a product falling under one of the
      Annex II harmonised instruments (Machinery Regulation, Toys
      Safety Directive, In-Vitro Diagnostic Medical Devices, Radio
      Equipment Directive, Marine Equipment Directive, and the sibling
      Annex II Section A/B lists) and where the product is required
      to undergo third-party conformity assessment under that
      instrument. Downstream Art. 9 / 11 / 13 / 15 / 43 / 72 obligations
      are conditional on this classification; the classification
      itself is a deterministic content-model overlay lookup rather
      than an operational risk-management activity, so no OSCAL /
      D3FEND control anchor is pinned on this entry. Annex II
      enumeration lives on the EUR-Lex authoritative permalink of
      Regulation (EU) 2024/1689; a sibling card revisits Annex II
      per-instrument breakdown when the compiler needs an
      instrument-level enumeration surface.

  - id: eu_ai_act:art-6-2-annex-iii-standalone
    regulation:
      name: EU AI Act
      instrument: Regulation (EU) 2024/1689
      celex: 32024R1689
      article: "6(2)"
      url: https://eur-lex.europa.eu/eli/reg/2024/1689/oj
    obligation: >-
      In addition to the high-risk AI systems referred to in
      Article 6(1), AI systems referred to in Annex III shall be
      considered high-risk. The enumerated Annex III use-case areas
      are the standalone route into the high-risk category and do not
      require an Annex II product-safety intersection.
    status: draft
    control_refs: []
    playbook_refs:
      - playbook.eu_ai_act_risk_management@v1
    metric_refs: []
    evidence_stream_refs: []
    notes: >-
      Gate condition on the identify-high-risk-AI-system step of the
      eu_ai_act_risk_management playbook. Art. 6(2) is the standalone
      Annex III route: an AI system falling within one of the eight
      Annex III use-case areas (biometrics; critical infrastructure;
      education and vocational training; employment, workers'
      management and access to self-employment; access to and
      enjoyment of essential private services and essential public
      services and benefits; law enforcement; migration, asylum and
      border-control management; administration of justice and
      democratic processes) is classified high-risk irrespective of
      Annex II. The per-area enumeration is landed on the sibling
      annex-iii-use-cases.yaml file. The Art. 6(3) provider
      derogation on the Annex III presumption and the Art. 6(4)-(6)
      delegated-act track are deliberately out of scope for this
      SKELETON entry and land on a sibling card.
