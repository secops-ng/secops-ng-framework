# NIST CSF 2.0 orphan-CI assertion skip manifest.
#
# Used by `tools.lint_playbook_orphans --framework nist_csf` (and the
# nightly per-framework workflow) to allow a finalized playbook to
# stay without an inbound `playbook_refs:` citation under
# `content/mappings/nist_csf/` without tripping the assertion.
#
# Each entry is a deliberate, audited exclusion. Removing a slug
# re-arms the assertion against it immediately; an interim entry
# names the issue that owes its citation and leaves in the same PR
# that lands it.
#
# F-MAP-ORPHAN-PARITY package 2 state (armed 2026-08-15 with 8
# durable + 4 interim entries; the interim batch left with the #943
# citation PR): the 8 entries below are all durable exclusions
# against the core-functions crosswalk.

skip:
  # ── Durable exclusions ───────────────────────────────────────────
  # NIST CSF 2.0 is a cybersecurity outcomes framework; EU-statutory
  # duty ledgers and cross-regime roll-ups anchor on their home
  # regimes, and the cyber-operational surfaces beneath them are
  # carried by the 36 playbooks the crosswalk already cites. Mirrors
  # the soc2 and iso27001 manifests' precedent.

  - slug: dora_major_incident_reporting
    rationale: >-
      DORA Art. 19 financial-regulator reporting clock; incident
      response itself (RS function) anchors on the operational
      playbooks already cited. Home axis: content/mappings/dora/.

  - slug: dora_tpr_management
    rationale: >-
      DORA Ch. V third-party register lifecycle. The CSF supply-chain
      surface (GV.SC) anchors on the operational vendor playbooks
      already cited; the register duty is DORA-specific. Home axis:
      content/mappings/dora/.

  - slug: eidas2_identity_verification
    rationale: >-
      eIDAS2 wallet-verification regulatory onboarding. The CSF
      identity surface (PR.AA) anchors on the operational identity
      playbooks; the wallet regulation flow is regime-specific.

  - slug: eu_ai_act_deployer_obligations
    rationale: >-
      EU AI Act Art. 26 deployer-duty ledger; no CSF 2.0 outcome
      attests AI-Act conformity. Home axis:
      content/mappings/eu_ai_act/.

  - slug: ai_human_oversight
    rationale: >-
      EU AI Act Art. 14 / GDPR Art. 22 decision-review lifecycle.
      AI-decision oversight is not a cybersecurity outcome; the
      training surface it touches is PR.AT, carried by the training
      playbooks. Home axes: content/mappings/eu_ai_act/,
      content/mappings/gdpr/.

  - slug: nis2_art20_governance
    rationale: >-
      NIS2 Art. 20 management-approval ledger. The CSF governance
      function (GV) anchors on the policy/review playbooks already
      cited; the statutory approval duty is regime-specific. Home
      axis: content/mappings/nis2/.

  - slug: data_subject_rights
    rationale: >-
      GDPR Chapter III rights-fulfilment lifecycle. CSF 2.0 is a
      cybersecurity outcomes framework and carries no data-subject-
      rights function; the DSR inbound graph is closed on the gdpr
      axis (six per-article entries). Home axis:
      content/mappings/gdpr/.

  - slug: soc2_evidence_collector
    rationale: >-
      SOC 2 TSC readiness roll-up; anchors on its home axis
      (content/mappings/soc2/, CC4.1 — CI-verified since #932).
      Mirrors the roll-up precedent across manifests.
