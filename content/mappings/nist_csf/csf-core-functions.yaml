    control_refs:
      - control.detection_coverage_evidence@v1
      - control.cert_posture_scan@v1
      - control.cspm_baseline@v1
    playbook_refs:
      - playbook.detection_engineering@v1
      - playbook.threat_intel_ingest@v1
    notes: >-
      DE.CM is exercised by the detection-coverage evidence trail
      (which detections are live against which telemetry surfaces),
      the periodic cert / cloud-posture scans, and the
      detection-engineering playbook lifecycle.
    subcategory_entries:
      - id: DE.CM-01
        outcome: >-
          Networks and network services are monitored to find potentially
          adverse events
        playbook_refs:
          - playbook.detection_engineering@v1
          - playbook.infra_posture_management@v1
      - id: DE.CM-02
        outcome: >-
          The physical environment is monitored to find potentially adverse
          events
        gap_note: >-
          Physical-environment monitoring is operator-owned facilities work;
          not exercised by the SecOps-NG catalogue.
      - id: DE.CM-03
        outcome: >-
          Personnel activity and technology usage are monitored to find
          potentially adverse events
        playbook_refs:
          - playbook.iam_auditor@v1
          - playbook.detection_engineering@v1
      - id: DE.CM-06
        outcome: >-
          External service provider activities and services are monitored to
          find potentially adverse events
        playbook_refs:
          - playbook.supply_chain_security@v1
          - playbook.detection_engineering@v1
      - id: DE.CM-09
        outcome: >-
          Computing hardware and software, runtime environments, and their
          data are monitored to find potentially adverse events
        playbook_refs:
          - playbook.detection_engineering@v1
          - playbook.infra_posture_management@v1
          - playbook.crypto_posture_management@v1

  - id: nist_csf:de-ae-adverse-event-analysis
    regulation:
      name: NIST CSF 2.0
      instrument: NIST Cybersecurity Framework 2.0 (NIST CSWP 29)
      article: DE.AE
      url: https://doi.org/10.6028/NIST.CSWP.29
    obligation: >-
      Analyse anomalies, indicators of compromise, and other potentially
      adverse events to characterise the events and detect cybersecurity
      incidents.
    status: draft
    control_refs:
      - control.incident_timeline_signals@v1
      - control.recurring_incident_correlator@v1
    playbook_refs:
      - playbook.alert_triage@v1
      - playbook.agentic_threat_response@v1
    notes: >-
      DE.AE is the CSF 2.0 analysis-of-detected-events Category. The
      catalogue anchors exercise the alert-triage lifecycle,
      incident-timeline-signal capture, and the recurring-incident
      correlator that discharges the "characterise the events" slice.
    subcategory_entries:
      - id: DE.AE-02
        outcome: >-
          Potentially adverse events are analyzed to better understand
          associated activities
        playbook_refs:
          - playbook.alert_triage@v1
          - playbook.agentic_threat_response@v1
      - id: DE.AE-03
        outcome: >-
          Information is correlated from multiple sources
        playbook_refs:
          - playbook.alert_triage@v1
          - playbook.agentic_threat_response@v1
      - id: DE.AE-04
        outcome: >-
          The estimated impact and scope of adverse events are understood
        playbook_refs:
          - playbook.alert_triage@v1
          - playbook.incident_management@v1
      - id: DE.AE-06
        outcome: >-
          Information on adverse events is provided to authorized staff and
          tools
        playbook_refs:
          - playbook.alert_triage@v1
          - playbook.incident_management@v1
      - id: DE.AE-07
        outcome: >-
          Cyber threat intelligence and other contextual information are
          integrated into the analysis
        playbook_refs:
          - playbook.threat_intel_ingest@v1
          - playbook.alert_triage@v1
      - id: DE.AE-08
        outcome: >-
          Incidents are declared when adverse events meet the defined incident
          criteria
        playbook_refs:
          - playbook.alert_triage@v1
          - playbook.incident_management@v1

  # ─── RESPOND (RS) ─────────────────────────────────────────────

  - id: nist_csf:rs-ma-incident-management
    regulation:
      name: NIST CSF 2.0
      instrument: NIST Cybersecurity Framework 2.0 (NIST CSWP 29)
      article: RS.MA
      url: https://doi.org/10.6028/NIST.CSWP.29
    obligation: >-
      Manage responses to detected cybersecurity incidents.
    status: draft
    control_refs:
      - control.incident_handling_capability@v1
    playbook_refs:
      - playbook.incident_management@v1
    notes: >-
      RS.MA is the CSF 2.0 anchor for the incident-management
      capability itself — programmatic response, not
      technique-specific mitigation. Directly discharged by the
      incident-handling capability control and the incident-management
      playbook.
    subcategory_entries:
      - id: RS.MA-01
        outcome: >-
          The incident response plan is executed in coordination with relevant
          third parties once an incident is declared
        playbook_refs:
          - playbook.incident_management@v1
      - id: RS.MA-02
        outcome: >-
          Incident reports are triaged and validated
        playbook_refs:
          - playbook.alert_triage@v1
          - playbook.incident_management@v1
      - id: RS.MA-03
        outcome: >-
          Incidents are categorized and prioritized
        playbook_refs:
          - playbook.incident_management@v1
          - playbook.alert_triage@v1
      - id: RS.MA-04
        outcome: >-
          Incidents are escalated or elevated as needed
        playbook_refs:
          - playbook.incident_management@v1
      - id: RS.MA-05
        outcome: >-
          The criteria for initiating incident recovery are applied
        playbook_refs:
          - playbook.incident_management@v1
          - playbook.backup_recovery@v1

  - id: nist_csf:rs-an-incident-analysis
    regulation:
      name: NIST CSF 2.0
      instrument: NIST Cybersecurity Framework 2.0 (NIST CSWP 29)
      article: RS.AN
      url: https://doi.org/10.6028/NIST.CSWP.29
    obligation: >-
      Conduct analysis to ensure effective response and support recovery
      activities.
    status: draft
    control_refs:
      - control.incident_timeline_signals@v1
    playbook_refs:
      - playbook.identity_compromise@v1
      - playbook.ransomware_containment@v1
      - playbook.data_exfil@v1
    notes: >-
      RS.AN covers investigation and forensic characterisation
      during a live incident. Catalogue anchors exercise the
      technique-specific investigation playbooks (identity compromise,
      ransomware, data exfiltration) plus the timeline-signals control
      that discharges the reconstruction slice.
    subcategory_entries:
      - id: RS.AN-03
        outcome: >-
          Analysis is performed to establish what has taken place during an
          incident and the root cause of the incident
        playbook_refs:
          - playbook.identity_compromise@v1
          - playbook.ransomware_containment@v1
          - playbook.data_exfil@v1
      - id: RS.AN-06
        outcome: >-
          Actions performed during an investigation are recorded, and the
          records' integrity and provenance are preserved
        playbook_refs:
          - playbook.incident_management@v1
      - id: RS.AN-07
        outcome: >-
          Incident data and metadata are collected, and their integrity and
          provenance are preserved
        playbook_refs:
          - playbook.incident_management@v1
          - playbook.alert_triage@v1
      - id: RS.AN-08
        outcome: >-
          An incident's magnitude is estimated and validated
        playbook_refs:
          - playbook.incident_management@v1
          - playbook.alert_triage@v1

  - id: nist_csf:rs-co-incident-response-reporting-and-communication
    regulation:
      name: NIST CSF 2.0
      instrument: NIST Cybersecurity Framework 2.0 (NIST CSWP 29)
      article: RS.CO
      url: https://doi.org/10.6028/NIST.CSWP.29
    obligation: >-
      Coordinate response activities with internal and external
      stakeholders as required by laws, regulations, or policies.
    status: draft
    control_refs:
      - control.crisis_communication_plan@v1
      - control.oob_channel_probe@v1
      - control.dora_submission_templates@v1
      - control.cra_submission_templates@v1
    playbook_refs:
      - playbook.cra_srp_notify@v1
      - playbook.mfa_secured_comms@v1
    notes: >-
      RS.CO overlaps the EU statutory notification surface (NIS2
      Art. 23, DORA Art. 19, CRA Art. 14). The regime-specific
      crosswalks under content/mappings/nis2/ and dora/ remain the
      authoritative pointer for the statutory obligations; the
      catalogue anchors here carry the CSF-slice reporting artifacts.
    subcategory_entries:
      - id: RS.CO-02
        outcome: >-
          Internal and external stakeholders are notified of incidents
        playbook_refs:
          - playbook.incident_management@v1
          - playbook.cra_srp_notify@v1
          - playbook.mfa_secured_comms@v1
      - id: RS.CO-03
        outcome: >-
          Information is shared with designated internal and external
          stakeholders
        playbook_refs:
          - playbook.cra_srp_notify@v1
          - playbook.mfa_secured_comms@v1

  - id: nist_csf:rs-mi-incident-mitigation
    regulation:
      name: NIST CSF 2.0
      instrument: NIST Cybersecurity Framework 2.0 (NIST CSWP 29)
      article: RS.MI
      url: https://doi.org/10.6028/NIST.CSWP.29
    obligation: >-
      Perform activities to prevent expansion of an event and mitigate
      its effects.
    status: draft
    control_refs:
      - control.incident_handling_capability@v1
    playbook_refs:
      - playbook.ransomware_containment@v1
      - playbook.cloud_misconfiguration@v1
      - playbook.data_exfil@v1
    notes: >-
      RS.MI covers containment and eradication actions during an
      active incident. Catalogue anchors exercise the technique-
      specific containment playbooks.
    subcategory_entries:
      - id: RS.MI-01
        outcome: >-
          Incidents are contained
        playbook_refs:
          - playbook.ransomware_containment@v1
          - playbook.cloud_misconfiguration@v1
          - playbook.data_exfil@v1
      - id: RS.MI-02
        outcome: >-
          Incidents are eradicated
        playbook_refs:
          - playbook.ransomware_containment@v1
          - playbook.identity_compromise@v1
          - playbook.data_exfil@v1

  # ─── RECOVER (RC) ─────────────────────────────────────────────

  - id: nist_csf:rc-rp-incident-recovery-plan-execution
    regulation:
      name: NIST CSF 2.0
      instrument: NIST Cybersecurity Framework 2.0 (NIST CSWP 29)
      article: RC.RP
      url: https://doi.org/10.6028/NIST.CSWP.29
    obligation: >-
      Execute recovery activities to restore systems and services
      affected by cybersecurity incidents.
    status: draft
    control_refs:
      - control.restore_drill@v1
      - control.backup_attestation@v1
    playbook_refs:
      - playbook.backup_recovery@v1
      - playbook.business_continuity@v1
    notes: >-
      RC.RP is exercised by the periodic restore-drill control (the
      tested-recovery-capability slice) plus the backup-recovery and
      business-continuity playbooks (the plan-execution slice).
    subcategory_entries:
      - id: RC.RP-01
        outcome: >-
          The recovery portion of the incident response plan is executed once
          initiated from the incident response process
        playbook_refs:
          - playbook.business_continuity@v1
          - playbook.backup_recovery@v1
      - id: RC.RP-02
        outcome: >-
          Recovery actions are selected, scoped, prioritized, and performed
        playbook_refs:
          - playbook.business_continuity@v1
          - playbook.backup_recovery@v1
      - id: RC.RP-03
        outcome: >-
          The integrity of backups and other restoration assets is verified
          before using them for restoration
        playbook_refs:
          - playbook.backup_recovery@v1
      - id: RC.RP-04
        outcome: >-
          Critical mission functions and cybersecurity risk management are
          considered to establish post-incident operational norms
        playbook_refs:
          - playbook.business_continuity@v1
          - playbook.post_incident_review@v1
      - id: RC.RP-05
        outcome: >-
          The integrity of restored assets is verified, systems and services
          are restored, and normal operating status is confirmed
        playbook_refs:
          - playbook.backup_recovery@v1
          - playbook.business_continuity@v1
      - id: RC.RP-06
        outcome: >-
          The end of incident recovery is declared based on criteria, and
          incident- related documentation is completed
        playbook_refs:
          - playbook.incident_management@v1
          - playbook.post_incident_review@v1

  - id: nist_csf:rc-co-incident-recovery-communication
    regulation:
      name: NIST CSF 2.0
      instrument: NIST Cybersecurity Framework 2.0 (NIST CSWP 29)
      article: RC.CO
      url: https://doi.org/10.6028/NIST.CSWP.29
    obligation: >-
      Coordinate restoration activities with internal and external
      parties.
    status: draft
    control_refs:
      - control.crisis_communication_plan@v1
    playbook_refs:
      - playbook.business_continuity@v1
    notes: >-
      RC.CO covers the recovery-side communication surface
