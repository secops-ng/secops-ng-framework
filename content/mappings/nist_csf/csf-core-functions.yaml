# NIST Cybersecurity Framework 2.0 — Core Functions crosswalk (CORE).
#
# NIST Cybersecurity Framework 2.0 (CSF 2.0), published as NIST CSWP 29
# on 26 February 2024, restructures the CSF Core around six Functions
# (Govern, Identify, Protect, Detect, Respond, Recover), 22 Categories,
# and 106 Subcategories. This file carries one entry per Category — 22
# in total, grouped by Function in the on-disk order the CSF specifies.
# The SKELETON layer landed the 22 Category-level entries. The CORE
# layer (this file) extends each Category entry with a
# `subcategory_entries` block that carries all 106 CSF Subcategories,
# each with the outcome text (verbatim per CSWP 29) plus either
# playbook_refs (where SecOps-NG artifacts exercise the outcome) or a
# gap_note (governance / board / physical-facility outcomes discharged
# by operator-owned evidence, not by the SecOps-NG catalogue).
#
# Scope of this file: the CSF 2.0 Core at Category + Subcategory
# granularity across all six Functions. The GV Function was newly
# introduced in CSF 2.0 and subsumes the old CSF 1.1 ID.GV Category
# (governance concerns were promoted out of Identify into their own
# Function). This file reflects the 2.0 layout only; no CSF 1.1 anchors
# ship here.
#
# Regime scope caveat: CSF 2.0 is a US-origin voluntary framework
# maintained by NIST, not an EU statutory instrument. The crosswalk
# is a structural pointer against the operator's own control
# catalogue — the assertion is that the named artifacts exercise the
# Category outcomes in practice, not that they constitute a legal or
# regulator interpretation of CSF. Where a CSF Category outcome
# overlaps an EU obligation already carried by content/mappings/nis2/
# or content/mappings/dora/, those regime-specific crosswalks remain
# the authoritative pointer for the statutory surface.
#
# Coverage caveat: several Category outcomes (e.g. GV.OC organisational
# mission, GV.OV oversight of the programme by senior leadership) are
# governance obligations discharged against operator-owned artifacts
# (mission statements, board minutes, risk appetite statements) rather
# than against the SecOps-NG content catalogue directly. Those entries
# ship a partial anchor set with an explanatory gap note; the operator's
# own evidence discharges the outcome in practice.
#
# Reference: NIST CSWP 29, "The NIST Cybersecurity Framework (CSF)
# 2.0", February 26, 2024. https://doi.org/10.6028/NIST.CSWP.29

regime: nist_csf
entries:

  # ─── GOVERN (GV) ──────────────────────────────────────────────

  - id: nist_csf:gv-oc-organizational-context
    regulation:
      name: NIST CSF 2.0
      instrument: NIST Cybersecurity Framework 2.0 (NIST CSWP 29)
      article: GV.OC
      url: https://doi.org/10.6028/NIST.CSWP.29
    obligation: >-
      Understand the circumstances — mission, stakeholder expectations,
      dependencies, and legal, regulatory, and contractual requirements
      — surrounding the organisation's cybersecurity risk management
      decisions, and use that understanding to inform cybersecurity
      risk management.
    status: draft
    control_refs:
      - control.risk_management_policy@v1
      - control.ict_risk_governance@v1
    playbook_refs:
      - playbook.dora_ict_risk_selfassess@v1
      - playbook.nis2_self_assessment@v1
    notes: >-
      Organisational-mission and stakeholder-expectation surfaces
      (GV.OC-01, GV.OC-02) are operator-owned governance artifacts
      that sit upstream of the SecOps-NG catalogue. The catalogue
      anchors discharge the "understanding of legal, regulatory, and
      contractual requirements" slice (GV.OC-03) via the regulatory
      self-assessment playbooks and the risk-management policy
      surface. Dependency-mapping outcomes (GV.OC-04, GV.OC-05) are
      partially exercised via the supplier inventory captured under
      GV.SC and the asset inventory captured under ID.AM.
    subcategory_entries:
      - id: GV.OC-01
        outcome: >-
          The organizational mission is understood and informs cybersecurity
          risk management
        gap_note: >-
          Organisational-mission articulation is an operator-owned governance
          artifact upstream of the SecOps-NG catalogue; discharged by the
          operator's mission / charter documents.
      - id: GV.OC-02
        outcome: >-
          Internal and external stakeholders are understood, and their needs
          and expectations regarding cybersecurity risk management are
          understood and considered
        gap_note: >-
          Stakeholder-expectation capture (customers, regulators, board,
          staff) is operator-owned; discharged by the operator's stakeholder
          register and engagement records.
      - id: GV.OC-03
        outcome: >-
          Legal, regulatory, and contractual requirements regarding
          cybersecurity — including privacy and civil liberties obligations —
          are understood and managed
        playbook_refs:
          - playbook.dora_ict_risk_selfassess@v1
          - playbook.nis2_self_assessment@v1
          - playbook.eu_ai_act_risk_management@v1
          - playbook.data_protection_impact_assessment@v1
      - id: GV.OC-04
        outcome: >-
          Critical objectives, capabilities, and services that external
          stakeholders depend on or expect from the organization are
          understood and communicated
        playbook_refs:
          - playbook.contractual_obligations_tracker@v1
          - playbook.executive_metrics@v1
      - id: GV.OC-05
        outcome: >-
          Outcomes, capabilities, and services that the organization depends
          on are understood and communicated
        playbook_refs:
          - playbook.asset_management@v1
          - playbook.supply_chain_security@v1

  - id: nist_csf:gv-rm-risk-management-strategy
    regulation:
      name: NIST CSF 2.0
      instrument: NIST Cybersecurity Framework 2.0 (NIST CSWP 29)
      article: GV.RM
      url: https://doi.org/10.6028/NIST.CSWP.29
    obligation: >-
      Establish, communicate, and use the organisation's priorities,
      constraints, risk tolerance and risk appetite statements, and
      assumptions to support operational cybersecurity risk decisions.
    status: draft
    control_refs:
      - control.risk_management_policy@v1
      - control.ict_risk_framework_review@v1
    playbook_refs:
      - playbook.dora_ict_risk_selfassess@v1
    notes: >-
      Risk-appetite and risk-tolerance statements (GV.RM-02) are
      operator-owned board-level artifacts; the catalogue anchors
      discharge the "framework in place, reviewed on a cadence"
      slice of the Category via the ICT risk-framework review
      control and the DORA ICT-risk self-assessment playbook.
    subcategory_entries:
      - id: GV.RM-01
        outcome: >-
          Risk management objectives are established and agreed to by
          organizational stakeholders
        gap_note: >-
          Risk-management objective-setting is a board / executive artifact;
          discharged by the operator's risk-management framework document.
      - id: GV.RM-02
        outcome: >-
          Risk appetite and risk tolerance statements are established,
          communicated, and maintained
        gap_note: >-
          Risk-appetite / risk-tolerance statements are board-level artifacts;
          discharged by the operator's risk-appetite statement.
      - id: GV.RM-03
        outcome: >-
          Cybersecurity risk management activities and outcomes are included
          in enterprise risk management processes
        playbook_refs:
          - playbook.dora_ict_risk_selfassess@v1
          - playbook.executive_metrics@v1
      - id: GV.RM-04
        outcome: >-
          Strategic direction that describes appropriate risk response options
          is established and communicated
        gap_note: >-
          Strategic risk-response direction is operator-owned governance
          output; the DORA ICT-risk framework review control exercises the
          periodic-review slice.
      - id: GV.RM-05
        outcome: >-
          Lines of communication across the organization are established for
          cybersecurity risks, including risks from suppliers and other third
          parties
        playbook_refs:
          - playbook.executive_metrics@v1
          - playbook.supply_chain_security@v1
          - playbook.mfa_secured_comms@v1
      - id: GV.RM-06
        outcome: >-
          A standardized method for calculating, documenting, categorizing,
          and prioritizing cybersecurity risks is established and communicated
        playbook_refs:
          - playbook.dora_ict_risk_selfassess@v1
      - id: GV.RM-07
        outcome: >-
          Strategic opportunities (i.e., positive risks) are characterized and
          are included in organizational cybersecurity risk discussions
        gap_note: >-
          Positive-risk / opportunity characterisation is operator-owned
          strategy work; not exercised by the current catalogue.

  - id: nist_csf:gv-rr-roles-responsibilities-authorities
    regulation:
      name: NIST CSF 2.0
      instrument: NIST Cybersecurity Framework 2.0 (NIST CSWP 29)
      article: GV.RR
      url: https://doi.org/10.6028/NIST.CSWP.29
    obligation: >-
      Establish cybersecurity roles, responsibilities, and authorities
      to foster accountability, performance assessment, and continuous
      improvement.
    status: draft
    control_refs:
      - control.ict_risk_governance@v1
    playbook_refs:
      - playbook.on_call_rotation@v1
    notes: >-
      Named-owner and accountability surfaces sit primarily in the
      operator's HR and org-chart layer; the catalogue anchors
      discharge the "on-call ownership is defined and rotated" slice
      of GV.RR via the on-call rotation playbook, and the "programme
      ownership is named at governance level" slice via the ICT risk
      governance control.
    subcategory_entries:
      - id: GV.RR-01
        outcome: >-
          Organizational leadership is responsible and accountable for
          cybersecurity risk and fosters a culture that is risk-aware,
          ethical, and continually improving
        gap_note: >-
          Executive accountability for cybersecurity risk is a board /
          senior-leadership posture; discharged by the operator's governance
          charter.
      - id: GV.RR-02
        outcome: >-
          Roles, responsibilities, and authorities related to cybersecurity
          risk management are established, communicated, understood, and
          enforced
        playbook_refs:
          - playbook.on_call_rotation@v1
          - playbook.incident_management@v1
      - id: GV.RR-03
        outcome: >-
          Adequate resources are allocated commensurate with the cybersecurity
          risk strategy, roles, responsibilities, and policies
        gap_note: >-
          Resource-allocation adequacy is an operator-owned budgeting
          decision; not exercised by the catalogue directly.
      - id: GV.RR-04
        outcome: >-
          Cybersecurity is included in human resources practices
        playbook_refs:
          - playbook.onboarding_offboarding_tracker@v1
          - playbook.cyber_hygiene_training@v1

  - id: nist_csf:gv-po-policy
    regulation:
      name: NIST CSF 2.0
      instrument: NIST Cybersecurity Framework 2.0 (NIST CSWP 29)
      article: GV.PO
      url: https://doi.org/10.6028/NIST.CSWP.29
    obligation: >-
      Establish, communicate, and enforce organisational cybersecurity
      policy so that expectations are visible to the workforce and
      third parties.
    status: draft
    control_refs:
      - control.risk_management_policy@v1
      - control.crypto_policy_inventory@v1
    playbook_refs:
      - playbook.cyber_hygiene_training@v1
    notes: >-
      Policy-instrument text itself is operator-owned. The catalogue
      anchors discharge the "policy inventory is captured and
      reviewed" slice (via risk-management-policy and
      crypto-policy-inventory) and the "workforce is trained on the
      policy" slice (via the cyber-hygiene-training playbook).
    subcategory_entries:
      - id: GV.PO-01
        outcome: >-
          Policy for managing cybersecurity risks is established based on
          organizational context, cybersecurity strategy, and priorities and
          is communicated and enforced
        gap_note: >-
          Policy-instrument authoring is operator-owned; the catalogue
          exercises policy-inventory capture (risk_management_policy,
          crypto_policy_inventory controls) but not the policy text itself.
      - id: GV.PO-02
        outcome: >-
          Policy for managing cybersecurity risks is reviewed, updated,
          communicated, and enforced to reflect changes in requirements,
          threats, technology, and organizational mission
        gap_note: >-
          Policy review-and-refresh cadence is operator-owned; the catalogue
          exercises the policy-inventory surface but not the review workflow.

  - id: nist_csf:gv-ov-oversight
    regulation:
      name: NIST CSF 2.0
      instrument: NIST Cybersecurity Framework 2.0 (NIST CSWP 29)
      article: GV.OV
      url: https://doi.org/10.6028/NIST.CSWP.29
    obligation: >-
      Use the results of enterprise cybersecurity risk management
      activities and performance to inform, improve, and adjust the
      risk management strategy.
    status: draft
    control_refs:
      - control.control_effectiveness_test@v1
      - control.security_assessment@v1
    playbook_refs:
      - playbook.executive_metrics@v1
      - playbook.post_incident_review@v1
    notes: >-
      Executive-oversight of the programme is exercised via the
      executive metrics playbook (periodic reporting to the
      governance body) and the post-incident review playbook (lessons
      learned feeding programme adjustment); the catalogue anchors
      discharge the "control effectiveness is tested and evidenced"
      slice.
    subcategory_entries:
      - id: GV.OV-01
        outcome: >-
          Cybersecurity risk management strategy outcomes are reviewed to
          inform and adjust strategy and direction
        playbook_refs:
          - playbook.executive_metrics@v1
          - playbook.post_incident_review@v1
      - id: GV.OV-02
        outcome: >-
          The cybersecurity risk management strategy is reviewed and adjusted
          to ensure coverage of organizational requirements and risks
        playbook_refs:
          - playbook.executive_metrics@v1
          - playbook.dora_ict_risk_selfassess@v1
      - id: GV.OV-03
        outcome: >-
          Organizational cybersecurity risk management performance is
          evaluated and reviewed for adjustments needed
        playbook_refs:
          - playbook.executive_metrics@v1

  - id: nist_csf:gv-sc-cybersecurity-supply-chain-risk-management
    regulation:
      name: NIST CSF 2.0
      instrument: NIST Cybersecurity Framework 2.0 (NIST CSWP 29)
      article: GV.SC
      url: https://doi.org/10.6028/NIST.CSWP.29
    obligation: >-
      Identify, establish, manage, monitor, and improve cyber supply
      chain risk management processes among organisational stakeholders,
      including suppliers, partners, and service providers.
    status: draft
    control_refs:
      - control.supplier_inventory@v1
      - control.provider_attestation@v1
    playbook_refs:
      - playbook.supply_chain_security@v1
      - playbook.contractual_obligations_tracker@v1
    notes: >-
      GV.SC is the CSF 2.0 anchor for C-SCRM and consolidates the
      supply-chain outcomes previously scattered across CSF 1.1
      Categories. The catalogue anchors carry both the inventory /
      attestation surface (supplier_inventory, provider_attestation)
      and the contract-obligation-tracking surface, discharging the
      operational slice; upstream vendor selection and contract text
      remain operator-owned.
    subcategory_entries:
      - id: GV.SC-01
        outcome: >-
          A cybersecurity supply chain risk management program, strategy,
          objectives, policies, and processes are established and agreed to by
          organizational stakeholders
        playbook_refs:
          - playbook.supply_chain_security@v1
      - id: GV.SC-02
        outcome: >-
          Cybersecurity roles and responsibilities for suppliers, customers,
          and partners are established, communicated, and coordinated
          internally and externally
        playbook_refs:
          - playbook.supply_chain_security@v1
          - playbook.contractual_obligations_tracker@v1
      - id: GV.SC-03
        outcome: >-
          Cybersecurity supply chain risk management is integrated into
          cybersecurity and enterprise risk management, risk assessment, and
          improvement processes
        playbook_refs:
          - playbook.supply_chain_security@v1
          - playbook.dora_ict_risk_selfassess@v1
      - id: GV.SC-04
        outcome: >-
          Suppliers are known and prioritized by criticality
        playbook_refs:
          - playbook.supply_chain_security@v1
      - id: GV.SC-05
        outcome: >-
          Requirements to address cybersecurity risks in supply chains are
          established, prioritized, and integrated into contracts and other
          types of agreements with suppliers and other relevant third parties
        playbook_refs:
          - playbook.contractual_obligations_tracker@v1
          - playbook.supply_chain_security@v1
      - id: GV.SC-06
        outcome: >-
          Planning and due diligence are performed to reduce risks before
          entering into formal supplier or other third-party relationships
        playbook_refs:
          - playbook.supply_chain_security@v1
          - playbook.contractual_obligations_tracker@v1
      - id: GV.SC-07
        outcome: >-
          The risks posed by a supplier, their products and services, and
          other third parties are understood, recorded, prioritized, assessed,
          responded to, and monitored over the course of the relationship
        playbook_refs:
          - playbook.supply_chain_security@v1
      - id: GV.SC-08
        outcome: >-
          Relevant suppliers and other third parties are included in incident
          planning, response, and recovery activities
        playbook_refs:
          - playbook.supply_chain_security@v1
          - playbook.incident_management@v1
          - playbook.business_continuity@v1
      - id: GV.SC-09
        outcome: >-
          Supply chain security practices are integrated into cybersecurity
          and enterprise risk management programs, and their performance is
          monitored throughout the technology product and service life cycle
        playbook_refs:
          - playbook.supply_chain_security@v1
          - playbook.executive_metrics@v1
      - id: GV.SC-10
        outcome: >-
          Cybersecurity supply chain risk management plans include provisions
          for activities that occur after the conclusion of a partnership or
          service agreement
        playbook_refs:
          - playbook.contractual_obligations_tracker@v1
          - playbook.supply_chain_security@v1

  # ─── IDENTIFY (ID) ────────────────────────────────────────────

  - id: nist_csf:id-am-asset-management
    regulation:
      name: NIST CSF 2.0
      instrument: NIST Cybersecurity Framework 2.0 (NIST CSWP 29)
      article: ID.AM
      url: https://doi.org/10.6028/NIST.CSWP.29
    obligation: >-
      Identify and manage the assets — hardware, software, services,
      systems, facilities, personnel, and data — that enable the
      organisation to achieve business purposes, consistent with their
      relative importance to objectives and risk strategy.
    status: draft
    control_refs:
      - control.asset_inventory_delta@v1
      - control.sbom_capture@v1
    playbook_refs:
      - playbook.asset_management@v1
    notes: >-
      Asset-inventory ownership is a primary CSF 2.0 outcome and maps
      directly to the SecOps-NG asset-management surface. The
      hardware / software / data inventory sub-outcomes are all
      exercised by the asset-management playbook plus the
      asset-inventory delta and SBOM controls.
    subcategory_entries:
      - id: ID.AM-01
        outcome: >-
          Inventories of hardware managed by the organization are maintained
        playbook_refs:
          - playbook.asset_management@v1
      - id: ID.AM-02
        outcome: >-
          Inventories of software, services, and systems managed by the
          organization are maintained
        playbook_refs:
          - playbook.asset_management@v1
          - playbook.codebase_vuln_management@v1
      - id: ID.AM-03
        outcome: >-
          Representations of the organization's authorized network
          communication and internal and external network data flows are
          maintained
        playbook_refs:
          - playbook.asset_management@v1
          - playbook.infra_posture_management@v1
      - id: ID.AM-04
        outcome: >-
          Inventories of services provided by suppliers are maintained
        playbook_refs:
          - playbook.supply_chain_security@v1
          - playbook.asset_management@v1
      - id: ID.AM-05
        outcome: >-
          Assets are prioritized based on classification, criticality,
          resources, and impact on the mission
        playbook_refs:
          - playbook.asset_management@v1
      - id: ID.AM-07
        outcome: >-
          Inventories of data and corresponding metadata for designated data
          types are maintained
        playbook_refs:
          - playbook.asset_management@v1
          - playbook.data_protection_impact_assessment@v1
      - id: ID.AM-08
        outcome: >-
          Systems, hardware, software, services, and data are managed
          throughout their life cycles
        playbook_refs:
          - playbook.asset_management@v1
          - playbook.patch_management@v1

  - id: nist_csf:id-ra-risk-assessment
    regulation:
      name: NIST CSF 2.0
      instrument: NIST Cybersecurity Framework 2.0 (NIST CSWP 29)
      article: ID.RA
      url: https://doi.org/10.6028/NIST.CSWP.29
    obligation: >-
      Understand the cybersecurity risk to the organisation, its assets,
      and its individuals, including exposure to threats,
      vulnerabilities, likelihoods, and impacts.
    status: draft
    control_refs:
      - control.security_assessment@v1
      - control.vuln_disclosure_intake@v1
    playbook_refs:
      - playbook.threat_intel_ingest@v1
      - playbook.dora_ict_risk_selfassess@v1
      - playbook.codebase_vuln_management@v1
      - playbook.vulnerability_management@v1
    notes: >-
      ID.RA is exercised by the composite threat-intel + vulnerability
      + risk-assessment surfaces. Threat identification lands in the
      threat-intel playbook, vulnerability identification in the
      codebase-vuln-management playbook and disclosure-intake control,
      and risk aggregation in the DORA ICT-risk self-assessment.
      The playbook.vulnerability_management@v1 CACAO playbook adds the
      operational vulnerability-lifecycle spine — identification
      through remediation verification — beside the intake and
      codebase-specific surfaces.
    subcategory_entries:
      - id: ID.RA-01
        outcome: >-
          Vulnerabilities in assets are identified, validated, and recorded
        playbook_refs:
          - playbook.codebase_vuln_management@v1
          - playbook.vuln_intake@v1
          - playbook.infra_posture_management@v1
          - playbook.vulnerability_management@v1
      - id: ID.RA-02
        outcome: >-
          Cyber threat intelligence is received from information sharing
          forums and sources
        playbook_refs:
          - playbook.threat_intel_ingest@v1
      - id: ID.RA-03
        outcome: >-
          Internal and external threats to the organization are identified and
          recorded
        playbook_refs:
          - playbook.threat_intel_ingest@v1
          - playbook.dora_ict_risk_selfassess@v1
      - id: ID.RA-04
        outcome: >-
          Potential impacts and likelihoods of threats exploiting
          vulnerabilities are identified and recorded
        playbook_refs:
          - playbook.dora_ict_risk_selfassess@v1
          - playbook.threat_intel_ingest@v1
      - id: ID.RA-05
        outcome: >-
          Threats, vulnerabilities, likelihoods, and impacts are used to
          understand inherent risk and inform risk response prioritization
        playbook_refs:
          - playbook.dora_ict_risk_selfassess@v1
      - id: ID.RA-06
        outcome: >-
          Risk responses are chosen, prioritized, planned, tracked, and
          communicated
        playbook_refs:
          - playbook.dora_ict_risk_selfassess@v1
          - playbook.executive_metrics@v1
      - id: ID.RA-07
        outcome: >-
          Changes and exceptions are managed, assessed for risk impact,
          recorded, and tracked
        playbook_refs:
          - playbook.infra_posture_management@v1
          - playbook.dora_ict_risk_selfassess@v1
      - id: ID.RA-08
        outcome: >-
          Processes for receiving, analyzing, and responding to vulnerability
          disclosures are established
        playbook_refs:
          - playbook.vuln_intake@v1
          - playbook.cra_cvd@v1
      - id: ID.RA-09
        outcome: >-
          The authenticity and integrity of hardware and software are assessed
          prior to acquisition and use
        playbook_refs:
          - playbook.supply_chain_security@v1
      - id: ID.RA-10
        outcome: >-
          Critical suppliers are assessed prior to acquisition
        playbook_refs:
          - playbook.supply_chain_security@v1

  - id: nist_csf:id-im-improvement
    regulation:
      name: NIST CSF 2.0
      instrument: NIST Cybersecurity Framework 2.0 (NIST CSWP 29)
      article: ID.IM
      url: https://doi.org/10.6028/NIST.CSWP.29
    obligation: >-
      Identify improvements to organisational cybersecurity risk
      management processes, procedures, and activities across all six
      Functions of the CSF.
    status: draft
    control_refs:
      - control.post_incident_learning@v1
      - control.control_effectiveness_test@v1
    playbook_refs:
      - playbook.post_incident_review@v1
      - playbook.detection_engineering@v1
    notes: >-
      ID.IM is the CSF 2.0 continuous-improvement Category. The
      catalogue anchors discharge the "lessons learned feed the
      programme" slice via post-incident learning and review; the
      detection-engineering playbook exercises the detection-side
      improvement loop.
    subcategory_entries:
      - id: ID.IM-01
        outcome: >-
          Improvements are identified from evaluations
        playbook_refs:
          - playbook.dora_ict_risk_selfassess@v1
          - playbook.post_incident_review@v1
      - id: ID.IM-02
        outcome: >-
          Improvements are identified from security tests and exercises,
          including those done in coordination with suppliers and relevant
          third parties
        playbook_refs:
          - playbook.dora_tlpt_programme@v1
          - playbook.supply_chain_security@v1
      - id: ID.IM-03
        outcome: >-
          Improvements are identified from execution of operational processes,
          procedures, and activities
        playbook_refs:
          - playbook.post_incident_review@v1
          - playbook.detection_engineering@v1
      - id: ID.IM-04
        outcome: >-
          Incident response plans and other cybersecurity plans that affect
          operations are established, communicated, maintained, and improved
        playbook_refs:
          - playbook.incident_management@v1
          - playbook.business_continuity@v1

  # ─── PROTECT (PR) ─────────────────────────────────────────────

  - id: nist_csf:pr-aa-identity-management-authentication-and-access-control
    regulation:
      name: NIST CSF 2.0
      instrument: NIST Cybersecurity Framework 2.0 (NIST CSWP 29)
      article: PR.AA
      url: https://doi.org/10.6028/NIST.CSWP.29
    obligation: >-
      Manage access to physical and logical assets and associated
      facilities so that it is limited to authorised users, services,
      and hardware, and managed commensurate with the assessed risk of
      unauthorised access.
    status: draft
    control_refs:
      - control.access_enforcement@v1
      - control.account_management@v1
      - control.mfa_state_probe@v1
      - control.least_privilege@v1
      - control.cloud_identity_least_privilege@v1
      - control.privileged_access_review@v1
      - control.jml_evidence@v1
      - control.service_identification_authentication@v1
    playbook_refs:
      - playbook.iam_auditor@v1
      - playbook.onboarding_offboarding_tracker@v1
      - playbook.mfa_secured_comms@v1
      - playbook.it_security_support_agent@v1
    notes: >-
      PR.AA is the largest single Category by control surface. The
      catalogue anchors carry the identity / authentication /
      authorisation slice end-to-end: joiner-mover-leaver evidence,
      MFA state, least-privilege review, privileged-access review,
      service-identity authentication, and the IAM audit playbook.
      The playbook.it_security_support_agent@v1 CACAO playbook adds
      the operator-facing identity-lifecycle support surface — access
      requests, credential resets, entitlement queries — routed
      through the same JML and review artifacts.
    subcategory_entries:
      - id: PR.AA-01
        outcome: >-
          Identities and credentials for authorized users, services, and
          hardware are managed by the organization
        playbook_refs:
          - playbook.iam_auditor@v1
          - playbook.onboarding_offboarding_tracker@v1
          - playbook.it_security_support_agent@v1
      - id: PR.AA-02
        outcome: >-
          Identities are proofed and bound to credentials based on the context
          of interactions
        playbook_refs:
          - playbook.iam_auditor@v1
          - playbook.onboarding_offboarding_tracker@v1
      - id: PR.AA-03
        outcome: >-
          Users, services, and hardware are authenticated
        playbook_refs:
          - playbook.iam_auditor@v1
          - playbook.mfa_secured_comms@v1
      - id: PR.AA-04
        outcome: >-
          Identity assertions are protected, conveyed, and verified
        playbook_refs:
          - playbook.iam_auditor@v1
      - id: PR.AA-05
        outcome: >-
          Access permissions, entitlements, and authorizations are defined in
          a policy, managed, enforced, and reviewed, and incorporate the
          principles of least privilege and separation of duties
        playbook_refs:
          - playbook.iam_auditor@v1
          - playbook.onboarding_offboarding_tracker@v1
      - id: PR.AA-06
        outcome: >-
          Physical access to assets is managed, monitored, and enforced
          commensurate with risk
        gap_note: >-
          Physical-access management is operator-owned facilities work; not
          exercised by the current SecOps-NG catalogue.

  - id: nist_csf:pr-at-awareness-and-training
    regulation:
      name: NIST CSF 2.0
      instrument: NIST Cybersecurity Framework 2.0 (NIST CSWP 29)
      article: PR.AT
      url: https://doi.org/10.6028/NIST.CSWP.29
    obligation: >-
      Ensure the organisation's personnel and partners are provided
      cybersecurity awareness education and are trained to perform
      their cybersecurity-related duties consistent with related
      policies, procedures, and agreements.
    status: draft
    control_refs:
      - control.training_attestation@v1
      - control.phishing_simulation@v1
    playbook_refs:
      - playbook.cyber_hygiene_training@v1
      - playbook.phishing_triage@v1
      - playbook.security_awareness_training@v1
    notes: >-
      Training-content authoring itself is operator-owned. The
      catalogue anchors discharge the "training attendance is
      attested" and "phishing exposure is exercised in-practice"
      slices.
      The playbook.security_awareness_training@v1 CACAO playbook adds
      the awareness-campaign lifecycle slice — curriculum assignment,
      completion attestation — beside the hygiene-exercise and
      phishing-exposure discharges.
    subcategory_entries:
      - id: PR.AT-01
        outcome: >-
          Personnel are provided with awareness and training so that they
          possess the knowledge and skills to perform general tasks with
          cybersecurity risks in mind
        playbook_refs:
          - playbook.cyber_hygiene_training@v1
          - playbook.phishing_triage@v1
          - playbook.security_awareness_training@v1
      - id: PR.AT-02
        outcome: >-
          Individuals in specialized roles are provided with awareness and
          training so that they possess the knowledge and skills to perform
          relevant tasks with cybersecurity risks in mind
        playbook_refs:
          - playbook.cyber_hygiene_training@v1

  - id: nist_csf:pr-ds-data-security
    regulation:
      name: NIST CSF 2.0
      instrument: NIST Cybersecurity Framework 2.0 (NIST CSWP 29)
      article: PR.DS
      url: https://doi.org/10.6028/NIST.CSWP.29
    obligation: >-
      Manage data consistent with the organisation's risk strategy to
      protect the confidentiality, integrity, and availability of
      information.
    status: draft
    control_refs:
      - control.crypto_policy_inventory@v1
      - control.key_rotation_evidence@v1
      - control.backup_attestation@v1
    playbook_refs:
      - playbook.cryptographic_controls@v1
      - playbook.crypto_posture_management@v1
      - playbook.data_exfil@v1
    notes: >-
      PR.DS spans data-at-rest, data-in-transit, and integrity
      protections. The catalogue anchors carry the crypto surface
      (policy inventory, key rotation evidence, crypto-controls and
      posture-management playbooks) and the availability slice via
      the backup-attestation control. The data-exfil playbook covers
      the loss-prevention slice.
    subcategory_entries:
      - id: PR.DS-01
        outcome: >-
          The confidentiality, integrity, and availability of data-at-rest are
          protected
        playbook_refs:
          - playbook.cryptographic_controls@v1
          - playbook.crypto_posture_management@v1
      - id: PR.DS-02
        outcome: >-
          The confidentiality, integrity, and availability of data-in-transit
          are protected
        playbook_refs:
          - playbook.cryptographic_controls@v1
          - playbook.mfa_secured_comms@v1
      - id: PR.DS-10
        outcome: >-
          The confidentiality, integrity, and availability of data-in-use are
          protected
        playbook_refs:
          - playbook.cryptographic_controls@v1
          - playbook.data_exfil@v1
      - id: PR.DS-11
        outcome: >-
          Backups of data are created, protected, maintained, and tested
        playbook_refs:
          - playbook.backup_recovery@v1

  - id: nist_csf:pr-ps-platform-security
    regulation:
      name: NIST CSF 2.0
      instrument: NIST Cybersecurity Framework 2.0 (NIST CSWP 29)
      article: PR.PS
      url: https://doi.org/10.6028/NIST.CSWP.29
    obligation: >-
      Manage the hardware, software (firmware, operating systems,
      applications), and services of physical and virtual platforms
      consistent with the organisation's risk strategy to protect their
      confidentiality, integrity, and availability.
    status: draft
    control_refs:
      - control.configuration_settings@v1
      - control.baseline_configuration@v1
      - control.patch_evidence@v1
      - control.iac_policy_guardrail@v1
      - control.sbom_capture@v1
    playbook_refs:
      - playbook.patch_management@v1
      - playbook.infra_posture_management@v1
      - playbook.codebase_vuln_management@v1
    notes: >-
      PR.PS is the CSF 2.0 successor to the CSF 1.1
      Information-Protection-Processes-and-Procedures / Protective
      Technology grouping and now consolidates hardening,
      patching, and secure-development outcomes. Catalogue anchors
      exercise baseline configuration, patch evidence, IaC policy
      guardrails, SBOM capture, and the patch / infra-posture
      playbooks.
    subcategory_entries:
      - id: PR.PS-01
        outcome: >-
          Configuration management practices are established and applied
        playbook_refs:
          - playbook.infra_posture_management@v1
          - playbook.cloud_misconfiguration@v1
      - id: PR.PS-02
        outcome: >-
          Software is maintained, replaced, and removed commensurate with risk
        playbook_refs:
          - playbook.patch_management@v1
          - playbook.codebase_vuln_management@v1
      - id: PR.PS-03
        outcome: >-
          Hardware is maintained, replaced, and removed commensurate with risk
        playbook_refs:
          - playbook.asset_management@v1
          - playbook.patch_management@v1
      - id: PR.PS-04
        outcome: >-
          Log records are generated and made available for continuous
          monitoring
        playbook_refs:
          - playbook.detection_engineering@v1
          - playbook.alert_triage@v1
      - id: PR.PS-05
        outcome: >-
          Installation and execution of unauthorized software are prevented
        playbook_refs:
          - playbook.infra_posture_management@v1
          - playbook.asset_management@v1
      - id: PR.PS-06
        outcome: >-
          Secure software development practices are integrated, and their
          performance is monitored throughout the software development life
          cycle
        playbook_refs:
          - playbook.codebase_vuln_management@v1
          - playbook.cra_cvd@v1

  - id: nist_csf:pr-ir-technology-infrastructure-resilience
    regulation:
      name: NIST CSF 2.0
      instrument: NIST Cybersecurity Framework 2.0 (NIST CSWP 29)
      article: PR.IR
      url: https://doi.org/10.6028/NIST.CSWP.29
    obligation: >-
      Manage security architectures with the organisation's risk
      strategy to protect asset confidentiality, integrity, and
      availability and organisational resilience.
    status: draft
    control_refs:
      - control.cspm_baseline@v1
      - control.backup_attestation@v1
      - control.restore_drill@v1
    playbook_refs:
      - playbook.business_continuity@v1
      - playbook.backup_recovery@v1
      - playbook.cloud_misconfiguration@v1
      - playbook.ddos_response@v1
      - playbook.network_security@v1
    notes: >-
      PR.IR is new in CSF 2.0 and consolidates resilience-of-
      infrastructure outcomes. Catalogue anchors exercise the
      cloud-posture baseline (segmentation and network-boundary
      controls), the backup + restore-drill surface (recovery
      capacity), and DDoS response.
      The playbook.network_security@v1 CACAO playbook adds the
      network-boundary and segmentation-verification discharge to the
      resilience surface, beside the availability-attack response
      playbook.ddos_response@v1 already cited.
    subcategory_entries:
      - id: PR.IR-01
        outcome: >-
          Networks and environments are protected from unauthorized logical
          access and usage
        playbook_refs:
          - playbook.infra_posture_management@v1
          - playbook.cloud_misconfiguration@v1
          - playbook.network_security@v1
      - id: PR.IR-02
        outcome: >-
          The organization's technology assets are protected from
          environmental threats
        gap_note: >-
          Environmental protection of physical assets (fire, flood, power) is
          operator-owned facilities work; not exercised by the SecOps-NG
          catalogue.
      - id: PR.IR-03
        outcome: >-
          Mechanisms are implemented to achieve resilience requirements in
          normal and adverse situations
        playbook_refs:
          - playbook.business_continuity@v1
          - playbook.ddos_response@v1
      - id: PR.IR-04
        outcome: >-
          Adequate resource capacity to ensure availability is maintained
        playbook_refs:
          - playbook.business_continuity@v1
          - playbook.backup_recovery@v1

  # ─── DETECT (DE) ──────────────────────────────────────────────

  - id: nist_csf:de-cm-continuous-monitoring
    regulation:
      name: NIST CSF 2.0
      instrument: NIST Cybersecurity Framework 2.0 (NIST CSWP 29)
      article: DE.CM
      url: https://doi.org/10.6028/NIST.CSWP.29
    obligation: >-
      Monitor assets to find anomalies, indicators of compromise, and
      other potentially adverse events.
