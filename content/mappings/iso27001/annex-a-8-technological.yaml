    # downstream operational discharge on the code-vulnerability
    # side sits under A.8.8 via
    # playbook.codebase_vuln_management@v1 and on the supply-
    # chain intake side is anchored by the operator's supplier-
    # inventory and provider-attestation controls.
    notes: >-
      A.8.30 is the outsourced-development anchor within the
      Annex A.8 theme — the standard requires that outsourced
      development be directed, monitored, and reviewed against
      security requirements. `control.sbom_capture@v1` already
      carries A.8.30 on its `oscal_refs` block: SBOM capture is
      the concrete provenance-and-composition artifact the
      operator holds outsourced developers against so the software
      delivered can be reasoned about downstream (against A.8.8
      technical vulnerabilities, against A.8.19 software
      installation, against the operator's own supplier
      attestation trail, and against the CRA Annex I §2 SBOM
      obligation for products with digital elements). The
      remaining outsourced-development discipline (the contractual
      shape, the acceptance-gate exercise, the right-to-audit
      posture) sits in the operator's supplier-management surface
      joined against the secure-SDLC umbrella anchored under
      A.8.25 and the security-testing anchor under A.8.29.
      Cross-regime parallels: NIS2 Art. 21(2)(d) (supply-chain
      security) and Art. 21(2)(e) (security in acquisition and
