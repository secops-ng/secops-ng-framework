# ISO/IEC 27001:2022 — Annex A.8 Technological controls.
#
# First entries against the Annex A.8 technological-controls theme.
# Annex A.8 in the 2022 revision covers thirty-four controls (A.8.1
# through A.8.34), the largest of the four themes: user endpoint
# devices, privileged access, information-access restriction, source-
# code access, secure authentication, capacity management, malware
# protection, technical vulnerability management, configuration
# management, information deletion, data masking, data-leakage
# prevention, backup, redundancy, logging, monitoring, clock
# synchronisation, privileged-utility programs, installation of
# software, network security, network-services security, segregation
# of networks, web filtering, cryptography, secure development
# lifecycle, application-security requirements, secure system
# architecture and engineering, secure coding, security testing in
# development and acceptance, outsourced development, separation of
# environments, change management, test information, and protection
# of information systems during audit testing.
#
# Scope of this file: Annex A.8 technological controls. This entry
# pair (A.8.1 user endpoint devices and A.8.2 privileged access
# rights) opens the theme file following the crosswalk conventions
# set by annex-a-5-organisational.yaml, annex-a-6-people.yaml, and
# The A.8.3–A.8.7 batch (information-access
# restriction, source-code access, secure authentication, capacity
# management, malware protection) lands here alongside the opener,
# followed by the A.8.8–A.8.12 batch (technical-vulnerability
# management, configuration management, information deletion, data
# masking, data-leakage prevention).
# The remaining A.8 controls (A.8.13 through A.8.34) land as sibling
# entries in this file on subsequent cards.
#
# Coverage caveat: A.8 is the largest Annex A theme (34 controls);
# this first-entries card lands two entries to establish the file
# and the schema pattern. Many downstream A.8 controls already have
# direct anchors in the SecOps-NG control catalogue under
# content/controls/ (see e.g. A.8.5 → control.mfa_state_probe /
# service_identification_authentication, A.8.8 → patch_evidence /
# vuln_disclosure_intake, A.8.9 → configuration_settings /
# baseline_configuration / iac_policy_guardrail / cspm_baseline,
# A.8.13 → backup_attestation / restore_drill, A.8.16 →
# detection_coverage_evidence, A.8.24 → crypto_policy_inventory /
# cert_posture_scan / key_rotation_evidence, A.8.30 → sbom_capture,
# A.8.32 → iac_policy_guardrail); those wire-ups land on subsequent
# cards as sibling entries in this file, one control at a time to
# keep review surfaces bounded.
#
# Regime scope caveat: ISO/IEC 27001:2022 is a certifiable
# information-security management standard, not an EU statutory
# instrument. The crosswalk is a structural pointer against the
# operator's own conformance evidence — the assertion here is that
# the named artifacts exercise the operator-side obligation, not
# that they constitute a legal interpretation of the standard.

regime: iso27001
entries:
  - id: iso27001:a-8-1-user-endpoint-devices
    regulation:
      name: ISO/IEC 27001:2022
      instrument: ISO/IEC 27001:2022 Annex A
      article: A.8.1
      url: https://www.iso.org/standard/27001
    obligation: >-
      Protect information stored on, processed by, or accessible via
      user endpoint devices. The operator must define a topic-specific
      policy for user endpoint devices (laptops, mobiles, tablets,
      remote-access clients), and support it with configuration,
      protection, and usage measures proportionate to the sensitivity
      of the information the devices handle and the risk of loss or
      compromise off-premises.
    status: draft
    control_refs: []
    # control_refs intentionally empty: the SecOps-NG control catalogue
    # is currently scoped to logical / cyber controls at the workflow-
    # and identity-plane layer and does not yet carry an endpoint-
    # device posture / MDM-attestation artifact. A.8.1 is discharged
    # against the operator's own endpoint-management evidence (MDM /
    # UEM enrolment status, disk-encryption posture, endpoint-
    # protection agent state, patch state on the endpoint fleet). A
    # future control (e.g. control.endpoint_posture@v1) would replace
    # this placeholder without changing the entry id; the endpoint-
    # side vulnerability / patch discipline that A.8.1 partially
    # depends on is separately anchored under A.8.8 via
    # control.patch_evidence@v1 (landing as a sibling entry on a
    # subsequent card).
    notes: >-
      A.8.1 is the endpoint-device obligation for the whole Annex A.8
      theme — the standard requires that user endpoint devices sit
      inside a topic-specific policy backed by configuration and
      protection measures proportionate to the information they
      handle. The obligation spans device configuration baselines,
      disk encryption, endpoint-protection tooling, remote-wipe and
      loss-handling procedures, and BYOD arrangements where present.
      The SecOps-NG control catalogue does not yet carry an endpoint-
      device posture artifact (see coverage note in the file header),
      so this entry ships with empty control_refs; the operator's
      own endpoint-management evidence (MDM/UEM posture, disk-
      encryption state, endpoint-protection agent state) carries the
      obligation. Cross-regime parallels: NIS2 Art. 21(2)(i)
      (access-control policies) reaches endpoint enrolment as the
      access-plane precondition; DORA Art. 9 (ICT protection) covers
      endpoint hardening under the JC RTS ICT risk-management
      framework; the regimes carry separate evidence requirements
      against the same underlying endpoint-management artifact.
  - id: iso27001:a-8-2-privileged-access-rights
    regulation:
      name: ISO/IEC 27001:2022
      instrument: ISO/IEC 27001:2022 Annex A
      article: A.8.2
      url: https://www.iso.org/standard/27001
    obligation: >-
      Restrict and manage the allocation and use of privileged access
      rights. Privileged accounts and elevated entitlements must be
      granted on a documented, least-privilege basis, separated from
      standard user identities where practicable, logged, reviewed
      on a declared cadence, and recertified or revoked when the
      justifying role or task changes.
    status: draft
    control_refs:
      - control.privileged_access_review@v1
      - control.account_management@v1
      - control.least_privilege@v1
    playbook_refs:
      - playbook.iam_auditor@v1
    notes: >-
      A.8.2 is the privileged-access anchor for the Annex A.8 theme —
      the standard requires that elevated entitlements be allocated
      on a least-privilege basis, separated from standard identities
      where practicable, reviewed on a declared cadence, and
      recertified or revoked when the justifying role or task
      changes. control.privileged_access_review@v1 is the direct
      anchor — its oscal_refs block already carries ISO/IEC
      27001:2022 A.8.2 alongside NIST 800-53 rev5 AC-2(7)
      (Privileged User Accounts) and AC-6(7) (Review of User
      Privileges), and its periodic-review discipline is exactly
      the recertification cadence A.8.2 requires.
      control.account_management@v1 (NIST AC-2, also carrying A.8.2)
      anchors the account-lifecycle side, and control.least_privilege@v1
      (NIST AC-6, also carrying A.8.2) anchors the allocation-basis
      side. The playbook.iam_auditor@v1 CACAO playbook is the
      operational discharge of the continuous-access-attestation
      slice: per-execution caller-identity resolution and closed-
      capability enumeration emit one access-evidence artifact per
      execution against schemas/evidence/access.schema.json, which
      the operator's IAM-review function joins against the intended
      grant set. Cross-regime parallels: NIS2 Art. 21(2)(i)
      (access-control policies) covers the same privileged-access
      discipline; DORA Art. 9(4)(c) (access management) operationalised
      by the JC RTS Arts. 20–22 (Commission Delegated Regulation (EU)
      2024/1774) covers the need-to-know, need-to-use, least-privilege
      allocation basis; the regimes carry separate evidence
      requirements against the same underlying privileged-access
      artifact.
  - id: iso27001:a-8-3-information-access-restriction
    regulation:
      name: ISO/IEC 27001:2022
      instrument: ISO/IEC 27001:2022 Annex A
      article: A.8.3
      url: https://www.iso.org/standard/27001
    obligation: >-
      Restrict access to information and other associated assets in
      accordance with the established topic-specific policy on access
      control. Access must be limited to authorised individuals and
      systems, mediated against a policy decision point, and
      re-evaluated whenever the underlying authorisation state
      changes.
    status: draft
    control_refs:
      - control.access_enforcement@v1
      - control.least_privilege@v1
    playbook_refs:
      - playbook.iam_auditor@v1
    notes: >-
      A.8.3 is the information-access-restriction anchor for the
      Annex A.8 theme — the standard requires that logical access to
      information and associated assets be mediated against the
      operator's access-control policy on a least-privilege basis.
      control.access_enforcement@v1 is the direct anchor: its
      oscal_refs block already carries ISO/IEC 27001:2022 A.8.3
      alongside NIST 800-53 rev5 AC-3 (Access Enforcement) and NIS2
      Art. 21(2)(i) (access-control policies), and the mediation
      discipline it encodes (every request checked against a policy
      decision point before resources are served) is exactly the
      information-access-restriction obligation A.8.3 requires.
      control.least_privilege@v1 (NIST AC-6, also carrying A.8.2 and
      A.5.15) anchors the allocation-basis side — access restricted
      to the minimum entitlements needed for the role or task.
      playbook.iam_auditor@v1 is the operational discharge:
      per-execution caller-identity resolution and closed-capability
      enumeration emit access-evidence artifacts the operator's
      IAM-review function joins against the intended grant set.
      Cross-regime parallels: NIS2 Art. 21(2)(i) (access-control
      policies) covers the same restriction discipline; DORA
      Art. 9(4)(c) (access management) operationalised by the JC RTS
      Arts. 20–22 (Commission Delegated Regulation (EU) 2024/1774)
      covers the need-to-know / need-to-use basis; the regimes carry
      separate evidence requirements against the same underlying
      access-mediation artifact.
  - id: iso27001:a-8-4-access-to-source-code
    regulation:
      name: ISO/IEC 27001:2022
      instrument: ISO/IEC 27001:2022 Annex A
      article: A.8.4
      url: https://www.iso.org/standard/27001
    obligation: >-
      Manage read and write access to source code, development tools,
      and software libraries. Access must be restricted, changes
      must be reviewed and traceable, and the development-tool chain
      itself must be treated as an in-scope asset — not an
      unmanaged surface.
    status: draft
    control_refs: []
    # control_refs intentionally empty: the SecOps-NG control catalogue
    # does not yet carry a dedicated source-code access / change-review
    # artifact. A.8.4 is discharged in practice today against the
    # operator's own version-control access matrix (branch protection,
    # required-review rules, signed-commit posture), CI/CD pipeline
    # role bindings, and artifact-registry entitlements. A future
    # control (e.g. control.source_code_access@v1 or a
    # change-management artifact) would replace this placeholder
    # without changing the entry id; the code-scanning /
    # vulnerability side of the development chain is separately
    # anchored under A.8.8 via control.patch_evidence@v1 and
    # control.vuln_disclosure_intake@v1 (landing as sibling entries
    # on a subsequent card).
    notes: >-
      A.8.4 is the source-code and development-tool access anchor
      within the Annex A.8 theme — the standard treats the
      code-and-toolchain surface as an in-scope asset that must be
      access-managed, change-reviewed, and traceable. The SecOps-NG
      control catalogue does not yet carry a dedicated
      source-code-access artifact (see the placeholder note above);
      the obligation is discharged in practice against the operator's
      own version-control access matrix (branch protection,
      required-review rules, signed-commit posture), CI/CD pipeline
      role bindings, artifact-registry entitlements, and the
      code-review discipline that produces those artefacts. The
      codebase-vuln-management playbook family already covers the
      vulnerability side of the same toolchain; the access-management
      side lands under a future dedicated control artifact.
      Cross-regime parallels: NIS2 Art. 21(2)(e) (security in
      network and information systems acquisition, development, and
      maintenance) covers the development-lifecycle access
      discipline; DORA Art. 9(2) (ICT protection and prevention)
      reaches source-code access through the JC RTS ICT
      risk-management framework; the regimes carry separate evidence
      requirements against the same underlying access-management
      artifact.
  - id: iso27001:a-8-5-secure-authentication
    regulation:
      name: ISO/IEC 27001:2022
      instrument: ISO/IEC 27001:2022 Annex A
      article: A.8.5
      url: https://www.iso.org/standard/27001
    obligation: >-
      Implement secure authentication technologies and procedures.
      Authentication must be proportionate to the sensitivity of the
      resource, use multi-factor mechanisms where required by risk,
      protect authentication information in transit and at rest, and
      apply equivalent discipline to service-to-service
      authentication as to user authentication.
    status: draft
    control_refs:
      - control.mfa_state_probe@v1
      - control.service_identification_authentication@v1
    playbook_refs:
      - playbook.mfa_secured_comms@v1
    notes: >-
      A.8.5 is the secure-authentication anchor for the Annex A.8
      theme — the standard requires that authentication mechanisms
      be proportionate to the sensitivity of the resource, that
      multi-factor be used where risk demands, and that
      service-to-service authentication carry equivalent discipline
      to user authentication. control.mfa_state_probe@v1 is the
      direct anchor for the user-authentication side: its
      oscal_refs block already carries ISO/IEC 27001:2022 A.8.5
      alongside NIST 800-53 rev5 IA-2(1) / IA-2(2) (Multi-factor
      Authentication to Privileged / Non-privileged Accounts) and
      NIS2 Art. 21(2)(j) (multi-factor or continuous authentication).
      control.service_identification_authentication@v1 is the direct
      anchor for the service-to-service side: its oscal_refs block
      carries ISO/IEC 27001:2022 A.8.5 alongside NIST 800-53 rev5
      IA-9 (Service Identification and Authentication) and IA-5
      (Authenticator Management). playbook.mfa_secured_comms@v1 is
      the operational discharge — the CACAO playbook that exercises
      MFA-secured communication paths and emits the evidence the
      operator's authentication-posture review function joins
      against. Cross-regime parallels: NIS2 Art. 21(2)(j) (MFA /
      continuous authentication) reaches the same
      authentication-strength obligation; DORA Art. 9(4)(b)
      (authentication mechanisms) operationalised by the JC RTS
      (Commission Delegated Regulation (EU) 2024/1774) carries the
      strong-authentication requirement for ICT assets; the regimes
      carry separate evidence requirements against the same
      underlying authentication artifact.
  - id: iso27001:a-8-6-capacity-management
    regulation:
      name: ISO/IEC 27001:2022
      instrument: ISO/IEC 27001:2022 Annex A
      article: A.8.6
      url: https://www.iso.org/standard/27001
    obligation: >-
      Monitor and adjust the use of resources in line with current
      and projected capacity requirements. Capacity must be planned
      against the operator's availability requirements, monitored
      through performance measures, and forecast for anticipated
      growth so that saturation-induced outages are prevented rather
      than reacted to.
    status: draft
    control_refs: []
    # control_refs intentionally empty: the SecOps-NG control catalogue
    # does not yet carry a dedicated capacity-management /
    # resource-monitoring artifact. A.8.6 is discharged in practice
    # today against the operator's own observability stack (resource
    # utilisation dashboards, autoscaling policies, SLO burn-rate
    # alerts) and the availability-side of the ICT service portfolio.
    # A future control (e.g. control.capacity_monitoring@v1 or an
    # availability / SLO-management artifact) would replace this
    # placeholder without changing the entry id; the backup-and-
    # restore side of availability is separately anchored under
    # A.8.13 via control.backup_attestation@v1 /
    # control.restore_drill@v1 (landing as sibling entries on a
    # subsequent card).
    notes: >-
      A.8.6 is the capacity-management anchor within the Annex A.8
      theme — the standard treats resource saturation as an
      availability-risk surface that must be forecast and monitored
      rather than reacted to. The SecOps-NG control catalogue does
      not yet carry a dedicated capacity-management artifact (see
      the placeholder note above); the obligation is discharged in
      practice against the operator's own observability stack
      (resource-utilisation dashboards, autoscaling policies, SLO
      burn-rate alerts, capacity-planning reviews). Cross-regime
      parallels: NIS2 Art. 21(2)(c) (business continuity — backup
      management, disaster recovery, crisis management) reaches
      capacity planning as an availability precondition; DORA
      Art. 9(3) (ICT protection — including availability,
      authenticity, integrity, confidentiality) covers
      capacity-management under the JC RTS ICT risk-management
      framework; the regimes carry separate evidence requirements
      against the same underlying capacity artifact.
  - id: iso27001:a-8-7-protection-against-malware
    regulation:
      name: ISO/IEC 27001:2022
      instrument: ISO/IEC 27001:2022 Annex A
      article: A.8.7
      url: https://www.iso.org/standard/27001
    obligation: >-
      Implement protection against malware, supported by appropriate
      user awareness. Detection, prevention, and recovery controls
      against malicious code must cover endpoints, servers, email,
      web traffic, and removable media where applicable, and must
      be kept current against evolving threat intelligence.
    status: draft
    control_refs: []
    # control_refs intentionally empty: the SecOps-NG control catalogue
    # does not yet carry a dedicated anti-malware / endpoint-
    # protection artifact. A.8.7 is discharged in practice today
    # against the operator's own endpoint-protection agents (EDR /
    # EPP posture and detection state), email-gateway malware
    # scanning, web-proxy malware scanning, and removable-media
    # controls where the deployment surface includes them. The
    # threat-intelligence ingest side that feeds those tools is
    # anchored under playbook.threat_intel_ingest@v1 (already an
    # A.5.6 anchor); a future dedicated endpoint-protection control
    # artifact (e.g. control.endpoint_malware_protection@v1) would
    # replace this placeholder without changing the entry id.
    notes: >-
      A.8.7 is the malware-protection anchor within the Annex A.8
      theme — the standard requires detection, prevention, and
      recovery controls against malicious code across the endpoint /
      server / email / web / removable-media surface, kept current
      against evolving threat intelligence and supported by user
      awareness. The SecOps-NG control catalogue does not yet carry
      a dedicated anti-malware artifact (see the placeholder note
      above); the obligation is discharged in practice against the
      operator's own endpoint-protection agents, gateway-side
      scanning, and removable-media controls, with
      playbook.threat_intel_ingest@v1 already exercising the
      threat-intelligence ingest slice that feeds those tools. The
      user-awareness side is separately anchored under A.6.3 via
      control.training_attestation@v1 and the cyber-hygiene training
      playbook. Cross-regime parallels: NIS2 Art. 21(2)(g) (basic
      cyber hygiene practices and cybersecurity training) reaches
      the awareness side; DORA Art. 9(2) (ICT protection and
      prevention) reaches endpoint-side malware protection through
      the JC RTS ICT risk-management framework; the regimes carry
      separate evidence requirements against the same underlying
      malware-protection artifact.
  - id: iso27001:a-8-8-management-of-technical-vulnerabilities
    regulation:
      name: ISO/IEC 27001:2022
      instrument: ISO/IEC 27001:2022 Annex A
      article: A.8.8
      url: https://www.iso.org/standard/27001
    obligation: >-
      Obtain information about technical vulnerabilities of the
      information systems in use in a timely fashion, evaluate the
      operator's exposure, and take appropriate measures. The
      operator must run a documented vulnerability-management
      programme: identify sources of advisories, ingest and
      classify findings, scan the estate on a declared cadence,
      prioritise remediation against risk, apply patches or
      compensating controls, and retain evidence that the loop
      closes.
    status: draft
    control_refs:
      - control.patch_evidence@v1
      - control.vuln_disclosure_intake@v1
    playbook_refs:
      - playbook.vuln_intake@v1
      - playbook.patch_management@v1
      - playbook.codebase_vuln_management@v1
      - playbook.infra_posture_management@v1
      - playbook.cloud_misconfiguration@v1
    notes: >-
      A.8.8 is the technical-vulnerability-management anchor for the
      Annex A.8 theme — the standard requires a documented programme
      that identifies advisory sources, evaluates operator-side
      exposure against tracked assets, drives remediation on a
      risk-prioritised basis, and retains evidence that the loop
      closes. control.patch_evidence@v1 is the direct anchor for the
      remediation-evidence side (its oscal_refs block already carries
      ISO/IEC 27001:2022 A.8.8 alongside the corresponding NIST
      800-53 rev5 RA-5 / SI-2 lineage and the CRA Annex I update-
      handling row). control.vuln_disclosure_intake@v1 is the direct
      anchor for the inbound-advisory side (its oscal_refs block also
      carries A.8.8, wired against the coordinated-disclosure
      surface). The operational discharge splits across five
      playbooks: playbook.vuln_intake@v1 (advisory ingest and
      classification), playbook.patch_management@v1 (ring-based
      rollout with per-application evidence), and the estate-scan
      family — playbook.codebase_vuln_management@v1 (source /
      dependency surface), playbook.infra_posture_management@v1
      (infrastructure-posture attestation), and
      playbook.cloud_misconfiguration@v1 (cloud-side scan). Cross-
      regime parallels: NIS2 Art. 21(2)(e) (security in acquisition,
      development, and maintenance) reaches the maintenance-patch
      slice; DORA Art. 9(2) (ICT protection and prevention)
      operationalised by the JC RTS (Commission Delegated Regulation
      (EU) 2024/1774) covers vulnerability-management inside the ICT
      risk-management framework; CRA Art. 13(3) and Annex I §2
      cover the security-updates side for products with digital
      elements. The regimes carry separate evidence requirements
      against the same underlying vulnerability-and-patch artifact
      set.
  - id: iso27001:a-8-9-configuration-management
    regulation:
      name: ISO/IEC 27001:2022
      instrument: ISO/IEC 27001:2022 Annex A
      article: A.8.9
      url: https://www.iso.org/standard/27001
    obligation: >-
      Establish, document, implement, monitor, and review
      configurations, including security configurations, of
      hardware, software, services, and networks. Configurations
      must sit inside a documented baseline, be gated by a change-
      control decision before drift is admitted, and be re-attested
      on a declared cadence so that saturation, drift, or unmanaged
      exceptions do not silently erode the operator's security
      posture.
    status: draft
    control_refs:
      - control.configuration_settings@v1
      - control.baseline_configuration@v1
      - control.iac_policy_guardrail@v1
      - control.cspm_baseline@v1
    playbook_refs:
      - playbook.infra_posture_management@v1
      - playbook.cloud_misconfiguration@v1
    notes: >-
      A.8.9 is the configuration-management anchor for the Annex A.8
      theme — the standard requires that hardware, software,
      service, and network configurations sit inside a documented
      baseline, be gated by change-control, and be re-attested on a
      declared cadence. control.configuration_settings@v1 and
      control.baseline_configuration@v1 are the direct anchors for
      the baseline-and-settings side (both already carry ISO/IEC
      27001:2022 A.8.9 on their oscal_refs block alongside NIST
      800-53 rev5 CM-6 and CM-2 respectively).
      control.iac_policy_guardrail@v1 anchors the infrastructure-as-
      code policy-gate side (drift and change-control expressed in
      the IaC surface), and control.cspm_baseline@v1 anchors the
      cloud-side baseline-attestation slice; both already carry
      A.8.9. playbook.infra_posture_management@v1 is the operational
      discharge for the on-premise / hybrid infrastructure surface
      (per-execution posture-evidence artifact against the declared
      baseline); playbook.cloud_misconfiguration@v1 discharges the
      cloud-configuration slice. Cross-regime parallels: NIS2
      Art. 21(2)(a) (policies on the security of network and
      information systems) reaches baseline configuration through
      the security-policy anchor; DORA Art. 9(3) (ICT protection —
      including availability, authenticity, integrity,
      confidentiality) operationalised by the JC RTS ICT risk-
      management framework covers hardened baselines and change
      control on ICT assets; the regimes carry separate evidence
      requirements against the same underlying configuration
      artifact.
  - id: iso27001:a-8-10-information-deletion
    regulation:
      name: ISO/IEC 27001:2022
      instrument: ISO/IEC 27001:2022 Annex A
      article: A.8.10
      url: https://www.iso.org/standard/27001
    obligation: >-
      Delete information stored in information systems, devices, or
      any other storage media when no longer required. Deletion
      must be executed against the operator's declared retention
      schedule, cover primary storage, backups, and any replicated
      or exported copies, and be evidenced against the record it
      discharges — including secure erasure or media sanitisation
      where the medium is disposed of or repurposed.
    status: draft
    control_refs: []
    # control_refs intentionally empty: the SecOps-NG control catalogue
    # does not yet carry a dedicated information-deletion / media-
    # sanitisation artifact. A.8.10 is discharged in practice today
    # against the operator's own retention-schedule enforcement
    # (per-record deletion or archival on schedule expiry), backup
    # retention policy, secure-erasure procedures for decommissioned
    # media, and disposal / re-use controls for storage devices.
    # A future control (e.g. control.information_deletion@v1 or
    # control.media_sanitisation@v1, keyed against NIST 800-53 rev5
    # MP-6 Media Sanitization and SI-12 Information Management and
    # Retention) would replace this placeholder without changing
    # the entry id. The GDPR-side of the same discipline (Art. 17
    # right to erasure) is separately anchored under
    # playbook.data_subject_rights@v1.
    notes: >-
      A.8.10 is the information-deletion anchor within the Annex A.8
      theme — the standard requires that information no longer
      required be deleted from primary storage, backups, and any
      replicated or exported copies, on the operator's declared
      retention schedule, and that secure erasure or media
      sanitisation cover the disposal / re-use surface. The
      SecOps-NG control catalogue does not yet carry a dedicated
      deletion / sanitisation artifact (see the placeholder note
      above); the obligation is discharged in practice against the
      operator's own retention-schedule enforcement,
      backup-retention policy, and media-disposal procedures.
      Cross-regime parallels: GDPR Art. 5(1)(e) (storage limitation)
      and Art. 17 (right to erasure) reach the personal-data slice
      through the data-subject-rights surface — the SecOps-NG
      playbook.data_subject_rights@v1 already operationalises the
      Art. 17 erasure request path against the operator's inventory.
      NIS2 Art. 21(2)(a) (policies on the security of network and
      information systems) reaches the retention / disposal policy
      side; DORA Art. 9(3) (ICT protection) reaches the ICT-asset
      disposal side through the JC RTS ICT risk-management
      framework. The regimes carry separate evidence requirements
      against the same underlying deletion / sanitisation artifact.
  - id: iso27001:a-8-11-data-masking
    regulation:
      name: ISO/IEC 27001:2022
      instrument: ISO/IEC 27001:2022 Annex A
      article: A.8.11
      url: https://www.iso.org/standard/27001
    obligation: >-
      Use data masking in accordance with the operator's topic-
      specific policy on access control and other related topic-
      specific policies, and business requirements, taking
      applicable legislation into consideration. Sensitive and
      personal data used outside the production surface — in
      development, test, analytics, or training environments —
      must be masked, pseudonymised, tokenised, or otherwise
      transformed so that the risk profile of the non-prod copy
      matches the classification of the transformed data, not the
      classification of the original record.
    status: draft
    control_refs: []
    # control_refs intentionally empty: the SecOps-NG control catalogue
    # does not yet carry a dedicated data-masking / pseudonymisation
    # artifact. A.8.11 is discharged in practice today against the
    # operator's own data-classification pipeline (identify the
    # personal / sensitive fields), the masking / tokenisation
    # transform library used when replicating data into non-prod
    # environments, and the access-control policy on the non-prod
    # environments themselves (masking is a defence-in-depth layer,
    # not a replacement for the environment-access controls A.8.3
    # anchors). A future control (e.g.
    # control.data_masking@v1 or control.pseudonymisation@v1, keyed
    # against NIST 800-53 rev5 SC-28 Protection of Information at
    # Rest and MP-6-family sanitisation lineage) would replace this
    # placeholder without changing the entry id.
    notes: >-
      A.8.11 is the data-masking anchor within the Annex A.8 theme —
      the standard requires that sensitive and personal data used
      outside the production surface be masked, pseudonymised,
      tokenised, or otherwise transformed so the non-prod risk
      profile matches the transformed classification. The SecOps-NG
      control catalogue does not yet carry a dedicated masking
      artifact (see the placeholder note above); the obligation is
      discharged in practice against the operator's own
      data-classification pipeline, the masking / tokenisation
      transform library used when replicating data into non-prod,
      and the environment-access controls anchored under A.8.3.
      Cross-regime parallels: GDPR Art. 25 (data protection by
      design and by default) names pseudonymisation as an example
      of an appropriate technical measure and Art. 32(1)(a) names
      it explicitly among the security-of-processing measures; the
      GDPR-side surface is operationalised in the SecOps-NG content
      through the data-protection-impact-assessment playbook family.
      NIS2 Art. 21(2)(h) (policies and procedures regarding the use
      of cryptography and, where appropriate, encryption) reaches
      the transform / at-rest side; DORA Art. 9(4)(b) (data and
      system integrity) reaches the non-prod / test-data slice
      through the JC RTS ICT risk-management framework. The regimes
      carry separate evidence requirements against the same
      underlying masking / pseudonymisation artifact.
  - id: iso27001:a-8-12-data-leakage-prevention
    regulation:
      name: ISO/IEC 27001:2022
      instrument: ISO/IEC 27001:2022 Annex A
      article: A.8.12
      url: https://www.iso.org/standard/27001
    obligation: >-
      Apply data leakage prevention measures to systems, networks,
      and any other devices that process, store, or transmit
      sensitive information. Detection, monitoring, and — where
      warranted — blocking of unauthorised disclosure or
      exfiltration of sensitive data must cover the egress surface
      (email, web upload, cloud sync, endpoint peripherals), be
      tuned against the operator's data-classification scheme, and
      feed the incident-response chain when a confirmed exfiltration
      is detected.
    status: draft
    control_refs: []
    playbook_refs:
      - playbook.data_exfil@v1
    # control_refs intentionally empty: the SecOps-NG control catalogue
    # does not yet carry a dedicated DLP / egress-monitoring control
    # artifact. A.8.12 is discharged in practice today against the
    # operator's own DLP stack (email-gateway, web-proxy, endpoint,
    # and cloud-sync inspection agents) tuned against the operator's
    # data-classification scheme; the SecOps-NG side operationalises
    # the response chain that consumes the DLP signal via
    # playbook.data_exfil@v1 (triage, scope assessment, containment
    # via egress filter and session / token revocation, and
    # regulator / affected-party notification where the threshold
    # is met). A future dedicated DLP-posture control (e.g.
    # control.dlp_posture@v1, keyed against NIST 800-53 rev5 SC-7
    # Boundary Protection and AC-4 Information Flow Enforcement)
    # would replace this placeholder without changing the entry id.
    notes: >-
      A.8.12 is the data-leakage-prevention anchor within the Annex
      A.8 theme — the standard requires detection, monitoring, and,
      where warranted, blocking of unauthorised disclosure of
      sensitive data across the egress surface, tuned against the
      data-classification scheme and wired into the incident-
      response chain. The SecOps-NG control catalogue does not yet
      carry a dedicated DLP-posture control artifact (see the
      placeholder note above); the obligation is discharged on the
      detection side against the operator's own DLP stack (email,
      web, endpoint, cloud-sync inspection), and on the response
      side against playbook.data_exfil@v1 — the SecOps-NG
      operational engine for the DLP / egress-signal response
      chain, which triages the signal, assesses scope, contains
      confirmed exfiltration (egress filter, session / token
      revocation), and gates regulator / affected-party notification
      on the affected-subjects threshold. Cross-regime parallels:
      GDPR Art. 33 / 34 (personal-data breach notification) reaches
      the confirmed-exfiltration branch through the same response
      chain; NIS2 Art. 23 (significant-incident reporting) and DORA
      Art. 19 (major ICT-related incident reporting) reach the
      regulator-notification threshold; CRA Art. 14(3) reaches the
      product-facing incident surface. The regimes carry separate
      evidence requirements against the same underlying DLP-signal-
      and-response artifact set.
