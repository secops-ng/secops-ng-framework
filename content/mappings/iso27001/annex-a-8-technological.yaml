      surface; CRA Annex I §1 (security-by-design) and the
      Article 13(1) essential cybersecurity requirements reach the
      product-testing side of the same discipline; the regimes
      carry separate evidence requirements against the same
      underlying security-testing artifact.
  - id: iso27001:a-8-30-outsourced-development
    regulation:
