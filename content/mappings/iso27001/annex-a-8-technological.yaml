      Direct, monitor, and review activities related to outsourced
      system development. The operator pins the security
      requirements the third-party developer is contractually held
      against (secure-coding standards, security-testing evidence,
      vulnerability-disclosure obligations, provenance and SBOM
      obligations, right-to-audit), keeps those activities under
      supervision across the engagement, exercises acceptance
      gates against delivered artifacts, and evidences the
      resulting decisions against the same supplier-management
      trail the operator already keeps against the wider
      third-party posture.
