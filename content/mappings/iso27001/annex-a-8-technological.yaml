    # separation control artifact. A.8.31 is discharged in
    # practice today against the operator's own environment
    # topology (identity partitioning, network segmentation
    # anchored under A.8.22, configuration-baseline separation
    # anchored under A.8.9, access-restriction enforcement
    # anchored under A.8.3, and data-masking posture anchored
    # under A.8.11) joined against the secure-SDLC umbrella
    # anchored under A.8.25 and the change-management discipline
    # anchored under A.8.32. A future dedicated environment-
    # separation control (e.g. control.environment_separation@v1,
    # keyed against NIST 800-53 rev5 SC-2 Separation of System
    # and User Functionality and CM-4(1) Impact Analyses:
    # Separate Test Environments) would replace this placeholder
    # without changing the entry id.
    playbook_refs: []
    # playbook_refs intentionally empty: the SecOps-NG playbook
    # catalogue does not yet carry a dedicated environment-
    # separation playbook. Environment topology is a governance
    # discipline upstream of the CACAO playbook layer; the
    # downstream operational disciplines sit on the adjacent
    # Annex A.8 anchors named above.
    notes: >-
      A.8.31 is the separation-of-development-test-and-production-
      environments anchor within the Annex A.8 theme — the
      standard requires that the environments be separated and
      that each be protected against the others. Neither the
      SecOps-NG control catalogue nor the SecOps-NG playbook
      catalogue currently carries a dedicated environment-
      separation artifact (see the placeholder notes above); the
      obligation is discharged in practice against the operator's
      own environment topology joined against several adjacent
      Annex A.8 anchors that already carry the concrete
      disciplines: A.8.3 (information-access restriction) for the
      identity-partitioning surface, A.8.9 (configuration
      management) for the per-environment baseline discipline,
      A.8.11 (data masking) for the production-data-leakage
      prevention surface, A.8.22 (segregation of networks) for
      the network-partitioning surface, and A.8.32 (change
      management) for the change-and-promotion discipline that
      moves artifacts across the environment boundary.
