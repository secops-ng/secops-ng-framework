  - id: iso27001:a-8-31-separation-of-development-test-and-production-environments
    regulation:
      name: ISO/IEC 27001:2022
      instrument: ISO/IEC 27001:2022 Annex A
      article: A.8.31
      url: https://www.iso.org/standard/27001
    obligation: >-
      Separate development, testing, and production environments
      and protect each against the others. The operator declares
      the environment topology (which systems belong to which
      environment, how data flows across the boundary, how
      credentials and network reachability are partitioned),
      keeps the separation enforced at the identity, network,
      configuration, and data layers, prevents production data
      from bleeding into lower environments except under
      authorised and masked conditions, and evidences the
      resulting posture against the same audit trail the
      operational configuration and access controls already
      exercise.
