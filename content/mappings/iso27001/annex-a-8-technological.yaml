      requirements artifact.
  - id: iso27001:a-8-27-secure-system-architecture-and-engineering-principles
    regulation:
      name: ISO/IEC 27001:2022
      instrument: ISO/IEC 27001:2022 Annex A
      article: A.8.27
      url: https://www.iso.org/standard/27001
    obligation: >-
      Establish, document, maintain, and apply principles for
      engineering secure systems to any system-development activity.
      The operator declares the architectural principles that apply
      (defence-in-depth, least privilege, secure defaults, separation
      of duties across the system boundary, minimisation of attack
      surface, fail-secure behaviour), keeps those principles under
      review against the state of the art, and evidences their
      application against the architecture decisions the operator
      records for systems in scope.
