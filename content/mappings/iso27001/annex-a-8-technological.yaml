    # technical-vulnerability-management discipline anchored under
    # A.8.8, the access-restriction discipline anchored under A.8.3,
    # and the authentication discipline anchored under A.8.5. A
    # future dedicated application-security-requirements control
    # (e.g. control.appsec_requirements@v1, keyed against NIST
    # 800-53 rev5 SA-4 Acquisition Process and SA-11 Developer
    # Testing and Evaluation) would replace this placeholder
    # without changing the entry id.
    playbook_refs: []
    # playbook_refs intentionally empty: the SecOps-NG playbook
    # catalogue does not yet carry a dedicated application-security-
    # requirements playbook. The requirements-engineering surface is
    # a governance discipline upstream of the CACAO playbook layer;
    # the downstream operational discharge sits under
    # playbook.codebase_vuln_management@v1 (anchored under A.8.8)
    # for the code-vulnerability side of the acceptance surface.
    notes: >-
      A.8.26 is the application-security-requirements anchor within
      the Annex A.8 theme — the standard requires that information-
      security requirements be identified, specified, and approved
      when applications are developed or acquired, that those
      requirements be propagated through design and implementation,
      and that they be exercised against acceptance testing. Neither
      the SecOps-NG control catalogue nor the SecOps-NG playbook
      catalogue currently carries a dedicated application-security-
      requirements artifact (see the placeholder notes above); the
      obligation is discharged in practice against the operator's
      own requirements-engineering process joined against the
      secure-SDLC umbrella anchored under A.8.25 (which A.8.26
      specialises against at the requirements phase), the
      technical-vulnerability-management discipline anchored under
      A.8.8, the access-restriction discipline anchored under A.8.3,
      and the authentication discipline anchored under A.8.5.
      Cross-regime parallels: NIS2 Art. 21(2)(e) (security in
