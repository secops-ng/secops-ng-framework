    # playbook_refs intentionally empty: the SecOps-NG playbook
    # catalogue does not yet carry a dedicated security-architecture
    # playbook. Architecture governance is upstream of the CACAO
    # playbook layer; the downstream operational disciplines sit on
    # the adjacent Annex A.8 anchors named above.
    notes: >-
      A.8.27 is the secure-system-architecture-and-engineering-
      principles anchor within the Annex A.8 theme — the standard
      requires that principles for engineering secure systems be
      established, documented, maintained, and applied to any
      system-development activity. Neither the SecOps-NG control
      catalogue nor the SecOps-NG playbook catalogue currently
      carries a dedicated architecture-principles artifact (see the
      placeholder notes above); the obligation is discharged in
      practice against the operator's own architecture-governance
      posture (declared principles, architecture-decision records,
      per-system security-architecture review) joined against the
      secure-SDLC umbrella anchored under A.8.25 (which A.8.27
      specialises against at the architecture-and-engineering
      phase), the configuration-baseline discipline anchored under
      A.8.9, the least-privilege and access-restriction disciplines
      anchored under A.8.2 / A.8.3, the network-security discipline
      anchored under A.8.20, and the segregation-of-networks
