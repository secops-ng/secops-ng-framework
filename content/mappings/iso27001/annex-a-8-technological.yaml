      apply at each phase (unit and integration security tests,
      static and dynamic application analysis, dependency and
      software-composition analysis, secret scanning, penetration
      testing against pre-release builds, acceptance-gate security
      criteria for release), wires them into the build and release
      path so the discipline is enforced rather than optional, and
      evidences the resulting test outcomes against the same
      evidence surface the operational security controls already
      read.
