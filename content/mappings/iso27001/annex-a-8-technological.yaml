    # in-build static-analysis / dependency-scanning / secret-
    # scanning enforcement, code-review gates) joined against the
    # secure-SDLC umbrella anchored under A.8.25, the source-code
    # access discipline anchored under A.8.4, and the technical-
    # vulnerability-management discipline anchored under A.8.8. A
    # future dedicated secure-coding control (e.g.
    # control.secure_coding_standards@v1, keyed against NIST 800-53
    # rev5 SA-15 Development Process, Standards, and Tools and
    # SA-11 Developer Testing and Evaluation) would replace this
    # placeholder without changing the entry id.
    playbook_refs:
      - playbook.codebase_vuln_management@v1
    notes: >-
      A.8.28 is the secure-coding anchor within the Annex A.8
      theme — the standard requires that principles for secure
      coding be applied to software development. The dedicated
      coding-standards control artifact is not yet in the SecOps-NG
      control catalogue (see the placeholder note above); the
      obligation is discharged in practice against the operator's
      own coding-standards posture joined against the secure-SDLC
      umbrella anchored under A.8.25 (which A.8.28 specialises
      against at the coding phase), the source-code access
      discipline anchored under A.8.4, and the technical-
      vulnerability-management discipline anchored under A.8.8.
      `playbook.codebase_vuln_management@v1` is called out on the
