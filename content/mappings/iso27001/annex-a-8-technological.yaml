      acquisition, development and maintenance) reaches the
      environment-separation anchor; DORA Art. 9(3) (ICT
      protection) via the JC RTS (Commission Delegated Regulation
      (EU) 2024/1774) ICT security policies covers the
      environment-partitioning discipline on ICT assets; the
