      framework covers the secure-acquisition-and-development
      discipline on ICT assets; CRA Annex I §1(b) and the
      Article 13(1) essential-cybersecurity-requirements surface
      reach the product-development side of the same discipline;
      the regimes carry separate evidence requirements against the
