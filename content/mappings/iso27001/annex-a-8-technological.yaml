  - id: iso27001:a-8-26-application-security-requirements
    regulation:
      name: ISO/IEC 27001:2022
      instrument: ISO/IEC 27001:2022 Annex A
      article: A.8.26
      url: https://www.iso.org/standard/27001
    obligation: >-
      Identify, specify, and approve information-security requirements
      when developing or acquiring applications. Security requirements
      are captured against the application's risk profile at the
      requirements phase, propagated into design and implementation,
      exercised against acceptance testing, and re-visited when the
      application, its exposure, or the regulatory instruments that
      apply to it change.
