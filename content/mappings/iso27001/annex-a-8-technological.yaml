  - id: iso27001:a-8-32-change-management
    regulation:
      name: ISO/IEC 27001:2022
      instrument: ISO/IEC 27001:2022 Annex A
      article: A.8.32
      url: https://www.iso.org/standard/27001
    obligation: >-
      Subject changes to information-processing facilities and
      information systems to change-management procedures. The
      operator declares the change-management shape that applies
      (proposal, security-impact assessment, authorisation gate,
      test-and-verification step, roll-out plan and roll-back
      plan, post-change review), routes changes through it,
      exercises it against emergency changes as well as routine
      ones, and evidences the resulting decisions against the
      same audit trail the configuration and vulnerability
      controls already read.
    status: draft
    control_refs:
      - control.iac_policy_guardrail@v1
    playbook_refs:
      - playbook.infra_posture_management@v1
      - playbook.patch_management@v1
    notes: >-
      A.8.32 is the change-management anchor within the Annex A.8
      theme — the standard requires that changes to information-
      processing facilities and systems be subject to change-
      management procedures. `control.iac_policy_guardrail@v1`
      already carries A.8.32 on its `oscal_refs` block (against
      NIST 800-53 rev5 CM-3 Configuration Change Control): the
      infrastructure-as-code policy guardrail is the concrete
      change-review-and-authorisation gate the operator holds
      infrastructure changes against, so proposed changes flow
      through a machine-checked security-impact assessment before
      landing. On the operational side,
      `playbook.infra_posture_management@v1` exercises the
      posture-change slice against infrastructure (drift
      detection, guardrail enforcement, remediation routing) and
      `playbook.patch_management@v1` exercises the change-and-
      release slice against software patching (the emergency-
      change side of A.8.32 that A.8.8 vulnerability-driven
      remediation drives), both feeding the operator's
      change-management surface. The change-management discipline
      sits between A.8.9 (configuration management) upstream — it
      is the process discipline that guards the configuration
      baseline — and A.8.19 (installation of software) and
      A.8.31 (environment separation) downstream. Cross-regime
      parallels: NIS2 Art. 21(2)(e) (security in acquisition,
      development and maintenance) and Art. 21(2)(i) (basic
      cyber-hygiene practices) both reach the change-management
      anchor; DORA Art. 9(3) (ICT protection) via the JC RTS
      (Commission Delegated Regulation (EU) 2024/1774) ICT
      change-management arrangements reaches the ICT change-
      control discipline directly; CRA Article 13 and Annex I §1
      reach the product-change side of the same discipline for
      products with digital elements; the regimes carry separate
      evidence requirements against the same underlying change-
      management artifact.
