    # classification pipeline that flags production-sensitive
    # data, the masking-and-pseudonymisation transforms anchored
    # under A.8.11, the environment-separation discipline
    # anchored under A.8.31 that keeps test information inside
    # its own boundary, and the access-restriction discipline
    # anchored under A.8.3 that gates who can pull test datasets)
    # joined against the GDPR data-minimisation surface anchored
    # under Article 5(1)(c) and the retention-and-deletion surface
    # anchored under GDPR Article 5(1)(e). A future dedicated
    # test-information control (e.g. control.test_data_masking@v1,
    # keyed against NIST 800-53 rev5 SA-15(9) Use of Live Data
    # and CM-4(1) Impact Analyses: Separate Test Environments)
    # would replace this placeholder without changing the entry
    # id.
    playbook_refs: []
    # playbook_refs intentionally empty: the SecOps-NG playbook
    # catalogue does not yet carry a dedicated test-information
    # protection playbook. The test-data-authorisation surface is
    # a governance discipline upstream of the CACAO playbook
    # layer; the downstream operational data-handling disciplines
    # sit on the adjacent Annex A.8 anchors named above and on
    # `playbook.data_subject_rights@v1` for the erasure side
    # against inadvertently landed personal data.
    notes: >-
      A.8.33 is the test-information anchor within the Annex A.8
      theme — the standard requires that test information be
      selected, protected, and managed. Neither the SecOps-NG
      control catalogue nor the SecOps-NG playbook catalogue
      currently carries a dedicated test-information artifact
      (see the placeholder notes above); the obligation is
      discharged in practice against the operator's own test-data
      posture joined against several adjacent Annex A.8 anchors
      that already carry the concrete disciplines: A.8.3
      (information-access restriction) for the who-can-pull
      surface, A.8.11 (data masking) for the transform-in-flight
      surface, and A.8.31 (separation of environments) for the
      keep-inside-the-boundary surface. Where inadvertently
      landed personal data must be erased,
      `playbook.data_subject_rights@v1` (anchored under GDPR
      Article 17) exercises the deletion side. Cross-regime
      parallels: GDPR Art. 5(1)(c) (data minimisation) and
      Art. 5(1)(e) (storage limitation) reach the personal-data
      side of the test-information anchor directly, with
      Art. 32 (security of processing) reaching the protection-
      by-design side; NIS2 Art. 21(2)(e) (security in acquisition,
      development and maintenance) reaches the development-side
      test-data discipline; DORA Art. 9(3) (ICT protection)
      covers the test-data-handling discipline on ICT assets;
      the regimes carry separate evidence requirements against
      the same underlying test-information artifact.
  - id: iso27001:a-8-34-protection-of-information-systems-during-audit-testing
    regulation:
      name: ISO/IEC 27001:2022
      instrument: ISO/IEC 27001:2022 Annex A
      article: A.8.34
      url: https://www.iso.org/standard/27001
    obligation: >-
      Plan and agree audit tests and other assurance activities
      involving assessment of operational systems between the
      auditor and appropriate management. The operator scopes the
      audit tests against a defined set of operational systems,
      constrains the tools and techniques against known-safe
      profiles, pins the authorisation and supervision that
      applies during the test window, keeps the boundary between
      audit activity and normal operation observable to both
      sides, and evidences the resulting decisions against the
      same audit trail the change-management and access-
      restriction controls already read.
    status: draft
    control_refs: []
    # control_refs intentionally empty: the SecOps-NG control
    # catalogue does not yet carry a dedicated audit-testing
    # protection artifact. A.8.34 is discharged in practice today
    # against the operator's own audit-engagement posture
    # (scoping and rules-of-engagement documentation, per-
    # engagement authorisation and supervision, controlled
    # release of auditor access joined against the access-
    # restriction discipline anchored under A.8.3, the change-
    # management discipline anchored under A.8.32 for any
    # test-driven configuration change, the log-and-monitor
    # discipline anchored under A.8.15 / A.8.16 that keeps
    # audit-window activity observable, and the environment-
    # separation discipline anchored under A.8.31 where the
    # audit test targets a lower environment). A future
    # dedicated control (e.g. control.audit_test_authorisation@v1,
    # keyed against NIST 800-53 rev5 AU-13 Monitoring for
    # Information Disclosure and CA-8 Penetration Testing) would
    # replace this placeholder without changing the entry id.
    playbook_refs: []
    # playbook_refs intentionally empty: the SecOps-NG playbook
    # catalogue does not yet carry a dedicated audit-testing
    # governance playbook. Audit-engagement governance is
    # upstream of the CACAO playbook layer; the downstream
    # operational disciplines that observe audit-window activity
    # sit on `playbook.alert_triage@v1` and
    # `playbook.detection_engineering@v1` (anchored under A.8.16
    # monitoring activities).
    notes: >-
      A.8.34 is the protection-of-information-systems-during-
      audit-testing anchor within the Annex A.8 theme — the
      standard requires that audit tests and other assurance
      activities involving operational-system assessment be
      planned and agreed between auditor and appropriate
      management. Neither the SecOps-NG control catalogue nor
      the SecOps-NG playbook catalogue currently carries a
      dedicated audit-testing governance artifact (see the
      placeholder notes above); the obligation is discharged in
      practice against the operator's own audit-engagement
      posture joined against several adjacent Annex A.8 anchors
      that already carry the concrete disciplines: A.8.3
      (information-access restriction) for the controlled-
      release-of-access surface, A.8.15 / A.8.16 (logging /
      monitoring) for the observability surface that keeps
      audit-window activity visible, A.8.31 (environment
      separation) for the audit-scoping-against-a-lower-
      environment surface, and A.8.32 (change management) for
      any audit-test-driven configuration change. Cross-regime
      parallels: NIS2 Art. 21(2)(i) (basic cyber-hygiene
      practices) and Art. 21(3) (proportionality) both reach
      the audit-testing-governance anchor; DORA Art. 24-27
      (advanced testing including threat-led penetration
      testing, TLPT) reach the operational-audit-testing
      discipline directly for ICT assets, with the TLPT scoping-
      and-supervision surface tracking A.8.34's plan-and-agree
      requirement closely; CRA Article 13 and the Annex I §1
      surface reach the post-market-vigilance-testing side of
      the same discipline for products with digital elements;
      the regimes carry separate evidence requirements against
      the same underlying audit-testing artifact.
