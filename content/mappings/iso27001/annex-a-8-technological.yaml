      procedures, protocols and tools reaching the architectural
      declaration side; CRA Article 13 and Annex I §1 reach the
      product-architecture side of the same discipline; the regimes
      carry separate evidence requirements against the same
      underlying architecture-and-engineering-principles artifact.
  - id: iso27001:a-8-28-secure-coding
    regulation:
      name: ISO/IEC 27001:2022
      instrument: ISO/IEC 27001:2022 Annex A
      article: A.8.28
      url: https://www.iso.org/standard/27001
    obligation: >-
      Apply secure-coding principles to software development. The
      operator declares the coding standards that apply per language
      and per stack, propagates them into developer tooling (linters,
      static analysis, dependency scanners, secret scanners) so the
      discipline is enforced in the build path rather than the review
      path alone, keeps the standards under review against emerging
      vulnerability classes, and evidences the resulting decisions
      against the code-review, static-analysis, and vulnerability-
      intake trail the operator already keeps.
