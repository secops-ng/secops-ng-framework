# ISO/IEC 27001:2022 — Annex A.5 Organisational controls.
#
# First entry against the ISO/IEC 27001:2022 Annex A crosswalk. Annex A
# in the 2022 revision is organised into four themes: A.5 Organisational
# (37 controls), A.6 People (8 controls), A.7 Physical (14 controls),
# and A.8 Technological (34 controls). This file holds the A.5
# organisational family; sibling per-theme files (`annex-a-6-people.yaml`,
# `annex-a-7-physical.yaml`, `annex-a-8-technological.yaml`) hold their
# respective controls as they land.
#
# Scope of this file: Annex A.5 organisational controls. The first
# entry (A.5.1 policies) established the crosswalk conventions for
# external contributors: one entry per Annex A control (identified by
# the numeric control ref under the A.5 family), pinning the
# obligation paraphrase and the control-model artifacts that
# discharge it. The next batch (A.5.2 information-security roles,
# A.5.3 segregation of duties, A.5.4 management responsibilities,
# A.5.5 contact with authorities, A.5.6 contact with special interest
# groups) landed alongside the anchor, and the A.5.7–A.5.12 batch
# (threat intelligence, ISMS in project management, inventory of
# assets, acceptable use of assets, return of assets, classification
# of information) lands in this batch. The remaining A.5 controls
# (A.5.13 through A.5.37) land as sibling entries in this file on
# subsequent cards.
#
# Regime scope caveat: ISO/IEC 27001:2022 is a certifiable
# information-security management standard, not an EU statutory
# instrument. The crosswalk is a structural pointer against the
# operator's own conformance evidence — the assertion here is that the
# named artifacts exercise the operator-side obligation, not that they
# constitute a legal interpretation of the standard.

regime: iso27001
entries:
  - id: iso27001:a-5-1-policies
    regulation:
      name: ISO/IEC 27001:2022
      instrument: ISO/IEC 27001:2022 Annex A
      article: A.5.1
      url: https://www.iso.org/standard/27001
    obligation: >-
      Define an information security policy and topic-specific
      policies. The policy set must be approved by management,
      published, communicated to and acknowledged by relevant
      personnel and interested parties, and reviewed at planned
      intervals or when significant changes occur.
    status: draft
    control_refs:
      - control.risk_management_policy@v1
    notes: >-
      A.5.1 is the anchor organisational-policy obligation for the
      whole Annex A control set — the standard cites it as the
      overall information-security policy plus the topic-specific
      policies that operationalise it. control.risk_management_policy@v1
      is the direct anchor: its oscal_refs block already carries
      ISO/IEC 27001:2022 A.5.1 as one of its target controls
      alongside NIST 800-53 rev5 PM-9 / RA-3 and NIS2 Art. 21(2)(a),
      and its review_cadence field (P1Y baseline) is the periodic-
      review discipline A.5.1 requires. Topic-specific policies land
      as sibling entries against their respective A.5 controls
      (A.5.9 asset inventory / A.5.13 labelling / A.5.15 access
      control / A.5.17 authentication information / A.5.24
      incident-management planning / etc.); the review-and-approval
      discipline this entry anchors is the whole-programme roll-up
      that governs each of them.
      Cross-regime parallels: the NIS2 parallel under
      `nis2:art-21-2-a` (risk analysis and information-system-security
      policies) and the GDPR parallel through
      control.risk_management_policy@v1's role under Art. 24
      controller-accountability anchor the same policy discipline
      against their own regime-specific obligations; the regimes
      carry separate evidence requirements against the same
      underlying policy-set artifact.
  - id: iso27001:a-5-2-roles-and-responsibilities
    regulation:
      name: ISO/IEC 27001:2022
      instrument: ISO/IEC 27001:2022 Annex A
      article: A.5.2
      url: https://www.iso.org/standard/27001
    obligation: >-
      Define and allocate information-security roles and
      responsibilities in accordance with the organisation's
      information-security needs. Allocations must be documented,
      accepted by role-holders, and reviewed as the organisation
      and its risk profile change.
    status: draft
    control_refs:
      - control.ict_risk_governance@v1
    notes: >-
      A.5.2 is the roles-and-responsibilities anchor for the whole
      Annex A control set — the standard requires that
      information-security responsibilities be explicitly assigned
      rather than left implicit. control.ict_risk_governance@v1 is
      the direct anchor: its oscal_refs block already carries
      ISO/IEC 27001:2022 A.5.2 alongside NIST 800-53 rev5 PM-2
      (information-security programme leadership role) and PM-29
      (risk-management programme leadership roles) plus DORA
      Article 5 (governance and organisation), and its governance
      surface (management-body responsibility, documented role
      allocations, review cadence) is the discipline A.5.2 requires.
      Cross-regime parallels: NIS2 Art. 20 (governance —
      management-body responsibility for cyber risk) and DORA
      Article 5 (governance and organisation) discharge the same
      role-allocation obligation against their own regime-specific
      accountability regimes; the regimes carry separate evidence
      requirements against the same underlying governance artifact.
  - id: iso27001:a-5-3-segregation-of-duties
    regulation:
      name: ISO/IEC 27001:2022
      instrument: ISO/IEC 27001:2022 Annex A
      article: A.5.3
      url: https://www.iso.org/standard/27001
    obligation: >-
      Segregate conflicting duties and areas of responsibility to
      reduce opportunities for unauthorised or unintentional
      modification, misuse, or fraud against the organisation's
      assets. Where full segregation is not practicable, apply
      compensating controls such as activity monitoring, audit
      trails, and management oversight.
    status: draft
    control_refs: []
    # control_refs intentionally empty: the SecOps-NG control catalogue
    # does not yet carry a segregation-of-duties artifact as a
    # first-class control. A.5.3 is discharged in practice today
    # through the combination of least-privilege enforcement
    # (control.least_privilege@v1, A.5.15/A.8.2 anchor) and
    # privileged-access review (control.privileged_access_review@v1,
    # A.8.2 anchor); a future dedicated artifact (e.g.
    # control.segregation_of_duties@v1) would replace this placeholder
    # without changing the entry id.
    notes: >-
      A.5.3 is the segregation-of-duties anchor within the Annex A.5
      organisational-controls theme — the standard treats it as a
      structural control against fraud, error, and misuse rather
      than a purely access-technical one. The SecOps-NG control
      catalogue currently exercises the practical surface (who can
      execute which conflicting actions) through the least-privilege
      and privileged-access-review controls that already carry
      A.5.15 and A.8.2 respectively; the segregation obligation
      itself is discharged against the operator's own role-matrix
      and duty-separation evidence. Cross-regime parallels: NIS2
      Art. 21(2)(i) (human-resources security — including access
      control) touches the same discipline against the essential/
      important-entity scope; the regimes carry separate evidence
      requirements against the same underlying duty-separation
      artifact.
  - id: iso27001:a-5-4-management-responsibilities
    regulation:
      name: ISO/IEC 27001:2022
      instrument: ISO/IEC 27001:2022 Annex A
      article: A.5.4
      url: https://www.iso.org/standard/27001
    obligation: >-
      Management must require all personnel to apply information
      security in accordance with the established information-security
      policy, topic-specific policies, and procedures of the
      organisation. The requirement must be communicated as a
      condition of employment and reinforced through the
      awareness-and-training programme.
    status: draft
    control_refs:
      - control.risk_management_policy@v1
      - control.training_attestation@v1
    notes: >-
      A.5.4 is the management-direction anchor for personnel-level
      policy adherence — the standard requires that management not
      only publish policies (the A.5.1 anchor) but visibly require
      personnel to apply them. control.risk_management_policy@v1 is
      the policy-set anchor whose management approval and periodic
      review discipline (P1Y baseline cadence) establishes the
      direction personnel are required to follow; its oscal_refs
      block already carries ISO/IEC 27001:2022 A.5.1 as the
      policy-set surface A.5.4 references. control.training_
      attestation@v1 is the evidence anchor that personnel have
      received and acknowledged the policies and procedures relevant
      to their role — its oscal_refs block carries ISO/IEC 27001:2022
      A.6.3 (awareness and training) alongside NIST 800-53 rev5 AT-2/
      AT-3/AT-4, and the attestation surface it produces is the
      practical evidence that the management requirement has been
      communicated and accepted. Cross-regime parallels: NIS2 Art.
      20 (management-body accountability) and Art. 21(2)(g) (cyber
      hygiene and training) discharge the same management-direction
      discipline against essential and important entities; the
      regimes carry separate evidence requirements against the same
      underlying policy-and-attestation artifacts.
  - id: iso27001:a-5-5-contact-with-authorities
    regulation:
      name: ISO/IEC 27001:2022
      instrument: ISO/IEC 27001:2022 Annex A
      article: A.5.5
      url: https://www.iso.org/standard/27001
    obligation: >-
      Establish and maintain appropriate contacts with relevant
      authorities — including law-enforcement, sector supervisors,
      data-protection regulators, and CSIRTs — so that
      security-incident notifications, regulatory reporting, and
      support requests can be actioned within the applicable
      timeframes.
    status: draft
    control_refs:
      - control.crisis_communication_plan@v1
    notes: >-
      A.5.5 is the authorities-contact anchor within the Annex A.5
      organisational-controls theme — the standard requires that
      contact channels to relevant authorities be pre-established
      rather than assembled during an incident.
      control.crisis_communication_plan@v1 is the direct anchor:
      its oscal_refs block already carries ISO/IEC 27001:2022 A.5.5
      alongside DORA Article 19 (incident reporting) and the
      incident-response-plan family, and its communication surface
      (pre-agreed channels, contact directories, notification
      templates) is where the pre-established-contact discipline is
      discharged in practice. Cross-regime parallels: NIS2 Art. 23
      (incident-reporting obligations against national CSIRTs and
      competent authorities), DORA Art. 19 (major-incident reporting
      to sector supervisors), and GDPR Art. 33 (personal-data-breach
      notification to supervisory authorities) all discharge the
      same authorities-contact discipline against their own
      regime-specific notification timelines; the regimes carry
      separate evidence requirements against the same underlying
      contact-directory artifact.
  - id: iso27001:a-5-6-contact-with-special-interest-groups
    regulation:
      name: ISO/IEC 27001:2022
      instrument: ISO/IEC 27001:2022 Annex A
      article: A.5.6
      url: https://www.iso.org/standard/27001
    obligation: >-
      Maintain appropriate contacts with special interest groups,
      specialist security forums, and professional associations to
      stay current on threat intelligence, best practice, and
      information about vulnerabilities relevant to the operator's
      environment.
    status: draft
    control_refs:
      - control.crisis_communication_plan@v1
    playbook_refs:
      - playbook.threat_intel_ingest@v1
    notes: >-
      A.5.6 is the special-interest-groups-contact anchor within the
      Annex A.5 organisational-controls theme — the standard treats
      it as the operational counterpart of A.5.5, addressing
      community-level intelligence sharing rather than
      authority-level reporting.
      control.crisis_communication_plan@v1 is the anchor whose
      oscal_refs block already carries ISO/IEC 27001:2022 A.5.6
      (contact with special interest groups) alongside A.5.5; the
      communication surface it maintains covers both the authority-
      facing and the peer-community-facing channels the two controls
      address. The playbook.threat_intel_ingest@v1 CACAO playbook
      exercises the operational flow that consumes the
      community-supplied intelligence (feeds, advisories, forum
      exchanges) so that vulnerability and threat information from
      special-interest-group contacts is routed into the operator's
      detection and response surfaces. Cross-regime parallels: NIS2
      Art. 21(2)(h) (information-sharing arrangements) and DORA
      Art. 45 (financial-sector information-sharing arrangements)
      anchor the same community-contact discipline against their
      regime-specific sharing frameworks; the regimes carry separate
      evidence requirements against the same underlying
      community-contact artifact.
  - id: iso27001:a-5-7-threat-intelligence
    regulation:
      name: ISO/IEC 27001:2022
      instrument: ISO/IEC 27001:2022 Annex A
      article: A.5.7
      url: https://www.iso.org/standard/27001
    obligation: >-
      Collect and analyse information relating to information-security
      threats to produce threat intelligence. The intelligence output
      must be actionable — routed into risk-treatment decisions,
      detection engineering, and vulnerability-management prioritisation
      rather than held as a passive feed.
    status: draft
    control_refs: []
    playbook_refs:
      - playbook.threat_intel_ingest@v1
    # control_refs intentionally empty: the SecOps-NG control catalogue
    # does not yet carry a dedicated threat-intelligence-management
    # artifact as a first-class control. The operational discharge is
    # anchored on the playbook side (`playbook.threat_intel_ingest@v1`)
    # which exercises the ingest / normalisation / routing flow into
    # the detection and vulnerability surfaces; a future dedicated
    # artifact (e.g. `control.threat_intelligence_programme@v1`) would
    # replace this placeholder without changing the entry id.
    notes: >-
      A.5.7 is the threat-intelligence anchor within the Annex A.5
      organisational-controls theme — the 2022 revision introduced it
      as a new organisational control, treating threat intelligence
      as a discipline governed at the ISMS level rather than a purely
      technical activity. The community-supplied threat-intelligence
      contact surface anchored under A.5.6 feeds the discipline; A.5.7
      governs the analysis-and-routing pipeline that turns the
      inbound signal into actionable outputs. The playbook.threat_
      intel_ingest@v1 CACAO playbook is the direct operational anchor
      — its normalisation, prioritisation, and downstream-routing
      steps discharge the analyse-and-act obligation A.5.7 imposes,
      with the detection-engineering pipeline (A.8.16 anchor) and the
      vulnerability-management pipeline (A.8.8 anchor) as the two
      primary consumers.
      Cross-regime parallels: NIS2 Art. 21(2)(h) (information-sharing
      arrangements) and DORA Art. 45 (financial-sector information-
      sharing arrangements) anchor the same intelligence-flow
      discipline against their regime-specific sharing frameworks;
      the regimes carry separate evidence requirements against the
      same underlying intelligence-management artifact.
  - id: iso27001:a-5-8-isms-in-project-management
    regulation:
      name: ISO/IEC 27001:2022
      instrument: ISO/IEC 27001:2022 Annex A
      article: A.5.8
      url: https://www.iso.org/standard/27001
    obligation: >-
      Integrate information security into project management, so that
      information-security risks are identified, assessed, and treated
      as part of the project lifecycle rather than retrofitted after
      delivery. Applies to projects of any type — technical,
      organisational, and business-process change.
    status: draft
    control_refs: []
    playbook_refs: []
    # control_refs and playbook_refs intentionally empty: the SecOps-NG
    # content catalogue does not yet carry a project-management
    # integration artifact as a first-class control or playbook. A.5.8
    # is discharged in practice today against the operator's own
    # project-management framework, joined against the risk-management
    # policy anchor under A.5.1 (`control.risk_management_policy@v1`)
    # for the top-level risk discipline and the change-management
    # anchor under A.8.32 (`control.iac_policy_guardrail@v1`) for the
    # technical-change slice. A future dedicated artifact (e.g.
    # `control.project_security_integration@v1`) would replace this
    # placeholder without changing the entry id.
    notes: >-
      A.5.8 is the project-management integration anchor within the
      Annex A.5 organisational-controls theme — the 2022 revision
      consolidated the earlier project-lifecycle-security controls
      into this single obligation. The discipline is structural: the
      operator's project-management framework must include
      security-risk identification, assessment, and treatment as a
      standard step rather than an optional add-on. The A.5.1
      policy-set anchor (`control.risk_management_policy@v1`) governs
      the top-level risk discipline projects inherit; the A.8.32
      change-management anchor (`control.iac_policy_guardrail@v1`)
      governs the technical-change slice through which project
      outputs land. Cross-regime parallels: NIS2 Art. 21(2)(a)
      (policies on risk analysis and information-system security)
      and DORA Art. 6 (ICT risk management framework) anchor the
      same risk-integration discipline against their regime-specific
      scopes; the regimes carry separate evidence requirements
      against the same underlying project-governance artifact.
  - id: iso27001:a-5-9-inventory-of-assets
    regulation:
      name: ISO/IEC 27001:2022
      instrument: ISO/IEC 27001:2022 Annex A
      article: A.5.9
      url: https://www.iso.org/standard/27001
    obligation: >-
      Identify information and other associated assets and develop an
      inventory of them, including ownership assignments, so that
      protection responsibilities can be allocated and asset
      lifecycle events (acquisition, change, disposal) are tracked.
    status: draft
    control_refs:
      - control.asset_inventory_delta@v1
    playbook_refs:
      - playbook.asset_management@v1
    notes: >-
      A.5.9 is the asset-inventory anchor within the Annex A.5
      organisational-controls theme — the 2022 revision consolidated
      the earlier inventory-and-ownership obligations into this single
      control. control.asset_inventory_delta@v1 is the direct anchor:
      its oscal_refs block already carries ISO/IEC 27001:2022 A.5.9
      alongside NIST 800-53 rev5 CM-8 / CM-8(2), and its
      delta-capture surface (authoritative inventory + scheduled-
      snapshot delta so unmanaged assets surface as exceptions) is
      exactly the ownership-and-lifecycle discipline A.5.9 requires.
      The playbook.asset_management@v1 CACAO playbook is the
      operational discharge — the reconciliation-and-tagging flow
      that keeps ownership assignments current as assets move through
      their lifecycle. Cross-regime parallels: NIS2 Art. 21(2)(i)
      (human-resources security, including asset management) and
      DORA Art. 8 (ICT-asset identification and classification)
      anchor the same inventory-and-ownership discipline against
      their regime-specific scopes; the regimes carry separate
      evidence requirements against the same underlying inventory
      artifact.
  - id: iso27001:a-5-10-acceptable-use-of-assets
    regulation:
      name: ISO/IEC 27001:2022
      instrument: ISO/IEC 27001:2022 Annex A
      article: A.5.10
      url: https://www.iso.org/standard/27001
    obligation: >-
      Identify, document, and implement rules for the acceptable use
      and handling of information and other associated assets. The
      rules must be communicated to personnel and other interested
      parties who use the assets, and reviewed as the asset landscape
      and risk profile change.
    status: draft
    control_refs:
      - control.risk_management_policy@v1
    playbook_refs: []
    # playbook_refs intentionally empty: A.5.10 is a policy-set
    # obligation rather than an operational-flow one. The rules
    # discipline it imposes is discharged through the topic-specific
    # acceptable-use policy issued under the A.5.1 policy-set
    # umbrella (`control.risk_management_policy@v1`), with awareness
    # and acceptance evidence anchored under the A.5.4 management-
    # direction pair (`control.training_attestation@v1`); no dedicated
    # acceptable-use playbook is currently in the catalogue.
    notes: >-
      A.5.10 is the acceptable-use-of-assets anchor within the Annex
      A.5 organisational-controls theme — the standard treats it as
      a topic-specific policy issued under the overall policy-set
      obligation anchored at A.5.1. control.risk_management_policy@v1
      is the policy-set anchor whose management-approval and
      periodic-review discipline (P1Y baseline cadence) governs the
      acceptable-use rules issued against it; the A.5.9 asset-
      inventory pair (`control.asset_inventory_delta@v1`,
      `playbook.asset_management@v1`) is the inventory-scope surface
      the rules apply against, and the A.5.4 management-direction
      attestation evidence (`control.training_attestation@v1`)
      records that personnel have received and acknowledged the
      rules. Cross-regime parallels: NIS2 Art. 21(2)(g) (cyber
      hygiene practices) and Art. 21(2)(i) (human-resources
      security, including access-control policies) anchor the same
      acceptable-use discipline against essential and important
      entities; the regimes carry separate evidence requirements
      against the same underlying acceptable-use policy artifact.
  - id: iso27001:a-5-11-return-of-assets
    regulation:
      name: ISO/IEC 27001:2022
      instrument: ISO/IEC 27001:2022 Annex A
      article: A.5.11
      url: https://www.iso.org/standard/27001
    obligation: >-
      Ensure that personnel and other interested parties return all
      information and other associated assets in their possession
      upon termination of employment, contract, or role change. The
      obligation includes physical assets, digital credentials, and
      access to information holdings.
    status: draft
    control_refs:
      - control.jml_evidence@v1
    playbook_refs: []
    # playbook_refs intentionally empty: A.5.11 is a lifecycle-event
    # obligation discharged in practice at the leaver leg of the
    # joiner-mover-leaver flow. control.jml_evidence@v1 is the
    # evidence anchor whose lifecycle-events surface (access
    # provisioned on join, adjusted on role change, revoked on
    # departure) already carries the ISO/IEC 27001:2022 A.5.16
    # identity-management control and the NIST 800-53 rev5 PS-4
    # personnel-termination control; the physical-asset-return
    # discipline A.5.11 additionally imposes is discharged against
    # the operator's own leaver-checklist evidence (device return,
    # badge return, key return) that the JML flow references.
    notes: >-
      A.5.11 is the return-of-assets anchor within the Annex A.5
      organisational-controls theme — the standard treats it as the
      termination-time counterpart of the A.5.9 inventory-and-
      ownership obligation and the A.5.16 identity-management
      obligation. control.jml_evidence@v1 is the practical anchor:
      the leaver leg of the joiner-mover-leaver flow (access
      revocation on departure, PS-4 personnel-termination discipline
      on its oscal_refs block) is where the digital-asset-return
      discipline is discharged, and the operator's leaver-checklist
      evidence the flow references is where the physical-asset-return
      discipline is discharged. Cross-regime parallels: NIS2 Art.
      21(2)(i) (human-resources security) anchors the same
      termination-time asset-return discipline against essential and
      important entities; the regimes carry separate evidence
      requirements against the same underlying leaver-lifecycle
      artifact.
  - id: iso27001:a-5-12-classification-of-information
    regulation:
      name: ISO/IEC 27001:2022
      instrument: ISO/IEC 27001:2022 Annex A
      article: A.5.12
      url: https://www.iso.org/standard/27001
    obligation: >-
      Classify information according to the organisation's
      information-security needs, based on confidentiality, integrity,
      availability, and relevant interested-party requirements. The
      classification scheme must be documented, applied to information
      assets, and reviewed as the information landscape and risk
      profile change.
    status: draft
    control_refs: []
    playbook_refs: []
    # control_refs and playbook_refs intentionally empty: the SecOps-NG
    # content catalogue does not yet carry a dedicated
    # information-classification-scheme artifact as a first-class
    # control or playbook. A.5.12 is discharged in practice today
    # against the operator's own classification scheme, joined
    # against the A.5.9 asset-inventory anchor
    # (`control.asset_inventory_delta@v1`, `playbook.asset_management@v1`)
    # for the assets the scheme applies against, the A.5.1 policy-set
    # anchor (`control.risk_management_policy@v1`) for the top-level
    # classification-policy discipline, and the A.5.10 acceptable-use
    # anchor for the handling-rules surface that references the
    # classification labels. A.5.13 labelling of information and
    # A.5.14 information transfer land in a later batch and both
    # depend on this classification anchor. A future dedicated
    # artifact (e.g. `control.information_classification_scheme@v1`)
    # would replace this placeholder without changing the entry id.
    notes: >-
      A.5.12 is the information-classification anchor within the
      Annex A.5 organisational-controls theme — the standard treats
      it as a structural prerequisite for the labelling (A.5.13),
      handling (A.5.10 acceptable-use), and transfer (A.5.14)
      obligations that reference classification labels. The
      classification scheme itself is the operator's own artifact;
      the SecOps-NG catalogue anchors it structurally through the
      A.5.9 asset-inventory pair (the assets the scheme applies
      against), the A.5.1 policy-set anchor (the top-level
      classification-policy discipline), and the A.5.10 acceptable-
      use anchor (the handling rules that reference labels).
      Cross-regime parallels: NIS2 Art. 21(2)(i) (human-resources
      security, including data-handling rules) and GDPR Art. 5(1)(f)
      (integrity and confidentiality principle) anchor the same
      classification-and-protection discipline against their
      regime-specific scopes; the regimes carry separate evidence
      requirements against the same underlying classification-scheme
      artifact.
  - id: iso27001:a-5-13-labelling-of-information
    regulation:
      name: ISO/IEC 27001:2022
      instrument: ISO/IEC 27001:2022 Annex A
      article: A.5.13
      url: https://www.iso.org/standard/27001
    obligation: >-
      Develop and implement an appropriate set of procedures for
      information labelling in accordance with the information
      classification scheme adopted by the organisation. Labels must
      be applied consistently across the information landscape so
      that downstream handling, transfer, and access-control rules
      can key on them.
    status: draft
    control_refs: []
    playbook_refs: []
    # control_refs and playbook_refs intentionally empty: the
    # SecOps-NG content catalogue does not yet carry a dedicated
    # information-labelling artifact as a first-class control or
    # playbook. A.5.13 is discharged in practice against the
    # operator's own labelling procedures, joined against the
    # A.5.12 classification-scheme anchor (labels are the projection
    # of the classification scheme onto individual information
    # assets), the A.5.9 asset-inventory pair
    # (`control.asset_inventory_delta@v1`, `playbook.asset_management@v1`)
    # for the assets against which labels are applied, and the
    # A.5.10 acceptable-use anchor for the handling rules that key
    # on labels. A future dedicated artifact
    # (e.g. `control.information_labelling_scheme@v1`) would replace
    # this placeholder without changing the entry id.
    notes: >-
      A.5.13 is the information-labelling anchor within the Annex
      A.5 organisational-controls theme — the standard treats it as
      the projection of the A.5.12 classification scheme onto
      individual information assets, so downstream obligations that
      key on classification labels (A.5.14 information transfer,
      A.5.10 acceptable-use handling rules, A.5.15 access control)
      have a consistent identifier to reference. Labels themselves
      are an operator-side artifact; the SecOps-NG catalogue anchors
      the discipline structurally through the A.5.12 classification-
      scheme anchor (labels are meaningless without the scheme they
      project), the A.5.9 asset-inventory pair (the assets against
      which labels are applied), and the A.5.10 acceptable-use
      anchor (the handling rules that reference labels). Cross-regime
      parallels: NIS2 Art. 21(2)(i) (human-resources security,
      including data-handling rules) and GDPR Art. 5(1)(f) (integrity
      and confidentiality principle) anchor the same
      classification-and-labelling discipline against their
      regime-specific scopes; the regimes carry separate evidence
      requirements against the same underlying labelling artifact.
  - id: iso27001:a-5-14-information-transfer
    regulation:
      name: ISO/IEC 27001:2022
      instrument: ISO/IEC 27001:2022 Annex A
      article: A.5.14
      url: https://www.iso.org/standard/27001
    obligation: >-
      Establish rules, procedures, and controls for the transfer of
      information within the organisation and with external parties,
      across electronic, physical, and verbal channels. Transfer
      controls must address the confidentiality and integrity of the
      information in transit and be aligned with the classification
      of the information being transferred.
    status: draft
    control_refs:
      - control.risk_management_policy@v1
    playbook_refs: []
    # control_refs wires control.risk_management_policy@v1 as the
    # policy-set anchor that governs the topic-specific
    # information-transfer rules the operator adopts (transfer
    # agreements, secure-channel requirements, media-in-transit
    # protection). The SecOps-NG catalogue does not yet carry a
    # dedicated information-transfer artifact as a first-class
    # control; the discipline is discharged in practice against the
    # operator's own transfer procedures, joined against the A.5.13
    # labelling anchor (transfer rules key on classification
    # labels), the A.8.24 cryptography anchor
    # (`control.crypto_policy_inventory@v1`,
    # `playbook.crypto_posture_management@v1`) for the
    # confidentiality-in-transit slice, and the A.5.20 supplier-
    # relationships anchor (future batch) for the external-party
    # transfer-agreement slice. playbook_refs is intentionally
    # empty: information transfer is a policy-set discipline rather
    # than a single operational flow; the crypto-posture playbook
    # already anchored under A.8.24 exercises the technical slice
    # that carries a subset of the transfer surface.
    notes: >-
      A.5.14 is the information-transfer anchor within the Annex
      A.5 organisational-controls theme — the 2022 revision
      consolidated the earlier transfer-agreement and
      media-in-transit obligations into this single control.
      control.risk_management_policy@v1 is the policy-set anchor
      the operator's transfer-rules discipline hangs against; the
      topic-specific transfer procedures are the operator's own
      artifact but sit inside the policy-set governance the anchor
      names. Cross-regime parallels: NIS2 Art. 21(2)(g) (basic
      cyber-hygiene practices, including data-in-transit
      protection) and GDPR Art. 32 (security of processing,
      including transfer safeguards) anchor the same
      transfer-protection discipline against their regime-specific
      scopes; the regimes carry separate evidence requirements
      against the same underlying transfer-rules artifact.
  - id: iso27001:a-5-15-access-control
    regulation:
      name: ISO/IEC 27001:2022
      instrument: ISO/IEC 27001:2022 Annex A
      article: A.5.15
      url: https://www.iso.org/standard/27001
    obligation: >-
      Establish and implement rules to control physical and logical
      access to information and other associated assets, based on
      the business and information-security requirements of the
      organisation. The access-control rules must be topic-specific,
      documented, and reviewed as the business and threat landscape
      change.
    status: draft
    control_refs:
      - control.access_enforcement@v1
      - control.least_privilege@v1
    playbook_refs:
      - playbook.iam_auditor@v1
    notes: >-
      A.5.15 is the access-control anchor within the Annex A.5
      organisational-controls theme — the standard treats it as the
      umbrella obligation that governs the topic-specific access
      rules an operator adopts across information, systems, and
      other associated assets. control.access_enforcement@v1 (its
      oscal_refs block already carries ISO/IEC 27001:2022 A.5.15
      alongside A.8.3) and control.least_privilege@v1 (also
      carrying A.5.15 on its oscal_refs block) are the direct
      anchors: access-enforcement carries the point-of-access rule
      evaluation, least-privilege carries the entitlement-shaping
      discipline that keeps the rules minimal. The
      playbook.iam_auditor@v1 CACAO playbook is the operational
      discharge — the periodic identity-and-access review that keeps
      the rules current as roles change. Cross-regime parallels:
      NIS2 Art. 21(2)(i) (human-resources security, including
      access-control rules) and DORA Art. 9 (identification and
      classification of ICT-supported business functions, including
      access-control rules) anchor the same access-control
      discipline against their regime-specific scopes; the regimes
      carry separate evidence requirements against the same
      underlying access-enforcement and least-privilege artifacts.
  - id: iso27001:a-5-16-identity-management
    regulation:
      name: ISO/IEC 27001:2022
      instrument: ISO/IEC 27001:2022 Annex A
      article: A.5.16
      url: https://www.iso.org/standard/27001
    obligation: >-
      Manage the full lifecycle of identities so that only
      authorised principals hold accounts, entitlements track the
      current role of the principal, and dormant or terminated
      identities are removed. The lifecycle covers human, service,
      and non-person identities and their joiner, mover, and leaver
      transitions.
    status: draft
    control_refs:
      - control.jml_evidence@v1
      - control.account_management@v1
    playbook_refs:
      - playbook.onboarding_offboarding_tracker@v1
      - playbook.iam_auditor@v1
    notes: >-
      A.5.16 is the identity-management anchor within the Annex
      A.5 organisational-controls theme — the standard treats it as
      the full-lifecycle obligation covering account creation,
      modification, and revocation across the joiner-mover-leaver
      transitions. control.jml_evidence@v1 (its oscal_refs block
      already carries ISO/IEC 27001:2022 A.5.16 alongside NIST
      800-53 rev5 PS-4 personnel-termination) and
      control.account_management@v1 (also carrying A.5.16 on its
      oscal_refs block) are the direct anchors: jml_evidence
      carries the lifecycle-events surface (access provisioned on
      join, adjusted on role change, revoked on departure),
      account_management carries the account-inventory and
      dormancy-detection discipline. The
      playbook.onboarding_offboarding_tracker@v1 CACAO playbook is
      the operational join-and-leaver discharge, and
      playbook.iam_auditor@v1 is the periodic identity-and-access
      review that keeps the account surface current between
      lifecycle events. Cross-regime parallels: NIS2 Art. 21(2)(i)
      (human-resources security, including identity-lifecycle
      controls) and DORA Art. 9 (identification and classification
      of ICT-supported business functions, including identity
      management) anchor the same identity-lifecycle discipline
      against their regime-specific scopes; the regimes carry
      separate evidence requirements against the same underlying
      JML and account-management artifacts.
  - id: iso27001:a-5-17-authentication-information
    regulation:
      name: ISO/IEC 27001:2022
      instrument: ISO/IEC 27001:2022 Annex A
      article: A.5.17
      url: https://www.iso.org/standard/27001
    obligation: >-
      Control the allocation and management of authentication
      information (passwords, keys, tokens, biometric enrolments)
      through documented procedures for generation, distribution,
      storage, replacement, and revocation. Users and services must
      be advised of their obligations for safeguarding
      authentication information.
    status: draft
    control_refs: []
    playbook_refs: []
    # control_refs and playbook_refs intentionally empty: the
    # SecOps-NG content catalogue does not yet carry a dedicated
    # authentication-information-management artifact as a
    # first-class control or playbook. A.5.17 is discharged in
    # practice against the operator's own credential-management
    # procedures, joined against the A.8.5 secure-authentication
    # anchor (`control.mfa_state_probe@v1`,
    # `control.service_identification_authentication@v1`,
    # `playbook.mfa_secured_comms@v1`) for the enforcement-side
    # surface that consumes the authentication information, the
    # A.8.24 cryptography anchor
    # (`control.key_rotation_evidence@v1`,
    # `playbook.crypto_posture_management@v1`) for the key-material
    # slice of the credential surface, and the A.5.1 policy-set
    # anchor (`control.risk_management_policy@v1`) for the
    # top-level credential-handling policy. A future dedicated
    # artifact (e.g. `control.credential_management@v1`) would
    # replace this placeholder without changing the entry id.
    notes: >-
      A.5.17 is the authentication-information-management anchor
      within the Annex A.5 organisational-controls theme — the
      standard treats it as the credential-lifecycle counterpart
      to the A.5.16 identity-lifecycle obligation and the A.8.5
      secure-authentication enforcement obligation. The
      credential-management procedures themselves are the
      operator's own artifact; the SecOps-NG catalogue anchors
      the discipline structurally through the A.8.5
      authentication-enforcement anchors (which exercise the
      credentials once they exist), the A.8.24 cryptography
      anchor (which governs the key-material slice), and the
      A.5.1 policy-set anchor (the top-level credential-handling
      policy). Cross-regime parallels: NIS2 Art. 21(2)(i)
      (human-resources security, including access-credential
      handling) and DORA Art. 9 (identification and
      classification, including authentication-information
      management) anchor the same credential-lifecycle
      discipline against their regime-specific scopes; the
      regimes carry separate evidence requirements against the
      same underlying credential-management artifact.
  - id: iso27001:a-5-18-access-rights
    regulation:
      name: ISO/IEC 27001:2022
      instrument: ISO/IEC 27001:2022 Annex A
      article: A.5.18
      url: https://www.iso.org/standard/27001
    obligation: >-
      Provision, review, modify, and remove access rights to
      information and other associated assets in accordance with
      the organisation's topic-specific policy on and rules for
      access control. Access rights must track the current role of
      the principal and be removed when no longer required.
    status: draft
    control_refs:
      - control.cloud_identity_least_privilege@v1
      - control.privileged_access_review@v1
    playbook_refs:
      - playbook.iam_auditor@v1
      - playbook.onboarding_offboarding_tracker@v1
    notes: >-
      A.5.18 is the access-rights anchor within the Annex A.5
      organisational-controls theme — the standard treats it as
      the entitlement-lifecycle counterpart to the A.5.15 access-
      control umbrella (which defines the rules) and the A.5.16
      identity-management obligation (which manages the principals
      the rights attach to). control.cloud_identity_least_privilege@v1
      (its oscal_refs block already carries ISO/IEC 27001:2022
      A.5.18 alongside A.5.15) is the direct anchor: its
      least-privilege posture-check surface is exactly the
      provision-review-modify-remove discipline A.5.18 imposes on
      cloud-identity entitlements. control.privileged_access_review@v1
      is the review-side anchor for the elevated-entitlement slice.
      The playbook.iam_auditor@v1 CACAO playbook is the periodic
      review discharge, and playbook.onboarding_offboarding_tracker@v1
      is the lifecycle-event discharge that provisions on join and
      removes on leave. Cross-regime parallels: NIS2 Art. 21(2)(i)
      (human-resources security, including entitlement lifecycle)
      and DORA Art. 9 (identification and classification, including
      access-rights management) anchor the same entitlement-
      lifecycle discipline against their regime-specific scopes;
      the regimes carry separate evidence requirements against the
      same underlying least-privilege and privileged-access-review
      artifacts.
