        article: "Annex I §1(j)"
        entry_id: cra:annex-i-1-attack-surface
    status: draft
    notes: >-
      CRA Annex I §1(j) requires shipping the product with attack surface
      limited to what is necessary. `AssetInventory` is the primary D3FEND
      anchor on `control.asset_inventory_delta@v1`, capturing dated delta
      against the declared inventory of exposed components.

  - id: d3fend:cra:annex-i-1-attack-surface:software-inventory
