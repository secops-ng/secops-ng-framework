      CRA Annex I §2(5) requires manufacturers to put in place and enforce a
      policy on coordinated vulnerability disclosure.
      `IncidentResponseAnalysis` is the D3FEND anchor on
      `control.vuln_disclosure_intake@v1`, modelling the intake-and-triage arm
