    notes: >-
      CRA Annex I §1(h) requires protection of availability of essential
      functions including via backup arrangements. `DiskEncryption` is the
      D3FEND anchor on `control.backup_attestation@v1`, modelling the at-rest
      protection of backup media that the attestation verifies.

