# D3FEND techniques anchored to CRA obligations.
#
# CORE — near-complete crosswalk of D3FEND defensive techniques against
# CRA Annex I §1 (essential cybersecurity), Annex I §2 (vulnerability
# handling), Art. 13 (manufacturer obligations), and Art. 14 (incident
# and vulnerability reporting). One entry per (CRA article entry,
# D3FEND technique) pair. Each entry round-trips through
# `regulation_refs.entry_id` to a real entry under
# content/mappings/cra/, and each `control_refs[*]` to a real file
# under content/controls/.
#
# Technique anchors are sourced from the `d3fend_refs` blocks under
# content/controls/. Entries are ordered by CRA article entry id, then
# D3FEND technique slug.
regime: d3fend
entries:
  - id: d3fend:cra:annex-i-1-access-control:local-account-monitoring
    technique:
      d3fend_id: d3f:LocalAccountMonitoring
      technique_name: Local Account Monitoring
      url: https://d3fend.mitre.org/technique/d3f:LocalAccountMonitoring/
    control_refs:
      - control.cloud_identity_least_privilege@v1
    regulation_refs:
      - regime: cra
        instrument: Regulation (EU) 2024/2847
        celex: 32024R2847
        article: "Annex I §1(d)"
        entry_id: cra:annex-i-1-access-control
    status: draft
    notes: >-
      CRA Annex I §1(d) requires identity and access management with least-
      privilege defaults. `LocalAccountMonitoring` is the D3FEND anchor on
      `control.cloud_identity_least_privilege@v1`, modelling least-privilege
      evidence against the product's IAM principals.

  - id: d3fend:cra:annex-i-1-access-control:multi-factor-authentication
    technique:
      d3fend_id: d3f:Multi-factorAuthentication
      technique_name: Multi-factor Authentication
      url: https://d3fend.mitre.org/technique/d3f:Multi-factorAuthentication/
    control_refs:
      - control.mfa_state_probe@v1
    regulation_refs:
      - regime: cra
        instrument: Regulation (EU) 2024/2847
        celex: 32024R2847
        article: "Annex I §1(d)"
        entry_id: cra:annex-i-1-access-control
    status: draft
    notes: >-
      Annex I §1(d) also covers strong authentication on privileged paths.
      `Multi-factorAuthentication` is the D3FEND anchor on
      `control.mfa_state_probe@v1`, the dated MFA-state evidence record.

