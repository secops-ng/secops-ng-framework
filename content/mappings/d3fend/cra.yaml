        entry_id: cra:annex-i-1-attack-surface
    status: draft
    notes: >-
      Annex I §1(j) extends the attack-surface obligation to declared software
      components. `SoftwareInventory` is the secondary D3FEND anchor on
      `control.asset_inventory_delta@v1`, paired with `AssetInventory` for the
      host/software split.

  - id: d3fend:cra:annex-i-1-attack-surface:system-configuration-permissions
