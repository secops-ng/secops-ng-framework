      CRA Annex I §2(2) requires manufacturers to address and remediate
      vulnerabilities without delay. `IncidentResponseAnalysis` is the D3FEND
      anchor on `control.vuln_disclosure_intake@v1`, modelling the triage path
      from disclosed vulnerability to remediation ticket.

