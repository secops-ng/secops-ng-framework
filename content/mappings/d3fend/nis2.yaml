# D3FEND techniques anchored to NIS2 obligations.
#
# CORE — near-complete crosswalk of D3FEND defensive techniques against
# NIS2 Art. 21(2)(a)-(j) risk-management measures and Art. 23(4) incident
# notification timeline. One entry per (NIS2 article entry, D3FEND
# technique) pair. Each entry round-trips through
# `regulation_refs.entry_id` to a real entry in
# content/mappings/nis2/article-21-2-*.yaml and article-23.yaml, and each
# `control_refs[*]` to a real file under content/controls/.
#
# Technique anchors are sourced from the `defensive_techniques_d3fend`
# blocks under content/controls/. Entries are ordered by NIS2 article
# entry id, then D3FEND technique slug.
regime: d3fend
entries:
  - id: d3fend:nis2:art-21-2-a:operational-activity-mapping
    technique:
      d3fend_id: d3f:OperationalActivityMapping
      technique_name: Operational Activity Mapping
      url: https://d3fend.mitre.org/technique/d3f:OperationalActivityMapping/
    control_refs:
      - control.risk_management_policy@v1
    regulation_refs:
      - regime: nis2
        instrument: Directive (EU) 2022/2555
        celex: 32022L2555
        article: "21(2)(a)"
        entry_id: nis2:art-21-2-a
    status: draft
    notes: >-
      NIS2 Art. 21(2)(a) mandates a documented risk-management policy with
      dated review. D3FEND `OperationalActivityMapping` is the defensive
      anchor named by `control.risk_management_policy@v1`, modelling the
      policy's coverage of organisational activities.

