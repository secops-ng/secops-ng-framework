        entry_id: nis2:art-21-2-b
    status: draft
    notes: >-
      NIS2 Art. 21(2)(b) requires an operational incident-handling capability.
      `IncidentResponseAnalysis` is the primary D3FEND anchor named by
      `control.incident_handling_capability@v1` and exercised by every
