        entry_id: nis2:art-21-2-b
    status: draft
    notes: >-
      Art. 21(2)(b) also covers the lessons-learned arm of incident handling.
      `ForensicAnalysis` is the second D3FEND anchor on
      `control.incident_handling_capability@v1`, used during post-incident
      review.

