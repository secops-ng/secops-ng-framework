        instrument: Regulation (EU) 2022/2554
        celex: 32022R2554
        article: "9(4)(a)"
        entry_id: dora:art-9-vuln-mgmt
    status: draft
    notes: >-
      DORA Art. 9(4)(a) — anchored to Commission Delegated Regulation (EU)
      2024/1774 Art. 10 on vulnerability and patch management — requires
      identification, assessment and remediation of vulnerabilities with
      dated evidence. D3FEND `System Configuration Permissions` exercises
      the cloud / IaC posture evidence the obligation rests on, named in
      `control.cspm_baseline@v1`, `control.iac_policy_guardrail@v1`.
