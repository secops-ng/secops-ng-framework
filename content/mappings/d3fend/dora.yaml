# D3FEND techniques anchored to DORA obligations.
#
# CORE — near-complete crosswalk of D3FEND defensive techniques against
# DORA Chapter II (Art.5-14 ICT risk-management framework), Chapter III
# (Art.17-19 ICT-related incident management and reporting) and
# Chapter V (Art.28-30 third-party ICT risk). One entry per
# (DORA article entry, D3FEND technique) pair. Each entry round-trips
# through `regulation_refs.entry_id` to a real entry under
# content/mappings/dora/, and each `control_refs[*]` to a real file
# under content/controls/.
#
# Technique anchors are sourced from the `d3fend_refs` blocks under
# content/controls/. Entries are ordered by DORA article entry id, then
# D3FEND technique slug.
#
# Coverage notes:
# - Art.15-16 (digital operational resilience testing programme,
#   TLPT prep) and Art.24-27 (TLPT execution) have no upstream control
#   with a D3FEND anchor yet and are therefore not indexed here.
# - Art.20-23 (financial-supervisory aggregation / inter-agency
#   reporting) are infrastructure-level obligations on competent
#   authorities; no operator-facing control / D3FEND anchor applies.
# - Art.29 (concentration-risk assessment) is a supervisory analysis
#   layer above the third-party register and is similarly not indexed.
regime: d3fend
entries:
  - id: d3fend:art-10-detection:network-traffic-analysis
    technique:
      d3fend_id: d3f:NetworkTrafficAnalysis
      technique_name: Network Traffic Analysis
      url: https://d3fend.mitre.org/technique/d3f:NetworkTrafficAnalysis/
    control_refs:
      - control.detection_coverage_evidence@v1
    regulation_refs:
      - regime: dora
        instrument: Regulation (EU) 2022/2554
        celex: 32022R2554
        article: "10"
        entry_id: dora:art-10-detection
    status: draft
    notes: >-
      DORA Art. 10 requires mechanisms to promptly detect anomalous
      activities, including ICT network-performance and
      ICT-related-incident detection. D3FEND `Network Traffic Analysis` is
      the detection-side defensive anchor the obligation rests on, named
      in `control.detection_coverage_evidence@v1`.

