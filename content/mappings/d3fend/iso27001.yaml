      article: A.7.9
      entry_id: iso27001:a-7-9-security-of-assets-off-premises
    status: draft
    notes: >-
      A.7.9 requires off-premises assets to be protected. `AssetInventory` is
      the D3FEND anchor on `control.asset_inventory_delta@v1`, whose asset-plane
      evidence tracks the off-premises fleet whose protection the obligation
      is discharged against.

  - id: d3fend:iso27001:a-7-9-assets-off-premises:software-inventory
    technique:
      d3fend_id: d3f:SoftwareInventory
      technique_name: Software Inventory
      url: https://d3fend.mitre.org/technique/d3f:SoftwareInventory/
    control_refs:
    - control.asset_inventory_delta@v1
    regulation_refs:
    - regime: iso27001
      instrument: ISO/IEC 27001:2022 Annex A
      article: A.7.9
      entry_id: iso27001:a-7-9-security-of-assets-off-premises
    status: draft
    notes: >-
      A.7.9's protection obligation reaches the software plane on off-premises
      assets. `SoftwareInventory` is the second D3FEND anchor on `control.asset_inventory_delta@v1`,
      covering the installed-software side of the off-premises posture.

  - id: d3fend:iso27001:a-7-10-storage-media:asset-inventory
    technique:
      d3fend_id: d3f:AssetInventory
      technique_name: Asset Inventory
      url: https://d3fend.mitre.org/technique/d3f:AssetInventory/
    control_refs:
    - control.asset_inventory_delta@v1
    regulation_refs:
    - regime: iso27001
      instrument: ISO/IEC 27001:2022 Annex A
      article: A.7.10
      entry_id: iso27001:a-7-10-storage-media
    status: draft
    notes: >-
      A.7.10 requires storage media to be managed through their lifecycle of
      acquisition, use, transportation, and disposal in accordance with the
      classification scheme and handling requirements. `AssetInventory` is the
      D3FEND anchor on `control.asset_inventory_delta@v1`, whose asset-plane
      evidence tracks the storage-media fleet under lifecycle management.

  - id: d3fend:iso27001:a-7-10-storage-media:software-inventory
    technique:
      d3fend_id: d3f:SoftwareInventory
      technique_name: Software Inventory
      url: https://d3fend.mitre.org/technique/d3f:SoftwareInventory/
    control_refs:
    - control.asset_inventory_delta@v1
    regulation_refs:
    - regime: iso27001
      instrument: ISO/IEC 27001:2022 Annex A
      article: A.7.10
      entry_id: iso27001:a-7-10-storage-media
    status: draft
    notes: >-
      A.7.10's lifecycle obligation reaches the software imprint on storage
      media. `SoftwareInventory` is the second D3FEND anchor on `control.asset_inventory_delta@v1`,
      covering the installed-software side of the storage-media posture.


  # -------------------------------------------------------------------
  # A.8 Technological controls
  # -------------------------------------------------------------------

  - id: d3fend:iso27001:a-8-1-user-endpoint-devices:asset-inventory
    technique:
      d3fend_id: d3f:AssetInventory
      technique_name: Asset Inventory
      url: https://d3fend.mitre.org/technique/d3f:AssetInventory/
    control_refs:
    - control.asset_inventory_delta@v1
    regulation_refs:
    - regime: iso27001
      instrument: ISO/IEC 27001:2022 Annex A
      article: A.8.1
      entry_id: iso27001:a-8-1-user-endpoint-devices
    status: draft
    notes: >-
      A.8.1 requires user endpoint devices (laptops, mobiles, tablets, remote-access
      clients) to be governed by a topic-specific policy backed by configuration
      and protection measures. `AssetInventory` is the D3FEND anchor on `control.asset_inventory_delta@v1`,
      which tracks the endpoint fleet whose posture the A.8.1 obligation is
      discharged against. The ISO entry itself ships with empty `control_refs`
      pending a dedicated endpoint-posture control (see the file-level note
      in annex-a-8-technological.yaml); the D3FEND crosswalk names the closest
      existing anchor.

  - id: d3fend:iso27001:a-8-2-privileged-access-rights:account-monitoring
    technique:
      d3fend_id: d3f:AccountMonitoring
      technique_name: Account Monitoring
      url: https://d3fend.mitre.org/technique/d3f:AccountMonitoring/
    control_refs:
    - control.privileged_access_review@v1
    regulation_refs:
    - regime: iso27001
      instrument: ISO/IEC 27001:2022 Annex A
      article: A.8.2
      entry_id: iso27001:a-8-2-privileged-access-rights
    status: draft
    notes: >-
      A.8.2 requires the allocation and use of privileged access rights to be
      restricted and managed. `AccountMonitoring` is the D3FEND anchor on `control.privileged_access_review@v1`,
      whose periodic-review evidence carries the discipline the privileged-rights
      obligation is measured against.

  - id: d3fend:iso27001:a-8-2-privileged-access-rights:local-account-monitoring
    technique:
      d3fend_id: d3f:LocalAccountMonitoring
      technique_name: Local Account Monitoring
      url: https://d3fend.mitre.org/technique/d3f:LocalAccountMonitoring/
    control_refs:
    - control.account_management@v1
    regulation_refs:
    - regime: iso27001
      instrument: ISO/IEC 27001:2022 Annex A
      article: A.8.2
      entry_id: iso27001:a-8-2-privileged-access-rights
    status: draft
    notes: >-
      A.8.2's restriction obligation reaches the local-account posture where
      privileged rights land at the system boundary. `LocalAccountMonitoring`
      is the D3FEND anchor on `control.account_management@v1`, covering the
      system-account side of the privileged-rights discipline.

  - id: d3fend:iso27001:a-8-2-privileged-access-rights:local-file-permissions
    technique:
      d3fend_id: d3f:LocalFilePermissions
      technique_name: Local File Permissions
      url: https://d3fend.mitre.org/technique/d3f:LocalFilePermissions/
    control_refs:
    - control.least_privilege@v1
    regulation_refs:
    - regime: iso27001
      instrument: ISO/IEC 27001:2022 Annex A
      article: A.8.2
      entry_id: iso27001:a-8-2-privileged-access-rights
    status: draft
    notes: >-
      A.8.2's discipline over privileged rights is enacted at the least-privilege
      object boundary. `LocalFilePermissions` is the D3FEND anchor on `control.least_privilege@v1`,
      tracking the object-level permission posture that discharges the minimum-necessary-privilege
      side of A.8.2.

  - id: d3fend:iso27001:a-8-3-information-access-restriction:access-mediation
    technique:
      d3fend_id: d3f:AccessMediation
      technique_name: Access Mediation
      url: https://d3fend.mitre.org/technique/d3f:AccessMediation/
    control_refs:
    - control.access_enforcement@v1
    regulation_refs:
    - regime: iso27001
      instrument: ISO/IEC 27001:2022 Annex A
      article: A.8.3
      entry_id: iso27001:a-8-3-information-access-restriction
    status: draft
    notes: >-
      A.8.3 requires access to information and other associated assets to be
      restricted in accordance with the established topic-specific policy on
      access control. `AccessMediation` is the D3FEND anchor on `control.access_enforcement@v1`,
      which carries the evidence that the restriction is enforced at request
      time by the authorisation plane.

  - id: d3fend:iso27001:a-8-3-information-access-restriction:local-file-permissions
    technique:
      d3fend_id: d3f:LocalFilePermissions
      technique_name: Local File Permissions
      url: https://d3fend.mitre.org/technique/d3f:LocalFilePermissions/
    control_refs:
    - control.least_privilege@v1
    regulation_refs:
    - regime: iso27001
      instrument: ISO/IEC 27001:2022 Annex A
      article: A.8.3
      entry_id: iso27001:a-8-3-information-access-restriction
    status: draft
    notes: >-
      A.8.3's restriction obligation is enacted at the object boundary through
      least-privilege assignments. `LocalFilePermissions` is the D3FEND anchor
      on `control.least_privilege@v1`, tracking the object-level permission
      posture the restriction is discharged against.

  - id: d3fend:iso27001:a-8-5-secure-authentication:certificate-based-authentication
    technique:
      d3fend_id: d3f:Certificate-basedAuthentication
      technique_name: Certificate-based Authentication
      url: https://d3fend.mitre.org/technique/d3f:Certificate-basedAuthentication/
    control_refs:
    - control.service_identification_authentication@v1
    regulation_refs:
    - regime: iso27001
      instrument: ISO/IEC 27001:2022 Annex A
      article: A.8.5
      entry_id: iso27001:a-8-5-secure-authentication
    status: draft
    notes: >-
      A.8.5 requires strong authentication techniques proportionate to the classification
      of the information and the risk of the access channel — reaching non-human
      identities (services, workloads) alongside users. `Certificate-basedAuthentication`
      is the D3FEND anchor on `control.service_identification_authentication@v1`,
      covering the service/workload-identity side of the obligation.

  - id: d3fend:iso27001:a-8-5-secure-authentication:multi-factor-authentication
    technique:
      d3fend_id: d3f:Multi-factorAuthentication
      technique_name: Multi-factor Authentication
      url: https://d3fend.mitre.org/technique/d3f:Multi-factorAuthentication/
    control_refs:
    - control.mfa_state_probe@v1
    regulation_refs:
    - regime: iso27001
      instrument: ISO/IEC 27001:2022 Annex A
      article: A.8.5
      entry_id: iso27001:a-8-5-secure-authentication
    status: draft
    notes: >-
      A.8.5's requirement for strong authentication techniques is anchored by
      MFA on the user-identity plane. `Multi-factorAuthentication` is the D3FEND
      technique on `control.mfa_state_probe@v1`, whose posture probe carries
      the evidence that MFA is enrolled and active across the in-scope identity
      fleet.

  - id: d3fend:iso27001:a-8-8-management-of-technical-vulnerabilities:incident-response-analysis
    technique:
      d3fend_id: d3f:IncidentResponseAnalysis
      technique_name: Incident Response Analysis
      url: https://d3fend.mitre.org/technique/d3f:IncidentResponseAnalysis/
    control_refs:
    - control.vuln_disclosure_intake@v1
    regulation_refs:
    - regime: iso27001
      instrument: ISO/IEC 27001:2022 Annex A
      article: A.8.8
      entry_id: iso27001:a-8-8-management-of-technical-vulnerabilities
    status: draft
    notes: >-
      A.8.8 covers not only patch discipline but also the intake side of the
      vulnerability lifecycle — a coordinated channel for external reports feeding
      triage. `IncidentResponseAnalysis` is the D3FEND anchor on `control.vuln_disclosure_intake@v1`,
      which models the analysis pipeline that receives disclosed vulnerabilities
      and routes them into remediation.

  - id: d3fend:iso27001:a-8-8-management-of-technical-vulnerabilities:software-update
    technique:
      d3fend_id: d3f:SoftwareUpdate
      technique_name: Software Update
      url: https://d3fend.mitre.org/technique/d3f:SoftwareUpdate/
    control_refs:
    - control.patch_evidence@v1
    regulation_refs:
    - regime: iso27001
      instrument: ISO/IEC 27001:2022 Annex A
      article: A.8.8
      entry_id: iso27001:a-8-8-management-of-technical-vulnerabilities
    status: draft
    notes: >-
      A.8.8 mandates timely management of technical vulnerabilities, including
      receipt of information, evaluation of exposure, and appropriate remediation.
      `SoftwareUpdate` is the D3FEND anchor on `control.patch_evidence@v1`,
      which carries the dated evidence that security updates are produced and
      disseminated for the declared support window.

  - id: d3fend:iso27001:a-8-9-configuration-management:system-configuration-permissions
    technique:
      d3fend_id: d3f:SystemConfigurationPermissions
      technique_name: System Configuration Permissions
      url: https://d3fend.mitre.org/technique/d3f:SystemConfigurationPermissions/
    control_refs:
    - control.configuration_settings@v1
    - control.baseline_configuration@v1
    - control.iac_policy_guardrail@v1
    regulation_refs:
    - regime: iso27001
      instrument: ISO/IEC 27001:2022 Annex A
      article: A.8.9
      entry_id: iso27001:a-8-9-configuration-management
    status: draft
    notes: >-
      A.8.9 requires configurations, including security configurations, of hardware,
      software, services, and networks to be established, documented, implemented,
      monitored, and reviewed. `SystemConfigurationPermissions` is the D3FEND
      anchor on `control.configuration_settings@v1`, `control.baseline_configuration@v1`,
      and `control.iac_policy_guardrail@v1`, which together carry the settings,
      baselines, and policy guardrails the configuration-management obligation
      is enacted against.

  - id: d3fend:iso27001:a-8-13-information-backup:disk-encryption
    technique:
      d3fend_id: d3f:DiskEncryption
      technique_name: Disk Encryption
      url: https://d3fend.mitre.org/technique/d3f:DiskEncryption/
    control_refs:
    - control.backup_attestation@v1
    regulation_refs:
    - regime: iso27001
      instrument: ISO/IEC 27001:2022 Annex A
      article: A.8.13
      entry_id: iso27001:a-8-13-information-backup
    status: draft
    notes: >-
      A.8.13's backup obligation reaches the confidentiality arm of backup media
      alongside restore-testing. `DiskEncryption` is the D3FEND anchor on `control.backup_attestation@v1`,
      whose attested-backup evidence carries the encryption-at-rest side of
      the backup-media posture.

  - id: d3fend:iso27001:a-8-13-information-backup:system-recovery-analysis
    technique:
      d3fend_id: d3f:SystemRecoveryAnalysis
      technique_name: System Recovery Analysis
      url: https://d3fend.mitre.org/technique/d3f:SystemRecoveryAnalysis/
    control_refs:
    - control.restore_drill@v1
    regulation_refs:
    - regime: iso27001
      instrument: ISO/IEC 27001:2022 Annex A
      article: A.8.13
      entry_id: iso27001:a-8-13-information-backup
    status: draft
    notes: >-
      A.8.13 requires backups of information, software, and systems taken and
      tested regularly in accordance with an agreed topic-specific policy. `SystemRecoveryAnalysis`
      is the D3FEND anchor on `control.restore_drill@v1`, whose evidence of
      tested restores discharges the "backup that actually restores" arm of
      the A.8.13 obligation.

  - id: d3fend:iso27001:a-8-16-monitoring-activities:network-traffic-analysis
    technique:
      d3fend_id: d3f:NetworkTrafficAnalysis
      technique_name: Network Traffic Analysis
      url: https://d3fend.mitre.org/technique/d3f:NetworkTrafficAnalysis/
    control_refs:
    - control.detection_coverage_evidence@v1
    regulation_refs:
    - regime: iso27001
      instrument: ISO/IEC 27001:2022 Annex A
      article: A.8.16
      entry_id: iso27001:a-8-16-monitoring-activities
    status: draft
    notes: >-
      A.8.16 requires networks, systems, and applications to be monitored for
      anomalous behaviour and appropriate actions taken to evaluate potential
      information-security incidents. `NetworkTrafficAnalysis` is the D3FEND
      anchor on `control.detection_coverage_evidence@v1`, covering the network-plane
      side of the monitoring obligation.

  - id: d3fend:iso27001:a-8-16-monitoring-activities:user-behavior-analysis
    technique:
      d3fend_id: d3f:UserBehaviorAnalysis
      technique_name: User Behavior Analysis
      url: https://d3fend.mitre.org/technique/d3f:UserBehaviorAnalysis/
    control_refs:
    - control.detection_coverage_evidence@v1
    regulation_refs:
    - regime: iso27001
      instrument: ISO/IEC 27001:2022 Annex A
      article: A.8.16
      entry_id: iso27001:a-8-16-monitoring-activities
    status: draft
    notes: >-
      A.8.16's monitoring obligation reaches identity-plane anomalies alongside
      network-plane ones. `UserBehaviorAnalysis` is the second D3FEND anchor
      on `control.detection_coverage_evidence@v1`, covering the user/identity
      side of the monitoring obligation.

  - id: d3fend:iso27001:a-8-24-use-of-cryptography:certificate-analysis
    technique:
      d3fend_id: d3f:CertificateAnalysis
      technique_name: Certificate Analysis
      url: https://d3fend.mitre.org/technique/d3f:CertificateAnalysis/
    control_refs:
    - control.cert_posture_scan@v1
    regulation_refs:
    - regime: iso27001
      instrument: ISO/IEC 27001:2022 Annex A
      article: A.8.24
      entry_id: iso27001:a-8-24-use-of-cryptography
    status: draft
    notes: >-
      A.8.24's cryptography obligation reaches the certificate estate alongside
      key management. `CertificateAnalysis` is the D3FEND anchor on `control.cert_posture_scan@v1`,
      whose posture-scan evidence carries the certificate-lifecycle side of
      the cryptography obligation.

  - id: d3fend:iso27001:a-8-24-use-of-cryptography:key-management
    technique:
      d3fend_id: d3f:KeyManagement
      technique_name: Key Management
      url: https://d3fend.mitre.org/technique/d3f:KeyManagement/
    control_refs:
    - control.crypto_policy_inventory@v1
    - control.key_rotation_evidence@v1
    regulation_refs:
    - regime: iso27001
      instrument: ISO/IEC 27001:2022 Annex A
      article: A.8.24
      entry_id: iso27001:a-8-24-use-of-cryptography
    status: draft
    notes: >-
      A.8.24 requires rules for the effective use of cryptography, including
      cryptographic key management. `KeyManagement` is the D3FEND anchor on
      both `control.crypto_policy_inventory@v1` (policy inventory of algorithms
      and key uses) and `control.key_rotation_evidence@v1` (dated evidence of
      rotation cadence), which together discharge the key-lifecycle arm of A.8.24.

  - id: d3fend:iso27001:a-8-30-outsourced-development:software-inventory
    technique:
      d3fend_id: d3f:SoftwareInventory
      technique_name: Software Inventory
      url: https://d3fend.mitre.org/technique/d3f:SoftwareInventory/
    control_refs:
    - control.sbom_capture@v1
    regulation_refs:
    - regime: iso27001
