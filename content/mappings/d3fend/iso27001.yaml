      article: A.8.30
      entry_id: iso27001:a-8-30-outsourced-development
    status: draft
    notes: >-
      A.8.30 requires the operator to direct, monitor, and review the activities
      related to outsourced system development. `SoftwareInventory` is the D3FEND
      anchor on `control.sbom_capture@v1`, whose SBOM discipline carries the
      software-composition evidence the operator uses to monitor artifacts produced
      by outsourced development.

  - id: d3fend:iso27001:a-8-32-change-management:system-configuration-permissions
    technique:
      d3fend_id: d3f:SystemConfigurationPermissions
      technique_name: System Configuration Permissions
