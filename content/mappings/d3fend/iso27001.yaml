# D3FEND techniques anchored to ISO/IEC 27001:2022 Annex A controls.
#
# CORE — broadens the SKELETON crosswalk (PR #704) from a
# representative slice into coverage across all four Annex A themes,
# using only D3FEND technique IDs that already appear in the
# `d3fend_refs` blocks of controls under `content/controls/`. No IDs
# invented.
#
# Coverage by theme:
#
#   * A.5 organisational  — anchored A.5.1, A.5.2, A.5.9, A.5.14,
#     A.5.15, A.5.16, A.5.18, A.5.19, A.5.21, A.5.23, A.5.24, A.5.26,
#     A.5.27, A.5.30.
#   * A.6 people          — anchored A.6.1, A.6.3, A.6.5, A.6.8.
#   * A.7 physical        — anchored A.7.9, A.7.10.
#   * A.8 technological   — anchored A.8.1, A.8.2, A.8.3, A.8.5, A.8.8,
#     A.8.9, A.8.13, A.8.16, A.8.24, A.8.30, A.8.32.
#
# Coverage gaps intentionally left open (contributor-friendly follow-ups):
#
#   * A.5.7 (threat intelligence), A.5.8 (ISMS in project management),
#     A.5.12 (classification of information), A.5.37 (documented
#     operating procedures) — the underlying Annex A entries carry
#     empty `control_refs`; no anchored control yet exists to name a
#     D3FEND technique. Adding a control anchor is a pre-requisite.
#   * A.7.1 (physical security perimeters), A.7.4 (physical security
#     monitoring), A.7.8 (equipment siting and protection), A.7.14
#     (secure disposal or re-use of equipment) — same reason.
#     A.7 coverage lands through A.7.9 (assets off-premises) and A.7.10
#     (storage media), whose Annex A entries do carry `control_refs`.
#   * A.6.7 (remote working) — the Annex A entry lists three usable
#     controls; deferred to a next sibling to keep this CORE tier
#     focused on the priority arms of each theme.
#   * A.8.18 through A.8.22 — pending PR #664 in the framework repo.
#     Skipped here per the CORE card's guidance to avoid conflict with
#     that in-flight branch.
#
# Per-entry structure follows the SKELETON schema unchanged: each
# entry carries a `technique` block (d3fend_id, technique_name, url),
# a list of `control_refs` (stable_ids under content/controls/), and
# one or more `regulation_refs` naming a real Annex A `entry_id`.
#
# Entries are ordered by Annex A theme (A.5, A.6, A.7, A.8) and then
# by control number within each theme. All notes prose remains
# forward-public: no internal ids, contact names, credentials, or
# commercial framing.
#
# Sibling coverage in this tree:
#   * nis2.yaml       — NIS2 Art. 21(2) / Art. 23 (CORE)
#   * dora.yaml       — DORA Art. 5–14, Art. 18–19, Art. 28–30 (CORE)
#   * cra.yaml        — CRA Annex I §1 / §2 / Art. 13 / Art. 14 (CORE)
#   * gdpr.yaml       — GDPR Art. 25 / 32 / 33 / 34 / 35 (CORE)
#   * eu_ai_act.yaml  — EU AI Act Art. 6 / 9 / 11 / 13 / 72 (CORE)
regime: d3fend
entries:

  # -------------------------------------------------------------------
  # A.5 Organisational controls
  # -------------------------------------------------------------------

  - id: d3fend:iso27001:a-5-1-policies:operational-activity-mapping
    technique:
      d3fend_id: d3f:OperationalActivityMapping
      technique_name: Operational Activity Mapping
      url: https://d3fend.mitre.org/technique/d3f:OperationalActivityMapping/
    control_refs:
    - control.risk_management_policy@v1
    regulation_refs:
    - regime: iso27001
      instrument: ISO/IEC 27001:2022 Annex A
      article: A.5.1
      entry_id: iso27001:a-5-1-policies
    status: draft
    notes: >-
      A.5.1 requires an information-security policy set — the overall policy
      plus the topic-specific policies that operationalise it — approved, published,
      communicated, and reviewed at planned intervals. `OperationalActivityMapping`
      is the D3FEND anchor on `control.risk_management_policy@v1`, whose review-cadence
      field carries the periodic-review discipline A.5.1 requires.

  - id: d3fend:iso27001:a-5-2-roles-and-responsibilities:operational-activity-mapping
    technique:
      d3fend_id: d3f:OperationalActivityMapping
      technique_name: Operational Activity Mapping
      url: https://d3fend.mitre.org/technique/d3f:OperationalActivityMapping/
    control_refs:
    - control.ict_risk_governance@v1
    regulation_refs:
    - regime: iso27001
      instrument: ISO/IEC 27001:2022 Annex A
      article: A.5.2
      entry_id: iso27001:a-5-2-roles-and-responsibilities
    status: draft
    notes: >-
      A.5.2 requires information-security roles and responsibilities to be defined
      and allocated according to the operator's needs. `OperationalActivityMapping`
      is the D3FEND anchor on `control.ict_risk_governance@v1`, which carries
      the governance structure the role allocation is enacted against.

  - id: d3fend:iso27001:a-5-9-inventory-of-assets:asset-inventory
    technique:
      d3fend_id: d3f:AssetInventory
      technique_name: Asset Inventory
      url: https://d3fend.mitre.org/technique/d3f:AssetInventory/
    control_refs:
    - control.asset_inventory_delta@v1
    regulation_refs:
    - regime: iso27001
      instrument: ISO/IEC 27001:2022 Annex A
      article: A.5.9
      entry_id: iso27001:a-5-9-inventory-of-assets
    status: draft
    notes: >-
      A.5.9 requires an inventory of information and associated assets, including
      owners, to be developed and maintained. `AssetInventory` is the D3FEND
      anchor on `control.asset_inventory_delta@v1`, which carries the dated
      evidence of inventory drift on the asset plane.

  - id: d3fend:iso27001:a-5-9-inventory-of-assets:software-inventory
    technique:
      d3fend_id: d3f:SoftwareInventory
      technique_name: Software Inventory
      url: https://d3fend.mitre.org/technique/d3f:SoftwareInventory/
    control_refs:
    - control.asset_inventory_delta@v1
    regulation_refs:
    - regime: iso27001
      instrument: ISO/IEC 27001:2022 Annex A
      article: A.5.9
      entry_id: iso27001:a-5-9-inventory-of-assets
    status: draft
    notes: >-
      A.5.9's inventory obligation reaches the software plane alongside physical
      assets. `SoftwareInventory` is the second D3FEND anchor on `control.asset_inventory_delta@v1`,
      covering the installed-software side of the inventory obligation.

  - id: d3fend:iso27001:a-5-14-information-transfer:operational-activity-mapping
    technique:
      d3fend_id: d3f:OperationalActivityMapping
      technique_name: Operational Activity Mapping
      url: https://d3fend.mitre.org/technique/d3f:OperationalActivityMapping/
    control_refs:
    - control.risk_management_policy@v1
    regulation_refs:
    - regime: iso27001
      instrument: ISO/IEC 27001:2022 Annex A
      article: A.5.14
      entry_id: iso27001:a-5-14-information-transfer
    status: draft
    notes: >-
      A.5.14 requires rules, procedures, or agreements for the transfer of information
      for all types of transfer facilities within the operator and to external
      parties. `OperationalActivityMapping` is the D3FEND anchor on `control.risk_management_policy@v1`,
      which carries the topic-specific-policy discipline the information-transfer
      rules are enacted under.

  - id: d3fend:iso27001:a-5-15-access-control:access-mediation
    technique:
      d3fend_id: d3f:AccessMediation
      technique_name: Access Mediation
      url: https://d3fend.mitre.org/technique/d3f:AccessMediation/
    control_refs:
    - control.access_enforcement@v1
    regulation_refs:
    - regime: iso27001
      instrument: ISO/IEC 27001:2022 Annex A
      article: A.5.15
      entry_id: iso27001:a-5-15-access-control
    status: draft
    notes: >-
      A.5.15 requires the operator to establish and enforce rules that control
      logical and physical access to information and associated assets. `AccessMediation`
      is the D3FEND anchor named by `control.access_enforcement@v1`, which carries
      the operator's evidence that the access-control rules are enforced at
      request time by the authorisation plane.

  - id: d3fend:iso27001:a-5-15-access-control:local-file-permissions
    technique:
      d3fend_id: d3f:LocalFilePermissions
      technique_name: Local File Permissions
      url: https://d3fend.mitre.org/technique/d3f:LocalFilePermissions/
    control_refs:
    - control.least_privilege@v1
    regulation_refs:
    - regime: iso27001
      instrument: ISO/IEC 27001:2022 Annex A
      article: A.5.15
      entry_id: iso27001:a-5-15-access-control
    status: draft
    notes: >-
      A.5.15's access-control umbrella covers the least-privilege obligation
      on assignments. `LocalFilePermissions` is the D3FEND anchor on `control.least_privilege@v1`,
      tracking the object-level permission posture that discharges the "minimum
      necessary access" side of the A.5.15 obligation.

  - id: d3fend:iso27001:a-5-16-identity-management:account-monitoring
    technique:
      d3fend_id: d3f:AccountMonitoring
      technique_name: Account Monitoring
      url: https://d3fend.mitre.org/technique/d3f:AccountMonitoring/
    control_refs:
    - control.jml_evidence@v1
    regulation_refs:
    - regime: iso27001
      instrument: ISO/IEC 27001:2022 Annex A
      article: A.5.16
      entry_id: iso27001:a-5-16-identity-management
    status: draft
    notes: >-
      A.5.16 requires the full lifecycle of identities to be managed. `AccountMonitoring`
      is the D3FEND anchor on `control.jml_evidence@v1`, whose joiner/mover/leaver
      evidence discharges the lifecycle side of the identity-management obligation.

  - id: d3fend:iso27001:a-5-18-access-rights:local-account-monitoring
    technique:
      d3fend_id: d3f:LocalAccountMonitoring
      technique_name: Local Account Monitoring
      url: https://d3fend.mitre.org/technique/d3f:LocalAccountMonitoring/
    control_refs:
    - control.cloud_identity_least_privilege@v1
    regulation_refs:
    - regime: iso27001
      instrument: ISO/IEC 27001:2022 Annex A
      article: A.5.18
      entry_id: iso27001:a-5-18-access-rights
    status: draft
    notes: >-
      A.5.18 requires access rights to information and other associated assets
      to be provisioned, reviewed, modified, and removed in accordance with
      the topic-specific policy on access control. `LocalAccountMonitoring`
      is the D3FEND anchor on `control.cloud_identity_least_privilege@v1`, covering
      the cloud-identity plane where least-privilege posture is observed and
      reviewed.

  - id: d3fend:iso27001:a-5-19-supplier-relationships:operational-activity-mapping
    technique:
      d3fend_id: d3f:OperationalActivityMapping
      technique_name: Operational Activity Mapping
      url: https://d3fend.mitre.org/technique/d3f:OperationalActivityMapping/
    control_refs:
    - control.supplier_inventory@v1
    - control.provider_attestation@v1
    regulation_refs:
    - regime: iso27001
      instrument: ISO/IEC 27001:2022 Annex A
      article: A.5.19
      entry_id: iso27001:a-5-19-information-security-in-supplier-relationships
    status: draft
    notes: >-
      A.5.19 requires processes and procedures to be defined and implemented
      to manage the information-security risks associated with the use of suppliers'
      products or services. `OperationalActivityMapping` is the D3FEND anchor
      on `control.supplier_inventory@v1` and `control.provider_attestation@v1`,
      which together carry the supplier register and the attestation trail the
      A.5.19 obligation is enacted against.

  - id: d3fend:iso27001:a-5-21-ict-supply-chain:software-inventory
    technique:
      d3fend_id: d3f:SoftwareInventory
      technique_name: Software Inventory
      url: https://d3fend.mitre.org/technique/d3f:SoftwareInventory/
    control_refs:
    - control.sbom_capture@v1
    regulation_refs:
    - regime: iso27001
      instrument: ISO/IEC 27001:2022 Annex A
      article: A.5.21
      entry_id: iso27001:a-5-21-managing-information-security-in-the-ict-supply-chain
    status: draft
    notes: >-
      A.5.21 requires processes and procedures to be defined and implemented
      to manage the information-security risks associated with the ICT products-and-services
      supply chain. `SoftwareInventory` is the D3FEND anchor on `control.sbom_capture@v1`,
      whose SBOM discipline carries the software-composition side of the supply-chain
      obligation.

  - id: d3fend:iso27001:a-5-23-cloud-services:system-configuration-permissions
    technique:
      d3fend_id: d3f:SystemConfigurationPermissions
      technique_name: System Configuration Permissions
      url: https://d3fend.mitre.org/technique/d3f:SystemConfigurationPermissions/
    control_refs:
    - control.cspm_baseline@v1
    regulation_refs:
    - regime: iso27001
      instrument: ISO/IEC 27001:2022 Annex A
      article: A.5.23
      entry_id: iso27001:a-5-23-information-security-for-use-of-cloud-services
    status: draft
    notes: >-
      A.5.23 requires processes for acquisition, use, management, and exit from
      cloud services to be established. `SystemConfigurationPermissions` is
      the D3FEND anchor on `control.cspm_baseline@v1`, whose baseline evidence
      carries the configuration-posture side of the cloud-use obligation.

  - id: d3fend:iso27001:a-5-24-incident-management-planning:forensic-analysis
    technique:
      d3fend_id: d3f:ForensicAnalysis
      technique_name: Forensic Analysis
      url: https://d3fend.mitre.org/technique/d3f:ForensicAnalysis/
    control_refs:
    - control.incident_handling_capability@v1
    regulation_refs:
    - regime: iso27001
      instrument: ISO/IEC 27001:2022 Annex A
      article: A.5.24
      entry_id: iso27001:a-5-24-information-security-incident-management-planning-and-preparation
    status: draft
    notes: >-
      A.5.24's planning obligation reaches the forensic-readiness arm alongside
      response analysis. `ForensicAnalysis` is the second D3FEND anchor on `control.incident_handling_capability@v1`,
      covering the artifact-collection discipline the plan must specify.

  - id: d3fend:iso27001:a-5-24-incident-management-planning:incident-response-analysis
    technique:
      d3fend_id: d3f:IncidentResponseAnalysis
      technique_name: Incident Response Analysis
      url: https://d3fend.mitre.org/technique/d3f:IncidentResponseAnalysis/
    control_refs:
    - control.incident_handling_capability@v1
    - control.incident_timeline_signals@v1
    regulation_refs:
    - regime: iso27001
      instrument: ISO/IEC 27001:2022 Annex A
      article: A.5.24
      entry_id: iso27001:a-5-24-information-security-incident-management-planning-and-preparation
    status: draft
    notes: >-
      A.5.24 requires the operator to plan and prepare for managing information-security
      incidents by defining, establishing, and communicating incident-management
      processes, roles, and responsibilities. `IncidentResponseAnalysis` is
      the D3FEND anchor on `control.incident_handling_capability@v1` and `control.incident_timeline_signals@v1`,
      which together carry the analysis capability and the dated timeline evidence
      the planning obligation is enacted against.

  - id: d3fend:iso27001:a-5-26-incident-response:incident-response-analysis
    technique:
      d3fend_id: d3f:IncidentResponseAnalysis
      technique_name: Incident Response Analysis
      url: https://d3fend.mitre.org/technique/d3f:IncidentResponseAnalysis/
    control_refs:
    - control.incident_handling_capability@v1
    - control.incident_timeline_signals@v1
    regulation_refs:
    - regime: iso27001
      instrument: ISO/IEC 27001:2022 Annex A
      article: A.5.26
      entry_id: iso27001:a-5-26-response-to-information-security-incidents
    status: draft
    notes: >-
      A.5.26 requires information-security incidents to be responded to in accordance
      with the documented procedures. `IncidentResponseAnalysis` is the D3FEND
      anchor on `control.incident_handling_capability@v1` and `control.incident_timeline_signals@v1`,
      which together carry the response capability and the dated timeline evidence
      the response obligation is discharged against.

  - id: d3fend:iso27001:a-5-27-learning-from-incidents:forensic-analysis
    technique:
      d3fend_id: d3f:ForensicAnalysis
      technique_name: Forensic Analysis
      url: https://d3fend.mitre.org/technique/d3f:ForensicAnalysis/
    control_refs:
    - control.post_incident_learning@v1
    regulation_refs:
    - regime: iso27001
      instrument: ISO/IEC 27001:2022 Annex A
      article: A.5.27
      entry_id: iso27001:a-5-27-learning-from-information-security-incidents
    status: draft
    notes: >-
      A.5.27 requires knowledge gained from information-security incidents to
      be used to strengthen and improve the information-security controls. `ForensicAnalysis`
      is the D3FEND anchor on `control.post_incident_learning@v1`, whose retrospective-artifact
      review carries the learning-loop discipline the obligation calls for.

  - id: d3fend:iso27001:a-5-30-ict-readiness-business-continuity:system-recovery-analysis
    technique:
      d3fend_id: d3f:SystemRecoveryAnalysis
      technique_name: System Recovery Analysis
      url: https://d3fend.mitre.org/technique/d3f:SystemRecoveryAnalysis/
    control_refs:
    - control.restore_drill@v1
    regulation_refs:
    - regime: iso27001
      instrument: ISO/IEC 27001:2022 Annex A
      article: A.5.30
      entry_id: iso27001:a-5-30-ict-readiness-for-business-continuity
    status: draft
    notes: >-
      A.5.30 requires ICT readiness to be planned, implemented, maintained,
      and tested based on business-continuity objectives and ICT-continuity
      requirements. `SystemRecoveryAnalysis` is the D3FEND anchor on `control.restore_drill@v1`,
      whose tested-restore evidence carries the ICT-recovery side of the readiness
      obligation.


  # -------------------------------------------------------------------
  # A.6 People controls
  # -------------------------------------------------------------------

  - id: d3fend:iso27001:a-6-1-screening:account-monitoring
    technique:
      d3fend_id: d3f:AccountMonitoring
      technique_name: Account Monitoring
      url: https://d3fend.mitre.org/technique/d3f:AccountMonitoring/
    control_refs:
    - control.jml_evidence@v1
    regulation_refs:
    - regime: iso27001
      instrument: ISO/IEC 27001:2022 Annex A
      article: A.6.1
      entry_id: iso27001:a-6-1-screening
    status: draft
    notes: >-
      A.6.1 requires background-verification checks on candidates to become
      personnel to be carried out prior to joining and on an ongoing basis,
      taking into consideration applicable laws, regulations, and ethics. `AccountMonitoring`
      is the D3FEND anchor on `control.jml_evidence@v1`, whose joiner-side evidence
      carries the pre-provisioning discipline the screening obligation lands
      into.

  - id: d3fend:iso27001:a-6-3-awareness:user-behavior-analysis
    technique:
      d3fend_id: d3f:UserBehaviorAnalysis
      technique_name: User Behavior Analysis
      url: https://d3fend.mitre.org/technique/d3f:UserBehaviorAnalysis/
    control_refs:
    - control.training_attestation@v1
    - control.phishing_simulation@v1
    regulation_refs:
    - regime: iso27001
      instrument: ISO/IEC 27001:2022 Annex A
      article: A.6.3
      entry_id: iso27001:a-6-3-awareness
    status: draft
    notes: >-
      A.6.3 requires personnel and, where relevant, interested parties to receive
      appropriate information-security awareness, education, and training and
      regular updates on the operator's policies. `UserBehaviorAnalysis` is
      the D3FEND anchor on `control.training_attestation@v1` and `control.phishing_simulation@v1`,
      which together carry the attestation and the exercised-response evidence
      the awareness obligation is measured against.

  - id: d3fend:iso27001:a-6-5-post-employment:account-monitoring
    technique:
      d3fend_id: d3f:AccountMonitoring
      technique_name: Account Monitoring
      url: https://d3fend.mitre.org/technique/d3f:AccountMonitoring/
    control_refs:
    - control.jml_evidence@v1
    regulation_refs:
    - regime: iso27001
      instrument: ISO/IEC 27001:2022 Annex A
      article: A.6.5
      entry_id: iso27001:a-6-5-responsibilities-after-termination-or-change-of-employment
    status: draft
    notes: >-
      A.6.5 requires information-security responsibilities and duties that remain
      valid after termination or change of employment to be defined, enforced,
      and communicated. `AccountMonitoring` is the D3FEND anchor on `control.jml_evidence@v1`,
      whose leaver-side evidence carries the offboarding discipline the post-employment
      obligation is enforced against.

  - id: d3fend:iso27001:a-6-8-event-reporting:forensic-analysis
    technique:
      d3fend_id: d3f:ForensicAnalysis
      technique_name: Forensic Analysis
      url: https://d3fend.mitre.org/technique/d3f:ForensicAnalysis/
    control_refs:
    - control.incident_handling_capability@v1
    regulation_refs:
    - regime: iso27001
      instrument: ISO/IEC 27001:2022 Annex A
      article: A.6.8
      entry_id: iso27001:a-6-8-information-security-event-reporting
    status: draft
    notes: >-
      A.6.8's reporting obligation feeds the forensic-preservation arm of the
      response capability. `ForensicAnalysis` is the second D3FEND anchor on
      `control.incident_handling_capability@v1`, covering the artifact preservation
      triggered by a reported event.

  - id: d3fend:iso27001:a-6-8-event-reporting:incident-response-analysis
    technique:
      d3fend_id: d3f:IncidentResponseAnalysis
      technique_name: Incident Response Analysis
      url: https://d3fend.mitre.org/technique/d3f:IncidentResponseAnalysis/
    control_refs:
    - control.incident_handling_capability@v1
    - control.vuln_disclosure_intake@v1
    regulation_refs:
    - regime: iso27001
      instrument: ISO/IEC 27001:2022 Annex A
      article: A.6.8
      entry_id: iso27001:a-6-8-information-security-event-reporting
    status: draft
    notes: >-
      A.6.8 requires personnel to report observed or suspected information-security
      events through appropriate channels in a timely manner. `IncidentResponseAnalysis`
      is the D3FEND anchor on `control.incident_handling_capability@v1` and
      `control.vuln_disclosure_intake@v1`, which together carry the intake and
      analysis pipeline the reported events are routed into.


  # -------------------------------------------------------------------
  # A.7 Physical controls
  # -------------------------------------------------------------------

  - id: d3fend:iso27001:a-7-9-assets-off-premises:asset-inventory
    technique:
      d3fend_id: d3f:AssetInventory
      technique_name: Asset Inventory
      url: https://d3fend.mitre.org/technique/d3f:AssetInventory/
    control_refs:
    - control.asset_inventory_delta@v1
    regulation_refs:
    - regime: iso27001
