    regulation_refs:
      - regime: eu_ai_act
        instrument: Regulation (EU) 2024/1689
        celex: 32024R1689
        article: "72"
        entry_id: eu_ai_act:art-72-post-market-monitoring
    status: draft
    notes: >-
      Art. 72(1) requires post-market monitoring to enable the provider
      to identify any need for immediate corrective action; where the
      corrective action is a software update, the update itself must
      leave a dated trail. `SoftwareUpdate` is the D3FEND anchor named
      by `control.patch_evidence@v1`, closing the corrective-action
      limb of the Art. 72 loop with machine-verifiable update
      evidence.

