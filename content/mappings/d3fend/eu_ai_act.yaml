# D3FEND techniques anchored to EU AI Act obligations.
#
# SKELETON — representative crosswalk of D3FEND defensive techniques
# against four representative EU AI Act clusters:
#
#   * Art. 9  — risk management system throughout the lifecycle of a
#     high-risk AI system;
#   * Art. 11 — technical documentation and record-keeping obligations
#     (drawn up before placing the system on the market, kept up to date);
#   * Art. 13 — transparency and provision of information to deployers;
#   * Art. 72 — post-market monitoring by providers.
#
# One entry per (EU AI Act article entry, D3FEND technique) pair. Each
# entry round-trips through `regulation_refs.entry_id` to a real entry
# under content/mappings/eu_ai_act/*.yaml, and each `control_refs[*]`
# to a real `stable_id` under content/controls/. Technique anchors are
# sourced from the `d3fend_refs` blocks of the cited controls — no
# invented ids.
#
# CORE will broaden coverage to Art. 10 (data governance), Art. 12
# (automatic recording of logs), Art. 14 (human oversight), Art. 15
# (accuracy, robustness, cybersecurity), and the Annex III use-case
# entries.
regime: d3fend
entries:
  - id: d3fend:eu_ai_act:art-9-risk-management:operational-activity-mapping
    technique:
      d3fend_id: d3f:OperationalActivityMapping
      technique_name: Operational Activity Mapping
      url: https://d3fend.mitre.org/technique/d3f:OperationalActivityMapping/
    control_refs:
      - control.risk_management_policy@v1
      - control.ict_risk_governance@v1
      - control.ict_risk_framework_review@v1
      - control.security_assessment@v1
    regulation_refs:
      - regime: eu_ai_act
        instrument: Regulation (EU) 2024/1689
        celex: 32024R1689
        article: "9"
        entry_id: eu_ai_act:art-9-risk-management
    status: draft
    notes: >-
      Art. 9 requires the provider of a high-risk AI system to establish,
      implement, document, and maintain a risk management system as a
      continuous iterative process running throughout the lifecycle.
      `OperationalActivityMapping` is the D3FEND anchor shared by the
      risk-governance controls that carry the policy layer
      (`control.risk_management_policy@v1`,
      `control.ict_risk_governance@v1`), the periodic-review layer
      (`control.ict_risk_framework_review@v1`), and the assessment
      layer (`control.security_assessment@v1`) — together modelling the
      processing activities and their risk surface that Art. 9 requires
      to be identified, evaluated, and treated.

  - id: d3fend:eu_ai_act:art-9-risk-management:incident-response-analysis
    technique:
      d3fend_id: d3f:IncidentResponseAnalysis
      technique_name: Incident Response Analysis
      url: https://d3fend.mitre.org/technique/d3f:IncidentResponseAnalysis/
    control_refs:
      - control.recurring_incident_correlator@v1
    regulation_refs:
      - regime: eu_ai_act
        instrument: Regulation (EU) 2024/1689
        celex: 32024R1689
        article: "9"
        entry_id: eu_ai_act:art-9-risk-management
    status: draft
    notes: >-
      Art. 9(2)(c) requires evaluation of risks that may emerge based on
      data gathered from the post-market monitoring system.
      `IncidentResponseAnalysis` is the D3FEND anchor named by
      `control.recurring_incident_correlator@v1`, feeding recurrent
      incident signals back into the iterative risk assessment loop.

  - id: d3fend:eu_ai_act:art-11-technical-documentation:operational-activity-mapping
    technique:
      d3fend_id: d3f:OperationalActivityMapping
      technique_name: Operational Activity Mapping
      url: https://d3fend.mitre.org/technique/d3f:OperationalActivityMapping/
    control_refs:
      - control.control_effectiveness_test@v1
      - control.provider_attestation@v1
    regulation_refs:
      - regime: eu_ai_act
        instrument: Regulation (EU) 2024/1689
        celex: 32024R1689
        article: "11"
        entry_id: eu_ai_act:art-11-technical-documentation
    status: draft
    notes: >-
      Art. 11 and Annex IV require technical documentation demonstrating
      that a high-risk AI system complies with Chapter III, Section 2 —
      including descriptions of the monitoring, functioning, and control
      of the system, and of the measures put in place.
      `OperationalActivityMapping` is the D3FEND anchor shared by
      `control.control_effectiveness_test@v1` (evidence of the control
      environment's operating effectiveness) and
      `control.provider_attestation@v1` (upstream-provider attestations
      that feed the documentation), together discharging the
      record-keeping surface of Art. 11.

  - id: d3fend:eu_ai_act:art-11-technical-documentation:asset-inventory
    technique:
      d3fend_id: d3f:AssetInventory
      technique_name: Asset Inventory
      url: https://d3fend.mitre.org/technique/d3f:AssetInventory/
    control_refs:
      - control.asset_inventory_delta@v1
    regulation_refs:
      - regime: eu_ai_act
        instrument: Regulation (EU) 2024/1689
        celex: 32024R1689
        article: "11"
        entry_id: eu_ai_act:art-11-technical-documentation
    status: draft
    notes: >-
      Annex IV(1) requires a general description of the AI system,
      including the hardware on which it is intended to run.
      `AssetInventory` is the D3FEND anchor named by
      `control.asset_inventory_delta@v1`, providing the dated inventory
      surface that keeps the Art. 11 technical documentation current as
      the underlying infrastructure changes.

  - id: d3fend:eu_ai_act:art-11-technical-documentation:software-inventory
    technique:
      d3fend_id: d3f:SoftwareInventory
      technique_name: Software Inventory
      url: https://d3fend.mitre.org/technique/d3f:SoftwareInventory/
    control_refs:
      - control.sbom_capture@v1
    regulation_refs:
      - regime: eu_ai_act
        instrument: Regulation (EU) 2024/1689
        celex: 32024R1689
        article: "11"
        entry_id: eu_ai_act:art-11-technical-documentation
    status: draft
    notes: >-
      Annex IV(2)(b) requires the technical documentation to describe
      the software components on which the AI system depends.
      `SoftwareInventory` is the D3FEND anchor named by
      `control.sbom_capture@v1`, keeping the software bill of materials
      current as a first-class artefact of the Art. 11 record.

  - id: d3fend:eu_ai_act:art-13-transparency:incident-response-analysis
    technique:
      d3fend_id: d3f:IncidentResponseAnalysis
      technique_name: Incident Response Analysis
      url: https://d3fend.mitre.org/technique/d3f:IncidentResponseAnalysis/
    control_refs:
      - control.incident_timeline_signals@v1
    regulation_refs:
      - regime: eu_ai_act
        instrument: Regulation (EU) 2024/1689
        celex: 32024R1689
        article: "13"
        entry_id: eu_ai_act:art-13-transparency
    status: draft
    notes: >-
      Art. 13 requires high-risk AI systems to be designed and developed
      such that their operation is sufficiently transparent to enable
      deployers to interpret the output and use it appropriately —
      including access to a record of the events (logs) generated
      during use. `IncidentResponseAnalysis` is the D3FEND anchor named
      by `control.incident_timeline_signals@v1`, providing the
      dated-signal evidence trail that a deployer can consult when
      interpreting an anomaly surfaced by the system.

  - id: d3fend:eu_ai_act:art-13-transparency:operational-activity-mapping
    technique:
      d3fend_id: d3f:OperationalActivityMapping
      technique_name: Operational Activity Mapping
      url: https://d3fend.mitre.org/technique/d3f:OperationalActivityMapping/
    control_refs:
      - control.training_attestation@v1
      - control.supplier_inventory@v1
    regulation_refs:
      - regime: eu_ai_act
        instrument: Regulation (EU) 2024/1689
        celex: 32024R1689
        article: "13"
        entry_id: eu_ai_act:art-13-transparency
    status: draft
    notes: >-
      Art. 13(3)(b) requires the instructions for use to identify the
      provider and describe the system's characteristics, capabilities,
      and limitations. `OperationalActivityMapping` is the D3FEND
      anchor shared by `control.training_attestation@v1` (dated
      attestations that deployer-facing personnel understand the
      system's intended purpose and limits) and
      `control.supplier_inventory@v1` (the upstream-provider surface
      identified in the transparency notice), together giving the
      Art. 13 information the operational scaffolding it names.

  - id: d3fend:eu_ai_act:art-72-post-market-monitoring:network-traffic-analysis
    technique:
      d3fend_id: d3f:NetworkTrafficAnalysis
      technique_name: Network Traffic Analysis
      url: https://d3fend.mitre.org/technique/d3f:NetworkTrafficAnalysis/
    control_refs:
      - control.detection_coverage_evidence@v1
    regulation_refs:
      - regime: eu_ai_act
        instrument: Regulation (EU) 2024/1689
        celex: 32024R1689
        article: "72"
        entry_id: eu_ai_act:art-72-post-market-monitoring
    status: draft
    notes: >-
      Art. 72 requires providers to establish and document a
      post-market monitoring system that actively and systematically
      collects, documents, and analyses relevant data on the
      performance of high-risk AI systems throughout their lifetime.
      `NetworkTrafficAnalysis` is one of the two D3FEND anchors on
      `control.detection_coverage_evidence@v1`, providing the
      network-surface telemetry that feeds the monitoring loop.

  - id: d3fend:eu_ai_act:art-72-post-market-monitoring:user-behavior-analysis
    technique:
      d3fend_id: d3f:UserBehaviorAnalysis
      technique_name: User Behavior Analysis
      url: https://d3fend.mitre.org/technique/d3f:UserBehaviorAnalysis/
    control_refs:
      - control.detection_coverage_evidence@v1
    regulation_refs:
      - regime: eu_ai_act
        instrument: Regulation (EU) 2024/1689
        celex: 32024R1689
        article: "72"
        entry_id: eu_ai_act:art-72-post-market-monitoring
    status: draft
    notes: >-
      `UserBehaviorAnalysis` is the identity-side D3FEND anchor on
      `control.detection_coverage_evidence@v1`, surfacing anomalous
      interaction patterns with the deployed high-risk system that
      Art. 72's continuous performance-monitoring obligation is
      designed to catch.

  - id: d3fend:eu_ai_act:art-72-post-market-monitoring:incident-response-analysis
    technique:
      d3fend_id: d3f:IncidentResponseAnalysis
      technique_name: Incident Response Analysis
      url: https://d3fend.mitre.org/technique/d3f:IncidentResponseAnalysis/
    control_refs:
      - control.recurring_incident_correlator@v1
      - control.incident_timeline_signals@v1
    regulation_refs:
      - regime: eu_ai_act
        instrument: Regulation (EU) 2024/1689
        celex: 32024R1689
        article: "72"
        entry_id: eu_ai_act:art-72-post-market-monitoring
    status: draft
    notes: >-
      Art. 72(1) requires the post-market monitoring system to enable
      the provider to evaluate continuous compliance and to identify
      any need for immediate corrective action.
      `IncidentResponseAnalysis` is the D3FEND anchor shared by
      `control.recurring_incident_correlator@v1` (recurrent-pattern
      surface across incidents) and
      `control.incident_timeline_signals@v1` (dated-signal trail),
      together feeding the monitoring loop with structured incident
      evidence.

  - id: d3fend:eu_ai_act:art-72-post-market-monitoring:forensic-analysis
    technique:
      d3fend_id: d3f:ForensicAnalysis
      technique_name: Forensic Analysis
      url: https://d3fend.mitre.org/technique/d3f:ForensicAnalysis/
    control_refs:
      - control.incident_handling_capability@v1
      - control.post_incident_learning@v1
    regulation_refs:
      - regime: eu_ai_act
        instrument: Regulation (EU) 2024/1689
        celex: 32024R1689
        article: "72"
        entry_id: eu_ai_act:art-72-post-market-monitoring
    status: draft
    notes: >-
      Art. 72 feeds Art. 73's serious-incident reporting obligation:
      post-market monitoring must be able to reconstruct what
      happened. `ForensicAnalysis` is the D3FEND anchor shared by
      `control.incident_handling_capability@v1` (the response
      capability itself) and `control.post_incident_learning@v1`
      (the structured retrospective), together establishing the
      substantive content the provider needs to characterise a
      post-market incident.
