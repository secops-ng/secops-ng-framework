# CRA orphan-CI assertion skip manifest.
#
# Used by `tools.lint_cra_playbook_orphans` (and the workflow at
# `.github/workflows/cra-orphan-ci.yml`) to allow a finalized playbook
# to stay without an inbound `playbook_refs:` citation under
# `content/mappings/cra/` without tripping the G-02 KRI.
#
# Each entry is a deliberate, audited exclusion. The rationale is
# committed history; the SKELETON guard rejects any entry that lacks
# the two required fields. Removing a slug from this list re-arms the
# assertion against it immediately.
#
# A slug listed here MUST refer to a directory under
# `content/playbooks/` that carries a CACAO finalization marker
# (`playbook.cacao.json` or `playbook.cacao.yaml`). Listing a
# non-finalized or non-existent slug is a hard error.

skip:
  - slug: incident_management
    rationale: >-
      Regulator-notification engine for NIS2 Art. 23 / DORA Art. 19.
      The CRA Art. 14 product-vulnerability notification chain runs
      on `vuln_intake` and stays separate by design — pinning
      `incident_management` against a CRA clause would conflate two
      distinct notification regimes. See the inline note in
      `content/playbooks/incident_management/mappings.yaml` and the
      CRA coverage table at `content/mappings/cra/COVERAGE.md`.
  - slug: ddos_response
    rationale: >-
      DDoS / availability-incident response SKELETON. CRA Annex I
      §1(h) availability of essential and basic functions has two
      existing inbound anchors —
      `cra:annex-i-1-availability` (containment lane, pinned to
      `ransomware_containment`) and
      `cra:annex-i-1-h-availability-restore-drill` (restore-drill
      lane, pinned to `backup_recovery`). A DDoS / availability-
      incident response lane against §1(h) is the natural next
      CRA edge for this playbook, but the SKELETON overlay does
      NOT pre-author the inbound entry: gap notes are separate
      cards, not scope creep on a single-purpose SKELETON PR. A
      future inbound-closure card adds the
      `cra:annex-i-1-h-availability-ddos-response` inbound entry
      and the outbound pin lands together with it. The SKELETON
      overlay at `content/playbooks/ddos_response/mappings.yaml`
      records the same gap note in its `cra: []` block.
  - slug: asset_management
    rationale: >-
      Asset and configuration management SKELETON. CRA Annex I
      §1(c) (default secure configurations) and §1(e) (protection
      from unauthorised access) are defensible upstream anchors
      for asset-management visibility against manufacturer-side
      configuration and component delivery, but the CRA's per-
      product manufacturer scope is narrower than the operator-
      side estate-wide reconciliation this playbook owns. The
      manufacturer-vs-operator scope difference needs scope-
      mapping review before a CRA inbound is authored, and the
      SKELETON overlay does NOT pre-author the inbound entry:
      gap notes are separate cards, not scope creep on a single-
      purpose SKELETON PR. A future inbound-closure card adds the
      CRA Annex I anchor against the appropriate operator-vs-
      manufacturer slice and the outbound pin lands together with
      it on the `content/playbooks/asset_management/mappings.yaml`
      overlay (`cra: []` block). Mirrors the `patch_management`
      and `ddos_response` CRA gap-note precedents.
