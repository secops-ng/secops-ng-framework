# CRA orphan-CI assertion skip manifest.
#
# Used by `tools.lint_cra_playbook_orphans` (and the workflow at
# `.github/workflows/cra-orphan-ci.yml`) to allow a finalized playbook
# to stay without an inbound `playbook_refs:` citation under
# `content/mappings/cra/` without tripping the G-02 KRI.
#
# Each entry is a deliberate, audited exclusion. The rationale is
# committed history; the SKELETON guard rejects any entry that lacks
# the two required fields. Removing a slug from this list re-arms the
# assertion against it immediately.
#
# A slug listed here MUST refer to a directory under
# `content/playbooks/` that carries a CACAO finalization marker
# (`playbook.cacao.json` or `playbook.cacao.yaml`). Listing a
# non-finalized or non-existent slug is a hard error.

skip:
  - slug: incident_management
    rationale: >-
      Regulator-notification engine for NIS2 Art. 23 / DORA Art. 19.
      The CRA Art. 14 product-vulnerability notification chain runs
      on `vuln_intake` and stays separate by design — pinning
      `incident_management` against a CRA clause would conflate two
      distinct notification regimes. See the inline note in
      `content/playbooks/incident_management/mappings.yaml` and the
      CRA coverage table at `content/mappings/cra/COVERAGE.md`.
  - slug: asset_management
    rationale: >-
      Asset and configuration management. Scope-mapping review
      against CRA Annex I was completed and concluded that no
      defensible operator-side CRA inbound exists for this
      playbook on the current substrate; this entry is therefore
      a reviewed, durable deferral rather than an open TODO.
      Clauses considered, with the reason each is manufacturer-
      scoped or already-pinned-elsewhere:
        - §1(b) secure-by-default configuration: already pinned
          to `cloud_misconfiguration` (misconfiguration
          remediation) under `cra:annex-i-1-secure-by-default` in
          annex-i-1-essential-cybersecurity.yaml and to
          `infra_posture_management` (continuous-attestation
          drift detection) under
          `cra:annex-i-1-b-secure-by-default-infra-posture`. Both
          are operator-side complements to the manufacturer's
          ship-secure obligation; adding `asset_management` would
          duplicate the §1(b) anchor and dilute the existing
          drift-detection pin.
        - §1(c) configuration security including default secure
          configuration: the manufacturer-side obligation is to
          ship the product secure-by-default; the operator-side
          continuous-attestation surface is the `infra_posture_
          management` / `cloud_misconfiguration` pair above.
          Asset reconciliation against a canonical inventory
          (the discharge this playbook owns) is structurally
          one layer below configuration evaluation — it answers
          "what is in the estate?", not "is each item configured
          to the §1(c) baseline?" — so a §1(c) pin would
          misrepresent the playbook's actual discharge.
        - §1(d) access control: already pinned to
          `iam_auditor` / `onboarding_offboarding_tracker` /
          `mfa_secured_comms` under the three
          `cra:annex-i-1-d-access-control-*` inbounds.
          Asset_management does not own an access-control
          evaluation surface; pinning it here would dilute the
          existing JML / MFA / IAM-auditor triad.
        - §1(e) protection from unauthorised access (incl.
          cryptography): already pinned to `crypto_posture_
          management` under both `cra:annex-i-1-confidentiality`
          (in annex-i-1-essential-cybersecurity.yaml) and
          `cra:annex-i-1-e-confidentiality-crypto-posture`, with
          `identity_compromise` covering the unauthorised-access
          incident lane under `cra:annex-i-1-access-control` in
          the essential-cybersecurity file. Asset visibility is
          not an unauthorised-access control; a §1(e) pin would
          misrepresent the discharge.
        - §1(l) logging and monitoring: already pinned to the
          alert-triage and detection-engineering lanes; asset
          inventory is upstream of (not part of) the security-
          monitoring discharge.
      Estate-wide asset reconciliation is materially an operator
      obligation under NIS2 Art. 21(2)(i) and DORA Art. 8(4) —
      both of which this playbook already discharges via
      `nis2:art-21-2-i-asset-management` and the DORA Art. 8
      inbound landed in #519. The CRA's product-by-product
      manufacturer scope simply has no clause that the
      operator-side inventory-reconciliation discharge maps onto
      without duplicating an existing pin. Mirrors the
      `ddos_response` and `incident_management` CRA deferral
      precedents in shape and the `patch_management` precedent
      in regulatory-axis split (operator-side reconciliation
      stays on NIS2/DORA; CRA stays on the per-product manu-
      facturer chain). Re-open the review if and when CRA
      secondary acts or guidance carve an operator-side
      inventory anchor not already covered by the pins above.
  - slug: data_subject_rights
    rationale: >-
      GDPR Chapter III data subject rights (DSR) intake and fulfilment
      lifecycle (Articles 15-22). The playbook's outbound overlay
      (`content/playbooks/data_subject_rights/mappings.yaml`)
      deliberately does not pin CRA entries: CRA Article 13/14 and
      Annex I obligations are manufacturer-side product-security
      surfaces on products with digital elements, distinct by design
      from the controller-side subject-rights fulfilment lifecycle
      GDPR Chapter III authors. Cross-pinning the DSR lifecycle under
      CRA would misrepresent the obligation surface. The GDPR inbound
      graph is closed via
      `content/mappings/gdpr/article-15-22-data-subject-rights.yaml`.
      A sibling CORE / EXTEND card revisits the CRA cross-regime
      graph if a documented interaction is authored.
  - slug: data_protection_impact_assessment
    rationale: >-
      GDPR Article 35 data protection impact assessment (DPIA)
      lifecycle. The playbook's outbound overlay
      (`content/playbooks/data_protection_impact_assessment/mappings.yaml`)
      deliberately does not pin CRA entries: CRA Article 13/14 and
      Annex I obligations are manufacturer-side product-security
      surfaces on products with digital elements, distinct by design
      from the controller-side ex-ante process obligation GDPR
      Article 35 authors. Cross-pinning the DPIA lifecycle under CRA
      would misrepresent the obligation surface. The GDPR inbound
      graph is closed via
      `content/mappings/gdpr/article-35-dpia.yaml` (Article 35(1) /
      35(3)(a) / 35(3)(b) entries). A sibling CORE / EXTEND card
      revisits the CRA cross-regime graph if a documented
      interaction is authored.

  - slug: nis2_self_assessment
    rationale: >-
      NIS2 Article 21(2) whole-Article operator self-assessment
      roll-up. The playbook's outbound overlay
      (`content/playbooks/nis2_self_assessment/mappings.yaml`)
      deliberately does not pin CRA entries: CRA Annex I is
      product-by-product manufacturer scope, and no operator-side
      whole-framework self-assessment clause on the CRA axis
      anchors against a cross-clause roll-up of the CRA obligation
      set at the same shape as NIS2 Art. 21(2). The NIS2 inbound
      graph is closed via
      `content/mappings/nis2/article-21-2-{a..j}.yaml` (each of
      the ten sub-clause atoms carries the outbound backlink).
      A sibling CORE / EXTEND card revisits the CRA cross-regime
      graph if a documented interaction is authored.

  - slug: dora_ict_risk_selfassess
    rationale: >-
      DORA Chapter II ICT risk management whole-Chapter operator
      self-assessment roll-up. The playbook's outbound overlay
      (`content/playbooks/dora_ict_risk_selfassess/mappings.yaml`)
      deliberately does not pin CRA entries: CRA Annex I is
      product-by-product manufacturer scope, and no operator-side
      whole-framework self-assessment clause on the CRA axis
      anchors against a cross-section roll-up of the CRA obligation
      set at the same shape as DORA Chapter II. The DORA inbound
      graph is closed via
      `content/mappings/dora/article-{6,7,8,10,11}.yaml` (each of
      the five Chapter II section atoms carries the outbound
      backlink). A sibling CORE / EXTEND card revisits the CRA
      cross-regime graph if a documented interaction is authored.

  - slug: agentic_threat_response
    rationale: >-
      SKELETON — agentic-threat detection and response scaffold.
      The playbook's outbound overlay
      (`content/playbooks/agentic_threat_response/mappings.yaml`)
      deliberately does not pin CRA entries at SKELETON time: the
      scaffold is the operator-side incident-response slice, not
      the manufacturer product-security surface CRA Annex I
      governs. The credential-isolation and lateral-movement
      containment steps already anchor operator-side on the
      identity_compromise / iam_auditor lane that carries the CRA
      Annex I §1(d) inbound edges. A sibling CORE / EXTEND card
      revisits the CRA cross-regime graph if a documented
      product-security interaction surfaces.

  - slug: eu_ai_act_risk_management
    rationale: >-
      EU AI Act Art. 9 provider-side risk-management lifecycle for
      high-risk AI systems. The playbook's outbound overlay
      (`content/playbooks/eu_ai_act_risk_management/mappings.yaml`,
      top-of-file scope-review block and `cra: []` array) deliberately
      does not pin CRA entries: Art. 9 is a product-lifecycle
      obligation on providers of high-risk AI systems under Regulation
      (EU) 2024/1689, while CRA Annex I is a product-security
      obligation on manufacturers of products with digital elements
      under Regulation (EU) 2024/2847. Neither CRA anchor has a
      documented interaction with the AI Act provider-side risk-
      management obligation that would justify a direct inbound edge —
      the two regimes address different product categories across
      distinct conformity-assessment surfaces, and the AI Act Art. 9
      risk-management discipline is not an Annex I §1 essential-
      cybersecurity requirement discharge. The EU AI Act inbound graph
      is closed via `content/mappings/eu_ai_act/article-09-*.yaml`
      (Art. 9(1)-(6) atoms) with sibling Art. 11 + Annex IV, Art. 13,
      and Art. 72 entries. A sibling CORE / EXTEND card revisits the
      CRA cross-regime graph once ENISA or the AI Office document a
      documented interaction (for example a manufacturer of a high-
      risk AI system embedded in a product with digital elements
      whose Art. 9 lifecycle discipline overlaps CRA Annex I §1
      essential-cybersecurity requirements on the same product
      surface). Direct DORA sibling closure: PR #689
      (F-MAP-G02-DORA eu_ai_act_risk_management skip manifest,
      squash-merged b6dc174 on 2026-07-06).

  - slug: dora_tlpt_programme
    rationale: >-
      DORA Chapter IV digital operational resilience testing (DORT)
      programme and threat-led penetration testing (TLPT) programme
      lifecycle. The playbook's outbound overlay
      (`content/playbooks/dora_tlpt_programme/mappings.yaml`)
      deliberately does not pin CRA entries: CRA Annex I is
      product-by-product manufacturer scope and does not carry an
      operator-side TLPT-programme obligation at the shape of DORA
      Art. 26. The DORA inbound graph is closed via
      `content/mappings/dora/article-24-26.yaml`. A sibling CORE /
      EXTEND card revisits the CRA cross-regime graph if a documented
      interaction is authored (for example a manufacturer-side
      product-security-testing cadence overlap on the same operator
      surface).

  - slug: dora_tpr_management
    rationale: >-
      DORA Chapter V ICT third-party risk management contract-lifecycle
      spine (onboarding pre-contractual risk assessment under
      Art. 28(4) → Art. 30(2)/(3) clause-presence check → Art. 28
      register-of-information entry → periodic review with runtime
      supply-chain-evidence drift join → Art. 28(8) exit-strategy
      attestation). The playbook's outbound overlay
      (`content/playbooks/dora_tpr_management/mappings.yaml`)
      deliberately does not pin CRA entries: CRA Annex I is
      product-by-product manufacturer scope, and no operator-side
      ICT third-party governance clause on the CRA axis anchors
      against a contract-lifecycle roll-up at the same shape as
      DORA Chapter V. The DORA inbound graph is closed via
      `content/mappings/dora/article-19-and-28.yaml`
      (`dora:art-28-third-party-register`) and
      `content/mappings/dora/article-30.yaml`
      (`dora:art-30-contractual-clauses`). A sibling CORE / EXTEND
      card revisits the CRA cross-regime graph if a documented
      interaction is authored (for example a manufacturer-side
      component due-diligence cadence overlap on the same operator
      contract surface). Mirrors the dora_ict_risk_selfassess
      CRA-axis precedent.

  - slug: business_continuity
    rationale: >-
      NIS2 Art. 21(2)(c) plan-lifecycle materialisation — event-
      driven activation of the operator's documented BCM plan
      (detect and declare, activate, isolate, failover, notify
      the competent authority on the Art. 23 significant-incident
      path, restore and verify, post-incident review). The
      playbook's outbound overlay
      (`content/playbooks/business_continuity/mappings.yaml`)
      deliberately does not pin CRA entries: CRA Annex I §1(h)
      frames availability of essential and basic functions in a
      product-security context (manufacturer-side product
      resilience) while NIS2 Art. 21(2)(c) is an operator-side
      essential/important-entity obligation surface. Cross-pinning
      the plan-lifecycle here to the CRA Annex I §1(h) anchor
      would misrepresent the scope, and the drill-lane CRA anchor
      is already pinned on the sibling backup_recovery overlay
      (`cra:annex-i-1-h-availability-restore-drill`) — adding the
      plan-lifecycle to the same CRA anchor would double-count on
      a manufacturer-side surface. Mirrors the shape of the
      backup_recovery / business_continuity split already recorded
      on the NIS2 axis (drill lane on backup_recovery, plan-
      lifecycle lane on business_continuity, both co-anchored on
      `nis2:art-21-2-c`) and the dora_ict_risk_selfassess CRA
      precedent. A sibling CORE / EXTEND card revisits the CRA
      cross-regime graph if a documented interaction is authored
      (for example a manufacturer-side product-continuity clause
      that overlaps the operator-side plan-lifecycle on the same
      surface).

  - slug: eidas2_identity_verification
    rationale: >-
      eIDAS 2.0 (Regulation (EU) 2024/1183) EUDIW identity-
      verification cycle — the operator-side access-management
      primitive that produces the dated Account Change (OCSF 3001)
      audit-evidence record gating joiner-side capability
      provisioning against a cryptographically verified PID
      credential and a resolved Level of Assurance. The playbook's
      outbound overlay
      (`content/playbooks/eidas2_identity_verification/mappings.yaml`,
      `cra: []` array with inline scope note) deliberately does not
      pin CRA entries: CRA Annex I is a product-security obligation
      on manufacturers of products with digital elements under
      Regulation (EU) 2024/2847, while EUDIW credential presentation
      by an EUDIW-enabled principal against the operator's own
      access surface is an access-management discipline downstream
      of any product-side CRA obligation. Cross-pinning the
      identity-verification cycle here to a CRA Annex I §1(d)
      access-control anchor would misrepresent the scope, and the
      operator-side access-control anchors under CRA Annex I §1(d)
      are already pinned on the sibling iam_auditor /
      onboarding_offboarding_tracker / mfa_secured_comms triad
      (`cra:annex-i-1-d-access-control-iam-auditor`,
      `cra:annex-i-1-d-access-control-jml`,
      `cra:annex-i-1-d-access-control-mfa-coverage`). Adding
      eidas2_identity_verification to any of those anchors would
      dilute the existing operator-side access-control triad on a
      manufacturer-side surface. Mirrors the dora_ict_risk_selfassess
      / dora_tpr_management CRA-axis precedents (operator-side
      access-management stays on NIS2 / DORA / GDPR; CRA stays on
      the per-product manufacturer chain). Re-open the review if
      and when the EUDIW verifier surface itself is later scoped as
      a product with digital elements under CRA (sibling G-02 card
      per the outbound-overlay footnote).
