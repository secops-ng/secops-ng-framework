# CRA — vulnerability handling (Annex I §2) and Article 14 reporting.
regime: cra
entries:
  - id: cra:annex-i-2-sbom
    regulation:
      name: CRA
      instrument: Regulation (EU) 2024/2847
      celex: 32024R2847
      article: Annex I §2(1)
      url: https://eur-lex.europa.eu/eli/reg/2024/2847/oj
    obligation: >-
      Identify and document vulnerabilities and components contained in
      the product with digital elements, including by drawing up a
      software bill of materials in a commonly used and machine-readable
      format that covers at the very least the top-level dependencies.
    status: draft
    control_refs:
      - control.sbom_capture@v1
    playbook_refs:
      - playbook.vuln_intake@v1
    metric_refs:
      - kri.releases_without_sbom@v1

  - id: cra:annex-i-2-vuln-handling
    regulation:
      name: CRA
      instrument: Regulation (EU) 2024/2847
      celex: 32024R2847
      article: Annex I §2(2)
      url: https://eur-lex.europa.eu/eli/reg/2024/2847/oj
    obligation: >-
      Address and remediate vulnerabilities without delay, including by
      providing security updates, and document the vulnerability-handling
      process throughout the support period.
    status: draft
    control_refs:
      - control.vuln_disclosure_intake@v1
    playbook_refs:
      - playbook.vuln_intake@v1
      - playbook.cra_cvd@v1
    metric_refs:
      - kpi.vuln_disclosure_sla@v1
    evidence_stream_refs:
      - vulns
    notes: >-
      Parallel DORA anchor for the same vulnerability-handling obligation
      is Art 9(4)(a) operationalised by the JC RTS on ICT risk management
      framework (Commission Delegated Regulation (EU) 2024/1774) Art 10
      — see mappings/dora/article-9-and-rts-vuln-mgmt.yaml entry
      `dora:art-9-vuln-mgmt`.

  - id: cra:annex-i-2-cvd-policy
    regulation:
      name: CRA
      instrument: Regulation (EU) 2024/2847
      celex: 32024R2847
      article: Annex I §2(5)
      url: https://eur-lex.europa.eu/eli/reg/2024/2847/oj
    obligation: >-
      Put in place and enforce a coordinated vulnerability disclosure
      policy, including a single point of contact for the receipt of
      information on vulnerabilities from any source.
    status: draft
    control_refs:
      - control.vuln_disclosure_intake@v1
    playbook_refs:
      - playbook.vuln_intake@v1
      - playbook.cra_cvd@v1
    metric_refs:
      - kri.cvd_intake_aging@v1
    evidence_stream_refs:
      - vulns

  - id: cra:annex-i-2-security-updates
    regulation:
      name: CRA
      instrument: Regulation (EU) 2024/2847
      celex: 32024R2847
      article: Annex I §2(7)
      url: https://eur-lex.europa.eu/eli/reg/2024/2847/oj
    obligation: >-
      Ensure that, where technically feasible, security updates are
      disseminated without delay and free of charge for the duration of
      the support period, accompanied by advisory messages providing
      users with the relevant information.
    status: draft
    control_refs:
      - control.patch_evidence@v1
    playbook_refs:
      - playbook.vuln_intake@v1
    metric_refs:
      - kpi.patch_disseminated_on_time@v1
    evidence_stream_refs:
      - vulns

  - id: cra:art-14-early-warning
    regulation:
      name: CRA
      instrument: Regulation (EU) 2024/2847
      celex: 32024R2847
      article: "14(1)"
      url: https://eur-lex.europa.eu/eli/reg/2024/2847/oj
    obligation: >-
      Notify the CSIRT designated as coordinator and ENISA of any
      actively exploited vulnerability contained in the product without
      undue delay, and in any event within 24 hours of becoming aware
      of it (early-warning notification).
    status: draft
    control_refs:
      - control.incident_timeline_signals@v1
      - control.cra_submission_templates@v1
    playbook_refs:
      - playbook.vuln_intake@v1
      - playbook.cra_srp_notify@v1
    metric_refs:
      - kpi.cra_early_warning_on_time@v1
    evidence_stream_refs:
      - vulns

  - id: cra:art-14-notification-72h
    regulation:
      name: CRA
      instrument: Regulation (EU) 2024/2847
      celex: 32024R2847
      article: "14(2)"
      url: https://eur-lex.europa.eu/eli/reg/2024/2847/oj
    obligation: >-
      Submit a vulnerability notification to the coordinator CSIRT and
      ENISA within 72 hours of becoming aware of the actively exploited
      vulnerability, including general information about the product
      concerned, the nature of the exploitation, and any corrective or
      mitigating measures the manufacturer has taken or recommended.
    status: draft
    control_refs:
      - control.incident_timeline_signals@v1
      - control.cra_submission_templates@v1
    playbook_refs:
      - playbook.vuln_intake@v1
      - playbook.cra_srp_notify@v1
    metric_refs:
      - kpi.cra_notification_72h_on_time@v1
    evidence_stream_refs:
      - vulns

  - id: cra:art-14-final-report
    regulation:
      name: CRA
      instrument: Regulation (EU) 2024/2847
      celex: 32024R2847
      article: "14(2)"
      url: https://eur-lex.europa.eu/eli/reg/2024/2847/oj
    obligation: >-
      Submit a final report no later than 14 days after a corrective or
      mitigating measure becomes available, providing a description of
      the vulnerability, the severity and impact, information on actors
      that have exploited or could exploit the vulnerability, and
      details of the corrective measures.
    status: draft
    control_refs:
      - control.incident_timeline_signals@v1
      - control.cra_submission_templates@v1
    playbook_refs:
      - playbook.post_incident_review@v1
      - playbook.cra_srp_notify@v1
    metric_refs:
      - kpi.cra_final_report_on_time@v1
      - kpi.review_completion_sla@v1
      - kpi.corrective_action_close_rate@v1
    evidence_stream_refs:
      - vulns

  - id: cra:art-14-severe-incident
    regulation:
      name: CRA
      instrument: Regulation (EU) 2024/2847
      celex: 32024R2847
      article: "14(3)"
      url: https://eur-lex.europa.eu/eli/reg/2024/2847/oj
    obligation: >-
      Notify the coordinator CSIRT and ENISA of any severe incident
      having an impact on the security of the product with digital
      elements, with early-warning (24h), notification (72h), and final
      report (1 month) timing analogous to Art. 14(1)–(2).
    status: draft
    control_refs:
      - control.incident_timeline_signals@v1
      - control.cra_submission_templates@v1
    playbook_refs:
      - playbook.ransomware_containment@v1
      - playbook.data_exfil@v1
      - playbook.cra_srp_notify@v1
    metric_refs:
      - kpi.cra_severe_incident_on_time@v1
    evidence_stream_refs:
      - vulns
    notes: >-
      Severe-incident reporting under Art. 14(3) layers on top of the
      same incident-timeline signal set used for NIS2 Art. 23 and DORA
      Art. 19, with a CRA-specific submission template under
      control.cra_submission_templates@v1.

  - id: cra:annex-i-2-codebase-vuln-mgmt
    regulation:
      name: CRA
      instrument: Regulation (EU) 2024/2847
      celex: 32024R2847
      article: Annex I §2(1)(2)(5)(7)
      url: https://eur-lex.europa.eu/eli/reg/2024/2847/oj
    obligation: >-
      Codebase-side vulnerability management for products with digital
      elements: walk the SBOM (Annex I §2(1)) against advisory feeds,
      remediate without delay (Annex I §2(2)), commit to a
      coordinated-vulnerability-disclosure policy (Annex I §2(5)), and
      disseminate security updates throughout the support period (Annex
      I §2(7)).
    status: draft
    control_refs:
      - control.sbom_capture@v1
      - control.vuln_disclosure_intake@v1
    playbook_refs:
      - playbook.codebase_vuln_management@v1
    metric_refs:
      - kpi.vuln_disclosure_sla@v1
      - kri.cvd_intake_aging@v1
      - kri.releases_without_sbom@v1
    evidence_stream_refs:
      - vulns
    notes: >-
      SKELETON: `playbook.codebase_vuln_management@v1` is shipped with
      placeholder action bodies pending the F-WF-07 CORE-FANOUT sibling
      card. This entry is the codebase-side counterpart to the
      reporter-disclosed `cra:annex-i-2-vuln-handling` /
      `cra:annex-i-2-cvd-policy` entries above; the disclosure-window
      surface lands on the per-finding records produced by
      `track-timeline` (see
      content/evidence/codebase_vuln_management/disclosure-timeline-record.schema.json).
      The cross-references on the NIS2 side land under
      `nis2:art-21-2-e-codebase` in mappings/nis2/article-21-2-e.yaml.

  - id: cra:art-14-6-ack-to-reporter
    regulation:
      name: CRA
      instrument: Regulation (EU) 2024/2847
      celex: 32024R2847
      article: "14(6)"
      url: https://eur-lex.europa.eu/eli/reg/2024/2847/oj
    obligation: >-
      Acknowledge receipt of a reported vulnerability to the reporter
      without undue delay, in accordance with the operator's
      documented coordinated-vulnerability-disclosure policy under
      Annex I §2(5). The acknowledgement window is set by the
      operator's CVD policy; ISO/IEC 29147 recommends three working
      days as the community baseline.
    status: draft
    control_refs:
      - control.vuln_disclosure_intake@v1
    playbook_refs:
      - playbook.cra_cvd@v1
    metric_refs:
      - kpi.cvd_ack_sla@v1
    evidence_stream_refs:
      - vulns
    notes: >-
      The ack_to_reporter step of playbook.cra_cvd@v1 is the runtime
      materialisation of this obligation; kpi.cvd_ack_sla@v1 audits
      on-time delivery against the operator's declared CVD-policy
      acknowledgement window. Backlog cases whose ack step never fired
      surface on kri.cvd_intake_aging@v1 so the SLA KPI does not
      silently improve when the acknowledgement pipeline stalls.
