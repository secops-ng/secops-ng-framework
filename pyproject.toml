[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "secops-ng"
version = "0.1.0"
description = "Portable SecOps content (CACAO/OSCAL/D3FEND/OCSF) plus reference compilers to n8n, Temporal, and LangGraph."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "SecOps-NG Contributors" },
]
keywords = [
    "security",
    "secops",
    "cacao",
    "oscal",
    "ocsf",
    "sigma",
    "nis2",
    "sovereignty",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/secops-ng/secops-ng-framework"
Issues = "https://github.com/secops-ng/secops-ng-framework/issues"
Source = "https://github.com/secops-ng/secops-ng-framework"

[tool.hatch.build.targets.wheel]
# No installable Python package yet — content layer ships flat.
# Compiler CLIs will register here as they land.
bypass-selection = true

[tool.hatch.build.targets.sdist]
include = [
    "content",
    "compilers",
    "schemas",
    "tools",
    "docs",
    "examples",
    "scripts",
    "README.md",
    "LICENSE",
    "CONTRIBUTING.md",
    "SECURITY.md",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "ASYNC"]
ignore = ["S101"]  # allow asserts in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_return_any = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# ``importlib`` lets per-target golden tests share the basename
# ``test_golden.py`` under hyphenated directories
# (e.g. ``tests/examples/{n8n,langgraph,temporal}/vuln_intake/...``)
# without colliding on module name. The hyphen rules out ``__init__.py``
# packaging — those dir names are not valid Python identifiers.
addopts = "--import-mode=importlib"
