playbook_variables:
  __reconciliation_window__:
    type: string
    description: >-
      Identifier of the reconciliation window this run discharges
      (scheduled-cadence reference, on-demand reconciliation
      reference, or operator-initiated trigger). Names which
      posture cohort the run reconciled against; the wall-clock
      instant lives on the evidence record itself.
    external: true
  __segment_inventory_id__:
    type: string
    description: >-
      Identifier of the reconciled segment-inventory the
      inventory step composed from the operator's documented
      network-inventory sources (declarative infrastructure-as-
      code records, cloud-provider VPC/subnet APIs, on-premise
      network-controller inventories). Consumed downstream by the
      policy-evaluation and violation-detection steps.
    external: false
  __policy_snapshot_id__:
    type: string
    description: >-
      Identifier of the segmentation-policy snapshot the
      policy-evaluation step read from the operator's documented
      policy source (declared zone-transit matrix, per-segment
      allowance set). The pinned snapshot lets the evidence
      artifact identify which policy revision the reconciliation
      was run against.
    external: false
  __violation_set_id__:
    type: string
    description: >-
      Identifier of the per-violation set the detect step emits
      against the segment-inventory / policy-snapshot pair. Each
      violation carries a segment-pair identifier, an observed-
      reachability marker, a policy-allowance marker, and a
      classification token (undocumented-transit, unauthorised-
      egress, boundary-control-drift). The set may be empty (no
      violation against the current window) — the empty case is
      still emitted explicitly so the audit-evident chain is
      closed.
    external: false
  __remediation_action_id__:
    type: string
    description: >-
      Identifier of the engaged remediation action against the
      operator's pre-bound remediation surface (per-segment ACL /
      firewall-rule change, boundary-control posture-change
      ticket, or short-circuit isolation of the offending path).
      Empty when __violation_set_id__ resolved empty. Always
      populated when there is at least one violation, including
      on the short-circuit branch.
    external: false
  __posture_evidence_id__:
    type: string
    description: >-
      Identifier of the dated network-security-posture evidence
      artifact the generate step published to the operator's
      evidence store. Always populated, including on the
      empty-violation-set branch — the closure record is the
      audit-evident output that names the segment inventory, the
      policy snapshot, the violation set, and the remediation
      action for the reconciliation window.
    external: false
workflow_start: start--7e750001-0000-4000-8000-000000000001
workflow:
  start--7e750001-0000-4000-8000-000000000001:
    type: start
    name: netsec_posture_start
    on_completion: action--7e750001-0000-4000-8000-000000000002
  action--7e750001-0000-4000-8000-000000000002:
    type: action
    name: inventory_network_segments
    description: >-
      Enumerate the documented network segments on the operator's
      own deployed estate by reading the operator's declared
      network-inventory sources under the operator's documented
      source-precedence ordering: declarative infrastructure-as-
      code records for VLAN / VPC / subnet / zone definitions, the
      cloud-provider network APIs (VPC / subnet describe endpoints
      keyed off the operator's account inventory), and the on-
      premise network-controller inventories. Read-only against
      each source. Composes the operator-authoritative segment
      record list under a canonical, source-precedence-ordered
      hash and pins __segment_inventory_id__ against the composed
      snapshot; the deterministic derivation lets replays of the
      same reconciliation window recover the same inventory
      identifier without re-hitting the sources. Each segment
      record carries the zone identifier, the cloud/on-premise
      account or controller binding, the CIDR / IP-plan
      allocation, and the tenancy label the policy-evaluation
      step reads. OCSF Network Activity (class_uid 4001) shape:
      an inventory-composed event is emitted at snapshot pinning
      naming __reconciliation_window__ and __segment_inventory_id__
      for the audit-evident chain.
    on_completion: action--7e750001-0000-4000-8000-000000000003
    in_args:
      - __reconciliation_window__
    out_args:
      - __segment_inventory_id__
    agent_target: netsec_posture_worker
    x_secops_ng:
      control_refs:
        - control.network_boundary_protection@v1
      telemetry_refs:
        - telemetry.ocsf.network_activity@v1
  action--7e750001-0000-4000-8000-000000000003:
    type: action
    name: evaluate_segmentation_policy
    description: >-
      Read the current segmentation-policy snapshot from the
      operator's documented policy source (declared zone-transit
      matrix, per-segment allowance set, OSCAL-anchored control
      binding for SC-7 boundary-protection and SC-3 security-
      function isolation) and normalise it against the segment
      inventory pinned upstream. Pins __policy_snapshot_id__
      against the resolved revision so the evidence artifact
      identifies which policy the reconciliation ran against.
      Records the per-segment-pair allowance state under the
      documented three-value allowance algebra (allowed / denied /
      conditional) — the conditional branch names the predicate
      the detect step must evaluate against observed reachability
      before deciding whether a per-pair violation stands. Empty
      allowance set is emitted explicitly so a policy-missing
      reconciliation window still closes with an audit-evident
      artifact rather than short-circuiting the chain silently.
    on_completion: action--7e750001-0000-4000-8000-000000000004
    in_args:
      - __reconciliation_window__
      - __segment_inventory_id__
    out_args:
      - __policy_snapshot_id__
    agent_target: netsec_posture_worker
    x_secops_ng:
      control_refs:
        - control.network_boundary_protection@v1
      telemetry_refs:
        - telemetry.ocsf.network_activity@v1
  action--7e750001-0000-4000-8000-000000000004:
    type: action
    name: detect_policy_violations
    description: >-
      Compute the per-segment-pair violation set by comparing the
      observed reachability posture against the policy-snapshot
      allowance state. Observed reachability is drawn from the
      operator's documented telemetry sources under the
      documented source-precedence: network-traffic observations
      (OCSF Network Activity 4001 events emitted by the
      operator's flow-log stream), boundary-control state pulled
      from the operator's firewall / security-group inventory,
      and active reachability probes where the operator's
      documented probe surface is bound. Each per-pair evaluation
      resolves to allowed-and-observed (no violation), denied-
      and-not-observed (no violation, evidence recorded),
      denied-and-observed (violation emitted), or conditional
      (predicate evaluated against the observed traffic
      fingerprint before deciding). Violations are classified
      against the documented taxonomy — undocumented-transit
      (traffic across a segment-pair not in the allowance set),
      unauthorised-egress (traffic to a boundary the policy
      denies), boundary-control-drift (the firewall / security-
      group state diverged from the declared zone-transit
      matrix) — and pinned to __violation_set_id__. The set is
      keyed against __segment_inventory_id__ + __policy_snapshot_id__
      so the same inputs re-emit the same violation identifiers
      under replay. D3FEND anchor: D3-NTA (network traffic
      analysis) — the detect step is the operator-side
      network-traffic analysis primitive against the declared
      policy. Empty set is emitted explicitly so a clean-window
      reconciliation is distinguishable from a skipped step.
    on_completion: action--7e750001-0000-4000-8000-000000000005
    in_args:
      - __segment_inventory_id__
      - __policy_snapshot_id__
    out_args:
      - __violation_set_id__
    agent_target: netsec_posture_worker
    x_secops_ng:
      control_refs:
        - control.network_boundary_protection@v1
      telemetry_refs:
        - telemetry.ocsf.network_activity@v1
  action--7e750001-0000-4000-8000-000000000005:
    type: action
    name: enforce_remediation
    description: >-
      Engage the operator's pre-bound remediation surface against
      each violation in __violation_set_id__ per the operator's
      documented per-classification remediation binding. Three
      documented surfaces: (a) per-segment ACL / firewall-rule
      change dispatched against the operator's change-management
      posture (undocumented-transit and unauthorised-egress
      classifications default here), (b) boundary-control
      posture-change ticket opened against the operator's
      documented ticketing surface (boundary-control-drift
      classification defaults here), (c) short-circuit isolation
      of the offending path where the violation's severity marker
      names an active-abuse fingerprint and the operator's
      documented isolation posture allows automated engagement.
      Empty when __violation_set_id__ resolved empty; the closure
      record still names the empty set so the audit-evident
      chain remains complete. Each engaged action returns a
      persistent identifier (change-ticket id, posture-change-
      ticket id, or isolation-record id) that the evidence
      artifact binds under __remediation_action_id__ together
      with a per-violation dispatch table naming which surface
      was engaged against which violation. The playbook does not
      author the remediation architecture — it dispatches
      against pre-bound surfaces the operator's change-
      management posture already documents; auditability is
      preserved by requiring every engaged action to return an
      operator-side persistent identifier before the step closes.
    on_completion: action--7e750001-0000-4000-8000-000000000006
    in_args:
      - __violation_set_id__
    out_args:
      - __remediation_action_id__
    agent_target: netsec_posture_worker
    x_secops_ng:
      control_refs:
        - control.network_boundary_protection@v1
      telemetry_refs:
        - telemetry.ocsf.network_activity@v1
  action--7e750001-0000-4000-8000-000000000006:
    type: action
    name: generate_posture_evidence_artifact
    description: >-
      Publish the dated network-security-posture evidence artifact
      to the operator's evidence store. The artifact is shaped
      against an OSCAL Assessment Result stub: the assessed
      subject is the reconciled segment inventory pinned by
      __segment_inventory_id__, the assessment activity is the
      policy-reconciliation run keyed by __reconciliation_window__
      against __policy_snapshot_id__, the finding set carries one
      finding per violation in __violation_set_id__ (or an
      explicit no-findings marker when the set is empty), and the
      response record binds each finding to the engaged
      remediation action from __remediation_action_id__. The
      artifact closes the audit-evident chain end-to-end for the
      window: an auditor reading the record can trace from
      window identifier through inventory, policy, violation set,
      and remediation dispatch to the operator-side persistent
      identifier the remediation surface returned. Pins
      __posture_evidence_id__ against the persisted record.
      Always emitted, including on the empty-violation-set
      branch — the closure record is the primary audit-evident
      output of the reconciliation regardless of whether any
      violation was surfaced.
    on_completion: end--7e750001-0000-4000-8000-000000000007
    in_args:
      - __reconciliation_window__
      - __segment_inventory_id__
      - __policy_snapshot_id__
      - __violation_set_id__
      - __remediation_action_id__
    out_args:
      - __posture_evidence_id__
    agent_target: netsec_posture_worker
    x_secops_ng:
      control_refs:
        - control.network_boundary_protection@v1
      telemetry_refs:
        - telemetry.ocsf.network_activity@v1
  end--7e750001-0000-4000-8000-000000000007:
    type: end
    name: netsec_posture_end
