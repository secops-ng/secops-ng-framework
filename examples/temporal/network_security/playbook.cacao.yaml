type: playbook
spec_version: "cacao-2.0"
id: playbook--7e750001-0000-4000-8000-000000000001
name: Network security and segmentation posture
description: >-
  CACAO v2 playbook operationalising the per-window reconciliation of a
  declared segmentation policy against the observed network-boundary
  state on the operator's own deployed estate. Anchored to NIS2
  Article 21(2)(e) (security in network and information systems) and
  to DORA Article 9 read against the JC RTS on ICT risk management
  framework (Commission Delegated Regulation (EU) 2024/1774) network-
  security articles. The lifecycle enumerates documented network
  segments from the operator's declarative network-inventory sources,
  evaluates the segmentation-policy allowances against the observed
  per-segment reachability posture, detects policy violations
  (undocumented cross-segment reachability, unauthorised egress
  paths, boundary-control drift against the declared zone-transit
  matrix), engages the operator's pre-bound remediation surface
  against each violation, and generates a dated network-security-
  posture evidence artifact for the reconciliation window. The
  playbook does not author the operator's segmentation policy or the
  segmentation architecture itself; it operationalises a documented
  reconciliation posture against pre-bound segmentation sources and
  pre-bound remediation surfaces. Distinct from
  playbook.infra_posture_management@v1 which is the broader
  infrastructure-posture (host, workload, IAM) reconciliation
  engine; this playbook is the network-boundary limb only.
playbook_types:
  - investigation
  - remediation
created_by: identity--5a509a09-5a50-45a5-85a5-095a509a509a
created: "2026-07-10T00:00:00Z"
modified: "2026-11-11T00:00:00Z"
valid_from: "2026-07-10T00:00:00Z"
labels:
  - nis2
  - article-21-2-e
  - dora
  - article-9
  - network-security
  - segmentation
  - boundary-protection
  - zone-transit
  - posture-management
external_references:
  - name: OASIS CACAO v2.0
    description: >-
      Workflow step types (start, action, end), variable
      conventions, x_ extension namespace.
    source: OASIS Open
  - name: >-
      NIS2 Directive (EU) 2022/2555 — Article 21(2)(e) security in
