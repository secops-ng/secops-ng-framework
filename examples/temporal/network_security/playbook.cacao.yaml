    source: Official Journal of the European Union
    url: https://eur-lex.europa.eu/eli/dir/2022/2555/oj
  - name: >-
      DORA Regulation (EU) 2022/2554 — Article 9 protection and
      prevention (ICT security tools, policies and procedures)
    source: Official Journal of the European Union
    url: https://eur-lex.europa.eu/eli/reg/2022/2554/oj
  - name: >-
      Commission Delegated Regulation (EU) 2024/1774 — JC RTS on ICT
      risk management framework, network-security articles
    source: Official Journal of the European Union
    url: https://eur-lex.europa.eu/eli/reg_del/2024/1774/oj
  - name: >-
      OCSF v1.3.0 — Network Activity (4001) event class
    source: OCSF
playbook_variables:
  __reconciliation_window__:
    type: string
    description: >-
      Identifier of the reconciliation window this run discharges
      (scheduled-cadence reference, on-demand reconciliation
      reference, or operator-initiated trigger). The trigger
      input; the wall-clock instants live on the step records.
    external: true
  __inventory_sources__:
    type: string
    description: >-
      The network-inventory sources as a JSON list (CACAO has no
      list type), highest precedence first: each with its
      reference, its kind (declarative, provider_api or
      controller) and its segments, each segment with its zone,
      binding, address ranges, tenancy and whether it supports a
      critical or important function.
    external: true
  __inventory_composed_at__:
    type: string
    description: >-
      Zulu instant (YYYY-MM-DDTHH:MM:SSZ) of inventory
      composition.
    external: true
  __segment_inventory__:
    type: dictionary
    description: >-
      Envelope inventory_network_segments emits: the segments, the
      undocumented ones, source disagreements and overlapping
      ranges. __segment_inventory_id__ is extracted from it.
    external: false
  __segment_inventory_id__:
    type: string
    description: >-
      Identifier of the reconciled segment inventory, extracted
      from __segment_inventory__. It replays for the same window
      and sources.
    external: false
  __segmentation_policy__:
    type: dictionary
    description: >-
      The operator's segmentation policy: its reference and
      revision, the internal and external zones, the
      administration zone, and the zone-transit matrix with each
      transit allowed, denied or conditional on services or a
      time-boxed authorisation.
    external: true
  __policy_evaluated_at__:
    type: string
    description: >-
      Zulu instant (YYYY-MM-DDTHH:MM:SSZ) of policy evaluation.
    external: true
  __policy_evaluation__:
    type: dictionary
    description: >-
      Envelope evaluate_segmentation_policy emits: the normalised
      matrix and the policy's own gaps. __policy_snapshot_id__ is
      extracted from it.
    external: false
  __policy_snapshot_id__:
    type: string
    description: >-
      Identifier of the pinned policy snapshot, extracted from
      __policy_evaluation__, so the evidence names the policy
      revision the window was reconciled against.
    external: false
  __observed_transits__:
    type: string
    description: >-
      The window's observed transits as a JSON list, from the
      flow-log stream or reachability probes: each with its source
      and destination, service, first and last sighting, origin
      and any active-abuse fingerprint.
    external: true
  __boundary_rules__:
    type: string
    description: >-
      The boundary-control rules in force as a JSON list: each
      with its control, zone pair, service (or any) and whether it
      permits the transit.
    external: true
  __violations_detected_at__:
    type: string
    description: >-
      Zulu instant (YYYY-MM-DDTHH:MM:SSZ) of violation detection.
    external: true
  __violation_detection__:
    type: dictionary
    description: >-
      Envelope detect_policy_violations emits: every violation
      with its classification, and the compliant observation
      count. The set may be empty. __violation_set_id__ is
      extracted from it.
    external: false
  __violation_set_id__:
    type: string
    description: >-
      Identifier of the window's violation set, extracted from
      __violation_detection__. An empty set has an identifier too,
      so the audit-evident chain stays closed.
    external: false
  __remediation_binding__:
    type: dictionary
    description: >-
      The remediation surface per classification, each acl_change
      or posture_ticket. Defaults to the playbook's
      DEFAULT_BINDING: rule changes for undocumented transit and
      unauthorised egress, a posture ticket for boundary-control
      drift. CACAO carries the default as JSON text; the adapter
      decodes it.
    value: '{"undocumented_transit":"acl_change","unauthorised_egress":"acl_change","boundary_control_drift":"posture_ticket"}'
    external: true
  __automated_isolation_allowed__:
    type: boolean
    description: >-
      Whether the operator's isolation posture allows automated
      isolation of a path carrying an active-abuse fingerprint. A
      real boolean; isolation is never the default.
    external: true
  __remediation_dispatches__:
    type: string
    description: >-
      One dispatch per violation as a JSON list, each with the
      violation, the surface and the persistent identifier that
      surface returned. Empty when the violation set is.
    external: true
  __remediation_dispatched_at__:
    type: string
    description: >-
      Zulu instant (YYYY-MM-DDTHH:MM:SSZ) the remediation step
      closed.
    external: true
  __remediation_dispatch__:
    type: dictionary
    description: >-
      Envelope enforce_remediation emits: the binding applied and
      the dispatch table. __remediation_action_id__ is extracted
      from it.
    external: false
  __remediation_action_id__:
    type: string
    description: >-
      Identifier of the remediation dispatch, extracted from
      __remediation_dispatch__. Unset when the violation set is
      empty: nothing was dispatched.
    external: false
  __evidence_produced_at__:
    type: string
    description: >-
      Zulu instant (YYYY-MM-DDTHH:MM:SSZ) the posture evidence is
      published.
    external: true
  __posture_evidence__:
    type: dictionary
    description: >-
      Envelope generate_posture_evidence_artifact emits, shaped
      after an OSCAL assessment result: one finding per violation
      with its action, no_findings for an empty window, and the
      open items carried forward. __posture_evidence_id__ is
      extracted from it.
    external: false
  __posture_evidence_id__:
    type: string
    description: >-
      Identifier of the dated posture evidence for the window,
      extracted from __posture_evidence__. Always set, including
      on an empty window.
    external: false
agent_definitions:
  group--9479ad47-df96-5a3c-831a-f668158e5b9e:
    type: group
    name: Security operations team
workflow_start: start--7e750001-0000-4000-8000-000000000001
workflow:
  start--7e750001-0000-4000-8000-000000000001:
    type: start
    name: netsec_posture_start
    on_completion: action--7e750001-0000-4000-8000-000000000002
  action--7e750001-0000-4000-8000-000000000002:
    type: action
    name: inventory_network_segments
    description: >-
      Compose the window's segment inventory from the operator's
      network-inventory sources in its documented precedence
      order: infrastructure-as-code records, cloud-provider
      network APIs and on-premise network controllers, read-only.
      Where two sources report the same segment the higher one's
      record is kept and every field a lower one disagrees on is
      recorded. A segment no declarative source reports is in the
      estate but not in the documentation, and is listed as
      undocumented; overlapping ranges inside one binding are
      listed too. Produces __segment_inventory__, from which
      __segment_inventory_id__ is extracted.
    on_completion: action--7e750001-0000-4000-8000-000000000003
    in_args:
      - __reconciliation_window__
      - __inventory_sources__
      - __inventory_composed_at__
    out_args:
      - __segment_inventory__
      - __segment_inventory_id__
    agent_target: netsec_posture_worker
    agent: group--9479ad47-df96-5a3c-831a-f668158e5b9e
    commands:
      - type: secops-ng-primitive
        command: content.playbooks.network_security.primitives.inventory.compose_segment_inventory
    step_extensions:
      extension-definition--4f4cc5db-ab05-5939-b7af-58a7082d081a:
        control_refs:
          - control.network_boundary_protection@v1
        telemetry_refs:
          - telemetry.ocsf.network_activity@v1
        core_body:
          primitive: content.playbooks.network_security.primitives.inventory.compose_segment_inventory
          in:
            window_ref: __reconciliation_window__
            sources: __inventory_sources__
            composed_at: __inventory_composed_at__
          out: __segment_inventory__
  action--7e750001-0000-4000-8000-000000000003:
    type: action
    name: evaluate_segmentation_policy
    description: >-
      Normalise the operator's zone-transit matrix against the
      inventory and pin the snapshot the window is reconciled
      against. Every directed zone pair is allowed, denied, or
      conditional on services or a time-boxed authorisation; every
      pair the matrix does not list is denied, within a zone as
      well as between zones (Commission Implementing Regulation
      (EU) 2024/2690, Annex points 6.7.2(c) and 6.8.2(e)). The
      policy's own gaps are recorded. Produces
      __policy_evaluation__, from which __policy_snapshot_id__ is
      extracted.
    on_completion: action--7e750001-0000-4000-8000-000000000004
    in_args:
      - __segment_inventory__
      - __segmentation_policy__
      - __policy_evaluated_at__
    out_args:
      - __policy_evaluation__
      - __policy_snapshot_id__
    agent_target: netsec_posture_worker
    agent: group--9479ad47-df96-5a3c-831a-f668158e5b9e
    commands:
      - type: secops-ng-primitive
        command: content.playbooks.network_security.primitives.policy.evaluate_segmentation_policy
    step_extensions:
      extension-definition--4f4cc5db-ab05-5939-b7af-58a7082d081a:
        control_refs:
          - control.network_boundary_protection@v1
        telemetry_refs:
          - telemetry.ocsf.network_activity@v1
        core_body:
          primitive: content.playbooks.network_security.primitives.policy.evaluate_segmentation_policy
          in:
            inventory: __segment_inventory__
            policy: __segmentation_policy__
            evaluated_at: __policy_evaluated_at__
          out: __policy_evaluation__
  action--7e750001-0000-4000-8000-000000000004:
    type: action
    name: detect_policy_violations
    description: >-
      Compare the observed transits and the boundary rules in
      force against the pinned matrix. An observed transit outside
      it is unauthorised_egress when the destination is an
      external zone and undocumented_transit otherwise; a
      conditional allowance holds only for its services and inside
      its authorisation window. A boundary rule that permits what
      the matrix denies or does not list, or denies what it
      plainly allows, is boundary_control_drift, recorded with its
      direction whether or not traffic was seen. Repeated
      sightings merge into one violation. The set may be empty.
      Produces __violation_detection__, from which
      __violation_set_id__ is extracted.
    on_completion: action--7e750001-0000-4000-8000-000000000005
    in_args:
      - __segment_inventory__
      - __policy_evaluation__
      - __observed_transits__
      - __boundary_rules__
      - __violations_detected_at__
    out_args:
      - __violation_detection__
      - __violation_set_id__
    agent_target: netsec_posture_worker
    agent: group--9479ad47-df96-5a3c-831a-f668158e5b9e
    commands:
      - type: secops-ng-primitive
        command: content.playbooks.network_security.primitives.detection.detect_policy_violations
    step_extensions:
      extension-definition--4f4cc5db-ab05-5939-b7af-58a7082d081a:
        control_refs:
          - control.network_boundary_protection@v1
        telemetry_refs:
          - telemetry.ocsf.network_activity@v1
        core_body:
          primitive: content.playbooks.network_security.primitives.detection.detect_policy_violations
          in:
            inventory: __segment_inventory__
            policy: __policy_evaluation__
            observations: __observed_transits__
            boundary_rules: __boundary_rules__
            detected_at: __violations_detected_at__
          out: __violation_detection__
  action--7e750001-0000-4000-8000-000000000005:
    type: action
    name: enforce_remediation
    description: >-
      Record the dispatch of every violation to the operator's
      pre-bound remediation surface: a rule change or a posture
      ticket per the binding. Isolation is the short-circuit,
      never the default: only a violation carrying an active-abuse
      fingerprint, and only when the operator's posture allows
      automated isolation (Delegated Regulation (EU) 2024/1774,
      Art. 13). The step closes only when every dispatch has
      returned a persistent identifier. It runs on every window;
      with an empty violation set it dispatches nothing. Produces
      __remediation_dispatch__, from which
      __remediation_action_id__ is extracted, unset when nothing
      was dispatched.
    on_completion: action--7e750001-0000-4000-8000-000000000006
    in_args:
      - __violation_detection__
      - __remediation_binding__
      - __automated_isolation_allowed__
      - __remediation_dispatches__
      - __remediation_dispatched_at__
    out_args:
      - __remediation_dispatch__
      - __remediation_action_id__
    agent_target: netsec_posture_worker
    agent: group--9479ad47-df96-5a3c-831a-f668158e5b9e
    commands:
      - type: secops-ng-primitive
        command: content.playbooks.network_security.primitives.remediation.dispatch_remediation
    step_extensions:
      extension-definition--4f4cc5db-ab05-5939-b7af-58a7082d081a:
        control_refs:
          - control.network_boundary_protection@v1
        telemetry_refs:
          - telemetry.ocsf.network_activity@v1
        core_body:
          primitive: content.playbooks.network_security.primitives.remediation.dispatch_remediation
          in:
            detection: __violation_detection__
            binding: __remediation_binding__
            automated_isolation: __automated_isolation_allowed__
            dispatches: __remediation_dispatches__
            dispatched_at: __remediation_dispatched_at__
          out: __remediation_dispatch__
  action--7e750001-0000-4000-8000-000000000006:
    type: action
    name: generate_posture_evidence_artifact
    description: >-
      Compose the dated posture evidence for the window, shaped
      after an OSCAL assessment result. The chain is checked: the
      policy evaluation must be of this inventory, the detection
      of this inventory and snapshot, and the dispatch of this
      violation set; a record from another window is refused.
      Every finding names its surface and the identifier the
      surface returned; an empty window says no_findings.
      Undocumented segments, source disagreements and the policy's
      own gaps are carried as open items. Produces
      __posture_evidence__, from which __posture_evidence_id__ is
      extracted.
    on_completion: end--7e750001-0000-4000-8000-000000000007
    in_args:
      - __segment_inventory__
      - __policy_evaluation__
      - __violation_detection__
      - __remediation_dispatch__
      - __evidence_produced_at__
    out_args:
      - __posture_evidence__
      - __posture_evidence_id__
    agent_target: netsec_posture_worker
    agent: group--9479ad47-df96-5a3c-831a-f668158e5b9e
    commands:
      - type: secops-ng-primitive
        command: content.playbooks.network_security.primitives.evidence.compose_posture_evidence
    step_extensions:
      extension-definition--4f4cc5db-ab05-5939-b7af-58a7082d081a:
        control_refs:
          - control.network_boundary_protection@v1
        telemetry_refs:
          - telemetry.ocsf.network_activity@v1
        core_body:
          primitive: content.playbooks.network_security.primitives.evidence.compose_posture_evidence
          in:
            inventory: __segment_inventory__
            policy: __policy_evaluation__
            detection: __violation_detection__
            remediation: __remediation_dispatch__
            produced_at: __evidence_produced_at__
          out: __posture_evidence__
  end--7e750001-0000-4000-8000-000000000007:
    type: end
    name: netsec_posture_end
