<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 297" preserveAspectRatio="xMidYMid slice">
  <!-- SecOps-NG cover art: dark sovereign-EU graph/network motif.
       Pure SVG, no fonts, no rasters; renders identically across Weasy/PDF. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="80%">
      <stop offset="0%" stop-color="#142046"/>
      <stop offset="55%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#05080f"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#003399" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffcc00" stop-opacity="0.35"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffcc00" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffcc00" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="210" height="297" fill="url(#bg)"/>

  <!-- subtle grid -->
  <g stroke="#1a2747" stroke-width="0.15" opacity="0.6">
    <path d="M0 50 H210 M0 100 H210 M0 150 H210 M0 200 H210 M0 250 H210"/>
    <path d="M30 0 V297 M60 0 V297 M90 0 V297 M120 0 V297 M150 0 V297 M180 0 V297"/>
  </g>

  <!-- EU ring of 12 stars, dimmed -->
  <g fill="#ffcc00" opacity="0.22" transform="translate(105 70)">
    <g id="star">
      <polygon points="0,-4 1.2,-1.3 4,-1.2 1.7,0.5 2.5,3.3 0,1.7 -2.5,3.3 -1.7,0.5 -4,-1.2 -1.2,-1.3"/>
    </g>
    <use href="#star" transform="translate(0 -28)"/>
    <use href="#star" transform="rotate(30) translate(0 -28)"/>
    <use href="#star" transform="rotate(60) translate(0 -28)"/>
    <use href="#star" transform="rotate(90) translate(0 -28)"/>
    <use href="#star" transform="rotate(120) translate(0 -28)"/>
    <use href="#star" transform="rotate(150) translate(0 -28)"/>
    <use href="#star" transform="rotate(180) translate(0 -28)"/>
    <use href="#star" transform="rotate(210) translate(0 -28)"/>
    <use href="#star" transform="rotate(240) translate(0 -28)"/>
    <use href="#star" transform="rotate(270) translate(0 -28)"/>
    <use href="#star" transform="rotate(300) translate(0 -28)"/>
    <use href="#star" transform="rotate(330) translate(0 -28)"/>
  </g>

  <!-- network graph -->
  <g stroke="url(#line)" stroke-width="0.35" fill="none" opacity="0.85">
    <path d="M30 220 L70 180 L120 210 L160 175 L195 215"/>
    <path d="M30 220 L55 250 L100 240 L155 255 L195 245"/>
    <path d="M70 180 L100 240"/>
    <path d="M120 210 L155 255"/>
    <path d="M160 175 L120 210"/>
    <path d="M55 250 L70 180"/>
    <path d="M100 240 L160 175"/>
  </g>

  <!-- nodes -->
  <g>
    <g transform="translate(30 220)">
      <circle r="6" fill="url(#glow)"/>
      <circle r="2.2" fill="#ffcc00"/>
    </g>
    <g transform="translate(70 180)">
      <circle r="6" fill="url(#glow)"/>
      <circle r="2.2" fill="#4dbef7"/>
    </g>
    <g transform="translate(120 210)">
      <circle r="6" fill="url(#glow)"/>
      <circle r="2.2" fill="#ffcc00"/>
    </g>
    <g transform="translate(160 175)">
      <circle r="6" fill="url(#glow)"/>
      <circle r="2.2" fill="#4dbef7"/>
    </g>
    <g transform="translate(195 215)">
      <circle r="5" fill="url(#glow)"/>
      <circle r="1.8" fill="#ffcc00"/>
    </g>
    <g transform="translate(55 250)">
      <circle r="5" fill="url(#glow)"/>
      <circle r="1.8" fill="#4dbef7"/>
    </g>
    <g transform="translate(100 240)">
      <circle r="6" fill="url(#glow)"/>
      <circle r="2.4" fill="#ffcc00"/>
    </g>
    <g transform="translate(155 255)">
      <circle r="5" fill="url(#glow)"/>
      <circle r="1.8" fill="#4dbef7"/>
    </g>
    <g transform="translate(195 245)">
      <circle r="5" fill="url(#glow)"/>
      <circle r="1.8" fill="#ffcc00"/>
    </g>
  </g>

  <!-- bottom horizon glow -->
  <rect x="0" y="265" width="210" height="32" fill="url(#bg)" opacity="0.0"/>
  <rect x="0" y="278" width="210" height="0.4" fill="#ffcc00" opacity="0.5"/>
</svg>
