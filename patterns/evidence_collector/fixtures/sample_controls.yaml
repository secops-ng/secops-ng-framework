# Sample control set for the evidence-collector pattern.
#
# Labels are deliberately generic — `workload-a`, `workload-b`, ... — to
# keep this fixture safe in the will-be-public repo. Replace with your
# real control inventory when you adopt this pattern downstream.

controls:
  - control_id: workload-a-access-review
    description: Quarterly access review for workload-a admins
  - control_id: workload-b-log-retention
    description: Log retention attestation for workload-b
  - control_id: workload-c-encryption-posture
    description: At-rest encryption posture snapshot for workload-c
