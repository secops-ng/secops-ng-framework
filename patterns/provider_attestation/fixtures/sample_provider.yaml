# Sample sovereign provider snapshot for the provider-attestation pattern.
#
# Labels are deliberately generic — `eu-provider-alpha`, `region-eu-west`,
# `iso-27001` — to keep this fixture safe in the will-be-public repo.
# Replace with your real provider KB entry when you adopt this pattern
# downstream.
#
# Schema:
#   provider_id: stable identifier
#   region:     where the provider operates
#   criteria:   map of criterion_id -> bool (current observed state)
#               True  = criterion satisfied this cycle
#               False = criterion failing this cycle

provider_id: eu-provider-alpha
region: region-eu-west
criteria:
  iso-27001: true
  data-residency-eu: true
  encryption-at-rest: true
  dpa-signed: true
